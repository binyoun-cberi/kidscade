<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eadf">
  <title>Kidscade Avatar Studio</title>
  <link rel="stylesheet" href="avatar-pixel-studio.css?v=3">
</head>
<body>
  <main class="studio-shell">
    <header class="studio-head">
      <div>
        <span class="eyebrow">KIDSCade AVATAR · v3</span>
        <h1>내 캐릭터 꾸미기</h1>
        <p>새 23프레임 캐릭터와 승인된 파츠만 사용해요.</p>
      </div>
      <div class="head-actions">
        <span id="seedBadge" class="seed-badge" hidden></span>
        <button id="saveBtn" class="save-btn" type="button">저장하기</button>
      </div>
    </header>

    <section class="studio-grid">
      <aside class="preview-panel">
        <div class="preview-card">
          <div class="preview-title">
            <strong>내 캐릭터</strong>
            <span id="styleSummary">학교 탐험가 기본 세트</span>
          </div>
          <div class="stage">
            <div class="stage-glow"></div>
            <canvas id="avatarCanvas" width="128" height="128" aria-label="내 캐릭터 미리보기"></canvas>
            <div class="floor-shadow"></div>
          </div>
          <div id="motionControls" class="motion-controls" role="group" aria-label="캐릭터 동작 미리보기">
            <button class="motion-btn active" data-motion="static" type="button" aria-pressed="true">서기</button>
            <button class="motion-btn" data-motion="walk" type="button" aria-pressed="false">걷기</button>
            <button class="motion-btn" data-motion="jump" type="button" aria-pressed="false">점프</button>
            <button class="motion-btn" data-motion="attack" type="button" aria-pressed="false">공격</button>
            <button class="motion-btn" data-motion="hurt" type="button" aria-pressed="false">피격</button>
            <button class="motion-btn" data-motion="dead" type="button" aria-pressed="false">쓰러짐</button>
            <button class="motion-btn" data-motion="sit" type="button" aria-pressed="false">앉기</button>
            <button class="motion-btn" data-motion="pickup" type="button" aria-pressed="false">줍기</button>
          </div>
          <div class="preview-actions">
            <button id="resetBtn" class="soft-btn full" type="button">기본 캐릭터로</button>
          </div>
        </div>
        <div class="tip-card">
          <strong>새 아바타 시스템</strong>
          <span>BODY와 23프레임 동작 규격은 고정하고, 검수된 파츠만 슬롯별로 추가합니다.</span>
        </div>
      </aside>

      <section class="picker-panel">
        <nav id="tabs" class="tabs" aria-label="꾸미기 종류">
          <button class="tab active" data-tab="hair" type="button">헤어</button>
          <button class="tab" data-tab="eyes" type="button">눈</button>
          <button class="tab" data-tab="mouth" type="button">입</button>
          <button class="tab" data-tab="earring" type="button">귀걸이</button>
          <button class="tab" data-tab="upper" type="button">상의</button>
          <button class="tab" data-tab="lower" type="button">하의</button>
          <button class="tab" data-tab="shoes" type="button">신발</button>
          <button class="tab" data-tab="weapon" type="button">무기</button>
          <button class="tab" data-tab="shield" type="button">보조장비</button>
        </nav>

        <div id="hairFilter" class="hair-filter" hidden aria-hidden="true"></div>

        <div class="picker-head">
          <div>
            <strong id="pickerTitle">더벅머리</strong>
            <span id="pickerCount">기본 제공 1종</span>
          </div>
          <span class="all-open">v3 승인 파츠만 표시</span>
        </div>

        <div id="optionGrid" class="option-grid" aria-live="polite"></div>
      </section>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite">저장했어요!</div>
  </main>
  <script src="assets/game/characters/kidscade-avatar-v3/runtime/school-avatar-runtime.js"></script>
  <script src="assets/game/characters/kidscade-avatar-v3/runtime/avatar-school-studio.js"></script>
</body>
</html>
