<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>마춤뻡 뀌주</title>
<style>
:root{--bg1:#eef2ff;--bg2:#faf5ff;--ink:#172033;--muted:#64748b;--blue:#3b82f6;--green:#16a34a;--red:#ef4444;--orange:#f97316;--card:#fff;--line:#e2e8f0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#fff 0,#f4f0ff 35%,#e8f2ff 100%);overflow-x:hidden}
button,select{font:inherit}.hidden{display:none!important}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(94vw,520px);background:rgba(255,255,255,.93);border:2px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 24px 70px rgba(76,81,191,.15);padding:24px}
.logo{font-size:clamp(36px,9vw,58px);font-weight:1000;letter-spacing:-3px;text-align:center;color:#3b82f6;margin:0}
.subtitle{text-align:center;color:var(--muted);margin:8px 0 18px}.title-note{text-align:center;font-size:13px;color:#7c3aed;font-weight:800;min-height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.chip{border:0;border-radius:999px;background:#eef2ff;color:#475569;padding:9px 13px;font-weight:800;cursor:pointer}.chip.active{background:#3b82f6;color:#fff}
.setting{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}.setting label{font-size:13px;color:var(--muted);font-weight:900;display:block;margin-bottom:8px}.setting select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff;color:var(--ink)}
.primary{width:100%;border:0;border-radius:18px;padding:17px;background:linear-gradient(#60a5fa,#2563eb);color:#fff;font-size:22px;font-weight:1000;box-shadow:0 6px 0 #1d4ed8;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #1d4ed8}
.minirow{display:flex;gap:8px;margin-top:10px}.secondary{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;font-weight:800;color:#475569;cursor:pointer}
#play{align-items:stretch}.game-wrap{width:min(100%,560px);margin:auto;padding:12px 14px 24px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:rgba(255,255,255,.92);padding:12px 14px;border-radius:22px;box-shadow:0 8px 30px rgba(15,23,42,.08);position:sticky;top:8px;z-index:20}.hud-left{font-weight:900}.hud-center{text-align:center}.score{font-size:28px;font-weight:1000}.rank{font-size:11px;color:#7c3aed;font-weight:900}.combo{text-align:right;font-weight:1000;color:var(--orange)}.sound{border:0;background:#eef2ff;border-radius:12px;padding:8px;cursor:pointer}
.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:12px 2px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#8b5cf6);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:800;margin:8px 2px}.tag{background:#ede9fe;color:#6d28d9;border-radius:999px;padding:6px 10px}
.stage{position:relative;min-height:390px;display:flex;align-items:center;justify-content:center}
.stack{position:absolute;width:min(90vw,390px);height:285px;border-radius:34px;background:#fff;border:1px solid #eef2ff;box-shadow:0 18px 50px rgba(30,41,59,.12)}.stack.s1{transform:scale(.94) translateY(18px);opacity:.5}.stack.s2{transform:scale(.97) translateY(9px);opacity:.72}
.card{position:absolute;width:min(90vw,390px);height:285px;border-radius:34px;background:#fff;border:3px solid #fff;box-shadow:0 22px 60px rgba(30,41,59,.18);display:grid;grid-template-columns:1fr 2px 1fr;overflow:hidden;touch-action:none;user-select:none;cursor:grab;transition:transform .24s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s}.card.dragging{transition:none;cursor:grabbing}.divider{background:#eef2f7;position:relative}.divider:after{content:"VS";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px;color:#94a3b8;font-size:11px;font-weight:1000}
.choice{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 14px;font-size:clamp(23px,6vw,34px);font-weight:1000;line-height:1.22;word-break:keep-all;transition:.18s}.choice.hot{background:#eff6ff;color:#2563eb}.choice.good{background:#dcfce7;color:#15803d}.choice.bad{background:#fee2e2;color:#dc2626}
.feedback{position:absolute;z-index:15;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,420px);background:rgba(15,23,42,.94);color:#fff;border-radius:18px;padding:12px 15px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.25);font-size:14px;line-height:1.45}.feedback b{font-size:17px}.feedback.good{background:rgba(21,128,61,.95)}.feedback.bad{background:rgba(153,27,27,.96)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pick{border:0;border-radius:18px;padding:15px;background:#fff;box-shadow:0 8px 25px rgba(15,23,42,.08);font-weight:1000;color:#334155;cursor:pointer}.pick:active{transform:scale(.98)}
.tip{text-align:center;color:#94a3b8;font-size:12px;margin-top:10px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted);font-weight:800}
.category-list,.wrong-list{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow:auto}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#f8fafc;border-radius:12px;padding:10px 12px;font-size:13px}.wrong-item{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:10px 12px;font-size:13px}.wrong-item b{display:block;color:#c2410c;margin-bottom:3px}
@media(max-width:420px){.panel{padding:18px;border-radius:24px}.stage{min-height:340px}.card,.stack{height:250px}.choice{font-size:22px}.hud{grid-template-columns:1fr auto}.hud .combo{display:none}}
</style>
</head>
<body>
<section id="start" class="screen">
  <div class="panel">
    <h1 id="logo" class="logo">마춤뻡 뀌주</h1>
    <div id="title-note" class="title-note"></div>
    <p class="subtitle">헷갈리는 표현을 골라 좌우로 밀어 보세요. 틀린 문제는 다시 돌아옵니다.</p>
    <div class="setting">
      <label>난이도</label>
      <div id="difficulty" class="chips">
        <button class="chip active" data-value="전체">전체</button>
        <button class="chip" data-value="기초">기초</button>
        <button class="chip" data-value="기본">기본</button>
        <button class="chip" data-value="도전">도전</button>
      </div>
    </div>
    <div class="setting"><label for="category">문제 유형</label><select id="category"></select></div>
    <div class="setting" style="text-align:center"><b id="bank-count"></b><div style="font-size:12px;color:#94a3b8;margin-top:4px">한 판 20문제 · 오답은 3~5문제 뒤 복습</div></div>
    <button id="btn-start" class="primary">20문제 시작</button>
    <div class="minirow"><button id="btn-wrong-practice" class="secondary">📒 내 오답 집중</button><button id="btn-sound-start" class="secondary">🔊 소리 켬</button></div>
  </div>
</section>

<section id="play" class="screen hidden">
 <div class="game-wrap">
  <div class="hud">
    <div class="hud-left"><span id="hearts">오답 0</span><br><small id="round-label">1 / 20</small></div>
    <div class="hud-center"><div id="score" class="score">0</div><div id="rank" class="rank">맞춤법 새싹</div></div>
    <div class="combo"><span id="combo">0 COMBO</span> <button id="btn-sound" class="sound">🔊</button></div>
  </div>
  <div class="progress"><i id="progress-bar"></i></div>
  <div class="meta"><span id="difficulty-tag" class="tag">기초</span><span id="category-tag">자주 틀리는 말</span></div>
  <div class="stage">
    <div class="stack s1"></div><div class="stack s2"></div>
    <div id="card" class="card">
      <div id="left" class="choice"></div><div class="divider"></div><div id="right" class="choice"></div>
    </div>
    <div id="feedback" class="feedback hidden"></div>
  </div>
  <div class="controls"><button id="pick-left" class="pick">👈 왼쪽</button><button id="pick-right" class="pick">오른쪽 👉</button></div>
  <div class="tip">드래그 · 터치 스와이프 · ← → 키 · A/D 키 모두 가능</div>
 </div>
</section>

<section id="result" class="screen hidden">
 <div class="panel">
  <h2 style="text-align:center;font-size:32px;margin:0 0 6px">한 판 완료!</h2>
  <p id="result-message" class="subtitle"></p>
  <div class="result-grid">
   <div class="stat"><b id="result-accuracy">0%</b><span>첫 시도 정확도</span></div>
   <div class="stat"><b id="result-recovered">0</b><span>복습에서 다시 맞힘</span></div>
   <div class="stat"><b id="result-score">0</b><span>이번 점수</span></div>
   <div class="stat"><b id="result-best">0</b><span>최고 점수</span></div>
  </div>
  <div class="setting"><label>유형별 결과</label><div id="category-result" class="category-list"></div></div>
  <div class="setting"><label>이번 판 오답 노트</label><div id="wrong-list" class="wrong-list"></div></div>
  <button id="btn-restart" class="primary">한 판 더</button>
  <div class="minirow"><button id="btn-home" class="secondary">설정으로</button><button id="btn-wrong-again" class="secondary">오답만 다시</button></div>
 </div>
</section>

<script>

function saveMistakes(v){localStorage.setItem(STORE.mistakes,JSON.stringify(v))}
function rankFor(s){if(s<120)return"맞춤법 새싹";if(s<260)return"단어 수집가";if(s<450)return"문장 탐험가";if(s<700)return"교정 대장";if(s<950)return"훈민정음 달인";return"세종대왕"}
function genericTone(freq,dur=.12,type="sine",gain=.045){if(!soundOn)return;audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}
function soundCorrect(){genericTone(660,.1);setTimeout(()=>genericTone(990,.14),70)}
function soundWrong(){genericTone(180,.25,"sawtooth",.035)}
function updateSoundButtons(){const t=soundOn?"🔊 소리 켬":"🔇 소리 끔";$("btn-sound-start").textContent=t;$("btn-sound").textContent=soundOn?"🔊":"🔇"}
function toggleSound(){soundOn=!soundOn;localStorage.setItem(STORE.sound,soundOn?"on":"off");updateSoundButtons();if(soundOn)genericTone(720,.08)}
function titleProgress(){const lv=Number(localStorage.getItem(STORE.title)||0);$("logo").textContent=lv>=2?"맞춤법 퀴즈":lv>=1?"맞춤법 뀌주":"마춤뻡 뀌주";$("title-note").textContent=lv>=2?"제목 교정 완료!":lv>=1?"‘마춤뻡’을 ‘맞춤법’으로 고쳤어요!":"첫 판을 마치면 제목도 하나씩 고쳐집니다."}
function populateCategories(){const cats=["전체",...new Set(QUESTION_BANK.map(q=>q.category))];$("category").innerHTML=cats.map(c=>'<option value="'+c.replace(/"/g,"&quot;")+'">'+c+'</option>').join("");updateBankCount()}
function filteredBank(){let bank=QUESTION_BANK.filter(q=>(selectedDifficulty==="전체"||q.difficulty===selectedDifficulty)&&(selectedCategory==="전체"||q.category===selectedCategory));if(practiceWrongOnly){const m=getMistakes();bank=bank.filter(q=>m[q.c]?.wrong>0)}return bank}
function updateBankCount(){const n=filteredBank().length;$("bank-count").textContent=practiceWrongOnly?"내 오답 "+n+"개":"출제 가능 "+n+"개"}
function setScreen(id){for(const x of ["start","play","result"])$(x).classList.toggle("hidden",x!==id)}
function startGame(wrongOnly=false){practiceWrongOnly=wrongOnly;let bank=filteredBank();if(bank.length<2){practiceWrongOnly=false;bank=filteredBank();alert("이 조건의 문제가 너무 적어 전체 문제에서 출제할게요.")}const base=shuffle(bank).slice(0,Math.min(ROUND_SIZE,bank.length));queue=base.map(q=>({...q,isRetry:false,retryScheduled:false}));cursor=0;score=0;combo=0;mistakesThisRound=0;baseAnswered=0;firstCorrect=0;recovered=0;roundWrong=[];categoryStats={};locked=false;setScreen("play");showQuestion();updateHUD()}
function showQuestion(){if(cursor>=queue.length)return finishGame();current=queue[cursor];const leftCorrect=Math.random()<.5;current.answer=leftCorrect?"left":"right";current.left=leftCorrect?current.c:current.w;current.right=leftCorrect?current.w:current.c;$("left").textContent=current.left;$("right").textContent=current.right;$("left").className="choice";$("right").className="choice";$("card").style.transform="";$("card").classList.remove("dragging");$("feedback").classList.add("hidden");$("difficulty-tag").textContent=current.isRetry?"복습":current.difficulty;$("category-tag").textContent=current.category;locked=false;updateHUD()}
function updateHUD(){const displayIndex=Math.min(baseAnswered+1,ROUND_SIZE);$("round-label").textContent=(current?.isRetry?"복습 · ":"")+displayIndex+" / "+Math.min(ROUND_SIZE,queue.filter(q=>!q.isRetry).length);$("score").textContent=score;$("rank").textContent=rankFor(score);$("combo").textContent=combo+" COMBO";$("hearts").textContent="오답 "+mistakesThisRound;$("progress-bar").style.width=(Math.min(baseAnswered,ROUND_SIZE)/ROUND_SIZE*100)+"%"}
function statFor(q){categoryStats[q.category] ||= {seen:0,correct:0};return categoryStats[q.category]}
function recordMistake(q,correct){const m=getMistakes();m[q.c] ||= {wrong:0,correct:0,last:0};if(correct)m[q.c].correct++;else m[q.c].wrong++;m[q.c].last=Date.now();if(m[q.c].correct>=2&&m[q.c].wrong>0)m[q.c].mastered=true;saveMistakes(m)}
function answer(dir){if(locked||!current)return;locked=true;const ok=dir===current.answer;const correctEl=current.answer==="left"?$("left"):$("right"),wrongEl=current.answer==="left"?$("right"):$("left");correctEl.classList.add("good");if(!ok)wrongEl.classList.add("bad");
 const s=statFor(current);
 if(!current.isRetry){baseAnswered++;s.seen++;if(ok){s.correct++;firstCorrect++}}
 if(ok){soundCorrect();score+=10+Math.min(combo,10)*5;combo++;if(current.isRetry){recovered++;recordMistake(current,true)}showFeedback(true,current.isRetry?"복습 성공!":"정답!",current.explain);setTimeout(next,650)}
 else{soundWrong();combo=0;mistakesThisRound++;recordMistake(current,false);if(!roundWrong.some(x=>x.c===current.c))roundWrong.push(current);
   if(!current.isRetry&&!current.retryScheduled){current.retryScheduled=true;const retry={...current,isRetry:true,retryScheduled:true};delete retry.answer;delete retry.left;delete retry.right;const gap=3+Math.floor(Math.random()*3);queue.splice(Math.min(queue.length,cursor+gap+1),0,retry)}
   showFeedback(false,"정답: "+current.c,current.explain);setTimeout(next,1450)}
 updateHUD()}
function showFeedback(ok,title,msg){const f=$("feedback");f.className="feedback "+(ok?"good":"bad");f.innerHTML="<b>"+title+"</b><br>"+msg}
function next(){cursor++;if(cursor>=queue.length)return finishGame();showQuestion()}
function finishGame(){const attempted=Math.max(1,baseAnswered),accuracy=Math.round(firstCorrect/attempted*100),best=Math.max(Number(localStorage.getItem(STORE.score)||0)||0,score);localStorage.setItem(STORE.score,String(best));localStorage.setItem(STORE.rank,rankFor(score));
 const rounds=Number(localStorage.getItem(STORE.rounds)||0)+1;localStorage.setItem(STORE.rounds,String(rounds));let lv=Number(localStorage.getItem(STORE.title)||0);if(lv===0)lv=1;else if(lv===1&&(rounds>=3||accuracy>=90))lv=2;localStorage.setItem(STORE.title,String(lv));
 $("result-accuracy").textContent=accuracy+"%";$("result-recovered").textContent=recovered;$("result-score").textContent=score;$("result-best").textContent=best;$("result-message").textContent=accuracy>=90?"정확도가 아주 높아요. 헷갈린 표현만 한 번 더 보면 좋아요.":accuracy>=70?"좋아요. 틀린 표현은 복습에서 다시 만나도록 저장했어요.":"오답을 저장했어요. ‘오답만 다시’로 바로 복습할 수 있어요.";
 $("category-result").innerHTML=Object.entries(categoryStats).sort((a,b)=>b[1].seen-a[1].seen).map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+v.correct+' / '+v.seen+'</b></div>').join("")||'<div class="row"><span>기록 없음</span><b>-</b></div>';
 $("wrong-list").innerHTML=roundWrong.length?roundWrong.map(q=>'<div class="wrong-item"><b>'+q.c+' ← '+q.w+'</b><span>'+q.explain+'</span></div>').join(""):'<div class="row"><span>이번 판은 오답이 없어요!</span><b>🎉</b></div>';
 setScreen("result");titleProgress()}
function goHome(){practiceWrongOnly=false;titleProgress();updateBankCount();setScreen("start")}

$("difficulty").addEventListener("click",e=>{const b=e.target.closest("button[data-value]");if(!b)return;selectedDifficulty=b.dataset.value;document.querySelectorAll("#difficulty .chip").forEach(x=>x.classList.toggle("active",x===b));updateBankCount()});
$("category").addEventListener("change",e=>{selectedCategory=e.target.value;updateBankCount()});
$("btn-start").onclick=()=>startGame(false);$("btn-wrong-practice").onclick=()=>startGame(true);$("btn-restart").onclick=()=>startGame(false);$("btn-home").onclick=goHome;$("btn-wrong-again").onclick=()=>startGame(true);$("btn-sound").onclick=toggleSound;$("btn-sound-start").onclick=toggleSound;$("pick-left").onclick=()=>answer("left");$("pick-right").onclick=()=>answer("right");
window.addEventListener("keydown",e=>{if($("play").classList.contains("hidden"))return;if(["ArrowLeft","a","A"].includes(e.key)){e.preventDefault();answer("left")}if(["ArrowRight","d","D"].includes(e.key)){e.preventDefault();answer("right")}});

let dragging=false,startX=0,startY=0,dx=0,dy=0;
const card=$("card");
function point(e){const p=e.touches?.[0]||e.changedTouches?.[0]||e;return{x:p.clientX,y:p.clientY}}
card.addEventListener("pointerdown",e=>{if(locked)return;dragging=true;startX=e.clientX;startY=e.clientY;dx=dy=0;card.setPointerCapture?.(e.pointerId);card.classList.add("dragging")});
card.addEventListener("pointermove",e=>{if(!dragging)return;dx=e.clientX-startX;dy=e.clientY-startY;card.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx*.04)+"deg)";$("left").classList.toggle("hot",dx<-38);$("right").classList.toggle("hot",dx>38)});
function endDrag(){if(!dragging)return;dragging=false;card.classList.remove("dragging");$("left").classList.remove("hot");$("right").classList.remove("hot");if(Math.abs(dx)>72&&Math.abs(dx)>Math.abs(dy)){const dir=dx<0?"left":"right";card.style.transform="translate("+(dx<0?-520:520)+"px,0) rotate("+(dx<0?-12:12)+"deg)";answer(dir)}else card.style.transform=""}
card.addEventListener("pointerup",endDrag);card.addEventListener("pointercancel",endDrag);
populateCategories();titleProgress();updateSoundButtons();
</script>
</body>
</html>
