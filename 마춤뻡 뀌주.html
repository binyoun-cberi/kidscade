        /* 캐주얼하고 귀여운 폰트 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 커스텀 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            50% { transform: translateX(10px) rotate(2deg); }
            75% { transform: translateX(-10px) rotate(-2deg); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes confetti-fall {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--sx), calc(var(--sy) * 20)) rotate(var(--r)); opacity: 0; }
        }
        .animate-confetti-fall {
            animation: confetti-fall 1.5s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .card-transition {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .no-transition {
            transition: none !important;
        }
        
        /* 텍스트 외곽선 (가독성 향상) */
        .text-outline {
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff;
        }
    </style>
</head>

        // ==========================================
        // 1. Audio Engine (Web Audio API 활용)
        // ==========================================
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isPlayingBgm = false;
                this.nextNoteTime = 0;
                this.currentNote = 0;
                this.tempo = 140;
                this.notes = [
                    392.00, 329.63, 261.63, 329.63,
                    392.00, 392.00, 392.00, 0,
                    329.63, 329.63, 329.63, 0,
                    392.00, 493.88, 493.88, 0
                ]; 
                this.timerID = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCorrect() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playWrong() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            scheduler() {
                if (!this.isPlayingBgm || !this.ctx) return;
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    if (this.notes[this.currentNote] !== 0) {
                        this.playNote(this.notes[this.currentNote], this.nextNoteTime);
                    }
                    this.nextNoteTime += 60.0 / this.tempo / 2;
                    this.currentNote = (this.currentNote + 1) % this.notes.length;
                }
                this.timerID = setTimeout(() => this.scheduler(), 25);
            }

            playNote(freq, time) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.02, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
                osc.start(time);
                osc.stop(time + 0.2);
            }

            startBGM() {
                if (this.isPlayingBgm) return;
                this.init();
                this.isPlayingBgm = true;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduler();
            }

            stopBGM() {
                this.isPlayingBgm = false;
                clearTimeout(this.timerID);
            }
        }

        // 데이터 자동 정리: 양쪽이 같은 문제, O/X 라벨이 섞인 문제, 완전 중복 문제 제거
        const RAW_PAIR_COUNT = wordPairs.length;
        function cleanWordPairs(pairs) {
            const seen = new Set();
            return pairs.filter(pair => {
                if (!pair || !pair.c || !pair.w) return false;
                const c = String(pair.c).trim();
                const w = String(pair.w).trim();
                if (!c || !w) return false;
                if (c === w) return false;
                if (c.includes('(X)') || c.includes('(O)') || w.includes('(X)') || w.includes('(O)')) return false;
                const key = `${c}|||${w}`;
                if (seen.has(key)) return false;
                seen.add(key);
                pair.c = c;
                pair.w = w;
                return true;
            });
        }
        wordPairs = cleanWordPairs(wordPairs);

        let score = 0;
        let highScore = Number(localStorage.getItem('swipeSpellingScore') || 0) || 0;
        let combo = 0;
        let lives = 3;
        let currentQuestion = null;
        let cardStatus = 'default';

        // 문제 중복 방지를 위한 최근 출제 문제 큐
        let recentQuestions = [];
        const RECENT_LIMIT = 50; // 기억할 최근 문제 수

        function generateQuestion() {
            if (!wordPairs.length) {
                return { leftStr: '문제 없음', rightStr: '문제 없음', answer: 'left' };
            }
            // 최근에 푼 문제를 제외하고 필터링
            let availablePairs = wordPairs.filter(pair => !recentQuestions.includes(pair.c));
            
            // 모든 문제를 한 번씩 다 풀었다면 큐 초기화
            if (availablePairs.length === 0) {
                recentQuestions = [];
                availablePairs = wordPairs;
            }
            
            const pair = availablePairs[Math.floor(Math.random() * availablePairs.length)];
            
            // 최근 푼 문제에 기록
            recentQuestions.push(pair.c);
            if (recentQuestions.length > RECENT_LIMIT) {
                recentQuestions.shift(); // 큐 크기 유지
            }
            
            // 정답을 왼쪽에 둘지 오른쪽에 둘지 랜덤 (50%)
            const isLeftCorrect = Math.random() > 0.5;
            let leftStr, rightStr, answer;

            if (isLeftCorrect) {
                leftStr = pair.c;
                rightStr = pair.w;
                answer = 'left';
            } else {
                leftStr = pair.w;
                rightStr = pair.c;
                answer = 'right';
            }

            return { leftStr, rightStr, answer };
        }

        function getRank(score) {
            if (score < 100) return { name: '아이언', color: 'text-gray-500', bg: 'bg-gray-100', icon: '🪨' };
            if (score < 300) return { name: '브론즈', color: 'text-amber-700', bg: 'bg-amber-100', icon: '🥉' };
            if (score < 500) return { name: '실버', color: 'text-slate-500', bg: 'bg-slate-200', icon: '🥈' };
            if (score < 1000) return { name: '골드', color: 'text-yellow-600', bg: 'bg-yellow-100', icon: '🥇' };
            if (score < 2000) return { name: '플래티넘', color: 'text-teal-600', bg: 'bg-teal-100', icon: '✨' };
            if (score < 3000) return { name: '다이아몬드', color: 'text-blue-500', bg: 'bg-blue-100', icon: '💎' };
            if (score < 4000) return { name: '마스터', color: 'text-purple-500', bg: 'bg-purple-100', icon: '🔮' };
            if (score < 5000) return { name: '그랜드마스터', color: 'text-red-500', bg: 'bg-red-100', icon: '🔥' };
            return { name: '세종대왕', color: 'text-yellow-700', bg: 'bg-yellow-200', icon: '👑' };
        }

        function formatMathHTML(text) {
            // 글자 수에 따라 폰트 크기 조절

            return `<div class="${fontSizeClass}">${text}</div>`;
        }

            els.startScreen.style.display = 'none';
            els.playingScreen.style.display = 'none';
            els.gameoverScreen.style.display = 'none';
            els.playingScreen.classList.remove('flex');

            if (screen === 'start') els.startScreen.style.display = 'block';
            if (screen === 'playing') {
                els.playingScreen.style.display = 'flex';
                els.playingScreen.classList.add('flex');
            }
            if (screen === 'gameover') els.gameoverScreen.style.display = 'block';
        }

        function updateHUD(justLostHeart = false) {
            els.scoreDisplay.innerText = score;
            if (combo > 0) {
                els.comboDisplay.innerHTML = `<span class="text-orange-500 animate-bounce block drop-shadow-sm">${combo} COMBO!</span>`;
            } else {
                els.comboDisplay.innerHTML = `0 COMBO`;
            }

            const rank = getRank(score);
            els.rankBadge.className = `text-sm px-3 py-1 rounded-full mb-1 flex items-center gap-1 transition-colors duration-300 shadow-sm border border-black/5 ${rank.bg} ${rank.color}`;
            els.rankIcon.innerText = rank.icon;
            els.rankName.innerText = rank.name;

            els.heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const isAlive = i < lives;
                const justLost = justLostHeart && (i === lives);
                
                let heartHTML = '';
                let classes = 'transition-all duration-300 inline-block origin-center ';

                if (isAlive) {
                    heartHTML = '❤️';
                    classes += 'scale-100 drop-shadow-sm';
                } else if (justLost) {
                    heartHTML = '💔';
                    classes += 'animate-shake scale-150 drop-shadow-md z-20';
                } else {
                    heartHTML = '🖤';
                    classes += 'scale-75 opacity-30';
                }

                els.heartsContainer.innerHTML += `<span class="${classes}">${heartHTML}</span>`;
            }
        }

        function showNextQuestion() {
            currentQuestion = generateQuestion();
            els.leftValue.innerHTML = formatMathHTML(currentQuestion.leftStr);
            els.rightValue.innerHTML = formatMathHTML(currentQuestion.rightStr);
            resetCard();
        }

            cardStatus = 'default';
            els.gameCard.className = 'absolute w-full max-w-[340px] h-72 rounded-[2.5rem] shadow-2xl flex flex-row cursor-grab active:cursor-grabbing border-8 card-transition bg-white border-white z-20 overflow-hidden';
            els.gameCard.style.transform = `translate(0px, 0px) rotate(0deg)`;
            els.swipeHint.innerText = '';
            els.leftValueContainer.classList.remove('scale-110', 'text-blue-500', 'text-green-600', 'text-red-500');
            els.rightValueContainer.classList.remove('scale-110', 'text-blue-500', 'text-green-600', 'text-red-500');
            els.leftValueContainer.style.backgroundColor = 'transparent';
            els.rightValueContainer.style.backgroundColor = 'transparent';
        }

        function createConfetti() {
            els.confettiContainer.innerHTML = '';
            const particleCount = Math.min(10 + combo * 5, 60);
            const colors = ['#10B981', '#34D399', '#FCD34D', '#FBBF24', '#60A5FA', '#818CF8', '#A78BFA'];
            
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                const size = Math.random() * 10 + 6;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                p.className = 'absolute rounded-md animate-confetti-fall shadow-sm';
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * -20}%`;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = color;
                p.style.setProperty('--sx', `${(Math.random() - 0.5) * 15}px`);
                p.style.setProperty('--sy', `${Math.random() * 5 + 5}px`);
                p.style.setProperty('--r', `${Math.random() * 360}deg`);
                
                els.confettiContainer.appendChild(p);
            }

            setTimeout(() => {
                els.confettiContainer.innerHTML = '';
            }, 1500);
        }

        // ==========================================
        // 4. Game Flow Controls
        // ==========================================
        function startGame() {
            audioEngine.init();
            audioEngine.startBGM();
            score = 0;
            combo = 0;
            lives = 3;
            cardStatus = 'default';
            recentQuestions = []; // 재시작 시 큐 초기화
            els.appContainer.className = 'min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 flex flex-col items-center justify-center overflow-hidden transition-colors duration-500';
            
            updateHUD();
            showNextQuestion();
            switchScreen('playing');
        }

        function handleAnswer(swipedDirection) {
            if (cardStatus !== 'default') return;

            const isCorrect = swipedDirection === currentQuestion.answer;

            if (isCorrect) {
                audioEngine.playCorrect();
                cardStatus = 'correct';
                score += 10 + (combo * 5);
                combo++;
                updateHUD();
                createConfetti();

                // 정답 연출
                els.gameCard.className = 'absolute w-full max-w-[340px] h-72 rounded-[2.5rem] shadow-2xl flex flex-row border-8 card-transition bg-green-50 border-green-400 z-20 overflow-hidden';
                
                let flyX = swipedDirection === 'left' ? -500 : swipedDirection === 'right' ? 500 : 0;
                els.gameCard.style.transform = `translate(${flyX}px, 0px) rotate(${flyX * 0.05}deg)`;

                setTimeout(() => {
                    showNextQuestion();
                }, 300);

            } else {
                audioEngine.playWrong();
                cardStatus = 'wrong';
                combo = 0;
                lives--;
                
                // 오답 연출 (배경 플래시 및 하트 깨짐)
                els.appContainer.classList.replace('from-indigo-50', 'from-red-100');
                els.appContainer.classList.replace('via-purple-50', 'via-red-50');
                els.appContainer.classList.replace('to-blue-100', 'to-red-100');
                
                updateHUD(true);

                els.gameCard.className = 'absolute w-full max-w-[340px] h-72 rounded-[2.5rem] shadow-2xl flex flex-row border-8 card-transition bg-red-50 border-red-400 animate-shake z-20 overflow-hidden';
                els.gameCard.style.transform = `translate(0px, 0px) rotate(0deg)`;

                // 오답 직후 정답 위치를 잠깐 보여 주어 학습 피드백 강화
                const correctBox = currentQuestion.answer === 'left' ? els.leftValueContainer : els.rightValueContainer;
                const wrongBox = currentQuestion.answer === 'left' ? els.rightValueContainer : els.leftValueContainer;
                correctBox.classList.add('scale-110', 'text-green-600');
                correctBox.style.backgroundColor = 'rgba(220, 252, 231, 0.9)';
                wrongBox.classList.add('text-red-500');
                wrongBox.style.backgroundColor = 'rgba(254, 226, 226, 0.9)';
                els.swipeHint.innerText = currentQuestion.answer === 'left' ? '✅👈' : '👉✅';

                setTimeout(() => {
                    els.appContainer.classList.replace('from-red-100', 'from-indigo-50');
                    els.appContainer.classList.replace('via-red-50', 'via-purple-50');
                    els.appContainer.classList.replace('to-red-100', 'to-blue-100');
                    
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        showNextQuestion();
                        updateHUD(); 
                    }
                }, 500);
            }
        }

        function gameOver() {
            audioEngine.stopBGM();
            if (score > highScore) highScore = score;
            
            const finalRank = getRank(score);
            document.getElementById('final-rank-icon').innerText = finalRank.icon;
            const rankNameEl = document.getElementById('final-rank-name');
            rankNameEl.innerText = finalRank.name;
            rankNameEl.className = `text-4xl font-black mt-2 ${finalRank.color}`;
            
            document.getElementById('final-score-display').innerText = score;
            document.getElementById('high-score-display').innerText = highScore;

            localStorage.setItem('swipeSpellingRank', finalRank.name);
            localStorage.setItem('swipeSpellingScore', String(highScore));

            switchScreen('gameover');
        }

        // ==========================================
        // 5. Drag / Touch Event Listeners
        // ==========================================
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let currentDrag = { x: 0, y: 0 };

        function onDragStart(e) {
            if (cardStatus !== 'default') return;
            isDragging = true;
            els.gameCard.classList.remove('card-transition');
            els.gameCard.classList.add('no-transition');
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startPos = { x: clientX, y: clientY };
        }

        function onDragMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // 스크롤 방지
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            currentDrag.x = clientX - startPos.x;
            currentDrag.y = clientY - startPos.y;

            els.gameCard.style.transform = `translate(${currentDrag.x}px, ${currentDrag.y}px) rotate(${currentDrag.x * 0.05}deg)`;

            const threshold = 40;
            
            // 드래그 방향에 따른 시각적 피드백 (텍스트 크기 증가, 색상 변경)
            if (currentDrag.x < -threshold) {
                els.swipeHint.innerText = '👈';
                els.leftValueContainer.classList.add('scale-110', 'text-blue-500');
                els.leftValueContainer.style.backgroundColor = 'rgba(239, 246, 255, 0.5)';
                els.rightValueContainer.classList.remove('scale-110', 'text-blue-500');
                els.rightValueContainer.style.backgroundColor = 'transparent';
            } else if (currentDrag.x > threshold) {
                els.swipeHint.innerText = '👉';
                els.rightValueContainer.classList.add('scale-110', 'text-blue-500');
                els.rightValueContainer.style.backgroundColor = 'rgba(239, 246, 255, 0.5)';
                els.leftValueContainer.classList.remove('scale-110', 'text-blue-500');
                els.leftValueContainer.style.backgroundColor = 'transparent';
            } else {
                els.swipeHint.innerText = '';
                els.leftValueContainer.classList.remove('scale-110', 'text-blue-500');
                els.rightValueContainer.classList.remove('scale-110', 'text-blue-500');
                els.leftValueContainer.style.backgroundColor = 'transparent';
                els.rightValueContainer.style.backgroundColor = 'transparent';
            }
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            els.gameCard.classList.remove('no-transition');
            els.gameCard.classList.add('card-transition');

            const threshold = 70;
            // 좌우 스와이프만 판정
            if (Math.abs(currentDrag.x) > threshold && Math.abs(currentDrag.x) > Math.abs(currentDrag.y)) {
                if (currentDrag.x < -threshold) handleAnswer('left');
                else if (currentDrag.x > threshold) handleAnswer('right');
            } else {
                resetCard(); // 취소됨 (너무 적게 이동했거나 위아래로 이동함)
            }
            
            currentDrag = { x: 0, y: 0 };
        }

        // 마우스 이벤트
        els.gameCard.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        // 터치 이벤트
        els.gameCard.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);

        // 키보드 보조 조작: PC 교실 환경에서 드래그 없이도 플레이 가능
        window.addEventListener('keydown', (e) => {
            const isPlaying = els.playingScreen.style.display === 'flex';
            if (!isPlaying || cardStatus !== 'default') return;
            if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                handleAnswer('left');
            } else if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                handleAnswer('right');
            }
        });

        // 버튼 이벤트
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);

    </script>
</body>
</html>
