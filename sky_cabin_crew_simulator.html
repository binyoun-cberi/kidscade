<title>캐빈 러시: 하늘 위 대소동</title>
<style>
:root{

  --navy2:#25385f;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#7fcdf4}
body{
  background:
    radial-gradient(circle at 18% 13%,rgba(255,255,255,.84) 0 42px,transparent 43px),
    radial-gradient(circle at 78% 18%,rgba(255,255,255,.65) 0 34px,transparent 35px),
    linear-gradient(180deg,#62c7f4 0%,#b7eaff 43%,#fff0c8 100%);
}
body::before{content:"";position:fixed;left:-15%;right:-15%;bottom:-48px;height:190px;background:
  radial-gradient(ellipse at 12% 80%,#89c768 0 88px,transparent 90px),
  radial-gradient(ellipse at 35% 78%,#abd980 0 112px,transparent 114px),
  radial-gradient(ellipse at 72% 80%,#7ebe62 0 96px,transparent 98px),

button{border:0;border-radius:16px;padding:11px 15px;font-weight:950;font-size:15px;color:var(--navy);background:#fff;box-shadow:0 5px 0 rgba(20,36,68,.17),0 14px 24px rgba(20,36,68,.12);cursor:pointer;transition:.12s transform,.12s filter,.12s box-shadow;touch-action:manipulation}

.titleBox{flex:1;min-width:0}

.miniPlane::after{content:"";position:absolute;width:22px;height:12px;background:#ffcf53;border:3px solid #17233f;border-radius:8px 20px 8px 20px;left:19px;top:9px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:#edf5ff;border:1px solid #d2e2f4;color:#31445f;font-size:12px;font-weight:950;padding:5px 8px;margin:3px}
.loadout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;height:100%;min-height:0}.scroll{overflow:auto;min-height:0;padding-right:3px}.supplyGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.supplyCard{border-radius:20px;background:linear-gradient(180deg,#fff,#f5f8ff);border:2px solid #dde7f4;padding:13px;box-shadow:0 7px 16px rgba(20,36,68,.08);cursor:pointer;transition:.12s transform,.12s border,.12s background;position:relative;overflow:hidden}.supplyCard:hover{transform:translateY(-2px)}.supplyCard.selected{border-color:#ffbf3d;background:linear-gradient(180deg,#fff9df,#ffeec0)}.itemIcon{width:42px;height:42px;border-radius:14px;background:#17233f;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;margin-bottom:8px;box-shadow:0 6px 15px rgba(20,36,68,.16)}.supplyCard .count{position:absolute;right:11px;top:11px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:#ffcf53;border:2px solid #17233f;font-weight:1000}.manifest{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.manifest .box{border-radius:18px;background:#f2f7ff;border:1px solid #d6e5f4;padding:10px;font-weight:900;color:#30445e}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.progressBar{height:13px;background:#dbe4ef;border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.05)}.progressBar span{height:100%;display:block;background:linear-gradient(90deg,#38bd7e,#ffcf53,#ff6b6b);width:50%;transition:.2s width}
.gameWrap{display:grid;grid-template-columns:1fr 284px;gap:14px;height:100%}.cabinShell{min-width:0;position:relative}.cabin{position:relative;height:100%;min-height:610px;max-height:calc(100vh - 112px);background:linear-gradient(90deg,#c9e8ff 0 10%,#fff9ec 10% 90%,#c9e8ff 90%);border:6px solid #17233f;border-radius:64px 64px 38px 38px;box-shadow:var(--shadow);overflow:hidden}.cabin::before{content:"";position:absolute;left:43%;right:43%;top:0;bottom:0;background:linear-gradient(180deg,#edf5ff,#dce9f6);border-left:3px dashed rgba(23,35,63,.18);border-right:3px dashed rgba(23,35,63,.18);z-index:1}.cabin::after{content:"";position:absolute;left:0;right:0;top:0;height:56px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));z-index:2;pointer-events:none}.cockpit,.galley{position:absolute;left:50%;transform:translateX(-50%);z-index:3;text-align:center;font-weight:1000;color:#fff;background:#17233f;padding:10px 22px;border-radius:18px;box-shadow:0 8px 18px rgba(0,0,0,.18)}.cockpit{top:15px}.galley{bottom:14px;background:#6c4b27;color:#fff3d5;cursor:pointer}.galley.near{outline:5px solid rgba(255,207,83,.45);animation:nearPulse .7s infinite alternate}.rowLabel{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;font-weight:1000;color:#8a98ab;z-index:2}.seat{position:absolute;width:76px;height:66px;transform-origin:top left;border-radius:22px 22px 16px 16px;background:linear-gradient(180deg,#f6c975,#c98a36);border:4px solid #17233f;box-shadow:inset 0 -7px 0 rgba(89,43,0,.17),0 8px 16px rgba(20,36,68,.12);z-index:5;cursor:pointer}.seat::before{content:"";position:absolute;left:12px;right:12px;top:7px;height:9px;border-radius:999px;background:rgba(255,255,255,.28)}.seat.near{outline:6px solid rgba(255,207,83,.42);transform:translateY(-2px)}.seat.blocked{filter:saturate(.85) brightness(.92)}.seatTag{position:absolute;left:6px;top:4px;font-size:10px;font-weight:1000;color:rgba(23,35,63,.72)}.passenger{position:absolute;left:50%;top:28px;transform:translate(-50%,-50%);width:36px;height:42px;border-radius:18px 18px 12px 12px;background:#4568a8;border:3px solid #17233f;z-index:3}.passenger::before{content:"";position:absolute;left:5px;top:-19px;width:21px;height:21px;border-radius:50%;background:#f4c292;border:3px solid #17233f}.passenger::after{content:"";position:absolute;left:10px;top:-12px;width:4px;height:4px;border-radius:50%;background:#17233f;box-shadow:9px 0 0 #17233f}.passenger.child{width:31px;height:34px;background:#f0d04a}.passenger.child::before{background:#f6bf82}.passenger.elderly{background:#798ca9}.passenger.elderly::before{background:#ead0b0}.passenger.sick{background:#8ad0c6}.passenger.sick::before{background:#dff2dc}.passenger.vip{background:#cd6a7c}.passenger.angry::after{height:4px;border-radius:0;transform:rotate(12deg);box-shadow:9px -2px 0 #17233f}.passenger.happy{animation:happyBob .7s ease-in-out infinite alternate}.bubble{position:absolute;right:-18px;top:-24px;min-width:38px;height:34px;border-radius:18px 18px 18px 4px;background:#fff;border:3px solid #17233f;box-shadow:0 8px 16px rgba(20,36,68,.12);display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:14px;z-index:8;animation:bubble .8s ease-in-out infinite alternate}.bubble.warn{background:#fff3c4}.bubble.bad{background:#ffd1d1;animation:angryBubble .18s linear infinite alternate}.bubble.safe{background:#dff7ff}.bubble.trash{background:#e9e2d4}.floorItem{position:absolute;width:30px;height:18px;border-radius:9px;background:#7ad0ff;border:3px solid #17233f;z-index:4;box-shadow:0 5px 10px rgba(20,36,68,.12)}.floorItem::after{content:"";position:absolute;left:7px;right:7px;top:5px;height:4px;border-radius:99px;background:rgba(255,255,255,.6)}.player{position:absolute;width:44px;height:54px;border-radius:18px 18px 14px 14px;background:#243b6b;border:4px solid #17233f;z-index:20;box-shadow:0 12px 18px rgba(20,36,68,.25);transition:filter .08s}.player::before{content:"";position:absolute;left:8px;top:-23px;width:22px;height:22px;border-radius:50%;background:#f0bd8d;border:4px solid #17233f}.player::after{content:"";position:absolute;left:9px;right:9px;top:10px;height:7px;border-radius:99px;background:#ffcf53}.cart{position:absolute;width:42px;height:42px;border-radius:16px;background:#fff0b6;border:4px solid #17233f;z-index:18;box-shadow:0 10px 17px rgba(20,36,68,.18);transition:left .06s linear,top .06s linear}.cart::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:9px;border-radius:999px;background:#ffcf53}.cart::after{content:"";position:absolute;left:7px;bottom:-8px;width:9px;height:9px;border-radius:50%;background:#17233f;box-shadow:20px 0 0 #17233f}.shake{animation:shake .16s linear infinite}.dim .cabin{filter:brightness(.72)}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(4px,-2px)}50%{transform:translate(-3px,3px)}75%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}@keyframes bubble{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.04)}}@keyframes angryBubble{from{transform:translateX(-2px)}to{transform:translateX(2px)}}@keyframes happyBob{from{transform:translate(-50%,-50%) translateY(0)}to{transform:translate(-50%,-50%) translateY(-4px)}}@keyframes nearPulse{from{box-shadow:0 8px 18px rgba(0,0,0,.18)}to{box-shadow:0 0 0 12px rgba(255,207,83,.12),0 8px 18px rgba(0,0,0,.18)}}

.warn{background:#9a5b00}.eventBanner.bad{background:#aa2734}@keyframes banner{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

<body>
<div id="app">
  <header id="topbar"></header>
  <main id="stage"></main>
  <div id="mobilePad" class="hidden">
    <button class="mUp" data-dir="up">▲</button><button class="mLeft" data-dir="left">◀</button><button class="mRight" data-dir="right">▶</button><button class="mDown" data-dir="down">▼</button>
  </div>
  <div id="mobileActions" class="mobileActions hidden"><button class="primary" id="mInteract">상호작용</button><button class="ghost" id="mSwap">물품 변경</button></div>
</div>
<script>
'use strict';
const SAVE_KEY='cabinRushOverhaul_v1';
const $=s=>document.querySelector(s);
const topbar=$('#topbar'), stage=$('#stage'), mobilePad=$('#mobilePad'), mobileActions=$('#mobileActions');
const W=860, H=640;
const ITEMS={
  water:{name:'물',code:'W',need:['general','elderly','sick'],color:'#66b8ff'},
  juice:{name:'주스',code:'J',need:['child','general'],color:'#ffba60'},
  meal:{name:'기내식',code:'M',need:['general','vip'],color:'#d99a51'},
  blanket:{name:'담요',code:'B',need:['elderly','general'],color:'#9b8cff'},
  tissue:{name:'휴지',code:'T',need:['sick','child'],color:'#a7d6f5'},
  toy:{name:'장난감',code:'Y',need:['child'],color:'#ffcf53'},
  medbag:{name:'멀미봉투',code:'S',need:['sick'],color:'#9be0ad'},
  coffee:{name:'커피',code:'C',need:['vip','general'],color:'#8b5e34'}
};
const ISSUE={belt:{name:'안전벨트',code:'BELT'},table:{name:'테이블 접기',code:'TABLE'},bag:{name:'통로 짐',code:'BAG'},phone:{name:'휴대전화',code:'PHONE'}};
const FLIGHTS=[
  {id:'jeju',name:'제주 셔틀',dest:'제주',rows:4,time:150,difficulty:1,coins:120,passengerMix:['general','general','general','child','elderly'],events:['spill','turbulence'],desc:'짧은 비행. 기본 동선과 서비스를 익히기 좋습니다.'},
  {id:'busan',name:'부산 러시',dest:'부산',rows:5,time:180,difficulty:2,coins:170,passengerMix:['general','general','child','elderly','sick','vip'],events:['spill','turbulence','sick'],desc:'요청이 많고 멀미 승객이 등장합니다.'},
  {id:'tokyo',name:'도쿄 나이트',dest:'도쿄',rows:6,time:210,difficulty:4,coins:240,passengerMix:['general','child','elderly','sick','vip','vip'],events:['spill','turbulence','sick','lights','bagDrop'],desc:'조명 이상과 난기류가 겹치는 어려운 국제선입니다.'}
];
const UPGRADES=[
  {id:'shoes',name:'경량 승무원화',cost:420,desc:'이동 속도 증가'},
  {id:'cart',name:'확장 서비스 카트',cost:560,desc:'카트 칸 +2'},
  {id:'tablet',name:'우선순위 태블릿',cost:460,desc:'가장 급한 승객을 더 빨리 알려줌'},
  {id:'stable',name:'안정 카트 바퀴',cost:620,desc:'난기류 때 물품이 쏟아질 확률 감소'},
  {id:'crew',name:'보조 승무원 호출',cost:850,desc:'가끔 쓰레기와 안전 문제를 자동 처리'}
];
let save={coins:0,best:0,total:0,owned:{}};
let screen='home';
let selectedFlight=null;
let loadout={};
let stock={};
let cart=[];
let selectedCart=0;
let passengers=[];
let player={x:410,y:540,vx:0,vy:0};
let keys={};
let loop=null,last=0;
let remaining=0, startedAt=0, phase='service', landingStarted=false;
let satisfaction=100,safety=100,speedScore=100,mistakes=0, combo=0, rewardBonus=0;
let nextRequest=0,nextEvent=0,turbulence=0,lightsOut=0,message='';
let logs=[];
let supplyOpen=false;
let audio=null,sound=true;
let currentTitle='캐빈 러시', currentGoal='운항 준비';
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw)save=Object.assign(save,JSON.parse(raw));}catch(e){}}
function writeSave(){localStorage.setItem(SAVE_KEY,JSON.stringify(save));}
function cap(){return save.owned.cart?6:4}
function speed(){return save.owned.shoes?250:205}
function stockPoints(){return 12 + (selectedFlight?.difficulty||1)*2}
function updateTop(title,goal){
  if(title!==undefined) currentTitle=title;
  if(goal!==undefined) currentGoal=goal;
  topbar.innerHTML=`<div class="logo"></div><div class="titleBox"><div class="gameTitle">${currentTitle}</div><div class="goal">${currentGoal}</div></div><div class="topStats"><span class="chip">🪙 ${save.coins}</span><span class="chip">BEST ${save.best}</span><button class="ghost soundToggle" onclick="toggleSound()">${sound?'🔊':'🔇'}</button></div>`;
}
function initAudio(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){sound=false}}
function tone(freq,dur=.07,type='sine',vol=.045){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.03)}
function sfx(n){initAudio();if(n==='ok'){tone(680,.06,'triangle');setTimeout(()=>tone(920,.06,'triangle'),70)}else if(n==='bad'){tone(150,.12,'sawtooth',.055)}else if(n==='coin'){tone(1050,.07,'triangle');setTimeout(()=>tone(1320,.08,'triangle'),80)}else if(n==='event'){tone(260,.08,'square');setTimeout(()=>tone(220,.08,'square'),90)}else tone(440,.035,'square',.025)}
function toggleSound(){sound=!sound;if(sound){initAudio();sfx('ok')}updateTop();}
function showToast(txt){const d=document.createElement('div');d.className='toast';d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function log(txt,cls=''){logs.unshift(`<p class="${cls}">${txt}</p>`);logs=logs.slice(0,8)}
function banner(txt,cls=''){const old=document.querySelector('.eventBanner');if(old)old.remove();const b=document.createElement('div');b.className='eventBanner '+cls;b.textContent=txt;document.body.appendChild(b);setTimeout(()=>b.remove(),2200)}
function resetRun(){cart=[];selectedCart=0;stock={};passengers=[];player={x:410,y:540,vx:0,vy:0};phase='service';landingStarted=false;satisfaction=100;safety=100;speedScore=100;mistakes=0;combo=0;rewardBonus=0;turbulence=0;lightsOut=0;logs=[];supplyOpen=false;message='갤리에서 카트를 채우고 승객을 도와주세요.';}
function renderHome(){stopGame();screen='home';updateTop('캐빈 러시','기내 요청과 안전 문제를 처리하세요');mobilePad.classList.add('hidden');mobileActions.classList.add('hidden');stage.innerHTML=`<div class="screen center"><div class="hero"><div class="heroPlane"><div class="tail"></div><div class="body"></div><div class="wing"></div><div class="window"></div><div class="nose"></div></div><h1 class="big">캐빈 러시</h1><p class="sub">카트를 끌고 기내를 누비는 승무원 액션 게임</p><div class="row"><button class="primary" onclick="renderFlightSelect()">비행 시작</button><button class="navy" onclick="renderShop()">업그레이드</button><button class="ghost" onclick="showHelp()">조작법</button></div></div></div>`;}
function showHelp(){updateTop('조작법','이동하고, 가까이 가서 처리하세요');stage.innerHTML=`<div class="screen center"><div class="panel helpPanel"><h2>조작법</h2><p><span class="kbd">WASD</span> / <span class="kbd">방향키</span> 이동</p><p><span class="kbd">Space</span> / <span class="kbd">E</span> 상호작용</p><p><span class="kbd">1~6</span> 카트 물품 선택</p><p><b>요청:</b> W/J/M/B/T/Y/S/C · <b>안전:</b> BELT/TABLE/BAG/PHONE</p><div class="row"><button class="primary" onclick="renderFlightSelect()">시작</button><button onclick="renderHome()">돌아가기</button></div></div></div>`;}
function renderFlightSelect(){stopGame();screen='select';updateTop('비행 선택','노선을 선택하세요');mobilePad.classList.add('hidden');mobileActions.classList.add('hidden');const cards=FLIGHTS.map(f=>`<div class="panel flightCard"><h2>${f.name}</h2><div class="flightRoute"><div class="miniPlane"></div></div><p>${f.desc}</p><p><span class="pill">목적지 ${f.dest}</span><span class="pill">좌석 ${f.rows*4}</span><span class="pill">시간 ${f.time}초</span><span class="pill">난이도 ${'●'.repeat(f.difficulty)}</span></p><button class="primary" onclick="selectFlight('${f.id}')">이 비행 준비</button></div>`).join('');stage.innerHTML=`<div class="screen"><div class="toolbar" style="margin-bottom:12px"><button onclick="renderHome()">← 시작 화면</button><button class="navy" onclick="renderShop()">업그레이드</button></div><div class="grid cards">${cards}</div></div>`;}
function selectFlight(id){selectedFlight=FLIGHTS.find(f=>f.id===id);resetRun();loadout={water:2,juice:1,meal:1,blanket:1,tissue:1,toy:0,medbag:1,coffee:0};renderLoadout();}
function renderLoadout(){screen='loadout';updateTop('카트 준비',`${selectedFlight.name} · ${selectedFlight.dest}`);const used=Object.values(loadout).reduce((a,b)=>a+b,0), max=stockPoints();const passengerHint=manifestPreview();const cards=Object.keys(ITEMS).map(id=>`<div class="supplyCard ${loadout[id]>0?'selected':''}" onclick="addSupply('${id}')"><span class="count">${loadout[id]||0}</span><div class="itemIcon" style="background:${ITEMS[id].color}">${ITEMS[id].code}</div><h3>${ITEMS[id].name}</h3><p>${supplyHint(id)}</p><div class="row" style="justify-content:flex-start"><button class="ghost" onclick="event.stopPropagation();removeSupply('${id}')">-</button><button class="ghost" onclick="event.stopPropagation();addSupply('${id}')">+</button></div></div>`).join('');stage.innerHTML=`<div class="screen"><div class="loadout compactLoadout"><div class="panel scroll"><div class="sectionHead"><h2>승객 브리핑</h2><span class="chip">${used}/${max}</span></div><div class="manifest">${passengerHint}</div><h3>재고 선택</h3><div class="supplyGrid">${cards}</div></div><div class="panel sideBrief"><h2>운항 목표</h2><div class="scorePreview"><b>만족도</b><span>승객 요청 빠른 처리</span></div><div class="scorePreview"><b>안전</b><span>벨트·테이블·통로 점검</span></div><div class="scorePreview"><b>동선</b><span>갤리 왕복 최소화</span></div><div class="progressBar"><span style="width:${Math.min(100,used/max*100)}%"></span></div><p class="miniNote">카트 용량 ${cap()}칸. 재고는 많아도 한 번에 전부 들 수 없습니다.</p><div class="row"><button class="primary" ${used>0?'':'disabled'} onclick="startRun()">운항 시작</button><button onclick="renderFlightSelect()">뒤로</button></div></div></div></div>`;}
function supplyHint(id){return {water:'기본 음료',juice:'아이/일반',meal:'식사 요청',blanket:'어르신',tissue:'쏟음 대응',toy:'어린이',medbag:'멀미 대응',coffee:'VIP'}[id];}
function manifestPreview(){const mix=selectedFlight.passengerMix;const counts={};for(let i=0;i<selectedFlight.rows*4;i++){const t=mix[i%mix.length];counts[t]=(counts[t]||0)+1}const names={general:'일반',child:'어린이',elderly:'어르신',sick:'멀미/아픈',vip:'까다로운'};return Object.keys(counts).map(k=>`<div class="box"><span>${names[k]}</span><b>${counts[k]}명</b></div>`).join('')+`<div class="box"><span>이벤트</span><b>${selectedFlight.events.map(eventName).join(' · ')}</b></div>`;}
function addSupply(id){const used=Object.values(loadout).reduce((a,b)=>a+b,0);if(used>=stockPoints()){showToast('더 이상 실을 수 없습니다.');return}loadout[id]=(loadout[id]||0)+1;renderLoadout();}
function removeSupply(id){loadout[id]=Math.max(0,(loadout[id]||0)-1);renderLoadout();}
function startRun(){resetRun();stock=Object.assign({},loadout);generatePassengers();remaining=selectedFlight.time;startedAt=performance.now();nextRequest=3;nextEvent=12+Math.random()*10;renderGame();startGame();}
function generatePassengers(){const mix=selectedFlight.passengerMix;const seats=[];for(let r=1;r<=selectedFlight.rows;r++)for(const c of ['A','B','C','D'])seats.push(`${r}${c}`);passengers=seats.map((seat,i)=>{const type=mix[(i+Math.floor(Math.random()*mix.length))%mix.length];return{id:i,seat,type,request:null,issue:null,trash:false,wait:0,happy:100,served:0,blocked:false,flash:false,lastRequest:0,anim:''};});}
function renderGame(){screen='game';updateTop(phase==='landing'?'착륙 준비':'운항 중',`${selectedFlight.dest}행 · 요청/안전 처리`);mobilePad.classList.remove('hidden');mobileActions.classList.remove('hidden');stage.innerHTML=`<div class="screen gameWrap"><div class="cabinShell"><div id="cabin" class="cabin"><div class="cockpit">조종석</div><div id="seatLayer"></div><div id="floorLayer"></div><div id="galley" class="galley" onclick="toggleSupplyDrawer(true)">갤리 / 보충</div><div id="cart" class="cart"></div><div id="player" class="player"></div></div><div id="supplyDrawer" class="supplyDrawer"></div></div><aside class="tablet" id="tablet"></aside></div>`;drawStaticSeats();drawGame();}
function drawStaticSeats(){const layer=$('#seatLayer');if(!layer)return;let html='';for(let r=1;r<=selectedFlight.rows;r++){html+=`<div class="rowLabel" data-row="${r}">${r}</div>`;}for(const p of passengers){html+=`<div class="seat" data-seat="${p.seat}" onclick="seatClick('${p.seat}')"><span class="seatTag">${p.seat}</span><div class="passenger ${p.type}"></div></div>`;}layer.innerHTML=html;}
function seatPositions(){const left=[82,174],right=[610,702],top=82,gap=78;const map={};for(let r=1;r<=selectedFlight.rows;r++){['A','B','C','D'].forEach((c,i)=>{map[`${r}${c}`]={x:(i<2?left[i]:right[i-2]),y:top+(r-1)*gap};});}return map;}
function startGame(){stopGame();last=performance.now();loop=requestAnimationFrame(tick);}
function stopGame(){if(loop)cancelAnimationFrame(loop);loop=null;}
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(screen==='game'){updateGame(dt);drawGame();loop=requestAnimationFrame(tick);}}
function updateGame(dt){remaining-=dt;if(remaining<=0){finishRun();return}if(!landingStarted&&remaining<45){landingStarted=true;phase='landing';banner('착륙 준비','warn');log('착륙 점검 시작','alert');spawnLandingIssues();}
  if(turbulence>0)turbulence-=dt;if(lightsOut>0)lightsOut-=dt;
  movePlayer(dt);nextRequest-=dt;nextEvent-=dt;if(nextRequest<=0){spawnRequest();nextRequest=2.2+Math.random()*3.6-Math.min(1.2,selectedFlight.difficulty*.18)}if(nextEvent<=0){spawnEvent();nextEvent=16+Math.random()*22-Math.min(8,selectedFlight.difficulty*2)}
  for(const p of passengers){if(p.request||p.issue){p.wait+=dt;if(p.wait>7){p.happy-=dt*(p.type==='vip'?5.2:3.2);satisfaction-=dt*.14;if(p.wait>12)safety-=p.issue?dt*.08:0;}if(p.happy<55&&Math.random()<dt*.7)p.anim='angry';}else p.wait=Math.max(0,p.wait-dt*2)}
  if(save.owned.crew&&Math.random()<dt*.035)crewAssist();
  satisfaction=clamp(satisfaction,0,120);safety=clamp(safety,0,120);speedScore=clamp(100-(selectedFlight.time-remaining)*.025-mistakes*3,0,120);
}
function movePlayer(dt){let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;const sp=speed()*(turbulence>0?.55:1);if(dx||dy){const len=Math.hypot(dx,dy)||1;player.x+=dx/len*sp*dt;player.y+=dy/len*sp*dt;player.x=clamp(player.x,320,500);player.y=clamp(player.y,56,H-86);if(Math.random()<.04)sfx('step')} }
function drawGame(){const cabin=$('#cabin'), playerEl=$('#player'), cartEl=$('#cart'), galley=$('#galley');if(!cabin||!playerEl)return;const sx=cabin.clientWidth/W, sy=cabin.clientHeight/H;playerEl.style.left=(player.x*sx)+'px';playerEl.style.top=(player.y*sy)+'px';playerEl.style.transform=`translate(-50%,-50%) scale(${Math.min(sx,sy)})`;cartEl.style.left=((player.x-48)*sx)+'px';cartEl.style.top=((player.y+10)*sy)+'px';cartEl.style.transform=`translate(-50%,-50%) scale(${Math.min(sx,sy)})`;cabin.classList.toggle('shake',turbulence>0);document.body.classList.toggle('dim',lightsOut>0);galley.classList.toggle('near',nearGalley());drawSeatsState();drawTablet();drawDrawer();}
function drawSeatsState(){const cabin=$('#cabin');if(!cabin)return;const sx=cabin.clientWidth/W, sy=cabin.clientHeight/H, sc=Math.min(sx,sy);const pos=seatPositions();document.querySelectorAll('.rowLabel').forEach(el=>{const r=Number(el.dataset.row);el.style.top=((82+(r-1)*78+24)*sy)+'px';el.style.fontSize=(10*sc)+'px';});document.querySelectorAll('.seat').forEach(el=>{const p=passengers.find(x=>x.seat===el.dataset.seat);if(!p)return;const s=pos[p.seat];el.style.left=(s.x*sx)+'px';el.style.top=(s.y*sy)+'px';el.style.transform=`scale(${sc}) ${nearSeat()?.seat===p.seat?'translateY(-2px)':''}`;el.classList.toggle('near',nearSeat()?.seat===p.seat);el.classList.toggle('blocked',!!p.blocked);const pass=el.querySelector('.passenger');pass.className='passenger '+p.type+(p.happy>105?' happy':'')+(p.happy<55?' angry':'');let b=el.querySelector('.bubble');if(b)b.remove();if(p.request||p.issue||p.trash){b=document.createElement('div');let cls='bubble';let text='';if(p.issue){cls+=' safe';text=ISSUE[p.issue].code}else if(p.trash){cls+=' trash';text='TRASH'}else{text=ITEMS[p.request].code;if(p.wait>10)cls+=' bad';else if(p.wait>5)cls+=' warn'}b.className=cls;b.textContent=text;el.appendChild(b)}});}
function drawTablet(){const t=$('#tablet');if(!t)return;const urgent=mostUrgent();const near=nearSeat();const target=near?passengers.find(p=>p.seat===near.seat):null;const cartHtml=Array.from({length:cap()}).map((_,i)=>`<div class="slot ${cart[i]?'filled':''} ${i===selectedCart?'active':''}" onclick="selectCart(${i})">${cart[i]?ITEMS[cart[i]].code:''}</div>`).join('');const stockHtml=Object.keys(ITEMS).filter(id=>stock[id]>0).map(id=>`${ITEMS[id].code}${stock[id]}`).join(' · ')||'없음';let hint='좌석 가까이 이동';if(nearGalley())hint='갤리 보충 가능';else if(target){if(target.issue)hint=`${target.seat} ${ISSUE[target.issue].name}`;else if(target.request)hint=`${target.seat} ${ITEMS[target.request].name}`;else if(target.trash)hint=`${target.seat} 쓰레기`;else hint=`${target.seat} 이상 없음`;}t.innerHTML=`<div class="tabletHeader"><div><h2>${phase==='landing'?'착륙 준비':'운항 중'}</h2><small>${selectedFlight.dest}행</small></div><div class="bigTimer">${fmt(remaining)}</div></div><div class="tabletCard statusCard"><div class="statusLine"><span>만족도</span><b class="${satisfaction<60?'badText':satisfaction>90?'goodText':''}">${Math.round(satisfaction)}%</b></div><div class="progressBar"><span style="width:${satisfaction}%"></span></div><div class="statusLine"><span>안전</span><b class="${safety<60?'badText':safety>90?'goodText':''}">${Math.round(safety)}%</b></div><div class="progressBar"><span style="width:${safety}%"></span></div></div><div class="tabletCard"><strong>카트 ${cart.length}/${cap()}</strong><div class="cartSlots">${cartHtml}</div></div><div class="actionHint">${hint}</div><div class="tabletCard stockMini"><strong>재고</strong><small>${stockHtml}</small></div><div class="tabletCard"><strong>${save.owned.tablet?'긴급':'로그'}</strong><div class="log">${urgent&&save.owned.tablet?`<p class="alert">${urgent.seat} ${urgent.issue?ISSUE[urgent.issue].name:urgent.request?ITEMS[urgent.request].name:'쓰레기'} ${Math.floor(urgent.wait)}초</p>`:''}${logs.join('')||'<p>대기 중</p>'}</div></div>`;}
function drawDrawer(){const d=$('#supplyDrawer');if(!d)return;if(!supplyOpen){d.classList.remove('open');return}d.classList.add('open');const buttons=Object.keys(ITEMS).map(id=>`<button class="drawerBtn" onclick="loadCart('${id}')" ${(!stock[id]||cart.length>=cap())?'disabled':''}><b>${ITEMS[id].code}</b> ${ITEMS[id].name}<small>${stock[id]||0}</small></button>`).join('');d.innerHTML=`<div class="toolbar"><h3 style="margin:0">갤리</h3><button class="ghost" onclick="toggleSupplyDrawer(false)">닫기</button></div><div class="drawerGrid">${buttons}<button class="drawerBtn red" onclick="emptyCart()">비우기</button></div>`;}
function fmt(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function nearGalley(){return player.y>H-118}
function nearSeat(){const pos=seatPositions();let best=null,dist=9999;for(const p of passengers){const s=pos[p.seat];const cx=s.x+38,cy=s.y+34;const d=Math.hypot(player.x-cx,player.y-cy);if(d<dist){dist=d;best=p}}return dist<78?best:null}
function mostUrgent(){return passengers.filter(p=>p.request||p.issue||p.trash).sort((a,b)=>b.wait-a.wait)[0]}
function selectCart(i){selectedCart=clamp(i,0,Math.max(0,cap()-1));sfx('click');drawGame();}
function toggleSupplyDrawer(v){if(!nearGalley()&&v){showToast('갤리로 이동하세요.');return}supplyOpen=!!v;sfx('click');drawDrawer();}
function loadCart(id){if(cart.length>=cap()){showToast('카트가 가득 찼습니다.');return}if((stock[id]||0)<=0){showToast('재고가 없습니다.');return}stock[id]--;cart.push(id);selectedCart=cart.length-1;sfx('ok');drawGame();}
function emptyCart(){for(const id of cart)stock[id]=(stock[id]||0)+1;cart=[];selectedCart=0;sfx('click');drawGame();}
function seatClick(seat){const p=passengers.find(x=>x.seat===seat);if(!p)return;if(nearSeat()?.seat!==seat){showToast('좌석 가까이 이동하세요.');return}interact();}
function interact(){if(screen!=='game')return;initAudio();if(nearGalley()){toggleSupplyDrawer(!supplyOpen);return}supplyOpen=false;const p=nearSeat();if(!p){showToast('대상 없음');return}if(p.issue){resolveIssue(p);return}if(p.trash){p.trash=false;p.wait=0;p.happy+=4;satisfaction+=1.2;comboUp();log(`${p.seat} 쓰레기 수거 완료`,'goodText');sfx('ok');return}if(p.request){const item=cart[selectedCart];if(!item){showToast('물품 선택 필요');return}if(item===p.request||substituteOk(item,p.request,p.type)){cart.splice(selectedCart,1);selectedCart=Math.max(0,Math.min(selectedCart,cart.length-1));p.served++;p.request=null;p.wait=0;p.happy+=18;satisfaction+=3.5;p.trash=Math.random()<.55;comboUp();rewardBonus+=combo>=4?4:0;log(`${p.seat} ${ITEMS[item].name} 제공 완료`,'goodText');sfx('ok');}
    else{cart.splice(selectedCart,1);p.happy-=18;satisfaction-=5;mistake(`${p.seat}: 요청과 다른 물품입니다.`,true);}}
  else{message=`${p.seat} 승객은 현재 요청이 없습니다.`;showToast(message);}}
function substituteOk(item,req,type){return type==='child'&&req==='toy'&&item==='juice'}
function resolveIssue(p){p.issue=null;p.wait=0;p.happy+=8;safety+=5;satisfaction+=1.5;comboUp();log(`${p.seat} 안전 문제 해결`,'goodText');sfx('ok');}
function mistake(txt,heavy){mistakes+=heavy?2:1;combo=0;satisfaction-=heavy?6:2.5;safety-=heavy?4:1;log(txt,'badText');showToast(txt);sfx('bad');}
function comboUp(){combo++;if(combo>0&&combo%5===0){rewardBonus+=18;banner(`${combo}연속 처리! 보너스 +18`);sfx('coin')}}
function spawnRequest(){const candidates=passengers.filter(p=>!p.request&&!p.issue&&!p.trash);if(!candidates.length)return;const p=candidates[Math.floor(Math.random()*candidates.length)];const opts=Object.keys(ITEMS).filter(id=>ITEMS[id].need.includes(p.type));p.request=opts[Math.floor(Math.random()*opts.length)]||'water';p.wait=0;p.lastRequest=remaining;log(`${p.seat} 승객이 ${ITEMS[p.request].name} 요청`);}
function spawnIssue(extra=false){const candidates=passengers.filter(p=>!p.issue&&!p.request);if(!candidates.length)return;const p=candidates[Math.floor(Math.random()*candidates.length)];const list=phase==='landing'?['belt','table','bag','phone']:['belt','table','bag'];p.issue=list[Math.floor(Math.random()*list.length)];p.wait=0;safety-=extra?1.5:.5;log(`${p.seat} ${ISSUE[p.issue].name} 확인 필요`,'alert');}
function spawnLandingIssues(){for(let i=0;i<Math.min(7,selectedFlight.rows+1);i++)setTimeout(()=>spawnIssue(true),i*280);}
function spawnEvent(){const type=selectedFlight.events[Math.floor(Math.random()*selectedFlight.events.length)];if(type==='turbulence'){turbulence=5.5;banner('난기류','bad');sfx('event');if(Math.random()<(save.owned.stable ? .25 : .62)&&cart.length){const lost=cart.pop();stock[lost]=(stock[lost]||0);mistake(`난기류: ${ITEMS[lost].name} 쏟음`,true)}spawnIssue(true);spawnIssue(true);}
  else if(type==='spill'){const p=passengers[Math.floor(Math.random()*passengers.length)];p.request='tissue';p.wait=0;p.happy-=4;banner(`${p.seat} 쏟음`,'warn');log(`${p.seat} 휴지 필요`,'alert');}
  else if(type==='sick'){const p=passengers.filter(x=>x.type==='sick')[0]||passengers[Math.floor(Math.random()*passengers.length)];p.request='medbag';p.wait=0;banner(`${p.seat} 멀미`,'bad');log(`${p.seat} 멀미봉투 필요`,'badText');}
  else if(type==='lights'){lightsOut=8;banner('조명 이상','bad');satisfaction-=3;spawnIssue(true);}
  else if(type==='bagDrop'){spawnIssue(true);spawnIssue(true);banner('통로 짐 낙하','warn');}
}
function eventName(e){return {spill:'쏟음',turbulence:'난기류',sick:'멀미',lights:'조명',bagDrop:'짐 낙하'}[e]||e}
function crewAssist(){const target=passengers.find(p=>p.trash)||passengers.find(p=>p.issue);if(!target)return;if(target.trash){target.trash=false;log('보조 승무원이 쓰레기를 수거했습니다.','goodText')}else if(target.issue){target.issue=null;target.wait=0;safety+=2;log('보조 승무원이 안전 문제를 도왔습니다.','goodText')}}
function finishRun(){stopGame();screen='result';mobilePad.classList.add('hidden');mobileActions.classList.add('hidden');document.body.classList.remove('dim');const sat=Math.round(clamp(satisfaction,0,120)), safe=Math.round(clamp(safety,0,120)), sp=Math.round(clamp(speedScore,0,120));const avg=Math.round((sat+safe+sp)/3);const grade=avg>=95?'S':avg>=85?'A':avg>=72?'B':avg>=58?'C':'D';const stars='★★★★★☆☆☆☆☆'.slice(5-Math.max(1,Math.min(5,Math.round(avg/20))),10-Math.max(1,Math.min(5,Math.round(avg/20))));let earned=Math.max(30,Math.round(selectedFlight.coins*(avg/100)+rewardBonus-mistakes*8));save.coins+=earned;save.best=Math.max(save.best,avg);save.total++;writeSave();updateTop('비행 결과',`${selectedFlight.dest} · ${grade}`);const improve=avg>=85?'훌륭합니다. 더 어려운 노선에 도전해도 됩니다.':sat<safe?'승객 요청 우선순위를 더 빠르게 잡아보세요.':'착륙 전 안전 문제를 먼저 처리해보세요.';stage.innerHTML=`<div class="screen center"><div class="hero" style="text-align:center"><h1 class="big" style="font-size:58px">${grade} 등급</h1><div class="stars">${stars}</div><p class="sub">${selectedFlight.dest}에 도착했습니다.</p><div class="resultGrid"><div class="panel"><h2>평가</h2><p>승객 만족도 <b>${sat}%</b></p><p>안전 평가 <b>${safe}%</b></p><p>시간/동선 <b>${sp}%</b></p><p>실수 <b>${mistakes}회</b></p></div><div class="panel"><h2>보상</h2><p>운항 보상</p><p style="font-size:28px;font-weight:1000;margin:4px 0">${earned} 코인</p><p>현재 보유 코인 <b>${save.coins}</b></p></div></div><div class="notice">${improve}</div><div class="row"><button class="primary" onclick="renderFlightSelect()">다음 비행</button><button class="navy" onclick="renderShop()">업그레이드</button><button onclick="renderHome()">시작 화면</button></div></div></div>`;sfx('coin');}
function renderShop(){stopGame();screen='shop';updateTop('업그레이드','장비 구입');mobilePad.classList.add('hidden');mobileActions.classList.add('hidden');const cards=UPGRADES.map(u=>`<div class="panel shopCard ${save.owned[u.id]?'owned':''}"><h2>${u.name}</h2><p>${u.desc}</p><p><b>${u.cost} 코인</b></p>${save.owned[u.id]?'<button disabled>구입 완료</button>':`<button class="primary" onclick="buyUpgrade('${u.id}')">구입</button>`}</div>`).join('');stage.innerHTML=`<div class="screen"><div class="toolbar" style="margin-bottom:12px"><button onclick="renderHome()">← 시작 화면</button><span class="chip">보유 코인 ${save.coins}</span></div><div class="shopGrid">${cards}</div></div>`;}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return;if(save.owned[id])return;if(save.coins<u.cost){showToast('코인이 부족합니다.');return}save.coins-=u.cost;save.owned[id]=true;writeSave();showToast(`${u.name} 구입 완료`);sfx('coin');renderShop();}
window.addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(screen==='game'&&(e.key===' '||e.key==='Enter'||e.key.toLowerCase()==='e')){e.preventDefault();interact()}const n=parseInt(e.key,10);if(screen==='game'&&n>=1&&n<=9)selectCart(n-1);});
window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
mobilePad.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.dir;if(d==='up')keys.ArrowUp=true;if(d==='down')keys.ArrowDown=true;if(d==='left')keys.ArrowLeft=true;if(d==='right')keys.ArrowRight=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>mobilePad.addEventListener(ev,()=>{keys.ArrowUp=keys.ArrowDown=keys.ArrowLeft=keys.ArrowRight=false}));
$('#mInteract').onclick=()=>interact();
$('#mSwap').onclick=()=>{selectedCart=(selectedCart+1)%Math.max(1,cap());drawGame();};
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.seat,.galley,.slot,.supplyCard'))sfx('click')},{passive:true});
loadSave();renderHome();
</script>
</body>
</html>
