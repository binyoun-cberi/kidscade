<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 필수 영단어 스피드 퀴즈</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #777777;
            --danger-color: #E74C3C;
            --success-color: #2ECC71;
            --rank-bronze: #cd7f32;
            --rank-silver: #bdc3c7;
            --rank-gold: #f1c40f;
            --rank-platinum: #7f8c8d;
            --rank-diamond: #3498db;
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            transition: background-color 0.8s ease; 
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            overflow-y: auto;
            max-height: 95vh;
            position: relative;
            z-index: 10;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        /* 공통 유틸리티 */
        .hidden { display: none !important; }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn:hover { background-color: var(--primary-hover); opacity: 0.9; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .flex-row { display: flex; gap: 10px; margin-top: 15px; }

        /* 랭크 뱃지 스타일 */
        .rank-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .rank-unranked { background: #95a5a6; }
        .rank-bronze { background: var(--rank-bronze); }
        .rank-silver { background: var(--rank-silver); color: #333; }
        .rank-gold { background: var(--rank-gold); color: #333; }
        .rank-platinum { background: var(--rank-platinum); }
        .rank-diamond { background: var(--rank-diamond); }

        .rank-result {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* 설정 화면 */
        .setting-group {
            margin: 20px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .radio-group {
            display: flex;
            gap: 10px;
        }
        .radio-group label {
            flex: 1;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: normal;
            margin: 0;
            border: 2px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }
        .radio-group input[type="radio"] { display: none; }
        .radio-group input[type="radio"]:checked + label {
            background: #E8F0FE;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* 게임 화면 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .bgm-toggle-btn {
            background: #f9f9f9;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .bgm-toggle-btn.off {
            color: var(--text-muted);
            border-color: var(--text-muted);
        }

        .score-board {
            background: #E8F0FE;
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }
        .timer {
            font-size: 24px;
            color: var(--primary-color);
            transition: color 0.3s;
        }
        .timer.danger {
            color: var(--danger-color);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* 콤보 효과 */
        .combo-display {
            font-size: 20px;
            font-weight: 900;
            color: #FF9800;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.2s ease;
        }
        .combo-display.active {
            opacity: 1;
            animation: combo-pop 0.3s ease-in-out forwards;
        }
        .combo-display.combo-high {
            color: var(--danger-color);
            font-size: 24px;
            text-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
        }
        @keyframes combo-pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .question-box {
            background: #f9f9f9;
            padding: 30px 20px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 30px;
            word-break: keep-all;
            border: 1px solid #eee;
            color: var(--primary-color);
        }
        .question-box.word-mode {
            font-size: 32px;
        }
        
        /* 객관식 버튼 */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .choice-grid.desc-mode {
            grid-template-columns: 1fr 1fr; /* 영단어는 짧아서 2줄도 괜찮음 */
        }
        .choice-btn {
            background: #f1f1f1;
            border: 2px solid transparent;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            word-break: keep-all;
            line-height: 1.4;
        }
        .choice-btn:hover:not(:disabled) {
            background: #e2e2e2;
        }
        
        .choice-btn.correct {
            background-color: var(--success-color) !important;
            color: white;
            border-color: var(--success-color);
        }
        .choice-btn.wrong {
            background-color: var(--danger-color) !important;
            color: white;
            border-color: var(--danger-color);
        }

        /* 결과 화면 */
        .result-box {
            margin: 20px 0;
            padding: 20px;
            background: #FDFBF7;
            border-radius: 12px;
            border: 1px solid #F1E5D1;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }
        .best-score {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 10px;
        }
        
        /* 오답 노트 */
        .wrong-list {
            max-height: 180px;
            overflow-y: auto;
            background: #fff;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .wrong-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #ddd;
        }
        .wrong-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .wrong-desc { color: var(--text-main); margin-bottom: 6px; font-weight: bold; font-size: 16px;}
        .wrong-word { color: var(--success-color); font-weight: bold; }
        .user-word { color: var(--danger-color); text-decoration: line-through; margin-right: 8px; }

        /* ================= 방해 애니메이션(Distractions) ================= */
        #distraction-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; /* 클릭을 막지 않음 */
            z-index: 1000;
            overflow: hidden;
        }
        .distraction-entity {
            position: absolute;
            font-size: 50px;
            user-select: none;
            will-change: transform, opacity;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes anim-ghost {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.9; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2); }
        }
        .anim-ghost { animation: anim-ghost 3s ease-in-out forwards; }

        @keyframes anim-float {
            0% { transform: translateY(110vh) rotate(-10deg); }
            100% { transform: translateY(-20vh) rotate(10deg); }
        }
        .anim-float { top: 0; animation: anim-float 6s linear forwards; }

        @keyframes anim-jump {
            0% { transform: translate(-10vw, 90vh); }
            20% { transform: translate(10vw, 60vh); }
            40% { transform: translate(30vw, 90vh); }
            60% { transform: translate(50vw, 60vh); }
            80% { transform: translate(70vw, 90vh); }
            100% { transform: translate(110vw, 60vh); }
        }
        .anim-jump { top: 0; left: 0; animation: anim-jump 4s linear forwards; }

        @keyframes anim-climb {
            0% { transform: translateY(110vh) rotate(10deg); }
            50% { transform: translateY(50vh) rotate(-10deg); }
            100% { transform: translateY(-20vh) rotate(10deg); }
        }
        .anim-climb { top: 0; animation: anim-climb 5s ease-in-out forwards; }

        @keyframes anim-run-fast {
            0% { transform: translateX(-20vw) scaleX(-1); }
            100% { transform: translateX(120vw) scaleX(-1); }
        }
        .anim-run-fast { left: 0; animation: anim-run-fast 3s linear forwards; }

        @keyframes anim-fly-arc {
            0% { transform: translate(-10vw, 60vh) rotate(0deg); }
            50% { transform: translate(50vw, 20vh) rotate(360deg); }
            100% { transform: translate(120vw, 70vh) rotate(720deg); }
        }
        .anim-fly-arc { top: 0; left: 0; animation: anim-fly-arc 4s linear forwards; }

        @keyframes anim-jump-catch {
            0% { transform: translate(-20vw, 90vh) scaleX(-1); }
            50% { transform: translate(45vw, 30vh) scaleX(-1); }
            100% { transform: translate(110vw, 90vh) scaleX(-1); }
        }
        .anim-jump-catch { top: 0; left: 0; animation: anim-jump-catch 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        @keyframes anim-erratic {
            0% { transform: translate(-10vw, 50vh); }
            25% { transform: translate(30vw, 10vh); }
            50% { transform: translate(60vw, 80vh); }
            75% { transform: translate(80vw, 20vh); }
            100% { transform: translate(110vw, 50vh); }
        }
        .anim-erratic { top: 0; left: 0; font-size: 30px; animation: anim-erratic 5s linear forwards; }

        @keyframes anim-spaceship {
            0% { transform: translate(-20vw, 20vh) scale(0.5); }
            25% { transform: translate(30vw, 5vh) scale(1.5) rotate(15deg); }
            50% { transform: translate(80vw, 40vh) scale(2) rotate(-15deg); }
            75% { transform: translate(30vw, 80vh) scale(1) rotate(20deg); }
            100% { transform: translate(-20vw, 20vh) scale(0.5); }
        }
        .anim-spaceship { top: 0; left: 0; font-size: 60px; animation: anim-spaceship 6s ease-in-out forwards; }
    </style>
</head>
<body>

<!-- 방해 애니메이션을 그려줄 전용 레이어 -->
<div id="distraction-layer"></div>

<div class="container">
    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1>초등 영단어 퀴즈</h1>
        <p style="color: var(--text-muted); margin-bottom: 15px;">초등학교 5~6학년 필수 영단어 500개 총집합!</p>
        
        <div id="my-rank-display" class="rank-badge rank-unranked">현재 랭크: 언랭크</div>
        
        <div class="setting-group" style="margin-top: 5px;">
            <label>제한 시간 (1문제 당)</label>
            <div class="radio-group">
                <input type="radio" id="time5" name="timeSetting" value="5">
                <label for="time5">5초</label>
                <input type="radio" id="time10" name="timeSetting" value="10" checked>
                <label for="time10">10초</label>
                <input type="radio" id="time15" name="timeSetting" value="15">
                <label for="time15">15초</label>
            </div>
        </div>

        <div class="setting-group">
            <label>문제 유형</label>
            <div class="radio-group">
                <input type="radio" id="typeWord" name="typeSetting" value="word" checked>
                <label for="typeWord">영단어 보고 뜻 맞추기</label>
                <input type="radio" id="typeDesc" name="typeSetting" value="desc">
                <label for="typeDesc">뜻 보고 영단어 맞추기</label>
            </div>
        </div>

        <div class="flex-row">
            <button class="btn" style="background-color: #2ecc71; flex: 1; font-size:14px;" onclick="startGame(false, 'normal')">연습 (1판)</button>
            <button class="btn" id="rank-btn" style="flex: 2; font-size:15px;" onclick="startGame(false, 'rank')">배치고사 시작 (5판)</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <div id="question-counter">문제 1 / 20</div>
            <div style="display:flex; gap: 5px;">
                <button id="bgm-toggle" class="bgm-toggle-btn" onclick="toggleBGM()">🎵 BGM ON</button>
            </div>
            <div id="timer-display" class="timer">10초</div>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px;">
            <div id="current-score-display" class="score-board" style="margin-bottom: 0;">현재 점수: 0점</div>
            <div id="combo-display" class="combo-display"></div>
        </div>
        
        <div id="question-text" class="question-box">문제 설명이 여기에 나옵니다.</div>

        <div id="choice-input-container" class="choice-grid hidden">
            <!-- 동적 생성 -->
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="hidden">
        <h2 id="result-title">게임 종료!</h2>
        <div class="result-box">
            <p id="result-subtitle" style="margin: 0;">당신의 최종 점수</p>
            <div id="final-score" class="score-display">0점</div>
            <div id="rank-result-display" class="rank-result hidden">다이아몬드</div>
            <div id="best-score" class="best-score">역대 최고 점수: 0점</div>
        </div>

        <!-- 오답 노트 영역 -->
        <div class="setting-group">
            <label style="color: var(--danger-color);">오답 노트 (틀린 문제)</label>
            <div id="wrong-answers-list" class="wrong-list">
                <!-- 자바스크립트로 생성됨 -->
            </div>
        </div>

        <!-- 종료 화면에서의 설정 영역 -->
        <div id="res-setting-group">
            <div class="setting-group">
                <label>제한 시간 (다음 게임)</label>
                <div class="radio-group">
                    <input type="radio" id="res-time5" name="resTimeSetting" value="5">
                    <label for="res-time5">5초</label>
                    <input type="radio" id="res-time10" name="resTimeSetting" value="10" checked>
                    <label for="res-time10">10초</label>
                    <input type="radio" id="res-time15" name="resTimeSetting" value="15">
                    <label for="res-time15">15초</label>
                </div>
            </div>

            <div class="setting-group">
                <label>문제 유형 (다음 게임)</label>
                <div class="radio-group">
                    <input type="radio" id="res-typeWord" name="resTypeSetting" value="word" checked>
                    <label for="res-typeWord">영단어 보고 뜻 맞추기</label>
                    <input type="radio" id="res-typeDesc" name="resTypeSetting" value="desc">
                    <label for="res-typeDesc">뜻 보고 영단어 맞추기</label>
                </div>
            </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
            <button id="res-next-round-btn" class="btn hidden" style="background-color:#9b59b6;" onclick="startNextRound()">다음 라운드 시작</button>
            <button id="res-restart-btn" class="btn" onclick="startGame(true, currentMode)">다시 하기</button>
            <button class="btn" onclick="goHome()" style="background-color: #999; margin-top: 0;">메인으로 돌아가기</button>
        </div>
    </div>
</div>

<script>
    // 초등 5~6학년 필수 영단어 500개 데이터
    const wordDictionary = [
        // 명사 (사람/가족)
        { word: "family", desc: "가족" }, { word: "parents", desc: "부모님" }, { word: "father", desc: "아버지" },
        { word: "mother", desc: "어머니" }, { word: "brother", desc: "남자 형제" }, { word: "sister", desc: "여자 형제" },
        { word: "uncle", desc: "삼촌, 아저씨" }, { word: "aunt", desc: "이모, 고모" }, { word: "cousin", desc: "사촌" },
        { word: "grandfather", desc: "할아버지" }, { word: "grandmother", desc: "할머니" }, { word: "child", desc: "아이" },
        { word: "children", desc: "아이들" }, { word: "friend", desc: "친구" }, { word: "boy", desc: "소년" },
        { word: "girl", desc: "소녀" }, { word: "man", desc: "남자" }, { word: "woman", desc: "여자" },
        { word: "people", desc: "사람들" }, { word: "baby", desc: "아기" }, { word: "student", desc: "학생" },
        { word: "teacher", desc: "선생님" }, { word: "doctor", desc: "의사" }, { word: "nurse", desc: "간호사" },
        { word: "farmer", desc: "농부" }, { word: "singer", desc: "가수" }, { word: "dancer", desc: "무용수" },
        { word: "actor", desc: "배우" }, { word: "writer", desc: "작가" }, { word: "artist", desc: "화가, 예술가" },
        { word: "pilot", desc: "조종사" }, { word: "police", desc: "경찰관" }, { word: "cook", desc: "요리사" },
        { word: "engineer", desc: "엔지니어, 기술자" }, { word: "scientist", desc: "과학자" },
        
        // 신체/건강
        { word: "head", desc: "머리" }, { word: "hair", desc: "머리카락" }, { word: "face", desc: "얼굴" },
        { word: "eye", desc: "눈" }, { word: "ear", desc: "귀" }, { word: "nose", desc: "코" },
        { word: "mouth", desc: "입" }, { word: "lip", desc: "입술" }, { word: "tooth", desc: "치아 (단수)" },
        { word: "teeth", desc: "치아들 (복수)" }, { word: "neck", desc: "목" }, { word: "shoulder", desc: "어깨" },
        { word: "arm", desc: "팔" }, { word: "hand", desc: "손" }, { word: "finger", desc: "손가락" },
        { word: "leg", desc: "다리" }, { word: "foot", desc: "발 (단수)" }, { word: "feet", desc: "발들 (복수)" },
        { word: "toe", desc: "발가락" }, { word: "body", desc: "몸" }, { word: "heart", desc: "심장, 마음" },
        { word: "blood", desc: "피, 혈액" }, { word: "bone", desc: "뼈" }, { word: "health", desc: "건강" },
        { word: "hospital", desc: "병원" }, { word: "medicine", desc: "약" }, { word: "cold", desc: "감기, 추운" },
        { word: "fever", desc: "열" }, { word: "pain", desc: "통증, 아픔" }, { word: "sick", desc: "아픈" },
        
        // 음식/음료
        { word: "food", desc: "음식" }, { word: "water", desc: "물" }, { word: "milk", desc: "우유" },
        { word: "juice", desc: "주스" }, { word: "coffee", desc: "커피" }, { word: "tea", desc: "차" },
        { word: "bread", desc: "빵" }, { word: "rice", desc: "쌀, 밥" }, { word: "meat", desc: "고기" },

    const bgmController = {
        ctx: null,
        intervalId: null,
        notes: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25], // C Major Pentatonic (긍정적/밝은 느낌)
        isPlaying: false,

        init: function(context) {
            this.ctx = context;
        },

        playNote: function() {
            if (!this.ctx || this.ctx.state !== 'running') return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            const note = this.notes[Math.floor(Math.random() * this.notes.length)];
            osc.frequency.value = note;
            osc.type = 'sine'; 
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            const now = this.ctx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            
            osc.start(now);
            osc.stop(now + 1.0);
        },

        start: function() {
            if (this.isPlaying) return;
            this.isPlaying = true;
            this.playNote();
            this.intervalId = setInterval(() => this.playNote(), 400); 
        },

        stop: function() {
            this.isPlaying = false;
            clearInterval(this.intervalId);
        }
    };

    // ================= 방해모드 (Distraction) 컨트롤러 =================

    function scheduleNextDistraction() {
        const delay = Math.random() * 15000 + 10000; // 10~25초마다 간혹 생성되도록 변경
        distractionTimerId = setTimeout(() => {
            triggerRandomDistraction();
            // 게임 화면일 때만 다음 스케줄
            if (!screens.game.classList.contains('hidden')) {

            }
        }, delay);

    function stopDistractions() {

    function createDistractionEl(emoji, className, cssText, durationMs) {
        const layer = document.getElementById('distraction-layer');
        const el = document.createElement('div');
        el.className = `distraction-entity ${className}`;
        el.textContent = emoji;
        el.style.cssText = cssText;
        layer.appendChild(el);
        setTimeout(() => {
            if(el.parentNode === layer) el.remove();
        }, durationMs);
    }

    // 비프음 재생
    function playBeep(isCorrect) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (isCorrect) {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
    }

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function showScreen(screenName) {
        Object.values(screens).forEach(screen => screen.classList.add('hidden'));
        screens[screenName].classList.remove('hidden');
    }

    function startGame(isRestart = false, mode = 'normal') {
        currentMode = mode;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            bgmController.init(audioCtx);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (isRestart) {
            timeLimit = parseInt(document.querySelector('input[name="resTimeSetting"]:checked').value);
            quizType = document.querySelector('input[name="resTypeSetting"]:checked').value;
            document.querySelector(`input[name="timeSetting"][value="${timeLimit}"]`).checked = true;
            document.querySelector(`input[name="typeSetting"][value="${quizType}"]`).checked = true;
        } else {
            timeLimit = parseInt(document.querySelector('input[name="timeSetting"]:checked').value);
            quizType = document.querySelector('input[name="typeSetting"]:checked').value;
            document.querySelector(`input[name="resTimeSetting"][value="${timeLimit}"]`).checked = true;
            document.querySelector(`input[name="resTypeSetting"][value="${quizType}"]`).checked = true;
        }

        if (currentMode === 'rank') {
            currentRound = 1;
            rankScores = [];
        }

        startRound();
    }

    function startRound() {
        const shuffledWords = shuffleArray([...wordDictionary]);
        currentQuestions = shuffledWords.slice(0, TOTAL_QUESTIONS);
        
        currentIndex = 0;
        totalScore = 0;
        currentCombo = 0; // 콤보 초기화
        wrongAnswers = []; 

        if (currentMode === 'rank') {
            ui.currentScore.textContent = `[승급전 ${currentRound}/5라] 점수: 0점`;
        } else {
            ui.currentScore.textContent = `[연습모드] 점수: 0점`;
        }
        
        // 콤보 UI 초기화
        ui.comboDisplay.className = 'combo-display'; 
        ui.comboDisplay.textContent = '';
        
        showScreen('game');
        loadQuestion();
        
        if (isBgmEnabled && !bgmController.isPlaying) {
            bgmController.start();
        }
        
        // 방해모드 항상 작동 (간혹 등장)
        clearTimeout(distractionTimerId);
        scheduleNextDistraction();
    }

    function startNextRound() {
        currentRound++;
        startRound();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        const currentQ = currentQuestions[currentIndex];
        
        ui.counter.textContent = `문제 ${currentIndex + 1} / ${TOTAL_QUESTIONS}`;
        ui.timer.classList.remove('danger');
        ui.choiceContainer.classList.remove('hidden');
        
        if (quizType === 'word') { // 영단어 보고 뜻 맞추기
            ui.question.textContent = currentQ.word;
            ui.question.classList.add('word-mode'); // 영단어는 크게
            ui.choiceContainer.classList.add('desc-mode'); // 뜻 보기는 2줄 혹은 1줄로 길게
        } else { // 뜻 보고 영단어 맞추기
            ui.question.textContent = currentQ.desc;
            ui.question.classList.remove('word-mode');
            ui.choiceContainer.classList.remove('desc-mode');
        }

        setupChoiceMode(currentQ);

        timeLeft = timeLimit;
        ui.timer.textContent = `${timeLeft}초`;
        timerInterval = setInterval(updateTimer, 1000);
    }

    function setupChoiceMode(currentQ) {
        ui.choiceContainer.innerHTML = '';
        
        let correctText = quizType === 'word' ? currentQ.desc : currentQ.word;
        
        const wrongTexts = wordDictionary
            .filter(item => item.word !== currentQ.word && item.word)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(item => quizType === 'word' ? item.desc : item.word);
            
        const choices = shuffleArray([correctText, ...wrongTexts]);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = text;
            btn.onclick = (e) => submitAnswer(text, e.target);
            ui.choiceContainer.appendChild(btn);
        });
    }

    function updateTimer() {
        timeLeft--;
        ui.timer.textContent = `${timeLeft}초`;
        
        if (timeLeft <= 3) {
            ui.timer.classList.add('danger');
        }

        if (timeLeft <= 0) {
            submitAnswer(null); 
        }
    }

    function submitAnswer(userAnswer, btnElement = null) {
        clearInterval(timerInterval);
        const currentQ = currentQuestions[currentIndex];
        let scoreEarned = 0;
        
        let correctText = quizType === 'word' ? currentQ.desc : currentQ.word;
        let questionText = quizType === 'word' ? currentQ.word : currentQ.desc;
        
        let isCorrect = (userAnswer === correctText);

        const choiceButtons = document.querySelectorAll('.choice-btn');
        choiceButtons.forEach(b => b.disabled = true);

        if (isCorrect) {
            playBeep(true); 
            
            // 콤보 증가 및 UI 업데이트
            currentCombo++;
            ui.comboDisplay.textContent = `${currentCombo} COMBO!`;
            ui.comboDisplay.className = 'combo-display active';
            if (currentCombo >= 3) {
                ui.comboDisplay.classList.add('combo-high');
            }
            // 애니메이션 재시작 트릭
            ui.comboDisplay.style.animation = 'none';
            ui.comboDisplay.offsetHeight;
            ui.comboDisplay.style.animation = null;

            const elapsedTime = timeLimit - timeLeft;
            
            if (elapsedTime <= 5) {
                scoreEarned = 10;
            } else {
                scoreEarned = 10 - (elapsedTime - 5);
                if (scoreEarned < 0) scoreEarned = 0;
            }

            if (btnElement) {
                btnElement.classList.add('correct');
            }

        } else {
            playBeep(false); 
            scoreEarned = 0; 
            
            // 콤보 끊김
            currentCombo = 0;
            ui.comboDisplay.className = 'combo-display';
            ui.comboDisplay.textContent = '';
            
            wrongAnswers.push({
                question: questionText,
                correctAnswer: correctText,
                userAnswer: userAnswer ? userAnswer : '시간 초과 / 미선택'
            });

            if (btnElement) {
                btnElement.classList.add('wrong');
            }
            choiceButtons.forEach(b => {
                if (b.textContent === correctText) {
                    b.classList.add('correct');
                }
            });
        }

        totalScore += scoreEarned;
        
        if (currentMode === 'rank') {
            ui.currentScore.textContent = `[승급전 ${currentRound}/5라] 점수: ${totalScore}점`;
        } else {
            ui.currentScore.textContent = `[연습모드] 점수: ${totalScore}점`;
        }

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 1000);
    }

    function updateBestScore(score) {
        const storageKey = 'engSpeedQuizBestScore'; // 영단어 퀴즈용 별도 키 사용
        let bestScore = localStorage.getItem(storageKey) || 0;
        bestScore = parseInt(bestScore);

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem(storageKey, bestScore);
        }
        ui.bestScore.textContent = `역대 1판 최고 점수: ${bestScore}점`;
    }

    function endGame() {
        bgmController.stop(); 
        stopDistractions(); // 게임 종료 시 방해 모드 정지

        showScreen('result');
        
        const resSettingGroup = document.getElementById('res-setting-group');
        const resNextRoundBtn = document.getElementById('res-next-round-btn');
        const resRestartBtn = document.getElementById('res-restart-btn');
        const resultTitle = document.getElementById('result-title');
        const resultSubtitle = document.getElementById('result-subtitle');
        const rankResultDisplay = document.getElementById('rank-result-display');
        const bestScoreDisplay = document.getElementById('best-score');

        resSettingGroup.classList.remove('hidden');
        resNextRoundBtn.classList.add('hidden');
        resRestartBtn.classList.remove('hidden');
        rankResultDisplay.classList.add('hidden');
        bestScoreDisplay.classList.remove('hidden');

        if (currentMode === 'normal') {
            resultTitle.textContent = "연습 게임 종료!";
            resultSubtitle.textContent = "당신의 최종 점수";
            ui.finalScore.textContent = `${totalScore}점`;
            
            updateBestScore(totalScore);
            
            resRestartBtn.textContent = "다시 하기 (연습)";
            resRestartBtn.onclick = () => startGame(true, 'normal');

        } else if (currentMode === 'rank') {
            rankScores.push(totalScore);
            updateBestScore(totalScore); 
            
            if (currentRound < TOTAL_ROUNDS) {
                resultTitle.textContent = `승급전 ${currentRound}라운드 종료`;
                resultSubtitle.textContent = `이번 라운드 획득 점수`;
                ui.finalScore.textContent = `${totalScore}점`;
                
                resSettingGroup.classList.add('hidden'); 
                resNextRoundBtn.classList.remove('hidden');
                resRestartBtn.classList.add('hidden');
                bestScoreDisplay.classList.add('hidden');
            } else {
                const averageScore = rankScores.reduce((a, b) => a + b, 0) / TOTAL_ROUNDS;
                let newRank = '브론즈';
                let rankColorClass = 'rank-bronze';
                
                if (averageScore >= 180) { newRank = '다이아몬드'; rankColorClass = 'rank-diamond'; }
                else if (averageScore >= 150) { newRank = '플래티넘'; rankColorClass = 'rank-platinum'; }
                else if (averageScore >= 120) { newRank = '골드'; rankColorClass = 'rank-gold'; }
                else if (averageScore >= 90) { newRank = '실버'; rankColorClass = 'rank-silver'; }
                
                myRank = newRank;
                localStorage.setItem('engSpeedQuizRank', myRank); // 영단어 퀴즈용 별도 랭크 저장
                updateRankUI();

                resultTitle.textContent = "랭크 판정 완료!";
                resultSubtitle.textContent = `5판 평균 점수: ${averageScore.toFixed(1)}점`;
                ui.finalScore.textContent = ``; 
                
                rankResultDisplay.textContent = newRank;
                rankResultDisplay.className = `rank-result ${rankColorClass}`;
                rankResultDisplay.classList.remove('hidden');

                resSettingGroup.classList.remove('hidden');
                resRestartBtn.classList.remove('hidden');
                resRestartBtn.textContent = "승급전 다시 도전";
                resRestartBtn.onclick = () => startGame(true, 'rank');
            }
        }
        
        const wrongList = document.getElementById('wrong-answers-list');
        if (wrongAnswers.length > 0) {
            wrongList.innerHTML = wrongAnswers.map(item => `
                <div class="wrong-item">
                    <div class="wrong-desc">Q. ${item.question}</div>
                    <div>
                        <span class="user-word">${item.userAnswer}</span>
                        <span class="wrong-word">정답: ${item.correctAnswer}</span>
                    </div>
                </div>
            `).join('');
        } else {
            wrongList.innerHTML = '<div style="text-align:center; padding:15px; color:var(--success-color); font-weight:bold;">모두 맞췄습니다! 완벽해요! 🎉</div>';
        }
    }

    function goHome() {
        bgmController.stop(); 
        stopDistractions();
        showScreen('start');
    }

    window.onload = () => {
        myRank = localStorage.getItem('engSpeedQuizRank') || '언랭크';
        updateRankUI();
        
        if(!localStorage.getItem('engSpeedQuizBestScore')){
            localStorage.setItem('engSpeedQuizBestScore', 0);
        }
    };
</script>

</body>
</html>
