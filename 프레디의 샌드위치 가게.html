<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우주 샌드위치 가게</title>
<style>
:root{--ink:#2f241d;--cream:#fff4d8;--wood:#bd7a43;--wood2:#8f542f;--mint:#9fe0bd;--red:#e8685b;--gold:#ffd66b;--space:#171c35}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,'Malgun Gothic',sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 10%,#52649a 0 1px,transparent 2px),radial-gradient(circle at 75% 18%,#fff 0 1px,transparent 2px),linear-gradient(#171c35,#252c4d);background-size:80px 80px,110px 110px,auto;overflow-x:hidden}button{font:inherit;cursor:pointer}#app{max-width:1080px;margin:auto;padding:14px 16px 30px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;gap:12px}.top h1{font-size:clamp(20px,4vw,32px);margin:0}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff16;border:1px solid #ffffff2d;border-radius:999px;padding:7px 11px;font-weight:800}.order{margin:12px 0;background:var(--cream);border:4px solid #493426;border-radius:18px;padding:12px 16px;box-shadow:0 8px 0 #10152b}.order-head{display:flex;align-items:center;gap:12px}.alien{font-size:42px}.speech{flex:1}.speech b{font-size:18px}.speech p{margin:4px 0 0;line-height:1.5}.steps{display:flex;gap:7px;margin-top:9px}.step{flex:1;text-align:center;padding:7px;border-radius:10px;background:#eadbb9;font-size:12px;font-weight:800}.step.on{background:#ffda72;box-shadow:inset 0 -3px #dca93b}.counter{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:stretch}.board-wrap{position:relative;padding:22px 22px 18px;border-radius:24px;background:#62402d;box-shadow:0 14px 0 #11172b}.board{position:relative;min-height:430px;border-radius:25px;background:linear-gradient(90deg,#c98a52 0 2%,#b8733f 2% 5%,#c98a52 5% 12%,#b97743 12% 14%,#c98a52 14% 100%);box-shadow:inset 0 0 0 7px #e4a86e,inset 0 0 30px #6b3a1d55;overflow:hidden}.board:before{content:"";position:absolute;inset:17px;border:2px solid #7b482a55;border-radius:17px;pointer-events:none}.board-title{position:absolute;left:28px;top:24px;font-weight:900;color:#5f351f;letter-spacing:.4px}.work{position:absolute;left:7%;right:7%;top:78px;height:235px}.ingredient{position:absolute;left:4%;right:4%;top:55px;height:92px;border-radius:18px;box-shadow:0 8px 13px #5b321d55,inset 0 0 0 3px #ffffff45;overflow:visible;touch-action:none}.ingredient.cheese{background:linear-gradient(#ffd85a,#eab43b)}.ingredient.cucumber{background:linear-gradient(#83cb72,#49a663)}.ingredient.ham{background:linear-gradient(#f5a8a1,#df7e84)}.ingredient.tomato{background:linear-gradient(#f17a64,#d94f45)}.ingredient.egg{background:linear-gradient(#fff4ca,#ecd89a)}.cut-line{position:absolute;top:0;bottom:0;width:4px;background:#fff9;box-shadow:0 0 0 1px #70462a;z-index:3}.cut-line:after{content:"";position:absolute;top:-7px;left:-5px;width:12px;height:7px;background:#fff9}.knife{position:absolute;top:5px;width:11px;height:168px;background:linear-gradient(90deg,#aab2b9,#f4fbff 48%,#91999f);border-radius:3px 3px 10px 10px;box-shadow:4px 5px 8px #0005;transform:translateX(-50%) rotate(1deg);z-index:6;pointer-events:none;transition:left .08s}.knife:before{content:"";position:absolute;width:24px;height:58px;background:#3e2c22;border-radius:8px;left:-7px;top:-48px;box-shadow:inset -4px 0 #21150f}.knife.chop{animation:chop .18s ease}.ruler{position:absolute;left:4%;right:4%;top:164px;height:52px;background:linear-gradient(#f6d66c,#e8bb45);border:2px solid #755022;border-radius:5px;display:flex;align-items:flex-end;touch-action:none;cursor:crosshair;box-shadow:0 4px 6px #4d2f1d55}.tick{position:relative;flex:1;height:15px;border-left:1px solid #5a401f}.tick.big{height:26px;border-left-width:2px}.tick span{position:absolute;bottom:27px;left:-8px;width:16px;text-align:center;font-size:10px;font-weight:900}.ruler-tip{position:absolute;left:0;right:0;top:221px;text-align:center;color:#5e3823;font-weight:800;font-size:12px}.pieces{position:absolute;left:4%;right:4%;top:54px;height:95px;display:flex;gap:5px;pointer-events:none}.piece{height:92px;flex:1;border-radius:12px;box-shadow:0 5px 7px #40261955,inset 0 0 0 2px #fff6;animation:separate .3s ease}.piece.cheese{background:#f3c84d}.piece.cucumber{background:#64b96d}.piece.ham{background:#e98e92}.piece.tomato{background:#e45e50}.piece.egg{background:#f4e3a9}@keyframes chop{50%{transform:translateX(-50%) translateY(32px) rotate(-3deg)}}@keyframes separate{from{transform:scale(.93)}to{transform:scale(1)}}.actionbar{position:absolute;left:7%;right:7%;bottom:27px;display:flex;gap:9px;justify-content:center}.big{border:0;border-radius:14px;padding:12px 17px;font-weight:900;background:#fff0c8;color:#3d2b20;box-shadow:0 5px 0 #74462c}.big.primary{background:#ffe076}.big:active{transform:translateY(3px);box-shadow:0 2px 0 #74462c}.big:disabled{opacity:.4;cursor:default}.assembly{background:#f3ead9;border:4px solid #2d2430;border-radius:22px;padding:14px;display:flex;flex-direction:column;min-height:470px}.assembly h2{margin:0 0 8px;font-size:18px}.plate{flex:1;min-height:250px;border-radius:50%;background:radial-gradient(circle,#fff 0 56%,#d5e0e5 57% 66%,#aabac0 67% 69%,transparent 70%);position:relative;display:flex;flex-direction:column-reverse;justify-content:center;align-items:center;padding:35px 28px}.layer{width:155px;height:24px;border-radius:40% 40% 30% 30%;box-shadow:0 3px 4px #0003;animation:drop .3s cubic-bezier(.2,.9,.25,1.2)}.layer.bread{height:38px;background:#dca65a;border:5px solid #b97837}.layer.cheese{background:#f2ca43}.layer.cucumber{background:#5bb665}.layer.ham{background:#e9868e}.layer.tomato{background:#e45b4d}.layer.egg{background:#f3dfa0}@keyframes drop{from{transform:translateY(-100px) rotate(8deg);opacity:.3}to{transform:none;opacity:1}}.tray{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.food{border:2px solid #88745c;background:#fffaf0;border-radius:11px;padding:8px 4px;font-size:12px;font-weight:850}.food:disabled{opacity:.35}.hint{margin:9px 0 0;background:#fff8e7;border-radius:10px;padding:9px;font-size:12px;line-height:1.45}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1e263e;color:white;padding:12px 18px;border-radius:999px;font-weight:900;transition:.2s;z-index:20;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}.overlay{position:fixed;inset:0;background:#10152be8;display:grid;place-items:center;padding:20px;z-index:30}.overlay.hide{display:none}.modal{max-width:520px;background:#fff3d4;border:5px solid #463227;border-radius:24px;padding:25px;text-align:center}.modal h2{font-size:32px;margin:0 0 12px}.modal p{line-height:1.65}.modal .big{width:100%;margin-top:10px}@media(max-width:760px){#app{padding:9px}.top{align-items:flex-start}.counter{grid-template-columns:1fr}.board{min-height:390px}.board-wrap{padding:13px}.assembly{min-height:330px}.plate{min-height:190px}.order{padding:10px}.alien{font-size:34px}.steps{gap:3px}.step{font-size:10px;padding:6px 2px}.work{left:4%;right:4%}}
</style>
</head>
<body>
<div id="app"><div class="top"><h1>🥪 우주 샌드위치 가게</h1><div class="stats"><span class="pill">주문 <b id="round">1</b>/6</span><span class="pill">⭐ <b id="score">0</b></span><span class="pill">최고 <b id="best">0</b></span></div></div>
<section class="order"><div class="order-head"><div class="alien" id="alien">👽</div><div class="speech"><b id="orderTitle"></b><p id="orderText"></p></div></div><div class="steps"><div class="step on" id="s1">① 재료 놓기</div><div class="step" id="s2">② 자로 재기</div><div class="step" id="s3">③ 칼로 자르기</div><div class="step" id="s4">④ 샌드위치에 올리기</div></div></section>
<div class="counter"><div class="board-wrap"><div class="board"><div class="board-title">오늘의 도마 · 눈금은 1 cm</div><div class="work"><div id="ingredient" class="ingredient cheese"></div><div id="pieces" class="pieces"></div><div id="knife" class="knife"></div><div id="ruler" class="ruler"></div><div class="ruler-tip" id="measure">자를 눌러 칼 위치를 정하세요.</div></div><div class="actionbar"><button class="big" id="reset">재료 다시 놓기</button><button class="big primary" id="cut">🔪 이 눈금에서 자르기</button></div></div></div>
<aside class="assembly"><h2>🍽️ 조립 접시</h2><div id="plate" class="plate"><div class="layer bread"></div></div><div class="tray" id="tray"></div><div class="hint" id="hint"></div><button class="big primary" id="serve" disabled>손님에게 완성품 내기 🚀</button></aside></div></div>
<div id="toast" class="toast"></div><div id="start" class="overlay"><div class="modal"><h2>도마에서 직접 만들어요</h2><p>재료를 도마에 놓고, <b>노란 자의 cm 눈금</b>을 눌러 칼을 옮기세요. 주문대로 잘랐다면 잘린 조각을 하나씩 샌드위치에 올리면 됩니다.<br><br>계산문제처럼 칸을 고르는 게임이 아니라, 진짜 샌드위치 가게처럼 <b>재기 → 자르기 → 올리기</b>를 반복합니다.</p><button class="big primary" id="go">가게 열기</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),BEST='spaceSandwichBest';
const orders=[
{name:'치즈를 3등분',food:'cheese',emoji:'🧀',label:'치즈',length:12,width:4,piece:4,count:3,alien:'👽'},
{name:'오이를 4등분',food:'cucumber',emoji:'🥒',label:'오이',length:12,width:3,piece:3,count:4,alien:'👾'},
{name:'햄을 2등분',food:'ham',emoji:'🥩',label:'햄',length:10,width:5,piece:5,count:2,alien:'🤖'},
{name:'토마토를 3등분',food:'tomato',emoji:'🍅',label:'토마토',length:9,width:4,piece:3,count:3,alien:'🛸'},
{name:'달걀지단을 4등분',food:'egg',emoji:'🍳',label:'달걀지단',length:16,width:3,piece:4,count:4,alien:'👽'},
{name:'치즈를 5등분',food:'cheese',emoji:'🧀',label:'치즈',length:15,width:4,piece:3,count:5,alien:'👾'}];
let idx=0,score=0,selected=0,cuts=[],ready=false,stacked=0,audio=null;
function tone(f=440,d=.08){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1000)}
function order(){return orders[idx]}
function setSteps(n){for(let i=1;i<=4;i++)$('s'+i).classList.toggle('on',i===n)}
function buildRuler(){let o=order(),r=$('ruler');r.innerHTML='';for(let i=0;i<=o.length;i++){let t=document.createElement('div');t.className='tick '+(i%5===0||i===o.length?'big':'');if(i%2===0||i===o.length)t.innerHTML='<span>'+i+'</span>';t.dataset.cm=i;r.append(t)}}
function load(){let o=order();selected=0;cuts=[];ready=false;stacked=0;$('round').textContent=idx+1;$('score').textContent=score;$('best').textContent=localStorage.getItem(BEST)||0;$('alien').textContent=o.alien;$('orderTitle').textContent=o.emoji+' '+o.name;$('orderText').innerHTML=`${o.label} <b>${o.length}cm × ${o.width}cm</b>를 <b>${o.piece}cm씩 ${o.count}조각</b>으로 잘라 올려 주세요. 한 조각 넓이는 <b>${o.piece*o.width}㎠</b>예요.`;let ing=$('ingredient');ing.innerHTML='';ing.className='ingredient '+o.food;ing.style.display='block';$('pieces').innerHTML='';$('knife').style.left='0%';$('measure').textContent='자를 눌러 칼 위치를 정하세요.';$('cut').disabled=false;$('serve').disabled=true;$('plate').innerHTML='<div class="layer bread"></div>';$('tray').innerHTML='';$('hint').innerHTML=`목표 절단선: <b>${Array.from({length:o.count-1},(_,i)=>(i+1)*o.piece).join('cm · ')}cm</b><br>자를 누르면 가장 가까운 1cm 눈금에 칼이 딱 붙어요.`;buildRuler();setSteps(1);setTimeout(()=>setSteps(2),350)}
function chooseAt(clientX){let r=$('ruler').getBoundingClientRect(),o=order();selected=Math.max(0,Math.min(o.length,Math.round((clientX-r.left)/r.width*o.length)));$('knife').style.left=(selected/o.length*100)+'%';$('measure').innerHTML=`칼 위치 <b>${selected} cm</b> · ${selected===0||selected===o.length?'끝에서는 자를 수 없어요.':'여기서 자를까요?'}`;setSteps(3);tone(380,.04)}
$('ruler').addEventListener('pointerdown',e=>{e.preventDefault();chooseAt(e.clientX)});$('ruler').addEventListener('pointermove',e=>{if(e.buttons)chooseAt(e.clientX)});
function drawPieces(){let o=order(),p=$('pieces');p.innerHTML='';for(let i=0;i<o.count;i++){let e=document.createElement('div');e.className='piece '+o.food;p.append(e)}$('ingredient').style.display='none'}
$('cut').onclick=()=>{let o=order(),targets=Array.from({length:o.count-1},(_,i)=>(i+1)*o.piece);if(selected<=0||selected>=o.length){toast('자의 안쪽 눈금을 골라 주세요.');tone(150);return}if(cuts.includes(selected)){toast('이미 자른 곳이에요.');return}let next=targets[cuts.length];$('knife').classList.remove('chop');void $('knife').offsetWidth;$('knife').classList.add('chop');tone(170,.05);setTimeout(()=>tone(90,.05),60);if(selected!==next){score=Math.max(0,score-10);$('score').textContent=score;toast(`앗! 다음 절단선은 ${next}cm예요.`);return}cuts.push(selected);score+=20;$('score').textContent=score;let line=document.createElement('i');line.className='cut-line';line.style.left=(selected/o.length*100)+'%';$('ingredient').append(line);toast(`${selected}cm에서 정확히 잘랐어요!`);if(cuts.length===targets.length){ready=true;setTimeout(()=>{drawPieces();makeTray();setSteps(4);$('cut').disabled=true;$('measure').textContent=`${o.piece}cm짜리 ${o.count}조각 완성! 접시에 올려 보세요.`},250)}};
function makeTray(){let o=order(),tray=$('tray');tray.innerHTML='';for(let i=0;i<o.count;i++){let b=document.createElement('button');b.className='food';b.innerHTML=`${o.emoji} ${o.piece}cm 조각<br><small>${o.piece*o.width}㎠</small>`;b.onclick=()=>stack(b);tray.append(b)}}
function stack(btn){if(btn.disabled)return;let o=order();btn.disabled=true;let l=document.createElement('div');l.className='layer '+o.food;$('plate').append(l);stacked++;score+=15;$('score').textContent=score;tone(620+stacked*35,.07);if(stacked===o.count){let top=document.createElement('div');top.className='layer bread';$('plate').append(top);$('serve').disabled=false;$('hint').innerHTML=`완성! ${o.count}조각 × ${o.piece*o.width}㎠ = <b>${o.length*o.width}㎠</b>. 전체 넓이도 그대로예요.`;toast('샌드위치 완성!')}}
$('reset').onclick=()=>{score=Math.max(0,score-5);load();toast('새 재료를 꺼냈어요.')};$('serve').onclick=()=>{if(stacked!==order().count)return;score+=100;tone(880,.18);idx++;if(idx>=orders.length){let best=Math.max(score,Number(localStorage.getItem(BEST)||0));localStorage.setItem(BEST,best);$('start').classList.remove('hide');$('start').querySelector('.modal').innerHTML=`<h2>🚀 오늘 장사 끝!</h2><p>6명의 손님에게 샌드위치를 완성했어요.<br><b>${score}점</b> · 최고 기록 ${best}점</p><button class="big primary" id="again">다시 만들기</button>`;$('again').onclick=()=>{idx=0;score=0;$('start').classList.add('hide');load()};return}load()};$('go').onclick=()=>{$('start').classList.add('hide');load();tone(660,.1)};load();
})();
</script></body></html>
