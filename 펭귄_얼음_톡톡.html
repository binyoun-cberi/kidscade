<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>펭귄 얼음 톡톡! | Kidscade</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(#dff7ff,#f7fcff);color:#1f4255}button{font:inherit;border:0}.hide{display:none!important}.screen{min-height:100vh;padding:14px}.wrap{max-width:980px;margin:auto}.hero{text-align:center;padding:22px 10px}.peng{font-size:78px}.hero h1{font-size:clamp(40px,8vw,70px);margin:2px;color:#167fae}.hero p{color:#668596;font-weight:750;line-height:1.55}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:820px;margin:22px auto}.mode{padding:17px;text-align:left;background:#fff;border:3px solid #fff;border-radius:24px;box-shadow:0 12px 28px #245a7518}.mode b{display:block;font-size:21px;margin:6px 0}.mode span{font-size:38px}.mode small{color:#738995;font-weight:700}.toolbar,.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.soft{padding:10px 14px;border-radius:14px;background:#fff;border:2px solid #dceef6;font-weight:900}.top{max-width:1000px;margin:auto;justify-content:space-between;align-items:center}.title{background:#fff;padding:10px 15px;border-radius:16px;font-weight:950}.layout{max-width:1000px;margin:8px auto;display:grid;grid-template-columns:1fr 270px;gap:10px}.panel{background:#ffffffdf;border:3px solid #fff;border-radius:24px;box-shadow:0 14px 35px #245a7518;padding:12px}.boardBox{position:relative;height:min(72vh,660px);min-height:480px;overflow:hidden;background:linear-gradient(#dff8ff,#b9ebfb);border-radius:22px}.iceBoard{position:absolute;left:50%;top:50%;width:560px;height:560px;transform:translate(-50%,-50%)}.tile{position:absolute;width:70px;height:61px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(145deg,#fff,#dff8ff);border:0;filter:drop-shadow(0 5px 3px #3986a526);transition:.24s;display:grid;place-items:center}.tile.blue{background:linear-gradient(145deg,#d5f6ff,#72d2f3)}.tile:after{content:"";width:28px;height:7px;border-radius:99px;background:#ffffffb8;transform:rotate(-18deg)}.tile.danger{filter:drop-shadow(0 0 7px #ffad42)}.tile.dead{opacity:0;transform:translateY(85px) scale(.65) rotate(18deg);pointer-events:none}.tile.hit{animation:shake .25s}@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}.penguin{position:absolute;left:50%;top:50%;transform:translate(-50%,-65%);font-size:72px;z-index:8;pointer-events:none;filter:drop-shadow(0 10px 5px #1a526832);transition:.5s}.penguin.wobble{animation:wobble .55s}@keyframes wobble{25%{rotate:-12deg}50%{rotate:12deg}75%{rotate:-8deg}}.penguin.fall{transform:translate(-50%,230px) rotate(100deg);opacity:.15}.hammer{position:absolute;font-size:55px;z-index:10;pointer-events:none;opacity:0;transform-origin:70% 80%}.hammer.go{animation:hammer .32s}@keyframes hammer{0%{opacity:1;transform:translate(55px,-70px) rotate(-45deg)}70%{opacity:1;transform:translate(0,0) rotate(18deg)}100%{opacity:0;transform:translate(0,0) rotate(18deg)}}.side h2{margin:3px 0}.side p{font-size:13px;color:#718793;font-weight:700;line-height:1.45}.target{margin:8px auto;width:72px;height:72px;background:#fff;border-radius:22px;display:grid;place-items:center;font-size:30px;font-weight:950}.target.blue{background:#aeeaff}.status{padding:10px;border-radius:14px;background:#f0f9fd;margin:7px 0;font-weight:900}.players{display:grid;gap:6px}.p{display:flex;justify-content:space-between;padding:8px;background:#f0f9fd;border-radius:12px}.p.on{outline:2px solid #59c7eb}.action{width:100%;padding:12px;border-radius:14px;background:#4ebde5;color:#fff;font-weight:950}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#21475b;color:#fff;padding:10px 14px;border-radius:13px;font-weight:900;transition:.2s;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#244f6666;display:grid;place-items:center;padding:16px;z-index:40}.dialog{width:min(560px,100%);background:#fff;border-radius:24px;padding:20px}.dialog p{color:#6f8591;line-height:1.55;font-weight:700}.choices{display:flex;gap:7px}.choices button{flex:1;padding:11px;border-radius:13px;background:#eef7fb;font-weight:900}.choices button.on{background:#4ebde5;color:#fff}.primary{width:100%;padding:13px;border-radius:14px;background:#4ebde5;color:#fff;font-weight:950;margin-top:12px}@media(max-width:760px){.modes{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{order:-1}.boardBox{height:58vh;min-height:390px}.iceBoard{scale:.78}.penguin{font-size:62px}.side p{display:none}}</style></head><body><section id="menu" class="screen"><div class="wrap hero"><div class="peng">🐧</div><h1>펭귄 얼음 톡톡!</h1><p>하얀 얼음과 파란 얼음을 톡톡 깨며 색 구별, 수 세기, 공간관계와 차례 기다리기를 익혀요.</p><div class="modes"><button class="mode" data-mode="solo"><span>🧊</span><b>혼자 지키기</b><small>12번 동안 펭귄이 빠지지 않으면 성공!</small></button><button class="mode" data-mode="color"><span>🎨</span><b>색깔 놀이</b><small>나온 색과 같은 얼음을 찾아 깨요.</small></button><button class="mode" data-mode="count"><span>🔢</span><b>수 세기 놀이</b><small>1~3개를 세어 하나씩 깨요.</small></button><button class="mode" data-mode="friends"><span>👫</span><b>친구와 놀이</b><small>2~4명이 차례대로 얼음을 깨요.</small></button></div><div class="toolbar"><button class="soft" id="rules">📘 놀이 방법</button><button class="soft" id="sound">🎵 소리 켜짐</button></div></div></section><section id="play" class="screen hide"><div class="top"><button class="soft" id="home">⌂</button><div class="title" id="turn">펭귄을 지켜 주세요!</div><button class="soft" id="restart">↻</button></div><div class="layout"><div class="panel boardBox"><div class="iceBoard" id="board"></div><div class="penguin" id="penguin">🐧</div><div class="hammer" id="hammer">🔨</div></div><aside class="panel side"><h2 id="mission">얼음을 하나 골라요</h2><p id="desc">펭귄 주변을 너무 많이 깨면 퐁당 떨어져요.</p><div class="target" id="target">🧊</div><div class="status" id="stat">0 / 12</div><div class="players" id="players"></div><button class="action" id="next">🎨 색 뽑기</button></aside></div></section><div id="setup" class="overlay hide"><div class="dialog"><h2>몇 명이 함께할까요?</h2><div class="choices"><button data-n="2" class="on">2명</button><button data-n="3">3명</button><button data-n="4">4명</button></div><button class="primary" id="startFriends">시작!</button></div></div><div id="info" class="overlay hide"><div class="dialog"><h2>📘 놀이 방법</h2><p>얼음을 눌러 망치로 깨요. 가운데 펭귄이 서 있는 얼음은 직접 깰 수 없어요. 펭귄 주변 6개의 얼음이 너무 많이 사라지거나 한쪽이 크게 비면 펭귄이 균형을 잃고 퐁당 떨어져요.</p><button class="primary" id="infoClose">알겠어요!</button></div></div><div class="toast" id="toast"></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];let tiles=[],map=new Map,mode='solo',turns=0,targetColor=null,countLeft=0,players=[],cur=0,over=false,locked=false,soundOn=true,R=3;const key=(q,r)=>q+','+r;function tone(f){if(!soundOn)return;try{const a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.1);o.stop(a.currentTime+.11)}catch(e){}}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1300)}function make(){tiles=[];map.clear();let id=0;for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++){let s=-q-r;if(Math.max(Math.abs(q),Math.abs(r),Math.abs(s))<=R){const t={id:id++,q,r,color:Math.random()<.5?'white':'blue',alive:true};tiles.push(t);map.set(key(q,r),t)}}}function neigh(t){return dirs.map(([a,b])=>map.get(key(t.q+a,t.r+b))).filter(Boolean)}function pos(t){const x=245+t.q*58+t.r*29,y=250+t.r*51;return{x,y}}function edgeConnected(){const seen=new Set,stack=tiles.filter(t=>t.alive&&Math.max(Math.abs(t.q),Math.abs(t.r),Math.abs(-t.q-t.r))===R);stack.forEach(t=>seen.add(t.id));while(stack.length){const t=stack.pop();for(const n of neigh(t))if(n.alive&&!seen.has(n.id)){seen.add(n.id);stack.push(n)}}return seen}function support(){const c=map.get('0,0');if(!c?.alive)return{count:0,doom:true};const a=dirs.map(([q,r])=>!!map.get(key(q,r))?.alive),count=a.filter(Boolean).length,miss=a.map((v,i)=>v?-1:i).filter(i=>i>=0);let adj=false;for(let i=0;i<miss.length;i++)for(let j=i+1;j<miss.length;j++)if(Math.abs(miss[i]-miss[j])===1||Math.abs(miss[i]-miss[j])===5)adj=true;return{count,doom:count<=3||(count===4&&adj)}}function render(){const b=$('#board');b.innerHTML=tiles.map(t=>{const p=pos(t),danger=Math.max(Math.abs(t.q),Math.abs(t.r),Math.abs(-t.q-t.r))===1&&t.alive;return `<button class="tile ${t.color==='blue'?'blue':''} ${t.alive?'':'dead'} ${mode==='solo'&&danger?'danger':''}" style="left:${p.x}px;top:${p.y}px" data-id="${t.id}"></button>`}).join('');b.querySelectorAll('.tile').forEach(e=>e.onclick=()=>hit(tiles.find(t=>t.id===+e.dataset.id)));$('#stat').textContent=mode==='solo'?`${turns} / 12`:`깬 얼음 ${turns}개`;$('#players').innerHTML=players.map((p,i)=>`<div class="p ${i===cur?'on':''}"><span>${p.e} ${p.name}</span><b>🧊 ${p.n}</b></div>`).join('');$('#turn').textContent=mode==='friends'?`${players[cur].e} ${players[cur].name} 차례`:'펭귄을 지켜 주세요!'}function mission(){if(mode==='color'){targetColor=Math.random()<.5?'white':'blue';$('#mission').textContent=targetColor==='white'?'하얀 얼음을 찾아요':'파란 얼음을 찾아요';$('#target').className='target '+(targetColor==='blue'?'blue':'');$('#target').textContent=targetColor==='white'?'⚪':'🔵';$('#next').classList.add('hide')}else if(mode==='count'){if(countLeft<=0)countLeft=1+Math.floor(Math.random()*3);$('#mission').textContent=`얼음 ${countLeft}개를 깨요`;$('#target').className='target';$('#target').textContent=countLeft;$('#next').classList.add('hide')}else{$('#mission').textContent='얼음을 하나 골라요';$('#target').className='target';$('#target').textContent='🧊';$('#next').classList.add('hide')}}function start(m,n=1){mode=m;turns=0;cur=0;over=locked=false;countLeft=0;make();const es=['🐰','🐻','🐼','🦊'];players=m==='friends'?Array.from({length:n},(_,i)=>({e:es[i],name:`${i+1}번 친구`,n:0})):[];$('#menu').classList.add('hide');$('#play').classList.remove('hide');$('#penguin').className='penguin';mission();render()}function hit(t){if(over||locked||!t?.alive)return;if(t.q===0&&t.r===0){toast('펭귄이 서 있는 얼음이에요!');return}if(mode==='color'&&t.color!==targetColor){toast(targetColor==='white'?'하얀 얼음을 찾아요!':'파란 얼음을 찾아요!');return}locked=true;const p=pos(t),h=$('#hammer');h.style.left=(p.x+20)+'px';h.style.top=(p.y-15)+'px';h.classList.remove('go');void h.offsetWidth;h.classList.add('go');t.alive=false;turns++;if(mode==='friends')players[cur].n++;tone(220);setTimeout(()=>{const seen=edgeConnected();let drop=0;tiles.forEach(x=>{if(x.alive&&!seen.has(x.id)){x.alive=false;drop++}});if(drop)toast(`우수수! 얼음 ${drop}개가 떨어졌어요`);const s=support();const pg=$('#penguin');pg.classList.remove('wobble');void pg.offsetWidth;if(s.doom){pg.classList.add('fall');tone(120);over=true;render();setTimeout(()=>{alert('🐧 퐁당! 펭귄이 물에 빠졌어요. 다시 도전해 볼까요?');home()},650);return}if(s.count<=4){pg.classList.add('wobble');toast('흔들흔들! 펭귄 주변이 위험해요!')}if(mode==='solo'&&turns>=12){over=true;tone(900);setTimeout(()=>{alert('🏆 성공! 12번 동안 펭귄을 지켰어요!');home()},250);return}if(mode==='count'){countLeft--;if(countLeft<=0)countLeft=1+Math.floor(Math.random()*3)}if(mode==='friends')cur=(cur+1)%players.length;locked=false;mission();render()},330)}function home(){$('#play').classList.add('hide');$('#menu').classList.remove('hide')}$$('.mode').forEach(b=>b.onclick=()=>b.dataset.mode==='friends'?$('#setup').classList.remove('hide'):start(b.dataset.mode));$$('#setup [data-n]').forEach(b=>b.onclick=()=>{$$('#setup [data-n]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('#startFriends').onclick=()=>{$('#setup').classList.add('hide');start('friends',+$('#setup .on').dataset.n)};$('#home').onclick=home;$('#restart').onclick=()=>start(mode,players.length||1);$('#rules').onclick=()=>$('#info').classList.remove('hide');$('#infoClose').onclick=()=>$('#info').classList.add('hide');$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🎵 소리 켜짐':'🔇 소리 꺼짐'};$('#next').onclick=mission})();</script></body></html>
