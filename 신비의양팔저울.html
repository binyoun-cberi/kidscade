<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신비한 양팔저울 모빌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            touch-action: none;
            overflow: hidden;
        }

        /* 저울 애니메이션 설정 */
        #beam {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        
        .hanger {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top center;
        }

        .weight-item {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }

        .weight-item:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .weight-item.dragging {
            opacity: 0.5;
        }

        .ghost-item {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            cursor: grabbing;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: scale(1.1) translate(-50%, -50%);
            margin: 0 !important;
        }

        .dropzone {
            transition: background-color 0.3s;
        }
        .dropzone.drag-over {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 1rem;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: pop 1s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
        
        .success-anim {
            animation: successPulse 1s infinite;
        }

        /* 틀렸을 때 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .error-shake {
            animation: shake 0.4s ease-in-out;
            background-color: #ef4444 !important; 
            color: white !important;
        }
        
        /* 타이머 경고 애니메이션 */
        @keyframes warningPing {
            0% { transform: scale(1); color: #dc2626; }
            50% { transform: scale(1.2); color: #991b1b; }
            100% { transform: scale(1); color: #dc2626; }
        }
        .timer-warning {
            animation: warningPing 1s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between py-4 px-4 relative">

    <!-- Start Screen (Audio Init 필요) -->
    <div id="start-screen" class="absolute inset-0 z-[100] bg-indigo-900/80 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center text-center max-w-lg w-full">
            <h1 class="text-4xl md:text-5xl font-bold text-indigo-800 mb-4 tracking-wide">⚖️ 신비한 양팔저울</h1>
            <p class="text-lg text-gray-600 mb-2">추를 올려 양쪽 무게를 똑같이 맞추세요!</p>
            <p class="text-sm text-rose-500 font-bold mb-6">💡 20레벨부터는 타이머가 시작됩니다.</p>
            <button id="start-game-btn" class="px-10 py-4 bg-amber-500 text-white text-3xl font-bold rounded-full shadow-[0_6px_0_#b45309] hover:bg-amber-400 hover:translate-y-1 hover:shadow-[0_2px_0_#b45309] active:translate-y-2 active:shadow-none transition-all">
                게임 시작!
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center bg-white/60 backdrop-blur-md rounded-2xl p-4 shadow-lg z-10 gap-2 md:gap-4">
        <div class="flex-1">
            <div class="flex items-center gap-2">
                <h1 class="text-xl md:text-3xl font-bold text-indigo-800 tracking-wide drop-shadow-sm">⚖️ 모빌</h1>
                <button id="mute-btn" class="text-2xl p-1 rounded-full hover:bg-white/50 transition-colors">🔊</button>
            </div>
            <p id="level-desc" class="text-indigo-600 text-xs md:text-lg">레벨 1: 숫자의 합 맞추기</p>
        </div>
        
        <!-- Timer Display (Hidden until Level 20) -->
        <div id="timer-display" class="hidden flex-col items-center justify-center bg-rose-100 px-4 py-2 rounded-xl shadow-inner border-2 border-rose-300">
            <span class="text-xs md:text-sm text-rose-600 font-bold">남은 시간</span>
            <span id="timer-text" class="text-2xl md:text-3xl font-black text-rose-600">30초</span>
        </div>

        <div class="flex flex-col items-end text-right flex-1">
            <div class="text-xs md:text-lg text-gray-700 font-bold bg-white/50 px-2 py-1 md:px-3 rounded-lg shadow-sm mb-1">
                🏆 최고: <span id="high-score-display" class="text-amber-600">0</span>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <div class="text-sm md:text-2xl font-bold text-gray-800">
                    점수 <span id="score-display" class="text-indigo-600 text-xl md:text-3xl">0</span>
                </div>
                <div id="lives-display" class="text-xl md:text-3xl tracking-widest drop-shadow-md">
                    ❤️❤️
                </div>
            </div>
        </div>
    </header>

    <!-- Main Scale Area -->
    <main class="relative w-full max-w-3xl flex-1 flex flex-col items-center justify-center my-2 md:my-4">
        
        <!-- 저울 구조물 -->
        <div class="relative w-full h-56 md:h-64 flex items-end justify-center mb-6">
            <div class="absolute bottom-0 w-5 md:w-6 h-40 md:h-48 bg-gradient-to-t from-amber-800 to-amber-600 rounded-t-lg shadow-xl z-0"></div>
            <div class="absolute bottom-40 md:bottom-48 w-8 h-8 md:w-10 md:h-10 bg-amber-500 rounded-full shadow-md z-20 border-4 border-amber-700 flex items-center justify-center">
                <div class="w-2 h-2 md:w-3 md:h-3 bg-amber-900 rounded-full"></div>
            </div>

            <!-- 빔 -->
            <div id="beam" class="absolute bottom-44 md:bottom-52 w-full md:w-11/12 h-3 md:h-4 bg-gradient-to-r from-amber-700 via-amber-500 to-amber-700 rounded-full shadow-lg z-10 flex justify-between items-center px-4">
                
                <div class="hanger relative w-0 h-0 flex flex-col items-center" style="left: 0%;">
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0"></div>
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0 transform -rotate-12 origin-top"></div>
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0 transform rotate-12 origin-top"></div>
                    
                    <div id="left-pan" class="dropzone absolute top-20 md:top-24 w-32 md:w-40 h-14 md:h-16 bg-white/30 backdrop-blur-sm border-2 border-indigo-300 rounded-b-3xl rounded-t-lg shadow-xl flex flex-wrap-reverse justify-center items-end pb-2 gap-1" data-side="left" style="transform: translateX(-50%);"></div>
                </div>

                <div class="hanger relative w-0 h-0 flex flex-col items-center" style="right: 0%;">
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0"></div>
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0 transform -rotate-12 origin-top"></div>
                    <div class="w-0.5 h-20 md:h-24 bg-gray-400 absolute top-0 transform rotate-12 origin-top"></div>
                    
                    <div id="right-pan" class="dropzone absolute top-20 md:top-24 w-32 md:w-40 h-14 md:h-16 bg-white/30 backdrop-blur-sm border-2 border-pink-300 rounded-b-3xl rounded-t-lg shadow-xl flex flex-wrap-reverse justify-center items-end pb-2 gap-1" data-side="right" style="transform: translateX(-50%);"></div>
                </div>
            </div>
            
            <div class="absolute bottom-0 w-24 md:w-32 h-4 md:h-6 bg-gradient-to-r from-gray-600 to-gray-800 rounded-t-xl shadow-2xl z-0"></div>
        </div>

        <!-- 확인 버튼 -->
        <div class="relative z-20 mt-4 md:mt-8">
            <button id="check-btn" class="px-8 py-3 bg-indigo-600 text-white text-2xl md:text-3xl font-bold rounded-full shadow-[0_6px_0_#4338ca] hover:bg-indigo-500 hover:translate-y-1 hover:shadow-[0_2px_0_#4338ca] active:translate-y-2 active:shadow-none transition-all outline-none">
                정답 확인!
            </button>
        </div>

        <!-- 정답 오버레이 -->
        <div id="success-message" class="absolute hidden flex-col items-center justify-center inset-0 z-50 bg-white/20 backdrop-blur-sm rounded-3xl">
            <h2 class="text-5xl md:text-6xl font-bold text-yellow-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)] mb-6 success-anim">정답입니다! ✨</h2>
        </div>
        
        <!-- 게임 오버 모달 -->
        <div id="game-over-modal" class="absolute hidden flex-col items-center justify-center inset-0 z-50 bg-black/60 backdrop-blur-sm rounded-3xl">
            <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center text-center">
                <h2 class="text-4xl md:text-5xl font-bold text-red-500 mb-2">게임 오버</h2>
                <p class="text-xl text-gray-600 mb-6">아쉽지만 기회를 모두 잃었어요!</p>
                <div class="text-2xl font-bold text-gray-800 mb-2">최종 점수: <span id="final-score" class="text-indigo-600">0</span>점</div>
                <button id="restart-btn" class="mt-6 px-8 py-3 bg-amber-500 text-white text-2xl font-bold rounded-full shadow-[0_6px_0_#b45309] hover:bg-amber-400 active:translate-y-2 active:shadow-none transition-all">
                    다시 도전하기
                </button>
            </div>
        </div>
    </main>

    <!-- Inventory Area -->
    <div class="w-full max-w-4xl bg-white/70 backdrop-blur-md rounded-2xl p-4 md:p-6 shadow-lg z-10 flex flex-col items-center">
        <h3 class="text-center text-gray-600 mb-2 text-sm md:text-lg">아래의 추를 드래그해서 빈 접시에 올리고 '정답 확인'을 누르세요</h3>
        <div id="inventory" class="dropzone min-h-[80px] w-full flex flex-wrap justify-center items-center gap-2 md:gap-4 p-2 bg-white/30 rounded-xl" data-side="inventory"></div>
    </div>

    <!-- 템플릿 -->
    <template id="weight-template">
        <div class="weight-item w-14 h-14 md:w-20 md:h-20 bg-gradient-to-br rounded-xl shadow-[0_6px_10px_rgba(0,0,0,0.2)] flex flex-col items-center justify-center text-white font-bold border-b-4 border-black/20" data-id="" data-val="">
            <span class="val-text text-lg md:text-xl leading-none tracking-tighter"></span>
            <span class="unit-text text-xs md:text-sm mt-0.5 opacity-90 font-medium"></span>
        </div>
    </template>

    <script>
        // --- Web Audio API (사운드 시스템) ---
        let audioCtx;
        let isMuted = false;
        let bgmInterval;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        // 범용 신스 함수
        function playTone(freq, type = 'sine', duration = 0.1, vol = 0.1) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSFX(type) {
            if (isMuted || !audioCtx) return;
            switch(type) {
                case 'grab':
                    playTone(600, 'sine', 0.1, 0.1);
                    break;
                case 'drop':
                    playTone(300, 'triangle', 0.1, 0.15);
                    break;
                case 'correct':
                    playTone(523.25, 'sine', 0.15, 0.1); // C5
                    setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); // E5
                    setTimeout(() => playTone(783.99, 'sine', 0.3, 0.15), 200); // G5
                    break;
                case 'wrong':
                    playTone(150, 'sawtooth', 0.3, 0.15);
                    break;
                case 'gameover':
                    playTone(300, 'sawtooth', 0.3, 0.2);
                    setTimeout(() => playTone(250, 'sawtooth', 0.3, 0.2), 250);
                    setTimeout(() => playTone(200, 'sawtooth', 0.5, 0.2), 500);
                    break;
                case 'tick':
                    playTone(800, 'square', 0.05, 0.05);
                    break;
                case 'timeout':
                    playTone(200, 'square', 0.4, 0.2);
                    break;
            }
        }

        // 잔잔한 BGM 재생 (마림바 느낌의 루프)
        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // C 메이저 아르페지오
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isMuted && audioCtx) {
                    playTone(notes[step], 'sine', 0.3, 0.03); // 매우 작게
                    step = (step + 1) % notes.length;
                }
            }, 500);
        }

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            isMuted = !isMuted;
            e.target.innerText = isMuted ? '🔇' : '🔊';
        });

        // --- 전역 상태 및 상수 ---
        let currentLevel = 1;
        let score = 0;
        let highScore = localStorage.getItem('mathMobileHighScore') || 0;
        let lives = 2;
        let isTransitioning = false; 
        
        let timeLeft = 0;
        let timerInterval = null;

        let gameState = { left: [], right: [], inventory: [] };
        let lastProblemKey = ""; // 이전 문제를 기억하기 위한 변수
        const unitMultipliers = { 'mg': 0.001, 'g': 1, 'kg': 1000, 't': 1000000, 'ml': 1, 'L': 1000, '': 1 };

        // DOM 요소
        const beam = document.getElementById('beam');
        const hangers = document.querySelectorAll('.hanger');
        const leftPan = document.getElementById('left-pan');
        const rightPan = document.getElementById('right-pan');
        const inventoryEl = document.getElementById('inventory');
        const template = document.getElementById('weight-template');
        const successMsg = document.getElementById('success-message');
        const gameOverModal = document.getElementById('game-over-modal');
        const checkBtn = document.getElementById('check-btn');
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const livesDisplay = document.getElementById('lives-display');
        const timerDisplay = document.getElementById('timer-display');
        const timerText = document.getElementById('timer-text');
        const restartBtn = document.getElementById('restart-btn');

        highScoreDisplay.innerText = highScore;

        // --- 시작 화면 로직 ---
        document.getElementById('start-game-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            initAudio();
            initLevel();
        });


        // --- 유틸리티 및 문제 생성 로직 ---
        function parseValue(str) {
            str = String(str).trim();
            const match = str.match(/^([\d.]+)\s*([a-zA-Z]*)$/);
            if (match) {
                const val = parseFloat(match[1]);
                const unit = match[2];
                return Math.round((val * (unitMultipliers[unit] || 1)) * 10000) / 10000;
            }
            return 0;
        }

        function formatWeight(val, uSmall, uBig) {
            if (!uSmall) return String(val);
            let options = [val + " " + uSmall];
            if (val >= 1000) {
                if (val % 1000 === 0) options.push((val / 1000) + " " + uBig);
                else if (val % 100 === 0) options.push((val / 1000) + " " + uBig); 
                else if (val % 10 === 0) options.push((val / 1000) + " " + uBig);  
            }
            return options[Math.floor(Math.random() * options.length)];
        }

        function splitValue(val, parts, uSmall, uBig, step = 1) {
            if (parts <= 1) return [formatWeight(val, uSmall, uBig)];
            let result = [];
            let remaining = val;
            for (let i = 0; i < parts - 1; i++) {
                let max = remaining - (step * (parts - 1 - i));
                if (max <= step) break; 
                let piece = (Math.floor(Math.random() * (max / step)) + 1) * step;
                piece = Math.max(step, Math.min(piece, max - step));
                result.push(formatWeight(piece, uSmall, uBig));
                remaining -= piece;
            }
            if (remaining > 0) result.push(formatWeight(remaining, uSmall, uBig));
            return result;
        }

        function generateDummies(count, uSmall, uBig, step, min, maxTarget) {
            let dummies = [];
            for (let i = 0; i < count; i++) {
                let val = (Math.floor(Math.random() * (maxTarget/step)) + 1) * step;
                val = Math.max(min, val);
                dummies.push(formatWeight(val, uSmall, uBig));
            }
            return dummies;
        }

        function generateLevelConfig(level) {
            let config = { left: [], right: [], inventory: [], desc: "", color: "" };
            
            if (level <= 3) {
                config.desc = `레벨 ${level}: 숫자의 합 맞추기`;
                config.color = "from-blue-400 to-indigo-500";
                let target = Math.floor(Math.random() * 10) + 5 + (level * 2);
                let rStart = Math.floor(Math.random() * (target - 2)) + 1;
                config.left.push(String(target));
                config.right.push(String(rStart));
                let partsCount = level === 1 ? 1 : 2;
                let parts = splitValue(target - rStart, partsCount, "", "", 1);
                config.inventory.push(...parts);
                config.inventory.push(...generateDummies(5 - parts.length, "", "", 1, 1, target + 5));
            } 
            else if (level <= 9) {
                let isMass = Math.random() > 0.5;
                let uSmall = isMass ? "g" : "ml";
                let uBig = isMass ? "kg" : "L";
                config.desc = `레벨 ${level}: 단위 변환 알아보기`;
                config.color = isMass ? "from-orange-400 to-red-500" : "from-teal-400 to-emerald-500";
                let step = level <= 6 ? 500 : 100;
                let maxTarget = 1500 + (level * 300);
                let target = (Math.floor(Math.random() * (maxTarget/step - 3)) + 3) * step;
                let rStart = (Math.floor(Math.random() * (target/step - 1)) + 1) * step;
                config.left.push(formatWeight(target, uSmall, uBig));
                if (rStart > 0) config.right.push(formatWeight(rStart, uSmall, uBig));
                let partsCount = level <= 5 ? 1 : 2;
                let parts = splitValue(target - rStart, partsCount, uSmall, uBig, step);
                config.inventory.push(...parts);
                config.inventory.push(...generateDummies(6 - parts.length, uSmall, uBig, step, step, maxTarget));
            }
            else {
                let isMass = Math.random() > 0.5;
                let uSmall = isMass ? "g" : "ml";
                let uBig = isMass ? "kg" : "L";
                config.desc = `레벨 ${level}: 복합 단위 심화 계산!`;
                config.color = "from-purple-500 to-pink-600";
                let step = 50; 
                let maxTarget = 2000 + (level * 150);
                let target = (Math.floor(Math.random() * (maxTarget/step - 30)) + 30) * step; 
                
                if (Math.random() > 0.6) {
                    let l1 = (Math.floor(Math.random() * (target/step/2)) + 5) * step;
                    config.left.push(formatWeight(l1, uSmall, uBig));
                    config.left.push(formatWeight(target - l1, uSmall, uBig));
                } else {
                    config.left.push(formatWeight(target, uSmall, uBig));
                }

                let rStart = (Math.floor(Math.random() * (target/step - 15)) + 5) * step;
                config.right.push(formatWeight(rStart, uSmall, uBig));
                
                let numParts = Math.random() > 0.6 ? 3 : 2; 
                let parts = splitValue(target - rStart, numParts, uSmall, uBig, step);
                config.inventory.push(...parts);
                config.inventory.push(...generateDummies(8 - parts.length, uSmall, uBig, step, 50, maxTarget));
            }
            config.inventory.sort(() => Math.random() - 0.5);
            return config;
        }

        // --- 타이머 시스템 ---
        function startTimer() {
            clearInterval(timerInterval);
            timerText.classList.remove('timer-warning');

            if (currentLevel >= 30) timeLeft = 15;
            else if (currentLevel >= 20) timeLeft = 30;
            else timeLeft = 0;

            if (timeLeft > 0) {
                timerDisplay.classList.remove('hidden');
                timerDisplay.classList.add('flex');
                timerText.innerText = `${timeLeft}초`;
                
                timerInterval = setInterval(() => {
                    if(isTransitioning) return; // 성공 애니메이션 중에는 타이머 정지
                    
                    timeLeft--;
                    timerText.innerText = `${timeLeft}초`;
                    
                    if (timeLeft <= 5 && timeLeft > 0) {
                        playSFX('tick');
                        timerText.classList.add('timer-warning');
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleTimeOut();
                    }
                }, 1000);
            } else {
                timerDisplay.classList.add('hidden');
                timerDisplay.classList.remove('flex');
            }
        }

        // --- 렌더링 및 UI 업데이트 ---
        function updateUI() {
            scoreDisplay.innerText = score;
            highScoreDisplay.innerText = highScore;
            livesDisplay.innerText = lives === 2 ? "❤️❤️" : (lives === 1 ? "🖤❤️" : "🖤🖤");
        }

        function initLevel() {
            isTransitioning = false;
            successMsg.classList.add('hidden');
            successMsg.classList.remove('flex');
            
            let lvlConfig;
            let currentKey = "";
            let attempts = 0;
            
            // 이전 문제와 완전히 똑같은 구성이 나오지 않도록 방지
            do {
                lvlConfig = generateLevelConfig(currentLevel);
                // 양쪽에 놓인 초기 추들의 값을 문자열로 묶어서 고유 키 생성
                currentKey = JSON.stringify(lvlConfig.left) + "|" + JSON.stringify(lvlConfig.right);
                attempts++;
            } while (currentKey === lastProblemKey && attempts < 10);
            
            lastProblemKey = currentKey;

            document.getElementById('level-desc').innerText = lvlConfig.desc;
            updateUI();

            gameState.left = lvlConfig.left.map((val, i) => ({ id: `l_${i}`, val, fixed: true, color: lvlConfig.color }));
            gameState.right = lvlConfig.right.map((val, i) => ({ id: `r_${i}`, val, fixed: true, color: lvlConfig.color }));
            gameState.inventory = lvlConfig.inventory.map((val, i) => ({ id: `i_${i}`, val, fixed: false, color: lvlConfig.color }));

            renderAll();
            updateScale();
            startTimer(); // 레벨 초기화 후 타이머 시작
        }

        function resetLevelState() {
            // 시간 초과 시 배치한 추를 모두 인벤토리로 되돌리기
            gameState.inventory.push(...gameState.left.filter(i => !i.fixed));
            gameState.inventory.push(...gameState.right.filter(i => !i.fixed));
            
            gameState.left = gameState.left.filter(i => i.fixed);
            gameState.right = gameState.right.filter(i => i.fixed);

            renderAll();
            updateScale();
            startTimer(); // 타이머 재시작
        }

        function createItemElement(item) {
            const clone = template.content.cloneNode(true);
            const el = clone.querySelector('.weight-item');
            el.dataset.id = item.id;
            el.dataset.val = item.val;
            
            const match = String(item.val).match(/^([\d.]+)\s*([a-zA-Z]*)$/);
            if (match) {
                el.querySelector('.val-text').innerText = match[1];
                el.querySelector('.unit-text').innerText = match[2];
            } else {
                el.querySelector('.val-text').innerText = item.val;
            }
            
            el.classList.add(...item.color.split(' '));

            if (item.fixed) {
                el.style.cursor = 'default';
                el.classList.remove('weight-item');
                el.classList.add('fixed-item', 'opacity-90');
            } else {
                el.addEventListener('mousedown', handleDragStart);
                el.addEventListener('touchstart', handleDragStart, {passive: false});
            }
            return el;
        }

        function renderAll() {
            leftPan.innerHTML = '';
            rightPan.innerHTML = '';
            inventoryEl.innerHTML = '';

            gameState.left.forEach(item => leftPan.appendChild(createItemElement(item)));
            gameState.right.forEach(item => rightPan.appendChild(createItemElement(item)));
            gameState.inventory.forEach(item => inventoryEl.appendChild(createItemElement(item)));
        }

        // --- 물리 및 게임 로직 ---
        function calculateTotal(items) {
            return items.reduce((sum, item) => sum + parseValue(item.val), 0);
        }

        function updateScale() {
            const leftVal = calculateTotal(gameState.left);
            const rightVal = calculateTotal(gameState.right);
            
            let diff = rightVal - leftVal;
            let maxVal = Math.max(leftVal, rightVal, 1);
            
            let angle = (diff / maxVal) * 35; 
            if (angle > 30) angle = 30;
            if (angle < -30) angle = -30;
            if (leftVal === 0 && rightVal === 0) angle = 0;

            beam.style.transform = `rotate(${angle}deg)`;
            hangers.forEach(hanger => {
                hanger.style.transform = `rotate(${-angle}deg)`;
            });
        }

        // 정답 확인 버튼 클릭
        checkBtn.addEventListener('click', () => {
            if (isTransitioning) return;
            
            const leftVal = calculateTotal(gameState.left);
            const rightVal = calculateTotal(gameState.right);

            if (leftVal === rightVal && leftVal > 0) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer("틀렸어요!");
            }
        });

        function handleCorrectAnswer() {
            isTransitioning = true;
            clearInterval(timerInterval);
            playSFX('correct');
            
            score++;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('mathMobileHighScore', highScore);
            }
            updateUI();
            
            playSuccessEffect();
            successMsg.classList.remove('hidden');
            successMsg.classList.add('flex');
            
            setTimeout(() => {
                currentLevel++;
                initLevel();
            }, 1500); 
        }

        function handleTimeOut() {
            playSFX('timeout');
            handleWrongAnswer("시간 초과!");
            if (lives > 0) {
                setTimeout(() => {
                    resetLevelState();
                }, 800); // 흔들림 애니메이션 후 리셋
            }
        }

        function handleWrongAnswer(msg) {
            if(msg !== "시간 초과!") playSFX('wrong');
            
            lives--;
            updateUI();
            
            checkBtn.innerText = msg;
            checkBtn.classList.add('error-shake');
            
            setTimeout(() => {
                checkBtn.classList.remove('error-shake');
                checkBtn.innerText = "정답 확인!";
                
                if (lives <= 0) {
                    showGameOver();
                }
            }, 600);
        }

        function showGameOver() {
            isTransitioning = true;
            clearInterval(timerInterval);
            playSFX('gameover');
            document.getElementById('final-score').innerText = score;
            gameOverModal.classList.remove('hidden');
            gameOverModal.classList.add('flex');
        }

        restartBtn.addEventListener('click', () => {
            score = 0;
            lives = 2;
            currentLevel = 1;
            gameOverModal.classList.add('hidden');
            gameOverModal.classList.remove('flex');
            initLevel();
        });

        function playSuccessEffect() {
            for(let i=0; i<40; i++) {
                const p = document.createElement('div');
                p.className = 'particle text-2xl absolute left-1/2 top-1/2 z-50';
                p.innerText = ['⭐', '✨', '🎉', '🌟'][Math.floor(Math.random()*4)];
                
                const tx = (Math.random() - 0.5) * 400 + 'px';
                const ty = (Math.random() - 0.5) * 400 - 100 + 'px';
                p.style.setProperty('--tx', tx);
                p.style.setProperty('--ty', ty);
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        // --- 커스텀 드래그 앤 드롭 구현 ---
        let activeItem = null;
        let ghostEl = null;
        let currentDropzone = null;

        function handleDragStart(e) {
            if (isTransitioning || e.target.closest('.fixed-item')) return;
            if (e.type === 'touchstart') e.preventDefault(); 

            const itemEl = e.target.closest('.weight-item');
            if (!itemEl) return;

            playSFX('grab');

            activeItem = itemEl;
            ghostEl = activeItem.cloneNode(true);
            ghostEl.classList.add('ghost-item');
            ghostEl.classList.remove('weight-item');
            document.body.appendChild(ghostEl);

            activeItem.classList.add('dragging');
            moveGhost(e);

            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('touchmove', handleDragMove, {passive: false});
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function moveGhost(e) {
            if (!ghostEl) return;
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            ghostEl.style.left = clientX + 'px';
            ghostEl.style.top = clientY + 'px';

            const elemBelow = document.elementFromPoint(clientX, clientY);
            const dropzoneBelow = elemBelow ? elemBelow.closest('.dropzone') : null;

            if (currentDropzone !== dropzoneBelow) {
                if (currentDropzone) currentDropzone.classList.remove('drag-over');
                currentDropzone = dropzoneBelow;
                if (currentDropzone) currentDropzone.classList.add('drag-over');
            }
        }

        function handleDragMove(e) {
            if (e.type === 'touchmove') e.preventDefault();
            moveGhost(e);
        }

        function handleDragEnd(e) {
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);

            if (!activeItem || !ghostEl) return;

            if (currentDropzone) {
                currentDropzone.classList.remove('drag-over');
                
                const targetSide = currentDropzone.dataset.side;
                const itemId = activeItem.dataset.id;
                
                let itemData = null;
                ['left', 'right', 'inventory'].forEach(side => {
                    const idx = gameState[side].findIndex(i => i.id === itemId);
                    if (idx > -1) {
                        itemData = gameState[side].splice(idx, 1)[0];
                    }
                });

                if (itemData) {
                    gameState[targetSide].push(itemData);
                    playSFX('drop');
                }
            }

            ghostEl.remove();
            ghostEl = null;
            activeItem.classList.remove('dragging');
            activeItem = null;
            currentDropzone = null;

            renderAll();
            updateScale();
        }

    </script>
</body>
</html>
