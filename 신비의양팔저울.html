<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>신비한 양팔저울</title>
<style>
:root{--ink:#29313a;--paper:#fff9e8;--wood:#9b653d;--gold:#e8b648;--blue:#5295c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,'Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(#d9eff2 0 64%,#c6935e 64% 100%)}button{font:inherit;cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:10px 14px 28px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.top h1{margin:0;font-size:clamp(21px,4vw,31px)}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fff9;border:1px solid #fff;border-radius:999px;padding:7px 10px;font-weight:900}.mission{margin:10px 0;background:#fff9e8;border:3px solid #775a3d;border-radius:16px;padding:11px 14px;text-align:center;box-shadow:0 5px 0 #725036}.mission b{font-size:19px}.lab{position:relative;min-height:430px;background:linear-gradient(#f8f1dc 0 78%,#b57a48 78%);border:4px solid #5b4939;border-radius:22px;overflow:hidden;box-shadow:0 14px 25px #4a403644}.scale{position:absolute;left:50%;top:62px;width:min(760px,92%);height:310px;transform:translateX(-50%)}.stand{position:absolute;left:50%;top:45px;width:24px;height:210px;background:linear-gradient(90deg,#6d7478,#dce3e2,#717b80);transform:translateX(-50%);border:2px solid #4b5155}.stand:after{content:"";position:absolute;left:50%;bottom:-18px;width:190px;height:25px;border-radius:50%;background:#6e7677;transform:translateX(-50%);border:3px solid #4b5155}.pivot{position:absolute;left:50%;top:32px;width:42px;height:42px;border-radius:50%;background:#e0b24f;border:5px solid #695329;transform:translate(-50%,-50%);z-index:5}.beam{position:absolute;left:7%;right:7%;top:32px;height:15px;background:linear-gradient(#a57734,#e1b960,#8c6229);border:3px solid #62471e;border-radius:10px;transform-origin:50% 50%;transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:3}.hanger{position:absolute;top:10px;width:2px;height:133px;background:#5f6464}.hanger:before,.hanger:after{content:"";position:absolute;top:0;width:2px;height:135px;background:#5f6464;transform-origin:top}.hanger:before{transform:rotate(17deg)}.hanger:after{transform:rotate(-17deg)}.hanger.left{left:9%}.hanger.right{right:9%}.pan{position:absolute;top:152px;width:38%;height:118px;border-radius:0 0 50% 50%/0 0 34% 34%;background:linear-gradient(#d7dadd,#969fa4);border:3px solid #626b70;box-shadow:inset 0 10px #eff2f2,0 7px 8px #0002;transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;align-content:flex-start;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;padding:7px 8px 18px}.pan.left{left:0}.pan.right{right:0}.pan.dragover{outline:6px solid #ffd75b;outline-offset:2px}.total{position:absolute;top:278px;width:38%;text-align:center;font-size:18px;font-weight:950;background:#fffdf2;border:2px solid #6d6253;border-radius:12px;padding:6px}.total.left{left:0}.total.right{right:0}.obj{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:55px;height:65px;padding:3px;border-radius:12px;background:#fff8;border:1px solid #fff;user-select:none;touch-action:none;cursor:grab;filter:drop-shadow(0 3px 2px #0003);animation:land .25s ease}.obj .emo{font-size:31px;line-height:1}.obj .wt{font-size:10px;font-weight:950;background:#fff;border-radius:8px;padding:1px 5px;white-space:nowrap}.obj.fixed{background:#ffefb4;border:2px solid #b58a32}.obj:active{cursor:grabbing}.pan .obj{height:54px;min-width:48px}.pan .obj .emo{font-size:26px}@keyframes land{from{transform:translateY(-35px) scale(.8)}to{transform:none}}.shelf{position:absolute;left:0;right:0;bottom:0;min-height:126px;background:linear-gradient(#916039 0 7px,#ba7a47 7px 100%);padding:15px 12px 10px}.shelf-title{text-align:center;color:#fff8dc;font-weight:900;font-size:13px;margin-bottom:7px}.items{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.items .obj{background:#fff5df;border:2px solid #7b563b;height:75px;min-width:68px}.buttons{display:flex;justify-content:center;gap:9px;margin-top:11px}.action{border:0;border-radius:13px;padding:11px 16px;font-weight:950;background:#fff8e8;color:#3d3128;box-shadow:0 4px 0 #765035}.action.primary{background:#ffd65f}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #765035}.feedback{margin:9px auto 0;max-width:700px;text-align:center;font-weight:850;min-height:24px}.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);opacity:.9}.overlay{position:fixed;inset:0;background:#263846d9;display:grid;place-items:center;padding:18px;z-index:80}.overlay.hide{display:none}.card{max-width:520px;background:#fff9e8;border:4px solid #644b34;border-radius:23px;padding:24px;text-align:center}.card h2{font-size:30px;margin:0 0 10px}.card p{line-height:1.65}.card .action{width:100%;font-size:18px}.small{font-size:12px;color:#66717a}@media(max-width:650px){.wrap{padding:7px}.lab{min-height:485px}.scale{top:76px;height:300px}.pan{width:42%;top:150px}.total{width:42%;top:274px}.total.right,.pan.right{right:-1%}.total.left,.pan.left{left:-1%}.shelf{min-height:160px}.items{gap:4px}.items .obj{min-width:56px;height:66px}.obj .emo{font-size:27px}.top{align-items:flex-start}.stats{font-size:12px}.mission{font-size:13px}}
</style></head><body>
<div class="wrap"><div class="top"><h1>⚖️ 신비한 양팔저울</h1><div class="stats"><span class="pill">문제 <b id="round">1</b>/8</span><span class="pill">⭐ <b id="score">0</b></span><span class="pill">최고 <b id="best">0</b></span></div></div><div class="mission" id="mission"></div>
<div class="lab"><div class="scale"><div class="stand"></div><div class="beam" id="beam"><div class="hanger left"></div><div class="hanger right"></div></div><div class="pivot"></div><div class="pan left" id="leftPan"></div><div class="pan right" id="rightPan"></div><div class="total left">왼쪽 <b id="leftTotal">0 g</b></div><div class="total right">오른쪽 <b id="rightTotal">0 g</b></div></div><div class="shelf"><div class="shelf-title">아래 물건을 손가락이나 마우스로 잡아 저울 접시에 올려 보세요 · 접시의 물건을 누르면 내려놓아요</div><div class="items" id="items"></div></div></div><div class="feedback" id="feedback"></div><div class="buttons"><button class="action" id="reset">접시 비우기</button><button class="action primary" id="check">⚖️ 무게 확인</button></div></div>
<div class="overlay" id="intro"><div class="card"><h2>숫자 추 대신 진짜 물건!</h2><p>사과, 귤, 장난감, 책처럼 <b>무게가 표시된 물건</b>을 직접 잡아서 양팔저울 접시에 올립니다.<br><br>양쪽의 합계는 항상 보이고, 무거운 쪽으로 저울이 실제처럼 기울어요.</p><button class="action primary" id="go">저울 사용하기</button></div></div><div class="overlay hide" id="result"><div class="card"><h2>측정 완료!</h2><p id="resultText"></p><button class="action primary" id="again">다시 도전</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),BEST='mathMobileHighScore';const catalog=[{id:'apple',e:'🍎',n:'사과',w:120},{id:'orange',e:'🍊',n:'귤',w:80},{id:'banana',e:'🍌',n:'바나나',w:100},{id:'milk',e:'🥛',n:'우유',w:200},{id:'block',e:'🧱',n:'블록',w:60},{id:'toy',e:'🧸',n:'인형',w:140},{id:'book',e:'📕',n:'책',w:240},{id:'ball',e:'⚾',n:'공',w:160}];const rounds=[{target:240,fixed:'book'},{target:320,fixed:'milk',bonus:'apple'},{target:400,fixed:'book',bonus:'ball'},{target:280,fixed:'milk',bonus:'orange'},{target:360,fixed:'toy',bonus:'book'},{target:440,fixed:'book',bonus:'milk'},{target:300,fixed:'apple',bonus:'toy',bonus2:'block'},{target:520,fixed:'book',bonus:'milk',bonus2:'orange'}];let idx=0,score=0,left=[],right=[],drag=null,audio;
function tone(f=440,d=.07){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
const get=id=>catalog.find(v=>v.id===id),sum=a=>a.reduce((s,v)=>s+v.w,0);function obj(v,fixed=false){let d=document.createElement('div');d.className='obj'+(fixed?' fixed':'');d.innerHTML=`<span class="emo">${v.e}</span><span class="wt">${v.n} ${v.w}g</span>`;d.dataset.id=v.id;return d}
function load(){left=[];right=[];let r=rounds[idx];[r.fixed,r.bonus,r.bonus2].filter(Boolean).forEach(id=>left.push({...get(id),fixed:true}));$('round').textContent=idx+1;$('score').textContent=score;$('best').textContent=localStorage.getItem(BEST)||0;$('mission').innerHTML=`<b>오른쪽 접시에 물건을 올려 ${r.target}g을 만들어 보세요.</b><br><span class="small">왼쪽 물건들의 무게 합과 똑같아지면 성공! 필요한 물건은 여러 번 사용할 수 있어요.</span>`;$('feedback').textContent='물건을 잡아 오른쪽 접시로 옮겨 보세요.';renderShelf();render()}
function renderShelf(){let root=$('items');root.innerHTML='';catalog.forEach(v=>{let e=obj(v);root.append(e);wireDrag(e,v)})}
function render(){let lp=$('leftPan'),rp=$('rightPan');lp.innerHTML='';rp.innerHTML='';left.forEach(v=>lp.append(obj(v,true)));right.forEach((v,i)=>{let e=obj(v);e.title='눌러서 내려놓기';e.onclick=()=>{right.splice(i,1);tone(260,.04);render()};rp.append(e)});let a=sum(left),b=sum(right);$('leftTotal').textContent=a+' g';$('rightTotal').textContent=b+' g';let diff=Math.max(-1,Math.min(1,(b-a)/300)),deg=diff*7;$('beam').style.transform=`rotate(${deg}deg)`;lp.style.transform=`translateY(${-diff*28}px)`;rp.style.transform=`translateY(${diff*28}px)`;let f=$('feedback');if(a===b&&b>0){f.innerHTML='✨ <b>수평이에요!</b> 양쪽이 '+a+'g으로 같습니다.'}else if(b<a)f.textContent=`오른쪽이 ${a-b}g 가벼워요. 물건을 더 올려 보세요.`;else f.textContent=`오른쪽이 ${b-a}g 무거워요. 접시의 물건을 눌러 빼도 돼요.`}
function addTo(pan,v){if(pan==='right'){right.push({...v});tone(520,.05)}else{left.push({...v});tone(420,.05)}render()}
function wireDrag(el,v){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);let g=obj(v);g.classList.add('dragghost');document.body.append(g);drag={g,v,id:e.pointerId};moveGhost(e);tone(330,.03)});el.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)moveGhost(e)});el.addEventListener('pointerup',drop);el.addEventListener('pointercancel',drop)}function moveGhost(e){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';for(let id of ['leftPan','rightPan'])$(id).classList.toggle('dragover',inside($(id),e.clientX,e.clientY))}function inside(el,x,y){let r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}function drop(e){if(!drag)return;let d=drag;drag=null;for(let id of ['leftPan','rightPan'])$(id).classList.remove('dragover');if(inside($('rightPan'),e.clientX,e.clientY))addTo('right',d.v);else if(inside($('leftPan'),e.clientX,e.clientY)){// 연습용으로 왼쪽도 가능하지만 목표물은 유지
 if(!d.v.fixed){left.push({...d.v});render();tone(430,.05)}}d.g.remove()}
$('check').onclick=()=>{let a=sum(left),b=sum(right),target=rounds[idx].target;if(a===b&&a===target){score+=100+Math.max(0,60-right.length*5);$('score').textContent=score;$('feedback').innerHTML='🎉 <b>정답!</b> '+a+'g = '+b+'g';tone(880,.15);setTimeout(()=>{idx++;if(idx>=rounds.length)finish();else load()},650)}else{score=Math.max(0,score-10);$('score').textContent=score;tone(150,.12);$('feedback').innerHTML=`아직 달라요. 왼쪽 <b>${a}g</b>, 오른쪽 <b>${b}g</b>을 다시 비교해 보세요.`}};$('reset').onclick=()=>{right=[];left=[];let r=rounds[idx];[r.fixed,r.bonus,r.bonus2].filter(Boolean).forEach(id=>left.push({...get(id),fixed:true}));render();tone(250,.05)};function finish(){let best=Math.max(score,Number(localStorage.getItem(BEST)||0));localStorage.setItem(BEST,String(best));$('best').textContent=best;$('resultText').innerHTML=`8개의 저울 문제를 모두 해결했어요.<br>점수 <b>${score}</b> · 최고 ${best}<br><br>숫자만 계산하는 대신 물건을 실제로 올리고, 저울의 기울기와 g 단위 합계를 함께 확인했습니다.`;$('result').classList.remove('hide');tone(760,.2)}$('go').onclick=()=>{$('intro').classList.add('hide');load()};$('again').onclick=()=>{idx=0;score=0;$('result').classList.add('hide');load()};load();
})();</script></body></html>
