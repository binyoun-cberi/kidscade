name: Upgrade OUTBREAK transport counts dots

on:
  push:
    paths:
      - 'tools/upgrade_outbreak_transport_counts_dots.py'
      - '.github/workflows/upgrade-outbreak-transport-counts-dots.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OUTBREAK transport/count/dot upgrade
        run: python3 tools/upgrade_outbreak_transport_counts_dots.py
      - name: Commit upgrade and clean helpers
        run: |
          rm -f tools/upgrade_outbreak_transport_counts_dots.py
          rm -f .github/workflows/upgrade-outbreak-transport-counts-dots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add OUTBREAK transport hubs people counts and infection dots"
          git push origin main
