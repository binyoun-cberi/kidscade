name: Hotfix main launcher init once

on:
  push:
    branches: [hotfix/main-launcher-init]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove dangling playtime display call
        run: node scripts/extract-playtime-state.cjs
      - name: Verify launcher initialization path
        run: |
          node --check main-bootstrap.js
          node --check playtime-state.js
          node --test tests/index-base-playtime.test.cjs tests/game-launcher.test.cjs tests/main-architecture.test.cjs tests/release-smoke.test.cjs tests/stats-rankings.test.cjs
          git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_base.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "메인 런처 초기화를 막는 레거시 플레이시간 호출 제거"
          git push
