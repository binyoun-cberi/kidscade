name: Fix Blockraft mobile look
on:
  push:
    branches:
      - fix/blockraft-mobile-look-20260911
    paths:
      - .github/workflows/fix-blockraft-mobile-look.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blockraft-mobile-look-20260911
      - name: Patch mobile look controls
        run: python tools/fix_blockraft_mobile_look.py
      - name: Validate JavaScript and mobile controls
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('블록래프트.html','utf8');
          for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(m[1].trim()) new vm.Script(m[1]);
          }
          if(!html.includes('touch-action: none')) throw new Error('touch-action missing');
          if(!html.includes("event.pointerType === 'touch'")) throw new Error('touch pointer fallback missing');
          if(!html.includes("pointercancel', releaseLookPointer")) throw new Error('pointercancel cleanup missing');
          if(!html.includes("lostpointercapture', releaseLookPointer")) throw new Error('lost pointer cleanup missing');
          console.log('블록래프트 mobile look validation OK');
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "블록래프트.html"
          git diff --cached --quiet || git commit -m "블록래프트 모바일 시점 회전 수정"
          git push origin HEAD:fix/blockraft-mobile-look-20260911
