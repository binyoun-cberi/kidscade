name: Repair and run OUTBREAK v3.2 upgrade

on:
  push:
    paths:
      - 'tools/repair_and_run_outbreak_upgrade.py'
      - '.github/workflows/repair-run-outbreak-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair upgrade script
        run: python3 tools/repair_and_run_outbreak_upgrade.py
      - name: Run OUTBREAK upgrade
        run: python3 tools/upgrade_outbreak_routes.py
      - name: Commit upgrade and clean helpers
        run: |
          rm -f tools/repair_and_run_outbreak_upgrade.py
          rm -f tools/upgrade_outbreak_routes.py
          rm -f .github/workflows/repair-run-outbreak-upgrade.yml
          rm -f .github/workflows/upgrade-outbreak-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve OUTBREAK transmission routes mobile tree and regional diversity"
          git push origin main
