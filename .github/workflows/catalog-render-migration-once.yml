name: One-time catalog icon migration

on:
  push:
    branches: [refactor-catalog-card-rendering-20260915]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-catalog-card-rendering-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve custom game-card icons in catalog
        run: node scripts/migrate-game-catalog.cjs --write
      - name: Commit generated catalog
        shell: bash
        run: |
          if git diff --quiet -- data/games.json; then
            echo "Catalog already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "refactor: preserve legacy SVG icons in game catalog"
          git push origin HEAD:refactor-catalog-card-rendering-20260915
