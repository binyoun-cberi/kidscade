name: Rework OUTBREAK transmission tree

on:
  push:
    paths:
      - 'tools/rework_outbreak_transmission_tree.py'
      - '.github/workflows/rework-outbreak-transmission-tree.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rework grouped transmission tree and syntax check
        run: |
          python3 tools/rework_outbreak_transmission_tree.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('outbreak_korea_v3.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,src in enumerate(scripts):
              Path(f'/tmp/outbreak_group_{i}.js').write_text(src,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/outbreak_group_*.js; do echo "checking $f"; node --check "$f"; done
      - name: Commit verified rework
        run: |
          rm -f tools/rework_outbreak_transmission_tree.py
          rm -f .github/workflows/rework-outbreak-transmission-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework OUTBREAK transmission tree into grouped branches"
          git push origin main
