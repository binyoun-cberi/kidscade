name: Kidscade architecture checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Check main runtime JavaScript syntax
        shell: bash
        run: |
          for file in \
            kidscade-storage.js \
            audio-manager.js \
            touch-interaction-guard.js \
            game-audio-hooks.js \
            profile-history.js \
            account-client.js \
            account-session-safety.js \
            account-ui-runtime.js \
            account-profile-gate.js \
            seed-ranking.js \
            seed-balance-sync.js \
            playtime-state.js \
            seed-wallet.js \
            seed-world-meta.js \
            daily-progress.js \
            achievement-state.js \
            shop-state.js \
            classroom-war-records.js \
            classroom-war-records-observer.js \
            timing-exact10-records.js \
            rhythm-dash-v11.js \
            patience-tower-duel-entry.js \
            teacher-accounts.js \
            age-navigation.js \
            main-bootstrap.js \
            stats-rankings.js \
            server-stats.js \
            worker/index.mjs \
            worker/accounts.mjs \
            worker/teacher-admin.mjs \
            worker/seed-rankings.mjs \
            worker/game-records.mjs \
            worker/multiplayer.mjs \
            worker/wordchain-match.mjs \
            worker/wordchain-room.mjs \
            worker/wordchain-room-router.mjs \
            wordchain-realtime.js \
            worker/tower-room.mjs \
            worker/tower-room-router.mjs \
            tower-realtime.js \
            worker/history-live.mjs \
            worker/main.mjs \
            game-registry.js \
            game-filter.js \
            game-cover-placeholders.js \
            dashboard-recent.js \
            game-recommendations.js \
            game-launcher.js \
            score-display-normalizer.js \
            ui-clarity-overhaul.js \
            ui-topbar-compact.js \
            ui-information-architecture.js \
            ui-visual-polish.js \
            seed-house-entry.js \
            games/low_cleanup_squad/cleanup-squad.js \
            games/high_bridge_builder/bridge-builder.js \
            scripts/secret-audit.cjs \
            scripts/build-cloudflare.cjs \
            scripts/inject-game-integrations.cjs \
            scripts/import-stdict.cjs \
            scripts/build-wordchain-static.cjs \
            scripts/maratang-selfbar-build.cjs \
            scripts/bunsik-kitchen-build.cjs \
            scripts/run-ci-tests.cjs; do
            node --check "$file"
          done
      - name: Reject tracked credentials and secret env files
        run: node scripts/secret-audit.cjs
      - name: Check platform health baseline
        run: npm run health:strict
      - name: Build Cloudflare static artifact
        run: npm run build
      - name: Run all regression tests and audits
        run: npm run test:ci
