name: Fix Classroom War Gates

on:
  push:
    paths:
      - '.github/workflows/fix-classroom-war-gates.yml'
      - 'scripts/fix-classroom-war-gates.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gate movement
        run: node scripts/fix-classroom-war-gates.cjs
      - name: Commit patched game
        run: |
          if git diff --quiet -- classroom_war_3d.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom_war_3d.html
          git commit -m "Make Classroom War gates stationary"
          git push
