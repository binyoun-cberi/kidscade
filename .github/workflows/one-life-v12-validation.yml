name: One Life v12 era regression
on:
  push:
    branches:
      - feat/one-life-v11-v12-era-depth-20261012
    paths:
      - 'games/high_one_life/**'
      - 'tests/one-life*.test.cjs'
      - 'scripts/one-life-v12-stress.cjs'
      - '.github/workflows/one-life-v12-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  era-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One Life era, saved-life and controller tests
        run: |
          node --test tests/one-life-v12.test.cjs tests/one-life-v10.test.cjs tests/one-life-v9.test.cjs tests/one-life-historical.test.cjs tests/one-life-screen-flow.test.cjs
      - name: Run 10,000 whole-life historical stress simulations
        run: node scripts/one-life-v12-stress.cjs 10000
      - name: Syntax validation
        run: |
          node --check games/high_one_life/world-v12.js
          node --check games/high_one_life/era-policy-v12.js
          node --check games/high_one_life/history-choices-v11.js
          node --check games/high_one_life/history-data-v10.js
          node --check games/high_one_life/history-stories-v10.js
          node --check games/high_one_life/world-v2.js
          node --check games/high_one_life/world-v6.js
