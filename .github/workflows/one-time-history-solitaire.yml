name: One-time history solitaire rework

on:
  push:
    paths:
      - '.github/workflows/one-time-history-solitaire.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/history-solitaire-rework
      - name: Write reworked history solitaire and patch index
        shell: bash
        run: |
          cat > /tmp/history.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/history.b64 | gzip -d > '역사뒤집기.html'
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''            <a href="역사뒤집기.html" class="game-card" data-category="trivia" data-age="high" data-id="high_history_match" data-rankkey="historyMatchHS" data-scorekey="historyMatchHS">
                <span class="fav-star">☆</span><div class="game-icon">⚔️</div><div class="game-title">역사 짝맞추기 마스터</div>
                <div class="game-desc">5x5 플립형 카드 보드판을 뒤집으며 한국사 인물과 핵심 사건의 연결고리를 마스터하세요!</div>
            </a>'''
          new='''            <a href="역사뒤집기.html" class="game-card" data-category="trivia" data-age="high" data-id="high_history_match" data-rankkey="historyMatchHS" data-scorekey="historyMatchHS">
                <span class="fav-star">☆</span><div class="game-icon">🃏</div><div class="game-title">한국사 솔리테어</div>
                <div class="game-desc">52명의 역사 인물을 시대 카드로! 빨강·검정을 번갈아 쌓고 네 시대의 한국사 연표를 완성하세요.</div>
            </a>'''
          assert s.count(old)==1, f'old history card count={s.count(old)}'
          p.write_text(s.replace(old,new),encoding='utf-8')
          html=Path('역사뒤집기.html').read_text(encoding='utf-8')
          assert '한국사 솔리테어' in html and 'const SUITS=' in html and 'historyMatchHS' in html
          js=html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/history.js').write_text(js,encoding='utf-8')
          print('history html bytes',len(html.encode()))
          print('index card patched', '한국사 솔리테어' in p.read_text(encoding='utf-8'))
          PY
          node --check /tmp/history.js
      - name: Commit rework
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '역사뒤집기.html' index.html
          git commit -m '역사 짝맞추기를 한국사 솔리테어로 전면 리워크'
          git push origin HEAD:codex/history-solitaire-rework