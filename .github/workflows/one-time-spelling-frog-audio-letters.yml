name: One-time Spelling Frog audio and letters
on:
  push:
    branches:
      - fix/spelling-frog-bgm-letters-20260911
    paths:
      - .github/workflows/one-time-spelling-frog-audio-letters.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spelling-frog-bgm-letters-20260911
      - name: Patch game
        run: python tools/one_time_spelling_frog_audio_letters.py
      - name: Validate and commit
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('스펠링 프로그.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          for(const src of scripts)new vm.Script(src);
          console.log('inline JavaScript syntax OK');
          NODE
          grep -q "function startBgm" "스펠링 프로그.html"
          grep -q "s.scale.set(1.28,1.28,1)" "스펠링 프로그.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "스펠링 프로그.html"
          git commit -m "스펠링 프로그 BGM과 알파벳 가독성 개선"
          git push origin HEAD:fix/spelling-frog-bgm-letters-20260911
