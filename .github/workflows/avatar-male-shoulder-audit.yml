name: Temporary Chibi shoulder geometry audit
on:
  push:
    branches: [fix/chibi-male-shoulder-brows-clipping-20261008]
  pull_request:

permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/studio-audit-http.log 2>&1 &
          sleep 2
      - run: node scripts/avatar-male-shoulder-audit.mjs
