name: Deploy Kidscade to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "app/**"
      - "chibi/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "games/**"
      - "data/**"
      - "assets/**"
      - "teacher/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kidscade-cloudflare-quality-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check platform health baseline
        run: npm run health:strict

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare

      - name: Run regression tests and audits
        run: npm run test:ci

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Serialize publication, without reserving its slot during regression tests.
      group: kidscade-cloudflare-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare

      - name: Verify Cloudflare token identity
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: List accessible D1 databases
        run: npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply kidscade-stats --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed lobby build
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo '[live-check] Checking published Korean Farm catalog, game, and artwork'
          verified=0
          for attempt in $(seq 1 12); do
            version_json="$(curl -fsS -H 'Cache-Control: no-cache' "https://kidscade.binyoun.workers.dev/kidscade-version.json?verify=${EXPECTED_BUILD}" || true)"
            if VERSION_JSON="$version_json" EXPECTED_BUILD="$EXPECTED_BUILD" node -e '
              const payload = JSON.parse(process.env.VERSION_JSON || "{}");
              process.exit(payload.build === process.env.EXPECTED_BUILD ? 0 : 1);
            '; then
              verified=1
              break
            fi
            echo "Waiting for deployed build ${EXPECTED_BUILD:0:12} (attempt ${attempt}/12)"
            sleep 5
          done

          if [ "$verified" -ne 1 ]; then
            echo "Production version manifest did not reach the deployed commit."
            exit 1
          fi

          curl -fsS -H 'Cache-Control: no-cache' "https://kidscade.binyoun.workers.dev/?verify=${EXPECTED_BUILD}" -o /tmp/kidscade-home.html
          grep -q 'window.KidscadeCatalog=' /tmp/kidscade-home.html
          if grep -q 'main-bootstrap\.js' /tmp/kidscade-home.html; then
            echo "Production lobby unexpectedly contains the destructive runtime bootstrap."
            exit 1
          fi
          curl -fsS -H 'Cache-Control: no-cache' "https://kidscade.binyoun.workers.dev/home-v2.js?verify=${EXPECTED_BUILD}" -o /dev/null
          # Korean Farm was previously merged but hidden because no catalog record existed.
          # Verify the newly published lobby actually exposes its game entry and artwork.
          curl -fsS -H 'Cache-Control: no-cache' "https://kidscade.binyoun.workers.dev/data/games.json?verify=${EXPECTED_BUILD}" -o /tmp/kidscade-games.json
          node -e '
            const fs = require("node:fs");
            const catalog = JSON.parse(fs.readFileSync("/tmp/kidscade-games.json", "utf8"));
            const game = catalog.games?.find(x => x.id === "korean_farm");
            if (!game || game.title !== "논두렁 너머" ||
                game.href !== "games/korean-farm/index.html" ||
                game.cover !== "assets/gate-image/korean_farm_cover.webp") {
              console.error("Production Korean Farm entry missing or invalid");
              process.exit(1);
            }
          '
          curl -fsSL "https://kidscade.binyoun.workers.dev/games/korean-farm/index.html?verify=${EXPECTED_BUILD}" -o /tmp/kidscade-korean-farm.html
          grep -q 'data-game-id="korean_farm"' /tmp/kidscade-korean-farm.html
          curl -fsS "https://kidscade.binyoun.workers.dev/assets/gate-image/korean_farm_cover.webp?verify=${EXPECTED_BUILD}" -o /tmp/kidscade-korean-farm-cover.webp
          node -e '
            const data = require("node:fs").readFileSync("/tmp/kidscade-korean-farm-cover.webp");
            if (data.length < 12 || data.toString("ascii", 0, 4) !== "RIFF" || data.toString("ascii", 8, 12) !== "WEBP") {
              console.error("Production Korean Farm cover is not a valid WebP image");
              process.exit(1);
            }
          '

          # Confirm the actual deployed HTML references downloadable icon binaries.
          favicon_path="$(grep -oE '/favicon-[0-9a-f]{12}\.png' /tmp/kidscade-home.html | head -n 1)"
          touch_path="$(grep -oE '/apple-touch-icon-[0-9a-f]{12}\.png' /tmp/kidscade-home.html | head -n 1)"
          curl -fsS "https://kidscade.binyoun.workers.dev${favicon_path}" -o /tmp/kidscade-favicon.png
          curl -fsS "https://kidscade.binyoun.workers.dev${touch_path}" -o /tmp/kidscade-apple-touch.png
          curl -fsS "https://kidscade.binyoun.workers.dev/favicon.ico" -o /tmp/kidscade-favicon.ico
          node -e '
            const fs = require("node:fs");
            for (const path of ["/tmp/kidscade-favicon.png", "/tmp/kidscade-apple-touch.png"]) {
              const data = fs.readFileSync(path);
              if (!data.subarray(0, 8).equals(Buffer.from("89504e470d0a1a0a", "hex"))) process.exit(1);
            }
            const ico = fs.readFileSync("/tmp/kidscade-favicon.ico");
            if (ico.readUInt16LE(0) !== 0 || ico.readUInt16LE(2) !== 1 || ico.readUInt16LE(4) !== 2) process.exit(1);
          '


          teacher_url="https://kidscade.binyoun.workers.dev/teacher/character-3d-studio.html?verify=${EXPECTED_BUILD}"
          curl -fsS -D /tmp/kidscade-teacher.headers -H 'Cache-Control: no-cache' "$teacher_url" -o /tmp/kidscade-teacher.html
          grep -q 'data-layout-version="left-rail-no-scroll-v4"' /tmp/kidscade-teacher.html
          grep -q 'value="kidscade_male_hair_short"' /tmp/kidscade-teacher.html
          grep -Eq 'character-3d-studio-[0-9a-f]{12}\.js' /tmp/kidscade-teacher.html
          tr -d '\r' < /tmp/kidscade-teacher.headers | grep -i '^cache-control:.*no-store' >/dev/null

          echo "Production lobby and teacher studio smoke checks passed for ${EXPECTED_BUILD:0:12}."

      - name: Static smoke — verify every gate image
        env:
          SITE_URL: https://kidscade.binyoun.workers.dev/
          EXPECTED_BUILD: ${{ github.sha }}
        run: node scripts/live-gate-image-smoke.mjs

      - name: Browser smoke — gate images, account UI, and home toggle
        env:
          SITE_URL: https://kidscade.binyoun.workers.dev/
          EXPECTED_BUILD: ${{ github.sha }}
          SMOKE_HARD_TIMEOUT_MS: "90000"
        run: timeout 100s node scripts/live-home-toggle-smoke.mjs
