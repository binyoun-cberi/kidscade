name: One-time 3D mart catalog update

on:
  push:
    branches:
      - rework/neighborhood-mart-3d

permissions:
  contents: write

jobs:
  update-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rework/neighborhood-mart-3d
      - name: Update mart catalog entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('data/games.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          matches = [g for g in data['games'] if g.get('id') == 'math_base10_blocks']
          if len(matches) != 1:
              raise SystemExit(f'Expected one math_base10_blocks entry, found {len(matches)}')
          game = matches[0]
          game['href'] = '10개가 모이면! 수 막대 계산실.html?v=2'
          game['description'] = '3D 마트 계산대에서 실제 상품을 직접 스캔하고 합계를 확인한 뒤, 손님이 낸 돈에서 상품값을 빼 알맞은 지폐와 동전으로 거스름돈을 계산해요.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "Update neighborhood mart catalog for 3D rework"
          git push origin HEAD:rework/neighborhood-mart-3d