name: Legacy avatar sheet hair build (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/extract-avatar-hair.py
      - shell: bash
        run: |
          TARGETS="assets/game/characters/kidscade-avatar-v1/runtime/hair assets/game/characters/kidscade-avatar-v1/qa/hair"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A $TARGETS
          git commit -m "Build legacy avatar sheet hair runtime assets"
          git pull --rebase origin main
          git push