name: Build avatar front-hair runtime assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avatar-hair-extract.yml'
      - 'scripts/extract-avatar-hair.py'
      - 'assets/game/characters/kidscade-avatar-v1/source/hair/front-sheets/**'
      - 'assets/game/characters/kidscade-avatar-v1/runtime/base/master-base-128.png'
      - 'assets/game/characters/kidscade-avatar-v1/runtime/face/**'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/extract-avatar-hair.py
      - shell: bash
        run: |
          TARGETS="assets/game/characters/kidscade-avatar-v1/runtime/hair assets/game/characters/kidscade-avatar-v1/qa/hair assets/game/characters/kidscade-avatar-v1/qa/hair-front"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A $TARGETS
          git commit -m "Build split avatar hair runtime assets"
          git pull --rebase origin main
          git push
