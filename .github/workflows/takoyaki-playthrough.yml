name: Takoyaki browser playthrough
on:
  pull_request:
    paths:
      - 'games/job_takoyaki_simulator/**'
      - 'tests/takoyaki-*.cjs'
      - '.github/workflows/takoyaki-playthrough.yml'
  workflow_dispatch:
jobs:
  takoyaki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run takoyaki recipe and progression tests
        run: node --test tests/takoyaki-v2-stability.test.cjs tests/takoyaki-preschool-progression.test.cjs tests/takoyaki-orders-quality.test.cjs
      - name: Install Korean fonts for accurate screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Simulate every day and inspect real browser
        run: node tests/takoyaki-browser-playthrough.cjs
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takoyaki-browser-screenshots
          path: artifacts/takoyaki-browser-audit/*.jpg
          if-no-files-found: warn
