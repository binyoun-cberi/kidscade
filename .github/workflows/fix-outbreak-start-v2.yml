name: Fix OUTBREAK startup v2

on:
  push:
    paths:
      - 'tools/fix_outbreak_startup_v2.py'
      - '.github/workflows/fix-outbreak-start-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and syntax check
        run: |
          python3 tools/fix_outbreak_startup_v2.py
          for f in /tmp/outbreak_*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Commit verified fix
        run: |
          rm -f tools/fix_outbreak_startup_v2.py
          rm -f .github/workflows/fix-outbreak-start-v2.yml
          rm -f .github/workflows/fix-outbreak-start.yml
          rm -f .github/workflows/check-outbreak-js.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix OUTBREAK startup and initial region selection"
          git push origin main
