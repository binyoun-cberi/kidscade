name: Classroom War Projectile Rework

on:
  push:
    paths:
      - '.github/workflows/classroom-war-projectile-rework.yml'
      - 'scripts/classroom-war-projectile-rework.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch combat system
        run: node scripts/classroom-war-projectile-rework.cjs
      - name: Commit reworked game
        run: |
          if git diff --quiet -- classroom_war_3d.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom_war_3d.html
          git commit -m "Rework Classroom War projectile combat"
          git push
