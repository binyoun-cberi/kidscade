name: One-time Kidscade game polish
on:
  push:
    branches:
      - fix/kidscade-gameplay-polish-20260911
    paths:
      - .github/workflows/one-time-game-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kidscade-gameplay-polish-20260911
          fetch-depth: 0
      - name: Apply patches
        run: python tools/one_time_game_polish.py
      - name: Commit patched files
        run: |
          git rm .github/workflows/one-time-game-polish.yml tools/one_time_game_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "게임 플레이 개선 및 우주 간식 뽑기 제거"
          git push origin HEAD:fix/kidscade-gameplay-polish-20260911
