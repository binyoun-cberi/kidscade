name: Add OUTBREAK KOREA card

on:
  push:
    paths:
      - '.github/workflows/add-outbreak-card.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add upper-grade game card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'data-id="high_outbreak_korea"'
          if marker not in text:
              needle = '            <a href="역사뒤집기.html"'
              if needle not in text:
                  raise SystemExit('Could not find insertion point in index.html')
              card = '''            <a href="outbreak_korea_v3.html" class="game-card" data-category="trivia" data-age="high" data-id="high_outbreak_korea">
                <span class="fav-star">☆</span><div class="game-icon">🦠</div><div class="game-title">OUTBREAK KOREA</div>
                <div class="game-desc">17개 시·도를 오가며 확산과 대응을 시뮬레이션해 보세요. 진화·방역·의료·연구의 선택이 결과를 바꾸는 고학년 전략 게임입니다.</div>
            </a>
'''
              text = text.replace(needle, card + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/add-outbreak-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add OUTBREAK KOREA to upper-grade arcade"
          git push origin main
