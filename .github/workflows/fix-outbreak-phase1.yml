name: Fix OUTBREAK phase 1 balance

on:
  push:
    paths:
      - 'tools/fix_outbreak_phase1.py'
      - '.github/workflows/fix-outbreak-phase1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply phase 1 balance repair
        run: python3 tools/fix_outbreak_phase1.py
      - name: Commit repair
        run: |
          rm -f tools/fix_outbreak_phase1.py
          rm -f .github/workflows/fix-outbreak-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix OUTBREAK passive phase 1 completion"
          git push origin main
