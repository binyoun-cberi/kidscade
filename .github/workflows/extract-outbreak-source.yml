name: Extract OUTBREAK source

on:
  push:
    paths:
      - '.github/workflows/extract-outbreak-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compressed game source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts=[]
          for n in range(1,6):
              parts.append(Path(f'assets/outbreak/outbreak_payload_{n}.txt').read_text(encoding='utf-8').strip())
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          Path('outbreak_korea_source.html').write_text(html,encoding='utf-8')
          PY
      - name: Commit extracted source
        run: |
          rm .github/workflows/extract-outbreak-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outbreak_korea_source.html .github/workflows/extract-outbreak-source.yml
          git commit -m "Extract OUTBREAK KOREA source for mobile rework"
          git push origin main
