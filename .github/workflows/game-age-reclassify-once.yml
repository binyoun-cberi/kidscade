name: One-time game age reclassification

on:
  push:
    branches: [fix-game-age-classification-20260915]
    paths:
      - '.github/workflows/game-age-reclassify-once.yml'

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-game-age-classification-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed age classification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'data/games.json';
          const catalog = JSON.parse(fs.readFileSync(file, 'utf8'));
          const changes = {
            math_timing_lcd: 'low',
            sim_mosquito: 'high',
            low_big_puzzle_time: 'high',
            tod_emoji_minesweeper: 'high',
            low_rubiks_cube: 'high',
            high_3d_block_painter: 'low',
            magic_scale: 'low',
            hanja_survivors_8: 'low',
            high_gugudan_stairs: 'low',
            joseon_janggu: 'low',
            burger_master: 'job',
            tod_puzzle_time: 'low'
          };
          const byId = new Map(catalog.games.map(game => [game.id, game]));
          for (const [id, age] of Object.entries(changes)) {
            const game = byId.get(id);
            if (!game) throw new Error(`Missing game: ${id}`);
            game.age = age;
          }
          fs.writeFileSync(file, JSON.stringify(catalog, null, 2) + '\n');
          console.log('Reclassified', Object.keys(changes).length, 'games');
          NODE
      - name: Commit catalog update
        shell: bash
        run: |
          if git diff --quiet -- data/games.json; then
            echo 'Catalog already classified.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json
          git commit -m 'fix: correct game age classifications'
          git push origin HEAD:fix-game-age-classification-20260915
