name: Restore Classroom War Plain HTML

on:
  push:
    paths:
      - '.github/workflows/restore-classroom-war.yml'
      - 'scripts/restore-classroom-war.cjs'
      - 'scripts/classroom-war-repair-tail.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate Classroom War HTML
        id: restore
        run: node scripts/restore-classroom-war.cjs

      - name: Commit validated plain HTML if changed
        run: |
          if git diff --quiet -- classroom_war_3d.html; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom_war_3d.html
          git commit -m "Restore Classroom War as validated plain HTML"
          git push
