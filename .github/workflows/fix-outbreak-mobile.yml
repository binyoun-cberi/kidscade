name: Fix OUTBREAK mobile UI

on:
  push:
    paths:
      - 'tools/fix_outbreak_mobile.py'
      - '.github/workflows/fix-outbreak-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile repair
        run: python3 tools/fix_outbreak_mobile.py
      - name: Clean temporary files and commit
        run: |
          rm -f outbreak_korea_source.html
          rm -f assets/outbreak/outbreak_payload_*.txt
          rmdir assets/outbreak 2>/dev/null || true
          rm -f tools/fix_outbreak_mobile.py
          rm -f .github/workflows/fix-outbreak-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore OUTBREAK evolution tree and mobile gameplay UI"
          git push origin main
