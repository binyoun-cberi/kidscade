name: Refactor daily progress once

on:
  push:
    branches: [refactor/index-base-daily-progress]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract daily progress state
        run: node scripts/extract-daily-progress.cjs
      - name: Verify daily progress refactor
        run: |
          node --check daily-progress.js
          node --check main-bootstrap.js
          node --test tests/daily-progress.test.cjs tests/index-base-daily-progress.test.cjs tests/seed-wallet.test.cjs tests/game-launcher.test.cjs tests/main-architecture.test.cjs tests/release-smoke.test.cjs tests/storage.test.cjs
          git diff --check
      - name: Commit generated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_base.html main-bootstrap.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "index_base 일일 진행 상태를 공통 모듈로 분리"
          git push
