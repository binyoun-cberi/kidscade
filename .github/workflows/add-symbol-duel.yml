name: Add toddler symbol duel
on:
  push:
    branches:
      - fix/toddler-symbol-duel-20260911
    paths:
      - .github/workflows/add-symbol-duel.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toddler-symbol-duel-20260911
      - name: Add index card
        run: python tools/add_symbol_duel_card.py
      - name: Validate game
        run: node tools/validate_symbol_duel.js
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "유아용 딱 하나 그림 대결 카드 등록"
          git push origin HEAD:fix/toddler-symbol-duel-20260911
