name: One-time spelling frog crossroad polish

on:
  push:
    paths:
      - '.github/workflows/one-time-spelling-frog-crossroad.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/spelling-frog-crossroad
      - name: Patch endless-play safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('스펠링 프로그.html')
          s=p.read_text()
          old="function ensureRows(to){for(let r=rowCounter;r<=to;r++){createRow(r,laneType(r));spawnFly(r);rowCounter=r+1}}"
          new=old+"\nfunction pruneWorld(){const cutoff=Math.max(0,maxRow-30);for(const [r,d] of [...world]){if(r<cutoff&&r!==checkpoint.row){scene.remove(d.group);world.delete(r)}}vehicles=vehicles.filter(v=>v.row>=cutoff);logs=logs.filter(v=>v.row>=cutoff);trains=trains.filter(v=>v.row>=cutoff);flies=flies.filter(v=>v.row>=cutoff)}"
          assert s.count(old)==1
          s=s.replace(old,new)
          old2="if(dz>0&&frogRow>maxRow){maxRow=frogRow;score+=5;localStorage.setItem('spellingFrogHighScore',Math.max(Number(localStorage.getItem('spellingFrogHighScore')||0),maxRow*5));}setTimeout(()=>afterLand(fromRow,fromCol),205);updateUI()}"
          new2="if(dz>0&&frogRow>maxRow){maxRow=frogRow;score+=5;localStorage.setItem('spellingFrogHighScore',Math.max(Number(localStorage.getItem('spellingFrogHighScore')||0),maxRow*5));pruneWorld();}setTimeout(()=>afterLand(fromRow,fromCol),205);updateUI()}"
          assert s.count(old2)==1
          s=s.replace(old2,new2)
          old3="toast('❌ '+letter+' 말고 '+targetLetter()+'!');bounceTo(oldRow,oldCol);return"
          new3="toast('❌ '+letter+' 말고 '+targetLetter()+'!');const oldType=world.get(oldRow)?.type;const safe=(oldType==='grass'||oldType==='letter')?{row:oldRow,col:oldCol}:checkpoint;bounceTo(safe.row,safe.col);return"
          assert s.count(old3)==1
          s=s.replace(old3,new3)
          p.write_text(s)
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('스펠링 프로그.html').read_text()
          js=re.findall(r'<script>([\s\S]*?)</script>',s)[-1]
          Path('/tmp/check.js').write_text(js)
          assert 'function pruneWorld()' in s
          PY
          node --check /tmp/check.js
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "스펠링 프로그.html"
          git commit -m "스펠링 프로그 무한 맵 정리와 오답 복귀 안정화"
          git push origin HEAD:codex/spelling-frog-crossroad
