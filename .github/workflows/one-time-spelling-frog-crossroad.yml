name: One-time spelling frog crossroad rework

on:
  push:
    paths:
      - '.github/workflows/one-time-spelling-frog-crossroad.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/spelling-frog-crossroad
      - name: Build 3D spelling crossroad
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          raw=Path('.github/spelling_payload.b64').read_text().strip()
          Path('/tmp/template.html').write_bytes(gzip.decompress(base64.b64decode(raw)))
          PY
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const old=fs.readFileSync('스펠링 프로그.html','utf8');
          const m=old.match(/const rawDict\s*=\s*("(?:\\.|[^"\\])*");/s);
          if(!m) throw new Error('기존 rawDict를 찾지 못했습니다.');
          const raw=vm.runInNewContext(m[1]);
          let html=fs.readFileSync('/tmp/template.html','utf8');
          if(!html.includes('/*__RAWDICT__*/')) throw new Error('템플릿 placeholder 없음');
          html=html.replace('/*__RAWDICT__*/','const rawDict='+JSON.stringify(raw)+';');
          fs.writeFileSync('스펠링 프로그.html',html);
          const parse=(txt)=>{const set=new Set();txt.split('|').forEach(g=>{const p=g.indexOf(':');(p>=0?g.slice(p+1):g).split(',').forEach(x=>{const i=x.indexOf('=');if(i>0)set.add(x.slice(0,i).trim().toUpperCase())})});return set};
          const oldSet=parse(raw),all=new Set(oldSet);
          const ex=(html.match(/const extraRaw=`([\s\S]*?)`;/)||[])[1]||'';
          let added=0;ex.split('\n').forEach(x=>{const i=x.indexOf('=');if(i>0){const w=x.slice(0,i).trim().toUpperCase();if(!all.has(w)){all.add(w);added++}}});
          console.log(`기존 ${oldSet.size}개 + 신규 ${added}개 = 총 ${all.size}개 단어`);
          let index=fs.readFileSync('index.html','utf8');
          const from='영단어 무한 끝말잇기 생존!';
          const to='블록 개구리로 도로·강·철길을 건너며 알파벳 체크포인트를 밟아 영단어를 완성하는 3D 영어 어드벤처!';
          const count=index.split(from).length-1;
          if(count!==1) throw new Error(`index 설명 치환 대상 ${count}개`);
          fs.writeFileSync('index.html',index.replace(from,to));
          NODE
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('스펠링 프로그.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('inline script 없음')
          Path('/tmp/spelling-check.js').write_text(scripts[-1])
          assert '/*__RAWDICT__*/' not in s
          assert 'THREE.OrthographicCamera' in s
          assert 'spellingFrogHighScore' in s
          assert 'data-move="0,1"' in s
          print('HTML bytes:',len(s.encode()))
          PY
          node --check /tmp/spelling-check.js
      - name: Commit rework
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "스펠링 프로그.html" index.html
          git commit -m "스펠링 프로그를 3D 길건너기 어드벤처로 리워크"
          git push origin HEAD:codex/spelling-frog-crossroad
