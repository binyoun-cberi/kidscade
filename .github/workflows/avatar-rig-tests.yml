name: Avatar rig checks

on:
  pull_request:
    paths:
      - 'pixel-avatar-renderer.js'
      - 'avatar-pixel-studio.js'
      - 'avatar-wardrobe-parts.js'
      - 'assets/game/characters/kidscade-avatar-v3/**'
      - 'tests/avatar-wardrobe.test.cjs'
      - 'avatar-studio.html'
      - 'avatar-integration.js'
      - 'account-profile-gate.js'
      - 'account-session-safety.js'
      - 'pixel-avatar-lab.html'
      - 'scripts/extract-avatar-hair.py'
      - 'assets/game/characters/kidscade-avatar-v1/**'
      - 'tests/pixel-avatar-studio.test.cjs'
      - 'tests/ui-information-architecture.test.cjs'
      - 'games/cube3d/cube-architect-avatar.js'
      - 'tests/cube-architect-v21.test.cjs'
      - '.github/workflows/avatar-rig-tests.yml'
  push:
    branches: [main]
    paths:
      - 'pixel-avatar-renderer.js'
      - 'avatar-pixel-studio.js'
      - 'avatar-wardrobe-parts.js'
      - 'assets/game/characters/kidscade-avatar-v3/**'
      - 'tests/avatar-wardrobe.test.cjs'
      - 'avatar-studio.html'
      - 'avatar-integration.js'
      - 'account-profile-gate.js'
      - 'account-session-safety.js'
      - 'pixel-avatar-lab.html'
      - 'assets/game/characters/kidscade-avatar-v1/**'
      - 'tests/pixel-avatar-studio.test.cjs'
      - 'games/cube3d/cube-architect-avatar.js'
      - 'tests/cube-architect-v21.test.cjs'
      - '.github/workflows/avatar-rig-tests.yml'

permissions:
  contents: read

jobs:
  avatar-rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retired legacy hair tool
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m py_compile scripts/extract-avatar-hair.py
      - name: Check avatar runtime syntax
        run: |
          node --check pixel-avatar-renderer.js
          node --check avatar-pixel-studio.js
          node --check avatar-wardrobe-parts.js
          node --check avatar-integration.js
          node --check account-profile-gate.js
          node --check account-session-safety.js
      - name: Run avatar rig regression tests
        run: node --test tests/avatar-wardrobe.test.cjs tests/pixel-avatar-studio.test.cjs tests/ui-information-architecture.test.cjs tests/cube-architect-v21.test.cjs