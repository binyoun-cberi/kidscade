name: Validate game polish
on:
  push:
    branches:
      - fix/kidscade-gameplay-polish-20260911
    paths:
      - .github/workflows/validate-game-polish.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          for f in "스펠링 프로그.html" "학교의 탑.html" "프레디의 샌드위치 가게.html" "바람을 타고 연날리기.html" "신비의양팔저울.html"; do
            python -c "import re,sys; s=open(sys.argv[1],encoding='utf-8').read(); print('\\n'.join(body for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I) if 'src=' not in attrs.lower()))" "$f" > /tmp/check.js
            node --check /tmp/check.js
          done
      - name: Check requested changes
        run: |
          test ! -e "우주 간식 뽑기 실험실.html"
          ! grep -q "우주 간식 뽑기 실험실.html" index.html
          grep -q "landingFrom" "스펠링 프로그.html"
          grep -q "installCardDrag" "학교의 탑.html"
          grep -q "VICTORY" "학교의 탑.html"
          grep -q "DEFEAT" "학교의 탑.html"
          grep -q "target:380" "신비의양팔저울.html"
          grep -q "target:320" "신비의양팔저울.html"
