name: Import curated avatar hair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avatar-hair-import.yml'
      - 'scripts/import-avatar-hair.py'
      - 'assets/game/characters/kidscade-avatar-v1/runtime/hair/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-hair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Normalize and register hair sprites
        run: python scripts/import-avatar-hair.py
      - name: Commit curated hair assets
        shell: bash
        run: |
          TARGETS="assets/game/characters/kidscade-avatar-v1/runtime/hair"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo "No hair import changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $TARGETS
          git commit -m "Avatar: normalize and register 10 short male hairstyles"
          git push origin HEAD:main
