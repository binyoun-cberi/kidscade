name: Word Siege browser audit
on:
  pull_request:
    paths:
      - 'games/language_word_siege/**'
      - 'tests/word-siege-browser-audit.cjs'
      - '.github/workflows/word-siege-browser-audit.yml'
  workflow_dispatch:

jobs:
  chrome-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean fallback font for screenshot review
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Inspect Chrome
        run: command -v google-chrome || command -v chromium
      - name: Audit Word Siege on 4 screen sizes
        run: node tests/word-siege-browser-audit.cjs
