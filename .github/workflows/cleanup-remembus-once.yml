name: One-time Remembus legacy cleanup

on:
  push:
    branches:
      - cleanup/remove-remembus-catalog

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-remembus-catalog
      - name: Remove retired Remembus legacy card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index_base.html')
          text = path.read_text(encoding='utf-8')
          marker = 'data-id="math_remembus"'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Remembus marker not found')
          start = text.rfind('<a', 0, pos)
          end = text.find('</a>', pos)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Remembus card boundaries')
          end += len('</a>')
          while end < len(text) and text[end] in ' \t\r\n':
              end += 1
          updated = text[:start] + text[end:]
          if marker in updated:
              raise SystemExit('Remembus marker still remains after cleanup')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_base.html
          git commit -m "Remove legacy Remembus card"
          git push origin HEAD:cleanup/remove-remembus-catalog
