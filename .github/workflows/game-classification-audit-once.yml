name: One-time game classification audit

on:
  push:
    branches: [fix-game-age-classification-20260915]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit age classification and duplicate cards
        run: node scripts/audit-game-classification.cjs
