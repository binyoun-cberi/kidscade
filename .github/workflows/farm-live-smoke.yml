name: Korean Farm public route smoke

on:
  workflow_run:
    workflows: ["Deploy Kidscade to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  farm-public-route:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect live catalog, game route, and cover
        shell: bash
        run: |
          set -euo pipefail
          base='https://kidscade.binyoun.workers.dev'
          for spec in 'data/games.json|catalog.json' 'games/korean-farm/index.html|game.html' 'assets/gate-image/korean_farm_cover.webp|cover.webp'; do
            route="${spec%%|*}"
            file="${spec##*|}"
            echo "[farm-route] GET /${route}"
            curl -fsSL --max-time 15 -D "/tmp/${file}.headers" -o "/tmp/${file}" -w "HTTP: %{http_code}; effective: %{url_effective}; bytes: %{size_download}\n" "${base}/${route}?smoke=${GITHUB_RUN_ID}"
            grep -i -E '^(HTTP/|content-type:|location:|cache-control:)' "/tmp/${file}.headers" || true
          done
          node <<'NODE'
          const fs = require('node:fs');
          const cat = JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const game = cat.games.find(x => x.id === 'korean_farm');
          console.log('[farm-route] catalog-entry', JSON.stringify(game || null));
          const html = fs.readFileSync('/tmp/game.html','utf8');
          console.log('[farm-route] game HTML bytes', html.length);
          console.log('[farm-route] first chars', JSON.stringify(html.slice(0,480)));
          console.log('[farm-route] SDK exact', html.includes('data-game-id="korean_farm"'));
          console.log('[farm-route] title index', html.indexOf('논두렁 너머'));
          console.log('[farm-route] HTML doctype index', html.toLowerCase().indexOf('<!doctype'));
          const cover = fs.readFileSync('/tmp/cover.webp');
          const validWebp = cover.length >= 12 && cover.toString('ascii', 0, 4) === 'RIFF' && cover.toString('ascii', 8, 12) === 'WEBP';
          console.log('[farm-route] cover bytes', cover.length, 'valid WebP:', validWebp);
          if (!game || game.title !== '논두렁 너머' || game.cover !== 'assets/gate-image/korean_farm_cover.webp') process.exitCode = 1;
          if (!html.includes('data-game-id="korean_farm"')) process.exitCode = 1;
          if (!validWebp) process.exitCode = 1;
          NODE
