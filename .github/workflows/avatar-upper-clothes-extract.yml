name: Build animated upper clothing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avatar-upper-clothes-extract.yml'
      - 'scripts/extract-avatar-upper-clothes.py'
      - 'assets/game/characters/kidscade-avatar-v1/source/clothes/upper/animated/**'
      - 'assets/game/characters/kidscade-avatar-v1/runtime/animation/**'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/extract-avatar-upper-clothes.py
      - shell: bash
        run: |
          TARGETS="assets/game/characters/kidscade-avatar-v1/runtime/clothes/upper assets/game/characters/kidscade-avatar-v1/qa/clothes/upper"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A $TARGETS
          git commit -m "Build animated upper clothing runtime asset"
          git pull --rebase origin main
          git push
