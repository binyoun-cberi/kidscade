<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>한 번에 쓱! - 한붓그리기</title>
<style>
:root{
  --ink:#303845;
  --muted:#758090;
  --paper:#f7f9fc;
  --panel:rgba(255,255,255,.9);
  --line:#d8dde5;
  --orange:#ff8a1f;
  --orange2:#ffb33c;
  --blue:#4f7cff;
  --mint:#39c8a8;
  --danger:#ff5c70;
  --shadow:0 18px 50px rgba(36,48,72,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edf2f8;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid rgba(79,124,255,.28);outline-offset:3px}
.app{
  width:100%;height:100%;position:relative;overflow:hidden;
  background:
    linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.25)),
    repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 2px,transparent 2px 38px),
    #edf2f8;
}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
.glass{
  background:var(--panel);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}
.icon-btn{
  width:54px;height:54px;border:0;border-radius:18px;background:white;
  box-shadow:0 9px 24px rgba(39,52,80,.14);cursor:pointer;
  display:grid;place-items:center;transition:.16s transform,.16s box-shadow;
}
.icon-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 5px 15px rgba(39,52,80,.14)}
.icon-btn svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}

/* 홈 */
#home{align-items:center;justify-content:center;padding:24px}
.home-card{
  width:min(720px,94vw);padding:42px;border-radius:34px;text-align:center;position:relative;overflow:hidden;
}
.home-card:before,.home-card:after{
  content:"";position:absolute;border-radius:999px;filter:blur(2px);opacity:.16
}
.home-card:before{width:240px;height:240px;background:var(--orange);left:-100px;top:-110px}
.home-card:after{width:280px;height:280px;background:var(--blue);right:-140px;bottom:-150px}
.logo-mark{width:110px;height:110px;margin:0 auto 18px;position:relative}
.logo-mark i{position:absolute;width:20px;height:20px;background:var(--ink);border-radius:50%;box-shadow:0 4px 0 rgba(48,56,69,.12)}
.logo-mark i:nth-child(1){left:10px;top:58px}
.logo-mark i:nth-child(2){left:45px;top:14px}
.logo-mark i:nth-child(3){right:10px;top:58px}
.logo-mark i:nth-child(4){left:45px;bottom:2px}
.logo-mark span{position:absolute;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--orange2));transform-origin:left center}
.logo-mark span:nth-of-type(1){width:56px;left:23px;top:61px;transform:rotate(-51deg)}
.logo-mark span:nth-of-type(2){width:56px;left:56px;top:27px;transform:rotate(51deg)}
.logo-mark span:nth-of-type(3){width:56px;left:24px;top:63px;transform:rotate(51deg)}
.logo-mark span:nth-of-type(4){width:56px;left:57px;top:98px;transform:rotate(-51deg)}
h1{font-size:clamp(36px,6vw,64px);line-height:1;margin:0 0 12px;letter-spacing:-.05em}
.subtitle{margin:0 auto 30px;color:var(--muted);font-size:clamp(16px,2.2vw,20px)}
.main-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.big-btn{
  min-height:68px;border:0;border-radius:20px;padding:0 24px;font-size:20px;font-weight:900;cursor:pointer;
  transition:.16s transform,.16s filter;box-shadow:0 10px 24px rgba(39,52,80,.13)
}
.big-btn:active{transform:translateY(2px) scale(.985)}
.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:white}
.secondary{background:#fff}
.home-bottom{display:flex;justify-content:center;gap:10px;margin-top:18px}
.mini-toggle{
  border:0;border-radius:14px;background:#eef2f7;padding:10px 14px;font-weight:800;cursor:pointer;color:#596476
}
.mini-toggle.on{background:#e6f8f3;color:#16866f}

/* 스테이지 선택 */
#select{flex-direction:column;padding:20px}
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;width:100%;margin:0 auto}
.topbar h2{margin:0;font-size:28px;letter-spacing:-.04em}
.select-wrap{
  width:min(1080px,100%);margin:8px auto 0;padding:24px;border-radius:28px;overflow:auto;min-height:0;
}
.stage-grid{display:grid;grid-template-columns:repeat(10,minmax(64px,1fr));gap:12px}
.stage-card{
  aspect-ratio:1;border:0;border-radius:18px;background:#f1f4f8;cursor:pointer;font-weight:950;font-size:19px;position:relative;
  box-shadow:inset 0 0 0 1px #e1e6ed;transition:.15s transform,.15s background
}
.stage-card:hover{transform:translateY(-2px)}
.stage-card.done{background:linear-gradient(145deg,#e6fbf5,#d9f5ee);color:#137a67;box-shadow:inset 0 0 0 1px #bcebdd}
.stage-card.done:after{content:"✓";position:absolute;right:7px;top:5px;font-size:13px}
.stage-card.current{background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;box-shadow:0 8px 18px rgba(255,138,31,.26)}
.select-info{margin-top:18px;color:var(--muted);text-align:center;font-weight:700}

/* 게임 */
#game{flex-direction:column}
.game-hud{
  height:88px;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;z-index:5
}
.hud-group{display:flex;align-items:center;gap:12px}
.progress-box{
  min-width:150px;height:56px;border-radius:18px;background:rgba(48,56,69,.94);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:950;letter-spacing:.02em;
  box-shadow:0 10px 25px rgba(48,56,69,.18)
}
.stage-pill{height:46px;padding:0 18px;border-radius:15px;background:#fff;display:flex;align-items:center;font-weight:900;box-shadow:0 8px 20px rgba(39,52,80,.1)}
.board-wrap{flex:1;min-height:0;position:relative;padding:0 18px 18px}
.board-shell{
  width:100%;height:100%;border-radius:30px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)
}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.side-tools{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:4
}
.tool-btn{
  width:62px;height:62px;border:0;border-radius:19px;background:linear-gradient(145deg,var(--orange),#ff7a18);
  color:#fff;box-shadow:0 10px 22px rgba(255,122,24,.25);cursor:pointer;display:grid;place-items:center;
}
.tool-btn:active{transform:translateY(2px)}
.tool-btn svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.toast{
  position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;
  background:rgba(48,56,69,.94);color:white;padding:13px 19px;border-radius:14px;font-weight:800;
  pointer-events:none;transition:.2s;z-index:8;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint-label{
  position:absolute;left:50%;top:22px;transform:translateX(-50%);background:#fff;border-radius:14px;
  padding:10px 16px;font-weight:850;box-shadow:0 8px 20px rgba(39,52,80,.11);opacity:0;transition:.2s;z-index:3
}
.hint-label.show{opacity:1}

/* 설정, 성공 */
.modal-layer{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(34,43,59,.32);backdrop-filter:blur(7px);z-index:20
}
.modal-layer.show{display:flex}
.modal{
  width:min(460px,92vw);border-radius:28px;background:#fff;padding:28px;box-shadow:0 24px 70px rgba(30,39,60,.28)
}
.modal h3{font-size:27px;margin:0 0 20px;letter-spacing:-.04em}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf0f4;font-weight:850}
.switch{
  width:58px;height:32px;border:0;border-radius:999px;background:#d9dee7;padding:4px;cursor:pointer;transition:.18s
}
.switch:after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.18s}
.switch.on{background:var(--mint)}
.switch.on:after{transform:translateX(26px)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;height:54px;border:0;border-radius:16px;font-weight:900;font-size:17px;cursor:pointer}
.success-card{text-align:center;padding:32px}
.success-ring{
  width:112px;height:112px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(145deg,#e9fbf6,#d5f4eb);display:grid;place-items:center;color:#15947a
}
.success-ring svg{width:58px;height:58px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.success-card h3{font-size:34px;margin:0 0 7px}
.success-card p{margin:0 0 23px;color:var(--muted);font-weight:750}
.confetti{position:absolute;width:10px;height:18px;border-radius:3px;pointer-events:none;animation:fall 1.4s ease-out forwards;z-index:30}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

@media (max-width:800px){
  .home-card{padding:32px 22px}
  .main-actions{grid-template-columns:1fr}
  .stage-grid{grid-template-columns:repeat(5,1fr)}
  .game-hud{height:76px;padding:10px 12px}
  .progress-box{min-width:112px;height:50px;font-size:19px}
  .stage-pill{display:none}
  .icon-btn{width:48px;height:48px;border-radius:15px}
  .board-wrap{padding:0 8px 8px}
  .board-shell{border-radius:22px}
  .side-tools{right:16px;top:auto;bottom:24px;transform:none;flex-direction:row}
  .tool-btn{width:54px;height:54px;border-radius:17px}
}
@media (max-height:620px){
  .game-hud{height:66px;padding:7px 14px}
  .progress-box{height:48px}
  .icon-btn{width:46px;height:46px}
  .side-tools{right:16px;bottom:16px;top:auto;transform:none;flex-direction:row}
}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="screen active">
    <div class="home-card glass">
      <div class="logo-mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>한 번에 쓱!</h1>
      <p class="subtitle">모든 선을 단 한 번씩 지나가 보세요.</p>
      <div class="main-actions">
        <button id="continueBtn" class="big-btn primary">이어하기</button>
        <button id="selectBtn" class="big-btn secondary">스테이지 선택</button>
      </div>
      <div class="home-bottom">
        <button id="homeBgm" class="mini-toggle">BGM 켜짐</button>
        <button id="homeSfx" class="mini-toggle">효과음 켜짐</button>
      </div>
    </div>
  </section>

  <section id="select" class="screen">
    <div class="topbar">
      <button id="selectBack" class="icon-btn" aria-label="뒤로">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>스테이지 선택</h2>
      <div style="width:54px"></div>
    </div>
    <div class="select-wrap glass">
      <div id="stageGrid" class="stage-grid"></div>
      <div class="select-info">완료한 스테이지는 초록색으로 표시됩니다.</div>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="game-hud">
      <div class="hud-group">
        <button id="gameBack" class="icon-btn" aria-label="스테이지 선택">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div id="stagePill" class="stage-pill">STAGE 1</div>
      </div>
      <div id="progressBox" class="progress-box">0 / 0</div>
      <button id="settingsBtn" class="icon-btn" aria-label="설정" style="color:var(--orange)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1-2.8 2.8-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.7V21H10v-.1A1.8 1.8 0 0 0 8.9 19a1.8 1.8 0 0 0-2 .4l-.1.1L4 16.7l.1-.1a1.8 1.8 0 0 0 .4-2A1.8 1.8 0 0 0 2.8 13H2V9h.8a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.4-2L4 5.8 6.8 3l.1.1a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 10 1.8V1h4v.8a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.4l.1-.1L20 5.8l-.1.1a1.8 1.8 0 0 0-.4 2A1.8 1.8 0 0 0 21.2 9h.8v4h-.8a1.8 1.8 0 0 0-1.8 2z"/>
        </svg>
      </button>
    </div>
    <div class="board-wrap">
      <div id="boardShell" class="board-shell">
        <canvas id="gameCanvas"></canvas>
        <div id="hintLabel" class="hint-label"></div>
        <div class="side-tools">
          <button id="undoBtn" class="tool-btn" aria-label="한 단계 되돌리기">
            <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
          </button>
          <button id="resetBtn" class="tool-btn" aria-label="다시 시작">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button id="hintBtn" class="tool-btn" aria-label="힌트">
            <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.6 14.8A7 7 0 1 1 15.4 14.8c-.9.7-1.4 1.4-1.4 2.2h-4c0-.8-.5-1.5-1.4-2.2z"/></svg>
          </button>
        </div>
        <div id="toast" class="toast"></div>
      </div>
    </div>
  </section>

  <div id="settingsModal" class="modal-layer">
    <div class="modal">
      <h3>설정</h3>
      <div class="setting-row"><span>배경 음악</span><button id="bgmSwitch" class="switch"></button></div>
      <div class="setting-row"><span>효과음</span><button id="sfxSwitch" class="switch"></button></div>
      <div class="setting-row"><span>선 따라가기 보조</span><button id="assistSwitch" class="switch"></button></div>
      <div class="modal-actions">
        <button id="settingsClose" class="primary">계속하기</button>
      </div>
    </div>
  </div>

  <div id="successModal" class="modal-layer">
    <div class="modal success-card">
      <div class="success-ring">
        <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h3>완성!</h3>
      <p id="successText">모든 선을 한 번씩 지났어요.</p>
      <div class="modal-actions">
        <button id="successSelect" class="secondary">목록으로</button>
        <button id="nextBtn" class="primary">다음 스테이지</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const screens = {home:$('#home'), select:$('#select'), game:$('#game')};
const canvas = $('#gameCanvas');
const ctx = canvas.getContext('2d');

const SAVE_KEY = 'oneStroke50_v1';
const defaultSave = {completed:[], lastStage:1, bgm:true, sfx:true, assist:true};
let save;
try { save = Object.assign({}, defaultSave, JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')); }
catch(e){ save = {...defaultSave}; }

const state = {
  stageIndex:0,
  stage:null,
  nodes:[],
  edges:[],
  path:[],
  used:new Set(),
  dragging:false,
  pointer:{x:0,y:0},
  hintNodes:new Set(),
  hintUntil:0,
  shakeUntil:0,
  blocked:false
};

function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  if(name==='select') renderStageGrid();
  if(name==='game') setTimeout(resizeCanvas,0);
}
function setToggle(el,on){ el.classList.toggle('on',!!on); }
function syncToggles(){
  setToggle($('#homeBgm'),save.bgm); $('#homeBgm').textContent='BGM '+(save.bgm?'켜짐':'꺼짐');
  setToggle($('#homeSfx'),save.sfx); $('#homeSfx').textContent='효과음 '+(save.sfx?'켜짐':'꺼짐');
  setToggle($('#bgmSwitch'),save.bgm); setToggle($('#sfxSwitch'),save.sfx); setToggle($('#assistSwitch'),save.assist);
}
syncToggles();

/* 오디오 */
let audioCtx=null, master=null, bgmTimer=null, bgmStep=0;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value=.75;
    master.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(save.bgm) startBgm();
}
function tone(freq,dur=.08,type='sine',gain=.07,when=0){
  if(!save.sfx || !audioCtx) return;
  const t=audioCtx.currentTime+when, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function playMove(){ tone(430+state.used.size*13,.07,'sine',.055); }
function playBad(){ tone(160,.13,'square',.035); setTimeout(()=>tone(125,.15,'square',.03),70); }
function playUndo(){ tone(310,.06,'triangle',.045); }
function playWin(){
  [523,659,784,1047].forEach((f,i)=>tone(f,.32,'sine',.07,i*.09));
}
function startBgm(){
  if(!audioCtx || !save.bgm || bgmTimer) return;
  const scale=[261.63,329.63,392,493.88,392,329.63,293.66,392];
  const tick=()=>{
    if(!save.bgm || !audioCtx) return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.value=scale[bgmStep%scale.length]/2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.028,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.42);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.45);
    if(bgmStep%2===0){
      const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
      o2.type='sine';o2.frequency.value=scale[(bgmStep+2)%scale.length];
      g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.012,t+.02);g2.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+.28);
    }
    bgmStep++;
  };
  tick();bgmTimer=setInterval(tick,460);
}
function stopBgm(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }

/* 스테이지 생성 */
function rngFactory(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffle(a,rng){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function edgeKey(a,b){return a<b?a+'-'+b:b+'-'+a}

function makeTrail(n,target,seed){
  for(let attempt=0;attempt<300;attempt++){
    const rng=rngFactory(seed+attempt*997);
    const order=shuffle([...Array(n).keys()],rng);
    let seq=[order[0]], used=new Set();
    let ok=true;
    for(let i=1;i<order.length;i++){
      const a=seq[seq.length-1], b=order[i], k=edgeKey(a,b);
      if(used.has(k)){ok=false;break}
      used.add(k);seq.push(b);
    }
    if(!ok) continue;
    while(used.size<target){
      const a=seq[seq.length-1];
      let cand=[...Array(n).keys()].filter(b=>b!==a&&!used.has(edgeKey(a,b)));
      if(!cand.length){ok=false;break}
      const degrees=Array(n).fill(0);
      used.forEach(k=>{const [u,v]=k.split('-').map(Number);degrees[u]++;degrees[v]++});
      cand.sort((x,y)=>(degrees[x]-degrees[y])+(rng()-.5)*1.8);
      const pool=cand.slice(0,Math.min(3,cand.length));
      const b=pool[Math.floor(rng()*pool.length)];
      used.add(edgeKey(a,b));seq.push(b);
    }
    if(ok && used.size===target) return seq;
  }
  throw new Error('스테이지 생성 실패');
}

function makeCoords(n,kind,seed){
  const rng=rngFactory(seed*13+7), pts=[];
  if(kind===0){
    const rot=-Math.PI/2+(rng()-.5)*.45;
    for(let i=0;i<n;i++){
      const a=rot+i*Math.PI*2/n, r=.34+(i%2?-.015:.018);
      pts.push({x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r});
    }
  }else if(kind===1){
    const outer=n-1,rot=-Math.PI/2;
    for(let i=0;i<outer;i++){const a=rot+i*Math.PI*2/outer;pts.push({x:.5+Math.cos(a)*.35,y:.5+Math.sin(a)*.35})}
    pts.push({x:.5,y:.5});
  }else if(kind===2){
    const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);
    for(let i=0;i<n;i++){
      const c=i%cols,r=Math.floor(i/cols);
      pts.push({x:.18+(cols===1?0:c/(cols-1))*.64,y:.2+(rows===1?0:r/(rows-1))*.6});
    }
  }else if(kind===3){
    const top=Math.ceil(n/2),bottom=n-top;
    for(let i=0;i<top;i++) pts.push({x:.17+(top===1?0:i/(top-1))*.66,y:.28});
    for(let i=0;i<bottom;i++) pts.push({x:.22+(bottom===1?.5:i/(bottom-1))*.56,y:.72});
  }else if(kind===4){
    const custom=[
      [.5,.13],[.18,.37],[.82,.37],[.30,.66],[.70,.66],[.5,.88],
      [.5,.5],[.12,.76],[.88,.76],[.12,.2],[.88,.2]
    ];
    for(let i=0;i<n;i++) pts.push({x:custom[i][0],y:custom[i][1]});
  }else{
    const rings=Math.ceil(n/4);
    for(let i=0;i<n;i++){
      const ring=Math.floor(i/4),pos=i%4,r=.18+ring*.13,a=-Math.PI/4+pos*Math.PI/2+(ring%2)*.32;
      pts.push({x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r});
    }
  }
  return pts.map((p,i)=>({
    x:Math.min(.88,Math.max(.12,p.x+(rng()-.5)*.025)),
    y:Math.min(.86,Math.max(.14,p.y+(rng()-.5)*.025))
  }));
}

const STAGES=[...Array(50)].map((_,idx)=>{
  const num=idx+1;
  const n=Math.min(11,5+Math.floor(idx/8));
  const max=n*(n-1)/2;
  const target=Math.min(max-1,Math.max(n, n+1+Math.floor(idx*.22)));
  const seed=1847+num*7919;
  const seq=makeTrail(n,target,seed);
  const edges=[];
  for(let i=1;i<seq.length;i++) edges.push([seq[i-1],seq[i]]);
  return {num,n,target,seed,coords:makeCoords(n,idx%6,seed),edges};
});

function renderStageGrid(){
  const grid=$('#stageGrid');grid.innerHTML='';
  const done=new Set(save.completed);
  STAGES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='stage-card'+(done.has(s.num)?' done':'')+(save.lastStage===s.num?' current':'');
    b.textContent=s.num;
    b.onclick=()=>loadStage(i);
    grid.appendChild(b);
  });
}

function loadStage(index){
  ensureAudio();
  state.stageIndex=Math.max(0,Math.min(49,index));
  state.stage=STAGES[state.stageIndex];
  save.lastStage=state.stage.num;persist();
  state.path=[];state.used.clear();state.dragging=false;state.hintNodes.clear();state.blocked=false;
  $('#stagePill').textContent='STAGE '+state.stage.num;
  $('#successModal').classList.remove('show');
  showScreen('game');
  resizeCanvas();
  updateProgress();
  draw();
}
function updateProgress(){$('#progressBox').textContent=state.used.size+' / '+state.edges.length}

/* 캔버스 */
function resizeCanvas(){
  const rect=canvas.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.max(1,Math.round(rect.width*dpr));
  canvas.height=Math.max(1,Math.round(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(state.stage) rebuildGeometry(rect.width,rect.height);
  draw();
}
function rebuildGeometry(w,h){
  const pad=Math.min(w,h)*.12;
  const usableW=w-pad*2-(w<760?0:70), usableH=h-pad*2;
  state.nodes=state.stage.coords.map((p,i)=>({id:i,x:pad+p.x*usableW,y:pad+p.y*usableH}));
  state.edges=state.stage.edges.map((e,i)=>({id:i,a:e[0],b:e[1],key:edgeKey(e[0],e[1])}));
}
function nodeById(id){return state.nodes[id]}
function currentNode(){return state.path.length?state.path[state.path.length-1]:null}
function findNode(x,y){
  const rect=canvas.getBoundingClientRect();
  const radius=Math.max(28,Math.min(46,Math.min(rect.width,rect.height)*.055));
  let best=null,bd=Infinity;
  for(const n of state.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<radius&&d<bd){best=n;bd=d}}
  return best;
}
function getEdge(a,b){return state.edges.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a))}
function availableFrom(id){return state.edges.filter(e=>!state.used.has(e.id)&&(e.a===id||e.b===id))}
function canTraverse(a,b){
  const e=getEdge(a,b);
  return e&&!state.used.has(e.id);
}
function traverse(to){
  if(state.blocked) return;
  const from=currentNode();
  if(from===null){state.path=[to];playMove();draw();return}
  if(from===to) return;
  const e=getEdge(from,to);
  if(!e || state.used.has(e.id)){badMove();return}
  state.used.add(e.id);state.path.push(to);playMove();updateProgress();draw();
  if(state.used.size===state.edges.length){
    state.blocked=true;
    setTimeout(completeStage,330);
  }else if(availableFrom(to).length===0){
    toast('막다른 길이에요. 되돌리거나 다시 시작해 보세요.');
    badMove();
  }
}
function badMove(){
  playBad();state.shakeUntil=performance.now()+260;draw();
}
function undo(){
  if(state.blocked)return;
  if(state.path.length>1){
    const b=state.path.pop(),a=state.path[state.path.length-1],e=getEdge(a,b);
    if(e)state.used.delete(e.id);
    playUndo();updateProgress();draw();
  }else if(state.path.length===1){state.path=[];playUndo();draw()}
}
function resetStage(){
  if(state.blocked)return;
  state.path=[];state.used.clear();state.hintNodes.clear();updateProgress();playUndo();draw();
}
function showHint(){
  if(!state.stage||state.blocked)return;
  const deg=Array(state.nodes.length).fill(0);
  state.edges.forEach(e=>{deg[e.a]++;deg[e.b]++});
  const odd=deg.map((d,i)=>d%2?i:-1).filter(i=>i>=0);
  state.hintNodes=new Set(odd.length===2?odd:state.nodes.map(n=>n.id));
  state.hintUntil=performance.now()+2600;
  const label=$('#hintLabel');
  label.textContent=odd.length===2?'빛나는 두 점 중 하나에서 시작해 보세요.':'어느 점에서 시작해도 좋아요.';
  label.classList.add('show');
  setTimeout(()=>label.classList.remove('show'),2300);
  tone(740,.12,'sine',.05);draw();
}

function draw(){
  if(!state.stage)return;
  const rect=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  const now=performance.now();
  let sx=0;
  if(now<state.shakeUntil){sx=Math.sin(now*.16)*5;requestAnimationFrame(draw)}
  if(now<state.hintUntil) requestAnimationFrame(draw);
  ctx.save();ctx.translate(sx,0);

  // 은은한 점무늬
  ctx.fillStyle='rgba(112,128,150,.08)';
  for(let y=28;y<rect.height;y+=34)for(let x=28;x<rect.width;x+=34){ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill()}

  const lineW=Math.max(8,Math.min(15,Math.min(rect.width,rect.height)*.016));
  ctx.lineCap='round';ctx.lineJoin='round';

  // 미사용 선
  state.edges.forEach(e=>{
    if(state.used.has(e.id))return;
    const a=nodeById(e.a),b=nodeById(e.b);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='#d7dce3';ctx.lineWidth=lineW;ctx.stroke();
  });

  // 사용 선
  state.edges.forEach(e=>{
    if(!state.used.has(e.id))return;
    const a=nodeById(e.a),b=nodeById(e.b);
    const grad=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0,'#ff8a1f');grad.addColorStop(1,'#ffbd42');
    ctx.shadowColor='rgba(255,138,31,.28)';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=grad;ctx.lineWidth=lineW+2;ctx.stroke();
    ctx.shadowBlur=0;
  });

  // 현재 손가락까지의 보조선
  if(state.dragging&&currentNode()!==null){
    const a=nodeById(currentNode());
    ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(state.pointer.x,state.pointer.y);
    ctx.strokeStyle='rgba(255,138,31,.35)';ctx.lineWidth=Math.max(4,lineW*.45);ctx.stroke();ctx.setLineDash([]);
  }

  // 점
  const baseR=Math.max(13,Math.min(23,Math.min(rect.width,rect.height)*.027));
  const visited=new Set(state.path);
  state.nodes.forEach(n=>{
    const hinted=state.hintNodes.has(n.id)&&now<state.hintUntil;
    const pulse=hinted?1+Math.sin(now*.009)*.16:1;
    ctx.shadowColor=hinted?'rgba(79,124,255,.45)':'rgba(34,44,62,.18)';
    ctx.shadowBlur=hinted?24:9;
    ctx.beginPath();ctx.arc(n.x,n.y,baseR*pulse+5,0,Math.PI*2);
    ctx.fillStyle=hinted?'rgba(79,124,255,.18)':'rgba(255,255,255,.96)';ctx.fill();
    ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(n.x,n.y,baseR*pulse,0,Math.PI*2);
    ctx.fillStyle=visited.has(n.id)?'#ff8a1f':'#3b4452';ctx.fill();
    if(currentNode()===n.id){
      ctx.beginPath();ctx.arc(n.x,n.y,baseR*.43,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    }
  });
  ctx.restore();
}

/* 입력 */
function canvasPoint(ev){
  const r=canvas.getBoundingClientRect();
  return {x:ev.clientX-r.left,y:ev.clientY-r.top};
}
canvas.addEventListener('pointerdown',ev=>{
  if(state.blocked)return;
  ensureAudio();canvas.setPointerCapture?.(ev.pointerId);
  const p=canvasPoint(ev);state.pointer=p;state.dragging=true;
  const n=findNode(p.x,p.y);
  if(n){
    if(currentNode()===null) traverse(n.id);
    else if(n.id===currentNode()) draw();
    else traverse(n.id);
  }
});
canvas.addEventListener('pointermove',ev=>{
  if(!state.dragging||state.blocked)return;
  const p=canvasPoint(ev);state.pointer=p;
  const n=findNode(p.x,p.y);
  if(n&&currentNode()!==null&&n.id!==currentNode()){
    if(canTraverse(currentNode(),n.id)) traverse(n.id);
    else if(save.assist){
      const opts=availableFrom(currentNode());
      if(opts.length===1){
        const only=opts[0],to=only.a===currentNode()?only.b:only.a,tn=nodeById(to);
        if(Math.hypot(tn.x-p.x,tn.y-p.y)<70) traverse(to);
      }
    }
  }
  draw();
});
function endPointer(){state.dragging=false;draw()}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')endPointer()});

/* 완료 */
function completeStage(){
  const num=state.stage.num;
  if(!save.completed.includes(num))save.completed.push(num);
  save.completed.sort((a,b)=>a-b);
  save.lastStage=Math.min(50,num+1);persist();
  playWin();burstConfetti();
  $('#successText').textContent='스테이지 '+num+'의 모든 선을 완성했어요.';
  $('#nextBtn').textContent=num===50?'처음부터':'다음 스테이지';
  $('#successModal').classList.add('show');
}
function burstConfetti(){
  const colors=['#ff8a1f','#ffbd42','#4f7cff','#39c8a8','#ff5c70'];
  for(let i=0;i<42;i++){
    const p=document.createElement('i');p.className='confetti';
    p.style.left=(50+(Math.random()-.5)*12)+'%';p.style.top='42%';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',((Math.random()-.5)*520)+'px');
    p.style.setProperty('--dy',(170+Math.random()*330)+'px');
    p.style.animationDelay=(Math.random()*.18)+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),1800);
  }
}
let toastTimer;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* 버튼 */
$('#continueBtn').onclick=()=>loadStage(Math.max(0,(save.lastStage||1)-1));
$('#selectBtn').onclick=()=>{ensureAudio();showScreen('select')};
$('#selectBack').onclick=()=>showScreen('home');
$('#gameBack').onclick=()=>{state.blocked=false;showScreen('select')};
$('#undoBtn').onclick=undo;$('#resetBtn').onclick=resetStage;$('#hintBtn').onclick=showHint;
$('#settingsBtn').onclick=()=>{$('#settingsModal').classList.add('show');syncToggles()};
$('#settingsClose').onclick=()=>$('#settingsModal').classList.remove('show');
$('#successSelect').onclick=()=>{state.blocked=false;$('#successModal').classList.remove('show');showScreen('select')};
$('#nextBtn').onclick=()=>{const next=state.stage.num===50?0:state.stageIndex+1;loadStage(next)};

function toggleBgm(){
  ensureAudio();save.bgm=!save.bgm;save.bgm?startBgm():stopBgm();persist();syncToggles();
}
function toggleSfx(){ensureAudio();save.sfx=!save.sfx;persist();syncToggles();if(save.sfx)tone(660,.1)}
function toggleAssist(){save.assist=!save.assist;persist();syncToggles()}
$('#homeBgm').onclick=toggleBgm;$('#bgmSwitch').onclick=toggleBgm;
$('#homeSfx').onclick=toggleSfx;$('#sfxSwitch').onclick=toggleSfx;
$('#assistSwitch').onclick=toggleAssist;

window.addEventListener('resize',resizeCanvas);
window.addEventListener('keydown',e=>{
  if(!screens.game.classList.contains('active'))return;
  if(e.key==='z'||e.key==='Z'||(e.ctrlKey&&e.key==='z'))undo();
  if(e.key==='r'||e.key==='R')resetStage();
  if(e.key==='h'||e.key==='H')showHint();
  if(e.key==='Escape')showScreen('select');
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBgm();else if(save.bgm&&audioCtx)startBgm()});

// 생성된 50개 스테이지 유효성 점검
(function validate(){
  STAGES.forEach(s=>{
    const deg=Array(s.n).fill(0), seen=new Set();
    s.edges.forEach(([a,b])=>{deg[a]++;deg[b]++;seen.add(edgeKey(a,b))});
    const odd=deg.filter(d=>d%2).length;
    if(seen.size!==s.edges.length || !(odd===0||odd===2)) throw new Error('Invalid stage '+s.num);
  });
})();

})();
</script>
