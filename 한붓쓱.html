<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>한붓쓱 · 골목 배달</title>
<style>
:root{
  --ink:#303845;
  --muted:#758090;
  --paper:#f7f9fc;
  --panel:rgba(255,255,255,.9);
  --line:#d8dde5;
  --orange:#ff8a1f;
  --orange2:#ffb33c;
  --blue:#4f7cff;
  --mint:#39c8a8;
  --danger:#ff5c70;
  --shadow:0 18px 50px rgba(36,48,72,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edf2f8;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid rgba(79,124,255,.28);outline-offset:3px}
.app{
  width:100%;height:100%;position:relative;overflow:hidden;
  background:
    linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.25)),
    repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 2px,transparent 2px 38px),
    #edf2f8;
}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
.glass{
  background:var(--panel);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}
.icon-btn{
  width:54px;height:54px;border:0;border-radius:18px;background:white;
  box-shadow:0 9px 24px rgba(39,52,80,.14);cursor:pointer;
  display:grid;place-items:center;transition:.16s transform,.16s box-shadow;
}
.icon-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 5px 15px rgba(39,52,80,.14)}
.icon-btn svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}

/* 홈 */
#home{align-items:center;justify-content:center;padding:24px}
.home-card{
  width:min(720px,94vw);padding:42px;border-radius:34px;text-align:center;position:relative;overflow:hidden;
}
.home-card:before,.home-card:after{
  content:"";position:absolute;border-radius:999px;filter:blur(2px);opacity:.16
}
.home-card:before{width:240px;height:240px;background:var(--orange);left:-100px;top:-110px}
.home-card:after{width:280px;height:280px;background:var(--blue);right:-140px;bottom:-150px}
.logo-mark{width:110px;height:110px;margin:0 auto 18px;position:relative}
.logo-mark i{position:absolute;width:20px;height:20px;background:var(--ink);border-radius:50%;box-shadow:0 4px 0 rgba(48,56,69,.12)}
.logo-mark i:nth-child(1){left:10px;top:58px}
.logo-mark i:nth-child(2){left:45px;top:14px}
.logo-mark i:nth-child(3){right:10px;top:58px}
.logo-mark i:nth-child(4){left:45px;bottom:2px}
.logo-mark span{position:absolute;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--orange2));transform-origin:left center}
.logo-mark span:nth-of-type(1){width:56px;left:23px;top:61px;transform:rotate(-51deg)}
.logo-mark span:nth-of-type(2){width:56px;left:56px;top:27px;transform:rotate(51deg)}
.logo-mark span:nth-of-type(3){width:56px;left:24px;top:63px;transform:rotate(51deg)}
.logo-mark span:nth-of-type(4){width:56px;left:57px;top:98px;transform:rotate(-51deg)}
h1{font-size:clamp(36px,6vw,64px);line-height:1;margin:0 0 12px;letter-spacing:-.05em}
.subtitle{margin:0 auto 30px;color:var(--muted);font-size:clamp(16px,2.2vw,20px)}
.main-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.big-btn{
  min-height:68px;border:0;border-radius:20px;padding:0 24px;font-size:20px;font-weight:900;cursor:pointer;
  transition:.16s transform,.16s filter;box-shadow:0 10px 24px rgba(39,52,80,.13)
}
.big-btn:active{transform:translateY(2px) scale(.985)}
.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:white}
.secondary{background:#fff}
.home-progress{margin:15px auto 0;width:max-content;max-width:100%;padding:9px 14px;border-radius:13px;background:#f0f3f8;color:#657184;font-weight:850}
.home-bottom{display:flex;justify-content:center;gap:10px;margin-top:12px}
.mini-toggle{
  border:0;border-radius:14px;background:#eef2f7;padding:10px 14px;font-weight:800;cursor:pointer;color:#596476
}
.mini-toggle.on{background:#e6f8f3;color:#16866f}

/* 스테이지 선택 */
#select{flex-direction:column;padding:20px}
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;width:100%;margin:0 auto}
.topbar h2{margin:0;font-size:28px;letter-spacing:-.04em}
.select-wrap{
  width:min(1080px,100%);margin:8px auto 0;padding:24px;border-radius:28px;overflow:auto;min-height:0;flex:1;
  overscroll-behavior:contain
}
.stage-chapters{display:grid;gap:20px}
.chapter-section{padding:18px;border-radius:22px;background:rgba(244,247,251,.78);box-shadow:inset 0 0 0 1px rgba(217,224,234,.86)}
.chapter-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.chapter-title{display:flex;align-items:center;gap:10px;margin:0;font-size:19px;letter-spacing:-.03em}
.chapter-number{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--orange);font-size:14px;box-shadow:0 5px 12px rgba(39,52,80,.09)}
.chapter-progress{color:var(--muted);font-weight:850;font-size:14px;white-space:nowrap}
.stage-grid{display:grid;grid-template-columns:repeat(10,minmax(58px,1fr));gap:10px}
.stage-card{
  aspect-ratio:1;border:0;border-radius:17px;background:#fff;cursor:pointer;font-weight:950;font-size:19px;position:relative;
  box-shadow:inset 0 0 0 1px #e1e6ed,0 5px 12px rgba(39,52,80,.05);transition:.15s transform,.15s background,.15s opacity
}
.stage-card:hover{transform:translateY(-2px)}
.stage-card.done{background:linear-gradient(145deg,#e6fbf5,#d9f5ee);color:#137a67;box-shadow:inset 0 0 0 1px #bcebdd}
.stage-card.done:after{content:"✓";position:absolute;right:7px;top:5px;font-size:13px}
.stage-card.current{background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;box-shadow:0 8px 18px rgba(255,138,31,.26)}
.stage-card.locked{background:#e9edf3;color:#9ba4b2;box-shadow:inset 0 0 0 1px #dde3eb;cursor:not-allowed;opacity:.78}
.stage-card.locked:hover{transform:none}
.stage-card.locked:after{content:"🔒";position:absolute;right:6px;top:5px;font-size:11px;filter:grayscale(1)}
.select-info{margin-top:18px;color:var(--muted);text-align:center;font-weight:750;min-height:24px}
.select-info.alert{color:var(--danger);animation:noticePulse .38s ease}
@keyframes noticePulse{50%{transform:scale(1.025)}}

/* 게임 */
#game{flex-direction:column}
.game-hud{
  height:88px;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;z-index:5
}
.hud-group{display:flex;align-items:center;gap:12px}
.progress-box{
  min-width:150px;height:56px;border-radius:18px;background:rgba(48,56,69,.94);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:950;letter-spacing:.02em;
  box-shadow:0 10px 25px rgba(48,56,69,.18)
}
.stage-pill{height:46px;padding:0 18px;border-radius:15px;background:#fff;display:flex;align-items:center;font-weight:900;box-shadow:0 8px 20px rgba(39,52,80,.1)}
.board-wrap{flex:1;min-height:0;position:relative;padding:0 18px 18px}
.board-shell{
  width:100%;height:100%;border-radius:30px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)
}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.side-tools{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:4
}
.tool-btn{
  width:62px;height:62px;border:0;border-radius:19px;background:linear-gradient(145deg,var(--orange),#ff7a18);
  color:#fff;box-shadow:0 10px 22px rgba(255,122,24,.25);cursor:pointer;display:grid;place-items:center;
}
.tool-btn:active{transform:translateY(2px)}
.tool-btn.attention{animation:toolAttention .72s ease-in-out infinite}
@keyframes toolAttention{50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(79,124,255,.16),0 10px 22px rgba(255,122,24,.25)}}
.tool-btn svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.toast{
  position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;
  background:rgba(48,56,69,.94);color:white;padding:13px 19px;border-radius:14px;font-weight:800;
  pointer-events:none;transition:.2s;z-index:8;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint-label{
  position:absolute;left:50%;top:22px;transform:translateX(-50%);background:#fff;border-radius:14px;
  padding:10px 16px;font-weight:850;box-shadow:0 8px 20px rgba(39,52,80,.11);opacity:0;transition:.2s;z-index:3
}
.hint-label.show{opacity:1}

/* 설정, 성공 */
.modal-layer{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(34,43,59,.32);backdrop-filter:blur(7px);z-index:20
}
.modal-layer.show{display:flex}
.modal{
  width:min(460px,92vw);border-radius:28px;background:#fff;padding:28px;box-shadow:0 24px 70px rgba(30,39,60,.28)
}
.modal h3{font-size:27px;margin:0 0 20px;letter-spacing:-.04em}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf0f4;font-weight:850}
.switch{
  width:58px;height:32px;border:0;border-radius:999px;background:#d9dee7;padding:4px;cursor:pointer;transition:.18s
}
.switch:after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.18s}
.switch.on{background:var(--mint)}
.switch.on:after{transform:translateX(26px)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;height:54px;border:0;border-radius:16px;font-weight:900;font-size:17px;cursor:pointer}
.success-card{text-align:center;padding:32px}
.success-ring{
  width:112px;height:112px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(145deg,#e9fbf6,#d5f4eb);display:grid;place-items:center;color:#15947a
}
.success-ring svg{width:58px;height:58px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.success-card h3{font-size:34px;margin:0 0 7px}
.success-card p{margin:0 0 23px;color:var(--muted);font-weight:750}
.confetti{position:absolute;width:10px;height:18px;border-radius:3px;pointer-events:none;animation:fall 1.4s ease-out forwards;z-index:30}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

@media (max-width:800px){
  #home{padding:14px}
  .home-card{padding:28px 20px}
  .logo-mark{transform:scale(.88);margin-bottom:8px}
  .main-actions{grid-template-columns:1fr}
  #select{padding:10px}
  .topbar{height:58px}
  .topbar h2{font-size:23px}
  .select-wrap{padding:14px;border-radius:22px;margin-top:4px}
  .chapter-section{padding:13px;border-radius:18px}
  .chapter-head{margin-bottom:10px}
  .chapter-title{font-size:17px}
  .stage-grid{grid-template-columns:repeat(5,1fr);gap:9px}
  .game-hud{height:72px;padding:8px 9px;gap:7px}
  .hud-group{gap:6px}
  .progress-box{min-width:92px;height:46px;font-size:17px;border-radius:15px}
  .stage-pill{height:42px;padding:0 10px;font-size:13px;border-radius:13px}
  .icon-btn{width:46px;height:46px;border-radius:15px}
  .board-wrap{padding:0 7px 7px}
  .board-shell{border-radius:21px}
  .side-tools{right:50%;top:auto;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(50%);flex-direction:row}
  .tool-btn{width:52px;height:52px;border-radius:16px}
  .toast{bottom:88px;max-width:calc(100% - 24px);white-space:normal;text-align:center}
  .hint-label{top:14px;max-width:calc(100% - 28px);text-align:center}
}
@media (max-height:620px){
  .game-hud{height:66px;padding:7px 14px}
  .progress-box{height:48px}
  .icon-btn{width:46px;height:46px}
  .side-tools{right:50%;bottom:max(12px,env(safe-area-inset-bottom));top:auto;transform:translateX(50%);flex-direction:row}
}
.route-rule{position:absolute;left:12px;right:12px;top:10px;text-align:center;font-size:12px;line-height:1.5;color:#657b7d;pointer-events:none}.hint-label{top:50px;pointer-events:none}#skipDelivery{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:9;background:#214a53;color:white;cursor:pointer}.board-shell{background:#dfe9e1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 -24px 60px rgba(54,76,66,.08),var(--shadow)}.home-card h1{font-size:clamp(30px,5vw,56px)}.tool-btn:disabled{opacity:.45;cursor:default}.toast{max-width:90%;white-space:normal;text-align:center}.stage-pill{max-width:50vw;overflow:hidden;white-space:nowrap}@media(max-width:800px){.hint-label{top:50px}.route-rule{font-size:11px}}@media(max-height:480px){.route-rule{font-size:10px;top:4px}.hint-label{top:33px;padding:5px 9px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="screen active">
    <div class="home-card glass">
      <div class="logo-mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>한붓쓱! 골목 배달</h1>
      <p class="subtitle">모든 골목을 한 번씩 잇고, 라이더에게 길을 알려 주세요.</p>
      <div class="main-actions">
        <button id="continueBtn" class="big-btn primary">이어하기</button>
        <button id="selectBtn" class="big-btn secondary">스테이지 선택</button>
      </div>
      <div id="homeProgress" class="home-progress">진행도 0 / 50</div>
      <div class="home-bottom">
        <button id="homeBgm" class="mini-toggle">BGM 켜짐</button>
        <button id="homeSfx" class="mini-toggle">효과음 켜짐</button>
      </div>
    </div>
  </section>

  <section id="select" class="screen">
    <div class="topbar">
      <button id="selectBack" class="icon-btn" aria-label="뒤로">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>스테이지 선택</h2>
      <div style="width:54px"></div>
    </div>
    <div class="select-wrap glass">
      <div id="stageChapters" class="stage-chapters"></div>
      <div id="selectInfo" class="select-info">완료한 스테이지와 다음 스테이지만 선택할 수 있습니다.</div>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="game-hud">
      <div class="hud-group">
        <button id="gameBack" class="icon-btn" aria-label="스테이지 선택">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div id="stagePill" class="stage-pill">STAGE 1</div>
      </div>
      <div id="progressBox" class="progress-box">0 / 0</div>
      <button id="settingsBtn" class="icon-btn" aria-label="설정" style="color:var(--orange)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1-2.8 2.8-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.7V21H10v-.1A1.8 1.8 0 0 0 8.9 19a1.8 1.8 0 0 0-2 .4l-.1.1L4 16.7l.1-.1a1.8 1.8 0 0 0 .4-2A1.8 1.8 0 0 0 2.8 13H2V9h.8a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.4-2L4 5.8 6.8 3l.1.1a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 10 1.8V1h4v.8a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.4l.1-.1L20 5.8l-.1.1a1.8 1.8 0 0 0-.4 2A1.8 1.8 0 0 0 21.2 9h.8v4h-.8a1.8 1.8 0 0 0-1.8 2z"/>
        </svg>
      </button>
    </div>
    <div class="board-wrap">
      <div id="boardShell" class="board-shell">
        <canvas id="gameCanvas" aria-label="모든 골목을 한 번씩 잇는 배달 지도"></canvas><div class="route-rule">미니어처 탑다운 도시에서 모든 배달 도로를 한 번씩 지나 보세요 · 같은 교차로는 다시 지나도 돼요!<br>주황색은 완료한 도로, 📦 목적지는 방문하면 ✓로 바뀌어요.</div><button id="skipDelivery" class="mini-toggle" hidden>배달 도착 보기</button>
        <div id="hintLabel" class="hint-label"></div>
        <div class="side-tools">
          <button id="undoBtn" class="tool-btn" aria-label="한 단계 되돌리기">
            <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
          </button>
          <button id="resetBtn" class="tool-btn" aria-label="다시 시작">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button id="hintBtn" class="tool-btn" aria-label="힌트">
            <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.6 14.8A7 7 0 1 1 15.4 14.8c-.9.7-1.4 1.4-1.4 2.2h-4c0-.8-.5-1.5-1.4-2.2z"/></svg>
          </button>
        </div>
        <div id="toast" class="toast"></div>
      </div>
    </div>
  </section>

  <div id="settingsModal" class="modal-layer">
    <div class="modal">
      <h3>설정</h3>
      <div class="setting-row"><span>배경 음악</span><button id="bgmSwitch" class="switch"></button></div>
      <div class="setting-row"><span>효과음</span><button id="sfxSwitch" class="switch"></button></div>
      <div class="setting-row"><span>터치 보정·막힘 알림</span><button id="assistSwitch" class="switch"></button></div>
      <div class="modal-actions">
        <button id="settingsClose" class="primary">계속하기</button>
      </div>
    </div>
  </div>

  <div id="successModal" class="modal-layer">
    <div class="modal success-card">
      <div class="success-ring">
        <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h3>배달 완료!</h3>
      <p id="successText">모든 선을 한 번씩 지났어요.</p>
      <div class="modal-actions">
        <button id="successSelect" class="secondary">목록으로</button>
        <button id="nextBtn" class="primary">다음 스테이지</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const screens = {home:$('#home'), select:$('#select'), game:$('#game')};
const canvas = $('#gameCanvas');
const ctx = canvas.getContext('2d');
const TOTAL_STAGES = 50;

const CITY_THEME = {
  1:{name:'주택가',ground:'#eaf2e6',block:'#dfe8dc',building:['#e7c49c','#d6a87b','#bfcbd8'],roof:['#b86654','#8c6b62','#657a86']},
  2:{name:'상점가',ground:'#edf0e6',block:'#e5e1d4',building:['#efc181','#d5a1a8','#9cc8c8'],roof:['#c85f4a','#547d89','#9e754d']},
  3:{name:'공원길',ground:'#e5f1df',block:'#d8e8d1',building:['#d8c6a9','#adc8b6','#d6b4a4'],roof:['#8b6f5d','#62806e','#9b6656']},
  4:{name:'도심',ground:'#e7ebef',block:'#d9dfe5',building:['#aab8c5','#c9b09c','#9fb7ba'],roof:['#596d7b','#7c635c','#4f6b72']},
  5:{name:'야간 중심가',ground:'#172932',block:'#203741',building:['#324b58','#3d465c','#514554'],roof:['#182d38','#25323d','#332e3d']}
};

const LEGACY_KEY = 'oneStroke50_v1';
const defaultSave = {completed:[],lastStage:1,bgm:true,sfx:true,assist:true};
let save;
try{
  const current=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');
  save=Object.assign({},defaultSave,current||legacy||{});
}catch(e){save={...defaultSave}}
save.completed=[...new Set((Array.isArray(save.completed)?save.completed:[]).map(Number).filter(n=>n>=1&&n<=TOTAL_STAGES))].sort((a,b)=>a-b);

function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
function completedSet(){return new Set(save.completed)}
function firstIncomplete(){const done=completedSet();for(let n=1;n<=TOTAL_STAGES;n++)if(!done.has(n))return n;return null}
function isUnlocked(num){const next=firstIncomplete();return save.completed.includes(num)||next===null||num===next}

let audioCtx=null,master=null,bgmTimer=null,bgmStep=0;
function ensureAudio(){
  if(!audioCtx){
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor)return;
    audioCtx=new AudioCtor();master=audioCtx.createGain();master.gain.value=.75;master.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(save.bgm)startBgm();
}
function tone(freq,dur=.08,type='sine',gain=.07,when=0){
  if(!save.sfx||!audioCtx)return;
  const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function playMove(){tone(430+Math.min(360,state.used.size*13),.07,'sine',.055)}
function playBad(){tone(160,.13,'square',.035);setTimeout(()=>tone(125,.15,'square',.03),70)}
function playUndo(){tone(310,.06,'triangle',.045)}
function playWin(){[523,659,784,1047].forEach((f,i)=>tone(f,.32,'sine',.07,i*.09))}
function startBgm(){
  if(!audioCtx||!save.bgm||bgmTimer)return;
  const scale=[261.63,329.63,392,493.88,392,329.63,293.66,392];
  const tick=()=>{
    if(!save.bgm||!audioCtx)return;
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.value=scale[bgmStep%scale.length]/2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.028,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.42);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.45);
    if(bgmStep%2===0){
      const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.type='sine';o2.frequency.value=scale[(bgmStep+2)%scale.length];
      g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.012,t+.02);g2.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+.28);
    }
    bgmStep++;
  };
  tick();bgmTimer=setInterval(tick,460);
}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}

function rebuildGeometry(w,h){
 const bottomTools=window.innerWidth<=800||window.innerHeight<=620;
 const left=30,top=h<360?58:87,right=bottomTools?30:100,bottom=bottomTools?91:28;
 const areaW=Math.max(1,w-left-right),areaH=Math.max(1,h-top-bottom),ps=state.stage.coords;
 const minX=Math.min(...ps.map(p=>p.x)),maxX=Math.max(...ps.map(p=>p.x)),minY=Math.min(...ps.map(p=>p.y)),maxY=Math.max(...ps.map(p=>p.y));
 const size=Math.min(areaW/Math.max(.01,maxX-minX),areaH/Math.max(.01,maxY-minY));
 const ox=left+(areaW-(maxX-minX)*size)/2,oy=top+(areaH-(maxY-minY)*size)/2;
 state.nodes=ps.map((p,i)=>({id:i,x:ox+(p.x-minX)*size,y:oy+(p.y-minY)*size}));
 let closest=Infinity;state.nodes.forEach(n=>{n.spacing=Math.min(...state.nodes.filter(m=>m.id!==n.id).map(m=>Math.hypot(m.x-n.x,m.y-n.y)));closest=Math.min(closest,n.spacing)});
 state.visualRadius=Math.min(18,Math.max(4,closest*.24));
 state.edges=state.stage.edges.map((e,i)=>({id:i,a:e[0],b:e[1],key:edgeKey(e[0],e[1])}));
 buildCityLandmarks(w,h);

}
function nodeById(id){return state.nodes[id]}
function currentNode(){return state.path.length?state.path[state.path.length-1]:null}
function hitRadius(n,boost=1){return Math.min(n.spacing*.43,Math.max(16,state.visualRadius*1.5)*boost)}
function findNode(x,y,ids=null,radiusBoost=1){
 let best=null,bd=Infinity;for(const n of state.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<=hitRadius(n,radiusBoost)&&d<bd){best=n;bd=d}}
 // Never ignore a closer, but unavailable, point in favor of a farther one.
 return best&&(!ids||ids.includes(best.id))?best:null;
}
function getEdge(a,b){return state.edges.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a))}
function availableFrom(id){return state.edges.filter(e=>!state.used.has(e.id)&&(e.a===id||e.b===id))}

}
function traverse(to){

/* 남은 선을 모두 이을 수 있는지 검사하고 실제 힌트 경로를 계산 */
function completionTrail(start){
  const remaining=state.edges.filter(e=>!state.used.has(e.id));if(!remaining.length)return [start];
  if(start===null||start===undefined)return null;
  const adj=Array.from({length:state.nodes.length},()=>[]),deg=Array(state.nodes.length).fill(0);
  remaining.forEach(e=>{adj[e.a].push(e);adj[e.b].push(e);deg[e.a]++;deg[e.b]++});
  if(deg[start]===0)return null;
  const odd=deg.map((d,i)=>d%2?i:-1).filter(i=>i>=0);if(odd.length!==0&&odd.length!==2)return null;if(odd.length===2&&!odd.includes(start))return null;
  const seenNodes=new Set([start]),queue=[start];
  while(queue.length){const v=queue.shift();for(const e of adj[v]){const n=e.a===v?e.b:e.a;if(!seenNodes.has(n)){seenNodes.add(n);queue.push(n)}}}
  if(deg.some((d,i)=>d>0&&!seenNodes.has(i)))return null;
  const localUsed=new Set(),stack=[start],path=[];
  while(stack.length){
    const v=stack[stack.length-1],e=adj[v].find(x=>!localUsed.has(x.id));
    if(e){localUsed.add(e.id);stack.push(e.a===v?e.b:e.a)}else path.push(stack.pop());
  }
  path.reverse();return localUsed.size===remaining.length?path:null;
}
function showHint(){
  if(!state.stage||state.blocked)return;clearHint(false);const cur=currentNode(),label=$('#hintLabel');
  if(cur===null){

    const odd=deg.map((d,i)=>d%2?i:-1).filter(i=>i>=0),recommended=odd.length===2?odd:[state.stage.solution[0]];
    state.hintNodes=new Set(recommended);label.textContent=odd.length===2?'빛나는 두 점 중 하나에서 시작하세요.':'빛나는 점에서 시작하면 경로를 찾기 쉬워요.';
  }else{
    const trail=completionTrail(cur);
    if(!trail||trail.length<2){state.hintNodes=new Set([cur]);label.textContent='현재 경로는 완성할 수 없어요. 한 번 되돌려 보세요.';$('#undoBtn').classList.add('attention')}

  }

}


function seededRandom(seed){
  let x=(seed|0)||123456789;
  return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000000)/1000000};
}
function distanceToRoad(p){
  let best=Infinity;
  for(const e of state.edges){
    const a=nodeById(e.a),b=nodeById(e.b),hit=pointSegmentDistance(p,a,b);
    best=Math.min(best,hit.distance);
  }
  return best;
}
function decorSafe(x,y,r,w,h,roadPad=1.2){
  const bottomTools=window.innerWidth<=800||window.innerHeight<=620;
  const rightLimit=w-(bottomTools?16:104),bottomLimit=h-(bottomTools?88:18);
  if(x-r<10||x+r>rightLimit||y-r<70||y+r>bottomLimit)return false;
  if(state.nodes.some(n=>Math.hypot(n.x-x,n.y-y)<r+state.visualRadius*1.7))return false;
  if(state.cityLandmarks.some(l=>Math.hypot(l.x-x,l.y-y)<r+l.r*.82))return false;
  if(distanceToRoad({x,y})<r+state.visualRadius*roadPad)return false;
  return true;
}
function landmarkRole(index){
  const start=state.stage.solution[0],finish=state.stage.solution[state.stage.solution.length-1];
  if(index===start)return'hub';
  if(index===finish&&finish!==start)return'goal';
  const roles=['home','shop','school','park','apartment','cafe'];
  return roles[(index+state.stage.num+state.stage.chapter)%roles.length];
}
function landmarkOffset(node,w,h){
  const linked=state.edges.filter(e=>e.a===node.id||e.b===node.id).map(e=>nodeById(e.a===node.id?e.b:e.a));
  let vx=0,vy=0;
  for(const n of linked){const dx=n.x-node.x,dy=n.y-node.y,len=Math.hypot(dx,dy)||1;vx+=dx/len;vy+=dy/len}
  // Put the landmark away from the roads meeting at this node.
  vx=-vx;vy=-vy;
  if(Math.hypot(vx,vy)<.2){vx=node.x<w/2?-1:1;vy=node.y<h/2?-1:1}
  const len=Math.hypot(vx,vy)||1;vx/=len;vy/=len;
  const d=Math.min(74,Math.max(43,state.visualRadius*4.5));
  let x=node.x+vx*d,y=node.y+vy*d;
  x=Math.max(40,Math.min(w-40,x));y=Math.max(92,Math.min(h-62,y));
  return{x,y};
}

   ctx.fillStyle='#21566c';ctx.beginPath();ctx.ellipse(3,0,10,8,0,0,7);ctx.fill();ctx.fillStyle='#fff7e8';ctx.beginPath();ctx.arc(9,0,8,0,7);ctx.fill();ctx.fillStyle='#4589ac';ctx.fillRect(11,-5,5,10);
 }
 ctx.restore();
}

/* 완료 */
function completeStage(){
  if(!state.blocked||!isCompletePath()||!screens.game.classList.contains('active'))return;
  const num=state.stage.num,wasNew=!save.completed.includes(num);if(wasNew)save.completed.push(num);save.completed.sort((a,b)=>a-b);save.lastStage=num===TOTAL_STAGES?1:num+1;persist();syncHome();playWin();burstConfetti();
  const chapterDone=num%10===0&&CHAPTERS[(num-1)/10]&&STAGES.slice(num-10,num).every(s=>save.completed.includes(s.num));
  if(num===TOTAL_STAGES&&save.completed.length===TOTAL_STAGES)$('#successText').textContent='50개 스테이지를 모두 완성했어요!';
  else if(chapterDone)$('#successText').textContent=state.stage.chapterName+' 챕터를 모두 완성했어요.';
  else $('#successText').textContent='스테이지 '+num+'에서 내가 그린 모든 골목으로 배달했어요.';
  $('#nextBtn').textContent=num===TOTAL_STAGES?'처음부터':'다음 스테이지';$('#successModal').classList.add('show');
}
function burstConfetti(){
  const colors=['#ff8a1f','#ffbd42','#4f7cff','#39c8a8','#ff5c70'];for(let i=0;i<42;i++){const p=document.createElement('i');p.className='confetti';p.style.left=(50+(Math.random()-.5)*12)+'%';p.style.top='42%';p.style.background=colors[i%colors.length];p.style.setProperty('--dx',((Math.random()-.5)*520)+'px');p.style.setProperty('--dy',(170+Math.random()*330)+'px');p.style.animationDelay=(Math.random()*.18)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),1800)}
}
let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}

/* 버튼 */
$('#continueBtn').onclick=()=>loadStage(continueStageNumber()-1);
$('#selectBtn').onclick=()=>{ensureAudio();showScreen('select')};$('#selectBack').onclick=()=>showScreen('home');
$('#gameBack').onclick=()=>{state.blocked=false;showScreen('select')};$('#undoBtn').onclick=undo;$('#resetBtn').onclick=resetStage;$('#hintBtn').onclick=showHint;
$('#settingsBtn').onclick=()=>{if(state.delivery)return;endPointer();$('#settingsModal').classList.add('show');syncToggles()};$('#settingsClose').onclick=()=>$('#settingsModal').classList.remove('show');
$('#settingsModal').addEventListener('pointerdown',e=>{if(e.target===$('#settingsModal'))$('#settingsModal').classList.remove('show')});
$('#successSelect').onclick=()=>{state.blocked=false;$('#successModal').classList.remove('show');showScreen('select')};
$('#nextBtn').onclick=()=>{const next=state.stage.num===TOTAL_STAGES?1:state.stage.num+1;loadStage(next-1)};
function toggleBgm(){ensureAudio();save.bgm=!save.bgm;save.bgm?startBgm():stopBgm();persist();syncToggles()}
function toggleSfx(){ensureAudio();save.sfx=!save.sfx;persist();syncToggles();if(save.sfx)tone(660,.1)}
function toggleAssist(){save.assist=!save.assist;persist();syncToggles();if(save.assist)toast('터치 보정과 막힘 알림을 켰어요.')}
$('#homeBgm').onclick=toggleBgm;$('#bgmSwitch').onclick=toggleBgm;$('#homeSfx').onclick=toggleSfx;$('#sfxSwitch').onclick=toggleSfx;$('#assistSwitch').onclick=toggleAssist;

window.addEventListener('resize',resizeCanvas);
window.addEventListener('keydown',e=>{
  if(!screens.game.classList.contains('active'))return;
  if(e.key==='Escape'){if($('#settingsModal').classList.contains('show'))$('#settingsModal').classList.remove('show');else if($('#successModal').classList.contains('show')){$('#successModal').classList.remove('show');state.blocked=false;showScreen('select')}else showScreen('select');return}
  const key=e.key.toLowerCase();if(key==='z'){e.preventDefault();undo()}else if(key==='r')resetStage();else if(key==='h')showHint();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){endPointer();stopBgm();}else if(save.bgm&&audioCtx)startBgm()});

/* 50개 스테이지 데이터 자동 검증 */
function properCross(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x),e=1e-9,o1=o(a,b,c),o2=o(a,b,d),o3=o(c,d,a),o4=o(c,d,b);
  return((o1>e&&o2<-e)||(o1<-e&&o2>e))&&((o3>e&&o4<-e)||(o3<-e&&o4>e));
}
function pointSegmentDistance(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,wx=p.x-a.x,wy=p.y-a.y,vv=vx*vx+vy*vy,t=Math.max(0,Math.min(1,vv?(wx*vx+wy*vy)/vv:0)),x=a.x+t*vx,y=a.y+t*vy;return{distance:Math.hypot(p.x-x,p.y-y),t}}
(function validateStages(){
  if(STAGES.length!==TOTAL_STAGES)throw new Error('스테이지 수 오류');
  STAGES.forEach((s,idx)=>{
    if(s.num!==idx+1||!Array.isArray(s.coords)||!Array.isArray(s.edges)||!Array.isArray(s.solution))throw new Error('스테이지 형식 오류 '+s.num);
    const seen=new Set(),deg=Array(s.coords.length).fill(0),adj=Array.from({length:s.coords.length},()=>[]);
    s.edges.forEach(([a,b],ei)=>{if(a===b||!s.coords[a]||!s.coords[b])throw new Error('잘못된 선 '+s.num);const k=edgeKey(a,b);if(seen.has(k))throw new Error('중복 선 '+s.num);seen.add(k);deg[a]++;deg[b]++;adj[a].push(b);adj[b].push(a);
      for(let n=0;n<s.coords.length;n++){if(n===a||n===b)continue;const hit=pointSegmentDistance(s.coords[n],s.coords[a],s.coords[b]);if(hit.t>.04&&hit.t<.96&&hit.distance<.028)throw new Error('점 관통 '+s.num)}
      for(let j=0;j<ei;j++){const[c,d]=s.edges[j];if(new Set([a,b,c,d]).size===4&&properCross(s.coords[a],s.coords[b],s.coords[c],s.coords[d]))throw new Error('선 교차 '+s.num)}
    });
    const odd=deg.filter(d=>d%2).length;if(odd!==0&&odd!==2)throw new Error('한붓 조건 오류 '+s.num);
    const active=deg.findIndex(d=>d>0),visited=new Set(active>=0?[active]:[]),q=active>=0?[active]:[];while(q.length){const v=q.shift();adj[v].forEach(n=>{if(!visited.has(n)){visited.add(n);q.push(n)}})}if(deg.some((d,i)=>d>0&&!visited.has(i)))throw new Error('분리 도형 '+s.num);
    const solutionEdges=s.solution.slice(1).map((v,i)=>edgeKey(s.solution[i],v));if(solutionEdges.length!==s.edges.length||new Set(solutionEdges).size!==s.edges.length||solutionEdges.some(k=>!seen.has(k)))throw new Error('해답 경로 오류 '+s.num);
  });
})();

})();
