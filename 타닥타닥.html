<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타닥타닥 한글 타자연습</title>
<style>
:root{
  --bg:#f4f6ff; --panel:#fff; --ink:#20243a; --muted:#7a819b; --line:#dfe4f2;
  --primary:#6c63ff; --primary2:#927cff; --good:#21b487; --bad:#ef5d73; --warn:#f4a62a;
  --shadow:0 16px 44px rgba(65,70,120,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1240px;margin:auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:1000;font-size:clamp(23px,3vw,34px);letter-spacing:-.04em}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--primary),#a16fff);box-shadow:0 9px 22px rgba(108,99,255,.25)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(60,65,110,.08)}
.btn.primary{background:var(--primary);color:white;box-shadow:0 8px 20px rgba(108,99,255,.24)}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#fff,#f2efff);border-radius:30px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"⌨";position:absolute;right:20px;bottom:-26px;font-size:165px;opacity:.055;transform:rotate(-8deg)}
.hero h1{margin:0 0 10px;font-size:clamp(32px,5vw,58px);letter-spacing:-.06em;line-height:1.08}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.7;max-width:800px}
.mode-grid{display:grid;margin-top:4px;grid-template-columns:repeat(5,1fr);gap:15px}
.mode-card{border:2px solid transparent;background:#fff;border-radius:23px;padding:20px;text-align:left;min-height:188px;box-shadow:var(--shadow);transition:.18s}
.mode-card:hover{transform:translateY(-4px);border-color:#c9c4ff}
.mode-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#f0efff;font-size:27px;margin-bottom:15px}
.mode-card h3{margin:0 0 7px;font-size:21px}.mode-card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.record-card{margin-top:18px;background:white;border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px}
.records{display:flex;gap:24px;flex-wrap:wrap}.record b{font-size:24px}.record span{display:block;color:var(--muted);font-size:12px;font-weight:900;margin-top:2px}
.practice-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.panel{background:#fff;border-radius:26px;box-shadow:var(--shadow)}
.main-panel{padding:22px;min-height:700px}.side-panel{padding:18px;display:flex;flex-direction:column;gap:14px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.title{font-size:27px;font-weight:1000;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;font-weight:750;margin-top:3px}
.badge{padding:8px 12px;border-radius:999px;background:#eeecff;color:#5149d3;font-weight:1000;font-size:13px}
.live-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.live{background:#f7f8fc;border-radius:17px;padding:13px 10px;text-align:center;position:relative;overflow:hidden}
.live strong{font-size:26px;line-height:1}.live span{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:900}
.live.pulse strong{animation:pulse .25s ease}@keyframes pulse{50%{transform:scale(1.1);color:var(--primary)}}
.target-box{min-height:190px;border:2px solid var(--line);border-radius:24px;padding:23px;display:flex;align-items:center;justify-content:center;text-align:center;background:#fbfcff;position:relative}
.target-text{font-size:clamp(29px,4.6vw,52px);font-weight:950;line-height:1.5;word-break:keep-all;letter-spacing:-.03em}
.target-text.small{font-size:clamp(21px,3vw,34px)}
.target-text .done{color:#b8bdcc}.target-text .ok{color:var(--good)}.target-text .wrong{color:var(--bad);background:#ffe9ed;border-radius:5px}
.prompt{position:absolute;bottom:10px;left:0;right:0;color:var(--muted);font-size:12px;font-weight:800}
.input-wrap{margin-top:13px}
.text-input,.long-input,.game-input{width:100%;border:2px solid #cfd5e6;border-radius:18px;padding:15px 17px;font-size:22px;outline:none;background:#fff}
.text-input:focus,.long-input:focus,.game-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,99,255,.1)}
.long-input{height:170px;resize:none;line-height:1.65;font-size:19px}.long-input:disabled{background:#f4f5f9;color:#9298aa}
.note{margin-top:7px;color:var(--muted);font-size:12px;text-align:center}
.keyboard{margin-top:20px;user-select:none}
.keyboard-row{display:flex;gap:6px;justify-content:center;margin:6px 0}
.key{height:47px;min-width:45px;padding:0 9px;border-radius:11px;background:#f7f8fc;border:1px solid #d8deec;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 3px 0 #cfd5e4}
.key.active{transform:translateY(2px);box-shadow:0 1px 0 #cfd5e4;background:#e7e5ff;border-color:#aaa4ff}
.side-title{font-size:13px;font-weight:1000;color:var(--muted);letter-spacing:.02em}
.progress{height:12px;background:#f1f3f8;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#a072ff);transition:.18s}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson{border:0;border-radius:14px;padding:11px 12px;background:#f7f8fc;text-align:left;font-weight:850}.lesson.active{background:#eceaff;color:#5148d6}
.tip{background:#fff8e9;border-radius:17px;padding:13px;color:#8c6518;font-size:13px;line-height:1.55}
.long-source{margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:850}
.long-board{border:2px solid #d8deea;border-radius:22px;padding:15px;background:#f1f2f4;min-height:420px;overflow:hidden}
.long-loading{display:grid;place-items:center;min-height:360px;color:var(--muted);font-weight:900}
.long-row{margin:7px 0;transition:.18s;opacity:.56}
.long-row.current{opacity:1}
.long-row.done{opacity:.78}
.long-target-line{padding:3px 12px 7px;color:#5277ad;font-size:17px;line-height:1.5;font-weight:750;min-height:34px;word-break:keep-all}
.long-target-line .char-ok{color:#2d936f}
.long-target-line .char-bad{color:#d83652;background:#ffe2e8;border-radius:4px;text-decoration:underline;text-decoration-thickness:2px}
.long-answer-line{width:100%;min-height:38px;border:0;border-radius:9px;padding:7px 12px;background:#646a72;color:white;font-size:17px;line-height:1.45;font-weight:800;outline:none}
.long-answer-line.current{background:#173c83;box-shadow:0 0 0 3px rgba(23,60,131,.13)}
.long-answer-line.current:focus{box-shadow:0 0 0 4px rgba(23,60,131,.18)}
.long-answer-line.has-error{background:#8d3143;box-shadow:0 0 0 3px rgba(216,54,82,.13)}
.long-answer-line.future{display:block;background:#d7d9dd;color:#9ca1aa}
.long-answer-text{min-height:38px;border-radius:9px;padding:7px 12px;background:#666b73;color:#fff;font-size:17px;line-height:1.45;font-weight:800}
.long-answer-text.future{background:#d8dade;color:#a2a6ad}
.long-step-label{font-size:11px;font-weight:1000;color:#8b91a3;margin:2px 12px 3px}
.long-step-label.current{color:#173c83}
.long-hint{min-height:34px;margin-top:9px;padding:8px 12px;border-radius:12px;background:#eef2ff;color:#56607d;font-size:13px;font-weight:800}
.long-hint.error{background:#fff0f3;color:#b9324c}
.game-area{position:relative;height:470px;border-radius:24px;overflow:hidden;background:linear-gradient(#dff4ff 0 72%,#dcefcf 72% 100%);border:2px solid #d8e0ee}
.cloud{position:absolute;color:white;font-size:62px;opacity:.8;animation:drift 12s linear infinite}@keyframes drift{from{transform:translateX(-130px)}to{transform:translateX(1000px)}}
.fall-item{position:absolute;top:-60px;padding:8px 12px;border-radius:13px;background:#fff;box-shadow:0 8px 18px rgba(60,80,120,.14);font-size:22px;font-weight:950;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.fall-item.sentence{font-size:18px;padding:9px 12px;white-space:normal;line-height:1.4;max-width:58%}
.fall-item.hit{animation:pop .24s ease forwards}@keyframes pop{to{transform:scale(1.35);opacity:0}}
.game-entry{display:flex;gap:9px;margin-top:12px}.game-entry input{flex:1}
.overlay{position:fixed;inset:0;background:rgba(24,27,45,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.overlay.show{display:flex}
.result{width:min(520px,100%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 30px 80px rgba(20,25,50,.25)}
.result h2{margin:0;font-size:31px}.grade{font-size:68px;font-weight:1000;color:var(--primary);line-height:1;margin:16px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.result-item{background:#f7f8fc;border-radius:16px;padding:13px 6px}.result-item b{font-size:21px}.result-item span{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-top:4px}
.result-actions{display:flex;gap:9px;justify-content:center}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(15px);opacity:0;background:#20243a;color:#fff;border-radius:999px;padding:11px 17px;font-weight:850;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.mode-grid{grid-template-columns:repeat(3,1fr)}.practice-wrap{grid-template-columns:1fr}.side-panel{order:-1}.lesson-list{display:grid;grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.long-board{padding:10px;min-height:360px}.long-target-line,.long-answer-line,.long-answer-text{font-size:15px}.long-row:nth-child(n+5){display:none}.app{padding:11px}.mode-grid{grid-template-columns:1fr}.hero{padding:24px 20px}.record-card{align-items:flex-start;flex-direction:column}.live-strip{grid-template-columns:repeat(2,1fr)}.main-panel{padding:15px;min-height:auto}.lesson-list{grid-template-columns:repeat(2,1fr)}.keyboard{transform-origin:top center;transform:scale(.78);margin-left:-12%;margin-right:-12%;margin-bottom:-45px}.result-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">⌨</div>타닥타닥</div>
    <div class="top-actions">
      <button class="btn ghost" id="soundBtn">🔊 소리 켬</button>
      <button class="btn ghost" id="homeBtn" style="display:none">🏠 처음으로</button>
    </div>
  </div>

  <section id="home" class="screen active">
    <div class="mode-grid">
      <button class="mode-card" data-mode="position"><div class="mode-icon">🖐️</div><h3>자리 연습</h3><p>자음과 모음의 위치를 손에 익혀요.</p></button>
      <button class="mode-card" data-mode="word"><div class="mode-icon">🍀</div><h3>낱말 연습</h3><p>짧은 낱말을 정확하고 빠르게 입력해요.</p></button>
      <button class="mode-card" data-mode="sentence"><div class="mode-icon">💬</div><h3>문장 연습</h3><p>짧고 자연스러운 문장을 끝까지 입력해요.</p></button>
      <button class="mode-card" data-mode="long"><div class="mode-icon">📖</div><h3>장문 연습</h3><p>애국가·시·소설을 한 줄씩 확인하며 끝까지 입력해요.</p></button>
      <button class="mode-card" data-mode="rain"><div class="mode-icon">🌧️</div><h3>글비 게임</h3><p>하늘에서 떨어지는 낱말과 문장을 입력해 없애요.</p></button>
    </div>
    <div class="record-card">
      <div><b style="font-size:18px">내 최고 기록</b><div style="color:var(--muted);font-size:13px;margin-top:3px">이 기기에 자동 저장</div></div>
      <div class="records">
        <div class="record"><b id="bestSpeed">0</b><span>최고 타수</span></div>
        <div class="record"><b id="bestAcc">0%</b><span>최고 정확도</span></div>
        <div class="record"><b id="bestGame">0</b><span>게임 최고점수</span></div>
      </div>
    </div>
  </section>

  <section id="practice" class="screen">
    <div class="practice-wrap">
      <main class="panel main-panel">
        <div class="header-row">
          <div><div class="title" id="title">자리 연습</div><div class="sub" id="desc"></div></div>
          <div class="badge" id="lessonBadge"></div>
        </div>

        <div class="live-strip">
          <div class="live"><strong id="liveSpeed">0</strong><span>실시간 타수</span></div>
          <div class="live"><strong id="liveAcc">100%</strong><span>정확도</span></div>
          <div class="live"><strong id="liveTime">00:00.0</strong><span>걸린 시간</span></div>
          <div class="live"><strong id="liveProgress">0/10</strong><span>진행</span></div>
        </div>

        <section id="normalArea">
          <div class="target-box">
            <div class="target-text" id="targetText"></div>
            <div class="prompt" id="promptText"></div>
          </div>
          <div class="input-wrap">
            <input class="text-input" id="typingInput" type="text" autocomplete="off" spellcheck="false" placeholder="여기에 입력하세요">
            <div class="note">한글 입력 상태에서 연습하세요. Enter를 누르면 채점합니다.</div>
          </div>
          <div class="keyboard" id="keyboard"></div>
        </section>

        <section id="longArea" style="display:none">
          <div class="long-source" id="longSource"></div>
          <div class="long-board" id="longBoard">
            <div class="long-loading" id="longLoading">글을 준비하고 있습니다.</div>
            <div id="longRows"></div>
          </div>
          <div class="long-hint" id="longHint">한 줄을 정확히 입력하면 자동으로 다음 줄로 넘어갑니다.</div>
          <div class="note">현재 줄만 점검하므로 긴 글에서도 틀린 위치를 쉽게 찾을 수 있습니다.</div>
        </section>

        <section id="rainArea" style="display:none">
          <div class="game-area" id="gameArea">
            <div class="cloud" style="top:22px;left:0">☁</div>
            <div class="cloud" style="top:110px;left:-240px;animation-delay:-5s">☁</div>
          </div>
          <div class="game-entry">
            <input class="game-input" id="gameInput" type="text" autocomplete="off" spellcheck="false" placeholder="떨어지는 글을 입력하고 Enter!">
            <button class="btn primary" id="gameEnter">입력</button>
          </div>
          <div class="note">60초 동안 진행됩니다. 시간이 지날수록 조금씩 빨라집니다.</div>
        </section>
      </main>

      <aside class="panel side-panel">
        <div class="side-title">진행률</div>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="side-title">단계 선택</div>
        <div class="lesson-list" id="lessonList"></div>
        <div class="tip" id="tipBox"></div>
        <button class="btn primary" id="restartBtn">↻ 다시 시작</button>
      </aside>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="result">
    <h2>연습 완료!</h2>
    <div class="grade" id="grade">A</div>
    <div class="result-grid">
      <div class="result-item"><b id="rSpeed">0</b><span>타수</span></div>
      <div class="result-item"><b id="rAcc">100%</b><span>정확도</span></div>
      <div class="result-item"><b id="rTime">00:00</b><span>시간</span></div>
      <div class="result-item"><b id="rScore">0</b><span>점수</span></div>
    </div>
    <div class="result-actions">
      <button class="btn ghost" id="resultHome">처음으로</button>
      <button class="btn primary" id="resultRetry">다시 도전</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const DATA={
 position:[
  {name:'기본 자리',items:['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅏ','ㅓ','ㅗ','ㅜ','ㅣ']},
  {name:'윗 자리',items:['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ']},
  {name:'아랫 자리',items:['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','ㅣ','ㅅ','ㄹ']},
  {name:'섞어서',items:['ㅁ','ㅏ','ㄴ','ㅓ','ㅇ','ㅗ','ㄹ','ㅜ','ㅎ','ㅣ','ㄱ','ㅔ']}
 ],
 word:[
  {name:'쉬운 낱말',items:['나무','바다','하늘','구름','사과','학교','친구','우산','기차','토끼','고래','노을']},
  {name:'생활 낱말',items:['운동장','도서관','연필','교실','자전거','강아지','햇살','물고기','놀이터','소풍','선생님','가족']},
  {name:'긴 낱말',items:['무지개다리','초록운동장','여름방학','과학실험','환경보호','우리나라','놀이공원','동물친구','책읽는시간','아침햇살']}
 ],
 sentence:[
  {name:'짧은 문장',items:['오늘도 즐겁게 시작해요.','친구와 함께 웃어요.','맑은 하늘에 구름이 떠요.','우리 반은 서로 도와요.','천천히 정확하게 입력해요.','바람이 나뭇잎을 흔들어요.']},
  {name:'보통 문장',items:['쉬는 시간에는 친구들과 운동장에서 신나게 뛰어놀아요.','작은 실수는 괜찮으니 끝까지 천천히 입력해 보세요.','비가 그친 뒤 운동장 위로 예쁜 무지개가 나타났어요.','우리는 서로의 생각을 들으며 즐겁게 이야기할 수 있어요.']},
  {name:'도전 문장',items:['빠르게 입력하는 것보다 정확한 손가락 위치를 익히는 것이 먼저입니다.','오늘의 작은 연습이 쌓이면 어느새 자연스럽게 빠른 타자를 칠 수 있습니다.','궁금한 것이 생겼을 때 스스로 질문하고 찾아보는 습관은 매우 중요합니다.']}
 ],
 long:[
  {
    name:'애국가 1~4절',
    author:'대한민국',
    source:'행정안전부 국가상징',
    preserveLines:true,
    embedded:`동해물과 백두산이 마르고 닳도록
하느님이 보우하사 우리나라 만세.
무궁화 삼천리 화려강산
대한 사람, 대한으로 길이 보전하세.

남산 위에 저 소나무, 철갑을 두른 듯
바람서리 불변함은 우리 기상일세.
무궁화 삼천리 화려강산
대한 사람, 대한으로 길이 보전하세.

가을 하늘 공활한데 높고 구름 없이
밝은 달은 우리 가슴 일편단심일세.
무궁화 삼천리 화려강산

   n+=1+vowelExtra+tailExtra;
  }else if(/\s/.test(ch))n+=1;
  else n+=1;

}

function normalizeWorkText(s){
 return (s||'')
   .replace(/\u00a0/g,' ')
   .replace(/[ \t]+/g,' ')
   .replace(/ *\n */g,'\n')
   .replace(/\n{3,}/g,'\n\n')
   .replace(/\[편집\]/g,'')
   .trim();
}
function isMetaParagraph(s, work){
 const t=normalizeWorkText(s);
 if(!t)return true;
 const bad=[
   '자매 프로젝트','위키백과 문서','위키데이터 항목',
   '저자:','저자 :','원제는','발표.','다운로드',
   '바깥 고리','라이선스','둘러보기','문서 정보',
   '이 저작물은','퍼블릭 도메인','저작권'
 ];
 if(bad.some(x=>t.includes(x)))return true;
 if(t===work.name || t===work.author || t===`${work.name} (${work.author})`)return true;
 if(t.startsWith('←') || t.endsWith('→'))return true;
 return false;
}
function cleanWikiText(html, work){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const root=doc.querySelector('.mw-parser-output')||doc.body;

 // 편집/내비게이션/작품정보/각주/라이선스 계열 제거
 root.querySelectorAll(
   'script,style,table,.navbox,.metadata,.mw-editsection,.hatnote,'+
   '.sistersitebox,.ws-noexport,.noprint,.printfooter,sup.reference,'+
   '.references,.mw-references-wrap,figure'
 ).forEach(x=>x.remove());

 // 실제 소설 본문은 연속된 p 요소로 제공되는 경우가 가장 안정적이다.
 const paragraphs=[...root.querySelectorAll('p')]
   .map(p=>normalizeWorkText(p.innerText||p.textContent||''));

 // 첫 번째 '실제 본문다운 긴 문단'을 찾는다.
 // 위키문헌 상단 작품 정보는 대개 짧거나 메타 키워드를 포함한다.
 let start=paragraphs.findIndex(p=>p.length>=70 && !isMetaParagraph(p,work));

 let body=[];
 if(start>=0){
   for(let i=start;i<paragraphs.length;i++){
     const p=paragraphs[i];
     if(!p)continue;

     // 작품 뒤의 라이선스/외부링크 영역이 시작되면 종료
     if(
       p.includes('바깥 고리') ||
       p.includes('라이선스') ||
       p.includes('이 저작물은') ||
       p.includes('퍼블릭 도메인')
     ) break;

     if(!isMetaParagraph(p,work)) body.push(p);
   }
 }

 let out=normalizeWorkText(body.join('\n\n'));

 // 예외적인 문서 구조에서는 후보 컨테이너에서 다시 찾는다.
 if(out.length<500){
   const candidates=[
     root.querySelector('.prp-pages-output'),
     root.querySelector('.poem'),
     root.querySelector('.ws-content'),
     root
   ].filter(Boolean);

   for(const candidate of candidates){
     const ps=[...candidate.querySelectorAll('p')]
       .map(p=>normalizeWorkText(p.innerText||p.textContent||''))
       .filter(p=>p && !isMetaParagraph(p,work));
     const first=ps.findIndex(p=>p.length>=70);
     if(first>=0){
       const candidateText=normalizeWorkText(ps.slice(first).join('\n\n'));
       if(candidateText.length>out.length) out=candidateText;
     }
   }
 }

 // 혹시 남은 위키식 이동 화살표/작품정보 한 줄을 마지막으로 방어
 out=out
   .split('\n')
   .filter(line=>{
     const t=line.trim();
     return t &&
       !t.startsWith('←') &&
       !t.includes('자매 프로젝트:') &&
       !/^저자\s*:/.test(t) &&
       !(t.includes('위키백과') && t.includes('위키데이터'));
   })
   .join('\n')
   .replace(/\n{3,}/g,'\n\n')
   .trim();

 return out;
}
function splitProseLine(text,maxLen=38){
 const result=[];
 let rest=normalizeWorkText(text).replace(/\n+/g,' ').trim();
 while(rest){
   if(rest.length<=maxLen){result.push(rest);break}
   let cut=-1;
   const min=Math.floor(maxLen*.64);

   // 문장부호를 가장 우선
   for(let i=Math.min(maxLen,rest.length-1);i>=min;i--){
     if(/[.!?。”’」』]/.test(rest[i])){cut=i+1;break}
   }
   // 그 다음 띄어쓰기
   if(cut<0){
     for(let i=Math.min(maxLen,rest.length-1);i>=min;i--){
       if(/\s/.test(rest[i])){cut=i;break}
     }
   }
   if(cut<0)cut=maxLen;
   const part=rest.slice(0,cut).trim();
   if(part)result.push(part);
   rest=rest.slice(cut).trim();
 }
 return result;
}

 return lines.filter(Boolean);
}
async function fetchWholeWork(work){

 const cacheKey='tadak_fullwork_v4_'+work.wiki;
 const cached=localStorage.getItem(cacheKey);
 if(cached && cached.length>500)return cached;

 const api='https://ko.wikisource.org/w/api.php?action=parse&format=json&origin=*&prop=text&page='+encodeURIComponent(work.wiki);
 const res=await fetch(api);
 if(!res.ok)throw new Error('본문을 불러오지 못했습니다.');
 const json=await res.json();
 const html=json && json.parse && json.parse.text && json.parse.text['*'];
 if(!html)throw new Error('작품 본문이 없습니다.');

 const cleaned=cleanWikiText(html,work);
 if(cleaned.length<500)throw new Error('작품 본문을 정확히 분리하지 못했습니다.');
 if(
   cleaned.slice(0,250).includes('자매 프로젝트') ||
   cleaned.slice(0,250).includes('위키데이터') ||
   cleaned.slice(0,120).startsWith('←')
 ) throw new Error('작품 정보가 본문에 섞였습니다.');

 try{localStorage.setItem(cacheKey,cleaned)}catch(e){}
 return cleaned;
}

   const ch=target[i];
   if(i<value.length){
     out+=`<span class="${value[i]===ch?'char-ok':'char-bad'}">${esc(ch)}</span>`;
   }else out+=esc(ch);
 }
 return out;
}
function firstMismatch(target,value){
 const n=Math.min(target.length,value.length);
 for(let i=0;i<n;i++) if(target[i]!==value[i]) return i;
 if(value.length>target.length)return target.length;
 return -1;
}
function renderLongRows(){
 const work=DATA.long[lesson];
 const rows=$('#longRows');
 rows.innerHTML='';

 const from=Math.max(0,longLine-2);
 const to=Math.min(longLines.length-1,longLine+2);

 $('#longSource').textContent=`${work.author} 「${work.name}」 · 전체 ${longLines.length}줄 중 ${longLine+1}줄`;
 $('#lessonBadge').textContent=`${work.name} ${longLine+1}/${longLines.length}`;

 for(let i=from;i<=to;i++){
   const row=document.createElement('div');
   row.className='long-row '+(i<longLine?'done':i===longLine?'current':'future');

   const section=longSectionLabel(work,i);
   if(section){
     const lab=document.createElement('div');
     lab.className='long-step-label'+(i===longLine?' current':'');
     lab.textContent=section;
     row.appendChild(lab);
   }

   const targetDiv=document.createElement('div');
   targetDiv.className='long-target-line';
   targetDiv.dataset.line=i;
   targetDiv.innerHTML=esc(longLines[i]);
   row.appendChild(targetDiv);

   if(i<longLine){
     const ans=document.createElement('div');
     ans.className='long-answer-text';
     ans.textContent=longLines[i];
     row.appendChild(ans);
   }else if(i===longLine){
     const inp=document.createElement('input');
     inp.type='text';
     inp.className='long-answer-line current';
     inp.autocomplete='off';
     inp.spellcheck=false;
     inp.dataset.line=i;
     inp.maxLength=longLines[i].length+2;
     inp.placeholder='이 줄을 그대로 입력하세요.';
     inp.addEventListener('compositionstart',()=>composing=true);
     inp.addEventListener('compositionend',()=>{
       composing=false;
       handleLongInput(inp);
     });
     inp.addEventListener('input',()=>{
       if(!composing)handleLongInput(inp);
     });
     inp.addEventListener('keydown',e=>{
       if(e.key==='Enter'){
         e.preventDefault();
         if(inp.value===longLines[longLine])completeLongLine();
         else focusFirstLongError(inp);
       }
     });
     row.appendChild(inp);
   }else{
     const future=document.createElement('div');
     future.className='long-answer-text future';
     future.innerHTML='&nbsp;';
     row.appendChild(future);
   }

   rows.appendChild(row);
 }

 const inp=rows.querySelector('.long-answer-line.current');
 if(inp)setTimeout(()=>inp.focus(),20);
 $('#longHint').className='long-hint';
 $('#longHint').textContent='한 줄을 정확히 입력하면 자동으로 다음 줄로 넘어갑니다.';
}
function handleLongInput(inp){
 if(!longLines.length)return;
 const target=longLines[longLine];
 const value=inp.value;
 const targetDiv=document.querySelector(`.long-target-line[data-line="${longLine}"]`);

 // 새로 생긴 오타 위치는 한 번씩 기록
 for(let i=0;i<Math.min(value.length,target.length);i++){
   if(value[i]!==target[i]){
     const key=`${longLine}:${i}`;
     if(!longErrorKeys.has(key)){longErrorKeys.add(key);longErrors++}
   }
 }
 if(value.length>target.length){
   const key=`${longLine}:extra`;
   if(!longErrorKeys.has(key)){longErrorKeys.add(key);longErrors++}
 }

 const mismatch=firstMismatch(target,value);
 if(targetDiv)targetDiv.innerHTML=decoratedTarget(target,value);

 if(mismatch>=0){
   inp.classList.add('has-error');
   $('#longHint').className='long-hint error';
   if(mismatch<target.length){
     const expected=target[mismatch]===' ' ? '띄어쓰기' : `‘${target[mismatch]}’`;
     $('#longHint').textContent=`${mismatch+1}번째 글자를 확인하세요. 원문은 ${expected}입니다.`;
   }else{
     $('#longHint').textContent='원문보다 글자가 더 입력되었습니다.';
   }
 }else{
   inp.classList.remove('has-error');
   $('#longHint').className='long-hint';
   $('#longHint').textContent=value.length===target.length?'좋아요! 다음 줄로 넘어갑니다.':'현재까지 정확합니다.';
 }

 longLastValue=value;
 if(value===target){
   inp.disabled=true;
   setTimeout(completeLongLine,170);
 }
}
function focusFirstLongError(inp){
 const target=longLines[longLine]||'';
 const mismatch=firstMismatch(target,inp.value);
 if(mismatch>=0){
   try{inp.setSelectionRange(mismatch,Math.min(mismatch+1,inp.value.length))}catch(e){}
   inp.focus();
 }
}
function completeLongLine(){
 if(longLoading || longLine>=longLines.length)return;
 const inp=document.querySelector('.long-answer-line.current');
 if(inp && inp.value!==longLines[longLine])return;

 longCompletedText+=longLines[longLine]+'\n';
 longLine++;
 longLastValue='';
 beep('ok');

 if(longLine>=longLines.length){
   longCompletedText=longLines.join('\n');
   endTime=Date.now();
   cancelAnimationFrame(timerRAF);
   const speed=calcSpeed(),acc=calcAccuracy(),score=Math.round(speed*acc/10);
   saveRecords(speed,acc);
   setTimeout(()=>showResult(speed,acc,score),180);
   return;
 }
 renderLongRows();
}

function finish(){
 endTime=Date.now();cancelAnimationFrame(timerRAF);const speed=calcSpeed(),acc=calcAccuracy(),score=Math.round(speed*acc/10);
 saveRecords(speed,acc);showResult(speed,acc,score);
}
function showResult(speed,acc,score){
 const time=fmtTime(elapsedMs(),false);let g='C';if(acc>=97&&speed>=250)g='S';else if(acc>=95)g='A';else if(acc>=88)g='B';
 $('#grade').textContent=g;$('#rSpeed').textContent=speed;$('#rAcc').textContent=acc+'%';$('#rTime').textContent=time;$('#rScore').textContent=score;$('#overlay').classList.add('show');beep('win')
}
function startRain(){
 falling=[];gameHits=0;gameMiss=0;gameScore=0;gameStart=Date.now();$('#gameArea').querySelectorAll('.fall-item').forEach(e=>e.remove());$('#gameInput').value='';$('#gameInput').focus();
 spawnRain();spawnTimer=setInterval(spawnRain,DATA.rain[lesson].spawn);fallTimer=setInterval(tickRain,30)
}
function stopGame(){clearInterval(spawnTimer);clearInterval(fallTimer);spawnTimer=fallTimer=null;falling=[]}
function spawnRain(){
 if(mode!=='rain')return;const cfg=DATA.rain[lesson],area=$('#gameArea'),pool=cfg.type==='sentence'?RAIN_SENTENCES:RAIN_WORDS,txt=pool[Math.floor(Math.random()*pool.length)];
 const el=document.createElement('div');el.className='fall-item'+(cfg.type==='sentence'?' sentence':'');el.textContent=txt;area.appendChild(el);
 const max=Math.max(10,area.clientWidth-el.offsetWidth-20);el.style.left=(10+Math.random()*max)+'px';falling.push({el,text:txt,y:-70})
}
function tickRain(){
 if(mode!=='rain')return;const cfg=DATA.rain[lesson],area=$('#gameArea'),elapsed=(Date.now()-gameStart)/1000,mult=1+elapsed/90;
 falling.forEach(o=>{o.y+=cfg.speed*mult*.03;o.el.style.top=o.y+'px'});
 for(let i=falling.length-1;i>=0;i--)if(falling[i].y>area.clientHeight-52){falling[i].el.remove();falling.splice(i,1);gameMiss++;gameScore=Math.max(0,gameScore-40);beep('bad')}
 if(elapsed>=60){endTime=Date.now();stopGame();cancelAnimationFrame(timerRAF);const acc=calcAccuracy();saveRecords(0,acc,gameScore);showResult(0,acc,gameScore)}
}
function submitRain(){
 const inp=$('#gameInput'),val=inp.value.trim();if(!val)return;
 const idx=falling.findIndex(o=>o.text===val);
 if(idx>=0){const o=falling[idx];o.el.classList.add('hit');setTimeout(()=>o.el.remove(),220);falling.splice(idx,1);gameHits++;gameScore+=DATA.rain[lesson].type==='sentence'?180:100;beep('ok')}
 else{gameMiss++;gameScore=Math.max(0,gameScore-25);beep('bad')}
 inp.value=''
}

$$('.mode-card').forEach(b=>b.onclick=()=>startMode(b.dataset.mode,0));
$('#homeBtn').onclick=()=>{stopGame();cancelAnimationFrame(timerRAF);$('#overlay').classList.remove('show');showScreen('home')};
$('#restartBtn').onclick=()=>startMode(mode,lesson);
$('#resultHome').onclick=()=>{$('#overlay').classList.remove('show');stopGame();cancelAnimationFrame(timerRAF);showScreen('home')};
$('#resultRetry').onclick=()=>{$('#overlay').classList.remove('show');startMode(mode,lesson)};
$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔'};
$('#typingInput').addEventListener('compositionstart',()=>composing=true);
$('#typingInput').addEventListener('compositionend',()=>{composing=false;currentInput=$('#typingInput').value;renderTargetProgress(currentInput)});
$('#typingInput').addEventListener('input',()=>{currentInput=$('#typingInput').value;renderTargetProgress(currentInput)});
$('#typingInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setTimeout(submitNormal,0)}});
$('#gameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitRain()}});
$('#gameEnter').onclick=submitRain;

renderKeyboard();loadRecords();
})();
</script>
</body>
