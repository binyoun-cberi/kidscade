      ctx.beginPath();
      ctx.moveTo(-5 + i * 16, 30);
      ctx.bezierCurveTo(-40 + i * 16, 78, 45 + i * 12, 94, 12 + i * 20, 130);
      ctx.stroke();
    }
    ctx.fillStyle = "#67e8f9";
    ctx.shadowColor = "#67e8f9";
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(28, -10, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(55, -4, 7, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawBubbles() {
    ctx.save();
    for (const b of dive.bubbles) {
      if (!isOnScreen(b.x, b.y, 60)) continue;
      ctx.globalAlpha = clamp(b.life, 0, 0.8);
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }


  function drawNetEffects() {
    if (!dive || !dive.nets) return;
    ctx.save();
    for (const n of dive.nets) {
      if (!isOnScreen(n.x, n.y, n.maxR + 40)) continue;
      const t = Math.max(0, n.life / n.maxLife);
      ctx.globalAlpha = Math.min(0.85, t + 0.15);
      ctx.strokeStyle = "rgba(226,232,240,0.88)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, Math.max(5, n.r), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(186,230,253,0.62)";
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(n.x - n.r, n.y + i * n.r * 0.25);
        ctx.lineTo(n.x + n.r, n.y + i * n.r * 0.25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(n.x + i * n.r * 0.25, n.y - n.r);
        ctx.lineTo(n.x + i * n.r * 0.25, n.y + n.r);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawDiver() {
    const d = dive.diver;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.angle);

    // 조명 방향 표시
    const cone = ctx.createLinearGradient(10, 0, 130, 0);
    cone.addColorStop(0, "rgba(186,230,253,0.18)");
    cone.addColorStop(1, "rgba(186,230,253,0)");
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(8, -20);
    ctx.lineTo(150, -55);
    ctx.lineTo(150, 55);
    ctx.lineTo(8, 20);
    ctx.closePath();
    ctx.fill();

    // 그물 투척 방향 표시
    if (dive.harpoonFlash > 0) {
      ctx.strokeStyle = "rgba(254,249,195,0.78)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(dive.stats.netRange || dive.stats.harpoonRange, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(dive.stats.netRange || dive.stats.harpoonRange, 0, dive.stats.netRadius || 42, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 몸통
    ctx.fillStyle = "#f97316";
    ctx.strokeStyle = "#7c2d12";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-13, -13, 32, 26, 10);
    ctx.fill(); ctx.stroke();

    // 머리와 마스크
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(23, 0, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0ea5e9";
    ctx.beginPath(); ctx.ellipse(28, -2, 9, 6, 0, 0, Math.PI * 2); ctx.fill();

    // 산소통
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(-24, -11, 14, 22);
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-26, -5, 4, 10);

    // 팔
    ctx.strokeStyle = "#fed7aa";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(2, -9); ctx.lineTo(24, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, 9); ctx.lineTo(24, 20); ctx.stroke();

    // 오리발
    ctx.fillStyle = "#22d3ee";
    ctx.beginPath(); ctx.ellipse(-24, -11, 13, 5, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-24, 11, 13, 5, 0.2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function drawDarknessOverlay() {
    const depth = yToDepth(dive.diver.y);
    const alpha = clamp((depth - 120) / 1150, 0, 0.72);
    if (alpha <= 0.01) return;

    const sx = dive.diver.x - dive.camera.x + cw / 2;
    const sy = dive.diver.y - dive.camera.y + ch / 2;
    const radius = dive.stats.lightRadius;

    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 12, ${alpha})`;
    ctx.fillRect(0, 0, cw, ch);

    ctx.globalCompositeOperation = "destination-out";
    const light = ctx.createRadialGradient(sx, sy, 20, sx, sy, radius);
    light.addColorStop(0, "rgba(255,255,255,0.90)");
    light.addColorStop(0.55, "rgba(255,255,255,0.40)");
    light.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = light;
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawScreenEffects() {
    if (!dive) return;
    if (dive.damageFlash > 0) {
      ctx.save();
      ctx.fillStyle = `rgba(239, 68, 68, ${0.24 * dive.damageFlash})`;
      ctx.fillRect(0, 0, cw, ch);
      ctx.restore();
    }

    const oxyPct = percent(dive.diver.oxygen, dive.stats.oxygenMax);
    if (oxyPct <= 10 || dive.oxygenFlash > 0) {
      const a = oxyPct <= 10 ? 0.42 + Math.sin(dive.time * 12) * 0.22 : 0.20 * dive.oxygenFlash;
      ctx.save();
      ctx.strokeStyle = `rgba(248, 113, 113, ${a})`;
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, cw - 14, ch - 14);
      ctx.restore();
    }
  }

  function drawHUD() {
    const diver = dive.diver;
    const stats = dive.stats;
    const depth = yToDepth(diver.y);
    const zone = getZoneName(depth);
    const oxPct = percent(diver.oxygen, stats.oxygenMax);
    const hpPct = percent(diver.health, stats.healthMax);

    ctx.save();
    ctx.font = "bold 15px system-ui";
    ctx.textBaseline = "top";

    const panelW = Math.min(390, cw - 20);
    ctx.fillStyle = "rgba(2,6,23,0.58)";
    ctx.strokeStyle = "rgba(125,211,252,0.35)";
    ctx.lineWidth = 1;
    roundRect(10, 10, panelW, 192, 16, true, true);

    drawBar(24, 28, panelW - 48, 18, diver.oxygen / stats.oxygenMax, oxPct <= 30 ? (oxPct <= 10 ? "#ef4444" : "#facc15") : "#38bdf8", "산소", `${oxPct}%`);
    drawBar(24, 58, panelW - 48, 18, diver.health / stats.healthMax, hpPct <= 30 ? "#ef4444" : "#22c55e", "체력", `${hpPct}%`);

    ctx.fillStyle = "#e0f2fe";
    ctx.fillText(`수심: ${Math.floor(depth)}m`, 24, 90);
    ctx.fillStyle = depth > stats.depthLimit ? "#facc15" : "#bae6fd";
    ctx.fillText(`안전 수심: ${stats.depthLimit}m`, 132, 90);
    const caveText = dive.currentCave ? ` / ${dive.currentCave.name}` : "";
    ctx.fillStyle = dive.currentCave ? "#fef3c7" : "#fef08a";
    ctx.fillText(`구역: ${zone}${caveText}`, 24, 116);
    ctx.fillStyle = "#bbf7d0";
    ctx.fillText(`돈: ${won(game.money)}`, 24, 142);
    ctx.fillStyle = dive.inventory.length >= stats.inventoryMax ? "#fecaca" : "#dbeafe";
    ctx.fillText(`가방: ${dive.inventory.length}/${stats.inventoryMax}`, 156, 142);
    ctx.fillStyle = isMissionComplete(false) ? "#86efac" : "#fde68a";
    ctx.fillText(`미션: ${missionProgressText()}`, 24, 168);

    if (oxPct <= 30) {
      drawCenterMessage(oxPct <= 10 ? "산소 위험! 배로 올라가세요!" : "산소가 부족해요! 위로 올라가세요!", oxPct <= 10 ? "#fecaca" : "#fef08a");
    } else if (depth > stats.depthLimit) {
      drawCenterMessage("현재 잠수복으로는 너무 깊어요!", "#fde68a");
    } else if (dive.inventory.length >= stats.inventoryMax) {
      drawCenterMessage("가방이 가득 찼어요! 배로 돌아가세요!", "#fef08a");
    }

    drawBoatArrow();
    drawMiniGuide();
    ctx.restore();
  }

  function drawBar(x, y, w, h, t, color, label, value) {
    t = clamp(t, 0, 1);
    ctx.fillStyle = "rgba(15,23,42,0.85)";
    roundRect(x, y, w, h, h / 2, true, false);
    ctx.fillStyle = color;
    roundRect(x, y, w * t, h, h / 2, true, false);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, h / 2, false, true);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px system-ui";
    ctx.fillText(`${label} ${value}`, x + 8, y + 1);
  }

  function drawCenterMessage(text, color) {
    ctx.save();
    ctx.font = "900 24px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(2,6,23,0.55)";
    roundRect(cw / 2 - 210, 84, 420, 48, 18, true, false);
    ctx.fillStyle = color;
    ctx.fillText(text, cw / 2, 108);
    ctx.restore();
  }

  function drawBoatArrow() {
    const d = dive.diver;
    const dx = BOAT_X - d.x;
    const dy = SURFACE_Y - d.y;
    const angle = Math.atan2(dy, dx);
    const x = cw - 78;
    const y = 78;
    ctx.save();
    ctx.fillStyle = "rgba(2,6,23,0.55)";
    ctx.strokeStyle = "rgba(186,230,253,0.4)";
    roundRect(x - 42, y - 42, 84, 84, 22, true, true);
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.moveTo(30, 0);
    ctx.lineTo(-12, -17);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-12, 17);
    ctx.closePath();
    ctx.fill();
    ctx.rotate(-angle);
    ctx.fillStyle = "#e0f2fe";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("배", 0, 26);
    ctx.restore();
  }

  function drawMiniGuide() {
    const x = cw - 66;
    const top = 148;
    const h = Math.min(360, ch - 250);
    if (h < 170) return;
    ctx.save();
    ctx.fillStyle = "rgba(2,6,23,0.45)";
    roundRect(x - 22, top - 10, 44, h + 20, 14, true, false);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + h); ctx.stroke();
    const marks = [0, 250, 500, 900, 1500];
    ctx.font = "bold 10px system-ui";
    ctx.fillStyle = "#bfdbfe";
    ctx.textAlign = "center";
    marks.forEach(m => {
      const y = top + (m / MAX_DEPTH) * h;
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.stroke();
      ctx.fillText(String(m), x, y + 4);
    });
    const py = top + (clamp(yToDepth(dive.diver.y), 0, MAX_DEPTH) / MAX_DEPTH) * h;
    ctx.fillStyle = "#f97316";
    ctx.beginPath(); ctx.arc(x, py, 7, 0, Math.PI * 2); ctx.fill();
    const limitY = top + (dive.stats.depthLimit / MAX_DEPTH) * h;
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 15, limitY); ctx.lineTo(x + 15, limitY); ctx.stroke();
    ctx.restore();
  }

  function getZoneName(depth) {
    if (depth < 250) return "얕은 바다";
    if (depth < 500) return "중간 바다";
    if (depth < 900) return "어두운 바다";
    return "심해";
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    if (w < 0) return;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  // ===== 루프 =====
  function gameLoop(timestamp) {
    const t = timestamp / 1000;
    const dt = Math.min(0.033, Math.max(0, t - lastTime || 0));
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ===== 버튼 =====
  audioToggleBtn.addEventListener("click", () => setAudioEnabled(!audio.enabled));

  document.getElementById("newGameBtn").addEventListener("click", () => {
    applySave(defaultSave());
    saveGame();
    startDive();
  });
  document.getElementById("continueBtn").addEventListener("click", () => {
    loadGame();
    startDive();
  });
  document.getElementById("resetSaveBtn").addEventListener("click", resetSave);
  document.getElementById("goUpgradeBtn").addEventListener("click", () => { renderUpgradeScreen(); setState("upgrade"); });
  document.getElementById("nextDiveBtn").addEventListener("click", startDive);
  document.getElementById("toStartBtn").addEventListener("click", () => { updateStartStats(); setState("start"); });
  document.getElementById("upgradeBackResultBtn").addEventListener("click", () => { renderResultScreen(); setState("result"); });
  document.getElementById("upgradeStartDiveBtn").addEventListener("click", startDive);
  document.getElementById("resumeBtn").addEventListener("click", () => setState("diving"));
  document.getElementById("pauseReturnBtn").addEventListener("click", () => { setState("diving"); startAutoReturn(); });
  document.getElementById("pauseStartBtn").addEventListener("click", () => { updateStartStats(); setState("start"); });

  // Canvas roundRect가 없는 오래된 브라우저 대비
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === "number") r = { tl: r, tr: r, br: r, bl: r };
      this.moveTo(x + r.tl, y);
      this.lineTo(x + w - r.tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
      this.lineTo(x + w, y + h - r.br);
      this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
      this.lineTo(x + r.bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
      this.lineTo(x, y + r.tl);
      this.quadraticCurveTo(x, y, x + r.tl, y);
      return this;
    };
  }

  loadGame();
  updateStartStats();
  updateAudioButton();
  setState("start");
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
