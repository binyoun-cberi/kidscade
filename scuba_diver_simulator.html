<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>심해 다이버 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0b84bc;
    }
    .screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 15%, rgba(35, 171, 220, 0.34), rgba(2, 6, 23, 0.96) 54%, #020617 100%);
    }
    .screen.hidden { display: none; }
    .panel {
      width: min(960px, 96vw);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      border: 2px solid rgba(125, 211, 252, 0.45);
      border-radius: 24px;
      background: rgba(8, 22, 48, 0.93);
      box-shadow: 0 25px 80px rgba(0,0,0,0.55), inset 0 0 35px rgba(14,165,233,0.10);
      backdrop-filter: blur(8px);
    }
    h1, h2, h3 { margin: 0 0 12px; letter-spacing: -0.04em; }
    h1 {
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      color: #e0f2fe;
      text-shadow: 0 0 18px rgba(56,189,248,0.85);
    }
    h2 { font-size: clamp(24px, 4vw, 38px); color: #bae6fd; }
    p { margin: 8px 0; line-height: 1.55; color: #dbeafe; }
    .muted { color: #93c5fd; font-size: 14px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
    .button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      margin: 6px 6px 6px 0;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: white;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 0 #075985, 0 16px 30px rgba(0,0,0,0.25);
      transition: transform 0.08s, filter 0.15s;
    }
    .button:hover { filter: brightness(1.08); }
    .button:active { transform: translateY(5px); box-shadow: 0 3px 0 #075985, 0 10px 20px rgba(0,0,0,0.25); }
    .button.green { background: linear-gradient(180deg, #22c55e, #15803d); box-shadow: 0 8px 0 #14532d, 0 16px 30px rgba(0,0,0,0.25); }
    .button.yellow { background: linear-gradient(180deg, #facc15, #ca8a04); box-shadow: 0 8px 0 #854d0e, 0 16px 30px rgba(0,0,0,0.25); color: #172554; }
    .button.red { background: linear-gradient(180deg, #fb7185, #be123c); box-shadow: 0 8px 0 #881337, 0 16px 30px rgba(0,0,0,0.25); }
    .button.dark { background: linear-gradient(180deg, #64748b, #334155); box-shadow: 0 8px 0 #0f172a, 0 16px 30px rgba(0,0,0,0.25); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
    .card {
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(147,197,253,0.26);
      background: rgba(15, 46, 88, 0.70);
    }
    .card strong { color: #fef08a; }
    .statline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(148,163,184,0.16);
    }
    .item-list {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.28);
    }
    .item-list th, .item-list td {
      padding: 9px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }
    .item-list th { color: #bae6fd; background: rgba(14,165,233,0.18); }
    #toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      min-width: 220px;
      max-width: min(680px, 92vw);
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(2, 8, 23, 0.72);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: #fff;
      text-align: center;
      font-weight: 800;
      line-height: 1.35;
      text-shadow: 0 1px 0 rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
    #mobileControls {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      display: none;
    }
    body.playing #mobileControls { display: block; }
    .stick-area {
      position: absolute;
      left: 22px;
      bottom: 26px;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.24);
      pointer-events: auto;
      touch-action: none;
    }
    .stick-knob {
      position: absolute;
      left: 44px;
      top: 44px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(186, 230, 253, 0.86);
      box-shadow: 0 0 20px rgba(56,189,248,0.7);
    }
    .mobile-buttons {
      position: absolute;
      right: 20px;
      bottom: 24px;
      display: grid;
      grid-template-columns: 72px 72px;
      grid-template-rows: 72px 72px;
      gap: 12px;
      pointer-events: auto;
    }
    .m-btn {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,0.25);
      color: white;
      font-weight: 900;
      font-size: 14px;
      background: rgba(14,165,233,0.54);
      box-shadow: 0 8px 0 rgba(7,89,133,0.75);
      touch-action: none;
    }
    .m-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(7,89,133,0.75); }
    .m-btn.boost { background: rgba(250,204,21,0.60); color: #172554; }
    .m-btn.return { background: rgba(34,197,94,0.62); grid-column: 2; grid-row: 1 / span 2; height: 156px; }
    .audio-toggle {
      position: fixed;
      right: 16px;
      top: 14px;
      z-index: 35;
      border: 1px solid rgba(186,230,253,0.35);
      border-radius: 999px;
      padding: 9px 13px;
      background: rgba(2, 8, 23, 0.68);
      color: #e0f2fe;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
    }
    .audio-toggle.on {
      background: rgba(14, 165, 233, 0.78);
      color: #fff;
    }
    .keyboard-help {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 8px 14px;
      margin: 12px 0;
      color: #dbeafe;
      font-size: 14px;
    }
    .keyboard-help span { padding: 7px 9px; border-radius: 10px; background: rgba(255,255,255,0.07); }
    @media (hover: hover) and (pointer: fine) {
      #mobileControls { display: none !important; }
    }
    @media (max-width: 720px) {
      .panel { padding: 16px; border-radius: 18px; }
      .button { width: 100%; margin-right: 0; }
      .mobile-buttons { right: 14px; bottom: 18px; transform: scale(0.92); transform-origin: right bottom; }
      .stick-area { left: 14px; bottom: 18px; transform: scale(0.92); transform-origin: left bottom; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="toast"></div>
  <button id="audioToggleBtn" class="audio-toggle" type="button">🔇 소리 켜기</button>

  <div id="startScreen" class="screen">
    <div class="panel">
      <h1>심해 다이버 시뮬레이터</h1>
      <p><strong>작은 배에서 출발해 깊은 바다를 탐험하고, 산소가 떨어지기 전에 보물을 챙겨 돌아오세요.</strong></p>
      <p class="muted">조금 더 깊이 내려갈수록 위험하지만 더 귀한 물고기, 광석, 고대 유물이 기다립니다.</p>
      <div class="keyboard-help">
        <span>이동: 방향키 또는 WASD</span>
        <span>스페이스: 그물 던져 물고기 포획</span>
        <span>E: 채집 / 도감 등록</span>
        <span>Shift: 짧은 부스터</span>
        <span>R: 배로 귀환 요청</span>
        <span>ESC: 일시정지</span>
        <span>바위벽/동굴벽: 통과 불가, 입구로 진입</span>
      </div>
      <div id="startStats" class="grid"></div>
      <button id="newGameBtn" class="button green">새 게임 시작</button>
      <button id="continueBtn" class="button">이어하기</button>
      <button id="resetSaveBtn" class="button red">저장 초기화</button>
    </div>
  </div>

  <div id="resultScreen" class="screen hidden">
    <div class="panel">
      <h2 id="resultTitle">오늘의 정산</h2>
      <div id="resultContent"></div>
      <button id="goUpgradeBtn" class="button yellow">장비 업그레이드</button>
      <button id="nextDiveBtn" class="button green">다음 잠수 시작</button>
      <button id="toStartBtn" class="button dark">시작 화면으로</button>
    </div>
  </div>

  <div id="upgradeScreen" class="screen hidden">
    <div class="panel">
      <h2>장비 업그레이드</h2>
      <p id="upgradeMoney"></p>
      <div id="upgradeCards" class="grid"></div>
      <button id="upgradeBackResultBtn" class="button green">정산 화면으로 돌아가기</button>
      <button id="upgradeStartDiveBtn" class="button">바로 다음 잠수</button>
    </div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <div class="panel" style="max-width:520px;text-align:center;">
      <h2>일시정지</h2>
      <p>잠시 숨을 고르고 다시 탐험해요.</p>
      <button id="resumeBtn" class="button green">계속하기</button>
      <button id="pauseReturnBtn" class="button yellow">배로 귀환 요청</button>
      <button id="pauseStartBtn" class="button dark">시작 화면으로</button>
    </div>
  </div>

  <div id="mobileControls" aria-label="모바일 조작 버튼">
    <div id="stickArea" class="stick-area">
      <div id="stickKnob" class="stick-knob"></div>
    </div>
    <div class="mobile-buttons">
      <button id="actionBtn" class="m-btn">채집<br>그물</button>
      <button id="boostBtn" class="m-btn boost">부스터</button>
      <button id="returnBtn" class="m-btn return">귀환</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ===== 주요 수치 =====
  const DIVER_BASE = {
    maxSpeed: 3.2,
    accel: 0.16,
    friction: 0.90,
    boostSpeed: 5.2,
    boostCost: 4,
    oxygenMax: 100,
    oxygenDrain: 0.62,
    healthMax: 100,
    inventoryMax: 10,
    depthLimit: 250
  };

  const SAVE_KEY = "deep_diver_simulator_save_v1";
  const PPM = 4; // pixel per meter
  const MAX_DEPTH = 1500;
  const WORLD_HEIGHT = MAX_DEPTH * PPM;
  const WORLD_HALF_WIDTH = 920;
  const BOAT_X = 0;
  const SURFACE_Y = 0;
  const INTERACT_RANGE = 78;
  const ENEMY_HIT_COOLDOWN = 1.25;

  // 업그레이드는 한 번에 크게 강해지지 않도록 9단계의 작은 성장으로 구성했습니다.
  const SUIT_DEPTHS = [250, 320, 400, 500, 650, 800, 900, 1100, 1300, 1500];
  const OXYGEN_LEVELS = [100, 112, 124, 137, 151, 166, 182, 199, 217, 236];
  const BAG_LEVELS = [10, 12, 14, 16, 18, 20, 22, 24, 27, 30];
  const UPGRADE_MAX = 9;

  const UPGRADE_INFO = {
    oxygen: {
      name: "산소통",
      icon: "🫧",
      max: UPGRADE_MAX,
      costs: [520, 980, 1700, 2800, 4300, 6300, 8900, 12000, 15800],
      effect: level => `산소 최대치 ${OXYGEN_LEVELS[level]} / 조금 더 오래 잠수할 수 있어요.`
    },
    fins: {
      name: "오리발",
      icon: "🦶",
      max: UPGRADE_MAX,
      costs: [480, 920, 1600, 2600, 4000, 5900, 8400, 11400, 15000],
      effect: level => `이동속도 +${level * 4}% / 부스터 효율 +${level * 5}%.`
    },
    bag: {
      name: "가방",
      icon: "🎒",
      max: UPGRADE_MAX,
      costs: [460, 900, 1550, 2500, 3900, 5700, 8100, 11000, 14600],
      effect: level => `가방 용량 ${BAG_LEVELS[level]}칸.`
    },
    harpoon: {
      name: "포획 그물",
      icon: "🕸️",
      max: UPGRADE_MAX,
      costs: [600, 1100, 1900, 3100, 4800, 7000, 9800, 13200, 17200],
      effect: level => `그물 사거리 +${level * 14} / 그물 반경 +${level * 4} / 한 번에 더 많이 포획해요.`
    },
    suit: {
      name: "잠수복",
      icon: "🤿",
      max: UPGRADE_MAX,
      costs: [900, 1700, 3000, 5000, 7800, 11200, 15200, 20000, 26000],
      effect: level => `안전 수심 ${SUIT_DEPTHS[level]}m / 수압 피해가 줄어들어요.`
    }
  };

  // 실제 해양 생태계를 참고한 교육용 생물·자원 도감입니다.
  // 깊이에 따라 산호초 생물 → 중층 회유 생물 → 발광 심해 생물 순으로 등장합니다.
  const ITEM_DEFS = {
    smallFish: { name: "산호초 자리돔", group: "fish", price: 95, color: "#fde68a", minHarpoon: 0, size: 15, speed: 0.55, minDepth: 10, maxDepth: 240, fact: "산호초 주변에서 무리 지어 사는 작은 물고기를 본뜬 생물이에요." },
    clownFish: { name: "흰동가리", group: "fish", price: 130, color: "#fb923c", minHarpoon: 0, size: 16, speed: 0.48, minDepth: 8, maxDepth: 170, fact: "말미잘 주변에서 숨어 지내는 산호초 물고기로 유명해요." },
    blueFish: { name: "블루탱", group: "fish", price: 165, color: "#60a5fa", minHarpoon: 0, size: 18, speed: 0.64, minDepth: 25, maxDepth: 320, fact: "따뜻한 산호초에서 볼 수 있는 파란빛 물고기를 참고했어요." },
    seahorse: { name: "해마", group: "fish", price: 210, color: "#f9a8d4", minHarpoon: 1, size: 14, speed: 0.28, minDepth: 20, maxDepth: 260, rare: true, fact: "해초와 산호 사이에 몸을 숨기는 작은 해양 생물이에요." },
    fastFish: { name: "전갱이 무리", group: "fish", price: 230, color: "#22d3ee", minHarpoon: 1, size: 17, speed: 1.0, minDepth: 180, maxDepth: 540, fact: "빠르게 헤엄치는 회유성 물고기 무리를 참고했어요." },
    squid: { name: "오징어", group: "fish", price: 310, color: "#e9d5ff", minHarpoon: 1, size: 20, speed: 0.78, minDepth: 170, maxDepth: 650, fact: "제트 추진처럼 물을 뿜어 빠르게 움직이는 두족류예요." },
    rareFish: { name: "등불물고기", group: "fish", price: 460, color: "#c084fc", minHarpoon: 2, size: 20, speed: 0.72, minDepth: 420, maxDepth: 940, rare: true, fact: "깊은 바다의 희미한 빛 환경에 사는 발광 물고기를 참고했어요." },
    anglerFish: { name: "초롱아귀", group: "fish", price: 720, color: "#a78bfa", minHarpoon: 3, size: 24, speed: 0.48, minDepth: 760, maxDepth: 1350, rare: true, fact: "머리의 빛나는 미끼로 먹이를 유인하는 심해어로 알려져 있어요." },
    deepFish: { name: "바이퍼피시", group: "fish", price: 860, color: "#67e8f9", minHarpoon: 4, size: 25, speed: 0.60, minDepth: 900, maxDepth: 1500, rare: true, fact: "큰 이빨과 발광 기관을 가진 심해 포식자를 참고했어요." },
    shell: { name: "조개", group: "resource", price: 115, color: "#f9a8d4", minDepth: 10, maxDepth: 270, fact: "모래와 바위 주변에서 발견되는 연체동물 껍데기예요." },
    kelp: { name: "다시마 표본", group: "resource", price: 135, color: "#22c55e", minDepth: 5, maxDepth: 160, fact: "얕은 바다 숲을 만드는 해조류를 참고했어요." },
    coral: { name: "산호 표본", group: "resource", price: 190, color: "#fb7185", minDepth: 20, maxDepth: 340, fact: "산호초는 많은 물고기와 무척추동물의 집 역할을 해요." },
    crab: { name: "소라게", group: "resource", price: 240, color: "#f97316", minDepth: 30, maxDepth: 360, fact: "빈 껍데기를 집처럼 사용하는 갑각류를 참고했어요." },
    ore: { name: "망간단괴", group: "resource", price: 390, color: "#94a3b8", minDepth: 260, maxDepth: 820, fact: "깊은 바다 바닥에서 발견되는 금속 성분 덩어리를 참고했어요." },
    sponge: { name: "심해 해면", group: "resource", price: 520, color: "#fef3c7", minDepth: 450, maxDepth: 980, rare: true, fact: "바닷물을 걸러 먹이를 얻는 단순한 동물인 해면을 참고했어요." },
    rareOre: { name: "열수광물", group: "resource", price: 760, color: "#a7f3d0", minDepth: 820, maxDepth: 1500, rare: true, fact: "해저 열수 분출공 주변의 광물 퇴적물을 참고했어요." },
    caveShrimp: { name: "동굴 새우", group: "fish", price: 360, color: "#fecdd3", minHarpoon: 1, size: 13, speed: 0.32, minDepth: 300, maxDepth: 900, caveOnly: true, fact: "빛이 약한 수중 동굴에 적응한 작은 갑각류를 참고했어요." },
    blindGoby: { name: "눈먼 동굴망둑", group: "fish", price: 420, color: "#e5e7eb", minHarpoon: 2, size: 16, speed: 0.25, minDepth: 340, maxDepth: 850, caveOnly: true, rare: true, fact: "어두운 동굴 환경에 맞춰 눈이 작아진 물고기를 상상해 만든 생물이에요." },
    cavePearl: { name: "동굴 진주", group: "treasure", price: 1250, color: "#fafafa", minDepth: 360, maxDepth: 900, caveOnly: true, rare: true, fact: "석회질 동굴 속 희귀한 진주라는 상상 보물이에요." },
    rustyAnchor: { name: "녹슨 닻", group: "resource", price: 640, color: "#78716c", minDepth: 470, maxDepth: 950, caveOnly: true, fact: "침몰선 주변에서 발견되는 오래된 금속 장비예요." },
    shipLamp: { name: "선실 램프", group: "treasure", price: 1120, color: "#fbbf24", minDepth: 480, maxDepth: 1000, caveOnly: true, rare: true, fact: "난파선 선실에 남아 있던 항해 도구를 참고했어요." },

  function initAudio() {
    if (audio.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) {
      showToast("이 브라우저는 Web Audio를 지원하지 않아요.");
      return;
    }
    audio.ctx = new AudioCtx();
    audio.master = audio.ctx.createGain();
    audio.musicGain = audio.ctx.createGain();
    audio.sfxGain = audio.ctx.createGain();
    audio.master.gain.value = 0.72;
    audio.musicGain.gain.value = 0.18;
    audio.sfxGain.gain.value = 0.55;
    audio.musicGain.connect(audio.master);
    audio.sfxGain.connect(audio.master);
    audio.master.connect(audio.ctx.destination);
  }

  function setAudioEnabled(on) {
    initAudio();
    if (!audio.ctx) return;
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    audio.enabled = on;
    if (on) startBgm(); else stopBgm();
    updateAudioButton();
  }

  function updateAudioButton() {

  function playTone(freq, duration = 0.12, type = "sine", gain = 0.12, dest = null, when = 0, slideTo = null) {
    if (!audio.enabled || !audio.ctx) return;
    const t = Math.max(audio.ctx.currentTime, audio.ctx.currentTime + when);
    const osc = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + duration);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(g);
    g.connect(dest || audio.sfxGain);
    osc.start(t);
    osc.stop(t + duration + 0.03);
  }

  function playNoise(duration = 0.18, gain = 0.1, filterFreq = 900) {
    if (!audio.enabled || !audio.ctx) return;
    const len = Math.max(1, Math.floor(audio.ctx.sampleRate * duration));
    const buffer = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
    const src = audio.ctx.createBufferSource();
    const filter = audio.ctx.createBiquadFilter();
    const g = audio.ctx.createGain();
    filter.type = "lowpass";
    filter.frequency.value = filterFreq;
    g.gain.value = gain;
    src.buffer = buffer;
    src.connect(filter);
    filter.connect(g);
    g.connect(audio.sfxGain);
    src.start();
  }

  function playSfx(name) {
    if (!audio.enabled || !audio.ctx) return;
    if (name === "dive") { playTone(392, 0.12, "sine", 0.09); playTone(261, 0.26, "sine", 0.08, null, 0.06, 174); playNoise(0.35, 0.05, 600); }
    if (name === "collect") { playTone(660, 0.08, "triangle", 0.09); playTone(880, 0.12, "triangle", 0.08, null, 0.08); }
    if (name === "rare") { playTone(784, 0.12, "sine", 0.09); playTone(1175, 0.18, "sine", 0.08, null, 0.10); playTone(1568, 0.22, "sine", 0.05, null, 0.22); }

    if (name === "damage") { playTone(110, 0.18, "square", 0.12, null, 0, 80); playNoise(0.12, 0.09, 500); }
    if (name === "bump") { playTone(96, 0.08, "triangle", 0.07); playTone(64, 0.12, "sine", 0.05, null, 0.04); }

    if (name === "rescue") { playTone(330, 0.18, "triangle", 0.08); playTone(247, 0.30, "triangle", 0.08, null, 0.16); }
  }

  function startBgm() {
    if (!audio.ctx || audio.musicTimer) return;
    audio.nextNoteTime = audio.ctx.currentTime;
    audio.musicTimer = setInterval(scheduleBgm, 160);
    scheduleBgm();
  }

  function stopBgm() {
    if (audio.musicTimer) clearInterval(audio.musicTimer);
    audio.musicTimer = null;
  }

  function scheduleBgm() {
    if (!audio.enabled || !audio.ctx) return;
    const now = audio.ctx.currentTime;
    while (audio.nextNoteTime < now + 0.7) {
      const depth = dive ? yToDepth(dive.diver.y) : 0;
      const depthShift = depth > 900 ? 0.5 : depth > 500 ? 0.75 : 1;
      const freq = MUSIC_NOTES[audio.noteIndex % MUSIC_NOTES.length] * depthShift;
      const duration = depth > 900 ? 0.62 : 0.42;
      const gain = game.state === "diving" ? (depth > 900 ? 0.055 : 0.075) : 0.035;
      playTone(freq, duration, depth > 900 ? "sine" : "triangle", gain, audio.musicGain, audio.nextNoteTime - now);
      if (audio.noteIndex % 4 === 0) playTone(freq / 2, duration * 1.7, "sine", gain * 0.55, audio.musicGain, audio.nextNoteTime - now);
      audio.noteIndex++;
      audio.nextNoteTime += depth > 900 ? 0.56 : 0.44;
    }
  }

    canvas.height = Math.floor(ch * dpr);

    const base = defaultSave();
    if (!raw || typeof raw !== "object") return base;
    const upgrades = { ...base.upgrades, ...(raw.upgrades || {}) };

    });
    return {
      day: Number(raw.day) || base.day,
      money: Number(raw.money) || 0,
      totalMoney: Number(raw.totalMoney) || 0,
      bestDepth: Number(raw.bestDepth) || 0,

  }

  function ellipseValue(x, y, cx, cy, rx, ry) {
    const dx = (x - cx) / rx;
    const dy = (y - cy) / ry;
    return dx * dx + dy * dy;
  }

  function pointInCaveInterior(x, y, cave) {
    if (!cave) return false;
    return ellipseValue(x, y, cave.x, cave.y, cave.w * 0.47, cave.h * 0.43) <= 1;
  }

  function pointInCaveEntrance(x, y, cave, pad = 0) {
    if (!cave) return false;
    const dir = cave.entrance === "left" ? -1 : 1;
    const mouthStart = cave.x + dir * cave.w * 0.35;
    const mouthEnd = cave.x + dir * cave.w * 0.68;
    const inX = dir > 0 ? (x >= mouthStart - pad && x <= mouthEnd + pad) : (x <= mouthStart + pad && x >= mouthEnd - pad);
    const inY = Math.abs(y - cave.y) <= cave.h * 0.16 + pad;
    return inX && inY;
  }

  function pointInCave(x, y, cave) {
    return pointInCaveInterior(x, y, cave) || pointInCaveEntrance(x, y, cave, 6);
  }

  function findCurrentCave() {
    if (!dive || !dive.caves) return null;
    return dive.caves.find(cave => pointInCave(dive.diver.x, dive.diver.y, cave)) || null;
  }

  function inAirPocket(cave, x, y) {
    if (!cave || !cave.airPocket) return false;
    const dx = Math.abs(x - cave.x);
    return dx < cave.w * 0.24 && y < cave.y - cave.h * 0.23 && y > cave.y - cave.h * 0.48;
  }

  function isSolidAt(x, y, radius = 16) {
    if (!dive) return false;
    if (dive.terrain) {
      for (const t of dive.terrain) {
        if (terrainCollisionInfo({ x, y, vx: 0, vy: 0 }, radius, t)) return true;
      }
    }
    if (dive.caves) {
      for (const cave of dive.caves) {
        if (caveWallCollisionInfo({ x, y, vx: 0, vy: 0 }, radius, cave)) return true;
      }
    }
    return false;
  }

  function findOpenSpawnPosition(x, y, radius = 18, cave = null) {
    if (!dive) return { x, y };
    if (cave) {
      for (let i = 0; i < 22; i++) {
        const px = rand(cave.x - cave.w * 0.34, cave.x + cave.w * 0.34);
        const py = rand(cave.y - cave.h * 0.28, cave.y + cave.h * 0.30);
        if (pointInCaveInterior(px, py, cave) && !isSolidAt(px, py, radius)) return { x: px, y: py };
      }
      return { x, y };
    }
    const depth = yToDepth(y);
    for (let i = 0; i < 28; i++) {
      const px = i === 0 ? x : rand(-WORLD_HALF_WIDTH + 80, WORLD_HALF_WIDTH - 80);
      const py = i === 0 ? y : depthToY(clamp(depth + rand(-35, 35), 10, MAX_DEPTH - 10));
      if (!isSolidAt(px, py, radius)) return { x: px, y: py };
    }
    return { x, y };
  }

  function terrainCollisionInfo(entity, radius, t) {
    if (t.type === "shelf") {
      const left = t.x - t.w / 2;
      const right = t.x + t.w / 2;
      const top = t.y - 8;
      const bottom = t.y + t.h;
      const nx = clamp(entity.x, left, right);
      const ny = clamp(entity.y, top, bottom);
      let dx = entity.x - nx;
      let dy = entity.y - ny;
      let dist = Math.hypot(dx, dy);
      if (dist < radius) {
        if (dist < 0.001) {
          const toLeft = Math.abs(entity.x - left);
          const toRight = Math.abs(right - entity.x);
          const toTop = Math.abs(entity.y - top);
          const toBottom = Math.abs(bottom - entity.y);
          const min = Math.min(toLeft, toRight, toTop, toBottom);
          if (min === toLeft) { dx = -1; dy = 0; dist = 1; }
          else if (min === toRight) { dx = 1; dy = 0; dist = 1; }
          else if (min === toTop) { dx = 0; dy = -1; dist = 1; }
          else { dx = 0; dy = 1; dist = 1; }
        }
        return { nx: dx / dist, ny: dy / dist, overlap: radius - dist, type: "terrain" };
      }
      return null;
    }

    const rx = t.w * 0.5 + radius;
    const ry = t.h * 0.5 + radius;
    const dx = entity.x - t.x;
    const dy = entity.y - t.y;
    const q = Math.sqrt((dx / rx) ** 2 + (dy / ry) ** 2);
    if (q < 1) {
      const safeQ = Math.max(q, 0.001);
      const targetX = t.x + dx / safeQ;
      const targetY = t.y + dy / safeQ;
      const px = targetX - entity.x;
      const py = targetY - entity.y;
      const len = Math.hypot(px, py) || 1;
      return { nx: px / len, ny: py / len, overlap: len, type: "terrain" };
    }
    return null;
  }

  function caveWallCollisionInfo(entity, radius, cave) {
    if (pointInCaveEntrance(entity.x, entity.y, cave, radius * 0.7)) return null;
    const outerRx = cave.w * 0.61 + radius;
    const outerRy = cave.h * 0.58 + radius;
    const innerRx = Math.max(20, cave.w * 0.47 - radius * 0.35);
    const innerRy = Math.max(20, cave.h * 0.43 - radius * 0.35);
    const dx = entity.x - cave.x;
    const dy = entity.y - cave.y;
    const qOuter = Math.sqrt((dx / outerRx) ** 2 + (dy / outerRy) ** 2);
    const qInner = Math.sqrt((dx / innerRx) ** 2 + (dy / innerRy) ** 2);
    if (qOuter <= 1 && qInner >= 1) {
      const innerGap = qInner - 1;
      const outerGap = 1 - qOuter;
      const pushToInner = innerGap <= outerGap;
      const q = Math.max(pushToInner ? qInner : qOuter, 0.001);
      const scale = pushToInner ? 0.985 / q : 1.02 / q;
      const targetX = cave.x + dx * scale;
      const targetY = cave.y + dy * scale;
      const px = targetX - entity.x;
      const py = targetY - entity.y;
      const len = Math.hypot(px, py) || 1;
      return { nx: px / len, ny: py / len, overlap: len, type: "cave" };
    }
    return null;
  }

  function resolveSolidCollisions(entity, radius = 18, showHint = false) {
    if (!dive) return false;
    let collided = false;
    for (let pass = 0; pass < 3; pass++) {
      let hit = null;
      if (dive.terrain) {
        for (const t of dive.terrain) {
          hit = terrainCollisionInfo(entity, radius, t);
          if (hit) break;
        }
      }
      if (!hit && dive.caves) {
        for (const cave of dive.caves) {
          hit = caveWallCollisionInfo(entity, radius, cave);
          if (hit) break;
        }
      }
      if (!hit) break;
      collided = true;
      entity.x += hit.nx * (hit.overlap + 0.6);
      entity.y += hit.ny * (hit.overlap + 0.6);
      const dot = (entity.vx || 0) * hit.nx + (entity.vy || 0) * hit.ny;
      if (dot < 0) {
        entity.vx -= dot * hit.nx * 1.35;
        entity.vy -= dot * hit.ny * 1.35;
      }
      entity.vx *= 0.62;
      entity.vy *= 0.62;
    }
    if (collided && showHint && dive.solidHintTimer <= 0) {
      showToast("바위벽과 지형은 통과할 수 없어요. 입구를 찾아 돌아가세요!", 1.8);
      dive.solidHintTimer = 4;
      playSfx("bump");
    }
    return collided;
  }

  function spawnCaveLife(spawnItem, spawnEnemy) {
    if (!dive || !dive.caves) return;
    for (const cave of dive.caves) {
      const itemCount = cave.type === "volcano" ? 13 : 11;
      for (let i = 0; i < itemCount; i++) {
        const key = cave.itemKeys[randInt(0, cave.itemKeys.length - 1)];
        const x = rand(cave.x - cave.w * 0.36, cave.x + cave.w * 0.36);
        const y = rand(cave.y - cave.h * 0.30, cave.y + cave.h * 0.34);
        spawnItem(key, x, yToDepth(y));
      }
      const enemyCount = cave.type === "volcano" ? 3 : 2;
      for (let i = 0; i < enemyCount; i++) {
        const key = cave.enemyKeys[randInt(0, cave.enemyKeys.length - 1)];
        spawnEnemy(key, 1, cave);
      }
    }
  }

  function cryptoRandomId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);

  function startAutoReturn() {
    if (!dive || game.state !== "diving") return;
    dive.autoReturn = true;

  function rescueDive(reason) {
    if (!dive || game.state !== "diving") return;
    dive.rescued = true;
    dive.rescueReason = reason;
    const loseCount = Math.floor(dive.inventory.length / 2);
    dive.lostItems = [];
    for (let i = 0; i < loseCount; i++) {
      const index = randInt(0, dive.inventory.length - 1);
      dive.lostItems.push(dive.inventory.splice(index, 1)[0]);
    }
    dive.diver.x = BOAT_X;
    dive.diver.y = 32;
    playSfx("rescue");
    finishDive();
  }

  function finishDive() {
    if (!dive) return;
    const inv = [...dive.inventory];
    const counts = {};
    let income = 0;
    inv.forEach(key => {
      counts[key] = (counts[key] || 0) + 1;
      income += ITEM_DEFS[key].price;
    });

    const mission = game.currentMission;
    const missionComplete = isMissionComplete(true);
    const missionBonus = missionComplete ? mission.bonus : 0;
    const totalGain = income + dive.codexBonus + missionBonus;

    game.money += totalGain;
    game.totalMoney += totalGain;
    game.bestDepth = Math.max(game.bestDepth, dive.maxDepth);

    playSfx("cash");

    game.lastResult = {
      day: game.day,
      maxDepth: dive.maxDepth,
      inventory: inv,
      counts,
      income,
      codexBonus: dive.codexBonus,
      newCodex: [...dive.newCodex],
      mission: structuredClone(mission),
      missionComplete,
      missionBonus,
      totalGain,
      moneyAfter: game.money,
      rescued: dive.rescued,
      rescueReason: dive.rescueReason,
      lostItems: [...dive.lostItems],
      oxygenLeft: dive.diver.oxygen,
      oxygenMax: dive.stats.oxygenMax
    };

    game.day += 1;
    saveGame();
    renderResultScreen();
    setState("result");
  }

  function isMissionComplete(finalCheck = false) {
    if (!dive || !game.currentMission) return false;
    const m = game.currentMission;
    if (m.type === "collect") return (dive.collectedCounts[m.key] || 0) >= m.count;
    if (m.type === "depth") return dive.maxDepth >= m.depth;
    if (m.type === "treasure") return dive.treasureFound >= m.count;
    if (m.type === "oxygenReturn") return finalCheck && !dive.rescued && percent(dive.diver.oxygen, dive.stats.oxygenMax) >= m.oxygenPct;
    return false;
  }

  function missionProgressText() {
    if (!dive || !game.currentMission) return "";
    const m = game.currentMission;
    if (m.type === "collect") return `${m.text} (${Math.min(dive.collectedCounts[m.key] || 0, m.count)}/${m.count})`;
    if (m.type === "depth") return `${m.text} (${Math.min(Math.floor(dive.maxDepth), m.depth)}/${m.depth}m)`;
    if (m.type === "treasure") return `${m.text} (${Math.min(dive.treasureFound, m.count)}/${m.count})`;
    if (m.type === "oxygenReturn") return `${m.text} (귀환할 때 확인)`;
    return m.text;
  }

        <p>${info.effect(level)}</p>
        <p class="muted">다음 효과: ${nextEffect}</p>
        <p><strong>${maxed ? "구매 완료" : "비용: " + won(cost)}</strong></p>
      `;
      const btn = document.createElement("button");
      btn.className = "button " + (maxed ? "dark" : "green");
      btn.textContent = maxed ? "최고 레벨" : "업그레이드";
      btn.disabled = maxed;
      btn.style.opacity = maxed ? "0.55" : "1";
      btn.addEventListener("click", () => buyUpgrade(key));
      card.appendChild(btn);
      upgradeCards.appendChild(card);
    });
  }

  function buyUpgrade(key) {
    const info = UPGRADE_INFO[key];
    const level = game.upgrades[key] || 0;
    if (level >= info.max) {
      showToast("이미 최고 레벨이에요.");
      return;
    }
    const cost = info.costs[level];
    if (game.money < cost) {
      showToast("돈이 부족해요!");
      return;
    }
    game.money -= cost;
    game.upgrades[key] = level + 1;
    saveGame();
    renderUpgradeScreen();
    playSfx("upgrade");
    showToast(`${info.name} 업그레이드 완료!`, 1.7);
  }

  // ===== 입력 =====
  window.addEventListener("keydown", e => {
    const block = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space", "Shift", "ShiftLeft", "ShiftRight"].includes(e.key) || [" ", "w", "a", "s", "d", "W", "A", "S", "D"].includes(e.key);
    if (block) e.preventDefault();
    keys[e.key.toLowerCase()] = true;

    if (e.key === "Escape") {
      e.preventDefault();
      togglePause();
      return;
    }
    if (game.state !== "diving" || e.repeat) return;
    if (e.key === " " || e.code === "Space") captureFish();
    if (e.key.toLowerCase() === "e") interact();
    if (e.key === "Shift") boost();
    if (e.key.toLowerCase() === "r") startAutoReturn();
  }, { passive: false });

  window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
  });

  function togglePause() {
    if (game.state === "diving") {
      game.previousState = "diving";
      setState("pause");
    } else if (game.state === "pause") {
      setState("diving");
    }
  }

  function mobileAction() {
    if (game.state !== "diving") return;
    const target = findNearestInteractable();
    if (target && distance(dive.diver, target) < INTERACT_RANGE) interact();
    else captureFish();
  }

  function bindMobileButton(id, fn) {
    const el = document.getElementById(id);
    const handler = e => { e.preventDefault(); fn(); };
    el.addEventListener("touchstart", handler, { passive: false });
    el.addEventListener("pointerdown", handler);
  }
  bindMobileButton("actionBtn", mobileAction);
  bindMobileButton("boostBtn", boost);
  bindMobileButton("returnBtn", startAutoReturn);

  let stickPointerId = null;
  stickArea.addEventListener("pointerdown", e => {
    stickPointerId = e.pointerId;
    stickArea.setPointerCapture(e.pointerId);
    touchMove.active = true;
    updateStick(e);
  });
  stickArea.addEventListener("pointermove", e => {
    if (e.pointerId === stickPointerId) updateStick(e);
  });
  stickArea.addEventListener("pointerup", endStick);
  stickArea.addEventListener("pointercancel", endStick);

  function updateStick(e) {
    const rect = stickArea.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const max = rect.width * 0.35;
    const len = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, len / max);
    touchMove.x = (dx / len) * k;
    touchMove.y = (dy / len) * k;
    stickKnob.style.left = `${44 + touchMove.x * 42}px`;
    stickKnob.style.top = `${44 + touchMove.y * 42}px`;
  }

  function endStick(e) {
    if (stickPointerId !== null && e.pointerId !== stickPointerId) return;
    resetTouchStick();
  }

  function resetTouchStick() {
    stickPointerId = null;
    touchMove.x = 0;
    touchMove.y = 0;
    touchMove.active = false;
    if (stickKnob) {
      stickKnob.style.left = "44px";
      stickKnob.style.top = "44px";
    }
  }

  // ===== 상호작용 =====
  function findNearestInteractable() {
    if (!dive) return null;
    let best = null;
    let bestD = Infinity;
    const all = [...dive.objects.filter(o => !o.taken), ...dive.enemies];
    for (const obj of all) {
      const d = Math.hypot(obj.x - dive.diver.x, obj.y - dive.diver.y);
      if (d < bestD) {
        bestD = d;
        best = obj;
      }
    }
    return best;
  }

  function interact() {
    if (!dive || game.state !== "diving") return;
    const target = findNearestInteractable();
    if (!target || distance(dive.diver, target) > INTERACT_RANGE) {
      showToast("가까이 다가가서 E키를 눌러보세요.", 1.6);
      return;
    }

    if (target.key && ENEMY_DEFS[target.key]) {
      registerCodex("enemy:" + target.key);
      return;
    }

    const def = ITEM_DEFS[target.key];
    if (!def) return;
    registerCodex("item:" + target.key);

    if (def.group === "fish") {
      showToast(`${def.name} 도감 확인! 물고기는 스페이스로 그물을 던져 잡아요.`, 1.5);
      return;
    }

    if (def.group === "treasure" && def.openNeed) {
      target.openProgress += 1;
      if (target.openProgress < def.openNeed) {
        showToast(`보물상자 여는 중... (${target.openProgress}/${def.openNeed})`, 1.2);
        return;
      }
    }

    collectObject(target);
  }

  function captureFish() {
    if (!dive || game.state !== "diving") return;
    const diver = dive.diver;
    const range = dive.stats.netRange || dive.stats.harpoonRange;
    const radius = dive.stats.netRadius || 42;
    const fx = Math.cos(diver.angle);
    const fy = Math.sin(diver.angle);
    const targetX = clamp(diver.x + fx * range, -WORLD_HALF_WIDTH + 45, WORLD_HALF_WIDTH - 45);
    const targetY = clamp(diver.y + fy * range, 20, WORLD_HEIGHT - 20);
    const catchLimit = dive.stats.netCatchLimit || 1;

    dive.harpoonFlash = 0.25;
    dive.nets.push({
      x: diver.x + fx * 20,
      y: diver.y + fy * 20,
      targetX,
      targetY,
      r: 8,
      maxR: radius,
      life: 0.42,
      maxLife: 0.42
    });
    playSfx("harpoon");

    const candidates = [];
    for (const obj of dive.objects) {
      if (obj.taken) continue;
      const def = ITEM_DEFS[obj.key];
      if (!def || def.group !== "fish") continue;
      const dist = Math.hypot(obj.x - targetX, obj.y - targetY);
      if (dist <= radius + def.size) candidates.push({ obj, def, dist });
    }
    candidates.sort((a, b) => a.dist - b.dist);

    if (dive.inventory.length >= dive.stats.inventoryMax) {
      showToast("가방이 가득 찼어요! 배로 돌아가세요!", 1.8);
      return;
    }

    let caught = 0;
    let blockedName = "";
    for (const c of candidates) {
      if (caught >= catchLimit) break;
      if (dive.inventory.length >= dive.stats.inventoryMax) break;
      if (dive.stats.harpoonLevel < c.def.minHarpoon) {
        blockedName = c.def.name;
        continue;
      }
      registerCodex("item:" + c.obj.key);
      collectObject(c.obj, true);
      caught++;
    }

    if (caught > 0) {
      addBubbles(targetX, targetY, 10 + caught * 4, "#dbeafe");
      showToast(`그물을 던져 ${caught}마리 포획!`, 1.55);
    } else if (blockedName) {
      showToast(`${blockedName}은 더 튼튼한 그물이 필요해요!`, 1.8);
    } else {
      showToast("물고기가 모여 있는 곳에 그물을 던져보세요.", 1.4);
    }
  }

  function collectObject(obj, quiet = false) {
    const def = ITEM_DEFS[obj.key];
    if (!def || obj.taken) return;
    if (dive.inventory.length >= dive.stats.inventoryMax) {
      showToast("가방이 가득 찼어요! 배로 돌아가세요!", 2);
      return;
    }
    obj.taken = true;
    dive.inventory.push(obj.key);
    dive.collectedCounts[obj.key] = (dive.collectedCounts[obj.key] || 0) + 1;
    if (def.group === "treasure") dive.treasureFound += 1;
    addBubbles(obj.x, obj.y, 12, def.rare ? "#f0abfc" : "#e0f2fe");
    playSfx(def.rare ? "rare" : "collect");
    if (!quiet) showToast(`${def.name} 획득! +${won(def.price)}`, 1.45);
  }

  function getCodexFact(code) {
    if (code.startsWith("item:")) {
      const def = ITEM_DEFS[code.slice(5)];
      return def && def.fact ? def.fact : "새로운 해양 생물을 발견했어요.";
    }
    if (code.startsWith("enemy:")) {
      const def = ENEMY_DEFS[code.slice(6)];
      return def && def.fact ? def.fact : "위험 생물은 관찰하고 거리를 두는 것이 좋아요.";
    }
    return "새로운 발견이에요.";
  }

  function registerCodex(code) {
    if (game.codex[code]) return false;
    game.codex[code] = true;
    let name = "새 발견";
    let bonus = 80;
    if (code.startsWith("item:")) {
      const key = code.slice(5);
      const def = ITEM_DEFS[key];
      name = def.name;
      bonus = Math.max(70, Math.round(def.price * 0.24));
    } else if (code.startsWith("enemy:")) {
      const key = code.slice(6);
      const def = ENEMY_DEFS[key];
      name = def.name;
      bonus = Math.round(90 + def.damage * 8 + def.size * 1.2);
    }
    const fact = getCodexFact(code);
    dive.codexBonus += bonus;
    dive.newCodex.push({ name, fact, bonus });
    playSfx("rare");
    showToast(`${name} 도감 등록! ${fact} 연구 보너스 +${won(bonus)}`, 3.0);
    saveGame();
    return true;
  }

  function boost() {
    if (!dive || game.state !== "diving") return;
    if (dive.boostCooldown > 0) return;
    if (dive.diver.oxygen <= dive.stats.boostCost + 1) {
      showToast("산소가 부족해서 부스터를 못 써요!", 1.4);
      return;
    }
    const diver = dive.diver;
    let mx = 0;
    let my = 0;
    if (keys["arrowleft"] || keys["a"]) mx -= 1;
    if (keys["arrowright"] || keys["d"]) mx += 1;
    if (keys["arrowup"] || keys["w"]) my -= 1;
    if (keys["arrowdown"] || keys["s"]) my += 1;
    mx += touchMove.x;
    my += touchMove.y;
    let len = Math.hypot(mx, my);
    if (len < 0.1) {
      mx = Math.cos(diver.angle);
      my = Math.sin(diver.angle);
      len = 1;
    }
    mx /= len;
    my /= len;
    diver.vx += mx * dive.stats.boostSpeed;
    diver.vy += my * dive.stats.boostSpeed;
    diver.oxygen = Math.max(0, diver.oxygen - dive.stats.boostCost);
    dive.boostCooldown = 0.7;
    addBubbles(diver.x - mx * 16, diver.y - my * 16, 18, "#bae6fd");
    playSfx("boost");
  }

  // ===== 업데이트 =====
  function update(dt) {
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) toast.classList.remove("show");
    }

    if (game.state !== "diving" || !dive) return;

    dive.time += dt;
    dive.boostCooldown = Math.max(0, dive.boostCooldown - dt);
    dive.harpoonFlash = Math.max(0, dive.harpoonFlash - dt);
    dive.damageFlash = Math.max(0, dive.damageFlash - dt * 1.8);
    dive.oxygenFlash = Math.max(0, dive.oxygenFlash - dt * 2.6);
    dive.pressureWarnTimer = Math.max(0, dive.pressureWarnTimer - dt);
    dive.lowOxygenWarnTimer = Math.max(0, dive.lowOxygenWarnTimer - dt);
    dive.caveHintTimer = Math.max(0, dive.caveHintTimer - dt);
    dive.airPocketTimer = Math.max(0, dive.airPocketTimer - dt);
    dive.solidHintTimer = Math.max(0, dive.solidHintTimer - dt);

    updateDiver(dt);
    if (game.state !== "diving" || !dive) return;
    updateObjects(dt);
    updateNets(dt);
    updateEnemies(dt);
    if (game.state !== "diving" || !dive) return;
    updateCaveStatus(dt);
    updateBubbles(dt);
    updateCamera(dt);
    updateSurvival(dt);
  }

  function updateDiver(dt) {
    const diver = dive.diver;
    const s = dive.stats;
    let mx = 0;
    let my = 0;

    if (dive.autoReturn) {
      const tx = BOAT_X;
      const ty = 18;
      mx = tx - diver.x;
      my = ty - diver.y;
      const len = Math.hypot(mx, my) || 1;
      mx /= len;
      my /= len;
      if (len < 34 && diver.y < 60) {
        finishDive();
        return;
      }
    } else {
      if (keys["arrowleft"] || keys["a"]) mx -= 1;
      if (keys["arrowright"] || keys["d"]) mx += 1;
      if (keys["arrowup"] || keys["w"]) my -= 1;
      if (keys["arrowdown"] || keys["s"]) my += 1;
      mx += touchMove.x;
      my += touchMove.y;
      const len = Math.hypot(mx, my);
      if (len > 1) { mx /= len; my /= len; }
    }

    if (Math.hypot(mx, my) > 0.08) {
      diver.angle = Math.atan2(my, mx);
      diver.vx += mx * s.accel * 60 * dt;
      diver.vy += my * s.accel * 60 * dt;
    }

    const speed = Math.hypot(diver.vx, diver.vy);
    const maxSpeed = dive.autoReturn ? s.maxSpeed * 1.25 : s.maxSpeed;
    if (speed > maxSpeed) {
      diver.vx = (diver.vx / speed) * maxSpeed;
      diver.vy = (diver.vy / speed) * maxSpeed;
    }

    diver.x += diver.vx * 60 * dt;
    diver.y += diver.vy * 60 * dt;
    resolveSolidCollisions(diver, 18, true);
    diver.vx *= Math.pow(s.friction, 60 * dt);
    diver.vy *= Math.pow(s.friction, 60 * dt);

    diver.x = clamp(diver.x, -WORLD_HALF_WIDTH + 35, WORLD_HALF_WIDTH - 35);
    diver.y = clamp(diver.y, 20, WORLD_HEIGHT - 20);

    const d = yToDepth(diver.y);
    dive.maxDepth = Math.max(dive.maxDepth, d);

    if (!dive.autoReturn && diver.y < 46 && Math.abs(diver.x - BOAT_X) < 84 && dive.inventory.length > 0) {
      showToast("배에 도착했어요! R키를 누르면 정산해요.", 1.5);
    }
  }

  function updateObjects(dt) {
    const diver = dive.diver;
    for (const obj of dive.objects) {
      if (obj.taken) continue;
      obj.phase += dt;
      obj.sparkle += dt;
      const def = ITEM_DEFS[obj.key];
      if (def.group === "fish") {
        obj.x += obj.vx * 60 * dt;
        obj.y += Math.sin(obj.phase * 2.1) * 0.25 * 60 * dt;
        if (obj.x < -WORLD_HALF_WIDTH + 50 || obj.x > WORLD_HALF_WIDTH - 50) obj.vx *= -1;
        resolveSolidCollisions(obj, Math.max(9, def.size * 0.65), false);
        const dist = Math.hypot(obj.x - diver.x, obj.y - diver.y);
        if (dist < 80) {
          obj.vx += Math.sign(obj.x - diver.x || 1) * 0.012 * 60 * dt;
          obj.vx = clamp(obj.vx, -def.speed * 1.55, def.speed * 1.55);
        }
      }
    }
    dive.objects = dive.objects.filter(o => !o.taken);
  }


  function updateNets(dt) {
    if (!dive) return;
    for (const n of dive.nets) {
      n.life -= dt;
      const t = 1 - Math.max(0, n.life) / n.maxLife;
      n.x += (n.targetX - n.x) * Math.min(1, dt * 14);
      n.y += (n.targetY - n.y) * Math.min(1, dt * 14);
      n.r = n.maxR * Math.sin(Math.min(1, t) * Math.PI * 0.82);
    }
    dive.nets = dive.nets.filter(n => n.life > 0);
  }

  function updateCaveStatus(dt) {
    const before = dive.currentCave;
    const cave = findCurrentCave();
    dive.currentCave = cave;
    if (cave && (!before || before.id !== cave.id) && dive.caveHintTimer <= 0) {
      playSfx(cave.airPocket ? "rare" : "collect");
      showToast(`${cave.name} 발견! ${cave.label}`, 2.2);
      dive.caveHintTimer = 4;
    }
    if (cave && inAirPocket(cave, dive.diver.x, dive.diver.y)) {
      dive.diver.oxygen = Math.min(dive.stats.oxygenMax, dive.diver.oxygen + 13 * dt);
      if (dive.airPocketTimer <= 0) {
        showToast("에어포켓에서 산소를 조금 회복해요!", 1.8);
        playSfx("oxygen");
        dive.airPocketTimer = 3.5;
      }
      addBubbles(dive.diver.x + rand(-10, 10), dive.diver.y - 16, 1, "#fef9c3");
    }
  }

  function updateEnemies(dt) {
    const diver = dive.diver;
    for (const e of dive.enemies) {
      const def = ENEMY_DEFS[e.key];
      e.phase += dt;
      e.hitCooldown = Math.max(0, e.hitCooldown - dt);
      e.chargeTimer = Math.max(0, e.chargeTimer - dt);

      const dx = diver.x - e.x;
      const dy = diver.y - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      const behavior = def.behavior || e.key;

      if (behavior === "jelly") {
        e.vx += Math.sin(e.phase * 0.7) * 0.003;
        e.vy += Math.cos(e.phase * 0.9) * 0.003;
        e.vx = clamp(e.vx, -0.24, 0.24);
        e.vy = clamp(e.vy, -0.18, 0.18);
      } else if (behavior === "spike") {
        if (dist < 155 && e.chargeTimer <= 0 && e.state !== "charge") {
          e.state = "charge";
          e.chargeTimer = 0.75;
          e.vx = (dx / dist) * 1.55;
          e.vy = (dy / dist) * 1.55;
        } else if (e.state === "charge" && e.chargeTimer <= 0) {
          e.state = "patrol";
          e.chargeTimer = 2.2;
          e.vx *= 0.3;
          e.vy *= 0.3;
        } else if (e.state !== "charge") {
          e.vx += Math.sin(e.phase) * 0.004;
          e.vy += Math.cos(e.phase * 0.8) * 0.004;
          e.vx = clamp(e.vx, -0.38, 0.38);
          e.vy = clamp(e.vy, -0.25, 0.25);
        }
      } else if (behavior === "puffer") {
        e.inflated = dist < 88;
        e.vx += Math.sin(e.phase * 0.9) * 0.004 + (e.homeX - e.x) * 0.000012;
        e.vy += Math.cos(e.phase * 0.7) * 0.004 + (e.homeY - e.y) * 0.000012;
        if (dist < 70) {
          e.vx -= (dx / dist) * 0.012;
          e.vy -= (dy / dist) * 0.012;
        }
        e.vx = clamp(e.vx, -0.42, 0.42);
        e.vy = clamp(e.vy, -0.34, 0.34);
      } else if (behavior === "grouper") {
        if (dist < 210) {
          e.vx += (dx / dist) * 0.026;
          e.vy += (dy / dist) * 0.018;
        } else {
          e.vx += (e.homeX - e.x) * 0.000028 + Math.sin(e.phase * 0.55) * 0.006;
          e.vy += (e.homeY - e.y) * 0.000028 + Math.cos(e.phase * 0.44) * 0.004;
        }
        e.vx = clamp(e.vx, -0.92, 0.92);
        e.vy = clamp(e.vy, -0.56, 0.56);
      } else if (behavior === "shark") {
        if (dist < 275) {
          e.vx += (dx / dist) * 0.035;
          e.vy += (dy / dist) * 0.025;
        } else {
          e.vx += Math.sin(e.phase * 0.45) * 0.006;
          e.vy += (e.homeY - e.y) * 0.000015;
        }
        e.vx = clamp(e.vx, -1.28, 1.28);
        e.vy = clamp(e.vy, -0.75, 0.75);
      } else if (behavior === "monster") {
        const reacts = dist < 245 || (dist < 330 && yToDepth(diver.y) > 900);
        if (reacts) {
          e.vx += (dx / dist) * 0.018;
          e.vy += (dy / dist) * 0.016;
        } else {
          e.vx += (e.homeX - e.x) * 0.000018 + Math.sin(e.phase * 0.25) * 0.004;
          e.vy += (e.homeY - e.y) * 0.000018 + Math.cos(e.phase * 0.31) * 0.003;
        }
        e.vx = clamp(e.vx, -0.82, 0.82);
        e.vy = clamp(e.vy, -0.62, 0.62);
      }

      e.x += e.vx * 60 * dt;
      e.y += e.vy * 60 * dt;
      resolveSolidCollisions(e, Math.max(16, def.size * 0.42), false);
      e.vx *= Math.pow(0.985, 60 * dt);
      e.vy *= Math.pow(0.985, 60 * dt);
      e.x = clamp(e.x, -WORLD_HALF_WIDTH + 50, WORLD_HALF_WIDTH - 50);
      e.y = clamp(e.y, depthToY(def.minDepth), depthToY(def.maxDepth));

      const dangerSize = def.size + (e.inflated ? 12 : 0);
      if (dist < dangerSize + 15 && e.hitCooldown <= 0) {
        e.hitCooldown = ENEMY_HIT_COOLDOWN;
        const damage = Math.round(def.damage * (e.inflated ? 1.35 : 1));
        takeDamage(damage, `${def.name}에 부딪혔어요!`);
        const push = 2.8;
        diver.vx -= (dx / dist) * push;
        diver.vy -= (dy / dist) * push;
      }
    }
  }

  function updateBubbles(dt) {
    dive.bubbleTimer -= dt;
    if (dive.bubbleTimer <= 0) {
      dive.bubbleTimer = 0.12;
      const a = dive.diver.angle + Math.PI + rand(-0.6, 0.6);
      addBubbles(dive.diver.x + Math.cos(a) * 12, dive.diver.y + Math.sin(a) * 12, 1, "#bfdbfe");
    }
    for (const b of dive.bubbles) {
      b.x += b.vx * 60 * dt;
      b.y += b.vy * 60 * dt;
      b.life -= dt;
      b.r += dt * 2;
    }
    dive.bubbles = dive.bubbles.filter(b => b.life > 0 && b.y > -80);
  }

  function addBubbles(x, y, count, color) {
    if (!dive) return;
    for (let i = 0; i < count; i++) {
      dive.bubbles.push({
        x: x + rand(-10, 10),
        y: y + rand(-8, 8),
        vx: rand(-0.16, 0.16),
        vy: rand(-0.85, -0.25),
        r: rand(2, 5),
        life: rand(0.7, 1.8),
        color
      });
    }
  }

  function updateCamera(dt) {
    const targetY = clamp(dive.diver.y, 170, WORLD_HEIGHT - ch * 0.45);
    const targetX = clamp(dive.diver.x, -WORLD_HALF_WIDTH + cw * 0.35, WORLD_HALF_WIDTH - cw * 0.35);
    dive.camera.x += (targetX - dive.camera.x) * Math.min(1, dt * 6);
    dive.camera.y += (targetY - dive.camera.y) * Math.min(1, dt * 6);
  }

  function updateSurvival(dt) {
    const diver = dive.diver;
    const depth = yToDepth(diver.y);
    const deepMul = 1 + depth / 2600;
    diver.oxygen -= dive.stats.oxygenDrain * deepMul * dt;

    if (diver.oxygen <= 0) {
      diver.oxygen = 0;
      rescueDive("산소가 떨어져 구조되었습니다!");
      return;
    }

    if (depth > dive.stats.depthLimit) {
      const over = depth - dive.stats.depthLimit;
      diver.health -= (0.7 + over / 170) * dt;
      if (dive.pressureWarnTimer <= 0) {
        showToast("현재 잠수복으로는 너무 깊어요! 업그레이드 후 다시 도전하세요!", 2.2);
        dive.pressureWarnTimer = 5.2;
      }
      if (diver.health <= 0) {
        diver.health = 0;
        rescueDive("수압 때문에 체력이 떨어져 구조되었습니다!");
        return;
      }
    }

    const oxygenPct = percent(diver.oxygen, dive.stats.oxygenMax);
    if (oxygenPct <= 30 && dive.lowOxygenWarnTimer <= 0) {
      showToast("산소가 부족해요! 위로 올라가세요!", 2.2);
      playSfx("oxygen");
      dive.lowOxygenWarnTimer = oxygenPct <= 10 ? 3 : 6;
    }
    if (oxygenPct <= 10) dive.oxygenFlash = Math.max(dive.oxygenFlash, 0.4);
  }

  function takeDamage(amount, message) {
    if (!dive || game.state !== "diving") return;
    dive.diver.health = Math.max(0, dive.diver.health - amount);
    dive.damageFlash = 1;
    playSfx("damage");
    showToast(message, 1.4);
    if (dive.diver.health <= 0) {
      rescueDive("체력이 떨어져 구조되었습니다!");
    }
  }

  // ===== 그리기 =====
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    if (game.state === "start" || !dive) {
      drawIdleOcean();
      return;
    }

    drawBackground();

    ctx.save();
    const cam = dive.camera;
    ctx.translate(cw / 2 - cam.x, ch / 2 - cam.y);

    drawWorldDetails();
    drawCaves();
    drawBoat();
    drawSilhouettes();
    drawObjects();
    drawEnemies();
    drawBubbles();
    drawNetEffects();
    drawDiver();

    ctx.restore();

    drawDarknessOverlay();
    drawScreenEffects();
    drawHUD();
  }

  function colorForDepth(depth) {
    const stops = [
      { d: 0, c: [92, 213, 255] },
      { d: 250, c: [11, 139, 197] },
      { d: 500, c: [6, 69, 122] },
      { d: 900, c: [9, 18, 56] },
      { d: 1500, c: [3, 2, 16] }
    ];
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (depth >= a.d && depth <= b.d) {
        const t = (depth - a.d) / (b.d - a.d);
        const c = a.c.map((v, idx) => Math.round(v + (b.c[idx] - v) * t));
        return `rgb(${c[0]},${c[1]},${c[2]})`;
      }
    }
    return "rgb(3,2,16)";
  }

  function drawBackground() {
    const topDepth = yToDepth(dive.camera.y - ch / 2);
    const bottomDepth = yToDepth(dive.camera.y + ch / 2);
    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, colorForDepth(topDepth));
    grad.addColorStop(0.45, colorForDepth((topDepth + bottomDepth) / 2));
    grad.addColorStop(1, colorForDepth(bottomDepth));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.globalAlpha = clamp(0.32 - topDepth / 1100, 0, 0.32);
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    for (let i = 0; i < 16; i++) {
      const x = (i * 137 + dive.time * 18) % (cw + 160) - 80;
      ctx.beginPath();
      ctx.ellipse(x, 35 + Math.sin(dive.time + i) * 7, 80, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawIdleOcean() {
    const fake = { camera: { y: 170 }, time: performance.now() / 1000 };
    const old = dive;
    dive = fake;
    drawBackground();
    dive = old;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 40; i++) {
      const x = (i * 91 + performance.now() * 0.015) % (cw + 80) - 40;
      const y = 100 + (i * 57) % (ch - 100);
      ctx.beginPath();
      ctx.arc(x, y, 2 + (i % 4), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWorldDetails() {
    // 수면
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = -WORLD_HALF_WIDTH - 200; x <= WORLD_HALF_WIDTH + 200; x += 24) {
      const y = SURFACE_Y + Math.sin(x * 0.025 + dive.time * 1.7) * 5;
      if (x === -WORLD_HALF_WIDTH - 200) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 구역 경계선
    const lines = [250, 500, 900, 1500];
    ctx.save();
    ctx.font = "bold 17px system-ui";
    ctx.textAlign = "left";
    lines.forEach(m => {
      const y = depthToY(m);
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.setLineDash([10, 14]);
      ctx.beginPath();
      ctx.moveTo(-WORLD_HALF_WIDTH, y);
      ctx.lineTo(WORLD_HALF_WIDTH, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillText(`${m}m`, -WORLD_HALF_WIDTH + 20, y - 10);
    });
    ctx.restore();

    // 바닥 근처 암석
    drawTerrainFeatures();

    ctx.save();
    ctx.fillStyle = "rgba(15,23,42,0.75)";
    ctx.beginPath();
    ctx.moveTo(-WORLD_HALF_WIDTH, WORLD_HEIGHT + 70);
    for (let x = -WORLD_HALF_WIDTH; x <= WORLD_HALF_WIDTH; x += 70) {
      ctx.lineTo(x, WORLD_HEIGHT - 25 + Math.sin(x * 0.03) * 26 + Math.cos(x * 0.011) * 38);
    }
    ctx.lineTo(WORLD_HALF_WIDTH, WORLD_HEIGHT + 80);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }


  function drawTerrainFeatures() {
    if (!dive || !dive.terrain) return;
    ctx.save();
    for (const t of dive.terrain) {
      if (!isOnScreen(t.x, t.y, 180)) continue;
      if (t.type === "shelf") {
        ctx.fillStyle = "rgba(15,23,42,0.58)";
        ctx.strokeStyle = "rgba(148,163,184,0.20)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(t.x - t.w / 2, t.y);
        for (let i = 0; i <= 8; i++) {
          const px = t.x - t.w / 2 + (t.w * i) / 8;
          const py = t.y + Math.sin(i + t.phase) * 10;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(t.x + t.w / 2, t.y + t.h);
        ctx.lineTo(t.x - t.w / 2, t.y + t.h * 0.8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(30,41,59,0.56)";
        ctx.strokeStyle = "rgba(148,163,184,0.15)";
        ctx.beginPath();
        ctx.ellipse(t.x, t.y, t.w * 0.5, t.h * 0.5, t.phase, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawCaves() {
    if (!dive || !dive.caves) return;
    ctx.save();
    for (const cave of dive.caves) {
      if (!isOnScreen(cave.x, cave.y, Math.max(cave.w, cave.h) + 160)) continue;
      const active = dive.currentCave && dive.currentCave.id === cave.id;
      const dir = cave.entrance === "left" ? -1 : 1;
      ctx.save();
      ctx.translate(cave.x, cave.y);

      // 바깥 바위 덩어리: 실제 충돌 판정이 있는 단단한 벽입니다.
      const shellGrad = ctx.createRadialGradient(0, 0, 40, 0, 0, cave.w * 0.62);
      shellGrad.addColorStop(0, cave.type === "volcano" ? "rgba(69,10,10,0.92)" : "rgba(15,23,42,0.92)");
      shellGrad.addColorStop(1, cave.type === "volcano" ? "rgba(24,5,5,0.98)" : "rgba(2,6,23,0.98)");
      ctx.fillStyle = shellGrad;
      ctx.strokeStyle = active ? "rgba(254,249,195,0.92)" : "rgba(148,163,184,0.34)";
      ctx.lineWidth = active ? 4 : 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, cave.w * 0.61, cave.h * 0.58, Math.sin(dive.time * 0.2) * 0.03, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 입구 터널: 이 통로로만 동굴 벽을 통과할 수 있습니다.
      ctx.fillStyle = cave.color;
      ctx.strokeStyle = active ? "rgba(254,249,195,0.72)" : "rgba(125,211,252,0.24)";
      ctx.lineWidth = 3;
      const tunnelX = dir > 0 ? cave.w * 0.34 : -cave.w * 0.69;
      ctx.beginPath();
      ctx.roundRect(tunnelX, -cave.h * 0.16, cave.w * 0.35, cave.h * 0.32, 22);
      ctx.fill();
      ctx.stroke();

      // 안쪽 빈 공간
      ctx.fillStyle = cave.color;
      ctx.strokeStyle = "rgba(15,23,42,0.92)";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(0, 0, cave.w * 0.47, cave.h * 0.43, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 울퉁불퉁한 벽 느낌
      ctx.strokeStyle = "rgba(203,213,225,0.14)";
      ctx.lineWidth = 3;
      for (let i = 0; i < 18; i++) {
        const a = (Math.PI * 2 * i) / 18 + Math.sin(dive.time * 0.15 + i) * 0.03;
        const x1 = Math.cos(a) * cave.w * 0.47;
        const y1 = Math.sin(a) * cave.h * 0.43;
        const x2 = Math.cos(a) * cave.w * 0.57;
        const y2 = Math.sin(a) * cave.h * 0.53;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      if (cave.type === "wreck") drawWreckCaveDetails(cave);
      if (cave.type === "volcano") drawVolcanoCaveDetails(cave);
      if (cave.airPocket) drawAirPocketDetails(cave);
      if (cave.type === "waterCave") drawWaterCaveDetails(cave);

      ctx.fillStyle = active ? "#fef9c3" : "rgba(219,234,254,0.78)";
      ctx.font = "bold 16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(cave.name, 0, -cave.h * 0.55 - 18);
      ctx.font = "bold 12px system-ui";
      ctx.fillStyle = active ? "#fde68a" : "rgba(186,230,253,0.65)";
      ctx.fillText(cave.entrance === "left" ? "입구 ◀" : "▶ 입구", dir * cave.w * 0.55, -cave.h * 0.20);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawWaterCaveDetails(cave) {
    ctx.strokeStyle = "rgba(125,211,252,0.25)";
    ctx.lineWidth = 3;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 46, -cave.h * 0.42);
      ctx.lineTo(i * 35 + Math.sin(dive.time + i) * 8, -cave.h * 0.18);
      ctx.stroke();
    }
  }

  function drawWreckCaveDetails(cave) {
    ctx.save();
    ctx.rotate(-0.08);
    ctx.fillStyle = "rgba(120,53,15,0.72)";
    ctx.strokeStyle = "rgba(253,186,116,0.38)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-cave.w * 0.28, 20);
    ctx.lineTo(cave.w * 0.26, 8);
    ctx.lineTo(cave.w * 0.18, 58);
    ctx.lineTo(-cave.w * 0.34, 68);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.strokeRect(i * 42 - 12, 23, 24, 18);
    }
    ctx.restore();
  }

  function drawVolcanoCaveDetails(cave) {
    ctx.save();
    for (let i = -2; i <= 2; i++) {
      const x = i * 58;
      ctx.fillStyle = "rgba(127,29,29,0.78)";
      ctx.beginPath();
      ctx.moveTo(x - 28, cave.h * 0.34);
      ctx.lineTo(x, cave.h * 0.05);
      ctx.lineTo(x + 28, cave.h * 0.34);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = `rgba(248,113,113,${0.18 + Math.sin(dive.time * 3 + i) * 0.08})`;
      ctx.beginPath();
      ctx.ellipse(x, cave.h * 0.08, 18, 45, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawAirPocketDetails(cave) {
    ctx.save();
    ctx.fillStyle = "rgba(254,249,195,0.30)";
    ctx.strokeStyle = "rgba(254,240,138,0.62)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -cave.h * 0.34, cave.w * 0.22, cave.h * 0.10, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("산소 회복", 0, -cave.h * 0.34 - 6);
    ctx.restore();
  }

  function drawBoat() {
    ctx.save();
    ctx.translate(BOAT_X, -28 + Math.sin(dive.time * 1.8) * 2);
    ctx.fillStyle = "#7c2d12";
    ctx.beginPath();
    ctx.moveTo(-78, 8);
    ctx.lineTo(78, 8);
    ctx.lineTo(46, 36);
    ctx.lineTo(-52, 36);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fef3c7";
    ctx.fillRect(-22, -18, 44, 26);
    ctx.fillStyle = "#0ea5e9";
    ctx.fillRect(-10, -12, 20, 12);
    ctx.strokeStyle = "#f8fafc";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(38, 8);
    ctx.lineTo(38, -46);
    ctx.stroke();
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.moveTo(40, -44);
    ctx.lineTo(82, -32);
    ctx.lineTo(40, -20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function isOnScreen(x, y, pad = 140) {
    const sx = x - dive.camera.x + cw / 2;
    const sy = y - dive.camera.y + ch / 2;
    return sx > -pad && sx < cw + pad && sy > -pad && sy < ch + pad;
  }

  function drawSilhouettes() {
    ctx.save();
    for (const s of dive.silhouettes) {
      if (!isOnScreen(s.x, s.y, 220)) continue;
      const depth = yToDepth(s.y);
      ctx.globalAlpha = clamp(depth / 1700, 0.05, 0.20);
      ctx.fillStyle = depth > 900 ? "#020617" : "#0f172a";
      ctx.save();
      ctx.translate(s.x + Math.sin(dive.time * 0.2 + s.phase) * 8, s.y);
      if (s.type === "fish") {
        ctx.beginPath();
        ctx.ellipse(0, 0, s.size, s.size * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-s.size * 0.9, 0);
        ctx.lineTo(-s.size * 1.35, -s.size * 0.22);
        ctx.lineTo(-s.size * 1.35, s.size * 0.22);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, s.size * 0.75, s.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawObjects() {
    for (const obj of dive.objects) {
      if (!isOnScreen(obj.x, obj.y)) continue;
      const def = ITEM_DEFS[obj.key];
      if (def.group === "fish") drawFish(obj, def);
      else if (def.group === "resource") drawResource(obj, def);
      else drawTreasure(obj, def);
    }
  }

  function drawFish(obj, def) {
    if (obj.key === "seahorse") return drawSeahorse(obj, def);
    if (obj.key === "fastFish") return drawFishSchool(obj, def);
    if (obj.key === "squid") return drawSquidItem(obj, def);
    if (obj.key === "caveShrimp") return drawShrimpItem(obj, def);
    if (obj.key === "anglerFish") return drawAnglerItem(obj, def);
    if (obj.key === "deepFish") return drawViperItem(obj, def);
    if (obj.key === "clownFish") return drawClownFish(obj, def);
    if (obj.key === "blueFish") return drawBlueTang(obj, def);
    if (obj.key === "rareFish") return drawLanternFish(obj, def);
    drawGenericFish(obj, def);
  }

  function drawGenericFish(obj, def) {
    ctx.save();
    ctx.translate(obj.x, obj.y);
    if (obj.vx < 0) ctx.scale(-1, 1);
    ctx.fillStyle = def.color;
    ctx.strokeStyle = "rgba(2,6,23,0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, def.size, def.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-def.size * 0.9, 0);
    ctx.lineTo(-def.size * 1.55, -def.size * 0.48);
    ctx.lineTo(-def.size * 1.55, def.size * 0.48);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(def.size * 0.55, -def.size * 0.18, 2.4, 0, Math.PI * 2);
    ctx.fill();
    drawItemLabelIfNear(obj, def);
    if (def.rare) drawRareRing(def.size + 7, obj.sparkle);
    ctx.restore();
  }

  function drawClownFish(obj, def) {
    ctx.save();
    ctx.translate(obj.x, obj.y);
    if (obj.vx < 0) ctx.scale(-1, 1);
    ctx.fillStyle = "#fb923c";
    ctx.strokeStyle = "#7c2d12";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-30, -10); ctx.lineTo(-30, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#fff7ed"; ctx.lineWidth = 5;
    for (const x of [-7, 6]) { ctx.beginPath(); ctx.moveTo(x, -9); ctx.lineTo(x + 2, 9); ctx.stroke(); }
    ctx.strokeStyle = "#111827"; ctx.lineWidth = 1.5;
    for (const x of [-7, 6]) { ctx.beginPath(); ctx.moveTo(x + 3, -9); ctx.lineTo(x + 5, 9); ctx.stroke(); }
    ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(11, -3, 2.4, 0, Math.PI * 2); ctx.fill();
    drawItemLabelIfNear(obj, def);
    ctx.restore();
  }

  function drawBlueTang(obj, def) {
    ctx.save();
    ctx.translate(obj.x, obj.y);
    if (obj.vx < 0) ctx.scale(-1, 1);
    ctx.fillStyle = "#2563eb";
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-35, -10); ctx.lineTo(-32, 0); ctx.lineTo(-35, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#020617"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.bezierCurveTo(-8, -9, 3, -2, 14, -9); ctx.stroke();
    ctx.fillStyle = "#020617"; ctx.beginPath(); ctx.arc(12, -4, 2.6, 0, Math.PI * 2); ctx.fill();
    drawItemLabelIfNear(obj, def);
    ctx.restore();
  }

  function drawSeahorse(obj, def) {
    ctx.save();
    ctx.translate(obj.x, obj.y);
    if (obj.vx < 0) ctx.scale(-1, 1);
    ctx.strokeStyle = def.color;
    ctx.fillStyle = def.color;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(3, -18);
    ctx.bezierCurveTo(-12, -16, -9, 4, 3, 7);
    ctx.bezierCurveTo(16, 10, 12, 25, -3, 22);
    ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(5, -18); ctx.lineTo(22, -17); ctx.stroke();
    ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(5, -21, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fbcfe8"; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-5, -10 + i * 6); ctx.lineTo(-14, -7 + i * 5); ctx.stroke(); }
    drawItemLabelIfNear(obj, def);
    drawRareRing(26, obj.sparkle);
    ctx.restore();
  }

  function drawFishSchool(obj, def) {
    ctx.save();
    ctx.translate(obj.x, obj.y);
    if (obj.vx < 0) ctx.scale(-1, 1);

    ctx.textAlign = "center";
    ctx.font = "bold 11px system-ui";
    ctx.fillStyle = "rgba(2,6,23,0.58)";
    const text = def.group === "fish" ? def.name : `${def.name}  E`;
    const w = ctx.measureText(text).width + 12;
    roundRect(-w / 2, -36, w, 20, 8, true, false);
    ctx.fillStyle = def.group === "fish" ? "#e0f2fe" : "#fef3c7";
    ctx.fillText(text, 0, -32);
    ctx.restore();
