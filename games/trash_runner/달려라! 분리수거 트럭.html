<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>달려라! 분리수거 트럭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #bae6fd;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 모바일 확대 및 스와이프 방지를 위해 조작 완전 차단 */
        }

        /* 애니메이션 키프레임 */
        @keyframes road-move { from { background-position: 0 0; } to { background-position: -120px 0; } }
        @keyframes bg-move { from { background-position: 0 bottom; } to { background-position: -200px bottom; } }
        @keyframes cloud-move { from { background-position: 0 20px; } to { background-position: -300px 20px; } }
        @keyframes drive { from { left: 110vw; } to { left: -20vw; } }
        @keyframes bounce-truck { 
            0%, 100% { transform: translateY(0) scaleX(-1); } 
            50% { transform: translateY(-8px) scaleX(-1); } 
        }
        @keyframes float-up { 
            0% { opacity: 1; transform: translateY(0) scale(1); } 
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); } 
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            50% { transform: translateX(10px) rotate(2deg); }
            75% { transform: translateX(-10px) rotate(-2deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-road {
            animation: road-move 0.3s linear infinite;
            background-image: linear-gradient(90deg, transparent 50%, #facc15 50%);
            background-size: 120px 12px;
            background-position-y: center;
            background-repeat: repeat-x;
        }
        .animate-trees { animation: bg-move 2s linear infinite; }
        .animate-clouds { animation: cloud-move 20s linear infinite; }
        
        .moving-trash {
            animation-name: drive;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        .animate-bounce-truck { animation: bounce-truck 0.4s ease-in-out infinite alternate; }
        .float-anim { animation: float-up 1s ease-out forwards; }
        .shake-screen { animation: shake 0.4s ease-in-out; }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .hidden { display: none !important; }
        .text-shadow { text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* v2 asset rework */
        #city3d{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
        #play-screen>.legacy-sky,#bg-clouds,#bg-trees{transition:opacity .35s ease}
        body.three-ready #play-screen>.legacy-sky,body.three-ready #bg-clouds,body.three-ready #bg-trees{opacity:0!important}
        #road-stage{
            background:linear-gradient(180deg,rgba(28,36,43,.12),rgba(28,36,43,.34));
            border-top:1px solid rgba(255,255,255,.16);border-bottom:0;
            box-shadow:0 -12px 28px rgba(16,31,38,.12) inset;
            backdrop-filter:blur(1px)
        }
        body.three-ready #road-stage{background:linear-gradient(180deg,rgba(18,32,39,.03),rgba(18,32,39,.16));border-color:transparent;box-shadow:none}
        body.three-ready #road-stage>.animate-road{opacity:0}
        #truck-fallback{transition:opacity .25s ease}
        body.three-ready #truck-fallback{opacity:0}
        .pickup-card{
            width:118px;min-height:88px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,250,252,.96));
            border:3px solid #f4c84a;border-radius:20px;padding:7px 8px 8px;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:2px;box-shadow:0 10px 24px rgba(27,43,53,.24),inset 0 0 0 2px rgba(255,255,255,.7)
        }
        .pickup-card:before{content:"수거";position:absolute;top:-9px;background:#173c50;color:white;border-radius:999px;padding:2px 8px;font:900 10px/1 system-ui,sans-serif;letter-spacing:.04em}
        .pickup-glyph{font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.13));pointer-events:none}
        .pickup-name{font:900 12px/1.15 system-ui,sans-serif;color:#17324a;text-align:center;max-width:100px;word-break:keep-all;pointer-events:none}
        .pickup-level{font:800 9px/1 system-ui,sans-serif;color:#6a7d89;background:#edf3f5;padding:3px 6px;border-radius:999px;pointer-events:none}
        .moving-trash:hover .pickup-card{border-color:#ff9c3b;box-shadow:0 12px 28px rgba(255,145,36,.28),0 0 0 4px rgba(255,205,75,.16)}
        #slot-box{border-radius:26px!important}
        #slot-item{gap:4px}
        #slot-emoji{display:grid;place-items:center;width:68px;height:68px;border-radius:18px;background:white;border:3px solid #b9d8c3;box-shadow:0 7px 14px rgba(42,88,58,.14)}
        #bins-area{background:linear-gradient(180deg,#17252e,#0f171d);gap:8px!important;padding-bottom:max(6px,env(safe-area-inset-bottom))}
        .recycle-bin{
            position:relative;flex:1 0 74px;max-width:118px;height:88px;border:0;border-radius:16px 16px 13px 13px;color:white;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 7px 0 var(--bin-dark),0 10px 18px rgba(0,0,0,.22);
            transition:transform .15s,filter .15s,opacity .15s;touch-action:manipulation
        }
        .recycle-bin:before{content:"";position:absolute;left:7px;right:7px;top:-5px;height:11px;border-radius:8px;background:var(--bin-lid);box-shadow:0 2px 0 rgba(0,0,0,.18)}
        .recycle-bin img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
        .recycle-bin .bin-label{font:900 11px/1 system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
        .recycle-bin .bin-sub{font:800 8px/1 system-ui,sans-serif;opacity:.8;letter-spacing:.05em}
        .recycle-bin.disabled{opacity:.34;filter:grayscale(.8);cursor:not-allowed}
        .recycle-bin.ready{opacity:1;cursor:pointer}
        .recycle-bin.ready:active{transform:translateY(6px);box-shadow:0 1px 0 var(--bin-dark),0 4px 10px rgba(0,0,0,.18)}
        .bin-general{background:#64748b;--bin-dark:#334155;--bin-lid:#94a3b8}
        .bin-plastic{background:#3387d6;--bin-dark:#1f5d9a;--bin-lid:#6bb8ff}
        .bin-can_glass{background:#d5a423;--bin-dark:#8f6d16;--bin-lid:#f6d55d}
        .bin-paper{background:#2f9b70;--bin-dark:#1d6b4c;--bin-lid:#61c99e}
        .bin-food{background:#d67b2b;--bin-dark:#914f19;--bin-lid:#f5a95d}
        .eco-brand{display:inline-flex;align-items:center;gap:7px}
        .eco-brand:before{content:"ECO";font:1000 10px/1 system-ui,sans-serif;background:#2f9b70;color:white;padding:4px 6px;border-radius:7px;letter-spacing:.08em}
        .start-fleet{
            margin:0 auto 14px;width:178px;height:82px;border-radius:24px;background:linear-gradient(145deg,#dff7e7,#eef9ff);
            display:grid;place-items:center;border:3px solid #7bcf99;box-shadow:0 12px 24px rgba(41,111,67,.16)
        }
        .start-fleet strong{font:1000 20px/1 system-ui,sans-serif;color:#276d43}.start-fleet small{display:block;margin-top:6px;font:800 10px/1 system-ui,sans-serif;color:#57836a;letter-spacing:.08em}
        @media(max-width:640px){
            .pickup-card{width:98px;min-height:76px;border-radius:17px;padding:6px}.pickup-glyph{font-size:29px}.pickup-name{font-size:10px;max-width:86px}
            .recycle-bin{flex-basis:70px;height:78px}.recycle-bin img{width:29px;height:29px}.recycle-bin .bin-label{font-size:9px}
            #bins-area{justify-content:flex-start}
        }
    </style>
</head>

<script>
    // ==========================================
    // 1. 오디오 엔진 (Web Audio API)
    // ==========================================
    const AudioEngine = (() => {
        let ctx = null;
        let isMuted = false;
        let bgmInterval = null;

        const init = () => {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
        };

        const playTone = (freq, type, duration, vol, slideFreq = null) => {
            if (isMuted) return;
            init();
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        };

        return {
            init,
            toggle: () => { isMuted = !isMuted; return isMuted; },
            isMuted: () => isMuted,
            playCatch: () => playTone(800, 'sine', 0.1, 0.1),
            playCorrect: () => {
                playTone(523.25, 'triangle', 0.1, 0.1); 
                setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.1), 100); 
                setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.15), 200); 
            },
            playWrong: () => {
                playTone(200, 'sawtooth', 0.2, 0.1);
                setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.15), 150);
            },
            playMiss: () => playTone(300, 'sawtooth', 0.4, 0.1, 100),
            playOver: () => {
                playTone(300, 'square', 0.3, 0.1, 150);
                setTimeout(() => playTone(200, 'square', 0.5, 0.1, 50), 300);
            },
            startBGM: () => {
                if (bgmInterval || isMuted) return;
                init();
                const notes = [261.63, 329.63, 392.00, 523.25]; 
                let step = 0;
                bgmInterval = setInterval(() => {
                    if (isMuted || ctx.state !== 'running') return;
                    playTone(notes[step % notes.length], 'sine', 0.15, 0.02);
                    if (step % 4 === 0) playTone(130.81, 'triangle', 0.2, 0.03); 
                    step++;
                }, 250);
            },
            stopBGM: () => {
                if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            }
        };
    })();

    // ==========================================
    // 2. 게임 데이터베이스
    // ==========================================
    const TRASH_DATA = [
        { id: 'g1', name: '오염된 컵라면', emoji: '🍜', type: 'general', level: 1, reason: "국물로 오염된 용기는 재활용이 불가능해요!" },
        { id: 'g2', name: '두루마리 휴지', emoji: '🧻', type: 'general', level: 1, reason: "이물질이 묻은 휴지는 일반쓰레기예요!" },
        { id: 'g3', name: '부서진 칫솔', emoji: '🪥', type: 'general', level: 1, reason: "여러 재질이 섞여있어 재활용이 어려워요!" },
        { id: 'g4', name: '깨진 유리조각', emoji: '💥', type: 'general', level: 1, reason: "깨진 유리는 다칠 위험이 있어 신문지로 싸서 종량제 봉투에!" },
        
        { id: 'p1', name: '투명 페트병', emoji: '💧', type: 'plastic', level: 1, reason: "" },
        { id: 'p2', name: '배달 용기', emoji: '🥡', type: 'plastic', level: 1, reason: "" },
        { id: 'p3', name: '샴푸통', emoji: '🧴', type: 'plastic', level: 1, reason: "" },
        { id: 'p4', name: '플라스틱 컵', emoji: '🥤', type: 'plastic', level: 1, reason: "" },
        
        { id: 'c1', name: '콜라 캔', emoji: '🥫', type: 'can_glass', level: 1, reason: "" },
        { id: 'c2', name: '참치 캔', emoji: '🐟', type: 'can_glass', level: 1, reason: "" },
        { id: 'c3', name: '잼 유리병', emoji: '🫙', type: 'can_glass', level: 1, reason: "" },
        { id: 'c4', name: '소주병', emoji: '🍶', type: 'can_glass', level: 1, reason: "" },
        
        { id: 'pa1', name: '종이 박스', emoji: '📦', type: 'paper', level: 1, reason: "" },
        { id: 'pa2', name: '다 본 신문지', emoji: '📰', type: 'paper', level: 1, reason: "" },
        { id: 'pa3', name: '우유팩/주스팩', emoji: '🧃', type: 'paper', level: 1, reason: "" },
        { id: 'pa4', name: '종이 쇼핑백', emoji: '🛍️', type: 'paper', level: 1, reason: "" },
        
        { id: 'f1', name: '사과 껍질', emoji: '🍎', type: 'food', level: 1, reason: "부드러운 과일 껍질은 동물이 먹을 수 있어요!" },
        { id: 'f2', name: '바나나 껍질', emoji: '🍌', type: 'food', level: 1, reason: "동물이 먹을 수 있는 부드러운 껍질이에요!" },
        { id: 'f3', name: '먹다 남은 빵', emoji: '🍞', type: 'food', level: 1, reason: "동물의 사료나 비료로 만들 수 있어요!" },
        { id: 'f4', name: '상한 귤', emoji: '🍊', type: 'food', level: 1, reason: "부드러운 과일류는 음식물이에요!" },

        // 심화 데이터 (점수가 높아지면 등장)
        { id: 'g5', name: '치킨 뼈다귀', emoji: '🍗', type: 'general', level: 2, reason: "딱딱한 뼈는 동물이 먹을 수 없어 일반쓰레기예요!" },
        { id: 'g6', name: '계란 껍데기', emoji: '🥚', type: 'general', level: 2, reason: "계란 껍데기는 석회질이라 비료로 쓸 수 없어요!" },
        { id: 'g7', name: '조개 껍데기', emoji: '🦪', type: 'general', level: 3, reason: "단단한 패각류(조개) 껍데기는 일반쓰레기입니다!" },
        { id: 'g8', name: '호두 껍데기', emoji: '🌰', type: 'general', level: 3, reason: "호두, 땅콩 등 단단한 견과류 껍질은 일반쓰레기예요!" },
        { id: 'g9', name: '양파 껍질', emoji: '🧅', type: 'general', level: 4, reason: "양파, 마늘 껍질은 가축의 소화력을 떨어뜨려 일반쓰레기로 버려야 해요!" },
        { id: 'g10', name: '파뿌리', emoji: '🌿', type: 'general', level: 4, reason: "파뿌리는 매운 향이 강해 사료로 부적합해요!" }
    ];

    const BIN_ICON='../../assets/game/ui/icons/kenney-game-icons/white/2x/trashcan-open.png';
    const BINS = [
        { id: 'general', name: '일반쓰레기', sub:'GENERAL' },
        { id: 'plastic', name: '플라스틱', sub:'PLASTIC' },
        { id: 'can_glass', name: '캔·유리', sub:'CAN · GLASS' },
        { id: 'paper', name: '종이류', sub:'PAPER' },
        { id: 'food', name: '음식물', sub:'FOOD' }
    ];

    // ==========================================
    // 3. 게임 상태 및 로직
    // ==========================================
    let status = 'start'; 
    let score = 0;
    let lives = 3;
    let combo = 0;
    let heldTrash = null;
    let spawnTimer = null;
    let msgTimer = null;

    // DOM Elements
    const elGameWrapper = document.getElementById('game-wrapper');
    const elPlayScreen = document.getElementById('play-screen');
    const elStartModal = document.getElementById('start-modal');
    const elGameoverModal = document.getElementById('gameover-modal');
    const elRoadArea = document.getElementById('road-area');
    const elBinsArea = document.getElementById('bins-area');
    
    const elScoreText = document.getElementById('score-text');
    const elComboText = document.getElementById('combo-text');
    const elLivesContainer = document.getElementById('lives-container');
    const elMsgText = document.getElementById('msg-text');
    
    const elSlotBox = document.getElementById('slot-box');
    const elSlotLabel = document.getElementById('slot-label');
    const elSlotEmpty = document.getElementById('slot-empty');
    const elSlotItem = document.getElementById('slot-item');
    const elSlotEmoji = document.getElementById('slot-emoji');
    const elSlotName = document.getElementById('slot-name');

    // 3D가 준비되기 전에는 기존 하늘/도로 레이어가 폴백으로 남습니다.

    // 하단 휴지통 생성 (pointerdown 이벤트 적용)
    BINS.forEach(bin => {
        const btn = document.createElement('button');
        btn.className = `recycle-bin bin-${bin.id} disabled`;
        btn.innerHTML = `<img src="${BIN_ICON}" alt=""><span class="bin-label">${bin.name}</span><span class="bin-sub">${bin.sub}</span>`;
        
        btn.onpointerdown = (e) => {
            e.preventDefault();
            handleBinClick(e, bin.id);
        };
        
        btn.id = `bin-${bin.id}`;
        elBinsArea.appendChild(btn);
    });

    function getAvailableTrash() {
        let currentLevel = 1;
        if (score >= 100) currentLevel = 2;
        if (score >= 300) currentLevel = 3;
        if (score >= 500) currentLevel = 4;
        return TRASH_DATA.filter(t => t.level <= currentLevel);
    }

    function showMsg(text) {
        elMsgText.innerText = text;
        elMsgText.classList.remove('hidden');
        clearTimeout(msgTimer);
        msgTimer = setTimeout(() => elMsgText.classList.add('hidden'), 3500);
    }

    function addFloatText(text, x, y, colorClass) {
        const el = document.createElement('div');
        el.className = `fixed z-50 font-black text-3xl float-anim pointer-events-none drop-shadow-md ${colorClass}`;
        el.style.left = (x - 20) + 'px';
        el.style.top = (y - 20) + 'px';
        el.innerText = text;
        elGameWrapper.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function triggerShake() {
        elGameWrapper.classList.add('shake-screen');
        setTimeout(() => elGameWrapper.classList.remove('shake-screen'), 400);
    }

    function updateUI() {
        elScoreText.innerText = score + '점';
        
        if (combo > 1) {
            elComboText.innerText = `${combo} 콤보 🔥`;
            elComboText.classList.remove('hidden');
        } else {
            elComboText.classList.add('hidden');
        }

        const hearts = elLivesContainer.children;
        for (let i = 0; i < 3; i++) {
            if (i < lives) {
                hearts[i].className = "heart opacity-100 scale-100 transition-all duration-300";
            } else {
                hearts[i].className = "heart opacity-20 grayscale scale-75 transition-all duration-300";
            }
        }

        // 슬롯 UI 업데이트
        if (heldTrash) {
            elSlotEmpty.classList.add('hidden');
            elSlotItem.classList.remove('hidden');
            elSlotEmoji.innerText = heldTrash.emoji;
            elSlotName.innerText = heldTrash.name;
            
            elSlotBox.className = "w-36 h-36 md:w-44 md:h-44 border-[6px] md:border-8 border-dashed rounded-3xl flex flex-col items-center justify-center bg-green-50 backdrop-blur-md transition-all duration-300 shadow-xl border-green-400 scale-110 shadow-green-400/40";
            
            // 통 버튼 활성화
            BINS.forEach(bin => {
                const btn = document.getElementById(`bin-${bin.id}`);
                btn.className = `recycle-bin bin-${bin.id} ready`;
                btn.disabled = false;
            });
        } else {
            elSlotEmpty.classList.remove('hidden');
            elSlotItem.classList.add('hidden');
            
            elSlotBox.className = "w-36 h-36 md:w-44 md:h-44 border-[6px] md:border-8 border-dashed rounded-3xl flex flex-col items-center justify-center bg-white/50 backdrop-blur-md transition-all duration-300 shadow-xl border-gray-400";
            
            // 통 버튼 비활성화
            BINS.forEach(bin => {
                const btn = document.getElementById(`bin-${bin.id}`);
                btn.className = `recycle-bin bin-${bin.id} disabled`;
                btn.disabled = true;
            });
        }

        window.TrashRunner3D?.setScore?.(score, combo);
        if (lives <= 0 && status === 'playing') {
            endGame();
        }
    }

    function spawnTrash() {
        if (status !== 'playing') return;

        const available = getAvailableTrash();
        const trashData = available[Math.floor(Math.random() * available.length)];
        
        const el = document.createElement('div');
        el.className = 'moving-trash absolute bottom-6 z-20 cursor-pointer transition-transform transform hover:scale-110 active:scale-95';
        
        const speed = Math.max(2.5, 6.0 - (score / 150));
        el.style.animationDuration = speed + 's';
        
        el.innerHTML = `
            <div class="pickup-card">
                <span class="pickup-glyph">${trashData.emoji}</span>
                <span class="pickup-name">${trashData.name}</span>
                <span class="pickup-level">난이도 ${trashData.level}</span>
            </div>
        `;

        // 터치 인식률 100% 개선 (click -> pointerdown 교체)
        el.onpointerdown = (e) => {
            e.preventDefault();
            if (heldTrash) {
                showMsg('먼저 슬롯의 쓰레기를 비워주세요!');
                return;
            }
            AudioEngine.playCatch();
            window.TrashRunner3D?.collect?.();
            
            const rect = el.getBoundingClientRect();
            addFloatText('GET!', rect.left, rect.top, 'text-yellow-300');
            
            heldTrash = trashData;
            el.remove(); // DOM에서 제거
            showMsg('알맞은 통을 눌러 분류하세요!');
            updateUI();
        };

        // 화면 밖으로 나갔을 때 (Miss)
        el.onanimationend = () => {
            if (status === 'playing' && document.body.contains(el)) {
                lives--;
                combo = 0;
                showMsg('앗! 쓰레기를 놓쳤어요!');
                AudioEngine.playMiss();
                window.TrashRunner3D?.wrong?.();
                triggerShake();
                updateUI();
            }
            el.remove();
        };

        elRoadArea.appendChild(el);

        const spawnRate = Math.max(800, 2500 - (score / 20));
        spawnTimer = setTimeout(spawnTrash, spawnRate);
    }

    function handleBinClick(e, binId) {
        if (!heldTrash || status !== 'playing') return;

        const rect = e.currentTarget.getBoundingClientRect();

        if (heldTrash.type === binId) {
            // 정답
            AudioEngine.playCorrect();
            window.TrashRunner3D?.correct?.();
            const earned = 10 + (combo * 2);
            score += earned;
            combo++;
            showMsg(`나이스! (+${earned}점)`);
            addFloatText(`+${earned}`, rect.left + rect.width/2, rect.top, 'text-green-400');
        } else {
            // 오답
            AudioEngine.playWrong();
            window.TrashRunner3D?.wrong?.();
            triggerShake();
            lives--;
            combo = 0;
            const correctBin = BINS.find(b => b.id === heldTrash.type).name;
            
            if (heldTrash.reason) {
                showMsg(`땡! ${heldTrash.reason}`);
            } else {
                showMsg(`땡! [${heldTrash.name}]은(는) ${correctBin}행!`);
            }
            
            addFloatText('MISS', rect.left + rect.width/2, rect.top, 'text-red-500');
        }
        
        heldTrash = null;
        updateUI();
    }

    function startGame() {
        AudioEngine.init();
        status = 'playing';
        score = 0;
        lives = 3;
        combo = 0;
        heldTrash = null;
        elRoadArea.innerHTML = ''; // 기존 쓰레기 청소
        clearTimeout(spawnTimer);
        
        elStartModal.classList.add('hidden');
        elGameoverModal.classList.add('hidden');
        elPlayScreen.classList.remove('hidden');
        
        showMsg('달리는 길가의 쓰레기를 터치하세요!');
        updateUI();
        
        AudioEngine.startBGM();
        window.TrashRunner3D?.start?.();
        spawnTimer = setTimeout(spawnTrash, 1500); // 1.5초 후 첫 스폰
    }

    function endGame() {
        status = 'gameover';
        clearTimeout(spawnTimer);
        AudioEngine.stopBGM();
        window.TrashRunner3D?.stop?.();
        AudioEngine.playOver();

        // 멈추기
        const garbages = document.querySelectorAll('.moving-trash');
        garbages.forEach(g => {
            g.style.animationPlayState = 'paused';
            g.onpointerdown = null; // 수정된 터치 이벤트 해제
        });

        document.getElementById('final-score-text').innerText = score + '점';
        
        // 최고 점수 처리
        let bestScore = parseInt(localStorage.getItem('trash_runner_high_score') || '0');
        const badge = document.getElementById('new-record-badge');
        
        if (score > bestScore) {
            localStorage.setItem('trash_runner_high_score', score);
            bestScore = score;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
        document.getElementById('best-score-text').innerText = bestScore;

        elGameoverModal.classList.remove('hidden');

        // 포털에 데이터 전송
        try {
            window.parent.postMessage({ type: 'GAME_OVER', gameId: 'trash_runner', score: score }, '*');
        } catch(e) {}
    }

    // 버튼 이벤트 리스너 (모두 pointerdown 으로 통일하여 딜레이 제거 및 터치율 100% 반영)
    document.getElementById('btn-start').onpointerdown = (e) => { e.preventDefault(); startGame(); };
    document.getElementById('btn-restart').onpointerdown = (e) => { e.preventDefault(); startGame(); };
    document.getElementById('btn-sound').onpointerdown = (e) => {
        e.preventDefault();
        const isMuted = AudioEngine.toggle();
        e.target.innerText = isMuted ? '🔇' : '🔊';
        if (isMuted) {
            AudioEngine.stopBGM();
        } else if (status === 'playing') {
            AudioEngine.startBGM();
        }
    };

</script>
