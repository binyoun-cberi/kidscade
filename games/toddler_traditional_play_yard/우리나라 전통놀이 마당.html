<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ead9ad">
<title>우리나라 전통놀이 마당 | Kidscade</title>
<style>
:root{--ink:#3d3023;--paper:#fffaf0;--red:#cf4f43;--blue:#3f78ad;--green:#5f9557;--gold:#d5a43a;--line:#c9ad7a;--shadow:0 12px 30px #51381722}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#e9d8ad}button{font:inherit;color:inherit;touch-action:manipulation}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:#fffaf0ee;border-bottom:2px solid #cfbd97;backdrop-filter:blur(8px)}
.icon,.pill{min-height:44px;border:2px solid #cfbd97;background:#fff;border-radius:15px;font-weight:950;box-shadow:0 3px 0 #b89d6b}.icon{width:46px;font-size:21px}.pill{padding:0 11px}.brand{flex:1;min-width:0}.brand b{display:block;font-size:clamp(15px,4vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{font-weight:850;color:#80694f}
.hud{display:flex;gap:6px;flex-wrap:wrap}.hud .pill{min-width:78px}
#yard{min-height:calc(100vh - 62px);position:relative;overflow:hidden;background:linear-gradient(#a9dced 0 25%,#90b878 25% 31%,#d9bc80 31% 100%)}
.mountains{position:absolute;left:-4%;right:-4%;top:8%;height:22%;background:#779f72;clip-path:polygon(0 100%,0 64%,12% 35%,23% 71%,39% 18%,55% 70%,70% 38%,83% 76%,100% 40%,100% 100%);opacity:.72}
.sun{position:absolute;right:8%;top:5%;width:55px;height:55px;border-radius:50%;background:#f4cb58;box-shadow:0 0 0 12px #f4cb5830}
.hanok{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(310px,56vw);height:112px;background:#e8d0a2;border:5px solid #68462e;border-radius:4px}.hanok:before{content:"";position:absolute;left:-35px;right:-35px;top:-42px;height:48px;background:#4d453d;clip-path:polygon(0 72%,36% 42%,50% 0,64% 42%,100% 72%,94% 100%,6% 100%)}.hanok:after{content:"";position:absolute;left:18px;right:18px;top:18px;bottom:12px;background:repeating-linear-gradient(90deg,#6f472e 0 10px,#f4e2b9 10px 44px);border:3px solid #6f472e}
.wall{position:absolute;left:0;right:0;top:36%;height:18px;background:repeating-linear-gradient(90deg,#cab07d 0 34px,#b89964 34px 38px);box-shadow:0 5px 0 #8b6c45}
.yardTitle{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:4;background:#fff8e7e8;border:3px solid #b68c4c;border-radius:18px;padding:8px 16px;text-align:center;box-shadow:var(--shadow);pointer-events:none}.yardTitle b{display:block;font-size:clamp(19px,5vw,30px)}.yardTitle small{font-weight:850;color:#786247}
.spot{position:absolute;transform:translate(-50%,-50%);width:112px;min-height:92px;border:3px solid #8e7149;border-radius:22px;background:#fff9e7e8;box-shadow:0 7px 0 #a98a59;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:1000;z-index:8;padding:8px;cursor:pointer}.spot:active{transform:translate(-50%,calc(-50% + 4px));box-shadow:0 3px 0 #a98a59}.spot .emoji{font-size:33px}.spot small{font-size:11px;color:#755f46}.spot.locked{filter:grayscale(.55);opacity:.68;background:#e9dfc8}.spot.new{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 7px 0 #a98a59,0 0 0 12px #ffd45e55}}
#spot-tuho{left:18%;top:56%}#spot-jegi{left:48%;top:61%}#spot-hop{left:80%;top:56%}#spot-ddakji{left:18%;top:82%}#spot-flower{left:50%;top:84%}#spot-yut{left:82%;top:82%}
.player{position:absolute;left:50%;top:73%;transform:translate(-50%,-85%);z-index:15;width:70px;height:90px;display:grid;place-items:end center;transition:left .34s ease,top .34s ease;pointer-events:none;filter:drop-shadow(0 7px 5px #51381733)}.player img{max-width:74px;max-height:88px;object-fit:contain}.player .fallback{font-size:63px}.player:after{content:"";position:absolute;left:13px;right:13px;bottom:-3px;height:13px;border-radius:50%;background:#553b2535;z-index:-1}
.prompt{position:absolute;z-index:19;transform:translate(-50%,-100%);min-width:155px;max-width:210px;padding:9px 10px;border:3px solid #87663f;border-radius:17px;background:#fffdf5;box-shadow:var(--shadow);text-align:center;font-weight:950}.prompt button{margin-top:6px;min-height:38px;border:0;border-radius:12px;background:#cf4f43;color:#fff;font-weight:1000;width:100%}
.yardFooter{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:#fff8e9ed;border:2px solid #bca071;border-radius:999px;padding:7px 12px;font-weight:900;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.decor{position:absolute;z-index:3;font-size:42px;filter:drop-shadow(0 5px 4px #51381733)}.jarDecor{left:6%;top:69%}.flagDecor{right:5%;top:68%}.kiteDecor{right:8%;top:41%}
#play{min-height:calc(100vh - 62px);background:linear-gradient(#b9e2ef 0 24%,#e3c98f 24% 100%);padding:12px}.playCard{width:min(900px,100%);margin:auto;background:#fff9eb;border:3px solid #aa8b5d;border-radius:26px;padding:14px;box-shadow:var(--shadow)}.playHead{display:flex;align-items:center;gap:8px}.playHead h2{margin:0;flex:1;font-size:clamp(21px,5vw,31px)}.mission{margin:10px 0;padding:11px 13px;border-radius:18px;background:#fff;border:2px solid #d8c39b;text-align:center;font-weight:900}.mission b{display:block;font-size:19px}.mission span{display:block;margin-top:4px;color:#796249}.scoreline{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:9px 0}.scoreline span{background:#fff;border:2px solid #d8c39b;border-radius:14px;padding:7px 10px;font-weight:1000}
.feedback{text-align:center;min-height:31px;font-weight:1000;font-size:18px;margin:8px 0}
.bigBtn{display:block;width:min(340px,100%);min-height:60px;margin:10px auto;border:0;border-radius:20px;background:#cf4f43;color:#fff;font-weight:1000;font-size:20px;box-shadow:0 6px 0 #92372f}.bigBtn.blue{background:#3f78ad;box-shadow:0 6px 0 #295879}
.tuhoField{position:relative;height:360px;border-radius:22px;overflow:hidden;background:linear-gradient(#c7eaf3 0 66%,#c7ad77 66%);touch-action:none}.tuhoJar{position:absolute;left:50%;top:45px;transform:translateX(-50%);width:102px;height:118px;border-radius:26px 26px 38px 38px;background:#9c613d;border:6px solid #5e3d2a}.tuhoJar:before{content:"";position:absolute;left:10px;right:10px;top:-15px;height:24px;border:6px solid #6a442c;border-radius:50%;background:#35271f}.tuhoStick{position:absolute;left:50%;bottom:34px;width:18px;height:122px;border-radius:12px;background:linear-gradient(90deg,#c8995d,#edd29a,#a97643);border:3px solid #6b482d;transform:translateX(-50%) rotate(0deg);transform-origin:50% 85%;cursor:grab;z-index:6}.aimHint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:13px;font-weight:950;background:#fff9;padding:4px 8px;border-radius:999px}.trailDot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff9;border:2px solid #6e5235;pointer-events:none}
.jegiField{height:390px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#c7eaf3 0 72%,#c2a76f 72%)}.jegiPlayer{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:76px;transition:left .14s}.jegiObj{position:absolute;top:20px;left:50%;font-size:42px;transform:translateX(-50%);filter:drop-shadow(0 5px 3px #0002)}.kickZone{position:absolute;left:8%;right:8%;bottom:80px;height:56px;border:4px dashed #5f955780;border-radius:999px;background:#5f95571c}.controls{display:grid;grid-template-columns:70px 1fr 1fr 70px;gap:8px;margin-top:10px}.controls button{min-height:58px;border:0;border-radius:18px;font-weight:1000;font-size:18px;background:#ead8b5;box-shadow:0 5px 0 #bca071}.controls .kick{background:#3f78ad;color:#fff;box-shadow:0 5px 0 #295879}
.hopField{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:13px;align-items:center}.hopBoard{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-width:480px;margin:auto;position:relative}.hopCell{min-height:86px;border:4px solid #fff;border-radius:17px;background:#e0ad4c;box-shadow:0 5px 0 #9b7130;font-size:28px;font-weight:1000;position:relative}.hopCell.goal{outline:7px solid #cf4f4360}.hopCell.done{background:#70aa64;color:#fff}.hopCell.skip{background:#d9d0b9;color:#755}.stone{position:absolute;font-size:31px;z-index:6;transform:translate(-50%,-50%);cursor:grab;touch-action:none}.stoneDock{position:relative;height:74px;display:flex;align-items:center;justify-content:center;border:3px dashed #b59969;border-radius:18px;background:#fff6dc;font-weight:950}.hopKid{font-size:86px;text-align:center}.hopSide{text-align:center}
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#241a13aa;padding:15px}.modal{width:min(460px,100%);background:#fffaf0;border:4px solid #c49a55;border-radius:28px;padding:22px;text-align:center;box-shadow:0 22px 70px #0005}.modal .iconBig{font-size:64px}.modal h2{margin:4px 0 7px;font-size:28px}.modal p{font-weight:850;line-height:1.55;color:#725c45}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalBtns button{min-height:52px;border:0;border-radius:16px;background:#ead7b1;font-weight:1000}.modalBtns .primary{background:#cf4f43;color:#fff}
.tutorialFinger{position:absolute;z-index:30;font-size:42px;animation:hand 1.1s ease-in-out infinite;pointer-events:none}@keyframes hand{50%{transform:translateY(10px) scale(.92)}}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:11px;height:18px;border-radius:3px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}
@media(max-width:700px){.brand small{display:none}.hud .pill{min-width:auto;padding:0 8px}.spot{width:88px;min-height:78px;border-radius:18px;padding:6px}.spot .emoji{font-size:28px}.spot b{font-size:13px}.spot small{display:none}.yardTitle{top:39%}.player{width:58px;height:76px}.player img{max-width:60px;max-height:73px}.player .fallback{font-size:52px}.hopField{grid-template-columns:1fr}.hopSide{display:grid;grid-template-columns:90px 1fr;align-items:center}.hopKid{font-size:65px}.controls{grid-template-columns:58px 1fr 1fr 58px}.yardFooter{font-size:11px}.tuhoField{height:330px}.jegiField{height:340px}}
@media(max-width:390px){#spot-tuho{left:16%}#spot-hop{left:84%}#spot-ddakji{left:16%}#spot-yut{left:84%}.spot{width:78px}.topbar{gap:5px}.pill{font-size:12px}.hud{gap:3px}}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon" id="exitBtn" aria-label="나가기">←</button>
  <div class="brand"><b>우리나라 전통놀이 마당</b><small>직접 돌아다니며 놀아요</small></div>
  <div class="hud"><button class="pill" id="soundBtn">🔊</button><button class="pill" id="coinBtn">🪙 <span id="coinCount">0</span></button><button class="pill" id="stampBtn">🔴 <span id="stampCount">0</span>/3</button></div>
</header>

<main id="yard" aria-label="전통놀이 마당">
  <div class="mountains"></div><div class="sun"></div><div class="hanok"></div><div class="wall"></div>
  <div class="yardTitle"><b>전통놀이 마당</b><small id="yardMessage">마당을 눌러 걸어가 보세요!</small></div>
  <button class="spot" id="spot-tuho" data-game="tuho"><span class="emoji">🏺</span><b>투호</b><small>당겨서 던지기</small></button>
  <button class="spot" id="spot-jegi" data-game="jegi"><span class="emoji">🪶</span><b>제기차기</b><small>움직여서 발로 톡</small></button>
  <button class="spot locked" id="spot-hop" data-game="hop"><span class="emoji">🟨</span><b>사방치기</b><small>도장 1개 필요</small></button>
  <button class="spot locked" id="spot-ddakji" disabled><span class="emoji">🟥</span><b>딱지치기</b><small>다음 리워크</small></button>
  <button class="spot locked" id="spot-flower" disabled><span class="emoji">🌺</span><b>무궁화</b><small>다음 리워크</small></button>
  <button class="spot locked" id="spot-yut" disabled><span class="emoji">🎋</span><b>윷놀이</b><small>다음 리워크</small></button>
  <div class="decor jarDecor hidden" id="decor1">🏺🏺</div><div class="decor flagDecor hidden" id="decor2">🚩</div><div class="decor kiteDecor hidden" id="decor3">🪁</div>
  <div class="player" id="player"><img id="avatarImg" alt="내 캐릭터" hidden><div class="fallback" id="avatarFallback">🧒</div></div>
  <div class="prompt hidden" id="prompt"><div id="promptText">놀이해 볼까요?</div><button id="promptPlay">놀기!</button></div>
  <div class="yardFooter">빈 마당을 눌러 이동 · 놀이기구를 누르면 가까이 가요</div>
</main>

<main id="play" class="hidden">
  <section class="playCard">
    <div class="playHead"><button class="icon" id="backBtn">←</button><h2 id="gameTitle">놀이</h2><button class="icon" id="restartBtn">↻</button></div>
    <div id="stage"></div>
  </section>
</main>

<div class="overlay hidden" id="overlay"><div class="modal"><div class="iconBig" id="resultIcon">🏅</div><h2 id="resultTitle">참 잘했어요!</h2><p id="resultText"></p><div class="modalBtns"><button id="againBtn">한 번 더</button><button class="primary" id="yardBtn">마당으로</button></div></div></div>
<div class="confetti" id="confetti"></div>

<script src="../../kidscade-game-sdk.js" data-game-id="toddler_traditional_play_yard" data-title="우리나라 전통놀이 마당" data-shell="false"></script>
<script>
(function(){
'use strict';
var SAVE_KEY='kidscade_game_v2:toddler_traditional_play_yard:yard';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),overlay=$('overlay'),current=null,raf=0,timers=[],audioCtx=null;
var state=loadState(),soundOn=state.soundOn!==false,nearGame=null;
var playerPos={x:50,y:73};
var spots={tuho:{x:18,y:56,title:'투호'},jegi:{x:48,y:61,title:'제기차기'},hop:{x:80,y:56,title:'사방치기'}};

function loadState(){try{var s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');return {stamps:Array.isArray(s.stamps)?s.stamps:[],coins:Number(s.coins)||0,soundOn:s.soundOn!==false,tutorials:s.tutorials||{}}}catch(e){return {stamps:[],coins:0,soundOn:true,tutorials:{}}}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function cleanup(){if(raf){cancelAnimationFrame(raf);raf=0}timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
function hasStamp(id){return state.stamps.indexOf(id)>=0}
function unlocked(id){return id!=='hop'||state.stamps.length>=1}
function tone(f,d,type){if(!soundOn)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(d||.1));o.stop(audioCtx.currentTime+(d||.1))}catch(e){}}
function successSound(){tone(660,.1);later(function(){tone(880,.16)},90)}
function missSound(){tone(170,.1,'square')}
function confetti(){var box=$('confetti');box.innerHTML='';var c=['#c94b43','#3d74a8','#e0b13f','#5e8d58','#8d5ca6'];for(var i=0;i<36;i++){var p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=c[i%c.length];p.style.animationDelay=(Math.random()*.25)+'s';box.appendChild(p)}later(function(){box.innerHTML=''},2000)}
function avatarSource(){var key='kidscade-avatar-studio-preview',src='';try{var h=parent&&parent!==window&&parent.location.origin===location.origin?parent:window;src=h.localStorage&&h.localStorage.getItem(key)||localStorage.getItem(key)||'';if(!src&&typeof h.renderAvatarSVG==='function'){src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(h.renderAvatarSVG())}}catch(e){}return src}
function loadAvatar(){var src=avatarSource();if(src&&src.indexOf('data:image')===0){$('avatarImg').src=src;$('avatarImg').hidden=false;$('avatarFallback').hidden=true}else{$('avatarImg').hidden=true;$('avatarFallback').hidden=false}}
function updateHud(){
 $('coinCount').textContent=state.coins;$('stampCount').textContent=Math.min(3,state.stamps.length);
 var hop=$('spot-hop'),wasLocked=hop.classList.contains('locked');
 hop.classList.toggle('locked',!unlocked('hop'));hop.disabled=!unlocked('hop');
 hop.querySelector('small').textContent=unlocked('hop')?'돌 던지고 콩콩':'도장 1개 필요';
 if(wasLocked&&unlocked('hop')&&!hasStamp('hop')){hop.classList.add('new');later(function(){hop.classList.remove('new')},3500)}
 $('decor1').classList.toggle('hidden',state.stamps.length<1);$('decor2').classList.toggle('hidden',state.stamps.length<2);$('decor3').classList.toggle('hidden',state.stamps.length<3);
 $('yardMessage').textContent=state.stamps.length===0?'투호나 제기차기부터 해 볼까요?':state.stamps.length===1?'새 놀이 사방치기가 열렸어요!':state.stamps.length===2?'마당이 점점 신나졌어요!':'세 놀이를 모두 해냈어요! 다음 마당도 준비 중!';
}
function movePlayer(x,y,game){
 x=Math.max(7,Math.min(93,x));y=Math.max(45,Math.min(92,y));playerPos={x:x,y:y};$('player').style.left=x+'%';$('player').style.top=y+'%';nearGame=null;$('prompt').classList.add('hidden');
 if(game){later(function(){if(!unlocked(game))return;nearGame=game;var s=spots[game];$('promptText').textContent=s.title+' 해 볼까요?';var p=$('prompt');p.style.left=s.x+'%';p.style.top=(s.y-7)+'%';p.classList.remove('hidden')},360)}
}
function showYard(){cleanup();current=null;overlay.classList.add('hidden');$('play').classList.add('hidden');$('yard').classList.remove('hidden');updateHud();window.scrollTo(0,0)}
function openGame(id){if(!unlocked(id))return;cleanup();current=id;$('yard').classList.add('hidden');$('play').classList.remove('hidden');overlay.classList.add('hidden');renderCurrent();window.scrollTo(0,0);tone(520,.06)}
function complete(id,text){
 cleanup();var first=!hasStamp(id);if(first){state.stamps.push(id);state.coins+=3}else state.coins+=1;save();updateHud();
 try{if(parent&&parent!==window)parent.postMessage({type:'kidscade:game-result',gameId:'toddler_traditional_play_yard',miniGame:id,stamps:state.stamps.length,coins:state.coins},location.origin)}catch(e){}
 $('resultIcon').textContent=first?'🔴':'🪙';$('resultTitle').textContent=first?'새 도장을 받았어요!':'또 성공했어요!';
 $('resultText').textContent=text+(first?' 엽전 3개도 받았어요.':' 엽전 1개를 더 받았어요.');overlay.classList.remove('hidden');successSound();confetti()
}
function tutorialOnce(id,html,left,top){if(state.tutorials[id])return;state.tutorials[id]=true;save();var h=document.createElement('div');h.className='tutorialFinger';h.innerHTML='☝️';h.style.left=left;h.style.top=top;stage.appendChild(h);var note=document.createElement('div');note.className='feedback';note.textContent=html;stage.appendChild(note);later(function(){h.remove();note.remove()},2600)}
function renderCurrent(){if(current==='tuho')renderTuho();else if(current==='jegi')renderJegi();else if(current==='hop')renderHop()}

function renderTuho(){
 var tries=0,hits=0,dragging=false,start=null,cur=null,flight=false;
 $('gameTitle').textContent='🏺 투호 · 당겨서 던지기';
 stage.innerHTML='<div class="mission"><b>막대를 잡아 뒤로 당겼다가 놓아요!</b><span>가운데를 향하고, 너무 살살 당기지만 않으면 돼요.</span></div><div class="scoreline"><span>성공 <b id="tuhoHit">0</b>/2</span><span>기회 <b id="tuhoTry">0</b>/6</span></div><div id="tuhoField" class="tuhoField"><div class="tuhoJar"></div><div id="tuhoStick" class="tuhoStick"></div><div class="aimHint">막대를 잡아 아래로 당겨요 ↓</div></div><div id="tuhoFb" class="feedback">막대를 직접 잡아 보세요.</div>';
 var field=$('tuhoField'),stick=$('tuhoStick');
 function pt(e){var r=field.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}}
 function drawAim(){
  field.querySelectorAll('.trailDot').forEach(function(d){d.remove()});if(!start||!cur)return;
  var pull=Math.min(130,Math.hypot(cur.x-start.x,cur.y-start.y));if(pull<10)return;
  var aim=(start.x-cur.x)*1.25,landX=start.x+aim;
  for(var i=1;i<=5;i++){var t=i/6,d=document.createElement('i');d.className='trailDot';d.style.left=(start.x+(landX-start.x)*t)+'px';d.style.top=(field.clientHeight-95-(260*t)+95*Math.sin(Math.PI*t))+'px';field.appendChild(d)}
 }
 function down(e){if(flight)return;e.preventDefault();dragging=true;stick.setPointerCapture&&stick.setPointerCapture(e.pointerId);start=pt(e);cur=start;stick.style.cursor='grabbing'}
 function move(e){if(!dragging)return;e.preventDefault();cur=pt(e);var dx=Math.max(-85,Math.min(85,cur.x-start.x)),dy=Math.max(0,Math.min(120,cur.y-start.y));stick.style.transform='translateX(calc(-50% + '+dx+'px)) translateY('+dy*.35+'px) rotate('+(-dx*.22)+'deg)';drawAim()}
 function up(e){
  if(!dragging||flight)return;dragging=false;flight=true;stick.style.cursor='grab';var p=pt(e),dx=p.x-start.x,dy=Math.max(0,p.y-start.y),power=Math.min(1,Math.hypot(dx,dy)/95),aim=(-dx)*1.22;
  tries++;$('tuhoTry').textContent=tries;field.querySelectorAll('.trailDot').forEach(function(d){d.remove()});
  var r=field.getBoundingClientRect(),sx=r.width/2,sy=r.height-95,ex=sx+aim,ey=96,t0=performance.now(),dur=650;
  function fly(now){var t=Math.min(1,(now-t0)/dur),x=sx+(ex-sx)*t,y=sy+(ey-sy)*t-105*Math.sin(Math.PI*t);stick.style.left=x+'px';stick.style.bottom='auto';stick.style.top=y+'px';stick.style.transform='translate(-50%,-50%) rotate('+(t*260)+'deg)';if(t<1){raf=requestAnimationFrame(fly);return}
    var jarCenter=r.width/2,ok=Math.abs(ex-jarCenter)<58&&power>.46;
    if(ok){hits++;$('tuhoHit').textContent=hits;$('tuhoFb').textContent='쏙! 항아리에 들어갔어요!';successSound()}else{$('tuhoFb').textContent=power<=.46?'조금 더 힘껏 당겨 볼까요?':'항아리 가운데를 향해 당겨 봐요!';missSound()}
    later(function(){stick.style.left='50%';stick.style.top='auto';stick.style.bottom='34px';stick.style.transform='translateX(-50%)';flight=false;if(hits>=2)complete('tuho','막대를 직접 던져 두 번 항아리에 넣었어요!');else if(tries>=6){tries=0;$('tuhoTry').textContent=0;$('tuhoFb').textContent='괜찮아요! 다시 여섯 번 해 볼 수 있어요.'}},520)
  }raf=requestAnimationFrame(fly)
 }
 stick.addEventListener('pointerdown',down);field.addEventListener('pointermove',move);field.addEventListener('pointerup',up);field.addEventListener('pointercancel',up);
 tutorialOnce('tuho','막대를 잡고 아래로 당긴 뒤 손을 떼요.','48%','66%')
}

function renderJegi(){
 var x=50,jx=50,jy=8,vy=22,drift=7,last=performance.now(),score=0,cool=false,lastFoot='';
 $('gameTitle').textContent='🪶 제기차기 · 움직여서 발로 톡';
 stage.innerHTML='<div class="mission"><b>제기 아래로 움직여서 발로 톡!</b><span>왼발·오른발을 번갈아 차면 제기가 가운데로 돌아와요.</span></div><div class="scoreline"><span>연속 <b id="jegiScore">0</b>/5</span></div><div id="jegiField" class="jegiField"><div class="kickZone"></div><div id="jegiPlayer" class="jegiPlayer">🧒</div><div id="jegiObj" class="jegiObj">🪶</div></div><div class="controls"><button id="leftBtn">◀</button><button class="kick" data-foot="L">왼발 톡!</button><button class="kick" data-foot="R">오른발 톡!</button><button id="rightBtn">▶</button></div><div id="jegiFb" class="feedback">제기 아래로 움직여 보세요!</div>';
 var field=$('jegiField');
 function place(){ $('jegiPlayer').style.left=x+'%';$('jegiObj').style.left=jx+'%';$('jegiObj').style.top=jy+'%'}
 function move(dx){x=Math.max(10,Math.min(90,x+dx));place();tone(320,.04)}
 function kick(foot){
  if(cool)return;cool=true;var close=Math.abs(jx-x)<18,low=jy>61&&jy<83;
  if(close&&low){score++;$('jegiScore').textContent=score;vy=-(34+score*1.2);jy=Math.max(48,jy-2);drift+=(foot==='L'?4:-4);drift*=.7;if(lastFoot===foot)drift+=(foot==='L'?5:-5);lastFoot=foot;$('jegiFb').textContent='톡! '+score+'번 연속!';successSound();if(score>=5)later(function(){complete('jegi','제기를 따라 움직이며 다섯 번 연속 찼어요!')},450)}
  else{ $('jegiFb').textContent=!close?'제기 아래로 먼저 움직여요!':'조금 더 내려왔을 때 톡!';missSound()}
  later(function(){cool=false},150)
 }
 $('leftBtn').onclick=function(){move(-10)};$('rightBtn').onclick=function(){move(10)};Array.from(stage.querySelectorAll('[data-foot]')).forEach(function(b){b.onclick=function(){kick(b.dataset.foot)}});
 function loop(now){var dt=Math.min(.04,(now-last)/1000);last=now;vy+=42*dt;jy+=vy*dt;jx+=drift*dt;if(jx<9||jx>91){drift*=-1;jx=Math.max(9,Math.min(91,jx))}
  if(jy>86){score=0;$('jegiScore').textContent=0;$('jegiFb').textContent='툭! 떨어졌어요. 다시 이어서 차 봐요!';jy=8;vy=22;drift=(Math.random()>.5?1:-1)*(5+Math.random()*5);missSound()}
  place();raf=requestAnimationFrame(loop)
 }place();raf=requestAnimationFrame(loop);
 window.onkeydown=function(e){if(current!=='jegi')return;if(e.key==='ArrowLeft')move(-8);if(e.key==='ArrowRight')move(8);if(e.key==='z'||e.key==='Z')kick('L');if(e.key==='x'||e.key==='X')kick('R')};
 tutorialOnce('jegi','화살표로 아래에 가고, 발 버튼으로 톡!','49%','70%')
}

function renderHop(){
 var target=1,stonePlaced=false,next=1,stoneCell=0;
 $('gameTitle').textContent='🟨 사방치기 · 돌 던지고 콩콩';
 stage.innerHTML='<div class="mission"><b>먼저 돌을 '+target+'번 칸에 넣어요!</b><span>돌이 들어가면 그 칸은 밟지 않고 1부터 끝까지 콩콩!</span></div><div class="hopField"><div><div id="hopBoard" class="hopBoard"></div><div id="stoneDock" class="stoneDock"><span id="stone" class="stone">🪨</span>돌을 잡아 목표 칸으로 옮겨요</div></div><div class="hopSide"><div class="hopKid">🧒</div><div><div class="scoreline"><span>판 <b id="hopRound">1</b>/3</span></div><div id="hopFb" class="feedback">돌부터 던져 볼까요?</div></div></div></div>';
 var board=$('hopBoard'),stone=$('stone'),drag=false;
 function draw(){
  board.innerHTML='';for(var i=1;i<=6;i++){var b=document.createElement('button');b.className='hopCell'+(i===target&&!stonePlaced?' goal':'')+(stonePlaced&&i===stoneCell?' skip':'')+(stonePlaced&&i<next&&i!==stoneCell?' done':'');b.dataset.n=i;b.textContent=i;board.appendChild(b)}
 }
 function resetStone(){stone.style.left='50%';stone.style.top='50%';stone.style.position='absolute';$('stoneDock').appendChild(stone)}
 function stoneDown(e){if(stonePlaced)return;drag=true;e.preventDefault();stone.style.pointerEvents='none';stone.setPointerCapture&&stone.setPointerCapture(e.pointerId)}
 function stoneMove(e){if(!drag)return;var r=document.body.getBoundingClientRect();stone.style.position='fixed';stone.style.left=e.clientX+'px';stone.style.top=e.clientY+'px';stone.style.zIndex=100}
 function stoneUp(e){
  if(!drag)return;drag=false;var el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest&&el.closest('.hopCell');stone.style.pointerEvents='auto';
  if(cell&&Number(cell.dataset.n)===target){stonePlaced=true;stoneCell=target;next=1;while(next===stoneCell)next++;$('hopFb').textContent='좋아요! '+next+'번부터 콩콩!';successSound();stone.style.position='absolute';stone.style.left='50%';stone.style.top='50%';cell.appendChild(stone);draw();board.querySelector('[data-n="'+stoneCell+'"]').appendChild(stone)}
  else{$('hopFb').textContent=target+'번 칸에 돌을 넣어 봐요!';missSound();resetStone()}
 }
 stone.addEventListener('pointerdown',stoneDown);document.addEventListener('pointermove',stoneMove);document.addEventListener('pointerup',stoneUp);
 board.addEventListener('click',function(e){
  var b=e.target.closest('.hopCell');if(!b||!stonePlaced)return;var n=Number(b.dataset.n);if(n===stoneCell){$('hopFb').textContent='돌이 있는 칸은 건너뛰어요!';missSound();return}
  if(n!==next){$('hopFb').textContent='지금은 '+next+'번 차례예요!';missSound();return}
  successSound();next++;while(next===stoneCell)next++;if(next<=6){$('hopFb').textContent='콩! 이제 '+next+'번!';draw();board.querySelector('[data-n="'+stoneCell+'"]').appendChild(stone);return}
  if(target>=3){later(function(){complete('hop','돌을 던지고, 돌이 있는 칸을 건너뛰며 세 판을 완주했어요!')},350);return}
  target++;stonePlaced=false;stoneCell=0;next=1;$('hopRound').textContent=target;$('hopFb').textContent='좋아! 이번에는 '+target+'번 칸에 돌을 던져요.';draw();resetStone()
 });
 draw();resetStone();tutorialOnce('hop','돌을 목표 숫자 칸으로 끌어 놓아요.','45%','68%')
}

$('yard').addEventListener('click',function(e){
 var s=e.target.closest&&e.target.closest('.spot');if(s){var id=s.dataset.game;if(!id||!unlocked(id))return;var p=spots[id];movePlayer(p.x,p.y+8,id);return}
 if(e.target.closest&&e.target.closest('.prompt'))return;var r=$('yard').getBoundingClientRect();movePlayer((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)
});
$('promptPlay').onclick=function(){if(nearGame)openGame(nearGame)};
$('backBtn').onclick=showYard;$('restartBtn').onclick=function(){cleanup();renderCurrent()};$('againBtn').onclick=function(){overlay.classList.add('hidden');cleanup();renderCurrent()};$('yardBtn').onclick=showYard;
$('stampBtn').onclick=function(){showYard();$('yardMessage').textContent=state.stamps.length+'/3 도장 · 마당 장식 '+state.stamps.length+'개'};
$('coinBtn').onclick=function(){$('yardMessage').textContent='엽전은 첫 성공 3개, 다시 성공하면 1개씩 받아요!'};
$('soundBtn').onclick=function(){soundOn=!soundOn;state.soundOn=soundOn;save();this.textContent=soundOn?'🔊':'🔇';if(soundOn)tone(660,.08)};
$('exitBtn').onclick=function(){try{if(window.KidscadeGame&&KidscadeGame.exit())return}catch(e){}try{if(parent&&parent!==window){parent.postMessage({type:'kidscade:close-game'},location.origin);return}}catch(e){}location.href='../../'};
window.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!overlay.classList.contains('hidden'))overlay.classList.add('hidden');else if(current)showYard()}});
$('soundBtn').textContent=soundOn?'🔊':'🔇';loadAvatar();updateHud();movePlayer(50,73);try{window.KidscadeGame&&KidscadeGame.start({mode:'traditional-yard-rework'})}catch(e){}
})();
</script>
