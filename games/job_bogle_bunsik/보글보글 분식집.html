<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>보글보글 분식집</title>
<link rel="stylesheet" href="bunsik-kitchen.css?v=4">
<script type="importmap">{"imports":{"three":"../../assets/vendor/three-r160/three.module.js","three/addons/":"../../assets/vendor/three-r160/addons/"}}</script>
<script src="../../audio-manager.js?v=20260917-1"></script>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="shop-name">보글보글 분식집</div>
    <div class="hud-stats">
      <span>시간 <b id="time">120</b></span>
      <span>점수 <b id="score">0</b></span>
      <span>서빙 <b id="served">0</b></span>
      <button id="soundBtn" type="button">SOUND ON</button>
    </div>
  </header>

  <main class="game-wrap">
    <canvas id="gameCanvas" aria-label="3D 분식집 주방"></canvas>

    <div id="orderStrip" class="order-strip" aria-label="현재 주문"></div>
    <div id="stationLabels" class="world-labels" aria-hidden="true"></div>

    <div id="heldBadge" class="held-badge">
      <small>들고 있음</small><b id="heldText">빈손</b>
    </div>

    <div id="prompt" class="prompt">WASD로 움직이세요</div>

    <div class="mobile-controls">
      <div id="joystick" class="joystick" aria-label="이동 조이스틱">
        <div class="stick-base"></div><div id="stickKnob" class="stick-knob"></div>
      </div>
      <button id="actionBtn" class="action-btn" type="button">행동</button>
    </div>
  </main>
</div>

<div id="startOverlay" class="overlay show">
  <div class="start-card">
    <h1>보글보글 분식집</h1>
    <p>주방을 직접 뛰어다니며 재료를 가져오고, 요리하고, 완성된 음식을 서빙하세요.</p>
    <div class="controls-note"><b>PC</b> WASD 이동 · E 행동 <span></span><b>모바일</b> 조이스틱 · 행동</div>
    <button id="startBtn" class="primary big" type="button">영업 시작</button>
  </div>
</div>

<div id="endOverlay" class="overlay">
  <div class="start-card">
    <small>오늘 영업 끝</small>
    <h1 id="endTitle">수고했어요</h1>
    <p id="endText"></p>
    <button id="restartBtn" class="primary big" type="button">다시 영업하기</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="bunsik-kitchen.js?v=4"></script>
</body>
</html>
