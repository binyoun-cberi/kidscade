    <script src="vendor/matter.min.js"></script>
    <script>
        // --- 교사 지정 결과 관련 로직 ---
        let cheatData = {}; 
        
        const titleEl = document.getElementById('main-title');
        const debugPanel = document.getElementById('debug-panel');

            debugPanel.classList.add('open');

        document.getElementById('add-cheat-btn').addEventListener('click', () => {
            const list = document.getElementById('cheat-list');
            const newRow = document.createElement('div');
            newRow.className = 'flex gap-2 cheat-row mt-2';

                <input type="text" placeholder="학생 이름" class="cheat-name flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                <span class="text-white self-center">👉</span>
                <input type="text" placeholder="강제 결과" class="cheat-result flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
            `;
            list.appendChild(newRow);
        });

        function parseCheatData() {
            // Kidscade 학생판에서는 결과 지정/조작 기능을 사용하지 않습니다.
            cheatData = {};
        }

        // --- 오디오 시스템 ---
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextClass ? new AudioContextClass() : null;
        let lastSoundTime = 0;

        function playSound(type, velocity) {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastSoundTime < 50) return;
            lastSoundTime = now;

            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const vol = Math.min(Math.max(velocity / 20, 0.05), 0.3);

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bumper') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(vol * 2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'square';
                const notes = [440, 554, 659, 880]; 
                notes.forEach((freq, i) => {
                    const oscWin = audioCtx.createOscillator();
                    const gainWin = audioCtx.createGain();
                    oscWin.type = 'square';
                    oscWin.frequency.value = freq;
                    oscWin.connect(gainWin);
                    gainWin.connect(audioCtx.destination);
                    
                    const startTime = audioCtx.currentTime + i * 0.1;
                    gainWin.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainWin.gain.setValueAtTime(0.2, startTime);
                    gainWin.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                    
                    oscWin.start(startTime);
                    oscWin.stop(startTime + 0.5);
                });
            }
        }

        let Engine, Render, Runner, Bodies, Composite, Body, Events, Vector, Constraint;

        const MATTER_URLS = [
            './vendor/matter.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js',
            'https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js',
            'https://unpkg.com/matter-js@0.19.0/build/matter.min.js'
        ];

        function setEngineStatus(message, isError = false) {
            const status = document.getElementById('engine-status');
            if (!status) return;
            status.textContent = message || '';
            status.className = isError
                ? 'text-xs text-red-300 text-center mt-2 min-h-[1rem] font-bold'
                : 'text-xs text-yellow-300 text-center mt-2 min-h-[1rem]';
        }

        function loadMatterScript(index = 0) {
            return new Promise((resolve, reject) => {
                if (window.Matter) {
                    resolve(window.Matter);
                    return;
                }

                if (index >= MATTER_URLS.length) {
                    reject(new Error('Matter.js를 불러오지 못했습니다.'));
                    return;
                }

                const script = document.createElement('script');
                script.src = MATTER_URLS[index];
                script.async = true;
                script.onload = () => {
                    if (window.Matter) {
                        resolve(window.Matter);
                    } else {
                        loadMatterScript(index + 1).then(resolve).catch(reject);
                    }
                };
                script.onerror = () => {
                    loadMatterScript(index + 1).then(resolve).catch(reject);
                };
                document.head.appendChild(script);
            });
        }

        function bindMatterEngine() {
            ({ Engine, Render, Runner, Bodies, Composite, Body, Events, Vector, Constraint } = window.Matter);
        }

        function bootstrapGame() {
            const startBtn = document.getElementById('start-btn');
            const originalText = startBtn ? startBtn.textContent : '레이스 시작!';

            if (startBtn) {
                startBtn.disabled = true;
                startBtn.textContent = '물리 엔진 준비 중...';
                startBtn.classList.add('opacity-70', 'cursor-wait');
            }
            setEngineStatus('물리 엔진을 불러오는 중입니다...');

            loadMatterScript()
                .then(() => {
                    bindMatterEngine();
                    initGame();
                    if (startBtn) {
                        startBtn.disabled = false;
                        startBtn.textContent = originalText.trim() || '레이스 시작!';
                        startBtn.classList.remove('opacity-70', 'cursor-wait');
                    }
                    setEngineStatus('');
                })
                .catch((err) => {
                    console.error(err);
                    if (startBtn) {
                        startBtn.disabled = true;
                        startBtn.textContent = '물리 엔진 로드 실패';
                        startBtn.classList.add('opacity-70');
                    }
                    setEngineStatus('물리 엔진을 불러오지 못했습니다. 페이지를 새로고침해 주세요.', true);
                });
        }

        let engine, runner;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'setup'; 
        let marbles = [];
        let mapElements = [];
        let slotZones = [];
        let results = [];
        let motorizedWheels = []; 
        let dynamicSlopes = []; 
        let pendingSpringRemovals = [];
        let cleanFunnelZone = null;
        let isFinished = false;
        let finishLineY = 0; 
        
        let startBoxBottom; 

        let countdownTimer = null;
        let countdownValue = 3;
        let countdownSeconds = 3;
        let isCountdownActive = false;
        let useCountdown = true;
        let useOneMarblePerSlot = false;
        let gamePurpose = 'winner';
        let useCloseRace = true;
        const CONFIG_KEY = 'kidscade.bumperRoulette.student.v1';
        let lastLeaderboardPaint = 0;

        const WORLD_WIDTH = 1200;
        let WORLD_HEIGHT = 15000; 
        const MARBLE_RADIUS = 13; 

        let camera = { x: 0, y: 0, scale: 1, targetY: 0 };
        const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#F97316', '#bef264', '#fca5a5'];

        function saveGameConfig() {
            try {
                const rows = [...document.querySelectorAll('.cheat-row')].map(row => ({
                    name: row.querySelector('.cheat-name')?.value || '',
                    result: row.querySelector('.cheat-result')?.value || ''
                }));
                const payload = {
                    names: document.getElementById('names-input').value,
                    slots: document.getElementById('slots-input').value,
                    purpose: document.getElementById('game-purpose').value,
                    closeRace: document.getElementById('close-race').checked,
                    useCountdown: document.getElementById('use-countdown').checked,
                    countdown: getCountdownSeconds(),
                    uniqueSlot: document.getElementById('one-marble-per-slot').checked,
                    teacherResults: rows
                };
                localStorage.setItem(CONFIG_KEY, JSON.stringify(payload));
            } catch (e) { console.warn('범퍼 룰렛 설정 저장 실패', e); }
        }

        function restoreTeacherRows(rows) {
            const list = document.getElementById('cheat-list');
            list.innerHTML = '';
            const source = Array.isArray(rows) && rows.length ? rows : [{name:'', result:''}];
            source.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex gap-2 cheat-row mt-2';
                row.innerHTML = `
                    <input type="text" placeholder="학생 이름" class="cheat-name flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                    <span class="text-white self-center">👉</span>
                    <input type="text" placeholder="지정 결과" class="cheat-result flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none">
                `;
                row.querySelector('.cheat-name').value = item.name || '';
                row.querySelector('.cheat-result').value = item.result || '';
                list.appendChild(row);
            });
        }

        function loadGameConfig() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); } catch {}
            if (!saved) return;
            if (typeof saved.names === 'string') document.getElementById('names-input').value = saved.names;
            if (typeof saved.slots === 'string') document.getElementById('slots-input').value = saved.slots;
            if (saved.purpose) document.getElementById('game-purpose').value = saved.purpose;
            document.getElementById('close-race').checked = saved.closeRace !== false;
            document.getElementById('use-countdown').checked = saved.useCountdown !== false;
            if (saved.countdown) document.getElementById('countdown-seconds').value = saved.countdown;
            document.getElementById('one-marble-per-slot').checked = Boolean(saved.uniqueSlot);
            restoreTeacherRows(saved.teacherResults);
        }

        function syncPurposeUI() {
            const purpose = document.getElementById('game-purpose').value;
            const countdown = document.getElementById('use-countdown');
            const countdownInput = document.getElementById('countdown-seconds');
            const help = document.getElementById('purpose-help');
            const start = document.getElementById('start-btn');
            if (purpose === 'assign') {
                countdown.checked = false;
                countdown.disabled = true;
                countdownInput.disabled = true;
                help.textContent = '모든 구슬이 끝까지 달려서 결과 칸을 받아요.';
                start.textContent = '🚀 모두 출발!';
            } else {
                countdown.disabled = false;
                countdownInput.disabled = !countdown.checked;
                help.textContent = '가장 먼저 결승선에 도착한 친구가 오늘의 주인공!';
                start.textContent = '🚀 레이스 시작!';
            }
        }

        function loadClassroomNames() {
            try {
                const room = Gulliver.getClassroom();
                if (!room.students || !room.students.length) {
                    Gulliver.toast('먼저 우리 반에서 학생 명단을 저장해 주세요.');
                    return;
                }
                document.getElementById('names-input').value = room.students.map(s => s.name).join('\n');
                saveGameConfig();
                Gulliver.toast((room.className || '우리 반') + ' ' + room.students.length + '명을 불러왔습니다.');
            } catch (e) { alert('우리 반 명단을 불러오지 못했습니다.'); }
        }


        function getCountdownSeconds() {
            const input = document.getElementById('countdown-seconds');
            const raw = Number(input ? input.value : 3);
            const safeSeconds = Number.isFinite(raw) ? Math.round(raw) : 3;
            const clamped = Math.max(1, Math.min(60, safeSeconds));
            if (input) input.value = clamped;
            return clamped;
        }

        function resetCountdownDisplay() {
            countdownSeconds = getCountdownSeconds();
            countdownValue = countdownSeconds;
            const cdNum = document.getElementById('countdown-number');
            const cdLabel = document.getElementById('countdown-label');
            if (cdNum) cdNum.innerText = String(countdownValue);
            if (cdLabel) cdLabel.innerText = `1위 도착! ${countdownSeconds}초 후 종료`;
        }

        function setHudVisible(visible) {
            const hud = document.getElementById('hud');
            if (!hud) return;
            hud.classList.toggle('hidden', !visible);
        }

        function syncCountdownInputState() {
            const toggle = document.getElementById('use-countdown');
            const input = document.getElementById('countdown-seconds');
            if (!toggle || !input) return;
            input.disabled = !toggle.checked;
        }

        function getSlotByX(x) {
            return slotZones.find(zone => x >= zone.x && x < zone.x + zone.width) || null;
        }

        function getFreeSlotZones() {
            return slotZones.filter(zone => !zone.occupied && (!useOneMarblePerSlot || !zone.reservedFor));
        }

        function reserveTeacherSlots() {
            slotZones.forEach(zone => { zone.reservedFor = null; });
            if (!useOneMarblePerSlot) return true;
            for (const [name, result] of Object.entries(cheatData)) {
                const zone = slotZones.find(z => z.text === result && !z.reservedFor);
                if (!zone) return false;
                zone.reservedFor = name;
            }
            return true;
        }

        function getNearestFreeSlot(x) {
            const freeSlots = getFreeSlotZones();
            if (freeSlots.length === 0) return null;
            return freeSlots.slice().sort((a, b) => Math.abs(a.centerX - x) - Math.abs(b.centerX - x))[0];
        }

        function getPreferredSlotForMarble(marble, fallbackX = null) {
            if (!slotZones.length) return null;

            const targetText = cheatData[marble.name];
            if (targetText) {
                const forced = useOneMarblePerSlot
                    ? slotZones.find(z => z.reservedFor === marble.name && !z.occupied)
                    : slotZones.find(z => z.text === targetText);
                if (forced) return forced;
            }

            const x = fallbackX ?? marble.body.position.x;
            const physical = getSlotByX(x);
            if (!useOneMarblePerSlot) return physical;
            if (physical && !physical.occupied) return physical;
            return getNearestFreeSlot(x);
        }

        function captureMarbleInSlot(marble, slot) {
            if (!slot) return;

            slot.occupiedCount = (slot.occupiedCount || 0) + 1;

            const isTeacherDirected = Boolean(cheatData[marble.name]);
            if (useOneMarblePerSlot || isTeacherDirected) {
                if (useOneMarblePerSlot) {
                    slot.occupied = true;
                    slot.occupiedBy = marble.name;
                    slot.reservedFor = null;
                }
                Body.setVelocity(marble.body, { x: 0, y: 0 });
                Body.setAngularVelocity(marble.body, 0);
                Body.setPosition(marble.body, { x: slot.centerX, y: slot.captureY });
                Body.setStatic(marble.body, true);
                marble.body.frictionAir = 1;
            } else {
                marble.body.frictionAir = 0.5;
            }
        }

        function queueSpringRemoval(springBody) {
            if (!springBody || springBody.springDead) return;
            springBody.springDead = true;
            pendingSpringRemovals.push(springBody);
        }

        function flushPendingSpringRemovals() {
            if (!pendingSpringRemovals.length) return;
            const removals = pendingSpringRemovals.splice(0);
            removals.forEach(springBody => {
                Composite.remove(engine.world, springBody);
                const index = mapElements.indexOf(springBody);
                if (index > -1) mapElements.splice(index, 1);
            });
        }

        function handleSpringHit(marbleBody, springBody) {
            if (!springBody || springBody.springDead) return;

            playSound('bumper', 30);
            const dirX = marbleBody.position.x >= springBody.position.x ? 1 : -1;
            Body.setVelocity(marbleBody, {
                x: dirX * (10 + Math.random() * 16),
                y: -20 - Math.random() * 20
            });

            springBody.springUsesLeft = Math.max(0, (springBody.springUsesLeft || 1) - 1);
            if (springBody.springUsesLeft <= 0) {
                queueSpringRemoval(springBody);
            } else {
                springBody.render.fillStyle = springBody.springUsesLeft === 1 ? '#7E22CE' : '#A855F7';
            }
        }

        function makeSpringBody(x, y) {
            const springBody = Bodies.rectangle(x, y, 50, 15, {
                isStatic: true,
                render: { fillStyle: '#A855F7' },
                friction: 0,
                restitution: 0.2,
                angle: (Math.random() - 0.5) * Math.PI,
                label: 'spring'
            });
            springBody.springMaxUses = 1 + Math.floor(Math.random() * 3);
            springBody.springUsesLeft = springBody.springMaxUses;
            springBody.springDead = false;
            return springBody;
        }

        function initGame() {
            engine = Engine.create();
            // 수정됨: Matter.js 0.19.0에서는 engine.gravity.y를 사용해야 합니다.
            engine.gravity.y = 1.0; 

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('reset-btn').addEventListener('click', resetGame);
            document.getElementById('again-btn').addEventListener('click', restartSameRoster);

            Events.on(engine, 'collisionStart', function(event) {
                if(gameState !== 'playing') return;
                let pairs = event.pairs;
                for (let i = 0; i < pairs.length; i++) {
                    let pair = pairs[i];
                    
                    const labelA = pair.bodyA.label;
                    const labelB = pair.bodyB.label;

                    if (labelA === 'marble' || labelB === 'marble') {
                        const otherLabel = labelA === 'marble' ? labelB : labelA;
                        
                        if (otherLabel === 'wall' || otherLabel === 'bump' || otherLabel === 'dynamicSlope' || otherLabel === 'startBoxBottom') continue;

                        const velocityA = pair.bodyA.velocity ? Vector.magnitude(pair.bodyA.velocity) : 0;
                        const velocityB = pair.bodyB.velocity ? Vector.magnitude(pair.bodyB.velocity) : 0;
                        const relVelocity = velocityA + velocityB;

                        if (relVelocity > 2) {
                            if (otherLabel === 'bumper') {
                                playSound('bumper', relVelocity);
                            } else if (otherLabel !== 'spring') {
                                playSound('hit', relVelocity);
                            }
                        }

                        if (otherLabel === 'spring') {
                            const marbleBody = labelA === 'marble' ? pair.bodyA : pair.bodyB;
                            const springBody = labelA === 'spring' ? pair.bodyA : pair.bodyB;
                            handleSpringHit(marbleBody, springBody);
                        }
                    }
                }
            });

            Events.on(engine, 'afterUpdate', function() {
                flushPendingSpringRemovals();
            });

            Events.on(engine, 'beforeUpdate', function() {
                if(gameState !== 'playing') return;

                const time = engine.timing.timestamp;

                motorizedWheels.forEach(wheel => {
                    Body.setAngularVelocity(wheel, wheel.motorSpeed);
                });

                dynamicSlopes.forEach(slope => {
                    const angleOffset = Math.sin(time * slope.swingSpeed + slope.timeOffset) * slope.swingAmplitude;
                    Body.setAngle(slope, slope.baseAngle + angleOffset);
                });

                let activeMarbles = [...marbles].filter(m => !m.finished).sort((a, b) => b.body.position.y - a.body.position.y);
                let currentLeader = activeMarbles[0];
                let secondPlace = activeMarbles[1];
                let leaderY = currentLeader ? currentLeader.body.position.y : 0;
                
                let hasLeaderFinished = results.length > 0;

                marbles.forEach(m => {
                    if (m.finished) return;

                    // --- 교사 지정 결과 또는 결과 중복 금지에서만 보조 유도 ---
                    const needsSlotGuide = Boolean(cheatData[m.name]) || useOneMarblePerSlot;
                    if (needsSlotGuide && m.body.position.y > finishLineY - 1500) {
                        const preferredSlot = getPreferredSlotForMarble(m, m.body.position.x);
                        if (preferredSlot) {
                            const diffX = preferredSlot.centerX - m.body.position.x;
                            if (Math.abs(diffX) > 10) {
                                const pullForce = Math.sign(diffX) * (cheatData[m.name] ? 0.0008 : 0.00035);
                                Body.applyForce(m.body, m.body.position, { x: pullForce, y: 0 });
                            }
                        }
                    }
                    // ------------------------------------------------------

                    // --- 순수 깔때기 구간 전용 안전장치 ---
                    // 깔때기 자체는 길고 좁아도 되지만, 여러 구슬이 한꺼번에 몰려 아치처럼 멈출 수 있습니다.
                    // 이때 옆으로 마구 흔들지 않고 아래쪽으로만 부드럽게 흘려보냅니다.
                    const inCleanFunnel = cleanFunnelZone &&
                        m.body.position.y > cleanFunnelZone.topY &&
                        m.body.position.y < cleanFunnelZone.bottomY;

                    if (inCleanFunnel) {
                        const speed = Vector.magnitude(m.body.velocity);
                        if (speed < 0.45) {
                            m.funnelSlowTicks = (m.funnelSlowTicks || 0) + 1;
                            Body.applyForce(m.body, m.body.position, { x: 0, y: 0.00055 });

                            if (m.funnelSlowTicks > 90 && m.body.velocity.y < 1.2) {
                                Body.setVelocity(m.body, {
                                    x: Math.max(Math.min(m.body.velocity.x * 0.35, 2), -2),
                                    y: 1.7
                                });
                            }
                        } else {
                            m.funnelSlowTicks = 0;
                        }
                    } else {
                        m.funnelSlowTicks = 0;
                    }
                    
                    if (hasLeaderFinished && gamePurpose === 'winner') {
                        m.body.frictionAir = 0.005;
                        Body.applyForce(m.body, m.body.position, { x: 0, y: 0.0025 });
                    } else if (useCloseRace) {
                        let distanceBehind = leaderY - m.body.position.y;
                        if (distanceBehind > 150 && m !== currentLeader) {
                            let boost = Math.min(distanceBehind * 0.0000015, 0.0015);
                            Body.applyForce(m.body, m.body.position, { x: 0, y: boost });
                        }
                        if (m === currentLeader && secondPlace) {
                            let gap = currentLeader.body.position.y - secondPlace.body.position.y;
                            if (gap > 250) {
                                m.body.frictionAir = 0.08;
                                if (m.body.velocity.y > 6) Body.setVelocity(m.body, { x: m.body.velocity.x, y: 6 });
                            } else {
                                m.body.frictionAir = 0.015;
                            }
                        } else {
                            m.body.frictionAir = 0.015;
                        }
                    } else {
                        m.body.frictionAir = 0.015;
                    }
                    
                    if (Math.abs(m.body.velocity.x) < 0.3 && Math.abs(m.body.velocity.y) < 0.3) {
                        m.stuckTicks = (m.stuckTicks || 0) + 1;
                        if (m.stuckTicks > 30) {
                            let shakeForce = Math.min(0.008, 0.001 * Math.pow(1.055, Math.min(m.stuckTicks - 30, 80))); 
                            let dir = (m.stuckTicks % 6 < 3) ? 1 : -1; 
                            
                            Body.applyForce(m.body, m.body.position, { 
                                x: dir * shakeForce, 
                                y: shakeForce * 0.35 
                            });

                            if (m.stuckTicks > 150 && m.body.velocity.y < 1.2) {
                                Body.setVelocity(m.body, {
                                    x: Math.max(Math.min(m.body.velocity.x + dir * 0.8, 4), -4),
                                    y: 1.8
                                });
                            }
                        }
                    } else {
                        m.stuckTicks = 0; 
                    }
                });
            });

            requestAnimationFrame(renderLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createMap(slotNames) {
            mapElements = [];
            slotZones = [];
            motorizedWheels = []; 
            dynamicSlopes = [];
            pendingSpringRemovals = [];
            cleanFunnelZone = null;
            Composite.clear(engine.world);

            const wallOpts = { isStatic: true, render: { fillStyle: '#334155' }, friction: 0, restitution: 0.2, label: 'wall' }; 
            const pinOpts = { isStatic: true, render: { fillStyle: '#94A3B8' }, friction: 0, restitution: 0.9, label: 'pin' }; 
            const bumperOpts = { isStatic: true, render: { fillStyle: '#F43F5E' }, friction: 0, restitution: 1.5, label: 'bumper' }; 

            let currentY = 0;

            const boxWidth = 900; 
            
            mapElements.push(Bodies.rectangle(WORLD_WIDTH / 2 - boxWidth/2, -50, 40, 300, wallOpts)); 
            mapElements.push(Bodies.rectangle(WORLD_WIDTH / 2 + boxWidth/2, -50, 40, 300, wallOpts)); 
            
            startBoxBottom = Bodies.rectangle(WORLD_WIDTH / 2, 100, boxWidth, 40, { 
                isStatic: true, 
                render: { fillStyle: '#F59E0B' }, 
                label: 'startBoxBottom' 
            });
            mapElements.push(startBoxBottom);

            currentY += 400; 

            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.15, currentY, WORLD_WIDTH * 0.6, 60, { ...wallOpts, angle: Math.PI / 6 }));
            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.85, currentY, WORLD_WIDTH * 0.6, 60, { ...wallOpts, angle: -Math.PI / 6 }));
            currentY += 400; 

            function addDynamicBumpySlope(cx, cy, width, baseAngle) {
                const parts = [];
                parts.push(Bodies.rectangle(cx, cy, width, 40, { render: { fillStyle: '#334155' } }));
                
                const bumpRadius = 30; 
                const bumpSpacing = 40; 
                const numBumps = Math.floor(width / bumpSpacing);
                
                for(let j=0; j < numBumps; j++) {
                    const dist = (j - (numBumps - 1) / 2) * bumpSpacing;
                    const bx = cx + dist;
                    const by = cy; 
                    parts.push(Bodies.circle(bx, by, bumpRadius, { render: { fillStyle: '#475569' } })); 
                }

                const slopeBody = Body.create({
                    parts: parts,
                    isStatic: true, 
                    friction: 0, 
                    restitution: 0.5, 
                    label: 'dynamicSlope' 
                });

                Body.setAngle(slopeBody, baseAngle);
                slopeBody.baseAngle = baseAngle;
                slopeBody.timeOffset = cx + cy; 
                slopeBody.swingSpeed = 0.003; 
                slopeBody.swingAmplitude = 0.25; 

                dynamicSlopes.push(slopeBody);
                mapElements.push(slopeBody);
            }

            for (let i = 0; i < 4; i++) {
                const isLeft = i % 2 === 0;
                const cx = isLeft ? WORLD_WIDTH * 0.35 : WORLD_WIDTH * 0.65;
                const angle = isLeft ? 0.35 : -0.35; 
                addDynamicBumpySlope(cx, currentY, WORLD_WIDTH * 0.7, angle);
                currentY += 350; 
            }

            currentY += 100;
            const rows1 = 15; 
            for (let row = 0; row < rows1; row++) {
                const cols = row % 2 === 0 ? 13 : 12; 
                const spacingX = WORLD_WIDTH / 14;
                const offsetX = row % 2 === 0 ? spacingX : spacingX * 1.5;
                for (let col = 0; col < cols; col++) {
                    mapElements.push(Bodies.circle(offsetX + col * spacingX, currentY + row * 90, 10, pinOpts));
                }
                
                if (row % 4 === 0) {
                    mapElements.push(Bodies.rectangle(0, currentY + row * 90, 150, 20, { ...wallOpts, angle: Math.PI / 4 }));
                    mapElements.push(Bodies.rectangle(WORLD_WIDTH, currentY + row * 90, 150, 20, { ...wallOpts, angle: -Math.PI / 4 }));
                }
            }
            currentY += rows1 * 90 + 200;

            for(let row = 0; row < 5; row++) {
                const cols = row % 2 === 0 ? 6 : 5;
                const spacingX = WORLD_WIDTH / 6.5;
                const offsetX = row % 2 === 0 ? spacingX : spacingX * 1.5;
                for(let col = 0; col < cols; col++) {
                    const sx = offsetX + col * spacingX;
                    const sy = currentY + row * 160;
                    
                    const parts = [];
                    parts.push(Bodies.circle(sx, sy, 10)); 
                    parts.push(Bodies.rectangle(sx, sy, 100, 16, { angle: 0 })); 
                    parts.push(Bodies.rectangle(sx, sy, 100, 16, { angle: Math.PI/2 })); 
                    
                    const spinner = Body.create({
                        parts: parts,
                        isStatic: false,
                        density: 100, 
                        frictionAir: 0, 
                        restitution: 0.7, 
                        render: { fillStyle: '#14B8A6' },
                        label: 'motorizedWheel'
                    });
                    
                    const pivot = Constraint.create({ pointA: { x: sx, y: sy }, bodyB: spinner, length: 0, stiffness: 1, render:{visible:false} });
                    
                    spinner.motorSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.05 + Math.random() * 0.05);
                    motorizedWheels.push(spinner); 

                    mapElements.push(spinner);
                    Composite.add(engine.world, pivot);
                }
            }
            currentY += 5 * 160 + 100;
            
            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.1, currentY, WORLD_WIDTH * 0.4, 40, { ...wallOpts, angle: Math.PI / 8 }));
            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.9, currentY, WORLD_WIDTH * 0.4, 40, { ...wallOpts, angle: -Math.PI / 8 }));
            currentY += 300;

            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.15, currentY, WORLD_WIDTH * 0.6, 80, { ...wallOpts, angle: Math.PI / 6 }));
            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.85, currentY, WORLD_WIDTH * 0.6, 80, { ...wallOpts, angle: -Math.PI / 6 }));
            currentY += 300;
            
            mapElements.push(Bodies.circle(WORLD_WIDTH * 0.4, currentY, 40, bumperOpts));
            mapElements.push(Bodies.circle(WORLD_WIDTH * 0.6, currentY, 40, bumperOpts));
            mapElements.push(Bodies.circle(WORLD_WIDTH * 0.5, currentY + 100, 50, bumperOpts));
            currentY += 300;

            function addMotorizedFlipper(x, y, length, speed, color) {
                const bar = Bodies.rectangle(x, y, length, 30, {
                    density: 100,
                    frictionAir: 0, 
                    friction: 0.1,
                    restitution: 1.5, 
                    render: { fillStyle: color },
                    label: 'motorizedFlipper'
                });
                
                const pivot = Constraint.create({ pointA: { x, y }, bodyB: bar, length: 0, stiffness: 1, render: { visible: false } });
                bar.motorSpeed = speed; 
                motorizedWheels.push(bar); 
                mapElements.push(bar);
                Composite.add(engine.world, pivot);
            }

            currentY += 200;
            addMotorizedFlipper(WORLD_WIDTH * 0.3, currentY, 450, 0.06, '#F59E0B');
            addMotorizedFlipper(WORLD_WIDTH * 0.7, currentY, 450, -0.06, '#10B981');
            currentY += 400;
            addMotorizedFlipper(WORLD_WIDTH * 0.5, currentY, 600, 0.08, '#3B82F6');
            currentY += 400;

            for (let i = 0; i < 4; i++) {
                const isLeft = i % 2 !== 0;
                const cx = isLeft ? WORLD_WIDTH * 0.35 : WORLD_WIDTH * 0.65;
                const angle = isLeft ? 0.35 : -0.35; 
                addDynamicBumpySlope(cx, currentY, WORLD_WIDTH * 0.7, angle);
                currentY += 350;
            }

            function addCleanGatherFunnel(startY) {
                // 구획 전환용 순수 깔때기입니다.
                // 핵심 원칙: 이 구간 안에는 범퍼, 용수철, 핀, 회전물 같은 기믹을 절대 섞지 않습니다.
                const topY = startY + 60;
                const exitY = startY + 760;
                const topGap = 1060;
                const exitGap = 240; // 좁아지는 목은 허용하되, 여러 구슬이 동시에 빠질 폭은 유지합니다.
                const railThickness = 34;
                const centerX = WORLD_WIDTH / 2;
                const minimumSafeGap = MARBLE_RADIUS * 4;

                if (exitGap < minimumSafeGap) {
                    console.warn('깔때기 출구가 너무 좁습니다. exitGap:', exitGap, 'minimumSafeGap:', minimumSafeGap);
                }

                cleanFunnelZone = {
                    topY,
                    bottomY: exitY + 190,
                    leftX: centerX - topGap / 2,
                    rightX: centerX + topGap / 2,
                    exitGap
                };

                function addRail(x1, y1, x2, y2) {
                    const dx = x2 - x1;
                    const dy = y2 - y1;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    const cx = (x1 + x2) / 2;
                    const cy = (y1 + y2) / 2;
                    mapElements.push(Bodies.rectangle(cx, cy, length, railThickness, {
                        ...wallOpts,
                        angle: angle,
                        friction: 0,
                        restitution: 0.12,
                        label: 'wall'
                    }));
                }

                // 위쪽에서 넓게 받고, 아래쪽에서 길게 모아 다음 구획으로 넘깁니다.
                addRail(centerX - topGap / 2, topY, centerX - exitGap / 2, exitY);
                addRail(centerX + topGap / 2, topY, centerX + exitGap / 2, exitY);

                // 출구 목. 바닥은 절대 만들지 않아 갇히지 않게 합니다.
                addRail(centerX - exitGap / 2, exitY - 10, centerX - exitGap / 2, exitY + 170);
                addRail(centerX + exitGap / 2, exitY - 10, centerX + exitGap / 2, exitY + 170);

                return 960;
            }

            currentY += 70;
            currentY += addCleanGatherFunnel(currentY);
            currentY += 90;

            const mazeHeight = 3500; 
            const cols = 9;  
            const rows = 20; 
            const cellW = (WORLD_WIDTH - 200) / cols;
            const cellH = mazeHeight / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if(Math.random() > 0.2) { 
                        const bx = 100 + c * cellW + cellW / 2 + (Math.random() * 30 - 15);
                        const by = currentY + r * cellH + cellH / 2 + (Math.random() * 30 - 15);
                        
                        const rand = Math.random();
                        if(rand > 0.5) { 
                            const radius = 12 + Math.random() * 22; 
                            let bouncePower = 1.0 + (radius / 20); 
                            let lightness = Math.min(45 + ((radius - 12) / 22) * 35, 80);
                            let color = `hsl(343, 90%, ${lightness}%)`;

                            if (Math.random() > 0.9) {
                                bouncePower = 2.5;
                                color = '#FFFFFF';
                            }

                            mapElements.push(Bodies.circle(bx, by, radius, {
                                isStatic: true,
                                render: { fillStyle: color },
                                friction: 0,
                                restitution: bouncePower, 
                                label: 'bumper'
                            }));
                        } else if (rand > 0.2) {
                            mapElements.push(makeSpringBody(bx, by));
                        } else { 
                            mapElements.push(Bodies.circle(bx, by, 8 + Math.random() * 8, pinOpts));
                        }
                    }
                }
            }

            for (let dy = 200; dy < mazeHeight; dy += 300) {
                mapElements.push(Bodies.rectangle(0, currentY + dy, 200, 30, { ...wallOpts, angle: Math.PI / 4 }));
                mapElements.push(Bodies.rectangle(WORLD_WIDTH, currentY + dy + 150, 200, 30, { ...wallOpts, angle: -Math.PI / 4 }));
            }

            currentY += mazeHeight + 300; 

            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.15, currentY, WORLD_WIDTH * 0.6, 40, { ...wallOpts, angle: Math.PI / 6 }));
            mapElements.push(Bodies.rectangle(WORLD_WIDTH * 0.85, currentY, WORLD_WIDTH * 0.6, 40, { ...wallOpts, angle: -Math.PI / 6 }));
            currentY += 300;

            const pachinkoHeight = 800; 
            const rows2 = Math.floor(pachinkoHeight / 80); 
            for (let row = 0; row < rows2; row++) {
                const cols = row % 2 === 0 ? 15 : 14;
                const spacingX = WORLD_WIDTH / 16;
                const offsetX = row % 2 === 0 ? spacingX : spacingX * 1.5;
                for (let col = 0; col < cols; col++) {
                    mapElements.push(Bodies.circle(offsetX + col * spacingX, currentY + row * 80, 8, pinOpts));
                }
                
                if (row % 4 === 0) {
                    mapElements.push(Bodies.rectangle(0, currentY + row * 80, 150, 20, { ...wallOpts, angle: Math.PI / 4 }));
                    mapElements.push(Bodies.rectangle(WORLD_WIDTH, currentY + row * 80, 150, 20, { ...wallOpts, angle: -Math.PI / 4 }));
                }
            }
            currentY += pachinkoHeight + 300; 

            const slotCount = slotNames.length;
            const slotWidth = WORLD_WIDTH / slotCount;
            const slotDepth = 1000; 
            const slotCenterY = currentY + slotDepth / 2;

            for (let i = 0; i <= slotCount; i++) {
                mapElements.push(Bodies.rectangle(i * slotWidth, slotCenterY, 30, slotDepth, wallOpts));
            }

            for (let i = 0; i < slotCount; i++) {
                const centerX = i * slotWidth + slotWidth / 2;
                mapElements.push(Bodies.rectangle(centerX, currentY + slotDepth, slotWidth, 100, wallOpts));
                slotZones.push({
                    id: i,
                    x: i * slotWidth,
                    width: slotWidth,
                    y: currentY,
                    text: slotNames[i],
                    centerX: centerX,
                    captureY: currentY + slotDepth - 155,
                    occupied: false,
                    occupiedBy: null,
                    occupiedCount: 0,
                    reservedFor: null
                });
            }

            finishLineY = currentY + slotDepth - 100;
            WORLD_HEIGHT = currentY + slotDepth + 200;

            mapElements.push(Bodies.rectangle(WORLD_WIDTH / 2, -500, WORLD_WIDTH, 1000, wallOpts)); 
            mapElements.push(Bodies.rectangle(-250, WORLD_HEIGHT / 2, 500, WORLD_HEIGHT + 1000, wallOpts)); 
            mapElements.push(Bodies.rectangle(WORLD_WIDTH + 250, WORLD_HEIGHT / 2, 500, WORLD_HEIGHT + 1000, wallOpts)); 

            // 깔때기 구간에는 벽 이외의 기믹이 들어오지 않았는지 코드상으로 확인합니다.
            if (cleanFunnelZone) {
                const forbiddenLabels = new Set(['pin', 'bumper', 'spring', 'motorizedWheel', 'motorizedFlipper', 'dynamicSlope']);
                const intruders = mapElements.filter(body =>
                    forbiddenLabels.has(body.label) &&
                    body.position.y > cleanFunnelZone.topY - 40 &&
                    body.position.y < cleanFunnelZone.bottomY + 40
                );
                if (intruders.length > 0) {
                    console.warn('깔때기 안에 섞이면 안 되는 기믹이 감지되었습니다:', intruders.map(b => b.label));
                }
            }

            Composite.add(engine.world, mapElements);
        }

        function createMarbles(names) {
            marbles = [];
            
            const maxCols = 22;
            const spacing = MARBLE_RADIUS * 2.5; 
            const actualCols = Math.min(names.length, maxCols);
            
            const startX = (WORLD_WIDTH / 2) - ((actualCols * spacing) / 2) + (spacing / 2);
            const startY = 70; 

            names.forEach((name, index) => {
                if(!name.trim()) return;

                const color = colors[index % colors.length];
                
                const row = Math.floor(index / maxCols);
                const col = index % maxCols;
                const spawnX = startX + (col * spacing);
                const spawnY = startY - (row * spacing); 
                
                const body = Bodies.circle(
                    spawnX, 
                    spawnY,       
                    MARBLE_RADIUS, 
                    {
                        restitution: 0.5, 
                        friction: 0, 
                        frictionAir: 0.015, 
                        density: 0.05,
                        label: 'marble'
                    }
                );
                
                marbles.push({
                    id: index,
                    body: body,
                    name: name.trim(),
                    color: color,
                    finished: false,
                    slotResult: null,
                    stuckTicks: 0,
                    funnelSlowTicks: 0 
                });
                
                Composite.add(engine.world, body);
            });
        }

        function startGame() {
            if (gameState === 'playing') return;
            parseCheatData();

            gamePurpose = document.getElementById('game-purpose').value;
            useCountdown = gamePurpose === 'winner' && document.getElementById('use-countdown').checked;
            countdownSeconds = getCountdownSeconds();
            useOneMarblePerSlot = document.getElementById('one-marble-per-slot').checked;
            useCloseRace = document.getElementById('close-race').checked;
            saveGameConfig();

            let namesInput = document.getElementById('names-input').value.split('\n').filter(n => n.trim() !== '');
            const slotsInput = document.getElementById('slots-input').value.split('\n').filter(n => n.trim() !== '');

            if (namesInput.length < 2 || slotsInput.length === 0) {
                alert("레이스할 친구나 말을 2개 이상 넣어 주세요!");
                return;
            }
            if (namesInput.length > 16) {
                alert("학생판은 이름이 잘 보이도록 한 번에 16개까지 달릴 수 있어요.");
                return;
            }

            if (useOneMarblePerSlot && slotsInput.length < namesInput.length) {
                alert(`결과 중복 금지에서는 결과 슬롯 수가 학생 수 이상이어야 합니다.\n현재 학생 ${namesInput.length}명, 슬롯 ${slotsInput.length}개입니다.`);
                return;
            }
            const nameSet = new Set(namesInput.map(x=>x.trim()));
            const slotSet = new Set(slotsInput.map(x=>x.trim()));
            const directedCounts = {};
            const slotCounts = {};
            slotsInput.forEach(result => slotCounts[result.trim()] = (slotCounts[result.trim()] || 0) + 1);
            for (const [name,result] of Object.entries(cheatData)) {
                if (!nameSet.has(name)) {
                    alert(`교사 지정 결과의 학생 '${name}'이 현재 명단에 없습니다.`);
                    return;
                }
                if (!slotSet.has(result)) {
                    alert(`'${name}' 학생에게 지정한 결과 '${result}'가 결과 슬롯에 없습니다.`);
                    return;
                }
                directedCounts[result] = (directedCounts[result] || 0) + 1;
            }
            if (useOneMarblePerSlot) {
                for (const [result,count] of Object.entries(directedCounts)) {
                    if (count > (slotCounts[result] || 0)) {
                        alert(`결과 중복 금지에서는 '${result}' 함이 ${slotCounts[result] || 0}개뿐인데 ${count}명이 지정되어 있습니다.`);
                        return;
                    }
                }
            }

            for (let i = namesInput.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [namesInput[i], namesInput[j]] = [namesInput[j], namesInput[i]];
            }

            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

            document.getElementById('setup-panel').style.opacity = '0';
            
            document.getElementById('win-log').innerHTML = ''; 
            document.getElementById('countdown-display').classList.add('hidden');
            document.getElementById('countdown-number').className = 'text-7xl md:text-9xl font-extrabold text-red-500 opacity-90 drop-shadow-2xl transition-all';
            
            clearInterval(countdownTimer);
            isCountdownActive = false;
            resetCountdownDisplay();

            setTimeout(() => {
                document.getElementById('setup-panel').style.display = 'none';
                setHudVisible(true);
            }, 300);

            createMap(slotsInput);
            if (!reserveTeacherSlots()) {
                alert('교사 지정 결과용 슬롯을 예약하지 못했습니다. 결과 슬롯 설정을 확인해 주세요.');
                resetGame();
                return;
            }
            createMarbles(namesInput);

            runner = Runner.create();
            Runner.run(runner, engine);

            gameState = 'playing';
            isFinished = false;
            results = [];
            
            camera.y = -200;
            camera.targetY = -200;
            lastLeaderId = null;
            leaderChangeCount = 0;

            setTimeout(() => {
                if (gameState === 'playing' && startBoxBottom) {
                    playSound('hit', 20); 
                    
                    Composite.remove(engine.world, startBoxBottom);
                    
                    const index = mapElements.indexOf(startBoxBottom);
                    if (index > -1) {
                        mapElements.splice(index, 1);
                    }
                }
            }, 2000);
        }

        function resetGame() {
            if (runner) {
                Runner.stop(runner);
                runner = null;
            }
            gameState = 'setup';
            
            clearInterval(countdownTimer);
            
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('setup-panel').style.display = 'block';
            setTimeout(() => {
                document.getElementById('setup-panel').style.opacity = '1';
            }, 50);
            setHudVisible(false);
            syncPurposeUI();
        }

        let lastLeaderId = null;
        let leaderChangeCount = 0;
        let calloutTimer = null;

        function showRaceCallout(message) {
            const el = document.getElementById('race-callout');
            if (!el) return;
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(calloutTimer);
            calloutTimer = setTimeout(() => el.classList.remove('show'), 1200);
        }

        function restartSameRoster() {
            if (runner) {
                Runner.stop(runner);
                runner = null;
            }
            clearInterval(countdownTimer);
            gameState = 'setup';
            document.getElementById('result-modal').classList.add('hidden');
            const setup = document.getElementById('setup-panel');
            setup.style.display = 'block';
            setup.style.opacity = '0';
            setHudVisible(false);
            setTimeout(startGame, 80);
        }

        function updateLeaderboard(sortedMarbles) {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';
            
            const top5 = sortedMarbles.slice(0, 3);
            
            top5.forEach((m, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center gap-2 leaderboard-item bg-gray-800 bg-opacity-50 p-2 rounded';
                
                let rankStr = `${index + 1}위`;
                if(index === 0) rankStr = '👑 1위';
                
                li.innerHTML = `
                    <span class="font-bold w-8 md:w-12 text-gray-300 text-center">${rankStr}</span>
                    <div class="w-3 h-3 rounded-full shadow-md border border-gray-600 shrink-0" style="background-color: ${m.color}"></div>
                    <span class="text-white font-medium truncate flex-1">${m.name}</span>
                `;
                listEl.appendChild(li);
            });
        }

        function renderLoop(now = performance.now()) {
            requestAnimationFrame(renderLoop);

            ctx.fillStyle = '#1a202c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState !== 'playing' && gameState !== 'finished') return;

            let sortedMarbles = [...marbles].sort((a, b) => b.body.position.y - a.body.position.y);
            let leader = sortedMarbles.find(m => !m.finished) || sortedMarbles[0];

            if (leader && gameState === 'playing' && leader.id !== lastLeaderId) {
                if (lastLeaderId !== null) {
                    leaderChangeCount++;
                    showRaceCallout(leaderChangeCount >= 3 ? `🔥 대역전! ${leader.name}` : `👑 선두 교체! ${leader.name}`);
                }
                lastLeaderId = leader.id;
            }

            if (now - lastLeaderboardPaint > 160) {
                updateLeaderboard(sortedMarbles);
                lastLeaderboardPaint = now;
            }

            if (leader && leader.body.position.y > finishLineY && !leader.finished) {
                checkWinCondition(leader);
            }

            if (leader) {
                camera.targetY = leader.body.position.y - (canvas.height * 0.6);
            }
            camera.targetY = Math.max(-200, Math.min(camera.targetY, WORLD_HEIGHT - canvas.height));

            const lerpSpeed = 0.05; 
            camera.y += (camera.targetY - camera.y) * lerpSpeed;

            const scale = Math.min(canvas.width / WORLD_WIDTH, 1);
            camera.scale = scale;
            camera.x = (WORLD_WIDTH * scale - canvas.width) / 2;

            ctx.save();
            ctx.translate(-camera.x, -camera.y * scale);
            ctx.scale(scale, scale);

            mapElements.forEach(body => {
                if (body.parts && body.parts.length > 1) {
                    for (let i = 1; i < body.parts.length; i++) {
                        const part = body.parts[i];
                        ctx.beginPath();
                        ctx.moveTo(part.vertices[0].x, part.vertices[0].y);
                        for (let j = 1; j < part.vertices.length; j++) {
                            ctx.lineTo(part.vertices[j].x, part.vertices[j].y);
                        }
                        ctx.lineTo(part.vertices[0].x, part.vertices[0].y);
                        ctx.fillStyle = body.render.fillStyle || '#334155';
                        ctx.fill();
                        
                        if(body.label !== 'dynamicSlope') {
                            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        }
                    }
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.stroke();
                } else if (body.label === 'bump' || body.label === 'pin' || body.label === 'bumper') {
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = body.render.fillStyle || '#94A3B8';
                    ctx.fill();
                    
                    if(body.label === 'bumper') {
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = body.render.fillStyle; 
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                } else if (body.label === 'spring') {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);
                    
                    ctx.fillStyle = body.springUsesLeft === 1 ? '#7E22CE' : '#A855F7';
                    ctx.fillRect(-22.5, -7.5, 45, 15);
                    
                    ctx.strokeStyle = '#D8B4FE'; 
                    ctx.lineWidth = 2;
                    for(let k = -15; k <= 15; k += 6) {
                        ctx.beginPath();
                        ctx.moveTo(k, -7.5);
                        ctx.lineTo(k + 4, 7.5);
                        ctx.stroke();
                    }

                    ctx.rotate(-body.angle);
                    ctx.fillStyle = '#F5D0FE';
                    ctx.font = 'bold 18px Pretendard';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${body.springUsesLeft ?? 1}`, 0, -25);
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(body.vertices[0].x, body.vertices[0].y);
                    for (let j = 1; j < body.vertices.length; j++) {
                        ctx.lineTo(body.vertices[j].x, body.vertices[j].y);
                    }
                    ctx.lineTo(body.vertices[0].x, body.vertices[0].y);
                    ctx.fillStyle = body.render.fillStyle || '#334155';
                    ctx.fill();
                    
                    if (body.render.strokeStyle !== 'transparent') {
                        ctx.strokeStyle = body.render.strokeStyle || 'rgba(255,255,255,0.1)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            });

            slotZones.forEach(slot => {
                ctx.fillStyle = slot.occupied ? 'rgba(16, 185, 129, 0.26)' : 'rgba(255, 255, 255, 0.12)';
                ctx.fillRect(slot.x + 16, slot.y + 40, Math.max(0, slot.width - 32), 110);
                ctx.strokeStyle = slot.occupied ? 'rgba(110, 231, 183, 0.9)' : 'rgba(255, 255, 255, 0.24)';
                ctx.lineWidth = 3;
                ctx.strokeRect(slot.x + 16, slot.y + 40, Math.max(0, slot.width - 32), 110);

                ctx.fillStyle = slot.occupied ? '#A7F3D0' : 'rgba(255, 255, 255, 0.72)';
                ctx.font = `bold ${Math.max(18, Math.min(34, slot.width * 0.16))}px Pretendard`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(slot.text, slot.centerX, slot.y + 95, Math.max(60, slot.width - 42));

                if (useOneMarblePerSlot) {
                    ctx.font = 'bold 18px Pretendard';
                    ctx.fillStyle = slot.occupied ? '#34D399' : '#FDE68A';
                    ctx.fillText(slot.occupied ? '사용됨' : (slot.reservedFor ? '예약 함' : '빈 함'), slot.centerX, slot.y + 138);
                }
            });

            marbles.forEach(m => {
                const pos = m.body.position;
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, MARBLE_RADIUS, 0, 2 * Math.PI);
                ctx.fillStyle = m.color;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(pos.x - 5, pos.y - 5, MARBLE_RADIUS * 0.3, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Pretendard';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(m.name, pos.x, pos.y - 28);
                ctx.shadowBlur = 0;
                
                if(m === sortedMarbles[0] && gameState === 'playing' && m.body.position.y > 0) {
                    ctx.font = '24px Arial';
                    ctx.fillText('👑', pos.x, pos.y - 55);
                }
            });

            ctx.restore(); 

            drawMinimap();
        }

        function drawMinimap() {
            const mmWidth = 15; 
            const mmHeight = canvas.height * 0.6;
            const mmX = canvas.width - mmWidth - 10; 
            const mmY = (canvas.height - mmHeight) / 2;

            ctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(mmX, mmY, mmWidth, mmHeight, 8);
            ctx.fill();
            ctx.stroke();

            const viewYRatio = camera.y / WORLD_HEIGHT;
            const viewHRatio = canvas.height / WORLD_HEIGHT;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(mmX, mmY + (viewYRatio * mmHeight), mmWidth, viewHRatio * mmHeight);

            marbles.forEach(m => {
                const ratioY = Math.max(0, Math.min(m.body.position.y / WORLD_HEIGHT, 1));
                const dotY = mmY + (ratioY * mmHeight);
                
                const ratioX = Math.max(0, Math.min(m.body.position.x / WORLD_WIDTH, 1));
                const dotX = mmX + (ratioX * mmWidth);

                ctx.beginPath();
                ctx.arc(dotX, dotY, 2.5, 0, 2 * Math.PI);
                ctx.fillStyle = m.color;
                ctx.fill();
                
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.stroke();
            });
        }

        function checkWinCondition(marble) {
            if (isFinished || marble.finished) return;

            const x = marble.body.position.x;
            const selectedSlot = getPreferredSlotForMarble(marble, x)
                || getNearestFreeSlot(x)
                || getSlotByX(Math.max(0, Math.min(WORLD_WIDTH - 0.001, x)))
                || slotZones[0];

            if (!selectedSlot) {
                console.error('도착 결과 함을 찾지 못했습니다.');
                return;
            }

            const resultText = selectedSlot.text;

            marble.finished = true;
            captureMarbleInSlot(marble, selectedSlot);

            marble.slotResult = resultText;
            results.push({ marble: marble, text: resultText });
            
            playSound('win', 20); 
            
            const logDiv = document.getElementById('win-log');
            const logItem = document.createElement('div');
            logItem.className = 'glass-panel p-2 md:p-3 rounded-lg flex items-center gap-2 md:gap-3 win-item border-l-4 shadow-md bg-opacity-90';
            logItem.style.borderColor = marble.color;
            logItem.innerHTML = `
                <div class="text-gray-400 font-bold text-[10px] md:text-xs w-4 text-center">${results.length}</div>
                <div class="w-3 h-3 md:w-4 md:h-4 rounded-full shadow-inner shrink-0" style="background-color: ${marble.color}"></div>
                <div class="flex-1 flex justify-between items-center overflow-hidden">
                    <div class="text-white font-bold text-xs md:text-sm tracking-wide truncate pr-2">${marble.name}</div>
                    <div class="text-yellow-300 text-[10px] md:text-xs font-bold bg-black bg-opacity-30 px-1.5 py-0.5 md:px-2 md:py-1 rounded shrink-0">${resultText}</div>
                </div>
            `;
            logDiv.appendChild(logItem);
            
            logDiv.scrollTop = logDiv.scrollHeight;

            if (gamePurpose === 'winner' && !isCountdownActive && useCountdown) {
                startCountdown();
            }

            if (results.length === marbles.length) {
                endGame();
            }
        }

        function startCountdown() {
            clearInterval(countdownTimer);
            isCountdownActive = true;
            resetCountdownDisplay();
            const cdDisplay = document.getElementById('countdown-display');
            const cdNum = document.getElementById('countdown-number');
            cdDisplay.classList.remove('hidden');
            
            countdownTimer = setInterval(() => {
                countdownValue--;
                cdNum.innerText = countdownValue;
                
                if (countdownValue <= 3) {
                    cdNum.classList.add('scale-125', 'text-yellow-400');
                    playSound('hit', 20); 
                }
                
                if (countdownValue <= 0) {
                    clearInterval(countdownTimer);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            if (isFinished) return;
            isFinished = true;
            gameState = 'finished';
            clearInterval(countdownTimer);
            document.getElementById('countdown-display').classList.add('hidden');

            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            if (title) title.textContent = gamePurpose === 'assign' ? '🎯 모두 도착했어요!' : '🎉 오늘의 주인공!';
            const resultList = document.getElementById('result-list');
            resultList.innerHTML = '';

            const shownResults = gamePurpose === 'winner' ? results.slice(0, 1) : results;
            shownResults.forEach((res, index) => {
                const item = document.createElement('div');
                item.className = gamePurpose === 'winner'
                    ? 'winner-hero bg-gray-800 bg-opacity-60 p-3 md:p-4 rounded-xl flex items-center gap-3 md:gap-4 border border-gray-600'
                    : 'bg-gray-800 bg-opacity-60 p-3 md:p-4 rounded-xl flex items-center gap-3 md:gap-4 border border-gray-600';
                item.innerHTML = gamePurpose === 'winner' ? `
                    <div class="text-5xl">🏆</div>
                    <div class="winner-name">${res.marble.name}</div>
                    <div class="text-yellow-300 font-bold">가장 먼저 결승선에 도착했어요!</div>
                ` : `
                    <div class="text-xl md:text-2xl font-bold text-gray-500 w-6 md:w-8 text-center">${index + 1}</div>
                    <div class="w-5 h-5 md:w-6 md:h-6 rounded-full shadow-md shrink-0" style="background-color: ${res.marble.color}"></div>
                    <div class="flex-1 overflow-hidden">
                        <div class="text-white font-bold text-lg md:text-xl truncate">${res.marble.name}</div>
                    </div>
                    <div class="text-yellow-400 font-extrabold text-base md:text-xl whitespace-nowrap shrink-0">${res.text}</div>
                `;
                resultList.appendChild(item);
            });

            if (gamePurpose === 'assign') {
                const unfinished = marbles.filter(m => !m.finished);
                unfinished.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'bg-gray-800 bg-opacity-30 p-3 md:p-4 rounded-xl flex items-center gap-3 md:gap-4 border border-gray-700 opacity-50';
                    item.innerHTML = `
                        <div class="text-xl md:text-2xl font-bold text-gray-600 w-6 md:w-8 text-center">-</div>
                        <div class="w-5 h-5 md:w-6 md:h-6 rounded-full shadow-md grayscale shrink-0" style="background-color: ${m.color}"></div>
                        <div class="flex-1 overflow-hidden"><div class="text-gray-400 font-bold text-lg md:text-xl truncate">${m.name}</div></div>
                        <div class="text-red-400 font-extrabold text-sm md:text-lg whitespace-nowrap shrink-0">아직 도착 전</div>
                    `;
                    resultList.appendChild(item);
                });
            }

            setTimeout(() => {
                modal.classList.remove('hidden');
                setHudVisible(false);
            }, 1000); 
        }

        const countdownToggleEl = document.getElementById('use-countdown');
        const countdownInputEl = document.getElementById('countdown-seconds');
        const purposeEl = document.getElementById('game-purpose');

        function setStudentMode(mode, persist = true) {
            const slotSetup = document.getElementById('slot-setup');
            const slots = document.getElementById('slots-input');
            purposeEl.value = mode;
            document.querySelectorAll('.student-mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.studentMode === mode);
            });
            if (mode === 'assign') {
                slotSetup.classList.remove('student-collapsed');
                if (/^(도착!\s*){3,}$/m.test(slots.value.replace(/\n/g,'')) || slots.value.trim().split('\n').every(v=>v.trim()==='도착!')) {
                    slots.value = slots.dataset.assignSlots || '빨강 팀\n파랑 팀\n노랑 팀\n초록 팀';
                }
            } else {
                if (slots.value.trim().split('\n').some(v => v.trim() !== '도착!')) slots.dataset.assignSlots = slots.value;
                slotSetup.classList.add('student-collapsed');
                slots.value = '도착!\n도착!\n도착!\n도착!\n도착!';
            }
            document.getElementById('use-countdown').checked = mode === 'winner';
            document.getElementById('countdown-seconds').value = 3;
            document.getElementById('one-marble-per-slot').checked = false;
            document.getElementById('close-race').checked = true;
            syncPurposeUI();
            if (persist) saveGameConfig();
        }

        loadGameConfig();
        document.querySelectorAll('.student-mode-btn').forEach(btn => btn.addEventListener('click',()=>setStudentMode(btn.dataset.studentMode)));
        setStudentMode(purposeEl.value === 'assign' ? 'assign' : 'winner', false);
        purposeEl.addEventListener('change',()=>{syncPurposeUI();saveGameConfig();});
        countdownToggleEl.addEventListener('change',()=>{syncCountdownInputState();saveGameConfig();});
        countdownInputEl.addEventListener('change',()=>{resetCountdownDisplay();saveGameConfig();});
        countdownInputEl.addEventListener('blur', resetCountdownDisplay);
        document.getElementById('close-race').addEventListener('change',saveGameConfig);
        document.getElementById('one-marble-per-slot').addEventListener('change',saveGameConfig);
        document.getElementById('names-input').addEventListener('input',saveGameConfig);
        document.getElementById('slots-input').addEventListener('input',saveGameConfig);
        document.getElementById('load-classroom-btn').addEventListener('click',loadClassroomNames);
        document.getElementById('sample-names-btn').addEventListener('click',()=>{
            document.getElementById('names-input').value=['민준','서연','도윤','하은','지호','수아','현우','윤서'].join('\n');
            saveGameConfig();
        });
        document.getElementById('number-names-btn').addEventListener('click',()=>{
            document.getElementById('names-input').value=Array.from({length:8},(_,i)=>`${i+1}번`).join('\n');
            saveGameConfig();
        });
        document.getElementById('clear-names-btn').addEventListener('click',()=>{
            document.getElementById('names-input').value='';
            document.getElementById('names-input').focus();
            saveGameConfig();
        });
        document.getElementById('team-slots-btn').addEventListener('click',()=>{
            document.getElementById('slots-input').value='빨강 팀\n파랑 팀\n노랑 팀\n초록 팀';
            saveGameConfig();
        });
        document.getElementById('pair-slots-btn').addEventListener('click',()=>{
            document.getElementById('slots-input').value='A팀\nA팀\nB팀\nB팀';
            saveGameConfig();
        });
        document.getElementById('debug-panel').addEventListener('input',saveGameConfig);
        syncPurposeUI();
        resetCountdownDisplay();
        setHudVisible(false);
