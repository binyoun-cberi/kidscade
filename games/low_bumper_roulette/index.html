<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>범퍼 룰렛 레이스</title>
<style>
:root{color-scheme:dark;--ink:#20263a;--yellow:#ffd84d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#15203a;color:white}
button,textarea,select{font:inherit}button{border:0;cursor:pointer}
#app{position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;background:radial-gradient(circle at 15% 10%,rgba(89,200,255,.32),transparent 32%),radial-gradient(circle at 85% 5%,rgba(255,111,145,.26),transparent 28%),linear-gradient(180deg,#233a69 0%,#15203a 70%)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:14px;right:14px;top:12px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.badge{padding:8px 12px;border-radius:999px;background:rgba(20,29,53,.72);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;font-weight:900}
#raceStatus{max-width:min(60vw,620px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
#menuBtn{pointer-events:auto;min-width:46px;height:42px;padding:0 13px;border-radius:15px;background:rgba(20,29,53,.84);color:white;font-weight:950}
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(12,18,34,.76);backdrop-filter:blur(5px)}
.hidden{display:none!important}
.panel{width:min(770px,95vw);max-height:93vh;overflow:auto;border-radius:30px;padding:24px;background:linear-gradient(180deg,#fffdf7,#fff6d8);color:var(--ink);box-shadow:0 30px 100px rgba(0,0,0,.38)}
h1,h2,p{margin-top:0}h1{font-size:clamp(39px,7vw,68px);line-height:1;margin-bottom:8px;letter-spacing:-.04em}.lead{color:#59647a;font-weight:750;line-height:1.55;margin-bottom:16px}
.setupGrid{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;align-items:stretch}
.namesBox{display:flex;flex-direction:column;gap:8px}label{font-size:13px;font-weight:900;color:#525d71}
textarea{width:100%;min-height:250px;resize:vertical;border:3px solid #dfe5ee;border-radius:18px;padding:14px;background:white;color:var(--ink);line-height:1.55;outline:none}
textarea:focus{border-color:#6c9eff;box-shadow:0 0 0 4px rgba(108,158,255,.15)}
.sideCard{display:flex;flex-direction:column;gap:10px;border:2px solid #e5dfca;border-radius:20px;padding:14px;background:rgba(255,255,255,.65)}
.sideCard h3{margin:0;font-size:16px}.miniBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border-radius:14px;padding:10px 11px;background:#e8edf5;color:var(--ink);font-weight:900}
.field{display:flex;flex-direction:column;gap:6px}.field select{width:100%;border:2px solid #d9dfeb;border-radius:14px;padding:11px;background:white;color:var(--ink)}
.tip{font-size:12px;color:#6a7385;line-height:1.5}
.primary,.secondary{width:100%;border-radius:18px;padding:14px 16px;font-weight:1000}.primary{margin-top:15px;background:linear-gradient(180deg,#ffe66d,#ffd02d);color:#2b2b2b;font-size:19px;box-shadow:0 7px 0 #d7a818}.primary:active{transform:translateY(3px);box-shadow:0 4px 0 #d7a818}.secondary{margin-top:9px;background:#e4eaf3;color:var(--ink)}
.counter{font-variant-numeric:tabular-nums}.resultNames{display:grid;gap:10px;margin:18px 0}
.resultRow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:18px;background:white;border:2px solid #e2e7ee;font-weight:950;font-size:18px}
.medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffe59b;font-size:23px}
#bigWinner{font-size:clamp(34px,6vw,58px);font-weight:1000;line-height:1.12;margin:10px 0 4px;color:#ff5d7c;word-break:keep-all}
#countdown{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:10;font-size:clamp(72px,16vw,160px);font-weight:1000;text-shadow:0 10px 28px rgba(0,0,0,.35);pointer-events:none}
#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:999px;background:rgba(20,29,53,.82);font-weight:950;opacity:0;transition:opacity .15s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:680px){.panel{padding:18px;border-radius:23px}.setupGrid{grid-template-columns:1fr}.sideCard{padding:12px}textarea{min-height:150px}.badge{font-size:11px;padding:7px 9px}#hud{top:8px;left:8px;right:8px;gap:6px}#menuBtn{height:38px;min-width:42px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app" aria-label="범퍼 룰렛 레이스">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="badge">🎡 범퍼 룰렛</div>
    <div class="badge counter" id="raceStatus">준비 중 · 참가자 8명</div>
    <button id="menuBtn" type="button" aria-label="설정 열기">☰</button>
  </div>
  <div id="toast"></div>
  <div id="countdown" class="hidden">3</div>
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>범퍼 룰렛 레이스</h1>
      <p class="lead">이름을 넣고 출발! 구슬이 범퍼에 통통 튕기며 내려가요. 결승선에 먼저 들어온 친구가 오늘의 당첨자!</p>
      <div class="setupGrid">
        <div class="namesBox">
          <label for="names">참가자 이름 · 줄바꿈 또는 쉼표로 나눠 주세요</label>
          <textarea id="names" spellcheck="false">1번
2번
3번
4번
5번
6번
7번
8번</textarea>
        </div>
        <div class="sideCard">
          <h3>빠른 설정</h3>
          <div class="miniBtns">
            <button class="mini" id="fill8" type="button">8명</button>
            <button class="mini" id="fill20" type="button">20명</button>
            <button class="mini" id="clearNames" type="button">비우기</button>
            <button class="mini" id="shuffleNames" type="button">섞기</button>
          </div>
          <label class="field">몇 명을 뽑을까요?
            <select id="winnerCount"><option value="1" selected>1명</option><option value="2">2명</option><option value="3">3명</option></select>
          </label>
          <label class="field">레이스 느낌
            <select id="chaos"><option value="calm">차분하게</option><option value="normal" selected>통통하게 · 추천</option><option value="wild">와글와글</option></select>
          </label>
          <p class="tip">2~24명까지 참가할 수 있어요. 매 판 시작 위치와 튕김이 달라져 결과를 미리 알 수 없어요.</p>
        </div>
      </div>
      <button class="primary" id="startBtn" type="button">🎉 레이스 출발!</button>
    </div>
  </div>
  <div id="result" class="overlay hidden">
    <div class="panel" style="max-width:570px;text-align:center">
      <div style="font-size:54px">🏆</div>
      <h2 style="font-size:30px;margin-bottom:4px">당첨!</h2>
      <div id="bigWinner"></div>
      <p class="lead" id="resultText">범퍼 사이를 뚫고 가장 먼저 도착했어요!</p>
      <div class="resultNames" id="resultNames"></div>
      <button class="primary" id="againBtn" type="button">같은 이름으로 한 판 더!</button>
      <button class="secondary" id="editBtn" type="button">이름 다시 고치기</button>
    </div>
  </div>
</div>
<script src="./game.js?v=1"></script>
<script src="../../kidscade-game-sdk.js" data-game-id="low_bumper_roulette" data-title="범퍼 룰렛 레이스" data-shell="true" data-mute="false" data-orientation="landscape"></script>
</body>
</html>
