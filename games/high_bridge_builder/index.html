<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다리야 버텨줘!</title>
<link rel="stylesheet" href="bridge-builder.css?v=12">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span>✏️</span><b>다리야 버텨줘!</b></div>
    <div class="stage">
      <button id="prevLevel" class="icon-btn" type="button" aria-label="이전 단계">‹</button>
      <div>
        <b id="stageTitle">1. 작은 개울</b>
        <small id="stageGoal">차 앞에서 반대쪽 벽까지 길을 그려 주세요</small>
      </div>
      <button id="nextLevel" class="icon-btn" type="button" aria-label="다음 단계">›</button>
    </div>
    <button id="helpBtn" class="icon-btn" type="button" aria-label="도움말">?</button>
  </header>

  <main class="layout">
    <section class="board">
      <div class="canvas-wrap">
        <canvas id="game" width="1200" height="700" aria-label="한 줄을 그려 자동차가 건널 길을 만드는 게임"></canvas>
        <div id="hint" class="hint">차 앞에서 반대쪽 벽까지 선을 그리면 자동으로 출발해요.</div>
        <div id="toast" class="toast" aria-live="polite"></div>
        <button id="resetBtn" class="reset-floating" type="button">↻ 다시 그리기</button>

        <div id="resultCard" class="result-card hidden">
          <div id="resultIcon" class="result-icon">🏁</div>
          <h2 id="resultTitle">건넜다!</h2>
          <p id="resultText"></p>
          <div id="stars" class="stars">★★★</div>
          <div class="result-actions">
            <button id="retryBtn" class="soft" type="button">다시 그리기</button>
            <button id="continueBtn" class="primary" type="button">다음 단계</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="tutorial" class="overlay hidden">
  <div class="dialog">
    <span class="eyebrow">규칙은 딱 하나</span>
    <h1>선 하나만 그리면 돼요</h1>
    <div class="demo-line"><span></span><i></i><span></span></div>
    <p>
      <b>①</b> 왼쪽에 기다리는 자동차 앞에서 시작해요.<br>
      <b>②</b> 반대쪽 벽까지 손을 떼지 않고 길을 그어요.<br>
      <b>③</b> 손을 떼면 자동차가 <strong>자동으로 출발</strong>해요.<br>
      <b>④</b> 2단계부터는 바위·천장·좁은 관문을 <strong>위아래로 피해</strong> 길을 그려야 해요.<br><br>
      자동차가 달릴 때는 엔진 소리도 나요. 다시 하고 싶으면 오른쪽 위의 <b>다시 그리기</b>를 누르면 돼요.
    </p>
    <button id="tutorialClose" class="primary wide" type="button">알겠어요!</button>
  </div>
</div>

<script src="../../kidscade-game-sdk.js" data-game-id="high_bridge_builder" data-title="다리야 버텨줘!" data-shell="true" data-mute="false" data-orientation="landscape"></script>
<script src="bridge-builder.js?v=12"></script>
</body>
</html>
