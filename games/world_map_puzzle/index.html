<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>W-퍼즐 세계 지도 맞추기</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../kidscade-game-sdk.js" data-game-id="world_map_puzzle" data-title="W-퍼즐 세계 지도 맞추기" data-shell="false"></script>
<style>
:root{
  --ink:#17324d;--muted:#6b7c8f;--ocean:#eaf8ff;--paper:#fff;--line:#d9e5ee;
  --blue:#2f80ed;--blue2:#56ccf2;--green:#27ae60;--rose:#eb5757;--gold:#f2c94c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#edf8ff;color:var(--ink);touch-action:none}
button,select{font:inherit}
button{cursor:pointer}
.screen{position:fixed;inset:0}
#startScreen{
  z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 20% 20%,rgba(86,204,242,.20),transparent 32%),
    radial-gradient(circle at 80% 70%,rgba(39,174,96,.15),transparent 36%),
    linear-gradient(180deg,#f7fcff,#e9f7ff);
}
.start-card{
  width:min(560px,94vw);max-height:92vh;overflow:auto;background:rgba(255,255,255,.96);
  border:1px solid #d7ebf5;border-radius:30px;padding:28px;box-shadow:0 24px 60px rgba(27,82,120,.18)
}
.brand{font-size:clamp(34px,6vw,54px);font-weight:1000;letter-spacing:-2px;color:#1673c9;text-align:center}
.subtitle{text-align:center;color:var(--muted);font-weight:750;margin:4px 0 22px}
.select-label{display:block;font-size:14px;font-weight:900;margin:0 0 8px}
select{
  width:100%;border:2px solid #bfe1f2;background:#f7fcff;color:var(--ink);border-radius:16px;
  padding:14px 15px;font-weight:850;outline:none
}
select:focus{border-color:#57a9ec;box-shadow:0 0 0 4px rgba(47,128,237,.12)}
.info{
  margin-top:12px;padding:12px 14px;border-radius:14px;background:#f5fbff;color:#537085;
  font-size:12px;line-height:1.5;font-weight:700
}
.primary{
  width:100%;margin-top:18px;border:0;border-radius:16px;padding:15px 18px;background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;font-weight:1000;font-size:19px;box-shadow:0 6px 0 #1765b2
}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #1765b2}
.credit{margin-top:14px;text-align:center;color:#8aa0b3;font-size:11px;font-weight:650}
#gameScreen{display:none;z-index:10;background:linear-gradient(180deg,#eefdff,#fff)}
header{
  height:76px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:rgba(255,255,255,.94);
  border-bottom:1px solid #dbeaf2;box-shadow:0 4px 18px rgba(61,109,140,.10);position:relative;z-index:4
}
.header-left,.header-right{display:flex;align-items:center;gap:8px;min-width:0}
.title-wrap{min-width:0}
#mapTitle{font-weight:1000;font-size:clamp(16px,2.2vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
#mapSubtitle{font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.icon-btn,.soft-btn{
  border:1px solid #d8e7ef;background:#fff;color:var(--ink);border-radius:13px;min-height:42px;padding:0 12px;font-weight:900;
  box-shadow:0 2px 8px rgba(47,94,124,.08)
}
.icon-btn{width:44px;padding:0}
.soft-btn:hover,.icon-btn:hover{background:#f3faff}
.statbox{display:flex;align-items:center;gap:12px;background:#eef8ff;border:1px solid #d1e9f8;border-radius:16px;padding:8px 12px}
.stat{text-align:center;min-width:60px}
.stat small{display:block;font-size:10px;color:#71879a;font-weight:850}
.stat strong{display:block;font-size:18px;color:#146db8;line-height:1.1}
#timer{color:#d94a4a}
#board{position:absolute;left:0;right:0;top:76px;bottom:0;overflow:hidden;background:
  radial-gradient(circle at 50% 42%,rgba(255,255,255,.92),rgba(231,248,255,.78) 68%,rgba(221,243,255,.96))}
#mapSvg{width:100%;height:100%;display:block}
.context path{fill:#f6fbfd;stroke:#d5e5ed;stroke-width:.8}
.target-map path{fill:#dfe9ef;stroke:#cad9e2;stroke-width:1.2;stroke-linejoin:round}
.target-map path.hinting{animation:hintPulse .7s ease-in-out 4;stroke:#ff9f1c;stroke-width:4;fill:#fff2c6}
@keyframes hintPulse{50%{filter:drop-shadow(0 0 8px rgba(255,159,28,.9));opacity:.55}}
.piece{cursor:grab}
.piece:active{cursor:grabbing}
.piece path.shape{stroke:#fff;stroke-width:1.3;stroke-linejoin:round;filter:drop-shadow(2px 4px 4px rgba(28,70,98,.28));transition:filter .15s,opacity .2s}
.piece:hover path.shape{filter:drop-shadow(4px 7px 7px rgba(28,70,98,.35))}
.piece.placed{cursor:default}
.piece.placed path.shape{stroke:#fff;stroke-width:1.1;filter:drop-shadow(0 0 2px rgba(255,255,255,.9))}
.hit-circle{fill:transparent;stroke:transparent;pointer-events:all}
.tiny-halo{fill:rgba(255,255,255,.70);stroke:#4d9bce;stroke-width:1.5;stroke-dasharray:3 2;pointer-events:none}
.region-label{
  font-size:12px;font-weight:1000;fill:#17324d;pointer-events:none;text-anchor:middle;
  paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round
}
.piece.placed .tiny-halo{opacity:0}
#toast{
  position:absolute;left:50%;top:18px;transform:translate(-50%,-16px);opacity:0;pointer-events:none;
  background:rgba(18,50,75,.93);color:#fff;padding:10px 16px;border-radius:999px;font-weight:950;z-index:7;
  box-shadow:0 10px 28px rgba(19,57,82,.25);transition:.22s
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:13px;
  background:rgba(247,252,255,.91);backdrop-filter:blur(4px);z-index:8;text-align:center;padding:20px
}
.spinner{width:52px;height:52px;border-radius:50%;border:5px solid #d7eef9;border-top-color:#2f80ed;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading strong{font-size:21px}
#loading span{font-size:13px;color:var(--muted);font-weight:750}
#successModal{
  display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:22px;background:rgba(15,39,55,.48);backdrop-filter:blur(5px)
}
.modal{
  width:min(420px,94vw);background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.25)
}
.modal .emoji{font-size:64px}
.modal h2{font-size:30px;margin:8px 0 6px}
.modal p{color:var(--muted);font-weight:750}
.time-card{margin:18px 0;background:#f1f9ff;border:1px solid #d9edf9;border-radius:18px;padding:16px}
.time-card small{font-weight:850;color:#66839a}
.time-card strong{display:block;font-size:42px;color:#d94a4a;font-variant-numeric:tabular-nums}
.modal-actions{display:grid;gap:9px}
.modal-actions button{border-radius:14px;padding:13px;border:0;font-weight:950}
.again{background:#2f80ed;color:#fff}.other{background:#edf3f7;color:#27445a}
@media(max-width:760px){
  header{height:68px;padding:8px}
  #board{top:68px}
  #mapSubtitle{display:none}
  .soft-btn span{display:none}
  .soft-btn{padding:0 10px;min-width:42px}
  .statbox{gap:6px;padding:7px 8px}
  .stat{min-width:46px}
  .stat strong{font-size:15px}
  .region-label{font-size:10px;stroke-width:3px}
}
@media(max-width:470px){
  #mapTitle{max-width:30vw}
  .header-right .soft-btn:nth-of-type(1){display:none}
  .stat small{display:none}
}
</style>
</head>
<body>
<div id="startScreen" class="screen">
  <div class="start-card">
    <div class="brand">🌍 W-퍼즐</div>
    <div class="subtitle">나라와 대륙을 직접 끌어다 놓아 세계 지도를 완성하세요!</div>
    <label class="select-label" for="modeSelect">어느 지도를 맞출까요?</label>
    <select id="modeSelect">
      <optgroup label="🌐 세계">
        <option value="world_continents">세계의 6대륙 · 입문</option>
        <option value="world_countries">세계 전체 · 최고난도</option>
      </optgroup>
      <optgroup label="🌏 아시아">
        <option value="east_asia" selected>동아시아</option>
        <option value="southeast_asia">동남아시아</option>
        <option value="south_asia">남아시아</option>
        <option value="west_central_asia">서아시아·중앙아시아</option>
        <option value="asia">아시아 전체</option>
      </optgroup>
      <optgroup label="🌍 유럽·아프리카">
        <option value="europe">유럽 전체</option>
        <option value="africa">아프리카 전체</option>
      </optgroup>
      <optgroup label="🌎 아메리카·오세아니아">
        <option value="north_america">북아메리카·중앙아메리카·카리브</option>
        <option value="south_america">남아메리카</option>
        <option value="oceania">오세아니아</option>
      </optgroup>
    </select>
    <div class="info">
      작은 나라는 손가락으로 잡기 쉽도록 투명한 터치 영역과 표시 링을 덧붙였습니다.
      세계 전체 모드는 조각이 매우 많아 PC나 큰 태블릿을 권장합니다.
    </div>
    <button id="startBtn" class="primary">🚀 세계 지도 퍼즐 시작</button>
    <div class="credit">지도: Natural Earth 기반 CC0 110m 데이터 · 외부 지도 API/과금 없음</div>
  </div>
</div>

<div id="gameScreen" class="screen">
  <header>
    <div class="header-left">
      <button id="homeBtn" class="icon-btn" aria-label="메뉴로">🏠</button>
      <div class="title-wrap">
        <div id="mapTitle">동아시아</div>
        <div id="mapSubtitle">나라 조각을 알맞은 위치에 놓아 보세요.</div>
      </div>
    </div>
    <div class="statbox">
      <div class="stat"><small>진행</small><strong id="progress">0/0</strong></div>
      <div class="stat"><small>시간</small><strong id="timer">00:00</strong></div>
    </div>
    <div class="header-right">
      <button id="hintBtn" class="soft-btn" title="아직 못 맞춘 조각 하나의 자리를 알려줍니다">💡 <span>힌트</span></button>
      <button id="shuffleBtn" class="soft-btn" title="남은 조각 다시 섞기">🔄 <span>섞기</span></button>
      <button id="soundBtn" class="icon-btn" aria-label="효과음">🔊</button>
    </div>
  </header>
  <main id="board">
    <svg id="mapSvg"></svg>
    <div id="toast"></div>
    <div id="loading">
      <div class="spinner"></div>
      <strong id="loadingTitle">세계 지도를 펼치는 중…</strong>
      <span id="loadingText">나라 조각을 정리하고 있습니다.</span>
    </div>
  </main>
</div>

<div id="successModal">
  <div class="modal">
    <div class="emoji">🎉</div>
    <h2>세계 지도 완성!</h2>
    <p id="successText">모든 조각을 제자리에 맞췄어요.</p>
    <div class="time-card"><small>클리어 시간</small><strong id="finalTime">00:00</strong></div>
    <div class="modal-actions">
      <button id="againBtn" class="again">↻ 같은 지도 다시 하기</button>
      <button id="otherBtn" class="other">≡ 다른 지역 고르기</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var DATA_URL="./data/world-countries-110m.geojson";
var CONTINENT_KO={
  "Asia":"아시아","Europe":"유럽","Africa":"아프리카",
  "North America":"북아메리카","South America":"남아메리카","Oceania":"오세아니아"
};
var MODE={
  world_continents:{title:"세계의 6대륙",kind:"continents"},
  world_countries:{title:"세계 전체",kind:"all"},
  east_asia:{title:"동아시아",subregions:["Eastern Asia"]},
  southeast_asia:{title:"동남아시아",subregions:["South-Eastern Asia"]},
  south_asia:{title:"남아시아",subregions:["Southern Asia"]},
  west_central_asia:{title:"서아시아·중앙아시아",subregions:["Western Asia","Central Asia"]},
  asia:{title:"아시아 전체",continents:["Asia"]},
  europe:{title:"유럽 전체",continents:["Europe"]},
  africa:{title:"아프리카 전체",continents:["Africa"]},
  north_america:{title:"북아메리카·중앙아메리카·카리브",continents:["North America"]},
  south_america:{title:"남아메리카",continents:["South America"]},
  oceania:{title:"오세아니아",continents:["Oceania"]}
};
var colors=["#ff9f9f","#ffc98b","#f5df78","#a7df9b","#81d8c7","#82c6f2","#9eaff0","#c3a5e8","#ef9fd0","#f0b890","#8fd2af","#72cbd2"];
var worldData=null,currentFeatures=[],contextFeatures=[],currentMode="east_asia";
var placed=0,total=0,active=false,startAt=0,timerId=null,sfxOn=true;
var svg=d3.select("#mapSvg"),path=null,width=0,height=0,padding=0;
var startScreen=document.getElementById("startScreen"),gameScreen=document.getElementById("gameScreen");
var loading=document.getElementById("loading"),progressEl=document.getElementById("progress"),timerEl=document.getElementById("timer");
var toast=document.getElementById("toast"),successModal=document.getElementById("successModal");
var audioCtx=null;

function getKey(f,i){
  return (f.properties && (f.properties.key || f.properties.iso3 || f.properties.nameEn)) || ("piece-"+i);
}
function flagEmoji(iso2){
  if(!iso2 || iso2.length!==2) return "🗺️";
  return String.fromCodePoint.apply(String,iso2.toUpperCase().split("").map(function(c){return 127397+c.charCodeAt(0);}));
}
function beep(ok){
  if(!sfxOn) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!audioCtx) audioCtx=new AC();
    if(audioCtx.state==="suspended") audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=ok?"sine":"triangle";
    o.frequency.setValueAtTime(ok?780:330,audioCtx.currentTime);
    if(ok) o.frequency.exponentialRampToValueAtTime(1320,audioCtx.currentTime+.12);
    g.gain.setValueAtTime(.22,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
  }catch(e){}
}
function clearChime(){
  if(!sfxOn) return;
  [523,659,784,1046].forEach(function(freq,i){
    setTimeout(function(){
      try{
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!audioCtx) audioCtx=new AC();
        var o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type="triangle";o.frequency.value=freq;g.gain.value=.18;o.connect(g);g.connect(audioCtx.destination);
        o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);o.stop(audioCtx.currentTime+.36);
      }catch(e){}
    },i*90);
  });
}
function showToast(text){
  toast.textContent=text;toast.classList.add("show");
  clearTimeout(showToast.t);showToast.t=setTimeout(function(){toast.classList.remove("show");},1100);
}
function makeContinents(features){
  var groups={};
  features.forEach(function(f){
    var c=f.properties.continent;
    if(!CONTINENT_KO[c]) return;
    if(!groups[c]) groups[c]=[];
    var g=f.geometry;
    if(g.type==="Polygon") groups[c].push(g.coordinates);
    else if(g.type==="MultiPolygon") Array.prototype.push.apply(groups[c],g.coordinates);
  });
  return Object.keys(CONTINENT_KO).map(function(c){
    return {type:"Feature",properties:{key:"continent-"+c,nameKo:CONTINENT_KO[c],nameEn:c,iso2:"",continent:c,subregion:""},geometry:{type:"MultiPolygon",coordinates:groups[c]||[]}};
  });
}
function selectFeatures(mode){
  var cfg=MODE[mode],all=worldData.features;
  if(cfg.kind==="continents") return makeContinents(all);
  if(cfg.kind==="all") return all.slice();
  return all.filter(function(f){
    if(cfg.continents && cfg.continents.indexOf(f.properties.continent)>=0) return true;
    if(cfg.subregions && cfg.subregions.indexOf(f.properties.subregion)>=0) return true;
    return false;
  });
}
function timerText(seconds){
  var m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");
  return m+":"+s;
}
function startTimer(){
  clearInterval(timerId);startAt=Date.now();timerEl.textContent="00:00";
  timerId=setInterval(function(){timerEl.textContent=timerText(Math.floor((Date.now()-startAt)/1000));},1000);
}
function stopTimer(){clearInterval(timerId);timerId=null}
function setLoading(show,title,text){
  loading.style.display=show?"flex":"none";
  if(title) document.getElementById("loadingTitle").textContent=title;
  if(text) document.getElementById("loadingText").textContent=text;
}
async function ensureData(){
  if(worldData) return;
  setLoading(true,"세계 지도를 펼치는 중…","CC0 지도 데이터를 불러오고 있습니다.");
  var res=await fetch(DATA_URL,{cache:"force-cache"});
  if(!res.ok) throw new Error("지도 데이터를 불러오지 못했습니다.");
  worldData=await res.json();
}
function desiredSpawn(centroid,index){
  var lane=index%4,marginX=Math.max(34,width*.055),marginY=Math.max(34,height*.065),x,y;
  if(lane===0){x=marginX;y=marginY+Math.random()*(height-2*marginY);}
  else if(lane===1){x=width-marginX;y=marginY+Math.random()*(height-2*marginY);}
  else if(lane===2){x=marginX+Math.random()*(width-2*marginX);y=marginY;}
  else{x=marginX+Math.random()*(width-2*marginX);y=height-marginY;}
  return {x:x-centroid[0],y:y-centroid[1]};
}
function pieceSize(d){
  var b=path.bounds(d);return {w:Math.max(0,b[1][0]-b[0][0]),h:Math.max(0,b[1][1]-b[0][1])};
}
function updateProgress(){progressEl.textContent=placed+"/"+total}
function render(){
  svg.selectAll("*").remove();
  width=svg.node().clientWidth||window.innerWidth;
  height=svg.node().clientHeight||Math.max(420,window.innerHeight-76);
  padding=width<760?62:105;

  var fitCollection={type:"FeatureCollection",features:currentFeatures};
  var projection=d3.geoNaturalEarth1().fitExtent([[padding,padding],[width-padding,height-padding]],fitCollection);
  path=d3.geoPath(projection);

  if(currentMode!=="world_continents"){
    contextFeatures=worldData.features;
    svg.append("g").attr("class","context").selectAll("path").data(contextFeatures).enter().append("path").attr("d",path);
  }

  var target=svg.append("g").attr("class","target-map").selectAll("path").data(currentFeatures).enter().append("path")
    .attr("d",path).attr("id",function(d,i){return "target-"+String(getKey(d,i)).replace(/[^a-zA-Z0-9_-]/g,"-");});

  var shuffled=currentFeatures.slice();
  d3.shuffle(shuffled);
  var drag=d3.drag()
    .on("start",function(event,d){
      if(d.__placed||!active) return;
      d3.select(this).raise();
      d3.select(this).select("path.shape").attr("stroke-width",2.5);
    })
    .on("drag",function(event,d){
      if(d.__placed||!active) return;
      d.__x+=event.dx;d.__y+=event.dy;
      d3.select(this).attr("transform","translate("+d.__x+","+d.__y+")");
    })
    .on("end",function(event,d){
      if(d.__placed||!active) return;
      d3.select(this).select("path.shape").attr("stroke-width",1.3);
      var sz=pieceSize(d);
      var threshold=(width<760?42:30)+(Math.max(sz.w,sz.h)<22?18:0);
      var dist=Math.hypot(d.__x,d.__y);
      if(dist<threshold) placePiece(this,d);
      else beep(false);
    });

  var pieces=svg.append("g").attr("class","pieces").selectAll("g.piece").data(shuffled,function(d,i){return getKey(d,i);}).enter()
    .append("g").attr("class","piece").each(function(d,i){
      var c=path.centroid(d),sp=desiredSpawn(c,i);
      d.__x=sp.x;d.__y=sp.y;d.__placed=false;
      d3.select(this).attr("transform","translate("+d.__x+","+d.__y+")");
    }).call(drag);

  pieces.append("path").attr("class","shape").attr("d",path).attr("fill",function(d,i){return colors[i%colors.length];});

  pieces.each(function(d){
    var g=d3.select(this),c=path.centroid(d),sz=pieceSize(d);
    if(Math.max(sz.w,sz.h)<22){
      g.insert("circle","path.shape").attr("class","tiny-halo").attr("cx",c[0]).attr("cy",c[1]).attr("r",15);
      g.append("circle").attr("class","hit-circle").attr("cx",c[0]).attr("cy",c[1]).attr("r",22);
    }
    g.append("text").attr("class","region-label").attr("x",c[0]).attr("y",c[1]).attr("dy",".35em")
      .text((d.properties&&d.properties.nameKo)||"");
  });
}
function placePiece(node,d){
  d.__placed=true;d.__x=0;d.__y=0;
  var g=d3.select(node).classed("placed",true);
  g.transition().duration(300).ease(d3.easeBackOut.overshoot(1.3)).attr("transform","translate(0,0)");
  if(total>24) g.select(".region-label").transition().delay(450).duration(220).style("opacity",0);
  placed++;updateProgress();beep(true);
  var name=d.properties.nameKo||d.properties.nameEn||"정답";
  var flag=flagEmoji(d.properties.iso2);
  showToast(flag+" "+name+" 착!");
  if(window.KidscadeGame && placed===1) window.KidscadeGame.milestone("first-piece",{mode:currentMode});
  if(placed===total) finish();
}
function finish(){
  active=false;stopTimer();clearChime();
  var sec=Math.floor((Date.now()-startAt)/1000);
  document.getElementById("finalTime").textContent=timerText(sec);
  document.getElementById("successText").textContent=MODE[currentMode].title+" 지도를 완성했어요!";
  setTimeout(function(){successModal.style.display="flex";},350);
  if(window.KidscadeGame){
    window.KidscadeGame.result({
      scope:"stage",status:"completed",outcome:"clear",endsSession:true,
      score:sec,scoreOptions:{higherIsBetter:false,unit:"seconds"},
      mode:currentMode,pieces:total
    });
    window.KidscadeGame.milestone("map-clear-"+currentMode,{mode:currentMode,pieces:total});
  }
}
async function begin(mode){
  currentMode=mode;placed=0;active=false;updateProgress();
  successModal.style.display="none";
  startScreen.style.display="none";gameScreen.style.display="block";
  document.getElementById("mapTitle").textContent=MODE[mode].title;
  setLoading(true,"세계 지도를 펼치는 중…","나라 조각을 정리하고 있습니다.");
  try{
    await ensureData();
    currentFeatures=selectFeatures(mode);
    total=currentFeatures.length;updateProgress();
    render();setLoading(false);startTimer();active=true;
    if(window.KidscadeGame) window.KidscadeGame.start({mode:mode,pieces:total});
  }catch(err){
    console.error(err);
    setLoading(true,"지도를 불러오지 못했어요",err.message||"잠시 뒤 다시 시도해 주세요.");
  }
}
function backToMenu(){
  if(active && placed>0 && placed<total && !confirm("진행 중인 퍼즐이 있습니다. 메뉴로 돌아갈까요?")) return;
  active=false;stopTimer();svg.selectAll("*").remove();successModal.style.display="none";
  gameScreen.style.display="none";startScreen.style.display="flex";
}
function reshuffle(){
  if(!active) return;
  var remaining=svg.selectAll("g.piece").filter(function(d){return !d.__placed;});
  var i=0;
  remaining.each(function(d){
    var c=path.centroid(d),sp=desiredSpawn(c,i++);
    d.__x=sp.x;d.__y=sp.y;
    d3.select(this).raise().transition().duration(450).ease(d3.easeCubicOut).attr("transform","translate("+d.__x+","+d.__y+")");
  });
}
function hint(){
  if(!active) return;
  var data=svg.selectAll("g.piece").data().filter(function(d){return !d.__placed;});
  if(!data.length) return;
  var d=data[Math.floor(Math.random()*data.length)],key=String(getKey(d,0)).replace(/[^a-zA-Z0-9_-]/g,"-");
  var target=d3.select("#target-"+key);
  target.classed("hinting",false);
  void target.node().getBoundingClientRect();
  target.classed("hinting",true);
  setTimeout(function(){target.classed("hinting",false);},3000);
  showToast("💡 "+(d.properties.nameKo||"이 조각")+"의 자리를 반짝였어요");
}
document.getElementById("startBtn").addEventListener("click",function(){begin(document.getElementById("modeSelect").value);});
document.getElementById("homeBtn").addEventListener("click",backToMenu);
document.getElementById("shuffleBtn").addEventListener("click",reshuffle);
document.getElementById("hintBtn").addEventListener("click",hint);
document.getElementById("soundBtn").addEventListener("click",function(){sfxOn=!sfxOn;this.textContent=sfxOn?"🔊":"🔇";});
document.getElementById("againBtn").addEventListener("click",function(){begin(currentMode);});
document.getElementById("otherBtn").addEventListener("click",backToMenu);
window.addEventListener("keydown",function(e){
  if(e.key==="Escape") backToMenu();
  if(e.key.toLowerCase()==="h") hint();
});
})();
</script>
</body>
</html>
