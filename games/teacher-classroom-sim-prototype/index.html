<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 - 교사 시뮬레이터 프로토타입</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <div class="toolbar">
    <button id="pause" class="primary" type="button">일시정지</button>
    <label>속도
      <select id="speed" aria-label="게임 속도">
        <option value="1">×1</option>
        <option value="2">×2</option>
        <option value="4">×4</option>
      </select>
    </label>
    <label>수업 방식
      <select id="lesson" aria-label="수업 방식">
        <option value="lecture">설명 + 개별문제</option>
        <option value="hands">조작활동</option>
        <option value="pair">짝활동</option>
        <option value="quiz">퀴즈형 수업</option>
      </select>
    </label>
    <button id="showReport" type="button">현재 교시 결과 보기</button>
    <button id="reset" type="button">하루 다시 시작</button>
  </div>

  <section class="daybar">
    <div>
      <div id="time" class="time">08:40</div>
      <div class="sub">기본 속도 · 실제 1초 = 게임 10초</div>
    </div>
    <div class="middle">
      <div id="periodName" class="period">등교·아침활동</div>
      <div id="periodDesc" class="sub">학생들이 교실에 모이고 있습니다.</div>
      <div class="progress"><i id="progress"></i></div>
    </div>
    <div>
      <div id="locationName" class="period">교실</div>
      <div class="sub">교사가 보고 있는 공간</div>
    </div>
  </section>

  <nav class="scene-nav" aria-label="학교 공간 이동">
    <button type="button" data-scene="classroom">교실 <span class="count">0</span></button>
    <button type="button" data-scene="hallway">복도 <span class="count">0</span></button>
    <button type="button" data-scene="gym">체육관 <span class="count">0</span></button>
    <button type="button" data-scene="playground">운동장 <span class="count">0</span></button>
    <button type="button" data-scene="cafeteria">급식실 <span class="count">0</span></button>
  </nav>

  <div class="layout">
    <section>
      <div id="world" class="world scene-classroom" aria-label="학교 생활 시뮬레이션">
        <div id="sceneTitle" class="scene-title">교실</div>
        <div id="props"></div>

        <div id="teacher" class="teacher" style="left:50%;top:22%">
          <img src="../../assets/game/characters/people/kenney-platformer-characters/adventurer/poses/adventurer-stand.png" alt="">
          <span>선생님</span>
        </div>

        <div id="students"></div>
        <div id="offscreen" class="offscreen-note">8명 보임</div>

        <section id="report" class="report" hidden aria-live="polite">
          <div class="report-head">
            <div>
              <div id="reportTitle" class="period">1교시 결과</div>
              <div id="reportSub" class="sub"></div>
            </div>
            <div id="grade" class="grade">B+</div>
          </div>

          <div class="metrics">
            <div class="metric"><strong id="mDesign">0</strong><span>수업 설계 적합성</span></div>
            <div class="metric"><strong id="mEngage">0</strong><span>실제 참여도</span></div>
            <div class="metric"><strong id="mLearn">0</strong><span>학습 성과</span></div>
            <div class="metric"><strong id="mClimate">0</strong><span>교실 안정성</span></div>
          </div>

          <div class="report-cols">
            <div>
              <h4>이번 시간에 있었던 일</h4>
              <ul id="incidentList"></ul>
            </div>
            <div>
              <h4>교사가 발견한 것</h4>
              <ul id="findingList"></ul>
            </div>
          </div>

          <div class="report-actions">
            <button id="continueBtn" class="primary" type="button">다음 시간으로</button>
          </div>
        </section>
      </div>

      <div id="schedule" class="schedule" aria-label="오늘 시간표"></div>
    </section>

    <aside class="panel">
      <h3 id="studentName">학생 선택</h3>
      <div id="studentSummary" class="sub">학생을 눌러 직접 개입할 수 있습니다. 다른 공간의 일은 직접 이동해서 확인해야 합니다.</div>
      <div id="studentState" class="state">—</div>
      <div class="actions">
        <button id="approach" type="button" disabled>가까이 가기</button>
        <button id="call" type="button" disabled>이름 부르기</button>
        <button id="praise" type="button" disabled>칭찬하기</button>
        <button id="hint" type="button" disabled>힌트 주기</button>
        <button id="chalk" type="button" disabled>분필 톡</button>
        <button id="seat" type="button" disabled>자리 바꾸기</button>
      </div>
      <div id="memory" class="sub" style="margin-top:9px"></div>

      <div class="observe">
        <h4>이 공간에서 보이고 들리는 일</h4>
        <div id="feed" class="feed"></div>
      </div>
    </aside>
  </div>
</main>
<script src="./game.js"></script>
</body>
</html>
