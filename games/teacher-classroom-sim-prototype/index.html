<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25353a">
<title>우리 반: 담임교사 업무 시뮬레이터</title>
<link rel="stylesheet" href="./style.css?v=42">
</head>
<body>
<main id="app">
  <header class="statusbar">
    <div class="day-copy">
      <strong>첫 출근 · 월요일</strong>
      <span id="phaseLabel">등교 준비</span>
    </div>
    <div class="clock-block">
      <strong id="clock">08:30</strong>
      <span id="phaseHint">1교시까지 30분</span>
    </div>
    <button id="helpButton" class="header-button" type="button">도움말</button>
    <button id="resetButton" class="header-button danger" type="button">첫날 다시</button>
  </header>

  <section class="office-scene" aria-label="담임교사 교탁">
    <div class="classroom-backdrop" aria-hidden="true">
      <div class="window-light"></div>
      <div class="board">
        <small>3학년 2반</small>
        <strong id="boardSubject">좋은 아침!</strong>
        <span id="boardNote">오늘도 한 명씩 천천히.</span>
      </div>
      <div class="student-silhouettes">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <aside class="waiting-panel">
      <div class="panel-title">
        <span>기다리는 일</span>
        <strong id="waitingCount">0</strong>
      </div>
      <div id="waitingList" class="waiting-list">
        <p class="empty-copy">아직 기다리는 일이 없습니다.</p>
      </div>
    </aside>

    <section id="visitorZone" class="visitor-zone" aria-live="polite">
      <div id="emptyVisitor" class="empty-visitor">
        <div class="hallway-glow"></div>
        <strong>교실이 조용한 틈입니다.</strong>
        <span>책상 위 일을 처리하거나 잠시 기다려 보세요.</span>
      </div>

      <article id="visitorCard" class="visitor-card" hidden>
        <div id="visitorAvatar" class="visitor-avatar" aria-hidden="true">
          <span class="hair"></span><span class="face"></span><span class="body"></span>
        </div>
        <div class="visitor-content">
          <div class="visitor-kicker">
            <span id="visitorRole">학생</span>
            <small id="visitorTime">08:34</small>
          </div>
          <h1 id="visitorName">태호</h1>
          <p id="visitorStage" class="stage-copy"></p>
          <blockquote id="visitorDialogue"></blockquote>
          <div id="contextLine" class="context-line" hidden></div>
          <div id="actionList" class="action-list"></div>
          <button id="deferButton" class="defer-button" type="button">지금은 넘어간다</button>
        </div>
      </article>

      <article id="resultCard" class="result-card" hidden>
        <small id="resultKicker">그 뒤</small>
        <h2 id="resultTitle">태호가 고개를 끄덕였다.</h2>
        <p id="resultText"></p>
        <button id="resultClose" type="button">마무리</button>
      </article>
    </section>

    <section class="desk" aria-label="교탁 위 도구">
      <div class="desk-shadow"></div>

      <button id="rosterButton" class="desk-object roster-object" type="button">
        <span class="book-stack"><i></i><i></i><i></i></span>
        <strong>학급 명부</strong>
        <small>아이들 정보</small>
      </button>

      <button id="recordButton" class="desk-object record-object" type="button">
        <span class="binder"></span>
        <strong>기록철</strong>
        <small id="recordBadge">기록 0</small>
      </button>

      <button id="computerButton" class="desk-object computer-object" type="button">
        <span class="monitor"><i id="monitorNotice">업무</i></span>
        <span class="keyboard"></span>
        <strong>업무 컴퓨터</strong>
        <small id="computerBadge">할 일 확인</small>
      </button>

      <button id="phoneButton" class="desk-object phone-object" type="button">
        <span class="phone"><i></i></span>
        <strong>전화기</strong>
        <small id="phoneBadge">조용함</small>
      </button>

      <button id="noteButton" class="desk-object note-object" type="button">
        <span class="sticky-note">메모</span>
        <strong>포스트잇</strong>
        <small>내가 적어두기</small>
      </button>
    </section>

    <aside class="task-panel">
      <div class="panel-title">
        <span>오늘 할 일</span>
        <strong id="taskCount">0</strong>
      </div>
      <div id="taskList" class="task-list"></div>
    </aside>

    <button id="fastForwardButton" class="fast-forward-button" type="button" aria-label="빠르게 시간 보내기">
      <span aria-hidden="true">⏩</span>
      <strong>빨리 가기</strong>
      <small>누르고 있기 · Space</small>
    </button>

    <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  </section>

  <section id="toolModal" class="modal" hidden>
    <div class="modal-card">
      <header>
        <div>
          <small id="modalKicker">교탁 도구</small>
          <h2 id="modalTitle">학급 명부</h2>
        </div>
        <button id="modalClose" type="button" aria-label="닫기">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </section>

  <section id="tutorial" class="tutorial" hidden>
    <div class="tutorial-card">
      <small>첫날 안내</small>
      <h2 id="tutorialTitle"></h2>
      <p id="tutorialText"></p>
      <div id="tutorialVisual" class="tutorial-visual"></div>
      <button id="tutorialNext" type="button">다음</button>
    </div>
  </section>

  <section id="dayEnd" class="day-end" hidden>
    <div class="day-end-card">
      <small>첫날 근무</small>
      <h2 id="dayEndTitle">이제 퇴근할 수 있습니다.</h2>
      <p id="dayEndLead"></p>
      <div id="dayEndSummary" class="day-end-summary"></div>
      <div class="day-end-actions">
        <button id="overtimeButton" class="secondary" type="button">조금 더 남는다</button>
        <button id="leaveButton" type="button">오늘은 퇴근한다</button>
      </div>
    </div>
  </section>
</main>
<script src="./game.js?v=44"></script>
</body>
</html>
