<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>마라탕 한 그릇</title>
<link rel="stylesheet" href="maratang-selfbar.css?v=5">
<script type="importmap">{"imports":{"three":"../../assets/vendor/three-r160/three.module.js","three/addons/":"../../assets/vendor/three-r160/addons/"}}</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="shop-name">마라탕 한 그릇</div>
    <div class="top-stats">
      <span>손님 <b id="served">0</b>/5</span>
      <span>점수 <b id="score">0</b></span>
      <button id="soundBtn" type="button">SOUND ON</button>
    </div>
  </header>

  <main class="playfield" id="playfield">
    <canvas id="scene" aria-label="마라탕 셀프바"></canvas>

    <section class="order-ticket" id="orderTicket">
      <small>주문서</small>
      <h2 id="orderTitle">주문을 준비 중이에요</h2>
      <p id="orderText"></p>
      <div class="patience"><span id="patienceFill"></span></div>
    </section>

    <section class="scale-readout" aria-label="그릇 무게와 가격">
      <div><small>무게</small><b><span id="weight">0</span>g</b></div>
      <div><small>가격</small><b>₩<span id="cost">0</span></b></div>
    </section>

    <div id="ingredientLabels" class="ingredient-labels" aria-hidden="true"></div>

    <div id="dragTip" class="drag-tip">재료를 잡아 그릇에 넣으세요</div>

    <div class="shopping-actions" id="shoppingActions">
      <button id="undoBtn" type="button">하나 빼기</button>
      <button id="clearBtn" type="button">비우기</button>
      <button id="checkoutBtn" class="primary" type="button">다 담았어요</button>
    </div>

    <div class="spice-dock" id="spiceDock" hidden>
      <div class="spice-title">맵기</div>
      <div class="spice-options" id="spiceOptions"></div>
      <button id="backToBarBtn" type="button">셀프바로</button>
      <button id="cookBtn" class="primary" type="button">끓이기</button>
    </div>

    <div class="cook-dock" id="cookDock" hidden>
      <div class="cook-progress"><span id="cookFill"></span></div>
      <div id="cookText">보글보글 끓이는 중</div>
      <button id="serveBtn" class="primary" type="button" hidden>서빙하기</button>
    </div>
  </main>
</div>

<div class="overlay show" id="startOverlay">
  <div class="start-card">
    <h1>마라탕 한 그릇</h1>
    <p>주문서를 보고 셀프바의 재료를 직접 끌어 그릇에 담으세요.</p>
    <button id="startBtn" class="primary big" type="button">영업 시작</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <small id="resultKicker">손님 평가</small>
    <h2 id="resultTitle">잘 만들었어요</h2>
    <div class="result-score"><b id="resultScore">0</b><span>점</span></div>
    <p id="resultText"></p>
    <button id="nextBtn" class="primary big" type="button">다음 손님</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="maratang-selfbar.js?v=5"></script>
</body>
</html>
