<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>병아리는 어디에? 🐣</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --primary: #FFD166;
            --secondary: #06D6A0;
            --danger: #EF476F;
            --text: #26547C;
            --bg: #F8FFE5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Jua', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
            padding: 20px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.5rem;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none; /* 시작 전엔 숨김 */
        }

        #board {
            position: relative;
            height: clamp(330px, 55vh, 500px);
            width: 100%;
            margin: 0 auto;
        }

        .slot {
            position: absolute;
            width: 100px;
            height: 120px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            will-change: left, top;
        }

        /* 컵이 많아질수록 살짝 작게 만들어 서로 겹치지 않도록 함 */
        #board.cups-5 .cup-emoji { font-size: 74px; }
        #board.cups-5 .chick-emoji { font-size: 54px; }
        #board.cups-7 .slot { width: 86px; height: 104px; }
        #board.cups-7 .cup-emoji { font-size: 66px; }
        #board.cups-7 .chick-emoji { font-size: 46px; }

        /* 컵 스타일 (🥤) */
        .cup-emoji {
            font-size: 80px;
            line-height: 1;
            position: absolute;
            bottom: 0;
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.2));
        }

        /* 컵이 들릴 때 */
        .slot.lift .cup-emoji {
            transform: translateY(-80px) rotate(-10deg);
        }

        /* 컵을 가리킬 때 애니메이션 (게임 중일때만) */
        .slot.interactive:hover .cup-emoji {
            transform: scale(1.1);
        }
        .slot.interactive:active .cup-emoji {
            transform: scale(0.95);
        }

        /* 병아리 스타일 (🐤) */
        .chick-emoji {
            font-size: 60px;
            position: absolute;
            bottom: 10px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* 병아리가 있는 슬롯의 컵이 들리면 병아리 표시 */
        .slot.has-chick.lift .chick-emoji {
            opacity: 1;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* UI 오버레이 */
        #message-area {
            height: 60px;
            font-size: 1.8rem;
            margin-top: 20px;
            color: var(--danger);
            font-weight: bold;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 255, 229, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        button {
            font-family: 'Jua', sans-serif;
            font-size: 2rem;
            padding: 15px 40px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #04a57b;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #04a57b;
        }

        /* 반응형 */
        @media (max-width: 600px) {
            #game-container { padding: 12px; }
            header { margin-bottom: 18px; }
            #board { height: clamp(330px, 58vh, 430px); }
            .slot { width: 78px; height: 96px; }
            .cup-emoji { font-size: 66px; }
            .chick-emoji { font-size: 46px; bottom: 5px; }
            #board.cups-5 .cup-emoji { font-size: 62px; }
            #board.cups-5 .chick-emoji { font-size: 43px; }
            #board.cups-7 .slot { width: 68px; height: 86px; }
            #board.cups-7 .cup-emoji { font-size: 54px; }
            #board.cups-7 .chick-emoji { font-size: 38px; }
            h1 { font-size: 2rem; }
            .stats { gap: 14px; font-size: 1.15rem; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>병아리는 어디에? 🐤</h1>
            <div class="stats" id="stats-bar">
                <div>레벨: <span id="level-display">1</span></div>
                <div>점수: <span id="score-display">0</span></div>
                <div>컵: <span id="cup-count-display">3</span>개</div>
            </div>
        </header>

        <div id="board">
            <!-- 컵들은 JS로 배치됩니다 -->
        </div>

        <div id="message-area"></div>

        <div id="overlay">
            <h2 style="font-size: 2rem; margin-bottom: 20px;">시작해볼까요?</h2>
            <button id="start-btn">게임 시작!</button>
        </div>
    </div>

    <script>
        /** --- 게임 상태 및 설정 --- */
        let level = 1;
        let score = 0;
        let currentSpeed = 1200; // 초기 이동 속도 (매우 느림 - 1.2초)
        const baseSpeed = 1200;
        let chickCupIndex = 0; // 병아리가 숨어 있는 '컵 자체'의 번호
        let canGuess = false;
        let shuffleCount = 3; // 처음엔 3번 섞기
        let cupCount = 3;
        let currentSlots = []; // index: 화면 위치, value: 그 위치에 놓인 컵 번호

        // 난이도별 2차원 위치. left/top을 동시에 움직여 상하·좌우·대각선 이동을 만든다.
        const layouts = {
            3: [
                { x: 20, y: 62 }, { x: 50, y: 62 }, { x: 80, y: 62 }
            ],
            5: [
                { x: 50, y: 20 },
                { x: 20, y: 50 }, { x: 50, y: 50 }, { x: 80, y: 50 },
                { x: 50, y: 80 }
            ],
            7: [
                { x: 20, y: 26 }, { x: 50, y: 26 }, { x: 80, y: 26 },
                { x: 50, y: 50 },
                { x: 20, y: 74 }, { x: 50, y: 74 }, { x: 80, y: 74 }
            ]
        };

        function getCupCountForLevel(value = level) {
            if (value >= 7) return 7;
            if (value >= 4) return 5;
            return 3;
        }

        function getPositions() {
            return layouts[cupCount];
        }
        
        const board = document.getElementById('board');
        const messageArea = document.getElementById('message-area');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const statsBar = document.getElementById('stats-bar');
        const levelDisplay = document.getElementById('level-display');
        const scoreDisplay = document.getElementById('score-display');
        const cupCountDisplay = document.getElementById('cup-count-display');
        
        const cups = []; // DOM 엘리먼트 배열

        /** --- 오디오 시스템 (Web Audio API) --- */
        let audioCtx;
        let bgmOscillators = [];
        let isBgmPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 효과음 재생기
        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') { // 병아리 숨을 때
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.start(t);
                osc.stop(t + 0.2);
            } else if (type === 'swoosh') { // 컵 섞일 때 (바람소리 느낌)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.2);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.1, t + 0.1);
                gain.gain.linearRampToValueAtTime(0, t + 0.3);
                osc.start(t);
                osc.stop(t + 0.3);
            } else if (type === 'win') { // 정답
                osc.type = 'square';
                // 띠-리-링 아르페지오
                osc.frequency.setValueAtTime(523.25, t); // C5
                osc.frequency.setValueAtTime(659.25, t + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, t + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, t + 0.3); // C6
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.2, t + 0.05);
                gain.gain.setValueAtTime(0.2, t + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
                osc.start(t);
                osc.stop(t + 0.8);
            } else if (type === 'lose') { // 오답
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(150, t + 0.5);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.2, t + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                osc.start(t);
                osc.stop(t + 0.6);
            }
        }

        // BGM 루프 (신나는 멜로디)
        function startBGM() {
            if (isBgmPlaying || !audioCtx) return;
            isBgmPlaying = true;
            
            const notes = [
                392.00, 329.63, 392.00, 329.63, // G4, E4, G4, E4 (도미솔미)
                392.00, 440.00, 392.00, 0,      // G4, A4, G4, 쉬고
                349.23, 293.66, 349.23, 293.66, // F4, D4, F4, D4 (파레파레)
                329.63, 349.23, 392.00, 0       // E4, F4, G4, 쉬고
            ];
            const noteDuration = 0.4;
            let noteIndex = 0;
            let nextNoteTime = audioCtx.currentTime + 0.1;

            function scheduleBGM() {
                if (!isBgmPlaying) return;
                
                while (nextNoteTime < audioCtx.currentTime + 0.1) {
                    const freq = notes[noteIndex];
                    if (freq > 0) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        gain.gain.setValueAtTime(0.05, nextNoteTime); // 볼륨 작게 (효과음 강조)
                        gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + noteDuration - 0.05);
                        
                        osc.start(nextNoteTime);
                        osc.stop(nextNoteTime + noteDuration);
                        bgmOscillators.push(osc); // 정지용
                    }
                    
                    nextNoteTime += noteDuration;
                    noteIndex = (noteIndex + 1) % notes.length;
                }
                requestAnimationFrame(scheduleBGM);
            }
            scheduleBGM();
        }

        /** --- 게임 초기화 및 생성 --- */
        function placeCup(cupEl, positionIndex, animate = true) {
            const pos = getPositions()[positionIndex];
            cupEl.style.transition = animate
                ? `left ${currentSpeed}ms ease-in-out, top ${currentSpeed}ms ease-in-out`
                : 'none';
            cupEl.style.left = `${pos.x}%`;
            cupEl.style.top = `${pos.y}%`;
        }

        function createCups(newCount = getCupCountForLevel()) {
            cupCount = newCount;
            board.innerHTML = '';
            board.classList.remove('cups-3', 'cups-5', 'cups-7');
            board.classList.add(`cups-${cupCount}`);
            cups.length = 0;
            currentSlots = Array.from({ length: cupCount }, (_, i) => i);

            for (let i = 0; i < cupCount; i++) {
                const cupDiv = document.createElement('div');
                cupDiv.className = 'slot';
                cupDiv.dataset.cupId = i;
                
                const chick = document.createElement('div');
                chick.className = 'chick-emoji';
                chick.innerText = '🐤';
                
                const cup = document.createElement('div');
                cup.className = 'cup-emoji';
                cup.innerText = '🥤';
                
                cupDiv.appendChild(chick);
                cupDiv.appendChild(cup);
                placeCup(cupDiv, i, false);
                
                // 컵 번호는 이동해도 변하지 않으므로 병아리 추적에 그대로 사용 가능
                cupDiv.addEventListener('click', () => handleGuess(i));
                
                board.appendChild(cupDiv);
                cups.push(cupDiv);
            }
            updateStats();
        }

        function resetBoard() {
            cups.forEach((cup, i) => {
                cup.classList.remove('lift', 'has-chick', 'interactive');
                currentSlots[i] = i;
                placeCup(cup, i, false);
                cup.style.zIndex = 10;
            });

            // 즉시 배치한 뒤 다음 프레임부터 이동 애니메이션을 다시 활성화
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    cups.forEach(cup => {
                        cup.style.transition = `left ${currentSpeed}ms ease-in-out, top ${currentSpeed}ms ease-in-out`;
                    });
                });
            });
        }

        function showMessage(msg, type='text') {
            messageArea.innerText = msg;
            messageArea.style.color = type === 'danger' ? 'var(--danger)' : (type === 'success' ? 'var(--secondary)' : 'var(--text)');
        }

        /** --- 게임 흐름 --- */
        async function startRound() {
            canGuess = false;

            const neededCupCount = getCupCountForLevel();
            if (cupCount !== neededCupCount || cups.length !== neededCupCount) {
                createCups(neededCupCount);
                showMessage(neededCupCount === 5 ? "난이도 상승! 컵이 5개가 되었어요!" : "최고 난이도! 컵이 7개가 되었어요!", "danger");
                await sleep(900);
            }

            resetBoard();
            showMessage("병아리가 숨어요!", "text");
            
            // 병아리가 숨을 '컵 자체'를 랜덤으로 결정
            chickCupIndex = Math.floor(Math.random() * cupCount);
            cups[chickCupIndex].classList.add('has-chick');

            // 1. 숨는 모습 보여주기
            await sleep(500);
            playSound('pop');
            cups[chickCupIndex].classList.add('lift'); // 컵 올리기
            
            await sleep(1500); // 1.5초간 보여줌 (유치원생을 위해 길게)
            cups[chickCupIndex].classList.remove('lift'); // 컵 닫기
            playSound('pop');
            
            await sleep(800);
            showMessage("잘 보세요!", "danger");
            
            // 2. 컵 섞기
            await shuffleCups();
            
            // 3. 입력 대기
            showMessage("어디에 있을까요? 눌러보세요!", "text");
            cups.forEach(cup => cup.classList.add('interactive'));
            canGuess = true;
        }

        function buildMovePairs() {
            const pos = getPositions();
            const pairs = [];

            // 너무 먼 점프만 반복되지 않도록 가까운 위치들을 우선 연결한다.
            // 5·7컵 배치에서는 이 조합 안에 수평/수직/대각선 이동이 모두 포함된다.
            for (let a = 0; a < pos.length; a++) {
                for (let b = a + 1; b < pos.length; b++) {
                    const dx = Math.abs(pos[a].x - pos[b].x);
                    const dy = Math.abs(pos[a].y - pos[b].y);
                    const distance = Math.hypot(dx, dy);
                    const limit = cupCount === 3 ? 36 : (cupCount === 5 ? 46 : 40);
                    if (distance <= limit) pairs.push([a, b]);
                }
            }
            return pairs;
        }

        async function shuffleCups() {
            const movePairs = buildMovePairs();
            let lastPairKey = '';

            for (let i = 0; i < shuffleCount; i++) {
                let pair = movePairs[Math.floor(Math.random() * movePairs.length)];
                let pairKey = pair.join('-');

                // 같은 두 자리만 연속으로 왕복하는 장면은 피한다.
                if (movePairs.length > 1) {
                    let guard = 0;
                    while (pairKey === lastPairKey && guard < 10) {
                        pair = movePairs[Math.floor(Math.random() * movePairs.length)];
                        pairKey = pair.join('-');
                        guard++;
                    }
                }
                lastPairKey = pairKey;

                await swapSlots(pair[0], pair[1]);
                await sleep(Math.max(35, Math.min(90, currentSpeed * 0.12)));
            }
        }

        function swapSlots(posA, posB) {
            return new Promise(resolve => {
                const cupIdA = currentSlots[posA];
                const cupIdB = currentSlots[posB];
                const domA = cups[cupIdA];
                const domB = cups[cupIdB];

                domA.style.zIndex = 20;
                domB.style.zIndex = 10;

                // left와 top을 함께 바꾸므로 수평·수직·대각선 이동이 자연스럽게 나타난다.
                placeCup(domA, posB, true);
                placeCup(domB, posA, true);

                currentSlots[posA] = cupIdB;
                currentSlots[posB] = cupIdA;

                playSound('swoosh');
                setTimeout(resolve, currentSpeed);
            });
        }

        async function handleGuess(clickedCupIndex) {
            if (!canGuess) return;
            canGuess = false;
            cups.forEach(cup => cup.classList.remove('interactive'));

            const clickedCup = cups[clickedCupIndex];
            clickedCup.classList.add('lift');

            if (clickedCupIndex === chickCupIndex) {
                // 정답!
                playSound('win');
                showMessage("정답이에요! 참 잘했어요! 🎉", "success");
                score += 10 * level;
                level++;
                
                // 난이도 상승: 속도 + 섞는 횟수 + 컵 개수/이동 방향까지 단계적으로 상승
                currentSpeed = Math.max(300, currentSpeed * 0.85); // 최소 300ms까지 빨라짐
                if (level % 2 === 0) shuffleCount++; // 2레벨마다 섞는 횟수 1증가

                updateStats();
                
                await sleep(2500);
                startRound();
            } else {
                // 오답!
                playSound('lose');
                showMessage("앗! 거기가 아니에요. 😭", "danger");
                
                // 진짜 병아리 보여주기
                await sleep(1000);
                cups[chickCupIndex].classList.add('lift');
                
                await sleep(2500);
                
                // 초기화 후 재시작 (Game Over 처리 대신 처음부터 다시)
                level = 1;
                score = 0;
                currentSpeed = baseSpeed;
                shuffleCount = 3;
                cupCount = 3;
                createCups(3);
                updateStats();
                
                showMessage("다시 한 번 해볼까요?", "text");
                await sleep(1000);
                startRound();
            }
        }

        function updateStats() {
            levelDisplay.innerText = level;
            scoreDisplay.innerText = score;
            if (cupCountDisplay) cupCountDisplay.innerText = cupCount;
        }

        // 유틸: 비동기 대기
        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        /** --- 이벤트 리스너 --- */
        startBtn.addEventListener('click', () => {
            initAudio();
            startBGM();
            overlay.style.display = 'none';
            statsBar.style.display = 'flex';
            createCups(3);
            startRound();
        });

    </script>
</body>
</html>
