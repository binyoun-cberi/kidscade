<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>벽란도 상행기</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0a}
#game{display:block;width:100%;height:100%;border:0;background:#080a0a}
#patchStatus{position:fixed;left:8px;bottom:8px;z-index:5;padding:4px 7px;border-radius:4px;background:rgba(18,13,9,.72);color:#bda97e;font:700 9px/1.2 system-ui,sans-serif;pointer-events:none;opacity:.85}
</style>
</head>
<body>
<iframe id="game" title="벽란도 상행기" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="patchStatus">삽화 + 3D 항구 에셋 연결 중…</div>
<script>
(() => {
  const frame=document.getElementById('game');
  const status=document.getElementById('patchStatus');
  const target=new URL('./벽란도 상행기.html',location.href);
  const params=new URLSearchParams(location.search);
  params.delete('v');
  target.search=params.toString();
  target.hash=location.hash;
  frame.src=target.href;

  function inject(){
    const doc=frame.contentDocument,win=frame.contentWindow;
    if(!doc||!win){status.textContent='게임 프레임 연결 실패';return}
    const loader=doc.createElement('script');
    loader.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    loader.onload=()=>{
      const patch=doc.createElement('script');
      patch.src='./byeokrando-assets.js?v=1';
      patch.onload=()=>{status.textContent='삽화 + 3D 항구 연결 완료';setTimeout(()=>status.remove(),2200)};
      patch.onerror=()=>{status.textContent='3D 항구 에셋 레이어를 불러오지 못했습니다'};
      doc.body.appendChild(patch);
    };
    loader.onerror=()=>{status.textContent='GLTF 로더를 불러오지 못했습니다'};
    doc.head.appendChild(loader);
    win.focus();
  }
  frame.addEventListener('load',inject,{once:true});
  window.addEventListener('pointerdown',()=>frame.contentWindow?.focus(),{passive:true});
})();
</script>
</body>
</html>
