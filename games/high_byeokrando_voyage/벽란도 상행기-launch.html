<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>벽란도 상행기</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0a}
#game{display:block;width:100%;height:100%;border:0;background:#080a0a}
#patchStatus{position:fixed;left:8px;bottom:8px;z-index:5;padding:4px 7px;border-radius:4px;background:rgba(18,13,9,.72);color:#bda97e;font:700 9px/1.2 system-ui,sans-serif;pointer-events:none;opacity:.85}
</style>
</head>
<body>
<iframe id="game" title="벽란도 상행기" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="patchStatus">삽화 + 3D 항구 에셋 연결 중…</div>
<script>
(async()=>{
  const frame=document.getElementById('game');
  const status=document.getElementById('patchStatus');
  const source=new URL('./벽란도 상행기.html',location.href);

  window.addEventListener('message',e=>{
    if(e.source===frame.contentWindow&&e.data?.type==='byeokrando-hybrid-ready'){
      status.textContent='삽화 + 3D 항구 연결 완료';
      setTimeout(()=>status.remove(),1800);
    }
  });

  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();

    const marker='boot();\n})();';
    const bridge=[
      'window.__byeokrandoBridge={',
      ' getState:()=>State,',
      ' getPortGroup:()=>portGroup,',
      ' getCamera:()=>camera,',
      ' getPorts:()=>PORTS,',
      ' hideIllustratedPort,',
      ' showIllustratedPort,',
      ' getBuildPort:()=>buildPort,',
      ' setBuildPort:fn=>{buildPort=fn},',
      ' getStartSailing:()=>startSailing,',
      ' setStartSailing:fn=>{startSailing=fn}',
      '};',
      'boot();',
      '})();'
    ].join('\n');

    if(!html.includes(marker))throw new Error('bridge anchor missing');
    html=html.replace(marker,bridge);

    const baseHref=new URL('./',location.href).href;
    html=html.replace('<head>','<head><base href="'+baseHref+'">');

    const extras=[
      '<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>',
      '<script src="./byeokrando-assets.js?v=2"><\/script>'
    ].join('\n');
    html=html.replace('</body>',extras+'\n</body>');

    frame.srcdoc=html;
  }catch(err){
    console.warn('[Byeokrando hybrid launch]',err);
    status.textContent='확장 레이어 없이 기본 게임으로 시작합니다';
    frame.src=source.href;
    setTimeout(()=>status.remove(),2600);
  }

  window.addEventListener('pointerdown',()=>frame.contentWindow?.focus(),{passive:true});
})();
</script>
</body>
</html>
