<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">분자 공방</title>
  <desc id="desc">키즈케이드 원자 타일을 조합해 물질을 발견하는 과학 퍼즐</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#fff6df"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7faff"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#536789" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1100" cy="105" r="126" fill="#ffd981" opacity=".28"/>
  <circle cx="108" cy="590" r="170" fill="#78d9ca" opacity=".20"/>
  <g opacity=".5" fill="#fff"><circle cx="930" cy="520" r="5"/><circle cx="1010" cy="456" r="7"/><circle cx="1115" cy="565" r="5"/><circle cx="850" cy="118" r="6"/><circle cx="757" cy="195" r="4"/></g>
  <g font-family="system-ui, sans-serif" fill="#263451">
    <rect x="74" y="74" width="76" height="76" rx="25" fill="#718ff1"/>
    <text x="112" y="128" text-anchor="middle" fill="#fff" font-size="42" font-weight="900">K</text>
    <text x="174" y="104" fill="#8291aa" font-size="17" font-weight="800" letter-spacing="3">KIDSCADE SCIENCE CLUB</text>
    <text x="170" y="220" font-size="68" font-weight="900">분자 공방</text>
    <text x="174" y="274" fill="#65748e" font-size="27" font-weight="700">원자 타일을 모아 새로운 물질을 발견해 봐!</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="712" y="151" width="395" height="374" rx="34" fill="url(#card)" stroke="#dbe5f1" stroke-width="3"/>
    <rect x="748" y="184" width="322" height="46" rx="15" fill="#eef3ff"/>
    <circle cx="772" cy="207" r="7" fill="#69cfb6"/><text x="792" y="214" font-family="system-ui,sans-serif" fill="#6d7d99" font-size="17" font-weight="800">오늘의 연구 · 물</text>
    <path d="M861 363 L953 363 M861 363 L907 278" stroke="#b9c8de" stroke-width="11" stroke-linecap="round"/>
    <circle cx="861" cy="363" r="48" fill="#ff8fa3" stroke="#fff" stroke-width="8"/><circle cx="953" cy="363" r="48" fill="#ff725e" stroke="#fff" stroke-width="8"/><circle cx="907" cy="278" r="48" fill="#ff8fa3" stroke="#fff" stroke-width="8"/>
    <g font-family="system-ui,sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#fff"><text x="861" y="374">H</text><text x="953" y="374">O</text><text x="907" y="289">H</text></g>
    <rect x="810" y="440" width="199" height="48" rx="16" fill="#e9f3ff"/><text x="909" y="473" text-anchor="middle" font-family="system-ui,sans-serif" fill="#7188cf" font-size="25" font-weight="900">H₂O 발견!</text>
  </g>
  <g font-family="system-ui,sans-serif" font-weight="900" text-anchor="middle">
    <rect x="330" y="378" width="116" height="122" rx="27" fill="#fff" stroke="#dfe7f2" stroke-width="3"/><circle cx="388" cy="423" r="27" fill="#ff8fa3" opacity=".18"/><text x="388" y="434" fill="#ff8fa3" font-size="34">H</text><text x="388" y="476" fill="#8492aa" font-size="16">수소</text>
    <rect x="468" y="378" width="116" height="122" rx="27" fill="#fff" stroke="#dfe7f2" stroke-width="3"/><circle cx="526" cy="423" r="27" fill="#ff725e" opacity=".18"/><text x="526" y="434" fill="#ff725e" font-size="34">O</text><text x="526" y="476" fill="#8492aa" font-size="16">산소</text>
    <path d="M601 439h48" stroke="#8ca0c6" stroke-width="7" stroke-linecap="round"/><path d="m637 425 15 14-15 14" fill="none" stroke="#8ca0c6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="system-ui,sans-serif" fill="#71819a" font-size="17" font-weight="700"><text x="80" y="573">원자 타일을 놓고 · 화학식을 맞추고 · 발견 도감을 채우자</text></g>
</svg>
