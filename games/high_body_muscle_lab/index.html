<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 몸아 움직여! 뼈·근육 실험실</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <header class="mission-bar">
    <div class="mission-compact">
      <span id="missionStep">1 / 8</span>
      <b id="missionTitle">팔을 굽혀 보세요</b>
    </div>
    <button id="helpBtn" class="mini-action" type="button" aria-label="도움말">?</button>
  </header>

  <main class="game-layout">
    <section class="play-stage">
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="560" aria-label="뼈와 근육을 직접 조종하는 과학 실험 게임"></canvas>

        <button id="xrayBtn" class="xray-fab" type="button" aria-pressed="false" aria-label="뼈와 근육 보기">🩻</button>

        <div id="floatingHint" class="floating-hint" aria-live="polite">Q를 눌러 팔을 굽혀 보세요.</div>

        <div id="miniHud" class="mini-hud hidden" aria-live="polite">
          <b id="miniMetric">팔꿈치 0°</b>
          <span id="miniState"></span>
        </div>

        <div id="assistBox" class="assist-pill hidden">
          <span>균형 보조</span>
          <b id="assistText">70%</b>
          <i><span id="assistBar"></span></i>
        </div>

        <div id="toast" class="toast" aria-live="polite"></div>

        <div id="missionCard" class="result-card hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <div class="result-icon" id="resultIcon">🔬</div>
          <h2 id="resultTitle">성공!</h2>
          <p id="resultText"></p>
          <div class="science-note">
            <b id="scienceTitle">왜 움직였을까요?</b>
            <p id="scienceText"></p>
          </div>
          <button id="nextBtn" class="primary" type="button">다음 실험</button>
        </div>
      </div>
    </section>

    <aside class="controls-panel">
      <div class="controls" id="controls">
        <button class="muscle-key" data-key="q" type="button">
          <kbd>Q</kbd><b>위팔 앞쪽</b><small>팔꿈치를 굽혀요</small><i><span></span></i>
        </button>
        <button class="muscle-key" data-key="w" type="button">
          <kbd>W</kbd><b>위팔 뒤쪽</b><small>팔꿈치를 펴요</small><i><span></span></i>
        </button>
        <button class="muscle-key" data-key="e" type="button">
          <kbd>E</kbd><b>어깨</b><small>팔 전체를 들어요</small><i><span></span></i>
        </button>
        <button class="muscle-key" data-key="r" type="button">
          <kbd>R</kbd><b>손</b><small>물건을 잡아요</small><i><span></span></i>
        </button>
      </div>
      <button id="resetBtn" class="reset-compact" type="button">↻ 다시</button>
    </aside>
  </main>

  <div class="hidden-telemetry" aria-hidden="true">
    <span id="missionGoal"></span><span id="activeMuscle"></span>
    <span id="measureLabel"></span><span id="measureText"></span>
    <span id="stateLabel"></span><span id="jointText"></span>
    <span id="goalText"></span><span id="hintText"></span>
    <span id="controllerTitle"></span><span id="controllerHelp"></span>
  </div>
</div>

<div id="tutorial" class="overlay hidden">
  <div class="dialog">
    <span class="eyebrow">처음 한 번만</span>
    <h1>Q W E R로 몸을 움직여요</h1>
    <div class="tutorial-keys">
      <span>Q</span><span>W</span><span>E</span><span>R</span>
    </div>
    <p>버튼을 누르고 있는 동안 해당 근육이 힘을 써요. 미션마다 버튼의 역할이 바뀌며, 4번째부터는 전신을 조종합니다.</p>
    <button id="tutorialStart" class="primary wide" type="button">바로 해보기</button>
  </div>
</div>

<script src="../../kidscade-game-sdk.js" data-game-id="high_body_muscle_lab" data-title="내 몸아 움직여!" data-shell="true" data-mute="false" data-orientation="landscape"></script>
<script src="game.js?v=3"></script>
</body>
</html>
