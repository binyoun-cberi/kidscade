<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>월드 퍼즐 지도 맞추기</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;font-family:'Noto Sans KR',sans-serif;background:#eef7ff;overflow:hidden;touch-action:none}
#game-board{height:calc(100vh - 82px);position:relative}
.piece path.visible{filter:drop-shadow(2px 4px 4px rgba(15,23,42,.28));cursor:grab;transition:filter .15s,opacity .15s}
.piece:hover path.visible{filter:drop-shadow(4px 6px 6px rgba(15,23,42,.38))}
.piece.placed path.visible{stroke:#fff;stroke-width:1.2;filter:drop-shadow(0 0 2px rgba(255,255,255,.9));cursor:default}
.target-map path{fill:#dbeafe;stroke:#bfdbfe;stroke-width:.8;stroke-linejoin:round}
.country-label{font-size:10px;font-weight:900;fill:#0f172a;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
@media(max-width:768px){.country-label{font-size:8px}}
.bg-pattern{background-color:#eff6ff;background-image:radial-gradient(#93c5fd 1.2px,transparent 1.2px);background-size:24px 24px}
.loader{width:52px;height:52px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{pointer-events:none;transform:translate(-50%,-10px);opacity:0;transition:.2s}
.toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body class="flex flex-col h-screen select-none">
<div id="start-screen" class="fixed inset-0 z-50 bg-pattern flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-6 md:p-9 rounded-3xl shadow-2xl text-center max-w-xl w-11/12 border-4 border-blue-500">
    <div class="text-6xl mb-2">🌍</div>
    <h1 class="text-4xl md:text-5xl font-black text-blue-600 mb-2">월드 퍼즐</h1>
    <p class="text-slate-500 font-bold mb-6">나라 조각을 제자리에 맞춰 세계지도를 완성하세요!</p>
    <div class="text-left mb-5">
      <label class="block text-sm font-black text-blue-800 mb-2" for="mode-select">어디부터 여행할까요?</label>
      <select id="mode-select" class="w-full bg-blue-50 border-2 border-blue-200 rounded-xl p-3 font-bold text-slate-800">
        <optgroup label="🌏 추천">
          <option value="Asia" selected>🌏 아시아</option>
          <option value="Europe">🌍 유럽</option>
          <option value="Africa">🌍 아프리카</option>
          <option value="North America">🌎 북아메리카</option>
          <option value="South America">🌎 남아메리카</option>
          <option value="Oceania">🌊 오세아니아</option>
        </optgroup>
        <optgroup label="🔥 도전">
          <option value="WORLD">🌐 세계 전체 도전</option>
        </optgroup>
      </select>
      <p id="mode-hint" class="text-xs text-blue-600 font-bold mt-2">대륙별 모드는 화면을 크게 확대해 작은 나라를 잡기 쉽습니다.</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-5 text-sm">
      <div class="bg-sky-50 rounded-2xl p-3"><div class="text-2xl">🧩</div><b>지도 퍼즐</b><div class="text-slate-500">모양과 위치 익히기</div></div>
      <div class="bg-amber-50 rounded-2xl p-3"><div class="text-2xl">🏳️</div><b>나라 이름</b><div class="text-slate-500">잡으면 이름 표시</div></div>
    </div>
    <button id="start-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl text-xl shadow-[0_5px_0_rgb(29,78,216)] active:translate-y-1 active:shadow-none">🚀 퍼즐 시작하기</button>
    <p class="text-[11px] text-slate-400 mt-4">지도 데이터: Natural Earth 1:110m · KIDSCADE 내부 파일 사용</p>
  </div>
</div>

<header class="h-[82px] bg-white shadow-sm flex items-center justify-between px-3 md:px-6 z-10 shrink-0 gap-2">
  <div class="flex items-center gap-2 min-w-0">
    <button id="home-btn" class="bg-slate-100 hover:bg-slate-200 rounded-xl px-3 py-2 font-bold">🏠 <span class="hidden md:inline">메뉴</span></button>
    <div class="min-w-0"><div id="map-title" class="font-black text-blue-600 text-lg md:text-2xl truncate">월드 퍼즐</div><div id="held-name" class="text-xs md:text-sm font-bold text-slate-500 truncate">조각을 잡아보세요</div></div>
  </div>
  <div class="flex items-center gap-2 bg-blue-50 border border-blue-100 rounded-2xl px-3 py-2">
    <b id="progress" class="text-blue-600">0/0</b><span class="text-blue-200">|</span><b id="timer" class="font-mono text-rose-500">00:00</b>
  </div>
  <button id="shuffle-btn" class="bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl px-3 py-2 font-bold">🔄 <span class="hidden md:inline">섞기</span></button>
</header>

<main id="game-board" class="flex-1 bg-gradient-to-b from-sky-50 to-white">
  <svg id="map-svg" class="w-full h-full"></svg>
  <div id="loading" class="absolute inset-0 bg-white/90 backdrop-blur-sm hidden flex-col items-center justify-center z-30"><div class="loader mb-4"></div><div class="font-black text-2xl text-blue-700">세계지도를 펼치는 중...</div></div>
  <div id="country-toast" class="toast absolute left-1/2 top-4 z-20 bg-white/95 border-2 border-blue-200 shadow-xl rounded-2xl px-5 py-3 text-center">
    <div id="toast-flag" class="text-3xl"></div><div id="toast-name" class="font-black text-lg text-slate-800"></div><div id="toast-sub" class="text-xs font-bold text-blue-500"></div>
  </div>
</main>

<div id="clear-modal" class="fixed inset-0 bg-slate-900/45 hidden items-center justify-center z-50">
  <div class="bg-white rounded-[2rem] p-8 w-11/12 max-w-sm text-center shadow-2xl">
    <div class="text-7xl mb-3">🎉</div><h2 class="text-3xl font-black text-blue-600">지도 완성!</h2>
    <p class="font-bold text-slate-500 mt-2">모든 나라를 제자리에 맞췄어요.</p>
    <div class="bg-blue-50 rounded-2xl p-4 my-6"><div class="text-xs font-bold text-blue-700">클리어 시간</div><div id="final-time" class="text-4xl font-black font-mono text-rose-500">00:00</div></div>
    <button id="again-btn" class="w-full bg-blue-500 text-white rounded-xl py-3 font-black mb-2">↻ 같은 지도 다시 하기</button>
    <button id="menu-btn" class="w-full bg-slate-100 rounded-xl py-3 font-black">≡ 다른 대륙 선택</button>
  </div>
</div>

<script>
const DATA_URL="../../assets/maps/world-countries-110m.geojson";
const svg=d3.select("#map-svg");
const colors=["#fca5a5","#fdba74","#fde68a","#bef264","#86efac","#6ee7b7","#67e8f9","#7dd3fc","#93c5fd","#a5b4fc","#c4b5fd","#d8b4fe","#f0abfc","#f9a8d4"];
const color=d3.scaleOrdinal(colors);
let data,features=[],placed=0,total=0,active=false,startAt=0,timerId=null,currentMode="Asia";
const tinyBoost=new Set(["LUX","MNE","MKD","SWZ","LSO","GMB","BRN","TLS","TTO","JAM","CYP","LBN","QAT","KWT","ISR","PSE","DJI","RWA","BDI","GNQ","SLV","BLZ"]);

function flagEmoji(code){
 if(!code||code.length!==2||code.includes("-")) return "🌐";
 return [...code.toUpperCase()].map(c=>String.fromCodePoint(127397+c.charCodeAt())).join("");
}
function nameOf(d){return d.properties.NAME_KO||d.properties.NAME||"이름 없음"}
function titleFor(mode){return mode==="WORLD"?"세계 전체":mode==="Asia"?"아시아":mode==="Europe"?"유럽":mode==="Africa"?"아프리카":mode==="North America"?"북아메리카":mode==="South America"?"남아메리카":"오세아니아"}
function modeFeatures(mode){
 return data.features.filter(f=>f.properties.NAME!=="Antarctica"&&(mode==="WORLD"||f.properties.CONTINENT===mode));
}
function resetTimer(){clearInterval(timerId);document.querySelector("#timer").textContent="00:00"}
function startTimer(){startAt=Date.now();timerId=setInterval(()=>{const s=Math.floor((Date.now()-startAt)/1000);document.querySelector("#timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000)}
function updateProgress(){document.querySelector("#progress").textContent=placed+"/"+total}
function showCountry(d,placedNow=false){
 document.querySelector("#held-name").textContent=(placedNow?"착! ":"")+flagEmoji(d.properties.ISO_A2)+" "+nameOf(d);
 document.querySelector("#toast-flag").textContent=flagEmoji(d.properties.ISO_A2);
 document.querySelector("#toast-name").textContent=nameOf(d);
 document.querySelector("#toast-sub").textContent=(placedNow?"정답! · ":"")+titleFor(d.properties.CONTINENT);
 const t=document.querySelector("#country-toast");t.classList.add("show");clearTimeout(showCountry._t);showCountry._t=setTimeout(()=>t.classList.remove("show"),placedNow?1100:700)
}
function spawn(w,h,world){
 const a=Math.random()*Math.PI*2;
 const rx=w*(world?.48:.36)+Math.random()*w*.12,ry=h*(world?.42:.34)+Math.random()*h*.12;
 return{x:Math.cos(a)*rx,y:Math.sin(a)*ry}
}
function playTone(freq=900){
 try{const ctx=playTone.ctx||(playTone.ctx=new (AudioContext||webkitAudioContext)());const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18)}catch(e){}
}
async function loadData(){
 if(data)return;
 const r=await fetch(DATA_URL,{cache:"force-cache"});if(!r.ok)throw new Error("지도 데이터를 불러오지 못했습니다.");data=await r.json()
}
async function begin(){
 currentMode=document.querySelector("#mode-select").value;
 document.querySelector("#start-screen").classList.add("hidden");
 const loading=document.querySelector("#loading");loading.classList.remove("hidden");loading.classList.add("flex");
 try{await loadData();features=modeFeatures(currentMode);render()}catch(e){alert(e.message);document.querySelector("#start-screen").classList.remove("hidden")}finally{loading.classList.add("hidden");loading.classList.remove("flex")}
}
function render(){
 svg.selectAll("*").remove();placed=0;total=features.length;updateProgress();resetTimer();startTimer();active=true;
 document.querySelector("#map-title").textContent=titleFor(currentMode)+" · "+total+"조각";
 document.querySelector("#held-name").textContent="조각을 잡아 나라 이름을 확인하세요";
 const node=svg.node(),w=node.clientWidth,h=node.clientHeight,pad=w<768?32:78;
 const fc={type:"FeatureCollection",features};
 const projection=(currentMode==="WORLD"?d3.geoNaturalEarth1():d3.geoMercator()).fitExtent([[pad,pad],[w-pad,h-pad]],fc);
 const path=d3.geoPath(projection);
 svg.append("g").attr("class","target-map").selectAll("path").data(features).join("path").attr("d",path);
 const drag=d3.drag()
  .on("start",function(e,d){if(d.placed||!active)return;d3.select(this).raise();showCountry(d)})
  .on("drag",function(e,d){if(d.placed||!active)return;d.ox+=e.dx;d.oy+=e.dy;d3.select(this).attr("transform",`translate(${d.ox},${d.oy})`)})
  .on("end",function(e,d){if(d.placed||!active)return;const dist=Math.hypot(d.ox,d.oy);let threshold=w<768?44:32;if(total>70)threshold+=10;if(tinyBoost.has(d.properties.ISO_A3))threshold+=18;if(dist<threshold){d.placed=true;d.ox=d.oy=0;d3.select(this).attr("class","piece placed").transition().duration(280).ease(d3.easeBackOut.overshoot(1.3)).attr("transform","translate(0,0)");placed++;updateProgress();showCountry(d,true);playTone(1200);if(placed===total)finish()}})
 const g=svg.append("g").selectAll(".piece").data(features).join("g").attr("class","piece").each(function(d){const s=spawn(w,h,currentMode==="WORLD");d.ox=s.x;d.oy=s.y;d.placed=false;d3.select(this).attr("transform",`translate(${d.ox},${d.oy})`)}).call(drag);
 g.append("path").attr("class","visible").attr("d",path).attr("fill",(d,i)=>color(i)).attr("stroke","#fff").attr("stroke-width",1);
 g.append("path").attr("d",path).attr("fill","transparent").attr("stroke","transparent").attr("stroke-width",d=>tinyBoost.has(d.properties.ISO_A3)?20:10).style("pointer-events","stroke");
 if(total<=60){
  g.append("text").attr("class","country-label").attr("text-anchor","middle").attr("dy",".35em").attr("transform",d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`}).text(d=>nameOf(d)).style("opacity",.88)
 }
}
function finish(){active=false;clearInterval(timerId);document.querySelector("#final-time").textContent=document.querySelector("#timer").textContent;setTimeout(()=>{const m=document.querySelector("#clear-modal");m.classList.remove("hidden");m.classList.add("flex")},300)}
document.querySelector("#start-btn").addEventListener("click",begin);
document.querySelector("#home-btn").addEventListener("click",()=>{if(active&&placed>0&&placed<total&&!confirm("진행 중인 퍼즐이 있습니다. 메뉴로 돌아갈까요?"))return;active=false;resetTimer();svg.selectAll("*").remove();document.querySelector("#start-screen").classList.remove("hidden")});
document.querySelector("#shuffle-btn").addEventListener("click",()=>{const w=svg.node().clientWidth,h=svg.node().clientHeight;svg.selectAll(".piece").filter(d=>!d.placed).each(function(d){const s=spawn(w,h,currentMode==="WORLD");d.ox=s.x;d.oy=s.y;d3.select(this).transition().duration(450).attr("transform",`translate(${d.ox},${d.oy})`)})});
document.querySelector("#again-btn").addEventListener("click",()=>{const m=document.querySelector("#clear-modal");m.classList.add("hidden");m.classList.remove("flex");render()});
document.querySelector("#menu-btn").addEventListener("click",()=>{const m=document.querySelector("#clear-modal");m.classList.add("hidden");m.classList.remove("flex");resetTimer();svg.selectAll("*").remove();document.querySelector("#start-screen").classList.remove("hidden")});
window.addEventListener("resize",()=>{if(active&&features.length)render()});
</script>
</body>
</html>
