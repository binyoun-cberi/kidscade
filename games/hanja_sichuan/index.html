<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131f33">
<title>한자 사천성 | KIDSCADE</title>
<style>
:root{--bg:#101b2d;--panel:#19283e;--panel2:#213451;--ink:#f7f4e9;--muted:#b4c2d2;--gold:#f5c76d;--jade:#82e5c7;--red:#fd7d91;--tile:72px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:radial-gradient(ellipse 65% 40% at 50% -10%,#28456a 0%,transparent 90%),var(--bg)}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}.app{max-width:1260px;padding:22px clamp(12px,2.5vw,28px) 85px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:56px;height:56px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#ffdfa1,#dca750);border:2px solid #ffefc7;box-shadow:0 7px 24px #dca75033;border-radius:16px;color:#3d2c1b;font:900 36px/1 serif}
h1{font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:-.05em}.tagline{color:var(--muted);margin:3px 0 0;font-size:13px;font-weight:650}
.audio-btn,.secondary{border:1px solid #52657f;color:#e6edf5;background:#273a53;padding:11px 15px;border-radius:12px;font-weight:800;min-height:44px}
.config{display:flex;align-items:end;gap:12px;flex-wrap:wrap;border:1px solid #3e526d;background:#192b43df;border-radius:20px;padding:15px;box-shadow:0 15px 35px #0002}
.config label{display:grid;gap:6px;color:#c8d4e4;font-size:12px;font-weight:800}.config select{min-height:44px;min-width:120px;color:#fff;background:#243a56;border:1px solid #5b708c;border-radius:11px;padding:0 11px;font-weight:750}.primary{background:linear-gradient(160deg,#ffdc8b,#f0b95a);color:#2b261e;border:0;padding:11px 25px;border-radius:12px;font-weight:950;min-height:44px;box-shadow:0 5px 0 #8a6632}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #8a6632}
.guide{font-size:13px;line-height:1.6;color:#d0deee;margin:12px 0 15px}.guide strong{color:var(--gold)}
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:0 0 14px}.stat{background:#1a2e47;border:1px solid #344b68;border-radius:14px;padding:11px 13px;text-align:center}.stat span{display:block;font-size:11px;color:var(--muted);font-weight:800}.stat strong{display:block;font-size:clamp(17px,3vw,27px);color:#fff;font-variant-numeric:tabular-nums}.stat.timing strong{color:var(--gold)}.stat.timing.urgent strong{color:var(--red);animation:blink .7s infinite alternate}@keyframes blink{to{opacity:.42}}
.game{border:1px solid #344b64;border-radius:22px;padding:8px;box-shadow:0 20px 55px #0005;background:radial-gradient(circle at 50% 0%,#274461 0%,#14253c 75%);position:relative;overflow:hidden}
.board-scroller{overflow:auto;overscroll-behavior:contain;text-align:center;min-height:300px;border-radius:16px;scrollbar-color:#62758a transparent}
.board-wrap{display:inline-block;position:relative;margin:calc(var(--tile) * .52);vertical-align:top}
.board{display:grid;grid-template-columns:repeat(var(--cols),var(--tile));grid-auto-rows:var(--tile);width:max-content}
.tile{width:calc(var(--tile) - 5px);height:calc(var(--tile) - 5px);margin:2.5px;border-radius:11px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid #ceb888;background:linear-gradient(147deg,#fff9e7,#eddfc0);box-shadow:0 4px 0 #887b68,0 6px 12px #0004;color:#243c46;transition:transform .13s,filter .13s;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile::after{content:"";position:absolute;inset:5px;border:1px solid #ccb992;border-radius:6px;pointer-events:none}
.tile.hanja .glyph{font-family:"Noto Serif CJK KR","Batang","Songti SC",serif;font-size:calc(var(--tile) * .49);font-weight:900;line-height:1.08}
.tile.reading{background:linear-gradient(148deg,#e5fff5,#bce7dd);border-color:#76b5a5;color:#143f3d}
.tile.reading .meaning{font-size:calc(var(--tile) * .19);font-weight:900;line-height:1.2;letter-spacing:-.04em;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.reading .reading-text{font-size:calc(var(--tile) * .19);font-weight:900;color:#247c73}
.tile:hover{filter:brightness(1.07)}.tile.selected{transform:translateY(-3px);border-color:#ffb338;box-shadow:0 0 0 3px #fdd58f,0 5px 0 #91713f,0 0 25px #ffb33866}
.tile.hinted{outline:4px solid #ffe783;outline-offset:-4px;animation:hintGlow .55s ease-in-out infinite alternate}.tile.clearing{animation:vanish .34s ease-in forwards}
.tile.empty{opacity:0;pointer-events:none}.link-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:10;filter:drop-shadow(0 0 7px #f5e29c)}
@keyframes vanish{to{transform:scale(.45) rotate(7deg);opacity:0}}@keyframes hintGlow{to{filter:brightness(1.28)}}@keyframes blinkToast{50%{transform:translateY(-4px)}}
.toast{min-height:28px;text-align:center;color:#cbd9e6;font-weight:800;padding:7px 12px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px}.actions button{min-height:46px;border:1px solid #536985;background:#263c56;color:#fff;border-radius:13px;padding:10px 19px;font-weight:850}.actions button:hover{background:#314b68}.actions button:disabled{opacity:.45;cursor:not-allowed}
.bottom-note{font-size:12px;color:#9bb0c5;margin:16px 2px;line-height:1.6}
dialog{position:fixed;max-width:min(460px,calc(100vw - 28px));border:1px solid #c0a875;border-radius:22px;padding:29px;background:#20354f;color:white;box-shadow:0 25px 75px #0009;z-index:30;text-align:center}dialog::backdrop{background:#0b1529d9;backdrop-filter:blur(5px)}dialog h2{font-size:30px;margin:0 0 10px}dialog p{line-height:1.7;color:#d4e1ed}.result-score{font-size:41px;color:var(--gold);font-weight:950;margin:5px 0}.dialog-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dialog-buttons button{min-height:44px}
@media(max-width:600px){:root{--tile:62px}.app{padding:12px 8px 82px}header{margin:6px 5px 14px}h1{font-size:25px}.brand-icon{width:45px;height:45px;font-size:29px}.tagline{font-size:11px}.config{gap:8px;padding:11px;border-radius:15px}.config label{flex:1 1 85px}.config select{min-width:0;width:100%;font-size:13px}.config .primary{flex:1 1 100%;font-size:15px}.hud{gap:5px}.stat{padding:8px 3px;border-radius:10px}.stat span{font-size:10px}.stat strong{font-size:17px}.board-wrap{margin:calc(var(--tile)*.52)}.game{padding:3px;border-radius:14px}.actions{gap:6px}.actions button{flex:1 1 auto;padding:8px 11px;font-size:12px}.guide{font-size:12px;margin:10px 4px}.tile{border-radius:9px}.tile.reading .meaning,.tile.reading .reading-text{font-size:12px}}
@media(prefers-reduced-motion:reduce){.tile,.stat{transition:none}.tile.clearing,.tile.hinted{animation:none}}
</style>
<script src="../../kidscade-game-sdk.js" data-game-id="hanja_sichuan" data-title="한자 사천성" data-shell="true" data-orientation="any"></script>
<script src="../hanja_test/data/hanja-grade-data.js"></script>
<script src="./engine.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-icon" aria-hidden="true">漢</div><div><h1>한자 사천성</h1><p class="tagline">한자와 뜻·음을 찾아 이어 보세요</p></div></div>
    <button type="button" id="soundBtn" class="audio-btn" aria-pressed="true">소리 켜짐</button>
  </header>
  <section class="config" aria-label="게임 설정">
    <label>한자 급수<select id="grade">
      <option value="8">8급 · 50자</option><option value="7">7급 · 150자</option>
      <option value="6">6급 · 300자</option><option value="5">5급 · 500자</option>
      <option value="4">4급 · 1,000자</option><option value="3">3급 · 1,817자</option>
      <option value="2">2급 · 2,355자</option><option value="1">1급 · 3,500자</option>
    </select></label>
    <label>판 크기<select id="difficulty">
      <option value="start">입문 · 4×4</option><option value="easy">초급 · 6×6</option>
      <option value="normal" selected>중급 · 8×6</option><option value="hard">고급 · 8×8</option>
      <option value="master">달인 · 10×8</option>
    </select></label>
    <label>방식<select id="mode"><option value="relaxed" selected>천천히 · 연습</option><option value="timed">시간 도전</option></select></label>
    <button class="primary" type="button" id="startBtn">새 판 시작</button>
  </section>
  <p class="guide"><strong>규칙</strong> 같은 한자와 뜻·음 패를 골라 연결하세요. 다른 패를 통과할 수 없고, 선은 최대 <strong>두 번만</strong> 꺾을 수 있어요. 판 바깥을 돌아가는 길도 가능해요.</p>
  <section class="hud" aria-label="게임 점수">
    <div class="stat"><span>남은 쌍</span><strong id="remaining">-</strong></div>
    <div class="stat"><span>점수</span><strong id="score">0</strong></div>
    <div class="stat"><span>연속 성공</span><strong id="combo">0</strong></div>
    <div class="stat timing" id="timeBox"><span id="timeLabel">경과 시간</span><strong id="clock">00:00</strong></div>
    <div class="stat"><span>최고 점수</span><strong id="best">0</strong></div>
  </section>
  <main class="game">
    <div class="board-scroller" id="boardScroll" aria-label="한자 사천성 게임판" tabindex="0">
      <div class="board-wrap" id="boardWrap">
        <div id="board" class="board" role="group" aria-label="한자와 훈음 연결 게임판"></div>
        <svg id="linkLayer" class="link-layer" aria-hidden="true"></svg>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite">새 판 시작을 누르면 게임이 시작돼요.</div>
  </main>
  <nav class="actions" aria-label="게임 기능">
    <button type="button" id="hintBtn">힌트 보기 (−20점)</button>
    <button type="button" id="shuffleBtn">패 섞기 (−50점)</button>
    <button type="button" id="pauseBtn">잠시 멈춤</button>
  </nav>
  <p class="bottom-note">뜻과 음 패는 연한 초록색, 한자는 아이보리색입니다. 틀린 한자는 이 기기의 복습 목록에 저장됩니다. 제한 시간 모드에서 시간이 끝나면 도전이 종료됩니다.</p>
</div>
<dialog id="finishDialog" aria-labelledby="finishTitle">
  <h2 id="finishTitle">완성!</h2>
  <p id="finishMessage"></p>
  <div class="result-score" id="finishScore">0점</div>
  <p id="finishDetail"></p>
  <div class="dialog-buttons">
    <button class="primary" id="againBtn" type="button">한 판 더!</button>
    <button class="secondary" id="closeBtn" type="button">결과 닫기</button>
  </div>
</dialog>
<script>
(()=>{
  'use strict';
  const E=window.HanjaSichuanEngine;
  const DATA=window.KIDSCADE_HANJA_GRADE_DATA;
  const SDK=window.KidscadeGame;
  const $=id=>document.getElementById(id);
  const MODES={start:[4,4,150],easy:[6,6,210],normal:[8,6,270],hard:[8,8,330],master:[10,8,390]};
  const st={board:[],cols:8,rows:6,grade:8,difficulty:'normal',mode:'relaxed',active:false,paused:false,selected:-1,locked:false,score:0,combo:0,maxCombo:0,wrong:0,hints:0,shuffles:0,remaining:0,elapsed:0,deadline:0,pauseAt:0,startedAt:0,token:0,dialogOpen:false};
  let audioContext=null,unlockTimer=0,lineTimer=0,hintTimer=0,toastTimer=0;
  const now=()=>Date.now();
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const storage={
    read:(key,fallback)=>{try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v);}catch{return fallback;}},
    write:(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
  };
  function key(){return 'hanja_sichuan_best_'+st.grade+'_'+st.difficulty+'_'+st.mode;}
  function tone(kind){
    if(!window.AudioContext&&!window.webkitAudioContext)return;
    if($('soundBtn').getAttribute('aria-pressed')!=='true'||SDK?.state?.().muted)return;
    try{
      if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      const t=audioContext.currentTime;
      const notes=kind==='good'?[660,880]:kind==='win'?[523,659,784]:[220,185];
      notes.forEach((freq,i)=>{
        const o=audioContext.createOscillator(),gain=audioContext.createGain();
        o.type=kind==='bad'?'triangle':'sine';o.frequency.value=freq;
        const a=t+i*.075;gain.gain.setValueAtTime(.0001,a);
        gain.gain.exponentialRampToValueAtTime(.08,a+.015);
        gain.gain.exponentialRampToValueAtTime(.0001,a+.16);
        o.connect(gain).connect(audioContext.destination);o.start(a);o.stop(a+.17);
      });
    }catch{}
  }
  function announce(message){
    clearTimeout(toastTimer);
    $('toast').textContent=message;
    toastTimer=setTimeout(()=>{if(st.active)$('toast').textContent='한자와 뜻·음 패를 순서대로 선택하세요.';},2600);
  }
  function updateHud(){
    $('remaining').textContent=st.remaining;
    $('score').textContent=st.score.toLocaleString('ko-KR');
    $('combo').textContent=st.combo;
    $('best').textContent=Number(storage.read(key(),0)).toLocaleString('ko-KR');
    const secs=st.mode==='timed' ? Math.max(0,Math.ceil((st.deadline-(st.paused?st.pauseAt:now()))/1000)) : Math.max(0,Math.floor((st.paused?st.pauseAt:now())-st.startedAt)/1000);
    $('clock').textContent=fmt(secs);
    $('timeLabel').textContent=st.mode==='timed'?'남은 시간':'경과 시간';
    $('timeBox').classList.toggle('urgent',st.mode==='timed'&&secs<=20);
    $('pauseBtn').textContent=st.paused?'계속하기':'잠시 멈춤';
    ['hintBtn','shuffleBtn','pauseBtn'].forEach(id=>$(id).disabled=!st.active);
  }
  function clearEffects(){
    clearTimeout(unlockTimer);clearTimeout(lineTimer);clearTimeout(hintTimer);
    $('linkLayer').replaceChildren();
    document.querySelectorAll('.hinted,.clearing').forEach(el=>el.classList.remove('hinted','clearing'));
  }
  function drawBoard(){
    const cell=matchMedia('(max-width:600px)').matches?62:72;
    const b=$('board');
    $('boardWrap').style.setProperty('--tile',cell+'px');
    $('boardWrap').style.setProperty('--cols',st.cols);
    b.style.setProperty('--tile',cell+'px');
    b.style.setProperty('--cols',st.cols);
    b.replaceChildren();
    const fragment=document.createDocumentFragment();
    st.board.forEach((tile,index)=>{
      const btn=document.createElement('button');
      btn.type='button';btn.dataset.index=index;btn.className='tile '+(tile?tile.kind:'empty');
      if(!tile){btn.disabled=true;btn.setAttribute('aria-hidden','true');fragment.appendChild(btn);return;}
      if(tile.kind==='hanja'){
        const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=tile.hanja;btn.appendChild(glyph);
        btn.setAttribute('aria-label','한자 '+tile.hanja);
      }else{
        const meaning=document.createElement('span');meaning.className='meaning';meaning.textContent=tile.meaning;
        const reading=document.createElement('span');reading.className='reading-text';reading.textContent=tile.reading;
        btn.append(meaning,reading);btn.setAttribute('aria-label','뜻과 음 '+tile.label);
      }
      if(st.selected===index)btn.classList.add('selected');
      btn.disabled=!st.active||st.paused||st.locked;
      fragment.appendChild(btn);
    });
    b.appendChild(fragment);
    const svg=$('linkLayer');
    svg.setAttribute('viewBox','0 0 '+st.cols*cell+' '+st.rows*cell);
    svg.style.width=st.cols*cell+'px';svg.style.height=st.rows*cell+'px';
  }
  function line(path){
    const cell=matchMedia('(max-width:600px)').matches?62:72;
    const d=path.map((p,i)=>(i?'L':'M')+' '+((p.x+.5)*cell)+' '+((p.y+.5)*cell)).join(' ');
    const svg=$('linkLayer');svg.replaceChildren();
    const back=document.createElementNS('http://www.w3.org/2000/svg','path');
    back.setAttribute('d',d);back.setAttribute('fill','none');back.setAttribute('stroke','#fff2b5');back.setAttribute('stroke-width','9');back.setAttribute('stroke-linecap','round');back.setAttribute('stroke-linejoin','round');
    const front=back.cloneNode();front.setAttribute('stroke','#e6a839');front.setAttribute('stroke-width','3');
    svg.append(back,front);
  }
  function saveWrong(tile){
    const storageKey='hanja_sichuan_review_'+st.grade;
    const old=storage.read(storageKey,[]);
    const latest=[{hanja:tile.hanja,label:tile.label},...old.filter(x=>x.hanja!==tile.hanja)].slice(0,200);
    storage.write(storageKey,latest);
  }
  function noMovesRescue(){
    if(!st.active||st.remaining===0)return;
    if(E.availableMatches(st.board,st.cols,st.rows).length===0){
      rearrange(true);
      announce('연결 가능한 패가 없어서 자동으로 섞었어요!');
    }
  }
  function rearrange(automatic=false){
    const pairs=st.board.filter(x=>x&&x.kind==='hanja').map(x=>({pairId:x.pairId,hanja:x.hanja,meaning:x.meaning,reading:x.reading,label:x.label}));
    if(!pairs.length)return;
    clearEffects();st.token++;st.selected=-1;st.locked=false;
    try{
      st.board=E.generateBoard(pairs,st.cols,st.rows).board;
      if(!automatic){st.score=Math.max(0,st.score-50);st.shuffles++;st.combo=0;tone('bad');announce('패를 다시 섞었어요. −50점');}
      drawBoard();updateHud();
    }catch(error){console.error(error);announce('패를 섞지 못했어요. 다시 시도해 주세요.');}
  }
  function pick(index){
    if(!st.active||st.paused||st.locked||!st.board[index])return;
    if(st.selected<0){st.selected=index;drawBoard();return;}
    if(st.selected===index){st.selected=-1;drawBoard();return;}
    const before=st.selected;st.selected=-1;
    const a=st.board[before],b=st.board[index];
    const path=E.matchPath(st.board,st.cols,st.rows,before,index);
    if(!path){
      st.wrong++;st.combo=0;st.score=Math.max(0,st.score-5);tone('bad');
      if(a.pairId!==b.pairId){saveWrong(a);saveWrong(b);announce('다른 한자예요! 뜻과 음을 다시 확인하세요. −5점');}
      else announce('길이 막혔어요! 두 번 이하 꺾여야 연결돼요. −5점');
      drawBoard();updateHud();return;
    }
    st.locked=true;st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);
    const gained=100+Math.min(st.combo-1,10)*10;st.score+=gained;
    st.remaining--;tone('good');
    drawBoard();line(path);
    const cellButtons=$('board').children;
    cellButtons[before]?.classList.add('clearing');cellButtons[index]?.classList.add('clearing');
    announce(a.hanja+' — '+a.label+' · +'+gained+'점'+(st.combo>=3?' · '+st.combo+'콤보!':''));
    const token=st.token;
    unlockTimer=setTimeout(()=>{
      if(token!==st.token)return;
      st.board[before]=null;st.board[index]=null;st.locked=false;
      $('linkLayer').replaceChildren();drawBoard();updateHud();
      if(!st.remaining)finish(true);
      else noMovesRescue();
    },340);
  }
  function hint(){
    if(!st.active||st.paused||st.locked)return;
    const moves=E.availableMatches(st.board,st.cols,st.rows);
    if(!moves.length){rearrange(true);return;}
    const {a,b}=moves[0];
    st.hints++;st.combo=0;st.score=Math.max(0,st.score-20);
    document.querySelector('[data-index="'+a+'"]')?.classList.add('hinted');
    document.querySelector('[data-index="'+b+'"]')?.classList.add('hinted');
    clearTimeout(hintTimer);
    hintTimer=setTimeout(()=>document.querySelectorAll('.hinted').forEach(el=>el.classList.remove('hinted')),1600);
    announce('반짝이는 두 패를 찾아보세요. −20점');updateHud();
  }
  function finish(clear){
    if(!st.active)return;
    st.active=false;st.locked=false;st.token++;clearEffects();
    const elapsed=Math.max(0,Math.floor((now()-st.startedAt)/1000));
    const bonus=clear&&st.mode==='timed'?Math.max(0,Math.ceil((st.deadline-now())/1000))*3:0;
    st.score+=bonus;
    const previous=Number(storage.read(key(),0));
    if(clear&&st.score>previous)storage.write(key(),st.score);
    updateHud();drawBoard();
    if(clear)tone('win');
    const title=clear?'모든 한자 연결 성공!':'시간이 다 되었어요';
    $('finishTitle').textContent=title;
    $('finishScore').textContent=st.score.toLocaleString('ko-KR')+'점';
    $('finishMessage').textContent=clear?'한자와 뜻·음을 모두 찾아냈어요!':'다시 도전해 기록을 높여보세요.';
    $('finishDetail').textContent='최대 '+st.maxCombo+'콤보 · 실수 '+st.wrong+'회 · 힌트 '+st.hints+'회 · 섞기 '+st.shuffles+'회'+(bonus?' · 시간 보너스 '+bonus+'점':'');
    const dialog=$('finishDialog');
    if(!dialog.open)dialog.showModal();
    if(SDK?.result){
      SDK.result({scope:'stage',status:clear?'completed':'failed',outcome:clear?'clear':'fail',score:st.score,stage:st.difficulty,grade:st.grade,mode:st.mode,wrong:st.wrong,hints:st.hints,maxCombo:st.maxCombo,clean:clear&&st.wrong===0&&st.hints===0&&st.shuffles===0,elapsedSeconds:elapsed});
    }
    announce(title);
  }
  function newGame(){
    const grade=Number($('grade').value),difficulty=$('difficulty').value,mode=$('mode').value;
    const [cols,rows,seconds]=MODES[difficulty];
    if(!E||!DATA||!Array.isArray(DATA.entries)){announce('한자 데이터를 읽지 못했어요. 새로고침해 주세요.');return;}
    clearEffects();st.token++;
    try{
      const pairs=E.pickEntries(DATA.entries,grade,cols*rows/2);
      const generated=E.generateBoard(pairs,cols,rows);
      Object.assign(st,{board:generated.board,cols,rows,grade,difficulty,mode,active:true,paused:false,selected:-1,locked:false,score:0,combo:0,maxCombo:0,wrong:0,hints:0,shuffles:0,remaining:pairs.length,startedAt:now(),deadline:mode==='timed'?now()+seconds*1000:0,pauseAt:0});
      $('finishDialog').close();
      drawBoard();updateHud();
      $('boardScroll').scrollLeft=0;
      announce('시작! 한자와 뜻·음을 연결해 보세요.');
      SDK?.start?.({grade,board:difficulty,mode});
    }catch(error){console.error(error);announce('게임판을 만들지 못했어요. 다른 난이도로 다시 시도하세요.');}
  }
  function togglePause(){
    if(!st.active)return;
    if(!st.paused){st.paused=true;st.pauseAt=now();st.selected=-1;announce('일시 정지 중이에요.');}
    else{
      const span=now()-st.pauseAt;st.startedAt+=span;
      if(st.mode==='timed')st.deadline+=span;
      st.paused=false;announce('다시 시작!');
    }
    drawBoard();updateHud();
  }
  $('board').addEventListener('click',event=>{
    const btn=event.target.closest('button[data-index]');
    if(btn)pick(Number(btn.dataset.index));
  });
  $('startBtn').addEventListener('click',newGame);
  $('againBtn').addEventListener('click',newGame);
  $('closeBtn').addEventListener('click',()=>$('finishDialog').close());
  $('hintBtn').addEventListener('click',hint);
  $('shuffleBtn').addEventListener('click',()=>{if(st.active&&!st.paused&&!st.locked)rearrange(false);});
  $('pauseBtn').addEventListener('click',togglePause);
  $('soundBtn').addEventListener('click',()=>{
    const btn=$('soundBtn'),next=btn.getAttribute('aria-pressed')!=='true';
    btn.setAttribute('aria-pressed',String(next));btn.textContent=next?'소리 켜짐':'소리 꺼짐';
  });
  SDK?.registerPauseHandlers?.({pause:()=>{if(st.active&&!st.paused)togglePause();},resume:()=>{if(st.active&&st.paused)togglePause();}});
  SDK?.registerCleanup?.(()=>{st.active=false;st.token++;clearEffects();if(audioContext)audioContext.close().catch(()=>{});});
  window.addEventListener('resize',()=>{if(st.board.length&&!st.locked){$('linkLayer').replaceChildren();drawBoard();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.active&&!st.paused)togglePause();});
  setInterval(()=>{
    if(!st.active||st.paused)return;
    if(st.mode==='timed'&&now()>=st.deadline){finish(false);return;}
    updateHud();
  },350);
  newGame();
})();
</script>
</body>
</html>
