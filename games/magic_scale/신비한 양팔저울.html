function used(id){return right.filter(v=>v.id===id).length}
function shelf(){let r=R[idx],root=$('items');root.innerHTML='';r.shelf.forEach(id=>{let v=clone(id),wrap=document.createElement('div'),e=obj(v,'shelf'),limit=r.limits?.[id]??Infinity,remain=limit-used(id);wrap.className='shelf-item';if(remain<=0)e.classList.add('disabled');wrap.append(e);if(Number.isFinite(limit)){let c=document.createElement('span');c.className='count';c.textContent=remain;wrap.append(c)}root.append(wrap);wire(e,v,()=>remain>0)})}
function render(initial){let r=R[idx],lp=$('leftPan'),rp=$('rightPan');lp.innerHTML='';rp.innerHTML='';left.forEach(v=>lp.append(obj(v,'left')));right.forEach((v,i)=>{let e=obj(v,'right');e.title='눌러서 내려놓기';e.onclick=()=>{if(awaiting)return;right.splice(i,1);tone(260,.04);shelf();render()};rp.append(e)});let a=sum(left),b=sum(right);$('leftTotal').textContent=r.sl?a+' g':'??? g';$('rightTotal').textContent=r.sr?b+' g':'합계 숨김';$('leftBox').classList.toggle('hidden',!r.sl);$('rightBox').classList.toggle('hidden',!r.sr);let diff=Math.max(-1,Math.min(1,(b-a)/300)),angle=diff*8;animate(angle,diff,initial);let bal=a===b&&b>0;lp.classList.toggle('balanced',bal);rp.classList.toggle('balanced',bal);if(!awaiting){let f=$('feedback');f.className='feedback';if(bal){f.classList.add('good');f.innerHTML='✨ <b>수평 같아요!</b> 이제 균형 확인을 눌러 보세요.'}else if(!right.length)f.textContent=idx<2?'아래 추를 오른쪽 접시에 올려 보세요.':'먼저 추를 올리고 어느 쪽으로 기우는지 살펴보세요.';else if(r.exact)f.textContent=b<a?'오른쪽이 '+(a-b)+'g 가벼워요. 추를 더 올려 보세요.':'오른쪽이 '+(b-a)+'g 무거워요. 추를 조금 빼 보세요.';else f.textContent=b<a?'⬅️ 왼쪽이 더 무거워요. 오른쪽에 조금 더 올려 보세요.':'➡️ 오른쪽이 더 무거워요. 추를 조금 빼 보세요.'}}
function animate(angle,diff,initial){let beam=$('beam'),lp=$('leftPan'),rp=$('rightPan'),ly=-diff*28,ry=diff*28;if(!initial)try{beam.animate([{transform:'rotate('+lastAngle+'deg)'},{transform:'rotate('+(angle*1.18)+'deg)'},{transform:'rotate('+(angle*.92)+'deg)'},{transform:'rotate('+angle+'deg)'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});lp.animate([{transform:lp.style.transform||'translateY(0)'},{transform:'translateY('+(ly*1.08)+'px)'},{transform:'translateY('+ly+'px)'}],{duration:520,easing:'ease-out'});rp.animate([{transform:rp.style.transform||'translateY(0)'},{transform:'translateY('+(ry*1.08)+'px)'},{transform:'translateY('+ry+'px)'}],{duration:520,easing:'ease-out'})}catch(e){}beam.style.transform='rotate('+angle+'deg)';lp.style.transform='translateY('+ly+'px)';rp.style.transform='translateY('+ry+'px)';lastAngle=angle}
function add(v){if(awaiting)return;let r=R[idx],limit=r.limits?.[v.id]??Infinity;if(used(v.id)>=limit)return;right.push({...v});tone(520,.05);shelf();render()}
function inside(el,x,y){let r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function wire(el,v,canUse){let sx=0,sy=0;el.addEventListener('pointerdown',e=>{if(awaiting||!canUse())return;e.preventDefault();sx=e.clientX;sy=e.clientY;el.setPointerCapture?.(e.pointerId);let g=obj(v,'shelf');g.classList.add('dragghost');document.body.append(g);drag={g,v,id:e.pointerId};move(e);tone(330,.03)});el.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)move(e)});el.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;let d=drag;drag=null;$('rightPan').classList.remove('dragover');let moved=Math.hypot(e.clientX-sx,e.clientY-sy);if(inside($('rightPan'),e.clientX,e.clientY)||moved<10)add(d.v);d.g.remove()});el.addEventListener('pointercancel',e=>{if(drag?.id===e.pointerId){drag.g.remove();drag=null;$('rightPan').classList.remove('dragover')}})}
function move(e){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';$('rightPan').classList.toggle('dragover',inside($('rightPan'),e.clientX,e.clientY))}
function qtext(r,total){let n=get(r.ask).n;if(r.kind==='subtract')return '오른쪽은 '+total+'g이에요. '+n+' + '+r.known+'g = '+total+'g. '+n+'은 몇 g일까요?';if(r.kind==='half')return '오른쪽은 '+total+'g이에요. '+n+' 2개 + '+r.known+'g = '+total+'g. 하나는 몇 g일까요?';return '수평일 때 오른쪽 추는 모두 '+total+'g이에요. '+n+'은 몇 g일까요?'}
function ask(){let r=R[idx],total=sum(right);awaiting=true;$('check').disabled=true;$('hint').disabled=true;$('answerPanel').classList.remove('hide');$('answerQuestion').textContent=qtext(r,total);$('answerHint').textContent=r.kind==='subtract'?total+' - '+r.known+'을 생각해 보세요.':r.kind==='half'?'먼저 '+total+' - '+r.known+', 그리고 2개가 똑같이 나눠 가져요.':'오른쪽에 올린 추의 합이 단서예요.';let root=$('choices');root.innerHTML='';r.choices.forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=n+'g';b.onclick=()=>answer(n,b);root.append(b)});tone(720,.08)}
function answer(n,b){let r=R[idx],correct=get(r.ask).w;if(n!==correct){score=Math.max(0,score-10);$('score').textContent=score;b.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:260});$('feedback').className='feedback bad';$('feedback').textContent='아직 아니에요. 수평일 때 오른쪽에 올린 추를 다시 계산해 보세요.';tone(155,.12);return}if(!found.includes(r.ask))found.push(r.ask);done(1)}
function done(reveal){let r=R[idx],gain=100+Math.max(0,(r.ideal+2-right.length)*10);score+=gain;$('score').textContent=score;$('found').textContent=found.length;$('feedback').className='feedback good';$('feedback').innerHTML='🎉 <b>연구 성공!</b>'+(reveal?' '+get(r.ask).e+' '+get(r.ask).n+'은 <b>'+get(r.ask).w+'g</b>!':'')+' +'+gain+'점';tone(880,.15);setTimeout(()=>{idx++;idx>=R.length?finish():load()},950)}
$('check').onclick=()=>{let a=sum(left),b=sum(right),r=R[idx];if(a===b&&b>0)r.ask?ask():done(0);else{score=Math.max(0,score-5);$('score').textContent=score;$('feedback').className='feedback bad';$('feedback').textContent=b<a?'아직 왼쪽이 더 무거워요. 오른쪽에 추를 더 올려 보세요.':'아직 오른쪽이 더 무거워요. 오른쪽 추를 조금 빼 보세요.';tone(150,.1)}};
$('reset').onclick=()=>{if(awaiting)return;right=[];shelf();render();tone(250,.05)};
$('hint').onclick=()=>{if(awaiting)return;$('feedback').className='feedback';$('feedback').textContent='💡 '+R[idx].h;tone(610,.06)};
function finish(){let best=Math.max(score,Number(localStorage.getItem(BEST)||0));localStorage.setItem(BEST,String(best));$('resultText').innerHTML='8개의 연구를 모두 해결했어요.<br>점수 <b>'+score+'</b> · 최고 '+best+'<br><br>마지막에는 합계 숫자 없이 저울의 기울기와 추의 관계만으로 미지의 무게를 밝혀냈어요.';let root=$('resultDiscoveries');root.innerHTML='';found.forEach(id=>{let v=get(id),d=document.createElement('span');d.className='discovery-chip';d.textContent=v.e+' '+v.n+' '+v.w+'g';root.append(d)});$('result').classList.remove('hide');tone(760,.2)}
$('go').onclick=()=>{$('intro').classList.add('hide');load()};
$('again').onclick=()=>{idx=0;score=0;found=[];$('result').classList.add('hide');load()};
load();
})();</script></body></html>
