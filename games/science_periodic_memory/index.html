<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원소주기율표 외우기 | KIDSCADE</title><script src="../../kidscade-game-sdk.js" data-game-id="science_periodic_memory" data-title="원소주기율표 외우기" data-shell="true"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#214e68,#091626);color:#edf9ff;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px 14px 80px}h1{font-size:clamp(24px,5vw,38px)}h2{margin-top:0}p{color:#b2c8d8;line-height:1.7}.panel{background:#10283eea;border:1px solid #365670;border-radius:22px;padding:22px;margin:18px 0}button,input,select{font:inherit;min-height:48px;background:#1e3d55;color:#edf9ff;border:1px solid #527189;border-radius:12px;padding:12px;font-weight:700}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffdc70}.primary{background:#73efd1;color:#0b3028}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls label{display:grid;gap:8px;font-size:13px;flex:1}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.modes small{display:block;margin-top:8px;font-weight:400}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.cards b{display:block;font-size:32px}.cards span{display:block;margin:8px}.question{text-align:center;padding:20px}.element{margin:15px auto;width:160px;padding:20px;border-radius:20px;background:#174b5b;border:2px solid #73efd1}.element b{display:block;font-size:48px}.element span{font-size:22px}.choices{display:grid;grid-template-columns:1fr 1fr;max-width:600px;margin:15px auto;gap:10px}.choices button{font-size:22px;min-height:65px}.scroll{overflow:auto}.table{display:grid;grid-template-columns:repeat(18,48px);grid-template-rows:repeat(10,62px);gap:4px;width:max-content;padding:6px}.cell{padding:3px;min-height:0;border-radius:7px;font-size:10px;background:#174951}.cell b{display:block;font-size:20px}.cell small{font-size:9px;white-space:nowrap}.cell.done{border:2px solid #73efd1}.cell.outside{opacity:.3}.cell.target{outline:3px solid #ffd76c}.correct{background:#21694d!important}.wrong{background:#7a3248!important}#feedback{min-height:60px;text-align:center;color:#ffdc70;font-weight:700;line-height:1.7}form{display:flex;gap:10px;max-width:500px;margin:20px auto}input{width:100%;min-width:0}progress{width:100%;accent-color:#73efd1}#next{display:block;margin:auto}#result{text-align:center}#resultScore{font-size:52px;color:#73efd1}[hidden]{display:none!important}@media(max-width:600px){.modes{grid-template-columns:1fr}.panel{padding:15px}.controls{align-items:stretch}.controls label{min-width:140px}}
</style></head><body><main><div class="row" style="justify-content:space-between"><h1>⚛️ 원소주기율표 외우기</h1><button id="sound">🔊 소리</button></div>
<section id="home" class="panel"><h2>H부터 Og까지, 한 칸씩 기억해요</h2><p>원소 카드를 익힌 뒤 이름·기호 퀴즈와 빈 주기율표에 도전해요.</p><div class="row controls"><label>외울 범위<select id="range"><option value="10">첫걸음 · 1~10번</option><option value="20" selected>기본 · 1~20번</option><option value="36">확장 · 1~36번</option><option value="54">도전 · 1~54번</option><option value="118">전체 · 1~118번</option></select></label><label>맞힐 내용<select id="kind"><option value="symbol">이름 → 기호</option><option value="name">기호 → 이름</option></select></label><label>대답 방식<select id="inputMode"><option value="choice">보기에서 고르기</option><option value="write">직접 입력</option></select></label></div><div class="modes"><button id="studyStart">👀 외우기 연습<small>누르면 가려지는 원소 카드</small></button><button id="quizStart" class="primary">⚡ 원소 퀴즈<small>한 판 10문제</small></button><button id="tableStart">🧩 주기율표 채우기<small>빈자리를 찾아 누르기</small></button></div><p id="records"></p><button id="reviewStart">📒 틀린 원소 복습</button></section>
<section id="study" class="panel" hidden><button class="back">← 처음 화면</button><p>카드를 눌러 가리고, 기억한 뒤 다시 눌러 확인하세요.</p><div id="cards" class="cards"></div></section>
<section id="play" class="panel" hidden><div class="row"><button class="back">← 그만하기</button><strong id="hud"></strong></div><progress id="progress"></progress><div class="question"><div id="prompt"></div><div id="element" class="element"></div></div><div id="choices" class="choices"></div><form id="answerForm" hidden><input id="answer" aria-label="원소 정답" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="primary">확인</button></form><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden>다음 원소 →</button><div id="puzzle" class="scroll" hidden><div id="puzzleTable" class="table"></div></div></section>
<section id="result" class="panel" hidden><h2 id="resultTitle"></h2><div id="resultScore"></div><p id="resultNote"></p><div class="row" style="justify-content:center"><button id="retry" class="primary">다시 도전</button><button id="resultReview">틀린 원소 연습</button><button class="back">처음 화면</button></div></section>
<section id="reference" class="panel"><h2>나의 원소 지도</h2><button id="toggleReference">주기율표 펼치기</button><div id="referenceWrap" class="scroll" hidden><div id="referenceTable" class="table"></div></div><p>가로줄은 주기, 세로줄은 족이에요. 아래 두 줄은 란타넘족·악티늄족을 따로 펼친 모습이에요. 테두리가 빛나는 원소는 정답 기록이 있어요.</p><p>기호의 첫 글자는 대문자예요. 입력 연습은 대소문자와 불소·크롬·요오드 같은 익숙한 이름도 인정해요.</p><a style="color:#b2c8d8" href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">원소 번호·기호 자료: IUPAC</a></section></main><script src="elements.js"></script><script src="game.js"></script></body></html>
