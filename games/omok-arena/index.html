<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오목 아레나</title>
<style>
:root{--bg:#08111f;--panel:#111d33;--panel2:#182945;--text:#f8fafc;--muted:#9fb1cf;--cyan:#78e8ff;--gold:#ffd86f;--danger:#ff7186;--wood:#cf9148}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;background:radial-gradient(circle at 15% 10%,#28558b33,transparent 35%),radial-gradient(circle at 85% 12%,#8b5cf622,transparent 30%),var(--bg);color:var(--text)}button,select{font:inherit}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#63e6ff,#6d5dfc 58%,#ff73b2);box-shadow:0 10px 28px #0008}.brand h1{font-size:clamp(20px,3vw,30px);margin:0;letter-spacing:-.04em}.brand small{display:block;color:var(--muted);margin-top:2px}.top button,.btn{border:1px solid #ffffff1e;background:#ffffff0d;color:#fff;border-radius:13px;padding:9px 12px;cursor:pointer;font-weight:800}.top button:hover,.btn:hover{background:#ffffff18}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.shell,.card{background:linear-gradient(180deg,#14223b,#0d1729);border:1px solid #ffffff17;box-shadow:0 20px 50px #0007}.shell{position:relative;border-radius:24px;padding:12px;overflow:hidden}.card{border-radius:18px;padding:14px}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}.player{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:15px;background:#ffffff08;border:1px solid #ffffff12;transition:.2s}.player.active{background:#6ee7ff12;box-shadow:0 0 0 2px #6ee7ff66}.player.right{justify-content:flex-end;text-align:right}.stone{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -5px 8px #0007,0 3px 8px #0007}.black{background:radial-gradient(circle at 30% 25%,#6b7280 0 8%,#171d28 34%,#02050a 80%)}.white{background:radial-gradient(circle at 30% 25%,#fff,#e8edf5 50%,#a9b3c3 90%)}.player b{display:block;font-size:14px}.player span{font-size:11px;color:var(--muted)}.vs{font-weight:900;color:var(--gold)}.board-wrap{max-width:720px;margin:auto;padding:10px;border-radius:20px;background:linear-gradient(145deg,#5a3418,#2b1608);box-shadow:inset 0 0 0 2px #f6d3a233,0 16px 45px #0009}.board-wrap.hit{animation:hit .18s ease-out}@keyframes hit{45%{transform:scale(.994) rotate(.1deg)}}canvas{display:block;width:100%;aspect-ratio:1;border-radius:13px;background:var(--wood);touch-action:none;cursor:crosshair}.tip{text-align:center;font-size:11px;color:#8598b7;margin-top:8px}.side{display:grid;gap:12px}.card h3{margin:0 0 10px;font-size:15px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#081321;border-radius:13px;padding:4px}.seg button{border:0;background:transparent;color:#91a2bf;border-radius:10px;padding:8px;cursor:pointer;font-weight:800;font-size:12px}.seg button.on{background:#263b61;color:#fff}.row{display:flex;gap:8px}.row>*{flex:1}select,.btn{width:100%;background:#09162a}.btn.primary{background:linear-gradient(135deg,#3b82f6,#6d5dfc)}.btn.danger{color:#ff9dab;background:#ff718611}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:13px}.stat:last-child{border:0}.stat span{color:var(--muted)}.moves{max-height:170px;overflow:auto}.chip{display:inline-flex;gap:5px;align-items:center;padding:5px 7px;margin:3px;border-radius:999px;background:#ffffff0b;font-size:11px;color:#c8d4ea}.dot{width:8px;height:8px;border-radius:50%;background:#111}.dot.w{background:#fff;border:1px solid #999}.result{position:absolute;inset:0;display:none;place-items:center;padding:18px;z-index:10;background:radial-gradient(circle at 50% 40%,#27436bdd,#07101af2 60%);backdrop-filter:blur(8px)}.result.show{display:grid;animation:fade .25s ease}@keyframes fade{from{opacity:0}.result{opacity:1}}.box{max-width:500px;width:100%;text-align:center;padding:30px 20px 22px;border-radius:26px;background:linear-gradient(180deg,#1a2e50,#0d1729);border:1px solid #ffffff28;box-shadow:0 30px 80px #000b;animation:pop .5s cubic-bezier(.2,1.35,.35,1)}@keyframes pop{from{transform:scale(.7);opacity:0}}.icon{font-size:54px;filter:drop-shadow(0 0 22px #ffd86f88)}.box h2{font-size:clamp(30px,7vw,50px);margin:4px 0}.win{color:#ffe188}.lose{color:#ff8797}.box p{color:#b8c6de}.fx{position:fixed;inset:0;pointer-events:none;z-index:50}.spark,.conf{position:absolute;pointer-events:none}.spark{width:16px;height:3px;border-radius:4px;background:#fff;animation:spark .35s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}.ring{position:absolute;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);animation:ring .38s ease-out forwards}@keyframes ring{from{width:8px;height:8px}to{width:95px;height:95px;opacity:0}}.conf{width:8px;height:12px;animation:conf var(--d) ease-out forwards}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}.side .card:last-child{grid-column:1/-1}}@media(max-width:600px){.app{padding:8px}.brand small{display:none}.logo{width:40px;height:40px}.shell{padding:8px;border-radius:18px}.player{padding:8px}.player span{display:none}.stone{width:21px;height:21px}.side{grid-template-columns:1fr}.side .card:last-child{grid-column:auto}}
</style>
</head>
<body>
<div id="fx" class="fx"></div>
<div class="app">
<header class="top"><div class="brand"><div class="logo">⚫</div><div><h1>오목 아레나</h1><small>KIDscade · 다섯 돌을 먼저 연결하라!</small></div></div><div style="display:flex;gap:7px"><button id="home">← 키즈케이드</button><button id="sound">🔊</button></div></header>
<main class="layout">
<section class="shell">
<div class="hud"><div id="pb" class="player active"><i class="stone black"></i><div><b id="bn">PLAYER 1</b><span>흑 · 선공</span></div></div><div class="vs">VS</div><div id="pw" class="player right"><div><b id="wn">PLAYER 2</b><span>백 · 후공</span></div><i class="stone white"></i></div></div>
<div id="wrap" class="board-wrap"><canvas id="board" width="900" height="900"></canvas></div><div class="tip">교차점을 눌러 돌을 놓으세요 · 자유 오목(5개 이상 연결 시 승리)</div>
<div id="result" class="result"><div class="box"><div id="ri" class="icon">🏆</div><h2 id="rt" class="win">승리!</h2><p id="rd"></p><div class="row"><button id="again" class="btn primary">한 판 더!</button><button id="view" class="btn">기보 보기</button></div></div></div>
</section>
<aside class="side">
<section class="card"><h3>🎮 게임 모드</h3><div id="modes" class="seg"><button data-m="pvp" class="on">친구와 1:1</button><button data-m="ai">AI 대전</button></div><div id="aiopt" style="display:none;margin-top:9px"><select id="diff"><option value="easy">AI 쉬움</option><option value="normal" selected>AI 보통</option><option value="hard">AI 어려움</option></select></div><p style="font-size:12px;color:var(--muted);line-height:1.5">친구와 한 화면에서 번갈아 두거나 AI와 겨뤄보세요.</p></section>
<section class="card"><h3>⚙️ 대국</h3><div class="row"><button id="new" class="btn primary">새 대국</button><button id="undo" class="btn">↶ 무르기</button></div><div class="stat"><span>현재 차례</span><b id="turn">흑</b></div><div class="stat"><span>착수 수</span><b id="count">0</b></div><div class="stat"><span>흑 승</span><b id="bs">0</b></div><div class="stat"><span>백 승</span><b id="ws">0</b></div></section>
<section class="card"><h3>🧾 기보</h3><div id="moves" class="moves"><span style="color:#7388aa;font-size:12px">아직 둔 돌이 없습니다.</span></div></section>
</aside>
</main></div>
<script>
(()=>{'use strict';
const S=15,E=0,B=1,W=2,$=id=>document.getElementById(id),cv=$('board'),ctx=cv.getContext('2d'),wrap=$('wrap'),fx=$('fx');
let board,turn=B,last=null,hist=[],over=false,winLine=null,hover=null,mode='pvp',busy=false,soundOn=true,audio=null,scores={b:0,w:0};
try{const p=JSON.parse(localStorage.getItem('kidscade_omok_arena_v1')||'{}');mode=p.mode||'pvp';soundOn=p.sound!==false;scores=p.scores||scores;if(p.diff)$('diff').value=p.diff}catch(e){}
function save(){localStorage.setItem('kidscade_omok_arena_v1',JSON.stringify({mode,sound:soundOn,scores,diff:$('diff').value}))}
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function tone(f,d=.08,type='sine',v=.05,t=0){if(!soundOn)return;const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t);g.gain.setValueAtTime(v,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)}
function hitSound(){tone(150,.045,'triangle',.07);tone(82,.06,'sine',.05,.015)}function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.06,i*.08))}function loseSound(){[330,247,196].forEach((f,i)=>tone(f,.25,'sawtooth',.035,i*.1))}
function reset(){board=Array.from({length:S},()=>Array(S).fill(E));turn=B;last=null;hist=[];over=false;winLine=null;busy=false;$('result').classList.remove('show');ui();draw()}
function met(){const pad=50,step=(cv.width-pad*2)/(S-1);return{pad,step}}
function draw(){const{pad,step}=met(),g=ctx.createLinearGradient(0,0,cv.width,cv.height);g.addColorStop(0,'#e2ad62');g.addColorStop(1,'#b97535');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#4b2f17aa';ctx.lineWidth=2;for(let i=0;i<S;i++){const p=pad+i*step;ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,cv.height-pad);ctx.stroke();ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(cv.width-pad,p);ctx.stroke()}[[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(pad+x*step,pad+y*step,5,0,Math.PI*2);ctx.fillStyle='#4a2e18';ctx.fill()});if(hover&&!over&&!board[hover.y][hover.x])stoneDraw(hover.x,hover.y,turn,true);for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(board[y][x])stoneDraw(x,y,board[y][x],false,last&&x===last.x&&y===last.y);if(winLine){ctx.save();ctx.strokeStyle='#ffe071';ctx.lineWidth=13;ctx.lineCap='round';ctx.shadowColor='#ffd45a';ctx.shadowBlur=24;ctx.beginPath();ctx.moveTo(pad+winLine[0].x*step,pad+winLine[0].y*step);const z=winLine[winLine.length-1];ctx.lineTo(pad+z.x*step,pad+z.y*step);ctx.stroke();ctx.restore()}}
function stoneDraw(x,y,c,ghost=false,isLast=false){const{pad,step}=met(),cx=pad+x*step,cy=pad+y*step,r=step*.42;ctx.save();ctx.globalAlpha=ghost?.35:1;const g=ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);if(c===B){g.addColorStop(0,'#727b8b');g.addColorStop(.28,'#1b202a');g.addColorStop(1,'#020408')}else{g.addColorStop(0,'#fff');g.addColorStop(.55,'#eef2f7');g.addColorStop(1,'#a7b1bf')}ctx.fillStyle=g;ctx.shadowColor='#0009';ctx.shadowBlur=r*.35;ctx.shadowOffsetY=r*.18;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();if(isLast){ctx.shadowBlur=18;ctx.fillStyle=c===B?'#75e8ff':'#ff657b';ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(cx,cy,r*.19,0,Math.PI*2);ctx.fill()}ctx.restore()}
function cell(e){const r=cv.getBoundingClientRect(),{pad,step}=met(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height,x=Math.round((px-pad)/step),y=Math.round((py-pad)/step);if(x<0||x>=S||y<0||y>=S)return null;if(Math.hypot(px-(pad+x*step),py-(pad+y*step))>step*.55)return null;return{x,y}}
cv.onpointermove=e=>{hover=cell(e);draw()};cv.onpointerleave=()=>{hover=null;draw()};cv.onpointerdown=e=>{ac();if(over||busy||(mode==='ai'&&turn===W))return;const c=cell(e);if(c)move(c.x,c.y,turn)};
function line(x,y,c){for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let a=[{x,y}];for(const s of[-1,1]){let nx=x+dx*s,ny=y+dy*s;while(nx>=0&&ny>=0&&nx<S&&ny<S&&board[ny][nx]===c){s<0?a.unshift({x:nx,y:ny}):a.push({x:nx,y:ny});nx+=dx*s;ny+=dy*s}}if(a.length>=5)return a}return null}
function move(x,y,c){if(over||board[y][x])return;board[y][x]=c;last={x,y,c};hist.push(last);hitSound();impact(x,y,c);wrap.classList.remove('hit');void wrap.offsetWidth;wrap.classList.add('hit');const l=line(x,y,c);if(l){winLine=l;over=true;draw();ui();setTimeout(()=>finish(c),300);return}turn=c===B?W:B;ui();draw();if(mode==='ai'&&turn===W&&!over){busy=true;ui();setTimeout(aiMove,220)}}
function candidates(r=2){if(!hist.length)return[{x:7,y:7}];const s=new Set();hist.forEach(m=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=m.x+dx,y=m.y+dy;if(x>=0&&y>=0&&x<S&&y<S&&!board[y][x])s.add(x+','+y)}});return[...s].map(v=>{const[x,y]=v.split(',').map(Number);return{x,y}})}
function pat(x,y,c){let t=0;for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let n=1,o=0;for(const s of[-1,1]){let nx=x+dx*s,ny=y+dy*s;while(nx>=0&&ny>=0&&nx<S&&ny<S&&board[ny][nx]===c){n++;nx+=dx*s;ny+=dy*s}if(nx>=0&&ny>=0&&nx<S&&ny<S&&!board[ny][nx])o++}t+=n>=5?1e7:n===4&&o===2?180000:n===4?25000:n===3&&o===2?8000:n===3?1200:n===2&&o===2?350:n===2?70:o*5}return t}
function score(x,y,c){const o=c===B?W:B;board[y][x]=c;const a=pat(x,y,c);board[y][x]=o;const b=pat(x,y,o);board[y][x]=E;return a+b*.94+(14-(Math.abs(7-x)+Math.abs(7-y)))*3+Math.random()*3}
function best(level){let c=candidates(level==='hard'?2:1);if(level==='easy')return c[Math.floor(Math.random()*c.length)];for(const m of c){board[m.y][m.x]=W;const q=line(m.x,m.y,W);board[m.y][m.x]=E;if(q)return m}for(const m of c){board[m.y][m.x]=B;const q=line(m.x,m.y,B);board[m.y][m.x]=E;if(q)return m}c=c.map(m=>({...m,s:score(m.x,m.y,W)})).sort((a,b)=>b.s-a.s);if(level==='normal')return c[0];let bm=c[0],bv=-1e99;for(const m of c.slice(0,10)){board[m.y][m.x]=W;const replies=candidates(1).map(r=>score(r.x,r.y,B)).sort((a,b)=>b-a).slice(0,6),v=m.s-(replies[0]||0)*.68;board[m.y][m.x]=E;if(v>bv){bv=v;bm=m}}return bm}
function aiMove(){const m=best($('diff').value);busy=false;move(m.x,m.y,W)}
function pos(x,y){const r=cv.getBoundingClientRect(),{pad,step}=met();return{x:r.left+(pad+x*step)*r.width/cv.width,y:r.top+(pad+y*step)*r.height/cv.height}}
function impact(x,y,c){const p=pos(x,y),ring=document.createElement('i');ring.className='ring';ring.style.left=p.x+'px';ring.style.top=p.y+'px';ring.style.borderColor=c===B?'#9cecffbb':'#fff1a8cc';fx.appendChild(ring);setTimeout(()=>ring.remove(),450);for(let i=0;i<8;i++){const s=document.createElement('i'),a=i*Math.PI/4+Math.random()*.2,d=25+Math.random()*25;s.className='spark';s.style.left=p.x+'px';s.style.top=p.y+'px';s.style.background=c===B?'#a6efff':'#fff0a5';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.setProperty('--r',a+'rad');fx.appendChild(s);setTimeout(()=>s.remove(),420)}}
function confetti(){const colors=['#7de9ff','#ffd96b','#ff7897','#fff','#8b5cf6'];for(let i=0;i<100;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=100+Math.random()*360;p.className='conf';p.style.left=(50+(Math.random()-.5)*15)+'vw';p.style.top=(42+(Math.random()-.5)*8)+'vh';p.style.background=colors[i%colors.length];p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',(Math.sin(a)*d+160)+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');p.style.setProperty('--d',(.65+Math.random()*.7)+'s');fx.appendChild(p);setTimeout(()=>p.remove(),1500)}}
function finish(c){let title,desc,icon='🏆',cls='win';if(c===B){scores.b++;title=mode==='ai'?'승리!':'흑 승리!';desc='흑이 먼저 다섯 돌을 연결했습니다.';winSound();confetti()}else{scores.w++;if(mode==='ai'){title='AI 승리';desc='이번 판은 AI가 먼저 다섯 돌을 연결했습니다.';icon='🤖';cls='lose';loseSound()}else{title='백 승리!';desc='백이 먼저 다섯 돌을 연결했습니다.';winSound();confetti()}}save();$('ri').textContent=icon;$('rt').textContent=title;$('rt').className=cls;$('rd').textContent=desc;$('result').classList.add('show');ui();try{parent.postMessage({type:'kidscade:game-result',gameId:'high_omok_arena',winner:c===B?'black':'white',mode,moves:hist.length},location.origin)}catch(e){}}
function ui(){$('pb').classList.toggle('active',turn===B&&!over);$('pw').classList.toggle('active',turn===W&&!over);$('bn').textContent=mode==='ai'?'PLAYER':'PLAYER 1';$('wn').textContent=mode==='ai'?'AI':'PLAYER 2';$('turn').textContent=busy?'AI 생각 중…':turn===B?'흑':'백';$('count').textContent=hist.length;$('bs').textContent=scores.b;$('ws').textContent=scores.w;$('moves').innerHTML=hist.length?hist.map((m,i)=>`<span class="chip"><i class="dot ${m.c===W?'w':''}"></i>${i+1}. ${String.fromCharCode(65+m.x)}${m.y+1}</span>`).join(''):'<span style="color:#7388aa;font-size:12px">아직 둔 돌이 없습니다.</span>'}
function undo(){if(!hist.length||busy)return;$('result').classList.remove('show');over=false;winLine=null;let n=mode==='ai'&&hist.length>=2?2:1;while(n--&&hist.length){const m=hist.pop();board[m.y][m.x]=E}last=hist.at(-1)||null;turn=hist.length%2===0?B:W;ui();draw()}
$('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;[...$('modes').children].forEach(x=>x.classList.toggle('on',x===b));$('aiopt').style.display=mode==='ai'?'block':'none';save();reset()};$('diff').onchange=()=>{save();reset()};$('new').onclick=reset;$('undo').onclick=undo;$('again').onclick=reset;$('view').onclick=()=>$('result').classList.remove('show');$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';save();if(soundOn)tone(660)};$('home').onclick=()=>{try{if(parent&&parent!==window){const b=parent.document.getElementById('close-modal-btn');if(b){b.click();return}}}catch(e){}location.href='index.html'};window.onkeydown=e=>{if(e.key.toLowerCase()==='r')reset();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}};
[...$('modes').children].forEach(x=>x.classList.toggle('on',x.dataset.m===mode));$('aiopt').style.display=mode==='ai'?'block':'none';$('sound').textContent=soundOn?'🔊':'🔇';reset();
})();
</script>
</body>
</html>
