<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>색깔 모양 친구들 집 찾아주기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"Arial Rounded MT Bold","Malgun Gothic",sans-serif;touch-action:none;overscroll-behavior:none;background:linear-gradient(135deg,#fdfbfb 0%,#ebedee 100%);user-select:none;-webkit-user-select:none}
button{font:inherit;touch-action:manipulation}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#startScreen{background:rgba(255,255,255,.94)}
#gameOverScreen{background:rgba(0,0,0,.82);color:#fff}
h1{font-size:clamp(38px,5vw,72px);color:#ec4899;margin:0 20px 30px;line-height:1.25;text-shadow:0 3px 8px rgba(0,0,0,.12)}
.bigBtn{border:4px solid rgba(255,255,255,.7);border-radius:999px;padding:18px 34px;font-size:clamp(28px,3vw,42px);font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.18);cursor:pointer}
#startBtn{background:#facc15;color:#713f12} #restartBtn{background:#60a5fa;color:white}
.tip{margin-top:22px;color:#6b7280;font-size:clamp(17px,1.6vw,24px)}
#app{width:100%;height:100%;display:flex;flex-direction:column;padding:18px 20px 12px}
.header{position:relative;display:flex;justify-content:space-between;align-items:flex-start;width:min(1200px,100%);margin:0 auto;z-index:10;min-height:120px}
.leftStats{display:flex;flex-direction:column;gap:10px}.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:8px 16px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:clamp(20px,2vw,32px);font-weight:800;white-space:nowrap}.score{border:2px solid #bfdbfe;color:#1e40af}.high{border:2px solid #ddd6fe;color:#5b21b6}.lives{border:2px solid #fecaca;font-size:clamp(26px,2.4vw,38px)}
.centerHud{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}.banner{color:#fff;border:4px solid #fff;border-radius:24px;padding:8px 24px;box-shadow:0 5px 14px rgba(0,0,0,.14);font-size:clamp(24px,2.5vw,38px);font-weight:900;white-space:nowrap}.colorBanner{background:#f472b6}.shapeBanner{background:#818cf8}.timerTrack{width:clamp(180px,20vw,300px);height:18px;background:#e5e7eb;border:2px solid #fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}#timerFill{height:100%;width:100%;background:#4ade80;transition:width 1s linear,background-color .3s}
#gameArea{position:relative;flex:1;width:min(1200px,100%);margin:0 auto;min-height:0}
#draggableItem{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:clamp(145px,14vw,210px);height:clamp(145px,14vw,210px);display:flex;align-items:center;justify-content:center;border-radius:50%;border:4px dashed #d1d5db;background:rgba(255,255,255,.72);font-size:clamp(82px,9vw,140px);filter:drop-shadow(0 10px 12px rgba(0,0,0,.18));z-index:20;cursor:grab;touch-action:none;will-change:left,top,transform}
#draggableItem.selected{box-shadow:0 0 22px 7px rgba(255,215,0,.85);transform:translateX(-50%) scale(1.08)}
#draggableItem.dragging{transform:none!important;cursor:grabbing}
#basketsContainer{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:space-around;align-items:flex-end;gap:3%;padding:0 2%;z-index:5}.basket{width:clamp(145px,18vw,240px);height:clamp(120px,15vw,190px);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:white;font-size:clamp(26px,3vw,46px);font-weight:900;border:5px solid rgba(0,0,0,.12);box-shadow:0 8px 18px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation;transition:transform .14s,filter .14s}.basket.hovered{transform:scale(1.1);filter:brightness(1.1)}
.red{background:#f87171}.yellow{background:#facc15;color:#78350f}.blue{background:#60a5fa}.green{background:#4ade80;color:#14532d}.colorBasket{border-radius:18px 18px 34px 34px}.circle{background:#fdba74;border-radius:50%}.triangle{background:#c4b5fd;clip-path:polygon(50% 0%,0 100%,100% 100%);padding-top:35px}.square{background:#5eead4;border-radius:18px;color:#134e4a}
.shake{animation:shake .42s ease-in-out}.bounce{animation:bounce .55s cubic-bezier(.68,-.55,.265,1.55)}@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 12px)) rotate(-4deg)}50%{transform:translateX(calc(-50% + 12px)) rotate(4deg)}75%{transform:translateX(calc(-50% - 12px)) rotate(-4deg)}}@keyframes bounce{0%{transform:translateX(-50%) scale(0);opacity:0}60%{transform:translateX(-50%) scale(1.12);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.particle{position:fixed;pointer-events:none;z-index:200;font-size:32px;transition:transform .8s cubic-bezier(.25,.46,.45,.94),opacity .8s}
#gameOverScreen h2{font-size:clamp(46px,6vw,80px);margin:0 0 16px}#gameOverScreen p{font-size:clamp(30px,4vw,54px);color:#fde047;font-weight:900;margin:0 0 30px}
@media (max-height:650px){.header{min-height:86px}.pill{padding:5px 12px}.banner{padding:5px 18px}.timerTrack{height:14px}#draggableItem{top:14%;width:130px;height:130px;font-size:76px}#basketsContainer{bottom:2%}.basket{height:110px}}
</style>
</head>
<body>
<div id="startScreen" class="screen">
  <h1>🎨 모양 & 색깔 🍎<br>친구들 집 찾기!</h1>
  <button id="startBtn" class="bigBtn">시작하기 🚀</button>
  <div class="tip">손가락으로 끌어 놓거나, 친구를 누른 뒤 집을 눌러도 돼요!</div>
</div>
<div id="gameOverScreen" class="screen hidden">
  <h2>게임 오버! 😢</h2><p>내 점수: <span id="finalScoreDisplay">0</span></p>
  <button id="restartBtn" class="bigBtn">다시 하기 🔄</button>
</div>
<div id="app">
 <div class="header">
  <div class="leftStats"><div class="pill score">⭐ 점수: <span id="scoreDisplay">0</span></div><div class="pill high">👑 최고: <span id="highScoreDisplay">0</span></div></div>
  <div class="centerHud"><div id="stageBanner" class="banner colorBanner">스테이지 준비 중!</div><div class="timerTrack"><div id="timerFill"></div></div></div>
  <div id="livesDisplay" class="pill lives">❤️❤️❤️</div>
 </div>
 <div id="gameArea"><div id="draggableItem"></div><div id="basketsContainer"></div></div>
</div>
<script>
(function(){
'use strict';
const COLOR_DATA={
 red:{cls:'red',name:'빨강',items:['🍎','🍓','🍒','🍅','🌶️','🌹','🎈','❤️','🥊','🦞','🐞','🚒','🧧','☎️','📮','📌','👠','🎸','🥩','🧣']},
 yellow:{cls:'yellow',name:'노랑',items:['🍌','🌻','🐥','🧀','🍋','🌙','⭐','💛','👑','🍍','🔔','🌽','🐤','⚠️','🚕','🎷','🧽','🍯','☀️','🌕']},
 blue:{cls:'blue',name:'파랑',items:['🐳','👖','💎','💧','🌊','💙','📘','🦋','🫐','🧢','🧿','🐬','🧊','🥣','🚙','🥏','🪣','🧵','🛋️','📘']},
 green:{cls:'green',name:'초록',items:['🐸','🍀','🍏','🌲','🐢','🐍','🥒','🥦','🎾','💚','📗','🐛','🦖','🧩','🐊','🥬','🫑','🌿','🌵','🩳']}
};
const SHAPE_DATA={
 circle:{cls:'circle',name:'동그라미',items:['🍪','⚽','🍩','🪙','🏀','⚾','🥎','🎱','🔮','🔴','🟡','🟢','🔵','💿','🎯','🌝','🥯','🥞','🧶','🪀']},
 triangle:{cls:'triangle',name:'세모',items:['🍕','🍙','📐','🔺','🔻','⚠️','🍉','🍰','🎄','⛺','🏔️','🌋','⛵','🧀','🚩']},
 square:{cls:'square',name:'네모',items:['🎁','📺','🟪','🟨','🟩','🟥','🟦','🟫','🔲','🔳','🧃','🖼️','📗','📘','📕','🧱','📦','🧽','🧊','🚪']}
};
const $=id=>document.getElementById(id);
const scoreDisplay=$('scoreDisplay'),highScoreDisplay=$('highScoreDisplay'),livesDisplay=$('livesDisplay'),timerFill=$('timerFill'),stageBanner=$('stageBanner'),basketsContainer=$('basketsContainer'),item=$('draggableItem'),startScreen=$('startScreen'),startBtn=$('startBtn'),gameOverScreen=$('gameOverScreen'),restartBtn=$('restartBtn'),finalScoreDisplay=$('finalScoreDisplay'),gameArea=$('gameArea');
let score=0,lives=3,timeLeft=5,timerInterval=null,currentStageType='shape',currentTargetId='',selected=false,dragging=false,downX=0,downY=0,itemStartLeft=0,itemStartTop=0,lastX=0,lastY=0,inputMoved=false,audioCtx=null,turnLocked=false,wasSelectedBeforeDrag=false;
let highScore=0; try{highScore=parseInt(localStorage.getItem('shapeColorHighScore')||'0',10)||0}catch(e){} highScoreDisplay.textContent=highScore;
function initAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()} if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume()}catch(e){audioCtx=null}}
function tone(freq,type,duration,vol){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(vol||.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+duration);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function successSound(){tone(523,'sine',.25,.08);setTimeout(()=>tone(659,'sine',.25,.08),130);setTimeout(()=>tone(784,'sine',.4,.08),260)}
function errorSound(){tone(190,'square',.28,.045)} function popSound(){tone(760,'sine',.08,.04)}
function saveHigh(){if(score>highScore){highScore=score;highScoreDisplay.textContent=highScore;try{localStorage.setItem('shapeColorHighScore',String(highScore))}catch(e){}}}
function update(){scoreDisplay.textContent=score;livesDisplay.textContent='❤️'.repeat(Math.max(0,lives))+'💔'.repeat(Math.max(0,3-lives));saveHigh()}
function startGame(){initAudio();startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');score=0;lives=3;turnLocked=false;update();nextTurn()}
function startTimer(){clearInterval(timerInterval);timeLeft=5;timerFill.style.transition='none';timerFill.style.width='100%';timerFill.style.background='#4ade80';void timerFill.offsetWidth;timerFill.style.transition='width 1s linear,background-color .3s';timerInterval=setInterval(function(){timeLeft--;timerFill.style.width=(timeLeft/5*100)+'%';if(timeLeft<=2)timerFill.style.background='#ef4444';if(timeLeft<=0){clearInterval(timerInterval);loseLife(true)}},1000)}
function gameOver(){clearInterval(timerInterval);turnLocked=true;errorSound();finalScoreDisplay.textContent=score;gameOverScreen.classList.remove('hidden')}
function resetItem(){item.classList.remove('dragging','selected','shake');item.style.transition='all .22s ease';item.style.left='50%';item.style.top='19%';item.style.transform='translateX(-50%)';item.style.opacity='1';item.style.zIndex='20';setTimeout(()=>item.style.transition='',240);selected=false;dragging=false}
function loseLife(timeout){if(turnLocked)return;turnLocked=true;clearInterval(timerInterval);errorSound();lives--;update();if(lives<=0){gameOver();return}item.classList.remove('selected','dragging');item.classList.add('shake');selected=false;dragging=false;setTimeout(function(){item.classList.remove('shake');nextTurn()},520)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function nextTurn(){turnLocked=false;currentStageType=currentStageType==='color'?'shape':'color';if(currentStageType==='color'){stageBanner.textContent='🎨 무슨 색깔일까?';stageBanner.className='banner colorBanner'}else{stageBanner.textContent='🔺 무슨 모양일까?';stageBanner.className='banner shapeBanner'}const data=currentStageType==='color'?COLOR_DATA:SHAPE_DATA;const keys=shuffle(Object.keys(data)).slice(0,3);currentTargetId=keys[Math.floor(Math.random()*keys.length)];const arr=data[currentTargetId].items;renderBaskets(keys,data);renderItem(arr[Math.floor(Math.random()*arr.length)])}
function renderBaskets(keys,data){basketsContainer.innerHTML='';keys.forEach(function(key){const d=data[key],b=document.createElement('div');b.className='basket '+d.cls+(currentStageType==='color'?' colorBasket':'');b.textContent=d.name;b.setAttribute('data-id',key);addTap(b,function(){if(turnLocked)return;if(selected&&!dragging)checkMatch(key,b)});basketsContainer.appendChild(b)})}
function renderItem(emoji){item.textContent=emoji;item.classList.remove('shake','selected','dragging','bounce');item.style.transition='';item.style.left='50%';item.style.top='19%';item.style.transform='translateX(-50%)';item.style.opacity='1';item.style.zIndex='20';void item.offsetWidth;item.classList.add('bounce');selected=false;dragging=false;startTimer()}
function basketAt(x,y){const bs=basketsContainer.querySelectorAll('.basket');for(let i=0;i<bs.length;i++){const r=bs[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return bs[i]}return null}
function clearHover(){const bs=basketsContainer.querySelectorAll('.basket');for(let i=0;i<bs.length;i++)bs[i].classList.remove('hovered')}
function pointFromEvent(e){if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};return{x:e.clientX,y:e.clientY}}
function dragStart(e){if(turnLocked)return;initAudio();if(e.cancelable)e.preventDefault();const p=pointFromEvent(e),r=item.getBoundingClientRect(),area=gameArea.getBoundingClientRect();wasSelectedBeforeDrag=selected;dragging=true;selected=true;inputMoved=false;downX=lastX=p.x;downY=lastY=p.y;itemStartLeft=r.left-area.left;itemStartTop=r.top-area.top;item.classList.remove('bounce');item.classList.add('selected','dragging');item.style.left=itemStartLeft+'px';item.style.top=itemStartTop+'px';item.style.transform='none';item.style.zIndex='80'}
function dragMove(e){if(!dragging)return;if(e.cancelable)e.preventDefault();const p=pointFromEvent(e),dx=p.x-downX,dy=p.y-downY;lastX=p.x;lastY=p.y;if(Math.abs(dx)+Math.abs(dy)>6)inputMoved=true;item.style.left=(itemStartLeft+dx)+'px';item.style.top=(itemStartTop+dy)+'px';clearHover();const b=basketAt(p.x,p.y);if(b)b.classList.add('hovered')}
function dragEnd(e){if(!dragging)return;if(e.cancelable)e.preventDefault();const p=pointFromEvent(e);dragging=false;item.classList.remove('dragging');clearHover();if(!inputMoved){selected=!wasSelectedBeforeDrag;if(selected){item.classList.add('selected');popSound()}else item.classList.remove('selected');resetItemVisualOnly();return}const b=basketAt(p.x,p.y);if(b)checkMatch(b.getAttribute('data-id'),b);else resetItem()}
function resetItemVisualOnly(){item.style.left='50%';item.style.top='19%';item.style.transform='translateX(-50%)';if(selected)item.classList.add('selected');else item.classList.remove('selected')}
function addTap(el,fn){let touched=false;el.addEventListener('touchend',function(e){touched=true;if(e.cancelable)e.preventDefault();fn(e);setTimeout(()=>touched=false,400)},{passive:false});el.addEventListener('click',function(e){if(!touched)fn(e)})}
function checkMatch(id,b){if(turnLocked)return;turnLocked=true;clearInterval(timerInterval);if(id===currentTargetId){successSound();score++;update();const br=b.getBoundingClientRect(),ar=gameArea.getBoundingClientRect(),ir=item.getBoundingClientRect();item.style.transition='all .38s cubic-bezier(.175,.885,.32,1.275)';item.style.left=(br.left-ar.left+br.width/2-ir.width/2)+'px';item.style.top=(br.top-ar.top+br.height/2-ir.height/2)+'px';item.style.transform='scale(.2)';item.style.opacity='0';particles(br.left+br.width/2,br.top+br.height/2);setTimeout(nextTurn,650)}else{turnLocked=false;loseLife(false)}}
function particles(x,y){const chars=['⭐','✨'];for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle';p.textContent=chars[Math.random()<.5?0:1];p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);void p.offsetWidth;const a=Math.random()*Math.PI*2,v=70+Math.random()*110;p.style.transform='translate('+(Math.cos(a)*v)+'px,'+(Math.sin(a)*v)+'px) rotate('+(Math.random()*360)+'deg) scale('+(0.6+Math.random())+')';p.style.opacity='0';setTimeout(()=>p.remove(),820)}}
addTap(startBtn,startGame);addTap(restartBtn,startGame);
if(window.PointerEvent){item.addEventListener('pointerdown',dragStart,{passive:false});window.addEventListener('pointermove',dragMove,{passive:false});window.addEventListener('pointerup',dragEnd,{passive:false});window.addEventListener('pointercancel',dragEnd,{passive:false})}else{item.addEventListener('touchstart',dragStart,{passive:false});window.addEventListener('touchmove',dragMove,{passive:false});window.addEventListener('touchend',dragEnd,{passive:false});item.addEventListener('mousedown',dragStart);window.addEventListener('mousemove',dragMove);window.addEventListener('mouseup',dragEnd)}
document.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault()},{passive:false});
})();
</script>
</body></html>
