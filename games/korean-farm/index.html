<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef3e6">
<title>논두렁 너머 · 솔내리 | 키즈케이드</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../../assets/vendor/three-r160/three.module.js","three/addons/":"../../assets/vendor/three-r160/addons/"}}</script>
<script src="../../kidscade-storage.js"></script>
<script src="../../kidscade-game-sdk.js" data-game-id="korean_farm" data-title="논두렁 너머" data-shell="true" data-pauseable="true" data-orientation="landscape"></script>
</head>
<body>
<div id="app">
  <canvas id="farm" tabindex="0" aria-label="솔내리 3D 농장. 방향키 또는 WASD로 이동합니다."></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <header id="topbar">
    <div class="identity"><span class="identity-symbol" aria-hidden="true">田</span><div><b>논두렁 너머</b><small>솔내리 · 첫 번째 농장</small></div></div>
    <div class="season"><span id="weatherIcon" class="sunny" aria-hidden="true">☀</span><span id="dayLabel">봄 1일 · 맑음</span><small id="energyLabel">기운 100</small><small id="moneyLabel">4,200원</small></div>
    <div class="header-actions">
      <button id="zoomOut" class="round" type="button" aria-label="지도 축소">−</button>
      <button id="zoomIn" class="round" type="button" aria-label="지도 확대">+</button>
      <button id="help" class="round" type="button" aria-label="조작 안내">?</button>
    </div>
  </header>
  <aside id="objective">
    <div class="eyebrow">첫 수확까지</div>
    <h2>작물을 돌보는 하루</h2>
    <p>논을 살펴보고, 수확하고, 다음 농사를 준비해 보세요.</p>
    <div class="objective-progress"><span id="progressBar"></span></div>
    <small id="progressText">첫 농사 0 / 3</small>
    <button id="guideRice" type="button" class="guide-rice">첫 수확할 논으로 가기 →</button>
  </aside>
  <aside id="inspector" class="inspector hidden" aria-live="polite">
    <div class="inspector-title"><div><small id="fieldKind">논 살펴보기</small><h2 id="fieldName">첫 번째 논</h2></div><button id="closeInspect" class="close" aria-label="정보 창 닫기" type="button">×</button></div>
    <div id="fieldInfo" class="field-info"></div>
    <div id="fieldMetrics" class="field-metrics"></div>
    <div id="actionPanel" class="stage-panel">
      <div class="stage-heading"><span>농사 도구</span><strong id="fieldStatus">관찰 중</strong></div>
      <div id="actionButtons" class="farm-actions" role="group" aria-label="선택한 논밭에서 할 일">
        <button type="button" data-action="till">괭이질</button>
        <button type="button" data-action="plant">심기</button>
        <button type="button" data-action="water">물주기</button>
        <button type="button" data-action="gate">물꼬</button>
        <button type="button" data-action="weed">김매기</button>
        <button type="button" data-action="fertilize">거름주기</button>
        <button type="button" data-action="harvest">수확</button>
      </div>
      <button id="approachBtn" type="button" class="approach-btn">이 논밭으로 걸어가기</button>
      <p class="disclaimer">멀리 있는 논밭도 작업 버튼을 누르면 농부가 자동으로 다가가요. 작물은 하루를 보내면 자랍니다.</p>
    </div>
    <div class="field-footer"><span id="assetOrigin">에셋 확인 중</span></div>
  </aside>
  <nav id="bottomBar" aria-label="주요 농장 조작">
    <button id="nearFieldBtn" class="tool active" type="button"><span aria-hidden="true">◎</span><b>논밭 살펴보기</b></button>
    <button id="bagBtn" class="tool" type="button"><span aria-hidden="true">▤</span><b>창고·판매</b></button>
    <button id="sleepBtn" class="tool" type="button"><span aria-hidden="true">☾</span><b>다음 날</b></button>
    <button id="moreBtn" class="tool" type="button" aria-controls="moreTools" aria-expanded="false"><span aria-hidden="true">☷</span><b>더보기</b></button>
  </nav>
  <section id="moreTools" class="more-tools hidden" aria-label="추가 농장 조작">
    <h3>농장 도구</h3>
    <div class="more-grid">
      <button id="focusFarm" type="button">⌂ <span>집 앞으로</span></button>
      <button id="turnLeft" type="button">↶ <span>왼쪽 회전</span></button>
      <button id="turnRight" type="button">↷ <span>오른쪽 회전</span></button>
      <button id="saveBtn" type="button">▣ <span>저장하기</span></button>
      <button id="qaBtn" type="button">▦ <span>에셋 검수</span></button>
    </div>
    <p>화면을 두 손가락으로 벌리거나 모아 시야를 확대하고 축소할 수 있어요.</p>
  </section>
  <div id="joystick" aria-label="가상 이동 조이스틱" role="group"><div class="joystick-knob"></div></div>
  <div id="workStatus" class="work-status hidden" aria-live="polite" role="status">
    <span id="workTitle">작업하는 중</span>
    <div class="work-track"><i id="workFill"></i></div>
  </div>
  <div id="notification" role="status" aria-live="polite"></div>
  <div id="loading"><div class="loading-panel"><div class="spinner" aria-hidden="true"></div><h1>솔내리로 가는 길</h1><p id="loadingText">농장 풍경을 준비하고 있어요.</p></div></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-body">
      <button id="modalClose" class="close" type="button" aria-label="닫기">×</button>
      <h2 id="modalTitle">솔내리에서 움직이는 법</h2>
      <div id="modalContents"></div>
    </div>
  </section>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
