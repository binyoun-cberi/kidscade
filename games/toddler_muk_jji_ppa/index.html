<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff3c4">
<title>묵찌빠! | Kidscade</title>
<style>
:root{
  --ink:#3d405b;--paper:#fffdf7;--yellow:#ffd166;--pink:#ff7b9c;--blue:#6fc8ff;
  --green:#7ed6a5;--line:#e8dcae;--shadow:0 14px 30px #705f3022
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:#fff6d8}
body{
  min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 15%,#fff 0 6%,transparent 6.3%),
    radial-gradient(circle at 90% 22%,#ffe0ec 0 8%,transparent 8.3%),
    radial-gradient(circle at 80% 90%,#dff6ff 0 10%,transparent 10.3%),
    linear-gradient(180deg,#fff1b8,#fff8e9 55%,#eaf9ff)
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:5px solid #7658ff55;outline-offset:3px}
.app{min-height:100vh;display:flex;flex-direction:column;padding:clamp(8px,2vw,18px)}
.top{width:min(900px,100%);margin:0 auto 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score{display:flex;gap:6px;align-items:center;font-weight:950;background:#ffffffd9;border:3px solid #fff;border-radius:18px;padding:8px 11px;box-shadow:0 7px 18px #725c2018}
.score.right{justify-content:flex-end}
.stars{letter-spacing:1px;white-space:nowrap}
.centerStatus{display:flex;flex-direction:column;align-items:center;gap:4px}.round{background:#fff;border:3px solid #fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:950;box-shadow:0 7px 18px #725c2018;white-space:nowrap}.record{padding:4px 9px;border-radius:999px;background:#fff8dc;border:2px solid #fff;color:#756332;font-size:11px;font-weight:950;box-shadow:0 5px 12px #725c2012;white-space:nowrap}
.stage{width:min(900px,100%);margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.board{background:#ffffffde;border:4px solid #fff;border-radius:32px;box-shadow:var(--shadow);padding:clamp(13px,3vw,24px);text-align:center;position:relative;overflow:hidden}
.board:before,.board:after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:.38}
.board:before{width:160px;height:160px;background:#ffe38e;left:-70px;top:-80px}
.board:after{width:190px;height:190px;background:#bdeaff;right:-95px;bottom:-105px}
.title{position:relative;z-index:1;margin:0;font-size:clamp(32px,7vw,56px);letter-spacing:-.06em;color:#564b72;text-shadow:0 3px #fff}
.message{position:relative;z-index:1;margin:8px auto 3px;min-height:52px;display:grid;place-items:center;font-size:clamp(18px,4vw,28px);font-weight:1000;line-height:1.2}
.hint{position:relative;z-index:1;margin:0;color:#796f7f;font-size:clamp(12px,2.7vw,15px);font-weight:800}
.arena{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3vw,24px);margin:16px 0 8px}
.player{min-width:0}
.name{font-weight:1000;font-size:clamp(13px,2.8vw,18px);margin-bottom:4px}
.hand{
  width:min(29vw,190px);aspect-ratio:1;margin:auto;border-radius:34px;display:grid;place-items:center;
  font-size:clamp(62px,15vw,118px);background:#fff;border:5px solid #fff;box-shadow:0 12px 26px #5b506326;
  transition:transform .2s,box-shadow .2s
}
.you .hand{background:linear-gradient(145deg,#fff7c9,#fff)}
.cpu .hand{background:linear-gradient(145deg,#e0f5ff,#fff)}
.hand.pop{animation:pop .35s ease}
.hand.think{animation:bob .55s infinite alternate}
.vs{font-size:clamp(20px,4vw,34px);font-weight:1000;color:#aa8f65}
.attacker{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:29px;margin-top:7px;padding:5px 9px;
  border-radius:999px;background:#f0edf2;color:#9a8fa0;font-size:12px;font-weight:1000
}
.attacker.on{background:#ffdf70;color:#7b5510;box-shadow:0 5px 12px #d99c2330}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(7px,2vw,14px);margin-top:10px}
.choice{
  min-height:clamp(104px,20vw,150px);border-radius:26px;border:4px solid #fff;background:#fff;box-shadow:0 10px 22px #5b50631c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s
}
.choice:nth-child(1){background:linear-gradient(145deg,#ffe1a3,#fff9df)}
.choice:nth-child(2){background:linear-gradient(145deg,#dff4ff,#fff)}
.choice:nth-child(3){background:linear-gradient(145deg,#e1f7e5,#fff)}
.choice:active{transform:scale(.95)}
.choice:disabled{opacity:.58;cursor:default}
.choice .emoji{font-size:clamp(48px,11vw,78px);line-height:1}
.choice b{font-size:clamp(15px,3.2vw,20px);margin-top:3px}
.footer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.small{padding:9px 13px;border-radius:15px;background:#ffffffd8;border:2px solid #fff;box-shadow:0 6px 15px #5b506314;font-weight:900;font-size:13px}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#453d5b66;backdrop-filter:blur(7px)}
.overlay.hidden{display:none}
.card{width:min(470px,100%);background:#fffdf7;border:5px solid #fff;border-radius:32px;padding:24px;text-align:center;box-shadow:0 24px 70px #3b315c44}
.big{font-size:78px;line-height:1}
.card h2{font-size:34px;margin:5px 0}
.card p{font-weight:800;color:#786f7f;line-height:1.5}
.primary{width:100%;padding:14px 18px;border-radius:18px;background:#ffd166;color:#634b08;font-weight:1000;font-size:18px;box-shadow:0 7px 0 #d4a83c}
.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #d4a83c}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.bit{position:absolute;top:-20px;font-size:20px;animation:fall 1.7s linear forwards}
@keyframes pop{0%{transform:scale(.75) rotate(-8deg)}65%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1)}}
@keyframes bob{from{transform:translateY(-4px) rotate(-4deg)}to{transform:translateY(5px) rotate(4deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:.2}}
@media(max-width:560px){
  .app{padding:7px}.top{gap:5px}.score{padding:7px 8px;font-size:12px}.round{font-size:11px;padding:7px 9px}.record{font-size:10px;padding:3px 7px}
  .board{border-radius:25px;padding:12px}.arena{margin:10px 0 4px}.hand{border-radius:24px}.choices{margin-top:7px}
  .choice{border-radius:21px;min-height:100px}.footer{margin-top:7px}.small{padding:8px 10px;font-size:12px}
}
@media(max-height:680px) and (orientation:landscape){
  .stage{max-width:850px}.board{padding:9px 15px}.title{font-size:30px}.message{min-height:32px;font-size:18px;margin:3px}
  .hint{font-size:11px}.arena{margin:5px 0}.hand{width:105px;font-size:65px;border-radius:21px}.attacker{margin-top:3px;min-height:22px;padding:2px 7px}
  .choices{max-width:620px;width:100%;margin:5px auto 0}.choice{min-height:82px}.choice .emoji{font-size:45px}.choice b{font-size:14px}.footer{margin-top:5px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top" aria-label="점수">
    <div class="score"><span>나</span><span class="stars" id="youStars">☆☆</span></div>
    <div class="centerStatus"><div class="round" id="roundLabel">가위바위보!</div><div class="record" id="recordLabel">CPU 전적 0승 0패</div></div>
    <div class="score right"><span class="stars" id="cpuStars">☆☆</span><span>친구</span></div>
  </header>

  <main class="stage">
    <section class="board">
      <h1 class="title">묵찌빠!</h1>
      <div class="message" id="message">먼저 가위바위보!</div>
      <p class="hint" id="hint">아래에서 하나를 눌러요.</p>

      <div class="arena">
        <div class="player you">
          <div class="name">나</div>
          <div class="hand" id="youHand" aria-live="polite">❔</div>
          <div class="attacker" id="youAttack">내 공격</div>
        </div>
        <div class="vs">VS</div>
        <div class="player cpu">
          <div class="name">친구</div>
          <div class="hand" id="cpuHand" aria-live="polite">❔</div>
          <div class="attacker" id="cpuAttack">친구 공격</div>
        </div>
      </div>

      <div class="choices" aria-label="손 모양 고르기">
        <button class="choice" data-hand="rock" aria-label="묵, 바위">
          <span class="emoji">✊</span><b>묵</b>
        </button>
        <button class="choice" data-hand="scissors" aria-label="찌, 가위">
          <span class="emoji">✌️</span><b>찌</b>
        </button>
        <button class="choice" data-hand="paper" aria-label="빠, 보">
          <span class="emoji">🖐️</span><b>빠</b>
        </button>
      </div>

      <div class="footer">
        <button class="small" id="voiceBtn">🔊 말해주기</button>
        <button class="small" id="ruleBtn">❔ 놀이 방법</button>
        <button class="small" id="restartBtn">↻ 다시 하기</button>
      </div>
    </section>
  </main>
</div>

<div class="overlay hidden" id="rules">
  <div class="card">
    <div class="big">✊✌️🖐️</div>
    <h2>묵찌빠 놀이</h2>
    <p><b>1.</b> 먼저 가위바위보를 해요.<br><b>2.</b> 이긴 사람이 공격해요.<br><b>3.</b> 묵찌빠에서 <b>같은 손</b>이 나오면 공격한 사람이 별을 얻어요.<br><b>4.</b> 별 2개를 먼저 모으면 이겨요!</p>
    <button class="primary" id="closeRules">놀이 시작!</button>
  </div>
</div>

<div class="overlay hidden" id="result">
  <div class="card">
    <div class="big" id="resultFace">🎉</div>
    <h2 id="resultTitle">내가 이겼어요!</h2>
    <p id="resultText">별을 2개 모았어요.</p>
    <button class="primary" id="againBtn">한 판 더!</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script src="../../kidscade-game-sdk.js" data-game-id="toddler_muk_jji_ppa" data-title="묵찌빠!" data-shell="true"></script>
<script>
(()=>{
'use strict';
const HANDS={
  rock:{emoji:'✊',name:'묵'},
  scissors:{emoji:'✌️',name:'찌'},
  paper:{emoji:'🖐️',name:'빠'}
};
const wins={rock:'scissors',scissors:'paper',paper:'rock'};
const $=s=>document.querySelector(s);
const choices=[...document.querySelectorAll('.choice')];
const RECORD_KEY='kidscade_game_v1:toddler_muk_jji_ppa:record';
let phase='rps',attacker=null,youScore=0,cpuScore=0,locked=false,voiceOn=true,roundStarted=false,audio=null;
let record=loadRecord();

function loadRecord(){
  try{
    const saved=JSON.parse(localStorage.getItem(RECORD_KEY)||'{}');
    return {wins:Number(saved.wins)||0,losses:Number(saved.losses)||0};
  }catch(e){return {wins:0,losses:0}}
}
function saveRecord(){
  try{localStorage.setItem(RECORD_KEY,JSON.stringify(record))}catch(e){}
}
function refreshRecord(){
  $('#recordLabel').textContent=`CPU 전적 ${record.wins}승 ${record.losses}패`;
}

function ensureAudio(){
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
  }catch(e){}
}
function tone(freq,d=.08,type='sine'){
  ensureAudio(); if(!audio) return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);
}
function say(text){
  if(!voiceOn||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;u.pitch=1.08;
  speechSynthesis.speak(u);
}
function setMessage(main,hint){
  $('#message').textContent=main;
  $('#hint').textContent=hint||'';
}
function refresh(){
  $('#youStars').textContent='★'.repeat(youScore)+'☆'.repeat(2-youScore);
  $('#cpuStars').textContent='★'.repeat(cpuScore)+'☆'.repeat(2-cpuScore);
  $('#youAttack').classList.toggle('on',attacker==='you');
  $('#cpuAttack').classList.toggle('on',attacker==='cpu');
  $('#roundLabel').textContent=phase==='rps'?'가위바위보!':'묵찌빠!';
  refreshRecord();
}
function setHands(you='❔',cpu='❔',thinking=false){
  $('#youHand').textContent=you;
  $('#cpuHand').textContent=cpu;
  $('#youHand').classList.toggle('think',thinking);
  $('#cpuHand').classList.toggle('think',thinking);
}
function popHands(){
  for(const el of [$('#youHand'),$('#cpuHand')]){
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
}
function resultOf(a,b){
  if(a===b)return 'tie';
  return wins[a]===b?'you':'cpu';
}
function cpuPick(){
  const keys=Object.keys(HANDS);return keys[Math.floor(Math.random()*keys.length)];
}
function disable(v){choices.forEach(b=>b.disabled=v)}
function startIfNeeded(){
  if(roundStarted)return;
  roundStarted=true;
  if(window.KidscadeGame?.start) KidscadeGame.start();
}
function choose(you){
  if(locked)return;
  startIfNeeded();ensureAudio();locked=true;disable(true);
  const cpu=cpuPick();
  setHands(HANDS[you].emoji,'❔',false);
  $('#cpuHand').classList.add('think');
  setMessage('하나, 둘, 셋!','친구도 고르는 중이에요.');
  tone(330,.07);
  setTimeout(()=>{
    $('#cpuHand').classList.remove('think');
    setHands(HANDS[you].emoji,HANDS[cpu].emoji,false);popHands();tone(520,.08);
    if(phase==='rps') resolveRps(you,cpu);
    else resolveMuk(you,cpu);
  },430);
}
function resolveRps(you,cpu){
  const r=resultOf(you,cpu);
  if(r==='tie'){
    setMessage('똑같아요! 한 번 더!','가위바위보를 다시 해요.');
    say('똑같아요. 한 번 더!');
    tone(260,.12,'triangle');
    return ready(720);
  }
  attacker=r;
  phase='muk';
  refresh();
  const mine=r==='you';
  setMessage(mine?'내가 먼저 공격! 👑':'친구가 먼저 공격! 👑','이제 묵찌빠! 같은 손이 나오면 공격한 쪽이 별을 얻어요.');
  say(mine?'내가 먼저 공격! 묵찌빠!':'친구가 먼저 공격! 묵찌빠!');
  tone(mine?720:420,.13,'sine');
  ready(850);
}
function resolveMuk(you,cpu){
  if(you===cpu){
    const scorer=attacker;
    if(scorer==='you')youScore++;else cpuScore++;
    refresh();
    if(window.KidscadeGame?.score) KidscadeGame.score(youScore*100);
    const mine=scorer==='you';
    setMessage(mine?'같다! 내가 별 하나! ⭐':'같다! 친구가 별 하나! ⭐',mine?'잘했어요!':'괜찮아요. 다음 별에 도전!');
    say(mine?'같다! 내가 별 하나!':'같다! 친구가 별 하나!');
    tone(mine?820:300,.16,mine?'sine':'triangle');
    if(youScore>=2||cpuScore>=2){
      return setTimeout(()=>finish(youScore>=2),900);
    }
    phase='rps';attacker=null;refresh();
    return setTimeout(()=>{
      setHands();setMessage('다음 판! 가위바위보!','별 2개를 먼저 모으면 이겨요.');say('다음 판. 가위바위보!');ready(0);
    },950);
  }

  const r=resultOf(you,cpu);
  attacker=r;
  refresh();
  const mine=r==='you';
  setMessage(mine?'공격이 나에게 왔어요! 👑':'공격이 친구에게 갔어요! 👑','계속 묵찌빠!');
  say(mine?'내 공격! 묵찌빠!':'친구 공격! 묵찌빠!');
  tone(mine?680:390,.1);
  ready(700);
}
function ready(ms){
  setTimeout(()=>{locked=false;disable(false)},ms);
}
function finish(win){
  locked=false;disable(false);
  if(win) record.wins++; else record.losses++;
  saveRecord();refreshRecord();
  $('#resultFace').textContent=win?'🎉':'🌱';
  $('#resultTitle').textContent=win?'내가 이겼어요!':'한 번 더 해봐요!';
  $('#resultText').textContent=win?'별을 2개 모았어요!':'다음 판에는 내가 먼저 별을 모아봐요.';
  $('#result').classList.remove('hidden');
  if(win)burst();
  say(win?'축하해요! 내가 이겼어요!':'좋았어요. 한 판 더 해봐요!');
  if(window.KidscadeGame?.gameOver) KidscadeGame.gameOver({score:youScore*100});
}
function burst(){
  const c=$('#confetti');c.innerHTML='';
  const bits=['⭐','🌟','●','◆'];
  for(let i=0;i<24;i++){
    const s=document.createElement('span');s.className='bit';s.textContent=bits[i%bits.length];
    s.style.left=(4+Math.random()*92)+'%';s.style.animationDelay=(Math.random()*.35)+'s';
    c.appendChild(s);
  }
  setTimeout(()=>c.innerHTML='',2300);
}
function reset(){
  phase='rps';attacker=null;youScore=0;cpuScore=0;locked=false;roundStarted=false;
  setHands();setMessage('먼저 가위바위보!','아래에서 하나를 눌러요.');refresh();disable(false);
  $('#result').classList.add('hidden');
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
choices.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.hand)));
document.addEventListener('keydown',e=>{
  const map={1:'rock',2:'scissors',3:'paper',ArrowLeft:'rock',ArrowDown:'scissors',ArrowRight:'paper'};
  if(map[e.key]&&!locked)choose(map[e.key]);
});
$('#ruleBtn').onclick=()=>$('#rules').classList.remove('hidden');
$('#closeRules').onclick=()=>$('#rules').classList.add('hidden');
$('#restartBtn').onclick=reset;
$('#againBtn').onclick=reset;
$('#voiceBtn').onclick=()=>{
  voiceOn=!voiceOn;
  $('#voiceBtn').textContent=voiceOn?'🔊 말해주기':'🔇 말 안 하기';
  if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel();
  else say('말해주기를 켰어요.');
};
refresh();
})();
</script>
</body>
</html>
