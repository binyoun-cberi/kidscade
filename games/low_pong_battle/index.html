<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>퐁퐁 배틀</title>
<style>
:root{color-scheme:dark;--ink:#172033;--cream:#fff8df;--yellow:#ffd84d;--pink:#ff7f9f;--blue:#62c9ff;--green:#7bdd91}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}
button,select,input{font:inherit}
button{border:0;cursor:pointer}
#app{position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#385d8c 0,#172033 62%)}
#game{position:absolute;left:50%;top:50%;display:block;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);transform:translate(-50%,-50%);touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;z-index:3;pointer-events:none}
.team{min-width:112px;padding:8px 13px;border-radius:18px;background:rgba(23,32,51,.74);box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(7px);text-align:center;font-weight:950}
.team small{display:block;font-size:11px;letter-spacing:.06em;opacity:.8}.team span{font-size:30px}
#midHud{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{padding:6px 11px;border-radius:999px;background:rgba(23,32,51,.76);font-size:12px;font-weight:850;box-shadow:0 5px 18px rgba(0,0,0,.14)}
#message{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);z-index:4;min-width:230px;text-align:center;font-weight:1000;font-size:clamp(28px,6vw,60px);text-shadow:0 5px 18px rgba(0,0,0,.32);pointer-events:none;opacity:0;transition:opacity .13s}
#message.show{opacity:1}
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:rgba(11,18,32,.74);padding:18px}
.hidden{display:none!important}
.panel{width:min(670px,94vw);max-height:92vh;overflow:auto;border-radius:28px;padding:24px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,248,223,.98));color:var(--ink);box-shadow:0 26px 90px rgba(0,0,0,.34)}
h1,h2,p{margin-top:0}h1{margin-bottom:6px;font-size:clamp(40px,8vw,70px);line-height:1}.lead{margin-bottom:18px;color:#536176;font-weight:700}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode,.choice{border-radius:18px;padding:14px;background:#e7edf6;color:var(--ink);font-weight:900;border:3px solid transparent}
.mode.active{border-color:#ff9d3d;background:#fff0cf}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:850;color:#536176}
.field select{width:100%;border:2px solid #ccd7e7;border-radius:14px;background:white;color:var(--ink);padding:11px}
.helpBox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.helpCard{border-radius:16px;padding:12px;background:white;border:2px solid #e1e7ef;line-height:1.55;font-size:13px}
kbd{display:inline-block;min-width:29px;padding:3px 7px;border-radius:8px;background:#172033;color:white;text-align:center;font-weight:950;box-shadow:inset 0 -2px rgba(255,255,255,.15)}
.primary,.secondary{width:100%;border-radius:17px;padding:14px 16px;font-weight:1000}
.primary{background:var(--yellow);color:#2a2a2a;font-size:18px}.secondary{background:#dfe7f2;color:var(--ink);margin-top:8px}
#pauseBtn{position:absolute;right:14px;top:82px;z-index:5;width:46px;height:46px;border-radius:50%;background:rgba(23,32,51,.78);color:white;font-weight:950;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#touchControls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.touchSide{display:grid;grid-template-columns:70px;gap:8px;pointer-events:auto}
.touchSide button{width:70px;height:58px;border-radius:18px;background:rgba(23,32,51,.72);color:white;border:2px solid rgba(255,255,255,.28);font-size:24px;font-weight:1000;touch-action:none;user-select:none;-webkit-user-select:none}
.touchSide button:active{transform:scale(.96);background:rgba(255,216,77,.85);color:#172033}
#touchRight{visibility:hidden}
#touchTip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;padding:6px 10px;border-radius:999px;background:rgba(23,32,51,.6);font-size:11px;font-weight:800;opacity:.85;pointer-events:none}
.resultStats{display:flex;justify-content:center;gap:12px;margin:16px 0;flex-wrap:wrap}.stat{min-width:120px;padding:12px;border-radius:16px;background:white;border:2px solid #e3e8ef;text-align:center}.stat b{display:block;font-size:28px}
@media (hover:hover) and (pointer:fine){#touchControls,#touchTip{display:none}}
@media (max-width:620px){.panel{padding:18px;border-radius:22px}.settings,.helpBox{grid-template-columns:1fr}.team{min-width:84px;padding:6px 8px}.team span{font-size:24px}.pill{font-size:11px}.modeGrid{grid-template-columns:1fr 1fr}#pauseBtn{top:72px}.touchSide{grid-template-columns:62px}.touchSide button{width:62px;height:52px}}
@media (prefers-reduced-motion:reduce){#message{transition:none}}
</style>
</head>
<body>
<div id="app" tabindex="0" aria-label="퐁퐁 배틀 게임">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <div class="team"><small id="leftName">나</small><span id="leftScore">0</span></div>
    <div id="midHud">
      <div class="pill" id="matchInfo">5점 먼저!</div>
      <div class="pill" id="rallyInfo">랠리 0 · 최고 0</div>
    </div>
    <div class="team"><small id="rightName">컴퓨터</small><span id="rightScore">0</span></div>
  </div>
  <div id="message"></div>
  <button id="pauseBtn" type="button" aria-label="일시정지">Ⅱ</button>
  <div id="touchControls" aria-label="터치 조작">
    <div class="touchSide" id="touchLeft">
      <button type="button" data-control="p1up" aria-label="1P 위로">▲</button>
      <button type="button" data-control="p1down" aria-label="1P 아래로">▼</button>
    </div>
    <div class="touchSide" id="touchRight">
      <button type="button" data-control="p2up" aria-label="2P 위로">▲</button>
      <button type="button" data-control="p2down" aria-label="2P 아래로">▼</button>
    </div>
  </div>
  <div id="touchTip">내 쪽 화면을 위아래로 끌어도 움직여요</div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>퐁퐁 배틀</h1>
      <p class="lead">큰 막대로 통통! 공을 놓치지 않고 친구 또는 컴퓨터와 겨뤄요.</p>
      <div class="modeGrid" id="modeGrid">
        <button class="mode active" type="button" data-mode="cpu">🤖 컴퓨터와</button>
        <button class="mode" type="button" data-mode="2p">👫 둘이서</button>
      </div>
      <div class="settings">
        <label class="field">컴퓨터 난이도
          <select id="difficulty">
            <option value="easy" selected>쉬움 · 처음 해도 좋아요</option>
            <option value="normal">보통 · 조금 빨라요</option>
            <option value="hard">어려움 · 빠르게 따라와요</option>
          </select>
        </label>
        <label class="field">몇 점 경기?
          <select id="targetScore">
            <option value="3">3점 · 짧게</option>
            <option value="5" selected>5점 · 추천</option>
          </select>
        </label>
      </div>
      <div class="helpBox">
        <div class="helpCard"><b>1P 조작</b><br><kbd>W</kbd> 위로 · <kbd>S</kbd> 아래로<br>모바일은 왼쪽 ▲ ▼ 또는 드래그</div>
        <div class="helpCard"><b>2P 조작</b><br><kbd>↑</kbd> 위로 · <kbd>↓</kbd> 아래로<br>모바일은 오른쪽 ▲ ▼ 또는 드래그</div>
      </div>
      <button class="primary" id="startBtn" type="button">게임 시작!</button>
    </div>
  </div>

  <div id="pauseLayer" class="overlay hidden">
    <div class="panel" style="text-align:center;max-width:430px">
      <h2>잠깐 쉬는 중</h2>
      <p class="lead">준비되면 다시 시작해요.</p>
      <button class="primary" id="resumeBtn" type="button">계속하기</button>
      <button class="secondary" id="pauseMenuBtn" type="button">처음 화면으로</button>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="panel" style="text-align:center;max-width:520px">
      <h2 id="resultTitle">이겼어요!</h2>
      <p class="lead" id="resultText"></p>
      <div class="resultStats">
        <div class="stat"><span>최고 랠리</span><b id="bestRallyStat">0</b></div>
        <div class="stat"><span>이번 점수</span><b id="finalScoreStat">0 : 0</b></div>
      </div>
      <button class="primary" id="rematchBtn" type="button">한 판 더!</button>
      <button class="secondary" id="resultMenuBtn" type="button">처음 화면으로</button>
    </div>
  </div>
</div>
<script src="./game.js?v=1"></script>
<script src="../../kidscade-game-sdk.js" data-game-id="low_pong_battle" data-title="퐁퐁 배틀" data-shell="true" data-mute="false" data-orientation="landscape"></script>
</body>
</html>
