<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>트리아지 러시 V5</title>
<style>
:root{
  --mint:#2DD4BF; --mint2:#99F6E4; --coral:#FB7185; --navy:#1E293B; --deep:#07111f;
  --paper:#F8FAFC; --amber:#FACC15; --green:#22C55E; --red:#EF4444; --blue:#38BDF8;
  --shadow:0 22px 60px rgba(0,0,0,.38);
}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:var(--paper);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;max-height:100vh;background:#07111f;border:2px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#07111f}
#hud{position:absolute;inset:16px 16px auto 16px;display:grid;grid-template-columns:1fr 300px 1fr;gap:12px;pointer-events:none;z-index:4;opacity:0;transform:translateY(-8px);transition:.25s}
#hud.show{opacity:1;transform:none}
.hudCard{height:72px;background:rgba(6,13,27,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.hudTitle{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(248,250,252,.58);font-weight:900;margin-bottom:6px}.hudValue{font-size:20px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hudSub{font-size:12px;color:rgba(248,250,252,.68);margin-top:3px}.bar{height:11px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:999px;box-shadow:0 0 18px rgba(45,212,191,.55)}#bpmFill.hot{background:linear-gradient(90deg,var(--amber),var(--coral),var(--red));box-shadow:0 0 18px rgba(251,113,133,.75)}#timeFill{background:linear-gradient(90deg,var(--mint),var(--amber))}#timeFill.low{background:linear-gradient(90deg,var(--coral),var(--red))}
.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 60% 25%,rgba(45,212,191,.18),transparent 34%),linear-gradient(135deg,rgba(7,17,31,.96),rgba(2,6,23,.96));padding:34px;pointer-events:auto}.screen.hidden{opacity:0;pointer-events:none;transition:.22s}.menuGrid{width:100%;height:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:22px}.hero,.shop,.modalCard{background:rgba(248,250,252,.94);color:#0f172a;border:3px solid #0f172a;border-radius:28px;box-shadow:12px 12px 0 #0f172a;padding:28px}.hero{display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;right:-90px;top:-80px;width:330px;height:330px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--coral));opacity:.28}.eyebrow{font-weight:1000;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#0f766e}.title{font-size:76px;line-height:.92;margin:8px 0 12px;font-weight:1000;letter-spacing:-.06em}.desc{font-size:17px;line-height:1.65;color:#334155;max-width:650px}.heroActions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:3px solid #0f172a;background:var(--mint);color:#0f172a;border-radius:16px;padding:14px 22px;font-size:18px;font-weight:1000;box-shadow:5px 5px 0 #0f172a;cursor:pointer;transition:.12s}.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #0f172a}.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #0f172a}.btn.alt{background:#fff}.btn.danger{background:var(--coral)}.statRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.statBox{border:2px solid #0f172a;border-radius:18px;padding:14px;background:#fff}.statBox b{display:block;font-size:26px}.statBox span{font-size:12px;font-weight:900;color:#64748b}.shop{overflow:auto}.shopHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.shopHead h2{margin:0;font-size:28px}.coinPill{background:#0f172a;color:#fff;border-radius:999px;padding:10px 14px;font-weight:1000}.upgrade{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border:2px solid #0f172a;border-radius:18px;padding:12px;margin-bottom:10px;background:#fff}.upgradeIcon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#ccfbf1;font-size:26px;border:2px solid #0f172a}.upgradeName{font-weight:1000}.upgradeDesc{font-size:12px;color:#64748b;margin-top:3px;line-height:1.35}.buy{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--amber)}.buy:disabled{opacity:.42;filter:grayscale(1);cursor:not-allowed}.modalCard{max-width:640px;text-align:center}.modalIcon{font-size:58px}.modalCard h2{font-size:42px;margin:6px 0 8px;letter-spacing:-.03em}.modalCard p{font-size:17px;line-height:1.6;color:#334155}.modalActions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}.badge{display:inline-flex;align-items:center;gap:8px;border:2px solid #0f172a;background:#fff;border-radius:999px;padding:8px 12px;font-weight:1000;margin:4px}.tierEasy{color:#059669}.tierNormal{color:#ca8a04}.tierHard{color:#e11d48}.toastLayer{position:absolute;inset:0;pointer-events:none;z-index:8}.toast{position:absolute;padding:9px 12px;border-radius:999px;background:#0f172a;color:#fff;font-weight:1000;border:2px solid rgba(255,255,255,.28);animation:pop 1s ease forwards;white-space:nowrap}.toast.good{background:#0f766e}.toast.bad{background:#be123c}.shake{animation:shake .22s linear}.flash{position:absolute;inset:0;background:rgba(239,68,68,.32);z-index:6;pointer-events:none;opacity:0}.flash.on{animation:flash .26s ease}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(8px,-4px)}40%{transform:translate(-7px,5px)}60%{transform:translate(5px,3px)}80%{transform:translate(-4px,-5px)}}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}@keyframes pop{0%{transform:translate(-50%,0) scale(.65);opacity:0}20%{transform:translate(-50%,-14px) scale(1.06);opacity:1}100%{transform:translate(-50%,-60px) scale(.92);opacity:0}}@media(max-width:820px){#hud{grid-template-columns:1fr;inset:8px}.hudCard{height:58px}.menuGrid{grid-template-columns:1fr;overflow:auto}.title{font-size:48px}.screen{padding:14px}.hero,.shop,.modalCard{box-shadow:6px 6px 0 #0f172a;padding:18px}.statRow{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div class="hudCard"><div class="hudTitle">환자 정보</div><div id="hudPatient" class="hudValue">대기 중</div><div id="hudRun" class="hudSub">0명 진료 · 연속 0</div></div>
    <div class="hudCard"><div class="hudTitle">심박 상태</div><div class="bar"><div id="bpmFill" class="fill"></div></div><div id="hudBpm" class="hudSub">BPM 78</div></div>
    <div class="hudCard"><div class="hudTitle">남은 시간 / 보상</div><div class="bar"><div id="timeFill" class="fill"></div></div><div id="hudTime" class="hudSub">00.0 · 0🪙</div></div>
  </div>
  <div id="flash" class="flash"></div>
  <div id="toasts" class="toastLayer"></div>

  <section id="menu" class="screen">
    <div class="menuGrid">
      <div class="hero">
        <div>
          <div class="eyebrow">MEDICAL ARCADE · TRIAGE RUSH</div>
          <h1 class="title">트리아지<br>러시 V5</h1>
          <p class="desc">귀엽고 빠른 처치 미니게임을 연속으로 해결하는 아케이드 메디컬 시뮬레이션입니다. V5에서는 시간이 더 빠르게 줄고, 환자가 늘수록 판정과 목표량이 빡세지는 응급도 시스템을 넣었습니다.</p>
          <div class="statRow">
            <div class="statBox"><b id="menuCoins">0</b><span>보유 코인</span></div>
            <div class="statBox"><b id="menuBest">0</b><span>최고 진료</span></div>
            <div class="statBox"><b>12</b><span>미니게임</span></div>
            <div class="statBox"><b>∞</b><span>무한 환자</span></div>
          </div>
        </div>
        <div class="heroActions">
          <button id="startBtn" class="btn">진료 시작</button>
          <button id="muteBtn" class="btn alt">사운드 ON</button>
          <button id="resetBtn" class="btn danger">저장 초기화</button>
        </div>
      </div>
      <div class="shop">
        <div class="shopHead"><h2>메타 업그레이드</h2><div id="shopCoins" class="coinPill">0🪙</div></div>
        <div id="shopList"></div>
      </div>
    </div>
  </section>

  <section id="tutorial" class="screen hidden">
    <div class="modalCard">
      <div id="caseIcon" class="modalIcon">🩺</div>
      <div id="caseTier" class="badge">EASY</div>
      <h2 id="caseTitle">진료명</h2>
      <p id="caseText">조작법</p>
      <div id="caseExtra" class="badge">핵심 조작</div>
      <div class="modalActions"><button id="caseStartBtn" class="btn">처치 시작</button></div>
    </div>
  </section>

  <section id="result" class="screen hidden">
    <div class="modalCard">
      <div id="resultIcon" class="modalIcon">✨</div>
      <h2 id="resultTitle">성공</h2>
      <p id="resultText">다음 환자를 받을까요?</p>
      <div class="modalActions">
        <button id="nextBtn" class="btn">다음 환자</button>
        <button id="lobbyBtn" class="btn alt">로비로</button>
      </div>
    </div>
  </section>
</div>
<script>
(()=>{'use strict';
const W=1280,H=720;
const $=s=>document.querySelector(s);
const canvas=$('#game'), ctx=canvas.getContext('2d');
const wrap=$('#wrap'), menu=$('#menu'), tutorial=$('#tutorial'), result=$('#result'), hud=$('#hud'), flash=$('#flash'), toasts=$('#toasts');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hypot=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const TAU=Math.PI*2;
const COLORS={mint:'#2DD4BF',mint2:'#99F6E4',coral:'#FB7185',navy:'#1E293B',deep:'#07111f',paper:'#F8FAFC',amber:'#FACC15',green:'#22C55E',red:'#EF4444',blue:'#38BDF8',violet:'#A78BFA',slate:'#64748B'};
const STORAGE='triage_rush_v3_stable';
const UPGRADES=[
 {key:'precision',icon:'🎯',name:'손떨림 보정',desc:'판정 반경·드래그 허용 범위 증가',base:60,max:5},
 {key:'time',icon:'⏱️',name:'처치 시간 확보',desc:'모든 진료 제한 시간 증가',base:75,max:5},
 {key:'calm',icon:'💙',name:'초기 안정화',desc:'시작 BPM과 실수 상승량 감소',base:90,max:5},
 {key:'payout',icon:'🪙',name:'진료 수당 계약',desc:'성공 보상 증가',base:120,max:4}
];
const MINIS=[
 {id:'fever',tier:'easy',icon:'🌡️',name:'감기 / 발열',text:'초록 영역에 맞춰 체온계를 멈춘 뒤, 처방 색깔 알약을 같은 색 약통에 넣으세요.',extra:'타이밍 맞추기 · 약 분류하기',base:31,reward:38,make:makeFever},
 {id:'cut',tier:'easy',icon:'🩹',name:'단순 열상',text:'상처 위를 좌우로 빠르게 문질러 소독하고, 반창고를 정확히 붙이세요.',extra:'문질러 소독 · 반창고 붙이기',base:27,reward:34,make:makeCut},
 {id:'splinter',tier:'easy',icon:'🔎',name:'가시 박힘',text:'돋보기로 가시 끝을 찾아 누른 뒤, 박힌 방향의 반대로 쭉 뽑으세요.',extra:'끝 잡기 · 반대로 빼기',base:25,reward:36,make:makeSplinter},
 {id:'stomach',tier:'easy',icon:'🫧',name:'소화불량',text:'배 위에서 원을 빠르게 그려 가스를 빼고, 마지막 트림 버튼을 누르세요.',extra:'배를 빙글빙글 · 트림 버튼 누르기',base:28,reward:35,make:makeStomach},
 {id:'suture',tier:'normal',icon:'🪡',name:'상처 봉합',text:'번호가 매겨진 점을 순서대로 이어 봉합선을 완성하세요. 선에서 크게 벗어나면 BPM이 오릅니다.',extra:'번호 순서대로 봉합하기',base:31,reward:62,make:makeSuture},
 {id:'bone',tier:'normal',icon:'🦴',name:'뼈 접합',text:'뼈 조각을 그림자 위치에 맞춘 뒤, 나사 위치를 꾹 눌러 드릴 게이지를 채우세요.',extra:'뼈 맞추기 · 눌러 고정하기',base:34,reward:66,make:makeBone},
 {id:'eye',tier:'normal',icon:'👁️',name:'안과 레이저',text:'레이저 커서를 얇은 궤도 밖으로 나가지 않게 끝까지 따라가세요.',extra:'선 따라 이동하기',base:30,reward:64,make:makeEye},
 {id:'endo',tier:'normal',icon:'🔬',name:'내시경',text:'마우스 주변의 빛으로 어두운 시야를 탐색하고 용종 4개를 클릭해 제거하세요.',extra:'빛으로 찾기 · 제거하기',base:33,reward:68,make:makeEndo},
 {id:'cpr',tier:'hard',icon:'⚡',name:'심폐소생 / 제세동',text:'수축하는 원이 안전 링에 들어왔을 때 클릭하세요. 5회 연속 성공해야 합니다.',extra:'타이밍 맞춰 5회 충격',base:26,reward:102,make:makeCPR},
 {id:'transplant',tier:'hard',icon:'🫀',name:'장기 이식',text:'손상 장기를 제거하고 새 장기를 넣은 뒤, 같은 색 혈관을 연결하세요.',extra:'제거 · 삽입 · 혈관 연결',base:40,reward:126,make:makeTransplant},
 {id:'limb',tier:'hard',icon:'🦾',name:'사지 봉합',text:'뼈 정렬, 신경 연결, 피부 봉합을 짧은 시간 안에 연속으로 처리하세요.',extra:'뼈 · 신경 · 피부 순서',base:36,reward:138,make:makeLimb},
 {id:'brain',tier:'hard',icon:'🧠',name:'뇌종양 제거',text:'핀셋을 좁은 신경 통로 밖으로 벗어나지 않게 움직여 종양까지 안전하게 이동하세요.',extra:'정밀 이동',base:34,reward:150,make:makeBrain}
];
const PATIENTS=['김하린','박도윤','이서아','최민준','정라온','오지후','윤서진','한지안','문시우','강다은','서이준','임하윤'];
const TIER_KR={easy:'쉬움',normal:'보통',hard:'어려움'};
const TRAITS=['손이 떨립니다','호흡이 빠릅니다','통증을 호소합니다','침착하게 기다립니다','심박 변동이 큽니다','반응이 예민합니다'];
let app={screen:'menu',coins:0,best:0,up:{precision:0,time:0,calm:0,payout:0},muted:false,run:false,patients:0,streak:0,earned:0,bpm:78,maxBpm:185,timeLeft:0,timeMax:0,current:null,patient:null,paused:false,caseOver:false,shake:0,red:0,particles:[],pointer:{x:0,y:0,down:false},last:performance.now(),ecg:0,roomPulse:0};
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE)||'{}');app.coins=s.coins||0;app.best=s.best||0;app.up={...app.up,...(s.up||{})};app.muted=!!s.muted;}catch(e){}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({coins:app.coins,best:app.best,up:app.up,muted:app.muted}));}catch(e){/* file:// 또는 제한된 미리보기 환경에서는 저장 없이 실행 */}}
function upgradeCost(u){return Math.floor(u.base*Math.pow(1.62,app.up[u.key]||0));}
function renderShop(){ $('#menuCoins').textContent=app.coins; $('#menuBest').textContent=app.best; $('#shopCoins').textContent=app.coins+'🪙'; $('#muteBtn').textContent=app.muted?'사운드 OFF':'사운드 ON'; const list=$('#shopList'); list.innerHTML=''; UPGRADES.forEach(u=>{const lv=app.up[u.key]||0,cost=upgradeCost(u),maxed=lv>=u.max; const div=document.createElement('div'); div.className='upgrade'; div.innerHTML=`<div class="upgradeIcon">${u.icon}</div><div><div class="upgradeName">${u.name} Lv.${lv}/${u.max}</div><div class="upgradeDesc">${u.desc}</div></div><button class="btn buy" ${maxed||app.coins<cost?'disabled':''}>${maxed?'MAX':cost+'🪙'}</button>`; div.querySelector('button').onclick=()=>{if(app.coins>=cost&&lv<u.max){app.coins-=cost;app.up[u.key]=lv+1;beep('buy');save();renderShop();}}; list.appendChild(div); });}
function show(el){el.classList.remove('hidden');} function hide(el){el.classList.add('hidden');}
function toast(text,kind='good',x=W/2,y=H/2){const d=document.createElement('div'); d.className='toast '+kind; d.textContent=text; d.style.left=(x/W*100)+'%'; d.style.top=(y/H*100)+'%'; toasts.appendChild(d); setTimeout(()=>d.remove(),1050);}
let audioCtx=null; function beep(type='ok'){ if(app.muted) return; try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type==='bad'?'sawtooth':type==='buy'?'triangle':'sine'; const f=type==='bad'?130:type==='win'?740:type==='buy'?520:440; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(type==='bad'?70:f*1.5,t+.12); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(type==='bad'?.17:.11,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.18);}catch(e){} }
function pt(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{const p=pt(e);app.pointer={...p,down:true}; if(app.screen==='play'&&!app.paused&&app.current?.down)app.current.down(p);});
window.addEventListener('pointermove',e=>{const p=pt(e);app.pointer.x=p.x;app.pointer.y=p.y; if(app.screen==='play'&&!app.paused&&app.pointer.down&&app.current?.move)app.current.move(p);});
window.addEventListener('pointerup',e=>{const p=pt(e);app.pointer.down=false; if(app.screen==='play'&&!app.paused&&app.current?.up)app.current.up(p);});
canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
$('#startBtn').onclick=startRun; $('#caseStartBtn').onclick=beginCase; $('#nextBtn').onclick=nextPatient; $('#lobbyBtn').onclick=goLobby; $('#muteBtn').onclick=()=>{app.muted=!app.muted;save();renderShop();}; $('#resetBtn').onclick=()=>{if(confirm('저장된 코인과 업그레이드를 초기화할까요?')){try{localStorage.removeItem(STORAGE);}catch(e){}app.coins=0;app.best=0;app.up={precision:0,time:0,calm:0,payout:0};renderShop();}};
function startRun(){beep('ok');hide(menu);hide(result);hud.classList.add('show');app.run=true;app.patients=0;app.streak=0;app.earned=0;app.bpm=clamp(84-app.up.calm*5,58,84);app.maxBpm=185;nextPatient();}
function goLobby(){app.run=false;app.screen='menu';hud.classList.remove('show');hide(result);hide(tutorial);show(menu);renderShop();}

function makeWires(meta,onDone=null){const cols=[COLORS.mint,COLORS.coral,COLORS.amber,COLORS.blue];let left=cols.map((c,i)=>({x:430,y:280+i*70,c,done:false}));let right=cols.map((c,i)=>({x:850,y:280+i*70,c,done:false})).sort(()=>Math.random()-.5);let drag=null,lines=[];return{meta,down(p){const l=left.find(n=>!n.done&&circle(p,n.x,n.y,allowance(25,5,11)));if(l)drag={from:l,x:p.x,y:p.y};},move(p){if(drag){drag.x=p.x;drag.y=p.y;}},up(p){if(drag){const r=right.find(n=>!n.done&&circle(p,n.x,n.y,allowance(30,5,13)));if(r&&r.c===drag.from.c){r.done=drag.from.done=true;lines.push({a:drag.from,b:r,c:r.c});spark(r.x,r.y,8,r.c);beep('ok');if(lines.length===4)(onDone||completeCase)('혈관 연결 완료');}else mistake(9,'혈관 색이 다릅니다');drag=null;}},drawWires(){ctx.save();ctx.lineWidth=9;ctx.lineCap='round';lines.forEach(l=>{ctx.strokeStyle=l.c;ctx.beginPath();ctx.moveTo(l.a.x,l.a.y);ctx.bezierCurveTo(560,l.a.y,720,l.b.y,l.b.x,l.b.y);ctx.stroke();});if(drag){ctx.strokeStyle=drag.from.c;ctx.beginPath();ctx.moveTo(drag.from.x,drag.from.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();}left.concat(right).forEach(n=>{ctx.fillStyle=n.done?'#94a3b8':n.c;ctx.strokeStyle='#0f172a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(n.x,n.y,23,0,TAU);ctx.fill();ctx.stroke();});ctx.restore();},draw(){titleBlock(meta,'같은 색 혈관 연결');drawGoal(`연결 ${lines.length}/4`);panel(350,220,580,350,'rgba(248,250,252,.88)');this.drawWires();}};}
function makeTransplant(meta){let phase='remove',clicks=0,organ={x:640,y:380,r:85},newOrgan={x:260,y:540,r:58,drag:false};let wires=makeWires(meta,()=>completeCase('이식 완료'));return{meta,update(dt){},down(p){if(phase==='remove'){if(circle(p,organ.x,organ.y,organ.r)){clicks++;spark(p.x,p.y,8,COLORS.coral);if(clicks>=3)phase='insert';}else mistake(8,'손상 장기를 먼저 제거');}else if(phase==='insert'){if(circle(p,newOrgan.x,newOrgan.y,newOrgan.r)){newOrgan.drag=true;newOrgan.ox=p.x-newOrgan.x;newOrgan.oy=p.y-newOrgan.y;}}else wires.down(p);},move(p){if(phase==='insert'&&newOrgan.drag){newOrgan.x=p.x-newOrgan.ox;newOrgan.y=p.y-newOrgan.oy;}else if(phase==='wires')wires.move(p);},up(p){if(phase==='insert'&&newOrgan.drag){newOrgan.drag=false;if(Math.hypot(newOrgan.x-organ.x,newOrgan.y-organ.y)<allowance(65,8,28)){newOrgan.x=organ.x;newOrgan.y=organ.y;phase='wires';spark(640,380,20,COLORS.mint);}else mistake(10,'장기 위치가 맞지 않음');}else if(phase==='wires')wires.up(p);},draw(){titleBlock(meta,phase==='remove'?'손상 장기를 3회 클릭해 제거':phase==='insert'?'새 장기를 중앙에 삽입':'혈관 4쌍 연결');drawGoal(phase==='remove'?`제거 ${clicks}/3`:phase==='insert'?'삽입 대기':'혈관 연결');panel(310,210,660,410,'rgba(248,250,252,.9)');ctx.save();ctx.fillStyle=clicks>=3?'rgba(15,23,42,.15)':COLORS.coral;ctx.strokeStyle='#0f172a';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(organ.x,organ.y,organ.r,organ.r*1.15,0,0,TAU);ctx.fill();ctx.stroke();if(phase!=='remove'){ctx.fillStyle=COLORS.mint;ctx.beginPath();ctx.ellipse(newOrgan.x,newOrgan.y,newOrgan.r,newOrgan.r*1.1,0,0,TAU);ctx.fill();ctx.stroke();}if(phase==='wires')wires.drawWires();ctx.restore();}};}
function makeLimb(meta){let phase='bone';let bone=makeBone(meta,()=>{phase='nerves';spark(640,390,20,COLORS.mint);});let wires=makeWires(meta,()=>{phase='skin';spark(640,390,20,COLORS.amber);});let sut=makeSuture(meta,[{x:470,y:340},{x:540,y:430},{x:615,y:350},{x:690,y:435},{x:760,y:350},{x:830,y:420}],()=>completeCase('사지 봉합 완료'));return{meta,update(dt){if(phase==='bone')bone.update(dt);},down(p){({bone,nerves:wires,skin:sut})[phase].down(p);},move(p){({bone,nerves:wires,skin:sut})[phase].move(p);},up(p){({bone,nerves:wires,skin:sut})[phase].up(p);},draw(){titleBlock(meta,phase==='bone'?'1/3 뼈 정렬':phase==='nerves'?'2/3 신경 연결':'3/3 피부 봉합');drawGoal(phase==='bone'?'뼈 정렬':phase==='nerves'?'신경 연결':'피부 봉합');if(phase==='bone')bone.draw();else if(phase==='nerves')wires.draw();else sut.draw();}};}
function makeBrain(meta){const pts=[];for(let i=0;i<120;i++){const t=i/119;pts.push({x:260+t*760,y:390+Math.sin(t*TAU*2.6)*95+Math.sin(t*TAU*7)*18});}let active=false,idx=0;return{meta,down(p){if(circle(p,pts[0].x,pts[0].y,allowance(32,7,12))){active=true;idx=0;}else mistake(10,'입구에서 시작하세요');},move(p){if(!active)return;let nearest=idx,nd=999;for(let j=Math.max(0,idx-4);j<Math.min(pts.length,idx+10);j++){const d=hypot(p,pts[j]);if(d<nd){nd=d;nearest=j;}}idx=Math.max(idx,nearest);if(nd>allowance(28,8,12)){active=false;idx=Math.max(0,idx-8);mistake(14,'신경 벽에 닿음');}if(idx>pts.length-5)completeCase('종양 제거 완료');},up(){active=false;},draw(){titleBlock(meta,'벽에 닿지 않고 끝까지 이동');drawGoal(`진행 ${idx}/${pts.length}`);ctx.save();panel(210,185,860,430,'rgba(248,250,252,.9)');ctx.fillStyle='#fecdd3';ctx.strokeStyle='#0f172a';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(640,400,360,170,0,0,TAU);ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(15,23,42,.28)';ctx.lineWidth=78;ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#f8fafc';ctx.lineWidth=45;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.strokeStyle=COLORS.mint;ctx.lineWidth=10;ctx.beginPath();for(let i=0;i<=idx;i++){const p=pts[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.stroke();ctx.fillStyle=COLORS.coral;ctx.beginPath();ctx.arc(pts.at(-1).x,pts.at(-1).y,26,0,TAU);ctx.fill();ctx.strokeStyle='#0f172a';ctx.stroke();ctx.fillStyle=COLORS.navy;ctx.beginPath();ctx.arc(app.pointer.x,app.pointer.y,10,0,TAU);ctx.fill();ctx.restore();}};}
load();renderShop();window.__triageRush={app,MINIS,startRun,nextPatient,completeCase,failCase};
})();
