<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>혼합 계산 스네이크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none; /* 모바일 스크롤 방지 */
            font-family: 'GmarketSans', 'Malgun Gothic', sans-serif;
        }
        #game-board {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <!-- 메인 레이아웃: 데스크탑은 가로(Row), 모바일은 세로(Col) 배치 -->
    <div class="w-full max-w-5xl flex flex-col md:flex-row gap-6 md:gap-10 items-center md:items-start justify-center">

        <!-- 왼쪽: 게임 캔버스 영역 -->
        <div class="relative w-full max-w-md aspect-square rounded-xl overflow-hidden flex-shrink-0 shadow-2xl border-4 border-slate-700 bg-slate-800">
            <canvas id="game-board" width="400" height="400" class="w-full h-full block"></canvas>
            
            <!-- 오버레이 화면 (시작 / 게임오버) -->
            <div id="overlay" class="absolute inset-0 bg-slate-900/85 flex flex-col items-center justify-center p-6 text-center z-10 backdrop-blur-sm">
                <h1 id="overlay-title" class="text-3xl md:text-4xl font-black text-white mb-2 tracking-tight">혼합 계산 스네이크</h1>
                <p id="overlay-desc" class="text-slate-300 text-sm md:text-base mb-6 leading-relaxed">
                    <span class="text-amber-400 font-bold">+3, ×2</span> 등 조각을 먹어 수식을 만드세요!<br>
                    사칙연산 결과가 <span class="text-emerald-400 font-bold">목표 숫자</span>와 같아지면 클리어.<br>
                    (결과가 0 이하가 되거나 벽에 부딪히면 사망)
                </p>
                <div id="rank-box" class="hidden mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 w-full max-w-xs">
                    <div class="text-lg text-slate-300">최종 점수: <span id="final-score" class="font-bold text-white text-3xl">0</span></div>
                    <div class="text-xl mt-3 font-bold border-t border-slate-700 pt-3">당신의 랭크<br><span id="final-rank" class="text-4xl block mt-1"></span></div>
                </div>
                <button id="start-btn" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 px-10 rounded-full shadow-lg shadow-emerald-500/30 text-xl transition transform active:scale-95">
                    게임 시작
                </button>
            </div>
        </div>

        <!-- 오른쪽: UI 및 컨트롤 영역 -->
        <div class="w-full max-w-sm flex flex-col gap-4">
            
            <!-- 헤더 (스테이지, 타겟, 스코어, 시간) -->
            <div class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                <div>
                    <div class="text-sm text-slate-400 font-bold">STAGE <span id="ui-stage" class="text-white text-lg">1</span></div>
                    <div class="text-3xl font-black text-emerald-400 mt-1">목표 <span id="ui-target">10</span></div>
                </div>
                <div class="text-right flex flex-col items-end gap-1">
                    <div class="bg-slate-900 px-3 py-1 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400">점수</span> <span id="ui-score" class="text-amber-400 font-bold ml-1">0</span>
                    </div>
                    <div class="bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 text-rose-400 font-bold">
                        ⏱ <span id="ui-time">60</span>초
                    </div>
                </div>
            </div>

            <!-- 현재 수식 표시 -->
            <div class="bg-slate-800 p-5 rounded-2xl border-2 border-slate-600 shadow-inner flex flex-col items-center">
                <div class="text-sm text-slate-400 font-bold mb-2">현재 수식 (길이: <span id="ui-length" class="text-emerald-300 font-black text-lg">5</span>)</div>
                <div id="ui-expression" class="text-2xl font-mono font-bold tracking-widest break-words text-white text-center w-full min-h-[40px] flex items-center justify-center">
                    5
                </div>
            </div>

            <!-- 속도 조절 -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center px-5">
                <span class="text-sm text-slate-400 font-bold">게임 속도</span>
                <div class="flex gap-2">
                    <button class="speed-btn active bg-emerald-600 text-white text-sm px-3 py-1.5 rounded-lg shadow font-bold transition-colors" data-speed="1">1x</button>
                    <button class="speed-btn bg-slate-700 text-slate-300 text-sm px-3 py-1.5 rounded-lg shadow font-bold transition-colors" data-speed="1.5">1.5x</button>
                    <button class="speed-btn bg-slate-700 text-slate-300 text-sm px-3 py-1.5 rounded-lg shadow font-bold transition-colors" data-speed="2">2x</button>
                </div>
            </div>

            <!-- 모바일/마우스 D-PAD -->
            <div class="mt-2 grid grid-cols-3 gap-2 p-4 bg-slate-800 rounded-2xl border border-slate-700 select-none touch-manipulation">
                <div></div>
                <button class="dpad-btn rounded-xl h-14 md:h-12 flex justify-center items-center text-2xl" id="btn-up">▲</button>
                <div></div>
                <button class="dpad-btn rounded-xl h-14 md:h-12 flex justify-center items-center text-2xl" id="btn-left">◀</button>
                <button class="dpad-btn rounded-xl h-14 md:h-12 flex justify-center items-center text-2xl" id="btn-down">▼</button>
                <button class="dpad-btn rounded-xl h-14 md:h-12 flex justify-center items-center text-2xl" id="btn-right">▶</button>
            </div>
            
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiTarget = document.getElementById('ui-target');
        const uiScore = document.getElementById('ui-score');
        const uiTime = document.getElementById('ui-time');
        const uiExpression = document.getElementById('ui-expression');
        const uiLength = document.getElementById('ui-length');
        const uiStage = document.getElementById('ui-stage');
        
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');
        const rankBox = document.getElementById('rank-box');
        const finalScore = document.getElementById('final-score');
        const finalRank = document.getElementById('final-rank');

        // 속도 조절
        let speedMultiplier = 1;
        const speedBtns = document.querySelectorAll('.speed-btn');
        speedBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                speedBtns.forEach(b => {
                    b.classList.remove('bg-emerald-600', 'text-white');
                    b.classList.add('bg-slate-700', 'text-slate-300');
                });
                e.target.classList.remove('bg-slate-700', 'text-slate-300');
                e.target.classList.add('bg-emerald-600', 'text-white');
                speedMultiplier = parseFloat(e.target.getAttribute('data-speed'));
            });
        });

        // Game Constants
        const GRID_SIZE = 20;
        const TILE_COUNT = 20; // 20x20 grid = 400x400 canvas
        
        // Game State
        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let items = []; // 복합 조각들 (+3, x2 등)
        let expression = []; // 수식 배열
        let currentLength = 0;
        let targetNumber = 0;
        let score = 0;
        let stage = 1;
        let timeLeft = 0;
        let maxTime = 60;
        let isPlaying = false;
        
        let lastMoveTime = 0;
        let moveInterval = 200; // 밀리초
        let lastFrameTime = 0;

        // 사칙연산 계산기 (우선순위 적용)
        function evaluateExpression(expr) {
            if (expr.length === 0) return 0;
            let arr = [...expr];
            
            // 1. 곱셈, 나눗셈 계산
            for (let i = 1; i < arr.length; i += 2) {
                if (arr[i] === '×' || arr[i] === '÷') {
                    let a = arr[i-1];
                    let b = arr[i+1];
                    let res = (arr[i] === '×') ? (a * b) : (a / b);
                    arr.splice(i-1, 3, res);
                    i -= 2; 
                }
            }
            
            // 2. 덧셈, 뺄셈 계산
            let result = arr[0];
            for (let i = 1; i < arr.length; i += 2) {
                if (arr[i] === '+') result += arr[i+1];
                if (arr[i] === '-') result -= arr[i+1];
            }
            return Math.floor(result); 
        }

        function getFactors(n) {
            let factors = [];
            for (let i = 1; i <= 9; i++) {
                if (n !== 0 && n % i === 0) factors.push(i);
            }
            return factors.length > 0 ? factors : [1];
        }

        function getRandomEmptyPos() {
            let pos;
            let isOccupied = true;
            while(isOccupied) {
                pos = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
                isOccupied = snake.some(s => s.x === pos.x && s.y === pos.y) || items.some(i => i.x === pos.x && i.y === pos.y);
            }
            return pos;
        }

        // 숫자+기호 복합 아이템 스폰 로직
        function spawnItems() {
            items = [];
            let pool = [];

            // 더하기 (+1 ~ +9)
            for(let i=1; i<=9; i++) pool.push({op: '+', num: i});
            
            // 빼기 (-1 ~ -9) (안전한 것만)
            for(let i=1; i<=9; i++) {
                if (evaluateExpression([...expression, '-', i]) > 0) {
                    pool.push({op: '-', num: i});
                }
            }
            
            // 곱하기 (×1 ~ ×5) (길이가 너무 폭주하지 않도록 5까지만)
            for(let i=1; i<=5; i++) {
                if (evaluateExpression([...expression, '×', i]) > 0) {
                    pool.push({op: '×', num: i});
                }
            }
            
            // 나누기 (현재 식의 마지막 숫자의 약수)
            let lastNum = expression[expression.length - 1];
            let factors = getFactors(lastNum);
            factors.forEach(f => {
                if (evaluateExpression([...expression, '÷', f]) > 0) {
                    pool.push({op: '÷', num: f});
                }
            });

            // 풀을 섞고 4개를 뽑는다.
            pool.sort(() => Math.random() - 0.5);

            for(let i=0; i<4 && i<pool.length; i++) {
                let pos = getRandomEmptyPos();
                let val = pool[i];
                items.push({
                    x: pos.x, y: pos.y, 
                    op: val.op, num: val.num, 
                    text: val.op + val.num
                });
            }

            // 만약 생성이 안됐다면 강제 +1 생성 (예외 방지)
            if (items.length === 0) {
                let pos = getRandomEmptyPos();
                items.push({ x: pos.x, y: pos.y, op: '+', num: 1, text: '+1' });
            }
        }

        function updateUI() {
            uiTarget.innerText = targetNumber;
            uiScore.innerText = score;
            uiStage.innerText = stage;
            uiTime.innerText = Math.ceil(timeLeft);
            uiExpression.innerText = expression.join(' ');
            uiLength.innerText = currentLength;
        }

        function setupStage(isNextStage = false) {
            if (!isNextStage) {
                stage = 1; score = 0; maxTime = 60; moveInterval = 250;
            } else {
                stage++;
                maxTime = Math.max(20, 60 - (stage * 3));
                moveInterval = Math.max(120, 250 - (stage * 12)); 
            }
            
            timeLeft = maxTime;
            
            let baseVal = isNextStage ? currentLength : Math.floor(Math.random() * 5) + 3;
            expression = [baseVal];
            currentLength = evaluateExpression(expression);
            
            let diff = Math.floor(Math.random() * 20) + (10 * stage);
            targetNumber = currentLength + diff;
            
            if (!isNextStage) {
                snake = [];
                for(let i = 0; i < currentLength; i++) {
                    snake.push({x: 10 - i, y: 10, oldX: 10 - i, oldY: 10});
                }
                dir = {x: 1, y: 0};
                nextDir = {x: 1, y: 0};
            }

            spawnItems();
            updateUI();
        }

        function getRank(sc) {
            if (sc >= 4000) return { name: "💎 다이아몬드", color: "text-cyan-400" };
            if (sc >= 2500) return { name: "💠 플래티넘", color: "text-teal-300" };
            if (sc >= 1200) return { name: "🥇 골드", color: "text-yellow-400" };
            if (sc >= 500) return { name: "🥈 실버", color: "text-gray-300" };
            return { name: "🥉 브론즈", color: "text-amber-700" };
        }

        function gameOver(reason) {
            isPlaying = false;
            overlay.classList.remove('hidden');
            overlayTitle.innerText = "게임 오버!";
            overlayDesc.innerHTML = `<span class="text-rose-400 font-bold">${reason}</span><br>마지막 수식: ${expression.join(' ')} = ${currentLength}`;
            
            rankBox.classList.remove('hidden');
            finalScore.innerText = score;
            let rank = getRank(score);

            let cleanRankName = rank.name.replace(/[^가-힣a-zA-Z]/g, '').trim();

            finalRank.innerText = rank.name;
            finalRank.className = `text-4xl block mt-1 ${rank.color}`;

            localStorage.setItem('snakeMathRank', cleanRankName);
            let bestScore = parseInt(localStorage.getItem('snakeMathScore') || 0);
            if (score > bestScore) {
            localStorage.setItem('snakeMathScore', score);
            }
            
            startBtn.innerText = "다시 시작";
        }

        function consumeItem(item) {
            // 한 번에 연산자와 숫자를 식에 추가
            expression.push(item.op);
            expression.push(item.num);
            
            let newLength = evaluateExpression(expression);
            
            // 뱀 길이 즉시 조절
            if (newLength > currentLength) {
                let diff = newLength - currentLength;
                let tail = snake[snake.length - 1];
                for (let i = 0; i < diff; i++) {
                    snake.push({...tail, oldX: tail.x, oldY: tail.y});
                }
            } else if (newLength < currentLength) {
                snake = snake.slice(0, Math.max(1, newLength));
            }
            
            currentLength = newLength;
            
            if (currentLength <= 0) {
                updateUI();
                gameOver("계산 결과가 0 이하가 되었습니다.");
                return;
            }
            
            if (currentLength === targetNumber) {
                let timeBonus = Math.floor(timeLeft) * 10;
                score += (100 * stage) + timeBonus;
                setupStage(true); 
                return;
            }
            
            updateUI();
            spawnItems(); 
        }

        function update() {
            dir = nextDir;
            
            snake.forEach(seg => { seg.oldX = seg.x; seg.oldY = seg.y; });

            let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y, oldX: snake[0].x, oldY: snake[0].y };
            
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver("벽에 부딪혔습니다.");
                return;
            }
            
            let ateItem = items.findIndex(i => i.x === head.x && i.y === head.y);
            
            snake.unshift(head);
            let tailSeg = null;
            if (ateItem === -1) {
                tailSeg = snake.pop(); 
            }

            let isCollision = false;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) { isCollision = true; break; }
            }
            
            if (isCollision) {
                if (tailSeg) snake.push(tailSeg);
                snake.shift();
                gameOver("자신의 몸에 부딪혔습니다.");
                return;
            }
            
            if (ateItem !== -1) {
                consumeItem(items[ateItem]);
            }
        }

        function draw(progress = 1) {
            ctx.fillStyle = '#1e293b'; // 캔버스 배경
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 은은한 그리드
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for(let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath(); ctx.moveTo(i * GRID_SIZE, 0); ctx.lineTo(i * GRID_SIZE, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * GRID_SIZE); ctx.lineTo(canvas.width, i * GRID_SIZE); ctx.stroke();
            }

            // 아이템 렌더링 (+3, x2 등)
            items.forEach(item => {
                ctx.beginPath();
                // 원 대신 모서리가 둥근 사각형 블록으로 표현 (글자가 잘 보이도록)
                ctx.roundRect(item.x * GRID_SIZE + 1, item.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
                
                if (item.op === '×' || item.op === '÷') ctx.fillStyle = '#f59e0b'; // 주황
                else if (item.op === '+') ctx.fillStyle = '#3b82f6'; // 파랑
                else ctx.fillStyle = '#ef4444'; // 빨강
                
                ctx.fill();
                
                ctx.fillStyle = 'white';
                ctx.font = '12px "GmarketSans", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 글자 배치
                ctx.fillText(item.text, item.x * GRID_SIZE + GRID_SIZE/2, item.y * GRID_SIZE + GRID_SIZE/2 + 1);
            });

            // 뱀 렌더링 (보간 적용)
            snake.forEach((segment, index) => {
                let curX = segment.oldX + (segment.x - segment.oldX) * progress;
                let curY = segment.oldY + (segment.y - segment.oldY) * progress;

                ctx.fillStyle = index === 0 ? '#10b981' : '#34d399'; 
                
                ctx.beginPath();
                ctx.roundRect(curX * GRID_SIZE + 1, curY * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
                ctx.fill();
                
                // 머리 눈썹/눈 디테일
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    if (dir.x === 1) { ctx.fillRect(curX*GRID_SIZE + 12, curY*GRID_SIZE + 4, 3, 3); ctx.fillRect(curX*GRID_SIZE + 12, curY*GRID_SIZE + 12, 3, 3); }
                    else if (dir.x === -1) { ctx.fillRect(curX*GRID_SIZE + 4, curY*GRID_SIZE + 4, 3, 3); ctx.fillRect(curX*GRID_SIZE + 4, curY*GRID_SIZE + 12, 3, 3); }
                    else if (dir.y === 1) { ctx.fillRect(curX*GRID_SIZE + 4, curY*GRID_SIZE + 12, 3, 3); ctx.fillRect(curX*GRID_SIZE + 12, curY*GRID_SIZE + 12, 3, 3); }
                    else if (dir.y === -1) { ctx.fillRect(curX*GRID_SIZE + 4, curY*GRID_SIZE + 4, 3, 3); ctx.fillRect(curX*GRID_SIZE + 12, curY*GRID_SIZE + 4, 3, 3); }
                }
            });
        }

        function gameLoop(timestamp) {
            if (!isPlaying) { draw(1); return; }
            
            let actualMoveInterval = moveInterval / speedMultiplier; 
            let deltaMove = timestamp - lastMoveTime;
            let deltaFrame = timestamp - lastFrameTime;
            
            if (deltaFrame >= 100) {
                timeLeft -= (deltaFrame / 1000);
                uiTime.innerText = Math.ceil(Math.max(0, timeLeft));
                if (timeLeft <= 0) { gameOver("시간 초과!"); return; }
                lastFrameTime = timestamp;
            }

            if (deltaMove >= actualMoveInterval) {
                update();
                if (!isPlaying) return; 
                lastMoveTime = timestamp;
                deltaMove = 0;
            }
            
            let progress = Math.min(1, deltaMove / actualMoveInterval);
            draw(progress);
            requestAnimationFrame(gameLoop);
        }

        // 키보드 조작
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S': if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A': if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
            }
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        });

        // 스와이프 조작
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            let deltaX = e.changedTouches[0].screenX - touchStartX;
            let deltaY = e.changedTouches[0].screenY - touchStartY;
            let minSwipe = 30; 
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipe) {
                if (deltaX > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
                else if (deltaX < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
            } else if (Math.abs(deltaY) > minSwipe) {
                if (deltaY > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
                else if (deltaY < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
            }
        }, {passive: true});

        // D-PAD 버튼
        const bindDpad = (id, direction) => {
            document.getElementById(id).addEventListener('touchstart', (e) => { e.preventDefault(); if(dir[Object.keys(direction)[0]] !== -direction[Object.keys(direction)[0]]) nextDir = direction; });
            document.getElementById(id).addEventListener('mousedown', () => { if(dir[Object.keys(direction)[0]] !== -direction[Object.keys(direction)[0]]) nextDir = direction; });
        };
        bindDpad('btn-up', {x: 0, y: -1}); bindDpad('btn-down', {x: 0, y: 1}); bindDpad('btn-left', {x: -1, y: 0}); bindDpad('btn-right', {x: 1, y: 0});

        startBtn.addEventListener('click', () => {
            overlay.classList.add('hidden');
            setupStage(false);
            isPlaying = true;
            let now = performance.now();
            lastMoveTime = now; lastFrameTime = now;
            requestAnimationFrame(gameLoop);
        });

        draw(1);
    </script>
</body>
</html>
