        /* 캔버스에만 touch-action: none;을 주어 드래그 시 화면이 흔들리지 않게 합니다. */
        canvas { touch-action: none; background-color: #1e293b; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); cursor: crosshair; }
        .hidden { display: none !important; }
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: #475569; border-radius: 4px;
        }

        #stage-grid::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        #stage-grid::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .concept-pill {
            display: inline-flex; align-items: center; gap: 6px;

        .difficulty-pill {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 3px 8px; border-radius: 999px;
            font-size: 10px; font-weight: 900;
            background: rgba(251, 191, 36, 0.13); color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.25);

        .lesson-card {

            border-radius: 14px;
            padding: 10px 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);

            min-width: 64px;
            padding: 5px 8px;
            border-radius: 999px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(2, 6, 23, 0.55);

        .tool-btn {
            border-radius: 10px;

            font-weight: 900;

        .tool-btn.primary { background: rgba(14, 165, 233, 0.9); border-color: rgba(125, 211, 252, 0.8); color: white; }
        .tool-btn.warn { background: rgba(251, 191, 36, 0.15); color: #fde68a; border-color: rgba(251, 191, 36, 0.45); }

        // ==========================================
        // Audio Engine (Web Audio API)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;

        const soundEffects = {
            playTone: (freq, type, attack, release, vol=0.1) => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + attack);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + attack + release);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + attack + release);
            },
            click: () => soundEffects.playTone(1200, 'square', 0.01, 0.05, 0.05),
            hit: () => soundEffects.playTone(1500, 'triangle', 0.05, 0.2, 0.1),
            clearLevel: () => {
                soundEffects.playTone(440, 'sine', 0.1, 0.2, 0.1);
                setTimeout(() => soundEffects.playTone(554, 'sine', 0.1, 0.2, 0.1), 150);
                setTimeout(() => soundEffects.playTone(659, 'sine', 0.1, 0.4, 0.15), 300);
            },
            startBGM: () => {
                if(bgmInterval) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                let idx = 0;
                bgmInterval = setInterval(() => {
                    soundEffects.playTone(notes[idx], 'sine', 0.2, 0.5, 0.03);
                    idx = (idx + 1) % notes.length;
                }, 600);
            },
            stopBGM: () => {
                if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            }
        };

        const btnAnglePlus = document.getElementById('btn-angle-plus');

        const btnSnapSolution = document.getElementById('btn-snap-solution');
        const btnToggleGuide = document.getElementById('btn-toggle-guide');
        
        const formatTime = (sec) => {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        let hintStep = 0;
        let guideVisible = false;

        const normalizeAngle = (angle, max = 180) => {
            let value = Number(angle) || 0;
            value %= max;
            if (value < 0) value += max;
            return Math.round(value);
        };

        const getAngleKind = (angle, max = 180) => {
            const a = max === 360 ? normalizeAngle(angle, 360) : normalizeAngle(angle, 180);
            if (max === 360) {
                const cardinal = [0, 90, 180, 270].some(v => Math.abs(a - v) <= 2);
                if (cardinal) return '직각 방향';
                if (a < 90) return '예각 방향';
                if (a < 180) return '둔각 방향';
                if (a < 270) return '반대 둔각';
                return '반대 예각';
            }
            if (Math.abs(a - 90) <= 2) return '직각';
            if (a < 90) return '예각';
            return '둔각';
        };

        const getSelectedMirror = () => mirrors.find(m => m.id === selectedMirrorId);
        const getSelectedAngle = () => {
            if (selectedEmitter && levelData.emitter.rotatable) return levelData.emitter.angle;
            const m = getSelectedMirror();
            return m ? m.angle : null;
        };
        const getSelectedMax = () => selectedEmitter ? 360 : 180;
        const getSelectedSolution = () => {
            if (selectedEmitter && levelData.emitter.rotatable) return levelData.emitter.solutionAngle ?? levelData.solutions?.emitter;
            const m = getSelectedMirror();
            if (!m) return null;
            return m.solutionAngle ?? levelData.solutions?.mirrors?.[m.id];
        };

        const setLessonMessage = (message) => {
            lessonText.innerText = message || levelData?.lesson || '거울을 조절해 레이저를 목표에 보내세요.';
        };

        const updateAngleHelp = () => {
            const angle = getSelectedAngle();
            if (angle === null) {
                angleTypeLabel.innerText = '각도';
                angleHelpText.innerText = '거울이나 발사기를 선택하세요. 힌트 버튼을 누르면 단계별 도움을 받을 수 있습니다.';
                return;
            }
            const max = getSelectedMax();
            angleTypeLabel.innerText = getAngleKind(angle, max);
            const sol = getSelectedSolution();
            const targetText = sol !== null && sol !== undefined ? `정답선 기준 ${Math.round(sol)}°` : '정답선 없음';
            angleHelpText.innerText = `${Math.round(angle)}° · ${angleTypeLabel.innerText}입니다. ${targetText}.`;
        };

        const selectEmitterControl = () => {
            if (!levelData.emitter.rotatable) return false;
            selectedEmitter = true;
            selectedMirrorId = null;
            controlsPanel.classList.remove('hidden');
            controlLabel.innerText = '발사기 각도:';
            angleSlider.max = 360;
            angleInput.max = 360;
            angleSlider.value = normalizeAngle(levelData.emitter.angle, 360);
            angleInput.value = normalizeAngle(levelData.emitter.angle, 360);
            updateAngleHelp();
            return true;
        };

        const selectMirrorControl = (m) => {
            if (!m || m.fixed) return false;
            selectedMirrorId = m.id;
            selectedEmitter = false;
            controlsPanel.classList.remove('hidden');
            controlLabel.innerText = getLabelForType(m.type);
            angleSlider.max = 180;
            angleInput.max = 180;
            angleSlider.value = normalizeAngle(m.angle, 180);
            angleInput.value = normalizeAngle(m.angle, 180);
            updateAngleHelp();
            return true;
        };

        const getBestTimes = () => JSON.parse(localStorage.getItem('laserPuzzleBestTimes')) || {};
        const setBestTime = (levelId, time) => {
            const times = getBestTimes();
            if (!times[levelId] || time < times[levelId]) {
                times[levelId] = time;
                localStorage.setItem('laserPuzzleBestTimes', JSON.stringify(times));
                return true; 
            }
            return false;
        };

        const renderStageSelection = () => {
            const grid = document.getElementById('stage-grid');
            grid.innerHTML = '';
            const bestTimes = getBestTimes();

            LEVELS.forEach((lvl, idx) => {
                const bestTimeVal = bestTimes[lvl.id];
                const bestTimeStr = bestTimeVal ? formatTime(bestTimeVal) : '--:--';
                
                const btn = document.createElement('button');
                btn.className = "p-3 sm:p-4 bg-slate-900 border border-slate-700 hover:border-sky-500 rounded-xl flex flex-col items-center justify-between transition-colors text-left w-full min-h-36 shadow-md hover:shadow-sky-500/20";
                
                btn.innerHTML = `
                    <div class="relative w-full flex items-center justify-between gap-1">
                        <span class="text-sky-400 font-bold text-xs sm:text-sm">LEVEL ${lvl.id}</span>
                        <span class="difficulty-pill">${lvl.difficulty || '기초'}</span>
                    </div>
                    <div class="text-slate-100 font-extrabold text-xs sm:text-sm text-center leading-snug line-clamp-2">${lvl.title}</div>
                    <div class="concept-pill justify-center max-w-full overflow-hidden text-ellipsis">${lvl.concept || '각도'}</div>
                    <div class="text-amber-400 font-mono text-[10px] sm:text-xs mt-auto w-full text-center bg-slate-950/50 rounded py-1">BEST ${bestTimeStr}</div>
                `;
                btn.onclick = () => {
                    soundEffects.click();
                    audioCtx.resume();
                    soundEffects.startBGM();
                    startGame(idx);
                };
                grid.appendChild(btn);
            });
        };

        renderStageSelection();

        const startGame = (levelIndex) => {
            screens.start.classList.add('hidden');
            screens.result.classList.add('hidden');
            screens.game.classList.remove('hidden');
            
            currentLevelIndex = levelIndex;
            loadLevel(currentLevelIndex);
            gameState = 'playing';
            loop();
        };

        const loadLevel = (index) => {
            timeElapsed = 0;
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer-display').innerText = formatTime(timeElapsed);
            }, 1000);
            document.getElementById('timer-display').innerText = "00:00";

            levelData = JSON.parse(JSON.stringify(LEVELS[index]));
            mirrors = levelData.mirrors || [];
            portals = levelData.portals || [];
            selectedMirrorId = null;
            selectedEmitter = false;
            isTargetHit = false;
            targetHitTimer = 0;
            controlsPanel.classList.add('hidden');
            hintStep = 0;
            guideVisible = false;
            btnToggleGuide.innerText = '정답선 보기';
            lessonConcept.innerText = `📐 ${levelData.concept || '각도'}`;
            lessonDifficulty.innerText = levelData.difficulty || '기초';
            setLessonMessage(levelData.lesson);
            updateAngleHelp();
            
            document.getElementById('level-indicator').innerText = `LEVEL ${levelData.id}`;
            document.getElementById('level-title').innerText = levelData.title;
        };

        const goMenu = () => {
            gameState = 'start';
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrame);
            soundEffects.stopBGM();
            
            screens.game.classList.add('hidden');
            screens.result.classList.add('hidden');
            screens.start.classList.remove('hidden');
            renderStageSelection(); 
        };

        const levelClear = () => {
            gameState = 'result';
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrame);
            
            screens.game.classList.add('hidden');
            screens.result.classList.remove('hidden');
            
            document.getElementById('result-title').innerText = `LEVEL ${levelData.id} CLEAR!`;
            document.getElementById('final-time').innerText = formatTime(timeElapsed);
            
            const isNewRecord = setBestTime(levelData.id, timeElapsed);
            const bestTimes = getBestTimes();
            document.getElementById('new-best-time').innerText = formatTime(bestTimes[levelData.id]);
            
            const badge = document.getElementById('new-record-badge');
            if (isNewRecord) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const nextBtn = document.getElementById('btn-next-level');
            if (currentLevelIndex + 1 < LEVELS.length) {
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.add('hidden');
            }
        };

        document.getElementById('btn-ingame-menu').addEventListener('click', () => { soundEffects.click(); goMenu(); });
        document.getElementById('btn-to-menu').addEventListener('click', () => { soundEffects.click(); goMenu(); });
        document.getElementById('btn-retry-level').addEventListener('click', () => {
            soundEffects.click();
            startGame(currentLevelIndex);
        });
        document.getElementById('btn-next-level').addEventListener('click', () => {
            soundEffects.click();
            startGame(currentLevelIndex + 1);
        });

        // ==========================================
        // Input Handling
        // ==========================================
        const updateAngle = (angle) => {
            if (selectedEmitter && levelData.emitter.rotatable) {
                levelData.emitter.angle = normalizeAngle(angle, 360);
                angleSlider.value = levelData.emitter.angle;
                angleInput.value = levelData.emitter.angle;
            } else if (selectedMirrorId !== null) {
                const m = mirrors.find(m => m.id === selectedMirrorId);
                if (m && !m.fixed) {
                    m.angle = normalizeAngle(angle, 180);
                    angleSlider.value = m.angle;
                    angleInput.value = m.angle;
                }
            }
            updateAngleHelp();
        };

        angleSlider.addEventListener('input', (e) => updateAngle(parseInt(e.target.value)));
        angleInput.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if(!isNaN(val)) updateAngle(val);
        });

        btnAngleMinus.addEventListener('click', () => {
            soundEffects.click();
            const current = getSelectedAngle();
            if (current !== null) updateAngle(current - 5);
        });

        btnAnglePlus.addEventListener('click', () => {
            soundEffects.click();
            const current = getSelectedAngle();
            if (current !== null) updateAngle(current + 5);
        });

        btnStageHint.addEventListener('click', () => {
            soundEffects.click();
            const hints = levelData.hints || [];
            if (hints.length === 0) {
                setLessonMessage('거울을 하나씩 선택해 레이저가 다음 장치의 중심을 지나가도록 맞춰 보세요.');
                return;
            }
            setLessonMessage(`힌트 ${Math.min(hintStep + 1, hints.length)}: ${hints[hintStep % hints.length]}`);
            hintStep++;
        });

        btnToggleGuide.addEventListener('click', () => {
            soundEffects.click();
            guideVisible = !guideVisible;
            btnToggleGuide.innerText = guideVisible ? '정답선 숨기기' : '정답선 보기';
            setLessonMessage(guideVisible ? '노란 점선은 정답 각도입니다. 현재 거울 각도와 비교해 입사각=반사각을 확인하세요.' : levelData.lesson);
        });

        btnSnapSolution.addEventListener('click', () => {
            soundEffects.click();
            if (!selectedEmitter && selectedMirrorId === null) {
                if (!selectEmitterControl()) {
                    const first = mirrors.find(m => !m.fixed);
                    if (first) selectMirrorControl(first);
                }
            }
            const sol = getSelectedSolution();
            if (sol === null || sol === undefined) {
                setLessonMessage('이 장치에는 저장된 정답 각도가 없습니다. 다른 거울을 선택해 보세요.');
                return;
            }
            updateAngle(sol);
            guideVisible = true;
            btnToggleGuide.innerText = '정답선 숨기기';
            setLessonMessage(`선택한 장치를 정답 각도 ${Math.round(sol)}°로 맞췄습니다. 왜 이 각도가 되는지 레이저의 들어오는 길과 나가는 길을 비교해 보세요.`);
        });

        const getMousePos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        };

        const getLabelForType = (type) => {
            switch(type) {
                case 'convex_mirror': return '볼록거울 각도:';
                case 'concave_mirror': return '오목거울 각도:';
                case 'convex_lens': return '볼록렌즈 각도:';
                case 'concave_lens': return '오목렌즈 각도:';
                default: return '거울 각도:';
            }
        }

        const onPointerDown = (e) => {
            if (gameState !== 'playing') return;
            const pos = getMousePos(e);
            
            // 모바일 터치를 위해 발사기 인식 범위를 넓힘 (35 -> 50)
            if (levelData.emitter.rotatable) {
                const dist = Math.hypot(pos.x - levelData.emitter.x, pos.y - levelData.emitter.y);
                if (dist < 50) { 
                    soundEffects.click();
                    isDragging = true;
                    selectEmitterControl();
                    return;
                }
            }

            let clicked = null;
            for (let m of mirrors) {
                if (m.fixed) continue;
                const dist = Math.hypot(pos.x - m.x, pos.y - m.y);
                // 모바일 터치를 위해 거울 인식 범위를 넓힘 (+30 -> +50)
                if (dist < m.length / 2 + 50) {
                    clicked = m;
                    break;
                }
            }

            if (clicked) {
                soundEffects.click();
                isDragging = true;
                selectMirrorControl(clicked);
            } else {
                selectedMirrorId = null;
                selectedEmitter = false;
                controlsPanel.classList.add('hidden');
            }
        };

        const onPointerMove = (e) => {
            if (!isDragging || gameState !== 'playing') return;
            e.preventDefault(); // 스와이프로 인한 스크롤 방지
            const pos = getMousePos(e);
            
            if (selectedEmitter) {
                let angleRad = Math.atan2(pos.y - levelData.emitter.y, pos.x - levelData.emitter.x);
                let angleDeg = Math.round(angleRad * 180 / Math.PI);
                if (angleDeg < 0) angleDeg += 360;
                updateAngle(angleDeg);
            } else if (selectedMirrorId !== null) {
                const m = mirrors.find(x => x.id === selectedMirrorId);
                if (m) {
                    let angleRad = Math.atan2(pos.y - m.y, pos.x - m.x);
                    let angleDeg = Math.round(angleRad * 180 / Math.PI);
                    if (angleDeg < 0) angleDeg += 360;
                    updateAngle(angleDeg);
                }
            }
        };

        const onPointerUp = () => { isDragging = false; };

        // 마우스 이벤트
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        
        // 터치 이벤트
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        // ==========================================
        // Math / Physics
        // ==========================================
        const getIntersection = (x1, y1, x2, y2, x3, y3, x4, y4) => {
            const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
            if (den === 0) return null;
            const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
            const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;
            if (t > 0 && t < 1 && u > 0 && u < 1) { return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1), t }; }
            return null;
        };

        const getCircleIntersection = (x1, y1, x2, y2, cx, cy, r) => {
            const dx = x2 - x1; const dy = y2 - y1;
            const fx = x1 - cx; const fy = y1 - cy;
            const a = dx * dx + dy * dy;
            const b = 2 * (fx * dx + fy * dy);
            const c = (fx * fx + fy * fy) - r * r;
            let discriminant = b * b - 4 * a * c;
            if (discriminant < 0) return null;
            discriminant = Math.sqrt(discriminant);
            const t1 = (-b - discriminant) / (2 * a);
            const t2 = (-b + discriminant) / (2 * a);
            let t = -1;
            if (t1 >= 0 && t1 <= 1) t = t1;
            if (t2 >= 0 && t2 <= 1 && (t === -1 || t2 < t)) t = t2;
            if (t !== -1) return { x: x1 + t * dx, y: y1 + t * dy, t };
            return null;
        };

        // ==========================================
        // Rendering
        // ==========================================
        const loop = () => {
            if (gameState !== 'playing') return;
            draw();
            animationFrame = requestAnimationFrame(loop);
        };

        const draw = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const timeAnim = performance.now() / 500; 
            
            // Grid background
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // 1. Draw Walls
            ctx.fillStyle = '#475569';
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            levelData.walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeRect(w.x, w.y, w.w, w.h);
                ctx.beginPath();
                for(let i = 0; i < w.w + w.h; i += 10) {
                    ctx.moveTo(w.x + i, w.y);
                    ctx.lineTo(w.x, w.y + i);
                }
                ctx.stroke();
            });

            // 2. Draw Target
            const tgt = levelData.target;
            const hitRadius = levelData.assistRadius || tgt.radius;
            if (hitRadius > tgt.radius) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(tgt.x, tgt.y, hitRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(34, 197, 94, 0.08)';
                ctx.fill();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = 'rgba(134, 239, 172, 0.55)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(tgt.x, tgt.y, tgt.radius, 0, Math.PI * 2);
            ctx.fillStyle = isTargetHit ? '#34d399' : '#f87171';
            ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(tgt.x - 10, tgt.y - 10, 6, 6);
            ctx.fillRect(tgt.x + 4, tgt.y - 10, 6, 6);
            ctx.fillRect(tgt.x - 8, tgt.y + 5, 16, 4);

            // 3. Draw Portals
            portals.forEach(p => {
                [p.in, p.out].forEach((node, idx) => {
                    ctx.save();
                    ctx.translate(node.x, node.y);
                    
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = p.color;
                    ctx.rotate((idx === 0 ? timeAnim : -timeAnim));
                    ctx.setLineDash([15, 10]);
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.rotate(Math.PI / 4);
                    ctx.setLineDash([5, 15]);
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius - 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });
            });

            // 4. Draw Emitter
            const em = levelData.emitter;
            if (selectedEmitter) {
                ctx.save();
                ctx.translate(em.x, em.y);
                ctx.beginPath();
                ctx.arc(0, 0, 90, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; 
                ctx.fill();
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '10px Tahoma';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for(let a = 0; a < 360; a += 15) {
                    const rad = a * Math.PI / 180;
                    const isMajor = a % 45 === 0;
                    const len = isMajor ? 12 : 6;
                    ctx.beginPath();
                    ctx.moveTo((90 - len) * Math.cos(rad), (90 - len) * Math.sin(rad));
                    ctx.lineTo(90 * Math.cos(rad), 90 * Math.sin(rad));
                    ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)';
                    ctx.stroke();
                    if(isMajor) {
                        let textAngle = a;
                        if (textAngle > 180) textAngle -= 360;
                        ctx.fillText(textAngle + '°', (90 + 18) * Math.cos(rad), (90 + 18) * Math.sin(rad));
                    }
                }
                if (guideVisible && levelData.emitter.solutionAngle !== undefined) {
                    ctx.rotate(levelData.emitter.solutionAngle * Math.PI / 180);
                    ctx.setLineDash([8, 8]);
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(110, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.save();
            ctx.translate(em.x, em.y);
            ctx.rotate(em.angle * Math.PI / 180);
            if (em.rotatable) {
                ctx.shadowBlur = selectedEmitter ? 20 : 10;
                ctx.shadowColor = '#fbbf24';
                ctx.strokeStyle = '#fcd34d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(-15, -15, 30, 30);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.moveTo(15, -10); ctx.lineTo(35, 0); ctx.lineTo(15, 10); ctx.fill();
            ctx.restore();

            // 5. Draw Mirrors and Lenses
            mirrors.forEach(m => {
                const isSelected = m.id === selectedMirrorId;
                const mType = m.type || 'mirror';
                const solutionAngle = m.solutionAngle ?? levelData.solutions?.mirrors?.[m.id];

                if (guideVisible && solutionAngle !== undefined && !m.fixed) {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.rotate(solutionAngle * Math.PI / 180);
                    ctx.setLineDash([8, 8]);
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(-m.length / 2 - 10, 0);
                    ctx.lineTo(m.length / 2 + 10, 0);
                    ctx.stroke();
                    ctx.restore();
                }

                if (isSelected) {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.beginPath();
                    ctx.arc(0, 0, 90, Math.PI, 0);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, 90, 0, Math.PI);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
                    ctx.fill();

                    ctx.fillStyle = '#e2e8f0';
                    ctx.font = '12px Tahoma';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    for(let a = 0; a <= 180; a += 15) {
                        const rad = (180 - a) * Math.PI / 180;
                        const isMajor = a % 45 === 0;
                        const len = isMajor ? 12 : 6;
                        ctx.beginPath();
                        ctx.moveTo((90 - len) * Math.cos(rad), -(90 - len) * Math.sin(rad));
                        ctx.lineTo(90 * Math.cos(rad), -90 * Math.sin(rad));
                        ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)';
                        ctx.stroke();
                        if(isMajor) {
                            ctx.fillText(a.toString() + '°', (90 + 18) * Math.cos(rad), -(90 + 18) * Math.sin(rad));
                        }
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(m.x, m.y);
                ctx.rotate(m.angle * Math.PI / 180);
                if(isSelected) { ctx.shadowBlur = 15; ctx.shadowColor = '#38bdf8'; }

                if (mType === 'mirror') {
                    ctx.fillStyle = isSelected ? '#0ea5e9' : '#64748b';
                    ctx.fillRect(-m.length / 2, -5, m.length, 10);
                    ctx.fillStyle = '#e0f2fe';
                    ctx.fillRect(-m.length / 2, -2, m.length, 4);
                } 
                else if (mType === 'convex_mirror') { 
                    ctx.fillStyle = isSelected ? '#0ea5e9' : '#64748b';
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, 5);
                    ctx.lineTo(m.length/2, 5);
                    ctx.quadraticCurveTo(0, -20, -m.length/2, 5);
                    ctx.fill();
                    ctx.strokeStyle = '#e0f2fe';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, 5);
                    ctx.quadraticCurveTo(0, -20, m.length/2, 5);
                    ctx.stroke();
                }
                else if (mType === 'concave_mirror') { 
                    ctx.fillStyle = isSelected ? '#0ea5e9' : '#64748b';
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, -5);
                    ctx.lineTo(m.length/2, -5);
                    ctx.quadraticCurveTo(0, 20, -m.length/2, -5);
                    ctx.fill();
                    ctx.strokeStyle = '#e0f2fe';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, -5);
                    ctx.quadraticCurveTo(0, 20, m.length/2, -5);
                    ctx.stroke();
                }
                else if (mType === 'convex_lens') { 
                    ctx.fillStyle = isSelected ? 'rgba(56, 189, 248, 0.6)' : 'rgba(148, 163, 184, 0.4)';
                    ctx.strokeStyle = isSelected ? '#38bdf8' : '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, 0);
                    ctx.quadraticCurveTo(0, -20, m.length/2, 0);
                    ctx.quadraticCurveTo(0, 20, -m.length/2, 0);
                    ctx.fill();
                    ctx.stroke();
                }
                else if (mType === 'concave_lens') { 
                    ctx.fillStyle = isSelected ? 'rgba(56, 189, 248, 0.6)' : 'rgba(148, 163, 184, 0.4)';
                    ctx.strokeStyle = isSelected ? '#38bdf8' : '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-m.length/2, -10);
                    ctx.quadraticCurveTo(0, -2, m.length/2, -10);
                    ctx.lineTo(m.length/2, 10);
                    ctx.quadraticCurveTo(0, 2, -m.length/2, 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
                
                if (m.fixed) {
                    ctx.rotate(-m.angle * Math.PI / 180);
                    ctx.fillStyle = '#facc15';
                    ctx.font = 'bold 18px Tahoma';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🔒', 0, -24);
                }
                ctx.restore();
            });

            // 6. Raycasting Physics Logic
            let rayOrigin = { x: em.x, y: em.y };
            let rayAngle = em.angle * Math.PI / 180;
            let currentHitTarget = false;
            let rayPoints = [rayOrigin];
            
            const MAX_BOUNCES = 15;
            let bounces = 0;
            let lastHitObjId = null;

            while (bounces < MAX_BOUNCES) {
                let endX = rayOrigin.x + Math.cos(rayAngle) * 3000;
                let endY = rayOrigin.y + Math.sin(rayAngle) * 3000;
                let closestHit = null;
                let hitType = null;
                let hitObj = null;

                const tHit = getCircleIntersection(rayOrigin.x, rayOrigin.y, endX, endY, tgt.x, tgt.y, levelData.assistRadius || tgt.radius);
                if (tHit) { closestHit = tHit; hitType = 'target'; }

                levelData.walls.forEach(w => {
                    const lines = [
                        [w.x, w.y, w.x+w.w, w.y], [w.x, w.y, w.x, w.y+w.h],
                        [w.x+w.w, w.y, w.x+w.w, w.y+w.h], [w.x, w.y+w.h, w.x+w.w, w.y+w.h]
                    ];
                    lines.forEach(l => {
                        const hit = getIntersection(rayOrigin.x, rayOrigin.y, endX, endY, l[0], l[1], l[2], l[3]);
                        if (hit && hit.t > 0.001 && (!closestHit || hit.t < closestHit.t)) {
                            closestHit = hit; hitType = 'wall';
                        }
                    });
                });

                mirrors.forEach(m => {
                    const rad = m.angle * Math.PI / 180;
                    const mx1 = m.x - (m.length/2) * Math.cos(rad);
                    const my1 = m.y - (m.length/2) * Math.sin(rad);
                    const mx2 = m.x + (m.length/2) * Math.cos(rad);
                    const my2 = m.y + (m.length/2) * Math.sin(rad);

                    const hit = getIntersection(rayOrigin.x, rayOrigin.y, endX, endY, mx1, my1, mx2, my2);
                    if (hit && hit.t > 0.005 && m.id !== lastHitObjId && (!closestHit || hit.t < closestHit.t)) {
                        closestHit = hit; hitType = 'optic'; hitObj = m;
                    }
                });

                portals.forEach(p => {
                    const distIn = Math.hypot(rayOrigin.x - p.in.x, rayOrigin.y - p.in.y);
                    if (distIn > p.radius) {
                        const hitIn = getCircleIntersection(rayOrigin.x, rayOrigin.y, endX, endY, p.in.x, p.in.y, p.radius);
                        if (hitIn && hitIn.t > 0.001 && (!closestHit || hitIn.t < closestHit.t)) {
                            closestHit = hitIn; hitType = 'portal'; hitObj = { portal: p, type: 'in' };
                        }
                    }
                    const distOut = Math.hypot(rayOrigin.x - p.out.x, rayOrigin.y - p.out.y);
                    if (distOut > p.radius) {
                        const hitOut = getCircleIntersection(rayOrigin.x, rayOrigin.y, endX, endY, p.out.x, p.out.y, p.radius);
                        if (hitOut && hitOut.t > 0.001 && (!closestHit || hitOut.t < closestHit.t)) {
                            closestHit = hitOut; hitType = 'portal'; hitObj = { portal: p, type: 'out' };
                        }
                    }
                });

                if (closestHit) {
                    rayPoints.push({ x: closestHit.x, y: closestHit.y });
                    if (hitType === 'target') {
                        currentHitTarget = true;
                        break;
                    } else if (hitType === 'wall') {
                        break;
                    } else if (hitType === 'optic') {
                        const mType = hitObj.type || 'mirror';
                        const vx = Math.cos(rayAngle); 
                        const vy = Math.sin(rayAngle);
                        const rad = hitObj.angle * Math.PI / 180;
                        
                        const d = (closestHit.x - hitObj.x) * Math.cos(rad) + (closestHit.y - hitObj.y) * Math.sin(rad);

                        if (mType === 'mirror' || mType === 'convex_mirror' || mType === 'concave_mirror') {
                            let normalAngle = rad + Math.PI / 2;
                            if (mType === 'convex_mirror') normalAngle += d * 0.015;
                            else if (mType === 'concave_mirror') normalAngle -= d * 0.015;

                            let nx = Math.cos(normalAngle);
                            let ny = Math.sin(normalAngle);
                            if (vx * nx + vy * ny > 0) { nx = -nx; ny = -ny; }
                            const dot = vx * nx + vy * ny;
                            const rx = vx - 2 * dot * nx;
                            const ry = vy - 2 * dot * ny;
                            
                            rayAngle = Math.atan2(ry, rx);
                            rayOrigin = { x: closestHit.x, y: closestHit.y };
                        } 
                        else if (mType === 'convex_lens' || mType === 'concave_lens') {
                            const dx = Math.cos(rad) * d;
                            const dy = Math.sin(rad) * d;
                            const strength = 0.02;
                            
                            let nx_v, ny_v;
                            if (mType === 'convex_lens') {
                                nx_v = vx - dx * strength;
                                ny_v = vy - dy * strength;
                            } else {
                                nx_v = vx + dx * strength;
                                ny_v = vy + dy * strength;
                            }
                            
                            rayAngle = Math.atan2(ny_v, nx_v);
                            rayOrigin = { x: closestHit.x, y: closestHit.y };
                            rayOrigin.x += Math.cos(rayAngle) * 0.1;
                            rayOrigin.y += Math.sin(rayAngle) * 0.1;
                        }

                        lastHitObjId = hitObj.id;
                        bounces++;
                    } else if (hitType === 'portal') {
                        const targetNode = hitObj.type === 'in' ? hitObj.portal.out : hitObj.portal.in;
                        rayOrigin = { x: targetNode.x, y: targetNode.y }; 
                        rayPoints.push(null); 
                        rayPoints.push({ x: targetNode.x, y: targetNode.y }); 
                        lastHitObjId = null; 
                        bounces++;
                    }
                } else {
                    rayPoints.push({ x: endX, y: endY });
                    break;
                }
            }

            // Draw Laser (Glow)
            ctx.shadowBlur = 10;
            ctx.shadowColor = currentHitTarget ? '#34d399' : '#f87171';
            ctx.strokeStyle = currentHitTarget ? '#a7f3d0' : '#fca5a5';
            ctx.lineWidth = 5;
            ctx.beginPath();
            for(let i=0; i<rayPoints.length; i++) {
                if (rayPoints[i] === null) {
                    ctx.stroke(); ctx.beginPath(); 
                    if (i + 1 < rayPoints.length) ctx.moveTo(rayPoints[i+1].x, rayPoints[i+1].y);
                } else {
                    if (i === 0 || rayPoints[i-1] === null) ctx.moveTo(rayPoints[i].x, rayPoints[i].y);
                    else ctx.lineTo(rayPoints[i].x, rayPoints[i].y);
                }
            }
            ctx.stroke();

            // Draw Laser (Core)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<rayPoints.length; i++) {
                if (rayPoints[i] === null) {
                    ctx.stroke(); ctx.beginPath();
                    if (i + 1 < rayPoints.length) ctx.moveTo(rayPoints[i+1].x, rayPoints[i+1].y);
                } else {
                    if (i === 0 || rayPoints[i-1] === null) ctx.moveTo(rayPoints[i].x, rayPoints[i].y);
                    else ctx.lineTo(rayPoints[i].x, rayPoints[i].y);
                }
            }
            ctx.stroke();

            // Handle Target Hit state
            if (currentHitTarget) {
                targetHitTimer++;
                if (!isTargetHit) {
                    isTargetHit = true;
                    soundEffects.hit();
                }
                if (targetHitTimer > 18) {
                    soundEffects.clearLevel();
                    levelClear();
                }
            } else {
                isTargetHit = false;
                targetHitTimer = 0;
            }
        };

    </script>
