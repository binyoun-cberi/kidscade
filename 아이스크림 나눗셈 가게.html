function undo(){if(locked||!history.length)return;wakeAudio();const h=history.pop();h.s.parent.remove(h.s);cups[h.i].count--;placed--;updateLabel(h.i);updateRemain();sound('tap')}
function reset(){if(locked)return;wakeAudio();cups.forEach((c,i)=>{while(c.scoops.children.length)c.scoops.remove(c.scoops.children[0]);c.count=0;updateLabel(i)});history=[];placed=0;firstTry=false;updateRemain();el('hint').textContent='다시 천천히, 한 컵씩 번갈아 담아 보세요.';sound('tap')}
function check(){if(locked)return;wakeAudio();const o=ORDERS[orderIndex],rem=o.total-placed;if(rem>0){firstTry=false;combo=0;el('combo').textContent=combo;toast(`아직 ${rem}스쿱 남았어요! 모두 나눠 담아 주세요.`,'bad');sound('bad');return}const target=o.total/o.cups,ok=cups.every(c=>c.count===target);if(!ok){firstTry=false;combo=0;el('combo').textContent=combo;const vals=cups.map(c=>c.count);toast(`컵마다 ${vals.join(' · ')}스쿱이에요. 모두 같은 수가 되게 해볼까요?`,'bad');el('hint').textContent='많이 담긴 컵은 되돌리기로 빼고, 적은 컵에 다시 담아 보세요.';shakeCups();sound('bad');return}locked=true;if(firstTry)combo++;else combo=0;coins+=10+combo*2;el('coins').textContent=coins;el('combo').textContent=combo;toast(`${o.total} ÷ ${o.cups} = ${target}  — 완벽하게 나눴어요!`,'good',1450);sound('good');confetti();setTimeout(()=>{orderIndex++;if(orderIndex>=ORDERS.length)endGame();else setupOrder()},1500);updateButtons()}
function shakeCups(){cups.forEach((c,j)=>{const x=c.g.position.x,t=performance.now();const f=()=>{const d=(performance.now()-t)/330;c.g.position.x=x+Math.sin(d*28+j)*.06*(1-d);if(d<1)requestAnimationFrame(f);else c.g.position.x=x};f()})}
let toastTimer;function toast(msg,type='normal',ms=1250){const t=el('toast');t.textContent=msg;t.className='toastShow '+(type==='good'?'toastGood':type==='bad'?'toastBad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',ms)}
function confetti(){const colors=['#ff7899','#62cbb1','#ffd86a','#8fc9ff','#b79cff'];for(let i=0;i<38;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'%';d.style.background=colors[i%colors.length];d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=(Math.random()*.25)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}}
function endGame(){locked=true;start.classList.add('hidden');finish.classList.remove('hidden');el('finishText').innerHTML=`10개의 주문을 모두 해결했어요.<br><b>오늘 번 코인 ${coins}개</b>`;el('bestText').textContent='공평하게 나누기 성공!';overlay.classList.remove('hidden');confetti();sound('good')}
function wakeAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function tone(freq,dur=.07,type='sine',gain=.045,delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02)}
function sound(n){if(n==='scoop'){tone(650,.055,'triangle',.035);tone(920,.045,'triangle',.025,.035)}else if(n==='good'){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'triangle',.05,i*.065))}else if(n==='bad'){tone(180,.15,'sawtooth',.035);tone(130,.15,'sawtooth',.025,.09)}else tone(420,.045,'triangle',.025)}
canvas.addEventListener('pointerdown',e=>{if(locked)return;const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const h=ray.intersectObjects(hitTargets,false)[0];if(h)addScoop(h.object.userData.cupIndex)});
el('undo').onclick=undo;el('reset').onclick=reset;el('check').onclick=check;el('open').onclick=()=>{wakeAudio();orderIndex=0;coins=0;combo=0;finish.classList.add('hidden');start.classList.add('hidden');overlay.classList.add('hidden');setupOrder();sound('good')};el('again').onclick=()=>{orderIndex=0;coins=0;combo=0;finish.classList.add('hidden');overlay.classList.add('hidden');setupOrder()};
addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='z')undo();if(e.key==='r')reset();if((e.key==='Enter'||e.key===' ')&&e.target===document.body){e.preventDefault();check()}});
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;sign.position.y=5.15+Math.sin(t*1.7)*.015;renderer.render(scene,camera)}animate();loadAll().catch(err=>{console.error(err);el('load').textContent='가게 재료를 불러오지 못했어요. 아래 버튼으로 다시 시도해 주세요.';el('open').textContent='다시 불러오기';el('open').disabled=false;el('open').onclick=()=>location.reload()});
})();
</script>
