function cheerStudents(){const now=performance.now();students.forEach((s,i)=>{s.cheerUntil=now+1550;s.phase=i*.72;playStudent(s,/cheer|celebr|victory|jump|wave|dance/i,true);const tag=makeCheerTag();tag.position.x=(i%2?-.08:.08);s.root.add(tag);s.tag=tag;setTimeout(()=>{if(s.tag===tag){tag.removeFromParent();tag.material.map.dispose();tag.material.dispose();s.tag=null}playStudent(s,/idle/i,false)},1500)})}
function scoopPosition(n){const layer=Math.floor(n/3),i=n%3;return [[-.19,layer*.38,.08],[.19,layer*.38,.08],[0,layer*.38,-.2]][i]}
function setupOrder(){clearCups();locked=false;firstTry=true;const o=ORDERS[orderIndex];el('stage').textContent=`${orderIndex+1} / ${ORDERS.length}`;el('orderText').innerHTML=`<b>${o.cups}명의 친구</b>가 기다려요! ${o.name} 아이스크림 <b>${o.total}스쿱</b>을 똑같이 나눠 주세요.`;el('remain').textContent=o.total;el('coins').textContent=coins;el('combo').textContent=combo;el('hint').textContent=`친구 ${o.cups}명에게 한 컵씩, 공평하게 나눠 담아요.`;const spacing=o.cups<=3?1.7:o.cups===4?1.45:o.cups===5?1.25:1.08,startX=-(o.cups-1)*spacing/2;setupStudents(o.cups,spacing,startX);for(let i=0;i<o.cups;i++){const g=new THREE.Group();g.position.set(startX+i*spacing,1.01,.8);cupGroup.add(g);const vis=prototypes.cup.clone(true);g.add(vis);const scoops=new THREE.Group();g.add(scoops);const label=makeLabel(0);label.position.set(0,.12,.78);g.add(label);const hit=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,2.15,16),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));hit.position.y=1.05;hit.userData.cupIndex=i;g.add(hit);hitTargets.push(hit);cups.push({g,scoops,label,count:0})}updateButtons()}
function updateLabel(i){const old=cups[i].label,p=old.position.clone();cups[i].g.remove(old);old.material.map.dispose();old.material.dispose();const n=makeLabel(cups[i].count);n.position.copy(p);cups[i].g.add(n);cups[i].label=n}
function addScoop(i){if(locked)return;const o=ORDERS[orderIndex];if(placed>=o.total){toast('모든 스쿱을 이미 담았어요. 완성 버튼을 눌러 보세요!','bad');return}wakeAudio();const proto=o.kind==='choco'?prototypes.choco:prototypes.mint,s=proto.clone(true);if(o.tint)tint(s,o.tint);const pos=scoopPosition(cups[i].count);s.position.set(pos[0],.52+pos[1],pos[2]);s.scale.setScalar(.01);cups[i].scoops.add(s);cups[i].count++;placed++;history.push({i,s});updateLabel(i);updateRemain();bounce(s);sound('scoop')}
function bounce(obj){const t0=performance.now();const run=()=>{const t=Math.min(1,(performance.now()-t0)/180),q=1-Math.pow(1-t,3);obj.scale.setScalar(.01+.99*q);if(t<1)requestAnimationFrame(run)};run()}
function updateRemain(){const o=ORDERS[orderIndex];el('remain').textContent=o.total-placed;updateButtons()}
function updateButtons(){el('undo').disabled=locked||history.length===0;el('reset').disabled=locked||placed===0;el('check').disabled=locked}
function undo(){if(locked||!history.length)return;wakeAudio();const h=history.pop();h.s.parent.remove(h.s);cups[h.i].count--;placed--;updateLabel(h.i);updateRemain();sound('tap')}
function reset(){if(locked)return;wakeAudio();cups.forEach((c,i)=>{while(c.scoops.children.length)c.scoops.remove(c.scoops.children[0]);c.count=0;updateLabel(i)});history=[];placed=0;firstTry=false;updateRemain();el('hint').textContent='다시 천천히, 친구마다 한 컵씩 번갈아 담아 보세요.';sound('tap')}
function check(){if(locked)return;wakeAudio();const o=ORDERS[orderIndex],rem=o.total-placed;if(rem>0){firstTry=false;combo=0;el('combo').textContent=combo;toast(`아직 ${rem}스쿱 남았어요! 기다리는 친구 모두에게 나눠 주세요.`,'bad');sound('bad');return}const target=o.total/o.cups,ok=cups.every(c=>c.count===target);if(!ok){firstTry=false;combo=0;el('combo').textContent=combo;const vals=cups.map(c=>c.count);toast(`컵마다 ${vals.join(' · ')}스쿱이에요. 모두 같은 수가 되게 해볼까요?`,'bad');el('hint').textContent='많이 담긴 컵은 되돌리기로 빼고, 적은 친구의 컵에 다시 담아 보세요.';shakeCups();sound('bad');return}locked=true;if(firstTry)combo++;else combo=0;coins+=10+combo*2;el('coins').textContent=coins;el('combo').textContent=combo;toast(`${o.total} ÷ ${o.cups} = ${target}  — 친구들이 “만세!”를 외쳐요!`,'good',1700);cheerStudents();sound('cheer');confetti();setTimeout(()=>{orderIndex++;if(orderIndex>=ORDERS.length)endGame();else setupOrder()},1800);updateButtons()}
function shakeCups(){cups.forEach((c,j)=>{const x=c.g.position.x,t=performance.now();const f=()=>{const d=(performance.now()-t)/330;c.g.position.x=x+Math.sin(d*28+j)*.06*(1-d);if(d<1)requestAnimationFrame(f);else c.g.position.x=x};f()})}
let toastTimer;function toast(msg,type='normal',ms=1250){const t=el('toast');t.textContent=msg;t.className='toastShow '+(type==='good'?'toastGood':type==='bad'?'toastBad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',ms)}
function confetti(){const colors=['#ff7899','#62cbb1','#ffd86a','#8fc9ff','#b79cff'];for(let i=0;i<38;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'%';d.style.background=colors[i%colors.length];d.style.setProperty('--dx',(Math.random()*180-90)+'px');d.style.animationDelay=(Math.random()*.25)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}}
function endGame(){locked=true;start.classList.add('hidden');finish.classList.remove('hidden');el('finishText').innerHTML=`10개의 주문을 모두 해결했어요.<br><b>오늘 번 코인 ${coins}개</b>`;el('bestText').textContent='모두에게 공평하게 나누기 성공!';overlay.classList.remove('hidden');confetti();sound('good')}
function wakeAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function tone(freq,dur=.07,type='sine',gain=.045,delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02)}
function cheerNoise(){if(!audio)return;const len=Math.floor(audio.sampleRate*.28),buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)*.12;const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();filter.type='bandpass';filter.frequency.value=1400;filter.Q.value=.7;g.gain.value=.16;src.buffer=buf;src.connect(filter).connect(g).connect(audio.destination);src.start()}
function sound(n){if(n==='scoop'){tone(650,.055,'triangle',.035);tone(920,.045,'triangle',.025,.035)}else if(n==='good'){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'triangle',.05,i*.065))}else if(n==='cheer'){[523,659,784,1046,1319].forEach((f,i)=>tone(f,.18,'triangle',.055,i*.07));tone(1568,.22,'sine',.035,.34);cheerNoise()}else if(n==='bad'){tone(180,.15,'sawtooth',.035);tone(130,.15,'sawtooth',.025,.09)}else tone(420,.045,'triangle',.025)}
canvas.addEventListener('pointerdown',e=>{if(locked)return;const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const h=ray.intersectObjects(hitTargets,false)[0];if(h)addScoop(h.object.userData.cupIndex)});
el('undo').onclick=undo;el('reset').onclick=reset;el('check').onclick=check;el('open').onclick=()=>{wakeAudio();orderIndex=0;coins=0;combo=0;finish.classList.add('hidden');start.classList.add('hidden');overlay.classList.add('hidden');setupOrder();sound('good')};el('again').onclick=()=>{orderIndex=0;coins=0;combo=0;finish.classList.add('hidden');overlay.classList.add('hidden');setupOrder()};
addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='z')undo();if(e.key==='r')reset();if((e.key==='Enter'||e.key===' ')&&e.target===document.body){e.preventDefault();check()}});
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001,now=performance.now(),dt=Math.min(clock.getDelta(),.05);sign.position.y=5.15+Math.sin(t*1.7)*.015;students.forEach((s,i)=>{s.mixer.update(dt);if(now<s.cheerUntil){const p=(now+s.phase*130)/105;s.root.position.y=s.baseY+Math.abs(Math.sin(p))*.24;s.root.rotation.z=Math.sin(p*.7)*.035}else{s.root.position.y=s.baseY;s.root.rotation.z=0}});renderer.render(scene,camera)}animate();
loadAll().catch(err=>{console.error(err);el('load').textContent='가게 재료를 불러오지 못했어요. 아래 버튼으로 다시 시도해 주세요.';el('open').textContent='다시 불러오기';el('open').disabled=false;el('open').onclick=()=>location.reload()});
})();
</script>
