<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Kidscade 생활 월드</title>
<style>
:root{
  --ink:#4e443b; --paper:#f8f3e6; --panel:#fffaf0; --shadow:#c4b59b;
  --green:#a8d98d; --green2:#6bb06c; --soil:#ad7b53; --water:#83cbe3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#181816;color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:#edf3e2}
.topbar{padding:8px 10px;background:#f8f5ea;border-bottom:2px solid rgba(78,68,59,.55);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5;box-shadow:0 6px 18px rgba(78,68,59,.08)}
.brand{font-weight:900;font-size:18px;letter-spacing:-.4px;margin-right:auto}
.stat{background:#fffdf8;border:2px solid rgba(78,68,59,.6);border-radius:12px;padding:6px 9px;font-weight:800;box-shadow:0 4px 10px rgba(78,68,59,.12)}
.stat.energy.low{background:#ffd6c9}
.iconBtn,.navBtn,.actionBtn,.recipeBtn{border:2px solid rgba(78,68,59,.58);background:#fffdf8;border-radius:13px;box-shadow:0 4px 10px rgba(78,68,59,.12);cursor:pointer;font-weight:900}
.iconBtn:hover,.navBtn:hover,.actionBtn:hover,.recipeBtn:hover{transform:translateY(-1px)}
.iconBtn:active,.navBtn:active,.actionBtn:active,.recipeBtn:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(78,68,59,.12)}
.iconBtn{padding:6px 10px}
#worldWrap{position:relative;min-height:0;overflow:hidden}
#world{width:100%;height:100%;display:block;touch-action:none;background:#b9d690;image-rendering:auto}
.sceneTitle{position:absolute;left:12px;top:12px;padding:8px 12px;background:#fffdf8dd;border:2px solid rgba(78,68,59,.55);border-radius:14px;font-weight:950;box-shadow:0 4px 10px rgba(78,68,59,.12);pointer-events:none}
.navbar{padding:8px;background:#f8f5ea;border-top:2px solid rgba(78,68,59,.55);display:grid;grid-template-columns:repeat(5,1fr);gap:7px;z-index:6}
.navBtn{padding:9px 4px;font-size:14px;background:#fff8e8}.navBtn.active{background:#dff1cc}
.controlsBar{grid-template-columns:repeat(3,minmax(0,1fr));font-size:13px;font-weight:800;text-align:center;align-items:center}
.controlsBar>div{background:#fff8e8;border:2px solid var(--ink);border-radius:12px;padding:8px 6px;box-shadow:2px 2px 0 #8e806b}
#zoomStat{min-width:88px;text-align:center}#avatarStatus{font-size:11px;padding:5px 8px;min-width:90px;text-align:center}
.interactPrompt{position:absolute;right:12px;bottom:12px;background:#fff8eadd;border:2px solid var(--ink);border-radius:14px;padding:8px 11px;font-weight:900;box-shadow:3px 3px 0 #756b58;opacity:0;transform:translateY(8px);transition:.14s;pointer-events:none}
.interactPrompt.show{opacity:1;transform:translateY(0)}
#impactFlash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:8;mix-blend-mode:screen}
.fade{position:absolute;inset:0;background:#171711;opacity:0;pointer-events:none;transition:opacity .16s;z-index:9}.fade.show{opacity:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.modal.show{display:flex}
.panel{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#f8f0d9;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 #13120f;padding:16px}
.panel h2{margin:0 0 10px;font-size:24px}.panel h3{margin:14px 0 8px}.closeRow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.closeBtn{border:2px solid var(--ink);background:#ffd9d2;border-radius:11px;padding:6px 10px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.card{border:2px solid var(--ink);background:#fffaf0;border-radius:15px;padding:10px;box-shadow:2px 2px 0 #9b8d75}.card b{display:block;margin-bottom:4px}
.actionBtn{padding:9px 11px;background:#fff8e8;margin:4px 3px}.actionBtn.good{background:#d9f3c5}.actionBtn.warn{background:#ffe2b5}.actionBtn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:3px 7px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:12px}
.progress{height:20px;border:2px solid var(--ink);border-radius:999px;background:#e6d9bd;overflow:hidden}.progress>div{height:100%;width:0;background:#8fcf78;transition:width .2s}
.log{margin-top:9px;min-height:44px;background:#302e28;color:#fff6dc;border-radius:12px;padding:9px;font-size:13px}.invItem{display:flex;align-items:center;justify-content:space-between;gap:6px}.small{font-size:12px;color:#625c52}.section{padding-top:8px;border-top:2px dashed #988a72;margin-top:10px}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;background:#2d2b27;color:white;border:2px solid #111;border-radius:13px;padding:9px 13px;z-index:50;font-weight:850;transition:.22s;pointer-events:none;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kitchenStage{min-height:290px;background:#ecd8b5;border:3px solid var(--ink);border-radius:18px;position:relative;overflow:hidden;padding:12px}
.cuttingBoard{margin:18px auto;width:min(350px,88%);height:120px;background:#c89055;border:3px solid var(--ink);border-radius:30% 22% 28% 20%;position:relative;box-shadow:inset -8px -8px 0 #a86f3a}.chopTarget{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:60px;user-select:none}
.pot{width:160px;height:95px;border:4px solid var(--ink);border-radius:16px 16px 38px 38px;background:#aaa;margin:20px auto 8px;position:relative}.pot:before,.pot:after{content:"";position:absolute;top:22px;width:48px;height:16px;border:4px solid var(--ink);background:#777}.pot:before{left:-44px;border-radius:18px 0 0 18px}.pot:after{right:-44px;border-radius:0 18px 18px 0}
.thermo{height:26px;background:linear-gradient(90deg,#7cc7ff 0 35%,#ffd85f 35% 65%,#ff6b52 65%);border:3px solid var(--ink);border-radius:999px;position:relative}.needle{position:absolute;top:-8px;width:6px;height:38px;background:#222;border-radius:3px;left:0;transition:left .15s}
.recipeBtn{padding:9px;background:#fffdf7;text-align:left;width:100%}.recipeBtn.selected{background:#dff3ca}.slotRow{display:flex;gap:7px;flex-wrap:wrap}.slot{min-width:78px;padding:9px;border:2px dashed #332f29;border-radius:12px;background:#fff7e7;text-align:center;font-weight:800}
.furnitureArea{height:280px;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(#efe2c2 0 42%,#d7bc92 42% 44%,#c89e69 44% 100%);position:relative;overflow:hidden}.furnitureArea:before{content:"";position:absolute;left:0;right:0;top:42%;height:2px;background:#7d6746;opacity:.5}.furnitureObj{position:absolute;cursor:grab;user-select:none;touch-action:none;transform-origin:center center}.furnitureObj:active{cursor:grabbing}
.furnLabel{margin-top:8px;font-size:12px;font-weight:800;text-align:center}.furnPalette{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.furnBtn{border:2px solid var(--ink);border-radius:14px;background:#fffaf0;padding:8px;box-shadow:2px 2px 0 #9b8d75;cursor:pointer}.furnBtn:hover{transform:translateY(-1px)}.furnPreview{height:88px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f1e5cc;border:2px dashed #8e7b60;margin-bottom:6px}.furnSprite{position:relative;display:inline-block}.furnSprite.small{transform:scale(.82)}
.furnSprite.bed{width:92px;height:56px}.furnSprite.bed .frame{position:absolute;inset:9px 8px 3px 8px;border:3px solid #24211e;background:#b35f59;border-radius:10px}.furnSprite.bed .pillow{position:absolute;left:16px;top:14px;width:24px;height:16px;background:#f3ead4;border:3px solid #24211e;border-radius:7px}.furnSprite.bed .blanket{position:absolute;left:38px;top:14px;width:34px;height:26px;background:#d78a72;border:3px solid #24211e;border-radius:7px}.furnSprite.bed .leg{position:absolute;bottom:0;width:6px;height:10px;background:#6f4a31;border:2px solid #24211e;border-top:none}.furnSprite.bed .l1{left:13px}.furnSprite.bed .l2{right:13px}
.furnSprite.crate{width:56px;height:48px}.furnSprite.crate .box{position:absolute;inset:4px;border:3px solid #24211e;background:#9c6b42;border-radius:7px}.furnSprite.crate .slat{position:absolute;left:10px;right:10px;height:3px;background:#d2a46b;border-radius:4px}.furnSprite.crate .s1{top:16px}.furnSprite.crate .s2{top:28px}
.furnSprite.chair{width:54px;height:70px}.furnSprite.chair .seat{position:absolute;left:10px;top:28px;width:34px;height:14px;background:#a16d44;border:3px solid #24211e;border-radius:6px}.furnSprite.chair .back{position:absolute;left:13px;top:10px;width:28px;height:23px;background:#b78658;border:3px solid #24211e;border-radius:6px}.furnSprite.chair .leg{position:absolute;width:5px;height:23px;background:#6b472e;border:2px solid #24211e;border-top:none;bottom:2px}.furnSprite.chair .l1{left:14px}.furnSprite.chair .l2{right:14px}
.furnSprite.table{width:76px;height:62px}.furnSprite.table .top{position:absolute;left:8px;right:8px;top:18px;height:18px;background:#a97346;border:3px solid #24211e;border-radius:7px}.furnSprite.table .leg{position:absolute;width:6px;height:25px;background:#6b472e;border:2px solid #24211e;border-top:none;bottom:1px}.furnSprite.table .l1{left:16px}.furnSprite.table .l2{right:16px}
.furnSprite.plant{width:58px;height:68px}.furnSprite.plant .pot{position:absolute;left:14px;top:36px;width:30px;height:20px;background:#c67a49;border:3px solid #24211e;border-radius:0 0 9px 9px}.furnSprite.plant .soil{position:absolute;left:17px;top:34px;width:24px;height:6px;background:#6a4a34;border:2px solid #24211e;border-radius:6px}.furnSprite.plant .leaf1,.furnSprite.plant .leaf2,.furnSprite.plant .leaf3{position:absolute;background:#75a95e;border:3px solid #24211e;border-radius:18px 18px 18px 0;transform-origin:bottom center}.furnSprite.plant .leaf1{left:11px;top:7px;width:18px;height:28px;transform:rotate(-30deg)}.furnSprite.plant .leaf2{left:22px;top:0;width:18px;height:34px;transform:rotate(3deg)}.furnSprite.plant .leaf3{left:31px;top:10px;width:18px;height:26px;transform:rotate(34deg)}
.furnSprite.wardrobe{width:68px;height:84px}.furnSprite.wardrobe .body{position:absolute;inset:5px;border:3px solid #24211e;background:#7a583f;border-radius:10px}.furnSprite.wardrobe .split{position:absolute;top:10px;bottom:10px;left:50%;width:3px;background:#24211e;transform:translateX(-50%)}.furnSprite.wardrobe .knob1,.furnSprite.wardrobe .knob2{position:absolute;top:40px;width:7px;height:7px;border-radius:50%;background:#d7b45c;border:2px solid #24211e}.furnSprite.wardrobe .knob1{left:25px}.furnSprite.wardrobe .knob2{right:25px}
.kitchenTopbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 12px}.kitchenSteps{display:flex;gap:8px;flex-wrap:wrap}.kStep{padding:5px 9px;border:2px solid var(--ink);border-radius:999px;background:#fff8e8;font-weight:800;font-size:12px}.kStep.active{background:#dff0c7}.counterBack{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(#d1b38d,#c59d68);border-top:3px solid #24211e}.shelf{position:absolute;left:14px;right:14px;top:18px;height:10px;background:#ad7a48;border:3px solid #24211e;border-radius:6px}.jar{position:absolute;top:0;width:30px;height:42px;background:#f6e4c6;border:3px solid #24211e;border-radius:8px 8px 10px 10px}.jar:before{content:"";position:absolute;left:5px;right:5px;top:-8px;height:10px;border:3px solid #24211e;background:#c07d5d;border-radius:7px}.chopPiece{position:absolute;width:18px;height:12px;border:3px solid #24211e;border-radius:6px;background:#e2b365}.chopPiece.carrot{background:#ef8b31}.chopPiece.potato{background:#b88b55}.chopPiece.cabbage{background:#8ec070}
.boilFx{position:absolute;left:50%;top:114px;transform:translateX(-50%);width:190px;height:90px;pointer-events:none}.bubble{position:absolute;bottom:10px;width:12px;height:12px;border:3px solid #24211e;border-radius:50%;background:#d6f4ff;opacity:.8;animation:bubUp 1.2s linear infinite}.bubble:nth-child(2){left:36px;animation-delay:.25s}.bubble:nth-child(3){left:82px;animation-delay:.6s}.bubble:nth-child(4){left:126px;animation-delay:.12s}.bubble:nth-child(5){left:152px;animation-delay:.78s}@keyframes bubUp{0%{transform:translateY(0) scale(.7);opacity:0}30%{opacity:.9}100%{transform:translateY(-45px) scale(1.15);opacity:0}}.steam{position:absolute;bottom:60px;width:18px;height:40px;border-radius:50%;background:linear-gradient(#fff9,#fff0);filter:blur(1px);animation:steamRise 1.8s ease-in infinite}.steam.s2{left:58px;animation-delay:.4s}.steam.s3{left:106px;animation-delay:.9s}@keyframes steamRise{0%{transform:translateY(12px) scale(.6);opacity:0}35%{opacity:.55}100%{transform:translateY(-20px) scale(1);opacity:0}}
.plateScene{position:relative;height:230px}.plate{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:170px;height:74px;border:4px solid #24211e;background:#f6f0e1;border-radius:50%}.soup{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:110px;height:44px;border:3px solid #24211e;background:#e7c37d;border-radius:50%}
.wardrobeCanvasWrap{height:245px;border:3px solid var(--ink);border-radius:18px;background:#d7e9d1;padding:8px}#wardrobeCanvas{width:100%;height:100%;display:block;border-radius:12px;background:#cfe2c8}.craftGroupTitle{margin:12px 0 8px;padding:7px 11px;border:2px solid var(--ink);border-radius:12px;background:#fff5dd;font-weight:900}.resourceRow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.resourceChip{padding:5px 9px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:12px}
@media(max-width:700px){.brand{width:100%;margin-bottom:2px}.controlsBar{grid-template-columns:1fr 1fr 1fr;font-size:11px}.stat{font-size:12px;padding:5px 7px}.navbar{gap:4px}.navBtn{font-size:12px;padding:8px 2px}.panel{padding:12px}.panel h2{font-size:20px}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">🌿 Kidscade 생활 월드 <span class="small">Kidscade 통합 v1</span></div>
    <div class="stat">🌞 <span id="dayText">1일차</span></div>
    <div class="stat energy" id="energyBox">⚡ <span id="energyText">100</span>/100</div>
    <div class="stat">🌱 <span id="seedText">120</span></div>
    <div class="stat">물 <span id="waterText">6</span>/<span id="waterMaxText">6</span></div>
    <div class="stat" id="avatarStatus">Kidscade 연결 확인 중</div>
    <button class="iconBtn" onclick="openInventory()">🎒 가방</button>
    <button class="iconBtn" onclick="requestCloseLifeWorld()">✕ 닫기</button>
    <button class="iconBtn" onclick="setZoom(camera.targetZoom-0.1)">－</button>
    <div class="stat" id="zoomStat">🔍 <span id="zoomText">100%</span></div>
    <button class="iconBtn" onclick="setZoom(camera.targetZoom+0.1)">＋</button>
  </div>
  <div id="worldWrap">
    <canvas id="world"></canvas>
    <div class="sceneTitle" id="sceneTitle">🏠 집</div>
    <div class="interactPrompt" id="interactPrompt">E 상호작용</div>
    <div id="impactFlash"></div>
    <div class="fade" id="fade"></div>
  </div>
  <div class="navbar controlsBar">
    <div><b>이동</b> WASD / 방향키</div>
    <div><b>상호작용</b> E / Space</div>
    <div id="routeText"><b>현재 길</b> 집 → 농장</div>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="panel" id="panel"></div></div>
<script src="pet-art.js?v=pet-art-v1"></script>
<script src="life-world-core-1.js?v=life-world-v1"></script>
<script src="life-world-core-2.js?v=life-world-v1"></script>
<script src="life-world-core-3.js?v=life-world-v1"></script>
<script src="life-world-core-4.js?v=life-world-v1"></script>
<script src="life-world-core-5.js?v=life-world-v1"></script>
<script src="life-world-core-6.js?v=life-world-v1"></script>
<script src="life-world-core-7.js?v=life-world-v1"></script>
</body>
</html>
