<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한 입만 더 (Mosquito Simulator)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="ui-layer">
            <div id="start-screen" class="overlay">
                <h1 id="start-title">한 입만 더</h1>
                <p id="start-desc">소리가 포함되어 있습니다. 이어폰/헤드폰을 권장합니다.</p>
                <button id="start-btn">게임 시작</button>
            </div>

            <div class="top-bar">
                <div class="stat-container">
                    <div class="stat-label">BLOOD</div>
                    <div class="progress-bg">
                        <div id="blood-fill" class="progress-fill blood"></div>
                    </div>
                    <div id="blood-text" class="stat-value">0%</div>
                </div>
                
                <div class="stat-container">
                    <div class="stat-label">THREAT</div>
                    <div class="progress-bg">
                        <div id="threat-fill" class="progress-fill threat"></div>
                    </div>
                    <div id="threat-text" class="stat-value">0%</div>
                </div>
            </div>
            
            <div id="instruction-text">마우스 드래그로 이동, 클릭 유지로 흡혈</div>
            
            <div id="game-over-screen" class="overlay hidden">
                <h1 id="end-title">GAME OVER</h1>
                <p id="end-desc">찰싹! 모기가 잡혔습니다.</p>
                <button id="restart-btn">다시 시작 (F5)</button>
            </div>
            
            <div id="stage-clear-screen" class="overlay hidden">
                <h1 id="clear-title">STAGE CLEAR</h1>
                <p id="end-desc">충분한 피를 모았습니다! 배부른 모기가 되었습니다.</p>
                <button id="next-stage-btn" onclick="location.reload()">다음 밤으로 (F5)</button>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
