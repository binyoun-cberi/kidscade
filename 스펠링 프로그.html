<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스펠링 프로그 DX 🐸 - 영어 단어 점프 어드벤처</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root {
        --pond:#082f49;
        --pond2:#0f766e;
        --lime:#7dd3fc;
        --panel:rgba(15, 23, 42, .76);
        --stroke:rgba(255,255,255,.16);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 20% 12%, rgba(74,222,128,.22), transparent 30%),
            radial-gradient(circle at 85% 8%, rgba(56,189,248,.18), transparent 28%),
            linear-gradient(180deg, #052e2b 0%, #0f172a 60%, #020617 100%);
        touch-action: none;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Noto Sans KR', sans-serif;
        color: white;
    }
    #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 620px;
        margin: 0 auto;
        background: linear-gradient(180deg, #064e3b 0%, #0f172a 100%);
        box-shadow: 0 0 42px rgba(14,165,233,.25), 0 0 0 1px rgba(255,255,255,.08);
        overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-layer { position: absolute; inset: 0; pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .glass {
        background: var(--panel);
        border: 1px solid var(--stroke);
        box-shadow: 0 10px 30px rgba(0,0,0,.23), inset 0 1px 0 rgba(255,255,255,.1);
        backdrop-filter: blur(12px);
    }
    .text-glow { text-shadow: 0 0 10px rgba(134,239,172,.85), 0 0 24px rgba(56,189,248,.55); }
    .word-done { color: #facc15; text-shadow: 0 0 12px rgba(250,204,21,.75); display:inline-block; transform: translateY(-1px); }
    .word-active { color: #86efac; text-shadow: 0 0 16px rgba(74,222,128,.95); display:inline-block; animation: activeLetter .7s ease-in-out infinite alternate; }
    .word-pending { color: #94a3b8; display:inline-block; }
    .bar-fill { transform-origin:left center; transition: width .18s linear; }
    .pop { animation: pop .28s cubic-bezier(.18,1.7,.42,1); }
    .shake { animation: shake .28s linear; }
    .reward-pop { animation: rewardPop .75s ease-out; }
    .screen-flash { animation: flash .45s ease-out; }
    .bad-flash { animation: badFlash .42s ease-out; }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    .shimmer {
        position: relative;
        overflow: hidden;
    }
    .shimmer::after {
        content: "";
        position: absolute;
        top: -60%;
        left: -40%;
        width: 35%;
        height: 220%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent);
        transform: rotate(25deg);
        animation: shimmer 2.5s ease-in-out infinite;
    }
    .dpad button {
        pointer-events: auto;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: rgba(15,23,42,.74);
        border: 1px solid rgba(255,255,255,.22);
        box-shadow: 0 7px 0 rgba(0,0,0,.22), 0 0 20px rgba(56,189,248,.18);
        font-size: 24px;
        font-weight: 900;
        transition: transform .08s, filter .08s;
    }
    .dpad button:active { transform: translateY(6px) scale(.97); filter: brightness(1.2); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
    @keyframes activeLetter { from { transform: scale(1); } to { transform: scale(1.16) rotate(-2deg); } }
    @keyframes pop { 0% { transform: scale(.88); } 100% { transform: scale(1); } }
    @keyframes rewardPop { 0% { transform: scale(.7) rotate(-4deg); opacity:0; } 25% { opacity:1; } 70% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1); opacity:1; } }
    @keyframes flash { from { background: rgba(250,204,21,.55); } to { background: transparent; } }
    @keyframes badFlash { from { background: rgba(248,113,113,.52); } to { background: transparent; } }
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-7px); }
        40% { transform: translateX(7px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes shimmer { 0% { left: -60%; } 58%,100% { left: 130%; } }
    @media (min-width: 768px) {
        .dpad { opacity:.52; }
        .dpad:hover { opacity:1; }
    }
</style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="600" height="800"></canvas>
    <div id="flash-overlay" class="ui-layer"></div>

    <div class="ui-layer flex flex-col justify-between p-3 md:p-4">
        <div class="flex gap-3 items-start justify-between">
            <div id="word-card" class="glass rounded-3xl p-3 min-w-[240px] max-w-[62%] transition-transform">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-[11px] font-black text-sky-200 tracking-wider">SPELLING QUEST</span>
                    <span class="text-[11px] px-2 py-1 rounded-full bg-emerald-400/20 border border-emerald-300/30 text-emerald-200">
                        x<span id="ui-multiplier">1.0</span>
                    </span>
                </div>
                <div id="ui-meaning" class="text-lg md:text-xl text-emerald-200 font-black leading-tight truncate">뜻</div>
                <div class="flex items-end gap-2 mt-1">
                    <div id="ui-word" class="text-3xl md:text-4xl font-black tracking-[.18em] leading-none"></div>
                    <div id="ui-target-letter" class="text-sm font-black text-yellow-300 mb-1"></div>
                </div>
                <div class="mt-3 h-3 rounded-full bg-slate-950/70 border border-white/10 overflow-hidden">
                    <div id="ui-timer-fill" class="bar-fill h-full rounded-full bg-gradient-to-r from-emerald-400 via-sky-300 to-yellow-300" style="width:100%"></div>
                </div>
                <div class="mt-1 text-[11px] text-slate-300 flex justify-between">
                    <span>단어 제한시간</span><span id="ui-timer-text">0초</span>
                </div>
            </div>

            <div class="flex flex-col items-end gap-2">
                <div class="glass rounded-2xl px-3 py-2 text-right min-w-[150px]">
                    <div class="text-[11px] text-slate-300 font-black">SCORE</div>
                    <div id="ui-score" class="text-2xl font-black text-yellow-300 leading-none">0</div>
                    <div class="text-[11px] text-purple-200 mt-1">BEST <span id="ui-highscore">0</span></div>
                </div>
                <div class="glass rounded-full px-3 py-2 flex items-center gap-2">
                    <span class="text-[11px] font-black text-rose-100">LIFE</span>
                    <span id="ui-lives" class="text-xl">❤️❤️❤️</span>
                </div>
                <button id="btn-hint" class="pointer-events-auto glass rounded-full px-4 py-2 text-sm font-black text-cyan-200 active:scale-95 transition">
                    힌트 <span id="ui-hints">3</span>
                </button>
            </div>
        </div>

        <div class="flex justify-between items-end gap-3">
            <div id="combo-toast" class="glass rounded-2xl px-4 py-3 opacity-0 transition-opacity max-w-[260px]">
                <div class="text-xs text-slate-300 font-black">현재 콤보</div>
                <div id="ui-combo" class="text-2xl font-black text-emerald-300">1 WORD</div>
            </div>
            <div class="dpad grid grid-cols-3 grid-rows-3 gap-2 pointer-events-none select-none">
                <div></div><button data-move="0,-1">▲</button><div></div>
                <button data-move="-1,0">◀</button><button data-move="0,0" id="btn-pause">Ⅱ</button><button data-move="1,0">▶</button>
                <div></div><button data-move="0,1">▼</button><div></div>
            </div>
        </div>
    </div>

    <div id="overlay" class="ui-layer pointer-events-auto flex items-center justify-center bg-black/72 backdrop-blur-md transition-opacity duration-300">
        <div id="overlay-card" class="glass rounded-[2rem] border-2 border-emerald-300/60 shadow-[0_0_44px_rgba(74,222,128,.35)] max-w-[92%] w-[520px] p-7 md:p-8 text-center reward-pop">
            <div class="text-7xl mb-2 floaty">🐸</div>
            <h1 id="overlay-title" class="text-4xl md:text-5xl font-black text-white text-glow mb-2">스펠링 프로그 DX</h1>
            <p id="overlay-subtitle" class="text-emerald-200 font-black mb-5">단어를 완성하며 강을 건너는 영어 점프 게임</p>
            <div id="overlay-msg" class="text-slate-100 text-sm md:text-base leading-relaxed space-y-2 mb-6">
                <p>한국어 뜻을 보고, <b class="text-yellow-300">현재 알파벳</b>이 적힌 통나무로 점프하세요.</p>
                <p><b class="text-emerald-300">정답 줄 보장</b>으로 막히는 상황을 줄이고, 콤보가 오를수록 강물이 빨라집니다.</p>
                <p class="bg-sky-500/15 border border-sky-200/20 rounded-2xl p-3">새 기능: 제한시간 · 힌트 · 콤보 배율 · 움직이는 이펙트 · 더 선명한 정답 피드백</p>
            </div>
            <div id="difficulty-panel" class="grid grid-cols-3 gap-2 mb-5">
                <button data-difficulty="easy" class="difficulty-btn shimmer rounded-2xl py-3 bg-emerald-500/25 border border-emerald-300/30 font-black text-emerald-100 active:scale-95">연습</button>
                <button data-difficulty="normal" class="difficulty-btn shimmer rounded-2xl py-3 bg-sky-500/30 border-2 border-sky-200/60 font-black text-white active:scale-95">기본</button>
                <button data-difficulty="hard" class="difficulty-btn shimmer rounded-2xl py-3 bg-rose-500/25 border border-rose-300/30 font-black text-rose-100 active:scale-95">도전</button>
            </div>
            <button id="btn-start" class="shimmer bg-gradient-to-b from-lime-300 to-emerald-500 hover:from-lime-200 hover:to-emerald-400 text-slate-950 font-black text-2xl py-4 px-10 rounded-full shadow-lg transform transition active:scale-95 border-b-4 border-emerald-800">
                GAME START
            </button>
        </div>
    </div>
</div>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const Sound = {
    tone(freq, type, duration, volume = .08, slideFreq = null, delay = 0) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const start = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        if (slideFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideFreq), start + duration);
        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration);
    },
    jump() { this.tone(290, 'sine', .16, .08, 620); },
    correct() { this.tone(620, 'triangle', .08, .08); this.tone(850, 'triangle', .14, .07, null, .08); },
    wrong() { this.tone(170, 'sawtooth', .26, .1, 85); },
    splash() { this.tone(120, 'square', .35, .09, 55); },
    bonus() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 'square', .09, .055, null, i * .065)); },
    tick() { this.tone(880, 'sine', .04, .025); },
    over() { this.tone(220, 'sawtooth', .65, .12, 60); }
};

let bgmTimer = null;
function startBGM() {
    if (bgmTimer) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const seq = [0, 4, 7, 12, 7, 4, 9, 7, 5, 9, 12, 16, 12, 9, 7, 4];
    let idx = 0;
    let nextTime = audioCtx.currentTime + .08;
    function schedule() {
        const now = audioCtx.currentTime;
        while (nextTime < now + .12) {
            if (idx % 4 === 0) {
                Sound.tone(72, 'square', .08, .025, 28, nextTime - now);
            }
            if (idx % 2 === 0) {
                const freq = 261.63 * Math.pow(2, seq[idx % seq.length] / 12);
                Sound.tone(freq, 'triangle', .12, .018, null, Math.max(0, nextTime - now));
            }
            nextTime += .18;
            idx++;
        }
        bgmTimer = requestAnimationFrame(schedule);
    }
    schedule();
}
function stopBGM() {
    if (bgmTimer) cancelAnimationFrame(bgmTimer);
    bgmTimer = null;
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
if (!ctx.roundRect) {
    ctx.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        return this;
    };
}

const TILE = 80;
const COLS = 7;
const BOARD_X = (W - COLS * TILE) / 2;
const CHECKPOINT_GAP = 7;
const HIGH_KEY = 'spellingFrogDXHighScore';

let state = 'START';
let stageCombo = 1;
let score = 0;
let highScore = Number(localStorage.getItem(HIGH_KEY) || 0);
let lives = 3;
let hints = 3;
let wrongGrace = 0;
let currentWord = '';
let currentMeaning = '';
let targetLetterIndex = 0;
let wordTime = 20;
let wordTimeMax = 20;
let lastFrame = performance.now();

let frog = {};
let lastSafe = { row: 0, col: Math.floor(COLS / 2) };
let rowData = {};
let maxGeneratedRow = 5;
let camera = { y: 0 };
let particles = [];
let floatingTexts = [];
let rings = [];
let waterOffset = 0;
let shakePower = 0;
let hintTarget = null;

function targetChar() {
    return currentWord[targetLetterIndex] || currentWord[0] || 'A';
}

function pickWord(startChar) {
    const list = dictionary[startChar] || dictionary[startChar?.toUpperCase?.()] || dictionary.A;
    let selected = list[Math.floor(Math.random() * list.length)];
    if (currentWord && list.length > 1) {
        let guard = 0;
        while (selected.w === currentWord && guard++ < 12) {
            selected = list[Math.floor(Math.random() * list.length)];
        }
    }
    currentWord = selected.w;
    currentMeaning = selected.m;
    targetLetterIndex = 0;
    resetWordTimer();
}

function resetWordTimer() {
    const diff = DIFFICULTY[selectedDifficulty];
    const base = 10 + Math.min(10, currentWord.length * 2.2);
    const comboPenalty = Math.min(5.5, Math.floor(stageCombo / 4) * .8);
    wordTimeMax = Math.max(7, (base - comboPenalty) * diff.timer);
    wordTime = wordTimeMax;
}

function initGame(fullReset = true) {
    const diff = DIFFICULTY[selectedDifficulty];
    if (fullReset) {
        stageCombo = 1;
        score = 0;
        lives = diff.lives;
        hints = diff.hints;
        wrongGrace = diff.wrongGrace;
        pickWord('A');
    }
    rowData = {};
    maxGeneratedRow = 5;
    lastSafe = { row: 0, col: Math.floor(COLS / 2) };
    resetFrogTo(lastSafe.row, lastSafe.col);
    ensureRowsGenerated(frog.row - 22);
    updateUI();
    hideOverlay();
    state = 'PLAYING';
    showToast(`${DIFFICULTY[selectedDifficulty].name} 모드 시작!`, '#86efac');
}

function resetFrogTo(row, col) {
    frog = {
        row, col,
        x: BOARD_X + col * TILE + TILE * .15,
        y: row * TILE + TILE * .13,
        targetX: BOARD_X + col * TILE + TILE * .15,
        targetY: row * TILE + TILE * .13,
        w: TILE * .72,
        h: TILE * .72,
        riding: null,
        isDead: false,
        hop: 0,
        face: 'up',
        invincible: .55
    };
    camera.y = frog.y - H * .68;
}

function isGrassRow(r) {
    return Math.abs(r) % CHECKPOINT_GAP === 0;
}

function ensureRowsGenerated(targetRow) {
    while (maxGeneratedRow > targetRow) {
        const r = maxGeneratedRow;
        rowData[r] = isGrassRow(r)
            ? { type: 'grass', row: r, checkpoint: true, spark: Math.random() * 100 }
            : { type: 'water', row: r, platforms: generatePlatformsForRow(r), targetFor: null };
        maxGeneratedRow--;
    }
}

function laneDifficulty(row) {
    const forward = Math.max(0, Math.abs(row));
    return 1 + Math.min(1.85, forward * .025 + stageCombo * .035);
}

function generatePlatformsForRow(r) {
    const diff = DIFFICULTY[selectedDifficulty];
    const dir = Math.random() > .5 ? 1 : -1;
    const lane = laneDifficulty(r);
    const base = (1.05 + Math.random() * 1.15) * lane * diff.speed;
    const speed = base * dir;
    const count = 3 + Math.floor(Math.random() * 2);
    const wrapLength = W + TILE * 5;
    const gap = wrapLength / count;
    const platforms = [];
    for (let i = 0; i < count; i++) {
        const widthUnit = Math.random() < .18 ? 1.75 : (.92 + Math.random() * .62);
        const w = TILE * widthUnit;
        const x = -TILE * 2 + i * gap + Math.random() * Math.max(16, gap - w);
        platforms.push(createPlatform(x, r * TILE, w, speed, r, wrapLength));
    }
    return platforms;
}

function createPlatform(x, y, w, speed, row, wrapLength) {
    const dangerChance = Math.min(.26, .08 + Math.abs(row) * .004 + stageCombo * .005);
    const isCroc = Math.random() < dangerChance;
    const bonus = Math.random() < .13 ? 'fly' : null;
    return {
        x, y, w, h: TILE * .8,
        baseSpeed: speed,
        row, wrapLength,
        kind: isCroc ? 'croc' : 'log',
        letter: randomLetter(),
        active: true,
        used: false,
        bonus,
        blink: Math.random() * 100,
        targetGlowUntil: 0
    };
}

function randomLetter(except = '') {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let ch = abc[Math.floor(Math.random() * abc.length)];
    if (except && abc.length > 1) {
        let guard = 0;
        while (ch === except && guard++ < 10) ch = abc[Math.floor(Math.random() * abc.length)];
    }
    return ch;
}

function prepareRowForTarget(row, char = targetChar()) {
    const rowObj = rowData[row];
    if (!rowObj || rowObj.type !== 'water') return;
    if (rowObj.targetFor === char) return;

    const activePlatforms = rowObj.platforms.filter(p => !p.used);
    if (!activePlatforms.length) return;

    for (const p of rowObj.platforms) {
        if (Math.random() < .75) {
            p.letter = randomLetter(char);
            p.active = true;
        }
    }

    const target = activePlatforms[Math.floor(Math.random() * activePlatforms.length)];
    target.letter = char;
    target.active = true;
    target.kind = target.kind === 'croc' && Math.random() < .65 ? 'log' : target.kind;
    target.w = Math.max(target.w, TILE * 1.05);
    target.targetGlowUntil = performance.now() + 1100;
    rowObj.targetFor = char;

    if (Math.random() < DIFFICULTY[selectedDifficulty].targetChance) {
        const second = activePlatforms.find(p => p !== target);
        if (second) {
            second.letter = char;
            second.active = true;
            second.targetGlowUntil = performance.now() + 800;
        }
    }
}

function refreshAheadForNewTarget() {
    hintTarget = null;
    const start = frog.row - 1;
    for (let r = start; r >= start - 18; r--) {
        ensureRowsGenerated(r);
        if (rowData[r] && rowData[r].type === 'water') {
            rowData[r].targetFor = null;
            prepareRowForTarget(r, targetChar());
        }
    }
}

function moveFrog(dx, dy) {
    if (state !== 'PLAYING' || frog.isDead) return;
    if (dx === 0 && dy === 0) {
        togglePause();
        return;
    }
    const oldRow = frog.row;
    const oldCol = frog.col;
    const newCol = Math.max(0, Math.min(COLS - 1, frog.col + dx));
    let lowestVisibleRow = Math.ceil((camera.y + H) / TILE);
    let newRow = Math.min(frog.row + dy, lowestVisibleRow - 1);
    if (newRow > lastSafe.row + 3) newRow = lastSafe.row + 3;

    ensureRowsGenerated(newRow - 22);
    if (dy < 0 && rowData[newRow]?.type === 'water') prepareRowForTarget(newRow, targetChar());

    frog.col = newCol;
    frog.row = newRow;
    frog.face = dy < 0 ? 'up' : (dy > 0 ? 'down' : (dx < 0 ? 'left' : 'right'));
    frog.targetX = BOARD_X + frog.col * TILE + TILE * .15;
    frog.targetY = frog.row * TILE + TILE * .13;
    frog.x = frog.targetX;
    frog.y = frog.targetY;
    frog.riding = null;
    frog.hop = 1;
    Sound.jump();
    rings.push({ x: frog.x + frog.w / 2, y: frog.y + frog.h / 2, r: 8, life: 1, color: '#7dd3fc' });
    checkLanding(oldRow, oldCol);
}

function checkLanding(oldRow, oldCol) {
    const rowObj = rowData[frog.row];
    if (!rowObj) return;
    if (rowObj.type === 'grass') {
        lastSafe = { row: frog.row, col: frog.col };
        score += Math.max(5, Math.floor(15 * multiplier()));
        showFloatingText('SAVE', frog.x + frog.w / 2, frog.y - 10, '#86efac');
        updateUI(true);
        return;
    }

    let landed = null;
    const center = frog.x + frog.w / 2;
    const margin = selectedDifficulty === 'easy' ? 34 : 26;
    for (const p of rowObj.platforms) {
        if (center > p.x - margin && center < p.x + p.w + margin) {
            landed = p;
            break;
        }
    }

    if (!landed) {
        Sound.splash();
        createParticles(frog.x + frog.w / 2, frog.y + frog.h / 2, '#60a5fa', 24);
        loseLife('물에 풍덩!', oldRow, oldCol);
        return;
    }

    frog.riding = landed;
    frog.x = landed.x + (landed.w - frog.w) / 2;
    frog.targetX = frog.x;
    frog.col = Math.max(0, Math.min(COLS - 1, Math.floor((frog.x - BOARD_X + TILE / 2) / TILE)));

    if (!landed.active || landed.used) return;

    if (landed.letter === targetChar()) {
        handleCorrect(landed);
    } else {
        handleWrong(landed, oldRow, oldCol);
    }
}

function multiplier() {
    return 1 + Math.min(2.5, (stageCombo - 1) * .08);
}

function handleCorrect(platform) {
    Sound.correct();
    platform.used = true;
    platform.active = false;
    platform.letter = '✓';
    platform.targetGlowUntil = performance.now() + 700;

    const base = 80 + Math.max(0, currentWord.length - 3) * 10;
    const gain = Math.floor(base * multiplier());
    score += gain;
    targetLetterIndex++;
    wordTime = Math.min(wordTimeMax, wordTime + 1.4);
    createParticles(frog.x + frog.w / 2, frog.y + frog.h / 2, '#4ade80', 28);
    showFloatingText(`+${gain}`, frog.x + frog.w / 2, frog.y - 20, '#bbf7d0');
    popElement('word-card');

    if (platform.bonus === 'fly') {
        platform.bonus = null;
        const bonus = Math.floor(120 * multiplier());
        score += bonus;
        wordTime = Math.min(wordTimeMax, wordTime + 2.5);
        createParticles(frog.x + frog.w / 2, frog.y + frog.h / 2, '#facc15', 22);
        showFloatingText(`파리 보너스 +${bonus}`, frog.x + frog.w / 2, frog.y - 50, '#fde68a');
    }

    if (targetLetterIndex >= currentWord.length) {
        handleWordSuccess();
    } else {
        refreshAheadForNewTarget();
    }
    updateUI(true);
}

function handleWrong(platform, oldRow, oldCol) {
    Sound.wrong();
    platform.targetGlowUntil = performance.now() + 800;
    showFloatingText(`${platform.letter} 아니에요!`, frog.x + frog.w / 2, frog.y - 22, '#fca5a5');
    if (wrongGrace > 0) {
        wrongGrace--;
        showFloatingText('보호막 사용', frog.x + frog.w / 2, frog.y - 54, '#93c5fd');
        bounceBack(oldRow, oldCol);
        shake(.8);
        updateUI();
    } else {
        loseLife('틀린 스펠링!', oldRow, oldCol);
    }
}

function handleWordSuccess() {
    Sound.bonus();
    const clearBonus = Math.floor((520 + currentWord.length * 45) * multiplier());
    score += clearBonus;
    stageCombo++;
    showToast(`WORD CLEAR! +${clearBonus}`, '#facc15');
    document.getElementById('flash-overlay').classList.remove('screen-flash');
    void document.getElementById('flash-overlay').offsetWidth;
    document.getElementById('flash-overlay').classList.add('screen-flash');

    const nextStart = currentWord.slice(-1);
    pickWord(nextStart);
    refreshAheadForNewTarget();

    // 단어를 완성하면 앞쪽 맵이 새 타깃에 맞춰 살아나서 끊기지 않음
    for (const r in rowData) {
        if (Number(r) <= frog.row && rowData[r].type === 'water') {
            rowData[r].targetFor = null;
            for (const p of rowData[r].platforms) {
                p.used = false;
                p.active = true;
            }
        }
    }
}

function loseLife(msg, oldRow = lastSafe.row, oldCol = lastSafe.col) {
    if (frog.invincible > 0 && msg !== '시간 초과!') return;
    lives--;
    frog.isDead = true;
    shake(1.2);
    document.getElementById('flash-overlay').classList.remove('bad-flash');
    void document.getElementById('flash-overlay').offsetWidth;
    document.getElementById('flash-overlay').classList.add('bad-flash');
    showFloatingText(msg, frog.x + frog.w / 2, frog.y - 18, '#f87171');
    updateUI();

    if (lives <= 0) {
        Sound.over();
        setTimeout(gameOver, 650);
    } else {
        setTimeout(() => {
            targetLetterIndex = 0;
            resetWordTimer();
            resetFrogTo(lastSafe.row, lastSafe.col);
            refreshAheadForNewTarget();
            updateUI();
        }, 760);
    }
}

function bounceBack(row, col) {
    frog.row = row;
    frog.col = col;
    frog.x = BOARD_X + col * TILE + TILE * .15;
    frog.y = row * TILE + TILE * .13;
    frog.targetX = frog.x;
    frog.targetY = frog.y;
    frog.riding = null;
}

function useHint() {
    if (state !== 'PLAYING') return;
    if (hints <= 0) {
        showToast('힌트를 모두 사용했어요', '#fca5a5');
        return;
    }
    hints--;
    const candidates = [];
    for (let r = frog.row - 1; r >= frog.row - 9; r--) {
        ensureRowsGenerated(r - 1);
        if (rowData[r]?.type === 'water') {
            prepareRowForTarget(r, targetChar());
            for (const p of rowData[r].platforms) {
                if (p.active && !p.used && p.letter === targetChar()) candidates.push(p);
            }
        }
    }
    hintTarget = candidates[0] || null;
    if (hintTarget) {
        hintTarget.targetGlowUntil = performance.now() + 3500;
        showToast(`다음 글자 ${targetChar()} 발판을 빛나게 표시!`, '#7dd3fc');
        Sound.tick();
    }
    updateUI();
}

function togglePause() {
    if (state === 'PLAYING') {
        state = 'PAUSED';
        showPauseOverlay();
    } else if (state === 'PAUSED') {
        hideOverlay();
        state = 'PLAYING';
        lastFrame = performance.now();
    }
}

function updateUI(animated = false) {
    document.getElementById('ui-score').innerText = score;
    document.getElementById('ui-highscore').innerText = highScore;
    document.getElementById('ui-lives').innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, DIFFICULTY[selectedDifficulty].lives - lives));
    document.getElementById('ui-hints').innerText = hints;
    document.getElementById('ui-combo').innerText = `${stageCombo} WORD`;
    document.getElementById('ui-multiplier').innerText = multiplier().toFixed(1);
    document.getElementById('ui-meaning').innerText = currentMeaning;
    document.getElementById('ui-target-letter').innerText = targetLetterIndex < currentWord.length ? `NEXT ${targetChar()}` : '';
    const timerPercent = Math.max(0, Math.min(100, wordTime / wordTimeMax * 100));
    document.getElementById('ui-timer-fill').style.width = `${timerPercent}%`;
    document.getElementById('ui-timer-text').innerText = `${Math.ceil(wordTime)}초`;

    let html = '';
    for (let i = 0; i < currentWord.length; i++) {
        if (i < targetLetterIndex) html += `<span class="word-done">${currentWord[i]}</span> `;
        else if (i === targetLetterIndex) html += `<span class="word-active">_</span> `;
        else html += `<span class="word-pending">_</span> `;
    }
    document.getElementById('ui-word').innerHTML = html;
    if (animated) popElement('word-card');

    const toast = document.getElementById('combo-toast');
    toast.style.opacity = stageCombo >= 2 ? '1' : '.0';
}

function popElement(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
}

function showToast(text, color = '#fff') {
    const toast = document.getElementById('combo-toast');
    toast.style.opacity = '1';
    toast.querySelector('#ui-combo').innerText = text;
    toast.querySelector('#ui-combo').style.color = color;
    popElement('combo-toast');
    setTimeout(() => {
        if (state === 'PLAYING') {
            toast.querySelector('#ui-combo').style.color = '';
            toast.querySelector('#ui-combo').innerText = `${stageCombo} WORD`;
        }
    }, 1200);
}

function showFloatingText(txt, x, y, color) {
    floatingTexts.push({ txt, x, y, color, life: 1, size: 28 });
}

function createParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - .5) * 10,
            vy: (Math.random() - .5) * 10,
            life: 1,
            color,
            size: 3 + Math.random() * 5
        });
    }
}

function shake(power = 1) {
    shakePower = Math.max(shakePower, power);
    const cont = document.getElementById('game-container');
    cont.classList.remove('shake');
    void cont.offsetWidth;
    cont.classList.add('shake');
}

function getRankInfo(s) {
    if (s >= 70000) return { name: '🏆 챌린저', color: 'text-blue-200' };
    if (s >= 45000) return { name: '🔴 그랜드마스터', color: 'text-red-300' };
    if (s >= 28000) return { name: '🟣 마스터', color: 'text-purple-300' };
    if (s >= 17000) return { name: '💎 다이아몬드', color: 'text-cyan-200' };
    if (s >= 10000) return { name: '💠 플래티넘', color: 'text-teal-200' };
    if (s >= 6000) return { name: '🥇 골드', color: 'text-yellow-300' };
    if (s >= 3000) return { name: '🥈 실버', color: 'text-slate-200' };
    if (s >= 1000) return { name: '🥉 브론즈', color: 'text-amber-500' };
    return { name: '🪨 아이언', color: 'text-slate-400' };
}

function gameOver() {
    state = 'GAMEOVER';
    stopBGM();
    const isNew = score > highScore;
    if (isNew) {
        highScore = score;
        localStorage.setItem(HIGH_KEY, String(highScore));
    }
    const rank = getRankInfo(score);
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('overlay-title');
    const subtitle = document.getElementById('overlay-subtitle');
    const msg = document.getElementById('overlay-msg');
    const panel = document.getElementById('difficulty-panel');

    title.innerText = isNew ? 'NEW RECORD!' : 'GAME OVER';
    title.className = `text-5xl font-black ${isNew ? 'text-yellow-300' : 'text-rose-400'} mb-2 text-glow`;
    subtitle.innerText = '다시 도전해서 더 긴 단어 사슬을 만들어 보세요.';
    panel.classList.remove('hidden');
    msg.innerHTML = `
        <div class="grid grid-cols-2 gap-3 text-left">
            <div class="bg-slate-950/60 rounded-2xl p-4 border border-white/10">
                <p class="text-xs text-slate-400 font-black">최종 점수</p>
                <p class="text-3xl font-black text-yellow-300">${score}</p>
            </div>
            <div class="bg-slate-950/60 rounded-2xl p-4 border border-white/10">
                <p class="text-xs text-slate-400 font-black">완성 단어</p>
                <p class="text-3xl font-black text-emerald-300">${Math.max(0, stageCombo - 1)}</p>
            </div>
        </div>
        <div class="mt-4 bg-slate-950/60 rounded-2xl p-4 border border-white/10">
            <p class="text-xs text-slate-400 font-black">나의 티어</p>
            <p class="text-3xl font-black ${rank.color}">${rank.name}</p>
        </div>
        ${isNew ? '<p class="mt-3 text-purple-200 font-black animate-pulse">🎉 최고 기록을 갱신했어요!</p>' : ''}
    `;
    document.getElementById('btn-start').innerText = '다시 도전하기 🔄';
    overlay.classList.remove('opacity-0', 'pointer-events-none');
    popElement('overlay-card');
}

function showPauseOverlay() {
    const overlay = document.getElementById('overlay');
    document.getElementById('overlay-title').innerText = 'PAUSE';
    document.getElementById('overlay-title').className = 'text-5xl font-black text-sky-200 mb-2 text-glow';
    document.getElementById('overlay-subtitle').innerText = '잠시 멈췄어요.';
    document.getElementById('overlay-msg').innerHTML = '<p>계속하려면 아래 버튼이나 가운데 Ⅱ 버튼을 누르세요.</p>';
    document.getElementById('difficulty-panel').classList.add('hidden');
    document.getElementById('btn-start').innerText = '계속하기 ▶';
    overlay.classList.remove('opacity-0', 'pointer-events-none');
}

function hideOverlay() {
    document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
}

function update(dt) {
    if (state !== 'PLAYING') return;
    waterOffset += dt * 40;

    if (wordTime > 0) {
        wordTime -= dt;
        if (wordTime <= 0) {
            Sound.wrong();
            loseLife('시간 초과!');
        }
    }

    if (frog.invincible > 0) frog.invincible -= dt;

    const targetCam = frog.y - H * .68;
    camera.y += (targetCam - camera.y) * Math.min(1, dt * 8.5);

    ensureRowsGenerated(Math.floor((camera.y - H) / TILE) - 10);
    const startRow = Math.floor(camera.y / TILE) - 3;
    const endRow = Math.ceil((camera.y + H) / TILE) + 3;
    for (let r = startRow; r <= endRow; r++) {
        const row = rowData[r];
        if (!row || row.type === 'grass') continue;
        for (const p of row.platforms) {
            let speed = p.baseSpeed;
            if (!frog.isDead && frog.riding === p) speed = p.baseSpeed;
            p.x += speed * dt * 60;
            p.blink += dt * 5;
            if (p.baseSpeed > 0 && p.x > W + TILE * 2) {
                p.x -= p.wrapLength;
                p.letter = randomLetter(targetChar());
                p.active = true;
                p.used = false;
                p.bonus = Math.random() < .13 ? 'fly' : null;
                row.targetFor = null;
                prepareRowForTarget(r, targetChar());
            } else if (p.baseSpeed < 0 && p.x + p.w < -TILE * 2) {
                p.x += p.wrapLength;
                p.letter = randomLetter(targetChar());
                p.active = true;
                p.used = false;
                p.bonus = Math.random() < .13 ? 'fly' : null;
                row.targetFor = null;
                prepareRowForTarget(r, targetChar());
            }
        }
    }

    if (!frog.isDead && frog.riding) {
        frog.x += frog.riding.baseSpeed * dt * 60;
        frog.targetX = frog.x;
        if (frog.x + frog.w < -TILE || frog.x > W + TILE) {
            loseLife('화면 밖으로 이탈!');
        }
    }

    if (frog.hop > 0) frog.hop = Math.max(0, frog.hop - dt * 5);
    if (shakePower > 0) shakePower = Math.max(0, shakePower - dt * 3);

    updateEffects(dt);
    updateUI();
}

function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.vy += dt * 10;
        p.life -= dt * 1.8;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += dt * 90;
        r.life -= dt * 2.2;
        if (r.life <= 0) rings.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= dt * 45;
        ft.life -= dt * 1.25;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    ctx.save();
    if (shakePower > 0) {
        ctx.translate((Math.random() - .5) * 8 * shakePower, (Math.random() - .5) * 8 * shakePower);
    }
    drawBackground();

    ctx.save();
    ctx.translate(0, -camera.y);
    drawRows();
    drawEffects();
    drawFrog();
    ctx.restore();

    drawVignette();
    ctx.restore();
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#064e3b');
    grad.addColorStop(.45, '#075985');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = .18;
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 2;
    for (let y = -20; y < H + 40; y += 36) {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20) {
            const yy = y + Math.sin((x + waterOffset) * .025) * 5;
            if (x === 0) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
        }
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawRows() {
    const startRow = Math.floor(camera.y / TILE) - 2;
    const endRow = Math.ceil((camera.y + H) / TILE) + 2;
    for (let r = startRow; r <= endRow; r++) {
        ensureRowsGenerated(r - 1);
        const row = rowData[r];
        if (!row) continue;
        const y = r * TILE;
        if (row.type === 'grass') drawGrassRow(row, y);
        else drawWaterRow(row, y);
    }
}

function drawGrassRow(row, y) {
    const g = ctx.createLinearGradient(0, y, 0, y + TILE);
    g.addColorStop(0, '#15803d');
    g.addColorStop(1, '#166534');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, TILE);
    ctx.globalAlpha = .25;
    ctx.fillStyle = '#bbf7d0';
    for (let x = -20; x < W + 20; x += 35) {
        ctx.beginPath();
        ctx.ellipse(x + Math.sin(row.spark + x) * 8, y + 15 + (x % 3) * 15, 18, 7, Math.sin(x) * .5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 24px Comic Sans MS, sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#064e3b';
    ctx.fillStyle = '#dcfce7';
    const text = rText(row.row);
    ctx.strokeText(text, W / 2, y + TILE / 2);
    ctx.fillText(text, W / 2, y + TILE / 2);
}

function rText(row) {
    return row === 0 ? '🌿 START / SAVE ZONE 🌿' : '🌿 CHECKPOINT 🌿';
}

function drawWaterRow(row, y) {
    ctx.globalAlpha = .18;
    ctx.fillStyle = row.row % 2 === 0 ? '#38bdf8' : '#22d3ee';
    ctx.fillRect(0, y + TILE - 5, W, 4);
    ctx.globalAlpha = 1;

    for (const p of row.platforms) drawPlatform(p);
}

function drawPlatform(p) {
    const now = performance.now();
    const glowing = p.letter === targetChar() || p.targetGlowUntil > now || p === hintTarget;
    const y = p.y + TILE * .1;
    ctx.save();
    if (glowing) {
        ctx.shadowBlur = p === hintTarget ? 30 : 20;
        ctx.shadowColor = p === hintTarget ? '#67e8f9' : '#86efac';
    }

    const bodyGrad = ctx.createLinearGradient(p.x, y, p.x, y + p.h);
    if (p.kind === 'croc') {
        bodyGrad.addColorStop(0, '#047857');
        bodyGrad.addColorStop(1, '#064e3b');
    } else {
        bodyGrad.addColorStop(0, '#b45309');
        bodyGrad.addColorStop(.45, '#78350f');
        bodyGrad.addColorStop(1, '#451a03');
    }
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(p.x, y + 5, p.w, p.h * .72, 18);
    ctx.fill();
    ctx.lineWidth = glowing ? 5 : 3;
    ctx.strokeStyle = glowing ? '#bbf7d0' : (p.kind === 'croc' ? '#10b981' : '#92400e');
    ctx.stroke();

    // 목재 결 또는 악어 눈
    ctx.globalAlpha = .35;
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 2;
    if (p.kind === 'log') {
        for (let i = 18; i < p.w - 12; i += 28) {
            ctx.beginPath();
            ctx.arc(p.x + i, y + p.h * .48, 8, 0, Math.PI * 2);
            ctx.stroke();
        }
    } else {
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(p.x + 18, y + 24, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x + p.w - 18, y + 24, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (p.bonus === 'fly' && p.active) {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🪰', p.x + p.w * .78, y + 16 + Math.sin(p.blink) * 3);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${p.letter === '✓' ? 32 : 38}px Comic Sans MS, sans-serif`;
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#020617';
    ctx.fillStyle = p.letter === '✓' ? '#86efac' : (glowing ? '#ecfccb' : '#ffffff');
    const tx = p.x + p.w / 2;
    const ty = y + p.h / 2 + 4;
    ctx.strokeText(p.letter, tx, ty);
    ctx.fillText(p.letter, tx, ty);

    ctx.restore();
}

function drawFrog() {
    if (frog.isDead) return;
    const cx = frog.x + frog.w / 2;
    const cy = frog.y + frog.h / 2 - Math.sin(frog.hop * Math.PI) * 18;
    ctx.save();
    ctx.translate(cx, cy);
    const rot = frog.face === 'left' ? -.25 : frog.face === 'right' ? .25 : 0;
    ctx.rotate(rot);
    if (frog.invincible > 0 && Math.floor(performance.now() / 90) % 2 === 0) ctx.globalAlpha = .55;
    ctx.font = `${frog.h}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#86efac';
    ctx.fillText('🐸', 0, 2);
    ctx.restore();
}

function drawEffects() {
    for (const ring of rings) {
        ctx.globalAlpha = Math.max(0, ring.life);
        ctx.strokeStyle = ring.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const ft of floatingTexts) {
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `900 ${ft.size}px Comic Sans MS, sans-serif`;
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#020617';
        ctx.fillStyle = ft.color;
        ctx.strokeText(ft.txt, ft.x, ft.y);
        ctx.fillText(ft.txt, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
}

function drawVignette() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, H * .15, W / 2, H / 2, H * .75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,.34)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 24) moveFrog(dx > 0 ? 1 : -1, 0);
    } else {
        if (Math.abs(dy) > 24) moveFrog(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyH','Space','Escape'].includes(e.code)) {
        e.preventDefault();
    }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') moveFrog(0, -1);
    if (e.code === 'ArrowDown' || e.code === 'KeyS') moveFrog(0, 1);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveFrog(-1, 0);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') moveFrog(1, 0);
    if (e.code === 'KeyH') useHint();
    if (e.code === 'Space' || e.code === 'Escape') togglePause();
});

document.querySelectorAll('.dpad button[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
        const [dx, dy] = btn.dataset.move.split(',').map(Number);
        moveFrog(dx, dy);
    });
});
document.getElementById('btn-hint').addEventListener('click', useHint);
document.getElementById('btn-start').addEventListener('click', () => {
    if (state === 'PAUSED') {
        hideOverlay();
        state = 'PLAYING';
        lastFrame = performance.now();
        return;
    }
    initGame(true);
    startBGM();
});
document.querySelectorAll('.difficulty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        selectedDifficulty = btn.dataset.difficulty;
        document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('border-2','border-sky-200/60','bg-sky-500/30'));
        btn.classList.add('border-2','border-sky-200/60','bg-sky-500/30');
    });
});

function loop(now = performance.now()) {
    const dt = Math.min(.05, (now - lastFrame) / 1000);
    lastFrame = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
updateUI();
</script>
</body>
</html>
