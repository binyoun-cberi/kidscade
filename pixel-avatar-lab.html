<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidscade Pixel Avatar v2 Rig Lab</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2c2734;background:#f3efe9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.lab{width:min(980px,100%);display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:20px}
.card{background:#fff;border:1px solid #ded7cf;border-radius:24px;box-shadow:0 18px 45px #4b3d3020;padding:20px}
.stage{display:grid;place-items:center;min-height:520px;background:linear-gradient(#e8f2f3,#f8f2e5);border-radius:20px;overflow:hidden}
canvas{width:min(440px,90%);height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 18px;color:#746c76;font-size:14px;line-height:1.5}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#5c5360}
select,input,button{font:inherit}
select,input{width:100%;border:1px solid #d8d0d9;border-radius:12px;background:#fff;padding:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;background:#332d3c;color:white}
button.secondary{background:#ede7f0;color:#403649}
.status{margin-top:14px;padding:10px 12px;border-radius:12px;background:#f6f2f8;font-size:12px;line-height:1.45;color:#655c6d}
@media(max-width:760px){.lab{grid-template-columns:1fr}.stage{min-height:380px}.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="lab">
  <section class="card stage"><canvas id="avatar" width="128" height="128"></canvas></section>
  <section class="card">
    <h1>Pixel Avatar v2 Rig Lab</h1>
    <p>이름 있는 anchor + 파츠 pivot으로 PNG를 조립하고 Idle/Walk 정렬을 확인하는 개발용 화면입니다.</p>
    <div class="controls">
      <label>검수 헤어<select id="hairId"><option value="male-short-01">콤마 사이드파트</option></select></label>
      <label>상의<select id="upper"><option value="0">기본 메리야스</option><option value="1" selected>파란 별 집업 후드</option></select></label>
      <label>하의<select id="lower"><option value="0">기본 반바지</option><option value="1" selected>커프 데님 팬츠</option></select></label>
      <label>눈<input id="eyes" type="number" min="1" max="8" value="1"></label>
      <label>눈썹<input id="eyebrows" type="number" min="1" max="6" value="1"></label>
      <label>코<input id="nose" type="number" min="1" max="4" value="1"></label>
      <label>입<input id="mouth" type="number" min="1" max="8" value="1"></label>
      <label>볼터치<select id="blush"><option value="0">없음</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label>모션<select id="animation"><option value="idle">Idle 4</option><option value="walk">Walk 6</option><option value="static">정지</option></select></label>
    </div>
    <div class="actions">
      <button id="randomize">랜덤 조합</button>
      <button id="play" class="secondary">재생/정지</button>
      <button id="anchorNose" class="secondary">앵커 테스트 코</button>
    </div>
    <div class="status" id="status">로딩 중…</div>
  </section>
</main>
<script src="pixel-avatar-renderer.js?v=25"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 const canvas=$('avatar'),status=$('status');
 try{
   const avatar=await KidscadePixelAvatarV1.create(canvas,{config:{animation:'idle'}});
   window.pixelAvatarLab=avatar;
   status.textContent='준비 완료 · Avatar Rig v2 · 코 테스트는 잘린 16×14 PNG를 nose anchor에 직접 붙입니다.';
   const hairSelect=$('hairId');
   const approved=(avatar.hairManifest?.items||[]).filter(item=>item?.approved!==false&&item?.id&&item?.front);
   hairSelect.innerHTML=approved.map(item=>`<option value="${item.id}">${item.name||item.id}</option>`).join('');
   hairSelect.value=avatar.config.hairId;
   const ids=['hairId','upper','lower','eyes','eyebrows','nose','mouth','blush','animation'];
   async function apply(){
     const patch={};
     ids.forEach(id=>patch[id]=id==='hairId'||id==='animation'?$(id).value:Number($(id).value));
     await avatar.setConfig(patch);
   }
   ids.forEach(id=>$(id).addEventListener('change',apply));
   $('randomize').onclick=async()=>{
     if(approved.length)hairSelect.value=approved[Math.floor(Math.random()*approved.length)].id;
     $('upper').value=Math.random()<.5?0:1;
     $('lower').value=Math.random()<.5?0:1;
     $('eyes').value=1+Math.floor(Math.random()*8);
     $('eyebrows').value=1+Math.floor(Math.random()*6);
     $('nose').value=1+Math.floor(Math.random()*4);
     $('mouth').value=1+Math.floor(Math.random()*8);
     $('blush').value=Math.floor(Math.random()*5);
     await apply();
   };
   $('play').onclick=()=>avatar.playing?avatar.pause():avatar.start();
   let anchorNoseOn=false;
   function anchorNoseData(){
     const c=document.createElement('canvas');c.width=16;c.height=14;
     const x=c.getContext('2d');x.imageSmoothingEnabled=false;
     x.fillStyle='#b4202a';x.fillRect(4,2,8,10);x.fillRect(2,4,12,6);
     x.fillStyle='#ef5a62';x.fillRect(5,3,5,3);x.fillStyle='#7c111b';x.fillRect(5,10,6,2);
     return c.toDataURL('image/png');
   }
   $('anchorNose').onclick=async()=>{
     anchorNoseOn=!anchorNoseOn;
     await avatar.setExtraParts(anchorNoseOn?[{
       id:'rig-test-red-nose',
       src:anchorNoseData(),
       attach:'nose',
       pivot:[8,7],
       transformGroup:'head',
       zSlot:'faceAccessoryOver'
     }]:[]);
     $('anchorNose').textContent=anchorNoseOn?'앵커 테스트 코 끄기':'앵커 테스트 코';
   };
 }catch(err){
   console.error(err);
   status.textContent='오류: '+err.message;
 }
})();
</script>
</body>
</html>
