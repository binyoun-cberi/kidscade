<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>딱! 타임 LCD</title>
<style>
:root{--bg:#0b0c10;--body:#17191e;--line:rgba(255,255,255,.09);--text:#f5f5f2;--muted:#9297a2;--red:#e83c4d;--blue:#36afd9;--green:#78d7a0;--yellow:#ffd063;--lcd:#a9b99b;--lcd2:#8fa181;--ink:#172218;--ghost:rgba(23,34,24,.075)}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:radial-gradient(circle at 50% -100px,rgba(232,60,77,.13),transparent 360px),linear-gradient(#111319,#090a0d 76%);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}button{font:inherit}.app{width:min(680px,100%);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 13px}.brand{font-size:20px;font-weight:950;letter-spacing:-.05em}.brand em{color:var(--red);font-style:normal}.best{font-size:10px;color:var(--muted);font-weight:850;text-align:right;line-height:1.4}.best b{font-size:13px;color:#fff}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}.mode{min-height:50px;border:1px solid var(--line);border-radius:13px;background:#15171d;color:#858b97;font-weight:900;font-size:12px;cursor:pointer}.mode small{display:block;font-size:9px;margin-top:2px;opacity:.72}.mode.active{color:#fff;border-color:rgba(232,60,77,.48);background:linear-gradient(180deg,rgba(232,60,77,.15),rgba(232,60,77,.055));box-shadow:inset 0 0 0 1px rgba(232,60,77,.07)}.mode:active{transform:scale(.98)}
.device{position:relative;border-radius:40px 40px 30px 30px;padding:18px 15px 15px;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 22%),linear-gradient(180deg,#2b2e35 0,#17191e 18%,#0f1014 100%);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -18px 36px rgba(0,0,0,.42),0 25px 75px rgba(0,0,0,.48);overflow:hidden}.device:before,.device:after{content:"";position:absolute;top:13px;width:76px;height:21px;border-radius:9px 9px 5px 5px;background:linear-gradient(#4a4e57,#24272d);border:1px solid rgba(255,255,255,.08)}.device:before{left:20px;transform:rotate(-8deg)}.device:after{right:20px;transform:rotate(8deg)}.head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:end;padding:10px 12px 8px}.head .name{font-size:11px;font-weight:950;letter-spacing:.1em}.head .name b{color:var(--red);font-size:16px;letter-spacing:-.04em}.head .meta{font-size:8px;color:#7d838d;text-align:right;font-weight:900;letter-spacing:.1em}.screenFrame{padding:8px;border-radius:17px;background:linear-gradient(145deg,#08090b,#383b43 48%,#090a0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 12px rgba(0,0,0,.45)}.ring{border:3px solid var(--red);border-radius:12px;padding:5px}.lcd{border:1px solid rgba(0,0,0,.48);border-radius:7px;padding:12px 9px 10px;background:linear-gradient(105deg,rgba(255,255,255,.14),transparent 31%),repeating-linear-gradient(0deg,rgba(30,50,30,.018) 0 1px,transparent 1px 4px),linear-gradient(145deg,var(--lcd),var(--lcd2));box-shadow:inset 3px 4px 8px rgba(255,255,255,.12),inset -3px -4px 8px rgba(34,46,31,.22);color:var(--ink)}.lcdTop,.lcdBottom{display:flex;justify-content:space-between;align-items:center;color:rgba(23,34,24,.68);font-size:9px;font-weight:950;letter-spacing:.08em}.lcdTop{height:22px}.lcdBottom{height:27px;border-top:1px solid rgba(23,34,24,.14);padding-top:5px;align-items:end}.lcdBottom b{color:var(--ink);font-size:11px}.signal{display:flex;gap:2px;align-items:end;height:10px}.signal i{display:block;width:3px;background:var(--ink);opacity:.58}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.screenButton{display:block;width:100%;border:0;background:transparent;padding:0;color:inherit;cursor:pointer}.display{height:108px;display:flex;align-items:center;justify-content:center;padding:3px 0 0}.digits{width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,8px);filter:drop-shadow(1px 1px 0 rgba(255,255,255,.11))}.digit{position:relative;width:clamp(46px,15vw,80px);height:clamp(78px,24vw,130px)}.seg{position:absolute;background:var(--ghost);transition:background .02s linear}.seg.on{background:var(--ink)}.seg.a,.seg.g,.seg.d{left:18%;width:64%;height:8%;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.seg.a{top:4%}.seg.g{top:46%}.seg.d{bottom:4%}.seg.b,.seg.c,.seg.e,.seg.f{width:12%;height:39%;clip-path:polygon(50% 0,100% 9%,100% 91%,50% 100%,0 91%,0 9%)}.seg.b{right:7%;top:9%}.seg.c{right:7%;bottom:9%}.seg.f{left:7%;top:9%}.seg.e{left:7%;bottom:9%}.decimal{width:clamp(8px,2.8vw,14px);height:clamp(8px,2.8vw,14px);border-radius:50%;background:var(--ink);align-self:flex-end;margin:0 0 clamp(12px,4vw,21px) -2px}.run{opacity:0;transition:opacity .12s}.run.on{opacity:1}.run:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:4px;vertical-align:1px;animation:blink .45s steps(1) infinite}@keyframes blink{50%{opacity:.15}}
.info{min-height:69px;text-align:center;padding:15px 12px 8px}.target{font-size:10px;color:#7d838e;font-weight:950;letter-spacing:.1em;margin-bottom:5px}.prompt{font-size:13px;color:#aaafb8;font-weight:760;line-height:1.5}.prompt b{color:#fff}.feedback{min-height:64px;text-align:center;padding:1px 10px 11px}.grade{font-size:22px;font-weight:1000;letter-spacing:-.04em;min-height:29px}.grade.perfect{color:var(--green)}.grade.great{color:var(--blue)}.grade.success{color:var(--yellow)}.grade.miss{color:#ff6878}.detail{font-size:11px;color:#898f99;font-weight:760}.detail b{color:#fff}.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:0 8px 12px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.025);color:#858b96;font-size:10px;font-weight:850}.chip b{color:#fff}.controls{display:grid;grid-template-columns:1fr 58px;gap:8px}.main,.reset{min-height:60px;border-radius:18px;color:#fff;font-weight:1000;cursor:pointer}.main{border:1px solid rgba(255,255,255,.08);font-size:17px;background:linear-gradient(#ed4656,#bd2434);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 18px rgba(0,0,0,.35)}.main.stop{background:linear-gradient(#43b5dc,#267e9f)}.reset{border:1px solid rgba(255,255,255,.08);font-size:19px;color:#a7acb6;background:linear-gradient(#292c33,#181a1f)}.main:active,.reset:active{transform:translateY(1px) scale(.99)}.help{text-align:center;color:#666d78;font-size:10px;font-weight:800;padding:11px 5px 0}.toast{position:absolute;z-index:5;left:50%;top:78px;transform:translate(-50%,-7px);padding:7px 11px;border-radius:999px;background:#07080b;border:1px solid var(--line);font-size:10px;font-weight:900;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.flash{animation:flash .4s ease}@keyframes flash{50%{filter:brightness(1.12)}}.shake{animation:shake .26s ease}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media(max-width:420px){.app{padding-left:9px;padding-right:9px}.device{border-radius:32px 32px 26px 26px;padding:14px 11px 11px}.display{height:93px}.info{min-height:64px;padding-top:13px}}@media(max-width:350px){.mode small{display:none}.mode{min-height:44px}.digit{width:43px;height:73px}.decimal{width:8px;height:8px;margin-bottom:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">딱<em>!</em> 타임</div><div class="best" id="best">BEST<br><b>--</b></div></div>
  <nav class="modes" aria-label="게임 모드">
    <button class="mode active" data-mode="classic" type="button">10초<small>정확히 멈추기</small></button>
    <button class="mode" data-mode="combo" type="button">콤보<small>연속 성공</small></button>
    <button class="mode" data-mode="ladder" type="button">10→3<small>8단계 도전</small></button>
  </nav>

  <section class="device" id="device">
    <div class="toast" id="toast">기록 저장</div>
    <div class="head"><div class="name">DIGITAL <b>STOPWATCH</b></div><div class="meta">1/100 SEC<br>QUARTZ</div></div>
    <div class="screenFrame">
      <div class="ring"><div class="lcd">
        <div class="lcdTop"><span>ST&nbsp;&nbsp;LP&nbsp;&nbsp;AL</span><span class="signal"><i></i><i></i><i></i></span></div>
        <button class="screenButton" id="screenButton" type="button" aria-label="시작 또는 정지">
          <div class="display"><div class="digits" id="digits">
            <div class="digit"></div><div class="digit"></div><span class="decimal"></span><div class="digit"></div><div class="digit"></div>
          </div></div>
        </button>
        <div class="lcdBottom"><span id="lcdTarget">TARGET <b>10.00</b></span><span class="run" id="run">RUN</span></div>
      </div></div>
    </div>
    <div class="info"><div class="target" id="target">CLASSIC · TARGET 10.00 SEC</div><div class="prompt" id="prompt">터치하면 바로 시작<br><b>10초라고 느껴질 때 다시 터치</b></div></div>
    <div class="feedback" aria-live="polite"><div class="grade" id="grade"></div><div class="detail" id="detail"></div></div>
    <div class="stats"><span class="chip" id="statA">최고 <b>--</b></span><span class="chip" id="statB">도전 <b>0</b></span></div>
    <div class="controls"><button class="main" id="main" type="button">시작</button><button class="reset" id="reset" type="button" aria-label="현재 도전 초기화">↻</button></div>
  </section>
  <div class="help">1·2·3초에만 기준음 · 이후 무음 · 흐르는 LCD 숫자는 실제 시간과 무관합니다</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), el={device:$('device'),best:$('best'),modes:[...document.querySelectorAll('.mode')],digits:[...document.querySelectorAll('.digit')],lcdTarget:$('lcdTarget'),run:$('run'),target:$('target'),prompt:$('prompt'),grade:$('grade'),detail:$('detail'),statA:$('statA'),statB:$('statB'),main:$('main'),reset:$('reset'),screen:$('screenButton'),toast:$('toast')};
const MAP={0:['a','b','c','d','e','f'],1:['b','c'],2:['a','b','g','e','d'],3:['a','b','c','d','g'],4:['f','g','b','c'],5:['a','f','g','c','d'],6:['a','f','g','e','c','d'],7:['a','b','c'],8:['a','b','c','d','e','f','g'],9:['a','b','c','d','f','g']}, segs=['a','b','c','d','e','f','g'];
el.digits.forEach(d=>segs.forEach(s=>{const x=document.createElement('span');x.className='seg '+s;d.appendChild(x)}));
function digit(node,n){const on=new Set(MAP[n]||[]);segs.forEach(s=>node.querySelector('.'+s).classList.toggle('on',on.has(s)))}
function show(v){const s=Math.max(0,Math.min(99.99,+v||0)).toFixed(2).padStart(5,'0'),a=[s[0],s[1],s[3],s[4]];a.forEach((n,i)=>digit(el.digits[i],+n))}
function randomize(){el.digits.forEach(d=>digit(d,Math.floor(Math.random()*10)))}
const KEY='dakTimeLCD_v4',DEF={classicBest:null,maxCombo:0,ladderBest:0,ladderClears:0,totalAttempts:0,lastMode:'classic'};
function load(){try{const r=localStorage.getItem(KEY);return r?{...DEF,...JSON.parse(r)}:{...DEF}}catch(e){return {...DEF}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
let data=load(),mode=['classic','combo','ladder'].includes(data.lastMode)?data.lastMode:'classic',state='ready',target=10,combo=0,li=0,startAt=0,roll=0,timers=[],audio=null,toastT=0;const ladder=[10,9,8,7,6,5,4,3];
function audioOn(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return true}catch(e){return false}}
function tone(f,d=.05,type='square',vol=.028,delay=0){if(!audioOn())return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02)}
const sounds={start:()=>{tone(680,.05);tone(960,.07,'square',.023,.055)},tick:()=>tone(1050,.038,'square',.022),perfect:()=>{tone(660,.08,'triangle',.05);tone(880,.09,'triangle',.055,.075);tone(1180,.16,'triangle',.06,.15)},great:()=>{tone(590,.08,'sine',.042);tone(820,.14,'sine',.05,.075)},success:()=>{tone(520,.07,'sine',.038);tone(690,.12,'sine',.045,.07)},miss:()=>{tone(230,.12,'sawtooth',.022);tone(170,.18,'sawtooth',.018,.1)}};
function toast(t){clearTimeout(toastT);el.toast.textContent=t;el.toast.classList.add('show');toastT=setTimeout(()=>el.toast.classList.remove('show'),1100)}function fmt(v){return v==null?'--':'±'+(+v).toFixed(2)+'초'}function clear(){el.grade.textContent='';el.grade.className='grade';el.detail.textContent=''}
function stopRoll(){clearInterval(roll);roll=0;timers.forEach(clearTimeout);timers=[];el.run.classList.remove('on')}function startRoll(){stopRoll();randomize();roll=setInterval(randomize,72);el.run.classList.add('on')}
function nav(){el.modes.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function stats(){if(mode==='classic'){el.statA.innerHTML='최고 <b>'+fmt(data.classicBest)+'</b>';el.statB.innerHTML='도전 <b>'+data.totalAttempts+'</b>';el.best.innerHTML='BEST<br><b>'+fmt(data.classicBest)+'</b>'}else if(mode==='combo'){el.statA.innerHTML='최대 콤보 <b>'+data.maxCombo+'</b>';el.statB.innerHTML='현재 <b>'+combo+'</b>';el.best.innerHTML='MAX COMBO<br><b>'+data.maxCombo+'</b>'}else{const b=data.ladderBest>=8?'완주':data.ladderBest+'/8';el.statA.innerHTML='최고 <b>'+b+'</b>';el.statB.innerHTML='완주 <b>'+data.ladderClears+'</b>';el.best.innerHTML='BEST STEP<br><b>'+b+'</b>'}}
function setTarget(n){target=n;el.lcdTarget.innerHTML='TARGET <b>'+target.toFixed(2)+'</b>'}
function ready(){state='ready';stopRoll();clear();el.main.classList.remove('stop');if(mode==='classic'){setTarget(10);show(10);el.target.textContent='CLASSIC · TARGET 10.00 SEC';el.prompt.innerHTML='터치하면 바로 시작<br><b>10초라고 느껴질 때 다시 터치</b>';el.main.textContent='시작'}else if(mode==='combo'){setTarget(10);show(10);el.target.textContent=combo?'COMBO × '+combo:'10 SECOND COMBO';el.prompt.innerHTML=combo?'<b>'+combo+'콤보!</b><br>다시 10초에 도전':'±0.20초 안이면 성공<br><b>몇 번 연속 맞출 수 있을까요?</b>';el.main.textContent=combo?'다음 도전':'콤보 시작'}else{setTarget(ladder[li]);show(target);el.target.textContent='STEP '+(li+1)+' / 8 · TARGET '+target.toFixed(2);el.prompt.innerHTML=li?'<b>'+target.toFixed(2)+'초</b>를 맞혀보세요<br>현재 '+li+'단계 성공':'<b>10 → 9 → 8 → 7 → 6 → 5 → 4 → 3</b><br>실패하면 10초부터';el.main.textContent=li?target.toFixed(2)+'초 도전':'연속 도전 시작'}stats()}
function begin(){if(state==='running')return;clear();audioOn();state='running';startAt=performance.now();startRoll();sounds.start();el.target.textContent='MEASURING · TARGET '+target.toFixed(2)+' SEC';el.prompt.innerHTML='<b>'+target.toFixed(2)+'초</b>라고 느끼는 순간 멈추세요';el.main.textContent='STOP';el.main.classList.add('stop');[1000,2000,3000].forEach(ms=>timers.push(setTimeout(()=>{if(state==='running')sounds.tick()},ms)))}
function classif(e){if(e<=.05)return['PERFECT!','perfect'];if(e<=.10)return['GREAT!','great'];if(e<=.20)return['SUCCESS','success'];return['MISS','miss']}
function finish(){if(state!=='running')return;const elapsed=(performance.now()-startAt)/1000,err=Math.abs(elapsed-target),signed=elapsed-target,pass=err<=.20,[label,cls]=classif(err);state='result';stopRoll();show(elapsed);data.totalAttempts++;el.grade.textContent=label;el.grade.className='grade '+cls;el.detail.innerHTML='목표 <b>'+target.toFixed(2)+'초</b> · 기록 <b>'+elapsed.toFixed(2)+'초</b> · 오차 <b>±'+err.toFixed(2)+'초</b>';el.main.classList.remove('stop');el.device.classList.remove('flash','shake');void el.device.offsetWidth;el.device.classList.add(pass?'flash':'shake');if(err<=.05)sounds.perfect();else if(err<=.10)sounds.great();else if(pass)sounds.success();else sounds.miss();if(mode==='classic'){if(data.classicBest==null||err<data.classicBest){data.classicBest=err;toast('새 최고 기록!')}el.target.textContent=pass?label:'STOPPED';el.prompt.innerHTML=pass?'<b>좋아요!</b> 다시 기록을 줄여보세요':(signed<0?'조금 빨랐어요':'조금 늦었어요');el.main.textContent='다시 도전';save();stats();return}if(mode==='combo'){if(pass){combo++;if(combo>data.maxCombo){data.maxCombo=combo;toast('최대 콤보 갱신!')}el.target.textContent='COMBO × '+combo;el.prompt.innerHTML='<b>'+combo+' COMBO!</b><br>다음 10초에 도전';el.main.textContent='다음 콤보'}else{combo=0;el.target.textContent='COMBO BREAK';el.prompt.innerHTML='콤보가 끊겼어요<br><b>다시 0부터 시작</b>';el.main.textContent='다시 시작'}save();stats();return}if(pass){li++;if(li>data.ladderBest){data.ladderBest=li;toast(li>=8?'8단계 완주!':'최고 단계 갱신!')}if(li>=ladder.length){data.ladderClears++;el.target.textContent='ALL CLEAR · 8 / 8';el.prompt.innerHTML='<b>10초부터 3초까지 전부 성공!</b>';el.main.textContent='다시 완주 도전';li=0;target=10}else{setTarget(ladder[li]);el.target.textContent='NEXT · '+target.toFixed(2)+' SEC';el.prompt.innerHTML='<b>'+li+'단계 성공!</b><br>다음은 '+target.toFixed(2)+'초';el.main.textContent=target.toFixed(2)+'초 도전'}}else{el.target.textContent='FAILED · '+li+' / 8';el.prompt.innerHTML='다시 <b>10.00초</b>부터 시작';el.main.textContent='10초부터 다시';li=0;target=10}save();stats()}
function primary(){state==='running'?finish():begin()}function change(next){if(state==='running'||next===mode)return;mode=next;data.lastMode=mode;combo=0;li=0;save();nav();ready()}function reset(){if(state==='running')return;combo=0;li=0;ready();toast('현재 도전 초기화')}
el.main.addEventListener('click',primary);el.screen.addEventListener('click',primary);el.reset.addEventListener('click',reset);el.modes.forEach(b=>b.addEventListener('click',()=>change(b.dataset.mode)));window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat)return;const t=document.activeElement&&document.activeElement.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;e.preventDefault();primary()});nav();ready();
})();
</script>
</body>
</html>
