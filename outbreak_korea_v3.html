<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OUTBREAK KOREA</title>
<style>
html,body{margin:0;min-height:100%;background:#07110f;color:#e8f4ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.load{width:min(520px,88vw);text-align:center}.mark{font-size:54px;margin-bottom:10px}.title{font-size:clamp(28px,7vw,52px);font-weight:1000;letter-spacing:.06em}.sub{margin-top:8px;color:#91a9a0}.bar{height:10px;border:1px solid #31584b;background:#0d1d19;border-radius:999px;overflow:hidden;margin:24px 0 10px}.bar span{display:block;height:100%;width:35%;background:#5df0b5;border-radius:999px;animation:move 1s ease-in-out infinite alternate}.err{display:none;margin-top:18px;padding:14px;border:1px solid #713e3e;background:#2d1515;border-radius:12px;color:#ffd0d0;line-height:1.5}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(285%)}}
</style>
</head>
<body>
<div class="load"><div class="mark">🧬</div><div class="title">OUTBREAK KOREA</div><div class="sub" id="status">시뮬레이션을 준비하고 있습니다…</div><div class="bar"><span></span></div><div class="err" id="error">게임 데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div></div>
<script>
(async()=>{
  const paths=[1,2,3,4,5].map(n=>`assets/outbreak/outbreak_payload_${n}.txt`);
  const status=document.getElementById('status');
  const error=document.getElementById('error');
  try{
    if(!('DecompressionStream' in window)) throw new Error('DecompressionStream unsupported');
    status.textContent='게임 데이터를 불러오는 중…';
    const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return (await r.text()).trim();}));
    status.textContent='대한민국 시뮬레이션을 여는 중…';
    const bin=atob(parts.join(''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){console.error(e);status.textContent='불러오기 실패';error.style.display='block';}
})();
</script>
</body>
</html>
