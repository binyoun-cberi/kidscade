<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 루빅스 큐브 게임</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent pinch zoom on mobile */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            /* 우클릭 컨텍스트 메뉴 방지 */
            oncontextmenu="return false;"
        }
        /* Custom scrollbar for control panel if needed */
        .controls-grid::-webkit-scrollbar { width: 6px; }
        .controls-grid::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
        
        /* Custom button styles */
        .btn-custom {
            @apply px-4 py-2 rounded-md font-bold shadow transition flex items-center justify-center gap-2;
        }
        
        /* 타이머 스타일 */
        .timer-display {
            font-variant-numeric: tabular-nums;
        }
    </style>
    
    <!-- Three.js 모듈 경로를 지정해주는 Import Map 추가 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- BGM Audio (나른한 음악 예시) -->
    <audio id="bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Sound Effects Audio -->
    <audio id="sfx-click">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-modern-click-box-check-1120.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-rotate">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-game-ball-tap-2073.mp3" type="audio/mpeg">
    </audio>


    <!-- UI Overlay -->
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-4 z-10">
        
        <!-- Top Bar -->
        <div class="flex flex-col md:flex-row justify-between items-start pointer-events-auto gap-4">
            <div class="bg-gray-900 bg-opacity-80 p-4 rounded-lg shadow-lg border border-gray-700 backdrop-blur-sm">
                <div class="flex justify-between items-center mb-3">
                    <h1 class="text-xl font-bold text-blue-400">3D 루빅스 큐브</h1>
                    <button id="btn-bgm-toggle" class="p-2 rounded-full hover:bg-gray-700 transition">
                        <i data-lucide="music" class="text-gray-300"></i>
                    </button>
                </div>
                <div class="flex gap-2 mb-3">
                    <button id="btn-2x2" class="btn-custom bg-blue-600 hover:bg-blue-500">2x2x2</button>
                    <button id="btn-3x3" class="btn-custom bg-green-600 hover:bg-green-500">3x3x3</button>
                </div>
                <div class="flex gap-2 mb-3">
                    <button id="btn-scramble" class="btn-custom bg-yellow-500 text-black hover:bg-yellow-400">
                        <i data-lucide="shuffle" class="w-4 h-4"></i> 무작위 섞기
                    </button>
                    <button id="btn-reset" class="btn-custom bg-red-600 hover:bg-red-500">초기화</button>
                </div>
                <!-- 타이머 및 최고 기록 표시 -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-sm text-gray-300">
                        <span>시간:</span>
                        <span id="timer" class="timer-display font-bold text-xl text-yellow-400">00:00.00</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-gray-400">
                        <span>최고 기록:</span>
                        <span id="best-time" class="timer-display font-bold text-green-400">--:--.--</span>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 bg-opacity-80 p-4 rounded-lg shadow-lg border border-gray-700 backdrop-blur-sm text-sm w-64">
                <h3 class="font-bold text-gray-200 mb-2 border-b border-gray-600 pb-1 flex items-center">
                    <i data-lucide="gamepad-2" class="w-4 h-4 mr-2 text-purple-400"></i> 조작 가이드
                </h3>
                <ul class="space-y-1 text-gray-300">
                    <li><span class="text-yellow-400 font-bold">좌클릭 드래그</span> : 시점 회전</li>
                    <li><span class="text-yellow-400 font-bold">우클릭 드래그</span> : 면 회전</li>
                    <li><span class="text-yellow-400 font-bold">마우스 휠</span> : 확대 / 축소</li>
                    <li><span class="text-yellow-400 font-bold">키보드 방향키</span> : 큐브 전체 회전</li>
                </ul>
            </div>
        </div>

        <!-- Bottom Controls (오른쪽 하단으로 이동) -->
        <div class="pointer-events-auto bg-gray-900 bg-opacity-70 p-3 rounded-lg shadow-lg border border-gray-700 backdrop-blur-sm absolute bottom-4 right-4 w-64 transition-all duration-300 hover:bg-opacity-90">
            <h2 class="text-center font-bold mb-2 text-gray-200 text-sm">화살표를 눌러 각 면을 회전하세요</h2>
            <div id="controls-grid" class="grid grid-cols-2 gap-2">
                <!-- Controls will be injected here dynamically -->
            </div>
        </div>

    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Three.js Library & OrbitControls -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 전역 변수 설정 ---
        let scene, camera, renderer, controls;
        let cubeGroup = new THREE.Group();
        let cubies = [];
        let currentSize = 3;
        
        let isAnimating = false;
        let animationQueue = [];

        // 오디오 요소
        const bgm = document.getElementById('bgm');
        const sfxClick = document.getElementById('sfx-click');
        const sfxRotate = document.getElementById('sfx-rotate');
        let isBgmPlaying = false;

        // 타이머 관련 변수
        let startTime;
        let timerInterval;
        let isTimerRunning = false;
        const timerDisplay = document.getElementById('timer');
        const bestTimeDisplay = document.getElementById('best-time');
        let bestTime2x2 = localStorage.getItem('bestTime2x2') || null;
        let bestTime3x3 = localStorage.getItem('bestTime3x3') || null;

        // 큐브 색상 매핑 (Rubik's Standard)
        // 오른쪽(Red), 왼쪽(Orange), 위(White), 아래(Yellow), 앞(Green), 뒤(Blue)
        const COLORS = {
            R: 0xff0000, L: 0xff8800,
            U: 0xffffff, D: 0xffff00,
            F: 0x00ff00, B: 0x0000ff,
            CORE: 0x111111 // 내부 색상
        };

        // 마우스 드래그 회전 관련 변수
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isRightDragging = false;
        let dragStartPoint = null;
        let clickedCubie = null;
        let clickedFaceNormal = null;

        init();
        animateLoop();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene 설정
            scene = new THREE.Scene();

            // 2. Camera 설정
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 5, 7);

            // 3. Renderer 설정
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 4. 조명 설정
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 5. Controls 설정 (마우스로 카메라 회전)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = false; // 우클릭 드래그 회전을 위해 팬 비활성화
            controls.minDistance = 4;
            controls.maxDistance = 15;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: null // 우클릭은 커스텀 드래그에 사용
            };

            scene.add(cubeGroup);

            // 6. 이벤트 리스너 설정
            window.addEventListener('resize', onWindowResize);
            document.getElementById('btn-2x2').addEventListener('click', () => { playClickSound(); buildCube(2); });
            document.getElementById('btn-3x3').addEventListener('click', () => { playClickSound(); buildCube(3); });
            document.getElementById('btn-scramble').addEventListener('click', () => { playClickSound(); scramble(); });
            document.getElementById('btn-reset').addEventListener('click', () => { playClickSound(); buildCube(currentSize); });
            
            document.getElementById('btn-bgm-toggle').addEventListener('click', toggleBgm);

            // 방향키 입력 설정 (큐브 전체 회전)
            window.addEventListener('keydown', (e) => {
                if (isAnimating) return;
                const duration = 200;
                switch(e.key) {
                    case 'ArrowLeft':  queueWholeRotation('y', Math.PI/2, duration); break;
                    case 'ArrowRight': queueWholeRotation('y', -Math.PI/2, duration); break;
                    case 'ArrowUp':    queueWholeRotation('x', -Math.PI/2, duration); break;
                    case 'ArrowDown':  queueWholeRotation('x', Math.PI/2, duration); break;
                }
            });

            // 마우스 이벤트 리스너 추가 (우클릭 드래그 회전)
            container.addEventListener('mousedown', onMouseDown);
            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('mouseup', onMouseUp);
            container.addEventListener('contextmenu', e => e.preventDefault()); // 컨텍스트 메뉴 방지

            // 초기 큐브 생성
            buildCube(3);
            
            // Lucide 아이콘 초기화
            lucide.createIcons();
        }

        // --- 마우스 이벤트 핸들러 (우클릭 드래그 회전) ---
        function onMouseDown(event) {
            if (event.button !== 2 || isAnimating) return; // 우클릭만 처리, 애니메이션 중이면 무시

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubies);

            if (intersects.length > 0) {
                isRightDragging = true;
                clickedCubie = intersects[0].object;
                clickedFaceNormal = intersects[0].face.normal.clone();
                clickedFaceNormal.transformDirection(clickedCubie.matrixWorld); // 월드 좌표계로 변환
                dragStartPoint = intersects[0].point;
            }
        }

        function onMouseMove(event) {
            if (!isRightDragging || isAnimating) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(new THREE.Plane(clickedFaceNormal, -dragStartPoint.dot(clickedFaceNormal)), intersectPoint);

            if (intersectPoint) {
                const dragVector = intersectPoint.clone().sub(dragStartPoint);
                if (dragVector.length() > 0.5) { // 드래그 거리가 충분할 때만 회전
                    determineRotation(clickedCubie, clickedFaceNormal, dragVector);
                    isRightDragging = false;
                    dragStartPoint = null;
                    clickedCubie = null;
                    clickedFaceNormal = null;
                }
            }
        }

        function onMouseUp(event) {
            if (event.button === 2) {
                isRightDragging = false;
                dragStartPoint = null;
                clickedCubie = null;
                clickedFaceNormal = null;
            }
        }

        function determineRotation(cubie, normal, dragVec) {
            const absNormal = new THREE.Vector3(Math.abs(normal.x), Math.abs(normal.y), Math.abs(normal.z));
            let axis, angle, value;
            const cubiePos = new THREE.Vector3();
            cubie.getWorldPosition(cubiePos);

            if (absNormal.x > 0.9) { // X축 면 클릭
                if (Math.abs(dragVec.y) > Math.abs(dragVec.z)) {
                    axis = 'z'; angle = dragVec.y * normal.x > 0 ? -Math.PI/2 : Math.PI/2;
                } else {
                    axis = 'y'; angle = dragVec.z * normal.x > 0 ? Math.PI/2 : -Math.PI/2;
                }
                value = cubiePos[axis];
            } else if (absNormal.y > 0.9) { // Y축 면 클릭
                if (Math.abs(dragVec.x) > Math.abs(dragVec.z)) {
                    axis = 'z'; angle = dragVec.x * normal.y > 0 ? Math.PI/2 : -Math.PI/2;
                } else {
                    axis = 'x'; angle = dragVec.z * normal.y > 0 ? -Math.PI/2 : Math.PI/2;
                }
                value = cubiePos[axis];
            } else if (absNormal.z > 0.9) { // Z축 면 클릭
                if (Math.abs(dragVec.x) > Math.abs(dragVec.y)) {
                    axis = 'y'; angle = dragVec.x * normal.z > 0 ? -Math.PI/2 : Math.PI/2;
                } else {
                    axis = 'x'; angle = dragVec.y * normal.z > 0 ? Math.PI/2 : -Math.PI/2;
                }
                value = cubiePos[axis];
            }
            
            if (axis) {
                queueLayerRotation(axis, value, angle, 300);
                playClickSound(); // 드래그 회전 시에도 클릭 사운드 재생
            }
        }


        // --- 오디오 관련 함수 ---
        function toggleBgm() {
            if (isBgmPlaying) {
                bgm.pause();
                document.getElementById('btn-bgm-toggle').innerHTML = '<i data-lucide="music" class="text-gray-300"></i>';
            } else {
                bgm.play();
                document.getElementById('btn-bgm-toggle').innerHTML = '<i data-lucide="music-2" class="text-blue-400"></i>';
            }
            isBgmPlaying = !isBgmPlaying;
            lucide.createIcons();
        }

        function playClickSound() {
            sfxClick.currentTime = 0;
            sfxClick.play();
        }

        function playRotateSound() {
            sfxRotate.currentTime = 0;
            sfxRotate.play();
        }

        // --- 타이머 관련 함수 ---
        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 10);
        }

        function stopTimer() {
            if (!isTimerRunning) return;
            isTimerRunning = false;
            clearInterval(timerInterval);
            const elapsedTime = Date.now() - startTime;
            checkBestTime(elapsedTime);
        }

        function resetTimer() {
            stopTimer();
            timerDisplay.textContent = "00:00.00";
            updateBestTimeDisplay();
        }

        function updateTimer() {
            const elapsedTime = Date.now() - startTime;
            timerDisplay.textContent = formatTime(elapsedTime);
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        }

        function checkBestTime(elapsedTime) {
            let currentBestTime = currentSize === 2 ? bestTime2x2 : bestTime3x3;
            if (currentBestTime === null || elapsedTime < currentBestTime) {
                if (currentSize === 2) {
                    bestTime2x2 = elapsedTime;
                    localStorage.setItem('bestTime2x2', bestTime2x2);
                } else {
                    bestTime3x3 = elapsedTime;
                    localStorage.setItem('bestTime3x3', bestTime3x3);
                }
                updateBestTimeDisplay();
            }
        }

        function updateBestTimeDisplay() {
            const currentBestTime = currentSize === 2 ? bestTime2x2 : bestTime3x3;
            bestTimeDisplay.textContent = currentBestTime ? formatTime(currentBestTime) : "--:--.--";
        }


        // --- 큐브 생성 로직 ---
        function getMaterials(x, y, z, maxOffset) {
            const coreMat = new THREE.MeshLambertMaterial({ color: COLORS.CORE });
            return [
                x === maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.R }) : coreMat, // +X
                x === -maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.L }) : coreMat, // -X
                y === maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.U }) : coreMat, // +Y
                y === -maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.D }) : coreMat, // -Y
                z === maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.F }) : coreMat, // +Z
                z === -maxOffset ? new THREE.MeshLambertMaterial({ color: COLORS.B }) : coreMat  // -Z
            ];
        }

        function buildCube(size) {
            resetTimer(); // 큐브 생성 시 타이머 초기화
            animationQueue = []; // 애니메이션 초기화
            currentSize = size;
            
            // 기존 큐브 삭제
            while(cubeGroup.children.length > 0) {
                const child = cubeGroup.children[0];
                cubeGroup.remove(child);
                if(child.geometry) child.geometry.dispose();
                if(child.material) child.material.forEach(m => m.dispose());
            }
            cubies = [];

            const offset = (size - 1) / 2;
            
            // 각 조각(Cubie) 생성
            for(let x=0; x<size; x++) {
                for(let y=0; y<size; y++) {
                    for(let z=0; z<size; z++) {
                        const px = x - offset;
                        const py = y - offset;
                        const pz = z - offset;
                        
                        const geo = new THREE.BoxGeometry(0.96, 0.96, 0.96); // 약간의 틈을 위해 0.96
                        const mats = getMaterials(px, py, pz, offset);
                        const mesh = new THREE.Mesh(geo, mats);
                        
                        mesh.position.set(px, py, pz);
                        mesh.userData.initialPosition = new THREE.Vector3(px, py, pz); // 초기 위치 저장
                        cubeGroup.add(mesh);
                        cubies.push(mesh);
                    }
                }
            }

            // 카메라 위치 조정
            camera.position.set(size*1.5, size*1.5, size*2.2);
            controls.target.set(0, 0, 0);
            controls.update();

            // UI 컨트롤 업데이트
            buildControls();
        }

        // --- UI 컨트롤 패널 생성 ---
        function buildControls() {
            const grid = document.getElementById('controls-grid');
            grid.innerHTML = '';
            
            const max = (currentSize - 1) / 2;
            
            // 회전시킬 6개의 면 정의 (axis, value, 시계방향 각도 부호)
            const faces = [
                { name: '윗면 (Up)', axis: 'y', val: max, sign: -1, bg: 'bg-gray-100 text-gray-800' },
                { name: '아랫면 (Down)', axis: 'y', val: -max, sign: 1, bg: 'bg-yellow-400 text-gray-900' },
                { name: '앞면 (Front)', axis: 'z', val: max, sign: -1, bg: 'bg-green-500 text-white' },
                { name: '뒷면 (Back)', axis: 'z', val: -max, sign: 1, bg: 'bg-blue-500 text-white' },
                { name: '왼쪽 (Left)', axis: 'x', val: -max, sign: 1, bg: 'bg-orange-500 text-white' },
                { name: '오른쪽 (Right)', axis: 'x', val: max, sign: -1, bg: 'bg-red-500 text-white' }
            ];

            faces.forEach(face => {
                const box = document.createElement('div');
                box.className = `flex flex-col items-center p-1.5 rounded-lg ${face.bg} shadow-inner border border-gray-600 border-opacity-30`;
                
                const title = document.createElement('div');
                title.className = "text-xs font-bold mb-1 drop-shadow-md";
                title.innerText = face.name;
                box.appendChild(title);

                const btnGroup = document.createElement('div');
                btnGroup.className = "flex gap-1 w-full px-0.5";

                // 시계 방향 버튼
                const btnCW = document.createElement('button');
                btnCW.className = "flex-1 bg-black bg-opacity-20 hover:bg-opacity-40 py-0.5 rounded font-bold transition text-sm flex items-center justify-center";
                btnCW.innerHTML = '<i data-lucide="rotate-cw" class="w-4 h-4"></i>';
                btnCW.onclick = () => { playClickSound(); queueLayerRotation(face.axis, face.val, face.sign * (Math.PI/2), 300); };
                
                // 반시계 방향 버튼
                const btnCCW = document.createElement('button');
                btnCCW.className = "flex-1 bg-black bg-opacity-20 hover:bg-opacity-40 py-0.5 rounded font-bold transition text-sm flex items-center justify-center";
                btnCCW.innerHTML = '<i data-lucide="rotate-ccw" class="w-4 h-4"></i>';
                btnCCW.onclick = () => { playClickSound(); queueLayerRotation(face.axis, face.val, face.sign * (-Math.PI/2), 300); };

                btnGroup.appendChild(btnCW);
                btnGroup.appendChild(btnCCW);
                box.appendChild(btnGroup);

                grid.appendChild(box);
            });
            lucide.createIcons();
        }

        // --- 애니메이션 & 큐레이션 ---
        function queueLayerRotation(axis, value, angle, duration) {
            animationQueue.push({ type: 'layer', axis, value, angle, duration });
            processQueue();
        }

        function queueWholeRotation(axis, angle, duration) {
            animationQueue.push({ type: 'whole', axis, angle, duration });
            processQueue();
        }

        // scramble 함수에서 타이머 시작을 위한 로직이 포함된 processQueue
        function processQueue() {
            if (isAnimating || animationQueue.length === 0) return;
            
            isAnimating = true;
            const next = animationQueue.shift();
            
            if (next.type === 'layer') {
                performLayerRotation(next.axis, next.value, next.angle, next.duration);
            } else if (next.type === 'whole') {
                performWholeRotation(next.axis, next.angle, next.duration);
            } else if (next.type === 'startTimer') {
                isAnimating = false;
                startTimer(); // 섞기가 끝나면 타이머 시작
                processQueue();
            }
        }

        // 부동소수점 오류 보정 (스냅)
        function snapCubies() {
            cubies.forEach(c => {
                c.position.x = Math.round(c.position.x * 2) / 2;
                c.position.y = Math.round(c.position.y * 2) / 2;
                c.position.z = Math.round(c.position.z * 2) / 2;

                const mat = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
                const e = mat.elements;
                for(let i=0; i<16; i++) {
                    e[i] = Math.round(e[i]);
                }
                c.quaternion.setFromRotationMatrix(mat);
            });
        }
        
        // 큐브 완성 체크
        function checkCubeCompletion() {
            if (!isTimerRunning) return; // 타이머가 작동 중일 때만 체크

            const max = (currentSize - 1) / 2;
            const axes = ['x', 'y', 'z'];
            const directions = [1, -1];

            for (const axis of axes) {
                for (const dir of directions) {
                    const faceCubies = cubies.filter(c => Math.abs(c.position[axis] - (dir * max)) < 0.1);
                    if (faceCubies.length === 0) continue;

                    // 해당 면의 첫 번째 큐비의 색상을 기준으로 나머지 큐비들의 색상 비교
                    let materialIndex;
                    if (axis === 'x') materialIndex = dir === 1 ? 0 : 1; // +X(R), -X(L)
                    else if (axis === 'y') materialIndex = dir === 1 ? 2 : 3; // +Y(U), -Y(D)
                    else materialIndex = dir === 1 ? 4 : 5; // +Z(F), -Z(B)

                    const firstColor = faceCubies[0].material[materialIndex].color.getHex();
                    for (let i = 1; i < faceCubies.length; i++) {
                        if (faceCubies[i].material[materialIndex].color.getHex() !== firstColor) {
                            return; // 색상이 다르면 완성되지 않음
                        }
                    }
                }
            }

            // 모든 면의 색상이 같으면 완성
            stopTimer();
            // 축하 효과음이나 메시지를 추가할 수 있음
            // alert(`축하합니다! 기록: ${timerDisplay.textContent}`);
        }


        // 특정 레이어(면) 회전 실행
        function performLayerRotation(axis, value, angle, duration) {
            playRotateSound(); // 회전 시작 시 효과음 재생
            const pivot = new THREE.Group();
            scene.add(pivot);

            const activeCubies = [];
            const epsilon = 0.1;

            // 현재 큐비들의 월드 좌표를 기준으로 회전할 조각들 선택
            cubies.forEach(c => {
                const pos = new THREE.Vector3();
                c.getWorldPosition(pos);
                if (Math.abs(pos[axis] - value) < epsilon) {
                    activeCubies.push(c);
                }
            });

            activeCubies.forEach(c => pivot.attach(c));

            const startAngle = 0;
            const startTime = performance.now();

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease in-out
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                
                pivot.rotation[axis] = startAngle + angle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    pivot.rotation[axis] = angle;
                    pivot.updateMatrixWorld();
                    activeCubies.forEach(c => cubeGroup.attach(c));
                    scene.remove(pivot);
                    snapCubies();
                    isAnimating = false;
                    processQueue();
                    // 회전 애니메이션 종료 후 완성 체크
                    if (animationQueue.length === 0) {
                        checkCubeCompletion();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // 큐브 전체 회전 실행 (방향키 조작용)
        function performWholeRotation(axis, angle, duration) {
            playRotateSound(); // 회전 시작 시 효과음 재생
            const pivot = new THREE.Group();
            scene.add(pivot);
            cubies.forEach(c => pivot.attach(c));

            const startAngle = 0;
            const startTime = performance.now();

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                pivot.rotation[axis] = startAngle + angle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    pivot.rotation[axis] = angle;
                    pivot.updateMatrixWorld();
                    cubies.forEach(c => cubeGroup.attach(c));
                    scene.remove(pivot);
                    snapCubies();
                    isAnimating = false;
                    processQueue();
                    // 회전 애니메이션 종료 후 완성 체크
                    if (animationQueue.length === 0) {
                        checkCubeCompletion();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // --- 큐브 섞기 알고리즘 ---
        function scramble() {
            resetTimer(); // 섞기 전 타이머 리셋
            animationQueue = []; // 큐 비우기
            const moves = currentSize === 2 ? 25 : 40;
            const axes = ['x', 'y', 'z'];
            const angles = [Math.PI/2, -Math.PI/2];
            
            // 섞을 때는 중간 레이어도 포함 가능하도록 설정
            const max = (currentSize - 1) / 2;
            let values = [];
            for(let v = -max; v <= max; v++) values.push(v);

            for(let i = 0; i < moves; i++) {
                const axis = axes[Math.floor(Math.random() * axes.length)];
                const angle = angles[Math.floor(Math.random() * angles.length)];
                const val = values[Math.floor(Math.random() * values.length)];
                // duration을 짧게(30ms) 주어 빠르게 섞이는 효과 연출
                queueLayerRotation(axis, val, angle, 40);
            }
            
            // 섞기가 완료되면 타이머 시작
            // 큐에 마지막으로 더미 애니메이션을 추가하여 섞기가 끝났음을 감지하고 타이머를 시작하도록 함
             animationQueue.push({ type: 'startTimer', duration: 0 });
        }

        // --- 윈도우 리사이즈 대응 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 렌더링 루프 ---
        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
