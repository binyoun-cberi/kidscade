<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidscade - 신나는 학습 오락실!</title>
<link rel="icon" type="image/png" href="assets/gate-image/favicon.png">
<meta name="theme-color" content="#7c3aed">
<meta name="kidscade-build" content="__KIDSCADE_BUILD__">
<style>
html,body{margin:0;min-height:100%;background:#e0f2fe;font-family:'Comic Sans MS','맑은 고딕',sans-serif;color:#334155}
#kidscade-loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.loader-card{background:#fff;border:5px solid #ffcc00;border-radius:28px;padding:28px 34px;box-shadow:0 14px 35px rgba(15,23,42,.15)}
.loader-icon{font-size:56px}.loader-title{font-size:24px;font-weight:900;color:#ff6b81;margin-top:8px}.loader-note{margin-top:7px;font-size:13px;color:#64748b}.loader-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.loader-btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:900;cursor:pointer}
.loader-btn-primary{background:#7c3aed;color:#fff;box-shadow:0 8px 18px rgba(124,58,237,.22)}
.loader-btn-secondary{background:#eef2ff;color:#4338ca}
.loader-help{margin-top:12px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div id="kidscade-loader">
  <div class="loader-card">
    <div class="loader-icon">🎮</div>
    <div class="loader-title">KIDSCADE 불러오는 중...</div>
    <div class="loader-note">게임 목록을 준비하고 있어요.</div>
  </div>
</div>
<script src="main-bootstrap.js?v=__KIDSCADE_BUILD__"></script>
</body>
</html>
