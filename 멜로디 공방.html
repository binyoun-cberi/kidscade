<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>멜로디 공방</title>
<style>
  :root{
    --ink:#2d2942;
    --muted:#7d7893;
    --paper:#fffdf8;
    --cream:#f7f1e8;
    --panel:#ffffff;
    --violet:#6557c8;
    --violet-deep:#46379f;
    --coral:#ff7f6d;
    --mint:#60c6ad;
    --yellow:#f4c85a;
    --sky:#79b9e8;
    --danger:#d95768;
    --line:#ddd6cd;
    --shadow:0 24px 70px rgba(59,46,104,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#f9f4eb 0%,#f3efff 48%,#edf8f5 100%);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  button,input{font:inherit}
  button{touch-action:manipulation}
  .app{min-height:100vh;padding:22px}
  .studio{width:min(1720px,100%);min-height:calc(100vh - 44px);margin:0 auto;border:1px solid rgba(93,77,161,.12);border-radius:32px;background:rgba(255,255,255,.86);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden;display:flex;flex-direction:column}
  .topbar{height:86px;padding:0 24px 0 28px;display:flex;align-items:center;gap:18px;border-bottom:1px solid rgba(88,72,153,.12);background:rgba(255,255,255,.92)}
  .brand{display:flex;align-items:center;gap:14px;min-width:240px}
  .brand-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,var(--violet),#897bdd);display:grid;place-items:center;color:#fff;font-family:"Segoe UI Symbol","Noto Music",serif;font-size:28px;box-shadow:0 10px 24px rgba(101,87,200,.28);transform:rotate(-3deg)}
  .brand-copy strong{display:block;font-size:22px;letter-spacing:-.04em}
  .brand-copy span{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.03em}
  .top-chips{display:flex;align-items:center;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none}
  .top-chips::-webkit-scrollbar{display:none}
  .chip{height:36px;padding:0 13px;border-radius:999px;background:#f3f0fb;color:#655f7b;display:inline-flex;align-items:center;white-space:nowrap;font-size:13px;font-weight:900}
  .chip.accent{background:#fff1d8;color:#8c691a}
  .top-actions{display:flex;align-items:center;gap:9px}
  .header-btn{height:42px;padding:0 15px;border:0;border-radius:13px;background:#f2eff8;color:#5d5674;font-size:14px;font-weight:900;cursor:pointer;transition:.18s ease}
  .header-btn:hover{transform:translateY(-2px);background:#ebe6f8}
  .workspace{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
  .toolbox{padding:22px 18px 24px;border-right:1px solid rgba(88,72,153,.12);background:linear-gradient(180deg,#faf8ff 0%,#fffaf4 100%);overflow-y:auto}
  .toolbox-title{margin:0 6px 14px;font-size:14px;font-weight:1000;color:#817a96;letter-spacing:.02em}
  .tool-card{padding:15px;border-radius:22px;background:#fff;border:1px solid rgba(89,72,155,.10);box-shadow:0 10px 30px rgba(64,50,112,.07)}
  .tool-card + .tool-card{margin-top:14px}
  .tool-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .tool-card-head strong{font-size:15px}
  .tool-card-head span{font-size:11px;color:var(--muted);font-weight:800}
  .tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .music-tool{height:68px;border:1px solid transparent;border-radius:16px;background:#f5f2fb;color:#39344d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.16s ease;position:relative}
  .music-tool .symbol{font-family:"Segoe UI Symbol","Noto Music","Arial Unicode MS",serif;font-size:29px;line-height:1}
  .music-tool .tool-name{font-size:10px;font-weight:900;color:#77718c}
  .music-tool:hover{transform:translateY(-2px);background:#eee9fb}
  .music-tool.active{background:linear-gradient(150deg,var(--violet),#8174dc);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:0 9px 20px rgba(101,87,200,.26)}
  .music-tool.active .tool-name{color:#fff}
  .rest-grid .music-tool{background:#eff8f5}
  .rest-grid .music-tool:hover{background:#e4f3ee}
  .rest-grid .music-tool.active{background:linear-gradient(145deg,#3eb497,var(--mint));box-shadow:0 9px 20px rgba(67,178,151,.24)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mode-btn{height:48px;border:0;border-radius:14px;background:#fff0ee;color:#a24f45;font-size:13px;font-weight:1000;cursor:pointer;transition:.16s ease}
  .mode-btn:hover{transform:translateY(-2px);background:#ffe6e2}
  .mode-btn.active{background:var(--coral);color:#fff;box-shadow:0 9px 20px rgba(255,127,109,.24)}
  .mode-btn.danger{background:#f7eff1;color:#a34857}
  .tip-card{margin-top:14px;padding:15px 16px;border-radius:20px;background:#312d46;color:#fff;box-shadow:0 12px 24px rgba(49,45,70,.18)}
  .tip-card strong{display:block;font-size:13px;margin-bottom:5px}
  .tip-card p{margin:0;color:#d8d2e6;font-size:11px;line-height:1.6;font-weight:700}
  .main-stage{min-width:0;padding:24px;overflow:auto;background:radial-gradient(circle at 20% 0%,rgba(244,200,90,.09),transparent 34%),linear-gradient(180deg,#fbfaf8 0%,#f6f3ef 100%)}
  .composer-card{max-width:1360px;margin:0 auto;background:var(--paper);border:1px solid rgba(96,81,55,.13);border-radius:28px;box-shadow:0 20px 46px rgba(72,59,40,.10);overflow:hidden;position:relative}
  .composer-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(to bottom,var(--coral) 0 36px,var(--yellow) 36px 72px,var(--mint) 72px 108px,var(--violet) 108px 144px)}
  .paper-head{padding:28px 36px 22px 46px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:24px;align-items:end;border-bottom:1px dashed #ddd4c8}
  .title-wrap label{display:block;margin:0 0 7px 4px;color:#8d867a;font-size:11px;font-weight:1000;letter-spacing:.08em}
  .title-input,.name-input,.lyric-input,.tempo-input{border:0;outline:none;color:var(--ink);transition:.15s ease}
  .title-input{width:100%;height:58px;padding:0 4px;background:transparent;border-bottom:3px solid #ded5c8;font-size:30px;font-weight:1000;letter-spacing:-.05em}
  .title-input:focus{border-bottom-color:var(--violet)}
  .credits{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .credit-pair{display:grid;grid-template-columns:58px 148px;align-items:center;gap:8px}
  .credit-pair span{font-size:12px;font-weight:1000;color:#827b70;text-align:right}
  .name-input{height:44px;padding:0 12px;border-radius:12px;background:#f4efe7;font-size:15px;font-weight:900;text-align:center}
  .name-input:focus,.lyric-input:focus,.tempo-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(101,87,200,.16)}
  .score-area{padding:18px 28px 0 40px}
  .score-badge-row{display:flex;align-items:center;justify-content:space-between;margin:0 6px 6px;color:#948b7e;font-size:11px;font-weight:900}
  .score-badge-row .guide{display:flex;gap:7px}
  .mini-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--coral);box-shadow:14px 0 0 var(--yellow),28px 0 0 var(--mint)}
  .score-wrap{position:relative;background:#fff;border:1px solid #e6ded3;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 6px #fff,0 9px 24px rgba(71,57,35,.06)}
  #score{display:block;width:100%;height:auto;min-height:390px;user-select:none;-webkit-user-select:none;touch-action:none}
  .staff-hit{cursor:crosshair}
  .score-item{cursor:pointer;transition:opacity .12s ease,filter .12s ease}
  .score-item:hover{filter:drop-shadow(0 0 5px rgba(101,87,200,.45))}
  .score-item.playing>*{stroke:var(--coral)!important;fill:var(--coral)!important}
  .score-item.playing text{fill:var(--coral)!important}
  .score-item.erase-target:hover{opacity:.35}
  .measure-fill{font-size:15px;font-weight:900;fill:#a49a8d}
  .lyrics{padding:16px 34px 24px 146px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .lyric-input{height:52px;min-width:0;padding:0 12px;border-radius:13px;background:#f6f1e9;border:1px solid #ece2d5;text-align:center;font-size:14px;font-weight:900}
  .control-deck{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:18px 34px 22px 46px;background:#342f49;color:#fff}
  .tiny-actions{display:flex;gap:8px}
  .tiny-btn{height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:900;cursor:pointer}
  .tiny-btn:disabled{opacity:.35;cursor:default}
  .transport{display:flex;align-items:center;gap:10px}
  .transport-label{margin-right:4px;color:#d8d3e6;font-size:12px;font-weight:900}
  .round-btn{width:48px;height:48px;border:0;border-radius:16px;background:var(--coral);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 9px 20px rgba(255,127,109,.24)}
  .round-btn.stop{background:rgba(255,255,255,.12);box-shadow:none;font-size:14px}
  .tempo-wrap{display:flex;align-items:center;gap:7px;margin-left:8px;color:#ddd8e7;font-size:12px;font-weight:900}
  .tempo-input{width:66px;height:38px;padding:0 7px;border-radius:11px;background:#fff;color:#342f49;text-align:center;font-size:14px;font-weight:1000}
  .actions{justify-self:end;display:flex;align-items:center;gap:9px}
  .save-wrap{position:relative}
  .save-btn{height:46px;padding:0 18px;border:0;border-radius:14px;background:var(--yellow);color:#4c3a12;font-size:14px;font-weight:1000;cursor:pointer;box-shadow:0 10px 20px rgba(244,200,90,.20)}
  .save-menu{position:absolute;right:0;bottom:56px;min-width:156px;padding:7px;border:1px solid #ddd5e7;border-radius:15px;background:#fff;box-shadow:0 16px 34px rgba(31,24,55,.22);display:none;z-index:5}
  .save-menu.open{display:block}
  .save-menu button{width:100%;height:42px;border:0;border-radius:10px;background:#fff;color:#40394f;text-align:left;padding:0 12px;font-weight:900;cursor:pointer}
  .save-menu button:hover{background:#f2eff9}
  .kbd-hint{max-width:1360px;margin:12px auto 0;color:#8f8799;text-align:center;font-size:11px;font-weight:800}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:13px 18px;border-radius:14px;background:#2e2940;color:#fff;font-weight:900;opacity:0;pointer-events:none;transition:.22s ease;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.warn{background:var(--danger)}
  @media (max-width:1180px){
    .workspace{grid-template-columns:250px minmax(0,1fr)}
    .toolbox{padding:18px 13px}
    .music-tool{height:62px}
    .paper-head{grid-template-columns:1fr}
    .credits{justify-content:flex-start}
  }
  @media (max-width:900px){
    .app{padding:0}
    .studio{min-height:100vh;border-radius:0;border:0}
    .topbar{height:auto;padding:13px 14px;flex-wrap:wrap}
    .brand{min-width:0;flex:1}
    .brand-copy span{display:none}
    .top-chips{order:3;width:100%}
    .workspace{display:block}
    .toolbox{border-right:0;border-bottom:1px solid rgba(88,72,153,.12);overflow-x:auto;overflow-y:hidden;display:flex;gap:12px;padding:14px}
    .toolbox-title,.tip-card{display:none}
    .tool-card{min-width:310px;margin:0!important;padding:12px}
    .main-stage{padding:14px 10px 20px}
    .paper-head{padding:22px 22px 18px 30px}
    .score-area{padding:14px 12px 0 24px}
    .lyrics{padding-left:100px;padding-right:18px}
    .control-deck{grid-template-columns:1fr;justify-items:center;padding:16px 20px}
    .tiny-actions,.actions{justify-self:center}
  }
  @media (max-width:640px){
    .brand-copy strong{font-size:18px}
    .brand-mark{width:42px;height:42px}
    .header-btn{padding:0 10px}
    .top-chips{display:none}
    .tool-card{min-width:292px}
    .composer-card{border-radius:20px}
    .title-input{font-size:24px}
    .credit-pair{grid-template-columns:46px 125px}
    .score-wrap{overflow-x:auto}
    #score{width:980px;max-width:none}
    .lyrics{padding-left:66px;grid-template-columns:repeat(2,1fr)}
    .kbd-hint{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <main class="studio">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">♫</div>
        <div class="brand-copy">
          <strong>멜로디 공방</strong>
          <span>나만의 노래를 직접 만들어 보세요</span>
        </div>
      </div>
      <div class="top-chips" aria-label="악보 정보">
        <span class="chip accent">4/4 박자</span>
        <span class="chip">높은음자리표</span>
        <span class="chip">4마디</span>
        <span class="chip">자동 저장</span>
      </div>
      <div class="top-actions">
        <button class="header-btn" id="undoBtn">↶ 되돌리기</button>
        <button class="header-btn" id="redoBtn">↷ 다시하기</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="toolbox" aria-label="작곡 도구">
        <p class="toolbox-title">작곡 도구</p>

        <section class="tool-card" id="noteTools">
          <div class="tool-card-head"><strong>음표</strong><span>길이를 선택하세요</span></div>
          <div class="tool-grid">
            <button class="music-tool" data-kind="note" data-key="sixteenth" title="16분음표"><span class="symbol">𝅘𝅥𝅯</span><span class="tool-name">16분</span></button>
            <button class="music-tool" data-kind="note" data-key="eighth" title="8분음표"><span class="symbol">♪</span><span class="tool-name">8분</span></button>
            <button class="music-tool" data-kind="note" data-key="dottedEighth" title="점8분음표"><span class="symbol">♪·</span><span class="tool-name">점8분</span></button>
            <button class="music-tool active" data-kind="note" data-key="quarter" title="4분음표"><span class="symbol">♩</span><span class="tool-name">4분</span></button>
            <button class="music-tool" data-kind="note" data-key="dottedQuarter" title="점4분음표"><span class="symbol">♩·</span><span class="tool-name">점4분</span></button>
            <button class="music-tool" data-kind="note" data-key="half" title="2분음표"><span class="symbol">𝅗𝅥</span><span class="tool-name">2분</span></button>
            <button class="music-tool" data-kind="note" data-key="dottedHalf" title="점2분음표"><span class="symbol">𝅗𝅥·</span><span class="tool-name">점2분</span></button>
            <button class="music-tool" data-kind="note" data-key="whole" title="온음표"><span class="symbol">𝅝</span><span class="tool-name">온음표</span></button>
          </div>
        </section>

        <section class="tool-card" id="restTools">
          <div class="tool-card-head"><strong>쉼표</strong><span>쉬는 길이를 선택하세요</span></div>
          <div class="tool-grid rest-grid">
            <button class="music-tool" data-kind="rest" data-key="sixteenth" title="16분쉼표"><span class="symbol">𝄿</span><span class="tool-name">16분</span></button>
            <button class="music-tool" data-kind="rest" data-key="eighth" title="8분쉼표"><span class="symbol">𝄾</span><span class="tool-name">8분</span></button>
            <button class="music-tool" data-kind="rest" data-key="dottedEighth" title="점8분쉼표"><span class="symbol">𝄾·</span><span class="tool-name">점8분</span></button>
            <button class="music-tool" data-kind="rest" data-key="quarter" title="4분쉼표"><span class="symbol">𝄽</span><span class="tool-name">4분</span></button>
            <button class="music-tool" data-kind="rest" data-key="dottedQuarter" title="점4분쉼표"><span class="symbol">𝄽·</span><span class="tool-name">점4분</span></button>
            <button class="music-tool" data-kind="rest" data-key="half" title="2분쉼표"><span class="symbol">𝄼</span><span class="tool-name">2분</span></button>
            <button class="music-tool" data-kind="rest" data-key="whole" title="온쉼표"><span class="symbol">𝄻</span><span class="tool-name">온쉼표</span></button>
          </div>
        </section>

        <section class="tool-card">
          <div class="tool-card-head"><strong>편집</strong><span>음표를 정리해요</span></div>
          <div class="edit-grid">
            <button class="mode-btn" id="eraseOne">하나 지우기</button>
            <button class="mode-btn danger" id="eraseAll">전체 비우기</button>
          </div>
        </section>

        <div class="tip-card">
          <strong>작곡하는 방법</strong>
          <p>음표를 고른 뒤 오선의 원하는 높이를 누르세요. 한 마디에는 4박까지 넣을 수 있어요.</p>
        </div>
      </aside>

      <section class="main-stage">
        <div class="composer-card">
          <div class="paper-head">
            <div class="title-wrap">
              <label for="titleInput">SONG TITLE</label>
              <input id="titleInput" class="title-input" maxlength="28" placeholder="곡 제목을 적어 주세요" aria-label="곡 제목">
            </div>
            <div class="credits">
              <label class="credit-pair"><span>작사</span><input id="lyricistInput" class="name-input" maxlength="12" placeholder="이름" aria-label="작사자 이름"></label>
              <label class="credit-pair"><span>작곡</span><input id="composerInput" class="name-input" maxlength="12" placeholder="이름" aria-label="작곡자 이름"></label>
            </div>
          </div>

          <div class="score-area">
            <div class="score-badge-row">
              <span class="mini-dot" aria-hidden="true"></span>
              <div class="guide"><span>오선을 눌러 음표 넣기</span><span>·</span><span>음표를 다시 눌러 선택</span></div>
            </div>
            <div class="score-wrap">
              <svg id="score" viewBox="0 0 1600 420" role="img" aria-label="4마디 오선 악보"></svg>
            </div>
          </div>

          <div class="lyrics" aria-label="마디별 노랫말">
            <input class="lyric-input" data-lyric="0" maxlength="24" placeholder="1마디 노랫말">
            <input class="lyric-input" data-lyric="1" maxlength="24" placeholder="2마디 노랫말">
            <input class="lyric-input" data-lyric="2" maxlength="24" placeholder="3마디 노랫말">
            <input class="lyric-input" data-lyric="3" maxlength="24" placeholder="4마디 노랫말">
          </div>

          <div class="control-deck">
            <div class="tiny-actions" aria-hidden="true"></div>
            <div class="transport">
              <span class="transport-label">미리 듣기</span>
              <button class="round-btn" id="playBtn" aria-label="재생">▶</button>
              <button class="round-btn stop" id="stopBtn" aria-label="정지">■</button>
              <label class="tempo-wrap">BPM <input id="tempoInput" class="tempo-input" type="number" min="50" max="180" step="1" value="100" aria-label="빠르기 BPM"></label>
            </div>
            <div class="actions">
              <div class="save-wrap">
                <button class="save-btn" id="saveBtn">악보 내보내기</button>
                <div class="save-menu" id="saveMenu">
                  <button data-save="png">PNG 이미지로 저장</button>
                  <button data-save="svg">SVG 악보로 저장</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="kbd-hint">숫자 1~5 음표 길이 · Space 재생 · Delete 마지막 음표 지우기 · Ctrl+Z 되돌리기</div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';

  const score = document.getElementById('score');
  const titleInput = document.getElementById('titleInput');
  const lyricistInput = document.getElementById('lyricistInput');
  const composerInput = document.getElementById('composerInput');
  const tempoInput = document.getElementById('tempoInput');
  const eraseOneBtn = document.getElementById('eraseOne');
  const eraseAllBtn = document.getElementById('eraseAll');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const saveBtn = document.getElementById('saveBtn');
  const saveMenu = document.getElementById('saveMenu');
  const toast = document.getElementById('toast');
  const lyricInputs = [...document.querySelectorAll('[data-lyric]')];

  const DURATIONS = {
    sixteenth: { beats: 0.25, flags: 2, name: '16분' },
    eighth: { beats: 0.5, flags: 1, name: '8분' },
    dottedEighth: { beats: 0.75, flags: 1, dotted: true, name: '점8분' },
    quarter: { beats: 1, flags: 0, name: '4분' },
    dottedQuarter: { beats: 1.5, flags: 0, dotted: true, name: '점4분' },
    half: { beats: 2, flags: 0, hollow: true, name: '2분' },
    dottedHalf: { beats: 3, flags: 0, hollow: true, dotted: true, name: '점2분' },
    whole: { beats: 4, flags: 0, hollow: true, whole: true, name: '온' }
  };

  const PITCHES = [
    {name:'도', midi:60}, {name:'레', midi:62}, {name:'미', midi:64},
    {name:'파', midi:65}, {name:'솔', midi:67}, {name:'라', midi:69},
    {name:'시', midi:71}, {name:'도', midi:72}, {name:'레', midi:74},
    {name:'미', midi:76}, {name:'파', midi:77}, {name:'솔', midi:79},
    {name:'라', midi:81}
  ];

  const MEASURE_START = 170;
  const MEASURE_WIDTH = 345;
  const STAFF_TOP = 170;
  const STAFF_BOTTOM = 250;
  const PITCH_BOTTOM_Y = 266;
  const PITCH_STEP = 10;
  const STORAGE_KEY = 'score-playground-v1';

  const defaultState = () => ({
    selected: {kind:'note', key:'quarter'},
    eraseMode: false,
    measures: [[],[],[],[]],
    title: '', lyricist: '', composer: '',
    lyrics: ['', '', '', ''],
    tempo: 100,
    playingId: null
  });

  let state = defaultState();
  let undoStack = [];
  let redoStack = [];
  let playbackToken = 0;
  let audioCtx = null;
  let toastTimer = null;

  function uid(){
    return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }

  function snapshot(){
    return JSON.stringify({
      selected: state.selected,
      eraseMode: state.eraseMode,
      measures: state.measures,
      title: state.title,
      lyricist: state.lyricist,
      composer: state.composer,
      lyrics: state.lyrics,
      tempo: state.tempo
    });
  }

  function restore(json){
    try{
      const parsed = JSON.parse(json);
      const next = defaultState();
      next.selected = parsed.selected && DURATIONS[parsed.selected.key] ? parsed.selected : next.selected;
      next.eraseMode = Boolean(parsed.eraseMode);
      next.measures = Array.isArray(parsed.measures) && parsed.measures.length === 4 ? parsed.measures : next.measures;
      next.title = String(parsed.title || '');
      next.lyricist = String(parsed.lyricist || '');
      next.composer = String(parsed.composer || '');
      next.lyrics = Array.isArray(parsed.lyrics) ? parsed.lyrics.slice(0,4).map(v => String(v || '')) : next.lyrics;
      while(next.lyrics.length < 4) next.lyrics.push('');
      next.tempo = Math.max(50, Math.min(180, Number(parsed.tempo) || 100));
      state = next;
      syncInputs();
      renderAll();
    }catch(error){
      console.warn(error);
    }
  }

  function pushUndo(){
    undoStack.push(snapshot());
    if(undoStack.length > 60) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function saveLocal(){
    localStorage.setItem(STORAGE_KEY, snapshot());
  }

  function loadLocal(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) restore(saved);
    else syncInputs();
  }

  function syncInputs(){
    titleInput.value = state.title;
    lyricistInput.value = state.lyricist;
    composerInput.value = state.composer;
    tempoInput.value = state.tempo;
    lyricInputs.forEach((input, index) => input.value = state.lyrics[index] || '');
  }

  function showToast(message, warn=false){
    toast.textContent = message;
    toast.className = 'toast show' + (warn ? ' warn' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.className = 'toast', 1700);
  }

  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  function setSelection(kind, key){
    if(!DURATIONS[key]) return;
    state.selected = {kind, key};
    state.eraseMode = false;
    eraseOneBtn.classList.remove('active');
    renderToolbar();
    saveLocal();
    clickSound(660, .045);
  }

  function renderToolbar(){
    document.querySelectorAll('[data-kind][data-key]').forEach(button => {
      button.classList.toggle('active', button.dataset.kind === state.selected.kind && button.dataset.key === state.selected.key && !state.eraseMode);
    });
    eraseOneBtn.classList.toggle('active', state.eraseMode);
  }

  function beatsUsed(measure){
    return measure.reduce((sum, item) => sum + (DURATIONS[item.key]?.beats || 0), 0);
  }

  function itemX(measureIndex, beatStart, beats){
    const start = MEASURE_START + measureIndex * MEASURE_WIDTH;
    const usable = MEASURE_WIDTH - 58;
    const centerBeat = beatStart + Math.min(beats, 1.2) * .42;
    return start + 28 + (centerBeat / 4) * usable;
  }

  function pitchY(pitchIndex){
    return PITCH_BOTTOM_Y - pitchIndex * PITCH_STEP;
  }

  function staffMarkup(includeGuides=true){
    let html = `
      <rect x="0" y="0" width="1600" height="420" fill="#fff"/>
      <g class="staff-hit">
    `;
    for(let i=0;i<5;i++){
      const y = STAFF_TOP + i*20;
      html += `<line x1="28" y1="${y}" x2="1565" y2="${y}" stroke="#202020" stroke-width="1.4"/>`;
    }
    for(let i=0;i<4;i++){
      const x = MEASURE_START + (i+1)*MEASURE_WIDTH;
      html += `<line x1="${x}" y1="${STAFF_TOP}" x2="${x}" y2="${STAFF_BOTTOM}" stroke="#202020" stroke-width="1.8"/>`;
    }
    html += `<line x1="1556" y1="${STAFF_TOP}" x2="1556" y2="${STAFF_BOTTOM}" stroke="#202020" stroke-width="3"/>
             <line x1="1565" y1="${STAFF_TOP}" x2="1565" y2="${STAFF_BOTTOM}" stroke="#202020" stroke-width="7"/>`;

    html += `<text x="48" y="257" font-family="Segoe UI Symbol,Noto Music,serif" font-size="112" fill="#000">𝄞</text>
             <text x="132" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="700">4</text>
             <text x="132" y="245" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="700">4</text>`;

    state.measures.forEach((measure, measureIndex) => {
      let beatCursor = 0;
      measure.forEach(item => {
        const info = DURATIONS[item.key] || DURATIONS.quarter;
        const x = itemX(measureIndex, beatCursor, info.beats);
        const y = item.kind === 'rest' ? 210 : pitchY(item.pitch);
        html += item.kind === 'rest' ? restMarkup(item, x, y, info) : noteMarkup(item, x, y, info);
        beatCursor += info.beats;
      });
      if(includeGuides){
        const used = beatsUsed(measure);
        const label = used === 0 ? '' : `${used}/4박`;
        html += `<text class="measure-fill" x="${MEASURE_START + measureIndex*MEASURE_WIDTH + MEASURE_WIDTH/2}" y="315" text-anchor="middle">${label}</text>`;
      }
    });

    html += `</g>`;
    return html;
  }

  function ledgerLines(x, pitch){
    let lines = '';
    if(pitch <= 0){
      lines += `<line x1="${x-20}" y1="270" x2="${x+20}" y2="270" stroke="#111" stroke-width="1.5"/>`;
    }
    if(pitch >= 12){
      lines += `<line x1="${x-20}" y1="150" x2="${x+20}" y2="150" stroke="#111" stroke-width="1.5"/>`;
    }
    return lines;
  }

  function noteMarkup(item, x, y, info){
    const playingClass = state.playingId === item.id ? ' playing' : '';
    const eraseClass = state.eraseMode ? ' erase-target' : '';
    const fill = info.hollow ? '#fff' : '#111';
    const stroke = '#111';
    let body = ledgerLines(x, item.pitch);
    body += `<ellipse cx="${x}" cy="${y}" rx="13" ry="9" transform="rotate(-18 ${x} ${y})" fill="${fill}" stroke="${stroke}" stroke-width="2.7"/>`;
    if(!info.whole){
      const stemUp = item.pitch < 7;
      const stemX = stemUp ? x+11 : x-11;
      const stemTop = stemUp ? y-58 : y+58;
      body += `<line x1="${stemX}" y1="${y}" x2="${stemX}" y2="${stemTop}" stroke="#111" stroke-width="3" stroke-linecap="round"/>`;
      if(info.flags > 0){
        if(stemUp){
          body += `<path d="M ${stemX} ${stemTop} q 24 8 18 30 q -3 10 -13 15 q 8 -12 0 -25" fill="#111"/>`;
          if(info.flags > 1) body += `<path d="M ${stemX} ${stemTop+15} q 20 7 15 25 q -3 8 -11 12 q 7 -10 0 -21" fill="#111"/>`;
        }else{
          body += `<path d="M ${stemX} ${stemTop} q -24 -8 -18 -30 q 3 -10 13 -15 q -8 12 0 25" fill="#111"/>`;
          if(info.flags > 1) body += `<path d="M ${stemX} ${stemTop-15} q -20 -7 -15 -25 q 3 -8 11 -12 q -7 10 0 21" fill="#111"/>`;
        }
      }
    }
    if(info.dotted){
      body += `<circle cx="${x+23}" cy="${y-2}" r="3.4" fill="#111"/>`;
    }
    return `<g class="score-item${playingClass}${eraseClass}" data-item-id="${item.id}" aria-label="${PITCHES[item.pitch]?.name || ''} ${info.name}음표">${body}</g>`;
  }

  function restMarkup(item, x, y, info){
    const playingClass = state.playingId === item.id ? ' playing' : '';
    const eraseClass = state.eraseMode ? ' erase-target' : '';
    const symbolMap = {whole:'𝄻',half:'𝄼',quarter:'𝄽',eighth:'𝄾',dottedEighth:'𝄾',sixteenth:'𝄿',dottedQuarter:'𝄽',dottedHalf:'𝄼'};
    const symbol = symbolMap[item.key] || '𝄽';
    const dot = info.dotted ? `<circle cx="${x+24}" cy="${y+2}" r="3.4" fill="#111"/>` : '';
    return `<g class="score-item${playingClass}${eraseClass}" data-item-id="${item.id}" aria-label="${info.name}쉼표">
      <text x="${x}" y="${y+17}" text-anchor="middle" font-family="Segoe UI Symbol,Noto Music,Arial Unicode MS,serif" font-size="45" fill="#111">${symbol}</text>${dot}
    </g>`;
  }

  function renderScore(){
    score.innerHTML = staffMarkup(true);
  }

  function renderAll(){
    renderToolbar();
    renderScore();
    updateHistoryButtons();
  }

  function svgPoint(event){
    const rect = score.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * 1600 / rect.width,
      y: (event.clientY - rect.top) * 420 / rect.height
    };
  }

  function addItem(measureIndex, pitch){
    const duration = DURATIONS[state.selected.key];
    if(!duration) return;
    const used = beatsUsed(state.measures[measureIndex]);
    if(used + duration.beats > 4.0001){
      showToast('이 마디에는 더 넣을 수 없어요.', true);
      errorSound();
      return;
    }
    pushUndo();
    state.measures[measureIndex].push({
      id: uid(),
      kind: state.selected.kind,
      key: state.selected.key,
      pitch: Math.max(0, Math.min(12, pitch))
    });
    renderScore();
    saveLocal();
    clickSound(state.selected.kind === 'note' ? 740 : 420, .05);
  }

  function removeItem(id){
    for(let i=0;i<state.measures.length;i++){
      const index = state.measures[i].findIndex(item => item.id === id);
      if(index >= 0){
        pushUndo();
        state.measures[i].splice(index,1);
        renderScore();
        saveLocal();
        clickSound(280,.05);
        return;
      }
    }
  }

  function removeLast(){
    for(let i=state.measures.length-1;i>=0;i--){
      if(state.measures[i].length){
        pushUndo();
        state.measures[i].pop();
        renderScore();
        saveLocal();
        clickSound(280,.05);
        return true;
      }
    }
    return false;
  }

  function clearAll(){
    if(!state.measures.some(m => m.length)){
      showToast('지울 음표가 없어요.');
      return;
    }
    pushUndo();
    state.measures = [[],[],[],[]];
    stopPlayback();
    renderScore();
    saveLocal();
    showToast('악보를 모두 지웠어요.');
  }

  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
    saveLocal();
    updateHistoryButtons();
  }

  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    saveLocal();
    updateHistoryButtons();
  }

  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function clickSound(freq=620, duration=.04){
    try{
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.045, ctx.currentTime+.006);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+duration+.02);
    }catch(_){ }
  }

  function errorSound(){
    clickSound(190,.09);
    setTimeout(() => clickSound(150,.09),75);
  }

  function midiToFreq(midi){
    return 440 * Math.pow(2,(midi-69)/12);
  }

  function playTone(midi, seconds){
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(midiToFreq(midi),ctx.currentTime);
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);
    gain.gain.setValueAtTime(.12,Math.max(ctx.currentTime+.03,ctx.currentTime+seconds*.72));
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+seconds*.94);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+seconds);
  }

  function sleep(ms){ return new Promise(resolve => setTimeout(resolve,ms)); }

  async function playScore(){
    stopPlayback();
    if(!state.measures.some(m => m.length)){
      showToast('먼저 음표를 넣어 주세요.', true);
      return;
    }
    const token = ++playbackToken;
    playBtn.textContent = '❚❚';
    const beatMs = 60000 / Math.max(50,Math.min(180,Number(state.tempo)||100));
    for(let measureIndex=0; measureIndex<4; measureIndex++){
      let used = 0;
      for(const item of state.measures[measureIndex]){
        if(token !== playbackToken) return;
        const info = DURATIONS[item.key] || DURATIONS.quarter;
        const durationMs = info.beats * beatMs;
        state.playingId = item.id;
        renderScore();
        if(item.kind === 'note') playTone(PITCHES[item.pitch]?.midi || 60, Math.max(.07,durationMs/1000*.9));
        await sleep(durationMs);
        used += info.beats;
      }
      if(token !== playbackToken) return;
      const remain = Math.max(0,4-used);
      if(remain) await sleep(remain*beatMs);
    }
    if(token === playbackToken){
      state.playingId = null;
      playBtn.textContent = '▶';
      renderScore();
    }
  }

  function stopPlayback(){
    playbackToken++;
    state.playingId = null;
    playBtn.textContent = '▶';
    renderScore();
  }

  function buildExportSvg(){
    const title = escapeHtml(state.title || '나의 악보');
    const lyricist = escapeHtml(state.lyricist);
    const composer = escapeHtml(state.composer);
    const exportStaff = staffMarkup(false).replace('<rect x="0" y="0" width="1600" height="420" fill="#fff"/>','');
    const lyricSvg = state.lyrics.map((text,index) => {
      const x = MEASURE_START + index*MEASURE_WIDTH + MEASURE_WIDTH/2;
      return `<text x="${x}" y="555" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#5d6672">${escapeHtml(text)}</text>`;
    }).join('');
    return `<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650">
        <rect width="1600" height="650" fill="white"/>
        <text x="800" y="74" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="42" font-weight="800" fill="#263246">${title}</text>
        <text x="1500" y="116" text-anchor="end" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#333">${lyricist ? lyricist+' 작사' : ''}</text>
        <text x="1500" y="148" text-anchor="end" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#333">${composer ? composer+' 작곡' : ''}</text>
        <g transform="translate(0,100)">${exportStaff}</g>
        ${lyricSvg}
      </svg>`;
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url),1000);
  }

  function safeFilename(){
    return (state.title || '나의_악보').trim().replace(/[\\/:*?"<>|]+/g,'_').slice(0,40) || '나의_악보';
  }

  function saveSvg(){
    const svgText = buildExportSvg();
    downloadBlob(new Blob([svgText],{type:'image/svg+xml;charset=utf-8'}), safeFilename()+'.svg');
    showToast('SVG 악보를 저장했어요.');
  }

  function savePng(){
    const svgText = buildExportSvg();
    const blob = new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1600; canvas.height = 650;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0);
      URL.revokeObjectURL(url);
      canvas.toBlob(png => {
        if(png){
          downloadBlob(png,safeFilename()+'.png');
          showToast('PNG 악보를 저장했어요.');
        }else{
          showToast('이미지 저장에 실패했어요.',true);
        }
      },'image/png');
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      showToast('이미지 저장에 실패했어요.',true);
    };
    image.src = url;
  }

  document.querySelectorAll('[data-kind][data-key]').forEach(button => {
    button.addEventListener('click',() => setSelection(button.dataset.kind,button.dataset.key));
  });

  score.addEventListener('pointerdown',event => {
    const item = event.target.closest('.score-item');
    if(state.eraseMode && item){
      event.preventDefault();
      removeItem(item.dataset.itemId);
      return;
    }
    const point = svgPoint(event);
    if(point.x < MEASURE_START || point.x > MEASURE_START + MEASURE_WIDTH*4 || point.y < 140 || point.y > 285) return;
    const measureIndex = Math.max(0,Math.min(3,Math.floor((point.x-MEASURE_START)/MEASURE_WIDTH)));
    const pitch = Math.round((PITCH_BOTTOM_Y-point.y)/PITCH_STEP);
    addItem(measureIndex,pitch);
  });

  eraseOneBtn.addEventListener('click',() => {
    state.eraseMode = !state.eraseMode;
    renderToolbar();
    saveLocal();
    clickSound(360,.05);
    showToast(state.eraseMode ? '지울 음표를 눌러 주세요.' : '지우기 모드를 끝냈어요.');
  });

  eraseAllBtn.addEventListener('click',() => {
    if(confirm('악보의 모든 음표와 쉼표를 지울까요?')) clearAll();
  });

  undoBtn.addEventListener('click',undo);
  redoBtn.addEventListener('click',redo);
  playBtn.addEventListener('click',() => state.playingId ? stopPlayback() : playScore());
  stopBtn.addEventListener('click',stopPlayback);

  const bindText = (element, key) => {
    element.addEventListener('input',() => {
      state[key] = element.value;
      saveLocal();
    });
  };
  bindText(titleInput,'title');
  bindText(lyricistInput,'lyricist');
  bindText(composerInput,'composer');

  lyricInputs.forEach((input,index) => {
    input.addEventListener('input',() => {
      state.lyrics[index] = input.value;
      saveLocal();
    });
  });

  tempoInput.addEventListener('change',() => {
    state.tempo = Math.max(50,Math.min(180,Number(tempoInput.value)||100));
    tempoInput.value = state.tempo;
    saveLocal();
  });

  saveBtn.addEventListener('click',event => {
    event.stopPropagation();
    saveMenu.classList.toggle('open');
  });
  saveMenu.addEventListener('click',event => {
    const type = event.target.dataset.save;
    if(!type) return;
    saveMenu.classList.remove('open');
    type === 'svg' ? saveSvg() : savePng();
  });
  document.addEventListener('click',() => saveMenu.classList.remove('open'));

  window.addEventListener('keydown',event => {
    const tag = document.activeElement?.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z'){
      event.preventDefault(); event.shiftKey ? redo() : undo(); return;
    }
    if((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y'){
      event.preventDefault(); redo(); return;
    }
    if(typing) return;
    const numberMap = {'1':'sixteenth','2':'eighth','3':'quarter','4':'half','5':'whole'};
    if(numberMap[event.key]) setSelection('note',numberMap[event.key]);
    if(event.code === 'Space'){
      event.preventDefault(); state.playingId ? stopPlayback() : playScore();
    }
    if(event.key === 'Backspace' || event.key === 'Delete'){
      event.preventDefault(); removeLast();
    }
    if(event.key.toLowerCase() === 'r') setSelection('rest',state.selected.key);
    if(event.key.toLowerCase() === 'n') setSelection('note',state.selected.key);
    if(event.key === 'Escape' && state.eraseMode){
      state.eraseMode = false; renderToolbar();
    }
  });

  loadLocal();
  renderAll();
})();
</script>
</body>
</html>
