<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>꼬마 조각가 스튜디오</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #dfe9f7;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 320px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 42px rgba(33, 58, 103, 0.18);
      z-index: 10;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .badge {
      flex: 0 0 auto;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #52637d;
      background: #eef4ff;
    }

    .section {
      margin-top: 13px;
    }

    .label {
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;
      color: #64748b;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 900;
      color: #26334d;
      background: #edf4ff;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.07), 0 2px 8px rgba(41, 69, 117, 0.08);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    button:hover {
      filter: brightness(0.99);
    }

    button.active {
      color: white;
      background: #3972ff;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18), 0 4px 12px rgba(57, 114, 255, 0.25);
    }

    button.danger {
      color: #b42332;
      background: #ffe8e8;
    }

    button.small {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 13px;
    }

    .sliderBox {
      display: grid;
      grid-template-columns: 58px 1fr 40px;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
      padding: 8px;
      border-radius: 16px;
      background: #f4f8ff;
    }

    .sliderBox span {
      font-size: 12px;
      font-weight: 900;
      color: #52637d;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3972ff;
    }

    .hint {
      margin-top: 12px;
      padding: 10px;
      border-radius: 16px;
      font-size: 12px;
      line-height: 1.45;
      color: #51627b;
      background: #f5f8ff;
    }

    .counter {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 999px;
      color: #31435f;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 14px 32px rgba(33, 58, 103, 0.16);
      font-size: 13px;
      font-weight: 950;
    }

    .bottomBar {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 14px 32px rgba(33, 58, 103, 0.16);
    }

    .materialSwatch {
      min-width: 70px;
      min-height: 46px;
      padding: 7px 9px;
      line-height: 1.1;
    }

    .materialSwatch small {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 800;
      opacity: 0.75;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 720px) {
      .panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: 43vh;
        padding: 12px;
        border-radius: 20px;
      }

      .title {
        font-size: 17px;
      }

      .hint {
        display: none;
      }

      .counter {
        top: auto;
        bottom: 78px;
        right: 10px;
      }

      .bottomBar {
        bottom: 10px;
      }

      button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .materialSwatch {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="panel">
    <div class="title">
      꼬마 조각가 스튜디오
      <span class="badge">HTML 한 파일</span>
    </div>

    <div class="section">
      <div class="label">도구</div>
      <div class="row">
        <button id="toolOrbit" class="active">돌려보기</button>
        <button id="toolPush">부풀리기</button>
        <button id="toolPress">누르기</button>
        <button id="toolCarve">깎기</button>
        <button id="toolSmooth">문지르기</button>
        <button id="toolFlatten">평평하게</button>
      </div>
    </div>

    <div class="section">
      <div class="label">브러시</div>
      <div class="sliderBox">
        <span>크기</span>
        <input id="radiusSlider" type="range" min="0.25" max="1.4" step="0.05" value="0.65" />
        <span id="radiusValue">0.65</span>
      </div>
      <div class="sliderBox">
        <span>힘</span>
        <input id="strengthSlider" type="range" min="0.01" max="0.22" step="0.01" value="0.08" />
        <span id="strengthValue">0.08</span>
      </div>
    </div>

    <div class="section">
      <div class="label">재료 느낌</div>
      <div class="row">
        <button class="materialSwatch active" data-material="clay">찰흙<small>손자국</small></button>
        <button class="materialSwatch" data-material="marble">대리석<small>결무늬</small></button>
        <button class="materialSwatch" data-material="wood">나무<small>나이테</small></button>
        <button class="materialSwatch" data-material="stone">돌<small>거친 표면</small></button>
        <button class="materialSwatch" data-material="plaster">석고<small>무광</small></button>
      </div>
    </div>

    <div class="section">
      <div class="label">작품</div>
      <div class="row">
        <button id="undoBtn" class="small">되돌리기</button>
        <button id="resetBtn" class="small danger">처음부터</button>
        <button id="savePngBtn" class="small">사진 저장</button>
        <button id="saveJsonBtn" class="small">파일 저장</button>
        <button id="loadJsonBtn" class="small">불러오기</button>
        <input id="fileInput" type="file" accept="application/json" />
      </div>
    </div>

    <div class="hint">
      <b>사용법</b><br>
      ① 돌려보기로 작품을 회전해요.<br>
      ② 부풀리기/누르기/깎기/문지르기로 표면을 만져요.<br>
      ③ 재료를 바꾸면 찰흙·나무·대리석 조각처럼 보여요.<br>
      키보드: 1 돌려보기, 2 부풀리기, 3 누르기, 4 깎기, 5 문지르기
    </div>
  </div>

  <div id="counter" class="counter">정점 0개</div>

  <div class="bottomBar">
    <button id="rotLeft" class="small">↶</button>
    <button id="zoomIn" class="small">＋</button>
    <button id="zoomOut" class="small">－</button>
    <button id="rotRight" class="small">↷</button>
  </div>
</div>

<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  const app = document.getElementById("app");
  const counter = document.getElementById("counter");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdfe9f7);

  const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x91a7c7, 1.8);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 2.3);
  sun.position.set(7, 12, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xbfd5ff, 0.9);
  fill.position.set(-6, 4, -7);
  scene.add(fill);

  const floorGeo = new THREE.CircleGeometry(5.5, 96);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0xf8fbff,
    roughness: 0.75,
    metalness: 0.02
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.35;
  floor.receiveShadow = true;
  scene.add(floor);

  const pedestalGeo = new THREE.CylinderGeometry(2.8, 3.2, 0.45, 96);
  const pedestalMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.65
  });
  const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
  pedestal.position.y = -2.15;
  pedestal.castShadow = true;
  pedestal.receiveShadow = true;
  scene.add(pedestal);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  let tool = "orbit";
  let brushRadius = 0.65;
  let brushStrength = 0.08;
  let currentMaterialName = "clay";

  let yaw = Math.PI * 0.18;
  let pitch = 0.8;
  let distance = 9.2;
  const target = new THREE.Vector3(0, 0.1, 0);

  let isPointerDown = false;
  let lastX = 0;
  let lastY = 0;
  let sculpting = false;
  let lastSculptTime = 0;

  const undoStack = [];
  const maxUndo = 25;

  const tempVertex = new THREE.Vector3();
  const tempNormal = new THREE.Vector3();
  const tempHit = new THREE.Vector3();
  const tempDir = new THREE.Vector3();

  const textureCache = new Map();

  function updateCamera() {
    pitch = Math.max(0.22, Math.min(1.45, pitch));
    distance = Math.max(5.3, Math.min(16, distance));

    const x = Math.sin(yaw) * Math.cos(pitch) * distance;
    const y = Math.sin(pitch) * distance;
    const z = Math.cos(yaw) * Math.cos(pitch) * distance;

    camera.position.set(target.x + x, target.y + y, target.z + z);
    camera.lookAt(target);
  }

  updateCamera();

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function colorToRgb(hex) {
    const c = new THREE.Color(hex);
    return {
      r: Math.round(c.r * 255),
      g: Math.round(c.g * 255),
      b: Math.round(c.b * 255)
    };
  }

  function rgb(r, g, b) {
    return `rgb(${Math.round(clamp01(r / 255) * 255)},${Math.round(clamp01(g / 255) * 255)},${Math.round(clamp01(b / 255) * 255)})`;
  }

  function noise2(x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }

  function makeProceduralTexture(kind) {
    const cacheKey = kind;
    if (textureCache.has(cacheKey)) return textureCache.get(cacheKey);

    const size = 512;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    const image = ctx.createImageData(size, size);
    const data = image.data;

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = x / size;
        const v = y / size;
        let r = 210, g = 120, b = 88;

        if (kind === "clay") {
          const n1 = noise2(x * 0.08, y * 0.08);
          const n2 = noise2(x * 0.017 + 50, y * 0.017 + 20);
          const smear = Math.sin((u * 9 + v * 7 + n2 * 1.5) * Math.PI);
          const d = (n1 - 0.5) * 32 + smear * 8;
          r = 192 + d;
          g = 107 + d * 0.42;
          b = 78 + d * 0.35;
        }

        if (kind === "marble") {
          const n = noise2(x * 0.018, y * 0.018);
          const vein = Math.sin((u * 6.5 + v * 9.5 + n * 2.5) * Math.PI);
          const dark = Math.pow(Math.abs(vein), 10) * 115;
          const soft = noise2(x * 0.045 + 6, y * 0.045 + 8) * 18;
          r = 235 - dark + soft;
          g = 231 - dark * 0.9 + soft;
          b = 224 - dark * 0.78 + soft;
        }

        if (kind === "wood") {
          const cx = u - 0.5;
          const cy = v - 0.5;
          const radius = Math.sqrt(cx * cx + cy * cy);
          const rings = Math.sin((radius * 55 + noise2(x * 0.025, y * 0.025) * 5) * Math.PI);
          const grain = Math.sin((u * 20 + noise2(x * 0.015, y * 0.02) * 5) * Math.PI) * 9;
          const band = rings > 0.4 ? 35 : 0;
          r = 143 + band + grain;
          g = 87 + band * 0.45 + grain * 0.5;
          b = 43 + grain * 0.25;
        }

        if (kind === "stone") {
          const n1 = noise2(x * 0.055, y * 0.055);
          const n2 = noise2(x * 0.013 + 77, y * 0.013 + 12);
          const d = (n1 - 0.5) * 68 + (n2 - 0.5) * 34;
          r = 132 + d;
          g = 137 + d;
          b = 142 + d;
        }

        if (kind === "plaster") {
          const n1 = noise2(x * 0.055, y * 0.055);
          const n2 = Math.sin((u * 14 + v * 6) * Math.PI) * 5;
          const d = (n1 - 0.5) * 18 + n2;
          r = 228 + d;
          g = 224 + d;
          b = 214 + d;
        }

        const i = (y * size + x) * 4;
        data[i] = Math.max(0, Math.min(255, r));
        data[i + 1] = Math.max(0, Math.min(255, g));
        data[i + 2] = Math.max(0, Math.min(255, b));
        data[i + 3] = 255;
      }
    }

    ctx.putImageData(image, 0, 0);

    if (kind === "clay") {
      ctx.globalAlpha = 0.18;
      for (let i = 0; i < 80; i++) {
        ctx.beginPath();
        ctx.ellipse(
          Math.random() * size,
          Math.random() * size,
          20 + Math.random() * 80,
          3 + Math.random() * 8,
          Math.random() * Math.PI,
          0,
          Math.PI * 2
        );
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(kind === "wood" ? 1.5 : 2.2, kind === "wood" ? 1.5 : 2.2);
    texture.anisotropy = 8;
    texture.colorSpace = THREE.SRGBColorSpace;

    textureCache.set(cacheKey, texture);
    return texture;
  }

  function makeMaterial(kind) {
    const material = new THREE.MeshStandardMaterial({
      map: makeProceduralTexture(kind),
      roughness: kind === "marble" ? 0.38 : kind === "plaster" ? 0.82 : 0.74,
      metalness: 0.02
    });

    if (kind === "marble") {
      material.envMapIntensity = 0.35;
    }

    return material;
  }

  function makeSculptGeometry() {
    const geo = new THREE.SphereGeometry(2.05, 72, 44);
    const pos = geo.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = pos.getZ(i);
      const n = noise2(x * 3.8 + 20, y * 3.8 + z * 1.7);
      const n2 = noise2(x * 8.5 + 1, z * 8.5 + 3);
      const bump = (n - 0.5) * 0.14 + (n2 - 0.5) * 0.035;
      const v = new THREE.Vector3(x, y, z).normalize().multiplyScalar(2.05 + bump);
      pos.setXYZ(i, v.x, v.y, v.z);
    }

    geo.computeVertexNormals();
    return geo;
  }

  let sculptMesh = new THREE.Mesh(makeSculptGeometry(), makeMaterial("clay"));
  sculptMesh.castShadow = true;
  sculptMesh.receiveShadow = true;
  scene.add(sculptMesh);

  const brushRing = new THREE.Mesh(
    new THREE.RingGeometry(0.96, 1.0, 96),
    new THREE.MeshBasicMaterial({
      color: 0x1d4ed8,
      transparent: true,
      opacity: 0.42,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  brushRing.visible = false;
  scene.add(brushRing);

  function updateCounter() {
    counter.textContent = `정점 ${sculptMesh.geometry.attributes.position.count.toLocaleString("ko-KR")}개`;
  }

  updateCounter();

  function setTool(next) {
    tool = next;
    const ids = {
      orbit: "toolOrbit",
      push: "toolPush",
      press: "toolPress",
      carve: "toolCarve",
      smooth: "toolSmooth",
      flatten: "toolFlatten"
    };

    Object.values(ids).forEach(id => document.getElementById(id).classList.remove("active"));
    document.getElementById(ids[next]).classList.add("active");
    brushRing.visible = next !== "orbit";
  }

  document.getElementById("toolOrbit").onclick = () => setTool("orbit");
  document.getElementById("toolPush").onclick = () => setTool("push");
  document.getElementById("toolPress").onclick = () => setTool("press");
  document.getElementById("toolCarve").onclick = () => setTool("carve");
  document.getElementById("toolSmooth").onclick = () => setTool("smooth");
  document.getElementById("toolFlatten").onclick = () => setTool("flatten");

  const radiusSlider = document.getElementById("radiusSlider");
  const strengthSlider = document.getElementById("strengthSlider");
  const radiusValue = document.getElementById("radiusValue");
  const strengthValue = document.getElementById("strengthValue");

  radiusSlider.oninput = () => {
    brushRadius = Number(radiusSlider.value);
    radiusValue.textContent = brushRadius.toFixed(2);
  };

  strengthSlider.oninput = () => {
    brushStrength = Number(strengthSlider.value);
    strengthValue.textContent = brushStrength.toFixed(2);
  };

  document.querySelectorAll("[data-material]").forEach(btn => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.material;
      setMaterial(kind);
      document.querySelectorAll("[data-material]").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");
    });
  });

  function setMaterial(kind) {
    currentMaterialName = kind;
    if (sculptMesh.material) sculptMesh.material.dispose();
    sculptMesh.material = makeMaterial(kind);
    saveLocal();
  }

  function setPointerFromEvent(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  }

  function getHit(event) {
    setPointerFromEvent(event);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(sculptMesh, false);
    return hits.length ? hits[0] : null;
  }

  function alignBrushRing(hit) {
    if (!hit || tool === "orbit") {
      brushRing.visible = false;
      return;
    }

    brushRing.visible = true;
    brushRing.position.copy(hit.point);

    tempNormal.copy(hit.face.normal).transformDirection(sculptMesh.matrixWorld).normalize();

    const q = new THREE.Quaternion();
    q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tempNormal);
    brushRing.quaternion.copy(q);
    brushRing.scale.setScalar(brushRadius);
  }

  function pushUndo() {
    const pos = sculptMesh.geometry.attributes.position.array;
    undoStack.push(new Float32Array(pos));

    if (undoStack.length > maxUndo) {
      undoStack.shift();
    }
  }

  function undo() {
    if (!undoStack.length) return;

    const previous = undoStack.pop();
    const attr = sculptMesh.geometry.attributes.position;
    attr.array.set(previous);
    attr.needsUpdate = true;
    sculptMesh.geometry.computeVertexNormals();
    saveLocal();
  }

  document.getElementById("undoBtn").onclick = undo;

  function applySculpt(hit) {
    if (!hit || tool === "orbit") return;

    const geometry = sculptMesh.geometry;
    const pos = geometry.attributes.position;
    const normalAttr = geometry.attributes.normal;

    tempHit.copy(hit.point);
    sculptMesh.worldToLocal(tempHit);

    const hitNormal = hit.face.normal.clone().normalize();
    const radius = brushRadius;
    const strength = brushStrength;

    let localAverageRadius = 0;
    let averageWeight = 0;

    if (tool === "smooth") {
      for (let i = 0; i < pos.count; i++) {
        tempVertex.fromBufferAttribute(pos, i);
        const d = tempVertex.distanceTo(tempHit);
        if (d <= radius) {
          const t = 0.5 + 0.5 * Math.cos((d / radius) * Math.PI);
          localAverageRadius += tempVertex.length() * t;
          averageWeight += t;
        }
      }
      if (averageWeight > 0) {
        localAverageRadius /= averageWeight;
      }
    }

    for (let i = 0; i < pos.count; i++) {
      tempVertex.fromBufferAttribute(pos, i);
      const d = tempVertex.distanceTo(tempHit);
      if (d > radius) continue;

      const falloff = 0.5 + 0.5 * Math.cos((d / radius) * Math.PI);

      if (tool === "push") {
        tempNormal.fromBufferAttribute(normalAttr, i).normalize();
        tempVertex.addScaledVector(tempNormal, strength * falloff);
      }

      if (tool === "press") {
        tempVertex.addScaledVector(hitNormal, -strength * falloff);
      }

      if (tool === "carve") {
        tempVertex.addScaledVector(hitNormal, -strength * 1.8 * falloff);
      }

      if (tool === "smooth") {
        const currentRadius = tempVertex.length();
        if (currentRadius > 0 && averageWeight > 0) {
          const target = tempVertex.clone().normalize().multiplyScalar(localAverageRadius);
          tempVertex.lerp(target, Math.min(0.8, strength * 4) * falloff);
        }
      }

      if (tool === "flatten") {
        tempDir.subVectors(tempVertex, tempHit);
        const amount = tempDir.dot(hitNormal);
        tempVertex.addScaledVector(hitNormal, -amount * Math.min(0.85, strength * 5) * falloff);
      }

      const maxDist = 3.05;
      const minDist = 0.75;
      const len = tempVertex.length();

      if (len > maxDist) {
        tempVertex.multiplyScalar(maxDist / len);
      }

      if (len < minDist) {
        tempVertex.multiplyScalar(minDist / Math.max(0.001, len));
      }

      pos.setXYZ(i, tempVertex.x, tempVertex.y, tempVertex.z);
    }

    pos.needsUpdate = true;
    geometry.computeVertexNormals();
  }

  renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

  renderer.domElement.addEventListener("pointerdown", event => {
    if (event.target !== renderer.domElement) return;

    isPointerDown = true;
    sculpting = tool !== "orbit";
    lastX = event.clientX;
    lastY = event.clientY;

    renderer.domElement.setPointerCapture(event.pointerId);

    if (sculpting) {
      pushUndo();
      const hit = getHit(event);
      alignBrushRing(hit);
      applySculpt(hit);
      saveLocal();
    }
  });

  renderer.domElement.addEventListener("pointermove", event => {
    const hit = getHit(event);

    if (!isPointerDown) {
      alignBrushRing(hit);
      return;
    }

    if (tool === "orbit") {
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      yaw -= dx * 0.008;
      pitch += dy * 0.006;
      updateCamera();
      brushRing.visible = false;
    } else {
      alignBrushRing(hit);

      const now = performance.now();
      if (now - lastSculptTime > 22) {
        applySculpt(hit);
        lastSculptTime = now;
      }
    }

    lastX = event.clientX;
    lastY = event.clientY;
  });

  renderer.domElement.addEventListener("pointerup", event => {
    isPointerDown = false;
    sculpting = false;

    try {
      renderer.domElement.releasePointerCapture(event.pointerId);
    } catch {}

    saveLocal();
  });

  renderer.domElement.addEventListener("pointercancel", () => {
    isPointerDown = false;
    sculpting = false;
    saveLocal();
  });

  renderer.domElement.addEventListener("wheel", event => {
    event.preventDefault();
    distance += event.deltaY * 0.012;
    updateCamera();
  }, { passive: false });

  document.getElementById("rotLeft").onclick = () => {
    yaw -= 0.35;
    updateCamera();
  };

  document.getElementById("rotRight").onclick = () => {
    yaw += 0.35;
    updateCamera();
  };

  document.getElementById("zoomIn").onclick = () => {
    distance -= 1.1;
    updateCamera();
  };

  document.getElementById("zoomOut").onclick = () => {
    distance += 1.1;
    updateCamera();
  };

  function exportData() {
    return {
      version: 1,
      material: currentMaterialName,
      radius: brushRadius,
      strength: brushStrength,
      positions: Array.from(sculptMesh.geometry.attributes.position.array)
    };
  }

  function saveLocal() {
    try {
      localStorage.setItem("littleSculptorStudioSave", JSON.stringify(exportData()));
    } catch {}
  }

  function loadData(data, save = true) {
    if (!data || !Array.isArray(data.positions)) {
      alert("불러올 수 없는 조각 파일이에요.");
      return;
    }

    const attr = sculptMesh.geometry.attributes.position;
    if (data.positions.length !== attr.array.length) {
      alert("이 파일은 현재 버전의 조각 덩어리와 크기가 맞지 않아요.");
      return;
    }

    attr.array.set(data.positions);
    attr.needsUpdate = true;
    sculptMesh.geometry.computeVertexNormals();

    if (data.material) {
      setMaterial(data.material);
      document.querySelectorAll("[data-material]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.material === data.material);
      });
    }

    if (typeof data.radius === "number") {
      brushRadius = data.radius;
      radiusSlider.value = brushRadius;
      radiusValue.textContent = brushRadius.toFixed(2);
    }

    if (typeof data.strength === "number") {
      brushStrength = data.strength;
      strengthSlider.value = brushStrength;
      strengthValue.textContent = brushStrength.toFixed(2);
    }

    if (save) saveLocal();
  }

  function loadLocal() {
    const raw = localStorage.getItem("littleSculptorStudioSave");
    if (!raw) return;

    try {
      loadData(JSON.parse(raw), false);
    } catch {}
  }

  loadLocal();

  document.getElementById("resetBtn").onclick = () => {
    if (!confirm("지금 만든 조각을 지우고 새 덩어리로 시작할까요?")) return;

    pushUndo();

    sculptMesh.geometry.dispose();
    sculptMesh.geometry = makeSculptGeometry();
    updateCounter();
    saveLocal();
  };

  document.getElementById("savePngBtn").onclick = () => {
    renderer.render(scene, camera);

    const a = document.createElement("a");
    a.href = renderer.domElement.toDataURL("image/png");
    a.download = "꼬마-조각가-작품.png";
    a.click();
  };

  document.getElementById("saveJsonBtn").onclick = () => {
    const blob = new Blob(
      [JSON.stringify(exportData())],
      { type: "application/json" }
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "꼬마-조각가-작품.json";
    a.click();

    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  document.getElementById("loadJsonBtn").onclick = () => {
    document.getElementById("fileInput").click();
  };

  document.getElementById("fileInput").addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        pushUndo();
        loadData(JSON.parse(reader.result), true);
      } catch {
        alert("JSON 파일을 읽지 못했어요.");
      }
    };

    reader.readAsText(file);
    event.target.value = "";
  });

  window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (key === "1") setTool("orbit");
    if (key === "2") setTool("push");
    if (key === "3") setTool("press");
    if (key === "4") setTool("carve");
    if (key === "5") setTool("smooth");
    if (key === "6") setTool("flatten");
    if (key === "z" && (event.ctrlKey || event.metaKey)) undo();

    if (key === "r") {
      yaw += 0.35;
      updateCamera();
    }
  });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
