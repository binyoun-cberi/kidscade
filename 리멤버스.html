<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#343e62"><title>리멤버스 · 기억으로 출발!</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#343e62;color:#283453;display:grid;place-items:center}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #fd9b35;outline-offset:3px}#game{position:relative;aspect-ratio:3/4;width:min(100vw,75dvh);height:auto;max-height:100dvh;overflow:hidden;background:#b9c8cf;box-shadow:0 0 60px #18213c80}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:2% 3% auto;display:flex;gap:8px;align-items:center}.badge{background:#fffaf1;padding:7px 12px;border-radius:12px;box-shadow:0 3px 0 #26334c25;font-weight:900;font-size:clamp(12px,2.3dvh,18px)}#hud .spacer{flex:1}.icon{border:0;background:#fffaf1;border-radius:10px;width:36px;height:36px;font-weight:900;font-size:18px}#status{position:absolute;top:37%;left:5%;right:5%;text-align:center;font-size:clamp(12px,2.2dvh,18px);font-weight:850;color:#26334d;pointer-events:none}#action{position:absolute;top:42%;left:23%;width:54%;padding:10px 8px;border:0;border-radius:13px;background:#fff4a8;color:#49392a;box-shadow:0 4px 0 #bea467;font-weight:900;font-size:clamp(12px,2.2dvh,18px)}#lots{position:absolute;inset:0;pointer-events:none}.lot{position:absolute;background:transparent;border:0;border-radius:12px;pointer-events:auto}.lot:disabled{cursor:default}.lot:focus-visible{outline-offset:0;background:#ffffff18}.overlay{position:absolute;inset:0;background:#2636517d;backdrop-filter:blur(5px);z-index:10;display:grid;place-items:center;padding:6%;overflow:auto}.card{width:100%;background:#fffaf0;border:4px solid white;border-radius:27px;padding:24px 20px;text-align:center;box-shadow:0 14px 45px #23335250}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:900;color:#558277}h1{font-size:clamp(32px,7dvh,58px);margin:10px 0;letter-spacing:-3px}h2{margin:10px 0;font-size:28px}.card p{line-height:1.7;font-size:14px;margin:12px 0}.main{width:100%;border:0;background:#53bda3;color:#123e39;border-radius:13px;padding:14px 10px;font-weight:900;margin:6px 0;box-shadow:0 4px 0 #389680}.secondary{background:#e4e9f4;box-shadow:0 4px 0 #c6cedc;color:#344668}.choices{display:flex;gap:7px;margin:14px 0}.choices button{flex:1;border:2px solid #d4dce6;border-radius:12px;background:#fff;padding:10px 3px;font-size:13px;font-weight:800}.choices button.selected{border-color:#339c81;background:#dcf5e8}.small{font-size:12px!important;color:#69788b}.hidden{display:none!important}#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-height:550px){.card{padding:12px}.card p{margin:5px;font-size:12px}.main{padding:8px}.choices{margin:7px 0}h1{font-size:30px}}
</style></head><body><main id="game"><canvas id="view" width="600" height="800" aria-label="작은 버스 터미널"></canvas><header id="hud"><span class="badge" id="route">리멤버스</span><span class="badge" id="score">0명</span><span class="spacer"></span><button class="icon" id="sound" aria-label="소리 끄기">♪</button><button class="icon" id="pause" aria-label="일시정지">Ⅱ</button></header><div id="status" aria-live="polite"></div><button id="action" class="hidden"></button><div id="lots" aria-label="버스 주차장"></div><div id="live" aria-live="polite"></div>
<section class="overlay" id="menu"><div class="card"><div class="eyebrow">작은 터미널 · 커다란 기억</div><h1>리멤버스</h1><p>어느 자리에 어떤 버스가 있었지?<br>기억한 버스를 불러 손님을 태워 주세요.</p><div class="choices" id="choices"><button data-n="3" class="selected">첫걸음<br>3대</button><button data-n="5">익숙해요<br>5대</button><button data-n="7">자신 있어요<br>7대</button></div><button class="main" id="journey">차근차근 운행하기</button><button class="main secondary" id="challenge">60초 기록 도전</button><p class="small">색과 문양을 기억 → 버스 선택 → 손님 탑승!<br>마우스·터치 또는 숫자 1~9로 선택해요.</p><p class="small" id="best"></p></div></section>
<section class="overlay hidden" id="modal"><div class="card"><div class="eyebrow" id="modalTag">REMEMBUS TERMINAL</div><h2 id="modalTitle"></h2><p id="modalText"></p><button class="main" id="modalGo"></button><button class="main secondary" id="modalHome">처음 화면</button></div></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=$('view'),ctx=C.getContext('2d');
const tokens=[['#f05b70','★','빨강'],['#4598f3','●','파랑'],['#f6c744','◆','노랑'],['#56be80','▲','초록'],['#a97ce1','☾','보라'],['#f69343','♥','주황'],['#46c6cc','✿','하늘'],['#ed80bc','✚','분홍'],['#b59874','■','갈색']];
let selected=3,mode='journey',phase='menu',previousPhase='',round=1,total=0,correct=0,attempts=0,remaining=60,preview=0,buses=[],queue=[],reveal=new Set(),departed=new Set(),animation=null,feedback='',feedbackTime=0,routeMistakes=0,usedHints=0,audio=true,ac=null,t=0,last=0,roundGoal=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function tone(f,d=.12){if(!audio)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(s,x,y,size=18,color='#34435d',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}
function slots(n){const cols=3,rows=Math.ceil(n/cols),width=140,gap=30;return Array.from({length:n},(_,i)=>({x:60+(i%cols)*(width+gap),y:414+Math.floor(i/cols)*(rows===3?116:145),w:140,h:rows===3?106:125}))}
function bus(x,y,token,visible=true,scale=1,angle=0,label='',occupied=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);const color=visible?tokens[token][0]:'#8c9baa';rounded(-32,-49,75,114,12,'#29354e28');for(let a of [-1,1]){rounded(a<0?-38:29,-25,9,20,3,'#35415a');rounded(a<0?-38:29,33,9,20,3,'#35415a')}rounded(-33,-56,66,112,11,'#34435c');rounded(-31,-62,62,107,11,color);rounded(-27,-58,54,91,9,color);rounded(-24,-52,48,22,5,'#d1f0f7');rounded(-22,-49,43,8,3,'#effcff');rounded(-23,20,46,13,4,'#405b78');rounded(-25,37,12,5,2,'#fff6b9');rounded(13,37,12,5,2,'#fff6b9');rounded(-22,-23,44,38,6,visible?'#ffffff24':'#b1bbc7');txt(visible?tokens[token][1]:'?',0,6,27,'#fff');if(occupied)for(let j=0;j<3;j++){ctx.fillStyle='#ffe2b3';ctx.beginPath();ctx.arc(-13+j*13,-41,4,0,7);ctx.fill()}if(label){rounded(-12,48,24,17,5,'#fffcf1');txt(label,0,61,12)}ctx.restore()}
function person(x,y,token,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);rounded(-9,11,22,7,5,'#26384922');rounded(-7,3,5,12,2,'#405173');rounded(2,3,5,12,2,'#405173');rounded(-10,-10,20,21,7,tokens[token][0]);ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(0,-15,8,0,7);ctx.fill();txt(tokens[token][1],0,5,11,'white');ctx.restore()}
function background(){ctx.fillStyle='#c4d3d8';ctx.fillRect(0,0,600,800);ctx.strokeStyle='#b7c9cd';ctx.lineWidth=1;for(let x=0;x<600;x+=30){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,228);ctx.stroke()}for(let y=60;y<228;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke()}
rounded(355,62,220,101,9,'#9daebf');rounded(348,54,224,94,9,'#f8f1e4');rounded(340,50,239,28,6,'#f47769');txt('REMEMBUS',459,70,18,'#fff');for(let x=359;x<550;x+=47)rounded(x,87,38,44,3,'#a6d5e4');rounded(525,87,28,61,2,'#55778a');
rounded(18,77,103,54,7,'#fffdf2');txt('기억 터미널',69,99,14);txt('BUS STOP',69,119,11,'#7991a2');rounded(26,132,6,50,2,'#67849b');rounded(104,132,6,50,2,'#67849b');
ctx.fillStyle='#6e7e95';ctx.fillRect(0,234,600,75);ctx.fillStyle='#f8f3d9';for(let x=0;x<600;x+=60)ctx.fillRect(x,275,32,4);for(let x=20;x<118;x+=16)ctx.fillRect(x,238,9,63);ctx.fillStyle='#eff6ed';ctx.fillRect(0,226,600,8);ctx.fillRect(0,309,600,7);
ctx.fillStyle='#aab7c7';ctx.fillRect(0,382,600,418);ctx.strokeStyle='#c1ccd8';for(let y=397;y<800;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke()}rounded(18,386,564,400,17,'#8e9eb540');txt('REMEMBUS  /  PARKING',300,405,11,'#edf2f7');
for(let x of [16,572])for(let y of [162,350]){rounded(x-9,y,29,20,4,'#8f9d93');ctx.fillStyle='#66a779';ctx.beginPath();ctx.arc(x+5,y-3,18,0,7);ctx.fill()}
// Boarding bay connects the queue and the road.
ctx.strokeStyle='#f8f6e6';ctx.lineWidth=3;ctx.setLineDash([7,6]);ctx.strokeRect(190,150,115,70);ctx.setLineDash([]);txt('탑승',247,216,12,'#70818e');
}
function draw(){ctx.clearRect(0,0,600,800);background();const ss=slots(buses.length);
for(let i=0;i<buses.length;i++){const p=ss[i];ctx.strokeStyle=departed.has(i)?'#66bea2':'#e6edf1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+p.h);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.lineTo(p.x+p.w,p.y);ctx.stroke();if(!departed.has(i)&&!(animation?.kind==='board'&&animation.pos===i))bus(p.x+p.w/2,p.y+p.h/2,buses[i],phase==='preview'||reveal.has(i)||animation?.kind==='wrong'&&animation.pos===i,.71,0,String(i+1));else if(departed.has(i)){rounded(p.x+8,p.y+12,p.w-16,p.h-20,10,tokens[buses[i]][0]+'45');txt('✓ 출발',p.x+p.w/2,p.y+p.h/2,16,'#fff')}}
queue.slice(0,4).forEach((q,i)=>{let x=335+i*45,y=182;if(animation?.kind==='board'&&i===0){let f=Math.max(0,Math.min(1,(animation.time-.45)/.4));x+=(247-x)*f;y+=(175-y)*f;if(f>=1)return}person(x,y,q,1.1);if(i===0){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y+21,17,5,0,0,7);ctx.stroke()}});
if(animation?.kind==='board'){const a=animation,p=ss[a.pos],v=a.time;let x,y,angle=0;if(v<.45){let f=v/.45;f=f*f*(3-2*f);x=p.x+p.w/2+(247-p.x-p.w/2)*f;y=p.y+p.h/2+(180-p.y-p.h/2)*f}else if(v<.9){x=247;y=180}else{let f=Math.min(1,(v-.9)/.55);x=247+430*f;y=180+88*Math.sin(Math.min(1,f*2)*Math.PI/2);angle=Math.PI/2*f}bus(x,y,buses[a.pos],true,.76,angle,'',v>.82)}
if(feedbackTime>0){rounded(120,316,360,30,10,'#fffaf0');txt(feedback,300,337,15)}
if(phase==='preview'){txt('색과 문양, 주차 위치를 기억해요',300,361,14,'#4a5d75')}
}
function bestKey(){return 'remembus-v2-best-'+selected}function getBest(){try{return Number(localStorage.getItem(bestKey()))||0}catch(e){return 0}}function bestLabel(){$('best').textContent=`${selected}대 · 60초 최고 기록 ${getBest()}명`}
function controls(){[...$('lots').children].forEach((b,i)=>{b.disabled=phase!=='play'||!!animation||departed.has(i)});$('action').classList.toggle('hidden',!['preview','play'].includes(phase)||!!animation);$('action').textContent=phase==='preview'?(mode==='journey'?'기억했어요! 배차 시작':`잠시 후 출발 · ${Math.ceil(preview)}초`):mode==='journey'?'힌트 · 남은 버스 2초 보기':'힌트 · 2초 보기 (시간 −5초)';}
function hud(){$('route').textContent=mode==='journey'?`${round} / 6 운행`:`${remaining.toFixed(1)}초`;$('score').textContent=`${total}명 탑승`;$('status').textContent=phase==='preview'?'버스가 어디에 있는지 살펴보세요':phase==='play'&&queue.length?`${tokens[queue[0]][2]} ${tokens[queue[0]][1]} 손님의 버스를 불러 주세요`:phase==='boarding'?'손님이 타면 버스가 출발해요':phase==='hint'?'색과 위치를 다시 기억해요':'';}
function prepare(){const n=mode==='journey'?Math.min(9,selected+Math.floor((round-1)/2)):selected;const old=buses.slice();buses=old.length===n?old:shuffle(tokens.map((_,i)=>i)).slice(0,n);if(old.length===n&&n>1){let ids=shuffle([...Array(n).keys()]);[buses[ids[0]],buses[ids[1]]]=[buses[ids[1]],buses[ids[0]]]}queue=shuffle(buses);roundGoal=n;reveal.clear();departed.clear();animation=null;routeMistakes=0;usedHints=0;phase='preview';preview=mode==='challenge'?5:0;feedbackTime=0;
$('lots').replaceChildren();slots(n).forEach((p,i)=>{const b=document.createElement('button');b.className='lot';b.style.cssText=`left:${p.x/6}%;top:${p.y/8}%;width:${p.w/6}%;height:${p.h/8}%`;b.setAttribute('aria-label',`${i+1}번 주차 위치`);b.onclick=()=>choose(i);$('lots').appendChild(b)});controls();hud()}
function start(m){mode=m;round=1;total=correct=attempts=0;remaining=60;buses=[];$('menu').classList.add('hidden');$('modal').classList.add('hidden');prepare();tone(600)}
function begin(){if(phase!=='preview')return;phase='play';controls();hud();tone(750)}
function choose(i){if(phase!=='play'||animation||departed.has(i)||i<0||i>=buses.length)return;attempts++;if(buses[i]===queue[0]){correct++;phase='boarding';animation={kind:'board',pos:i,time:0};reveal.add(i);feedback='맞았어요! 승강장으로 출발';feedbackTime=1.4;tone(800)}else{routeMistakes++;animation={kind:'wrong',pos:i,time:0};feedback=`${i+1}번은 ${tokens[buses[i]][2]} ${tokens[buses[i]][1]} 버스예요`;feedbackTime=1.1;tone(210)}controls();hud()}
function hint(){if(phase!=='play'||animation)return;if(mode==='challenge'){remaining=Math.max(0,remaining-5);if(remaining<=0){finish();return}}usedHints++;phase='hint';animation={kind:'hint',time:0};for(let i=0;i<buses.length;i++)reveal.add(i);controls();hud()}
function showModal(title,text,button,callback){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalGo').textContent=button;$('modalGo').onclick=callback;$('modal').classList.remove('hidden')}
function endRound(){phase='between';controls();hud();if(mode==='challenge'){round++;prepare();return}showModal(round===6?'모든 운행을 마쳤어요!':'이번 운행 완료!',`${roundGoal}명의 손님을 태웠어요. ${routeMistakes===0&&usedHints===0?'도움 없이 모두 기억했어요!':`다시 선택 ${routeMistakes}번 · 힌트 ${usedHints}번`} 누적 ${total}명 탑승.`,round===6?'한 번 더 운행하기':'다음 운행 · 버스 위치가 조금 바뀌어요',()=>{$('modal').classList.add('hidden');if(round===6)start('journey');else{round++;prepare()}})}
function finish(){if(phase==='ended')return;phase='ended';animation=null;remaining=0;controls();hud();let best=Math.max(getBest(),total);try{localStorage.setItem(bestKey(),String(best))}catch(e){}showModal('오늘의 운행 종료!',`${total}명 탑승 · 정답률 ${attempts?Math.round(correct/attempts*100):0}% · 최고 ${best}명`,'60초 다시 도전',()=>start('challenge'))}
function pause(){if(['menu','between','ended','paused'].includes(phase))return;previousPhase=phase;phase='paused';controls();showModal('잠깐 쉬어 가요','기억한 버스와 남은 시간을 그대로 두었어요.','이어서 운행',()=>{phase=previousPhase;$('modal').classList.add('hidden');controls();hud()})}
function home(){phase='menu';animation=null;$('modal').classList.add('hidden');$('menu').classList.remove('hidden');controls();bestLabel()}
function update(dt){t+=dt;if(phase==='paused'||phase==='menu'||phase==='ended'||phase==='between')return;feedbackTime=Math.max(0,feedbackTime-dt);if(phase==='preview'&&mode==='challenge'){preview-=dt;if(preview<=0)begin();else controls()}
else if(mode==='challenge'&&['play','boarding','hint'].includes(phase)){remaining=Math.max(0,remaining-dt);if(remaining<=0){finish();return}}
if(animation){animation.time+=dt;let a=animation;if(a.kind==='wrong'&&a.time>=1.05){animation=null;controls()}else if(a.kind==='hint'&&a.time>=2){reveal.clear();animation=null;phase='play';controls()}else if(a.kind==='board'&&a.time>=1.45){departed.add(a.pos);queue.shift();total++;animation=null;phase='play';tone(1000);if(!queue.length)endRound();else controls()}}hud()}
$('action').onclick=()=>phase==='preview'?begin():hint();$('journey').onclick=()=>start('journey');$('challenge').onclick=()=>start('challenge');$('pause').onclick=pause;$('modalHome').onclick=home;$('sound').onclick=()=>{audio=!audio;$('sound').textContent=audio?'♪':'×';$('sound').setAttribute('aria-label',audio?'소리 끄기':'소리 켜기');if(audio)tone(650)};document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.n);document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('selected',x===b));bestLabel()});document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Escape'){pause();return}if(/^[1-9]$/.test(e.key)&&phase==='play'){e.preventDefault();choose(Number(e.key)-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);
function resize(){const d=Math.min(devicePixelRatio||1,2);C.width=600*d;C.height=800*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();buses=[0,1,2,3,4,5];queue=[0,2,1,3];bestLabel();controls();function frame(now){let dt=Math.min(.05,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
