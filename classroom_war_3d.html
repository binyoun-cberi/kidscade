<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>교실전쟁 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:system-ui,"맑은 고딕",sans-serif;color:#fff}button{font:inherit}#wrap{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,#173353,#07111d 65%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:4;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.pill{padding:7px 10px;border:2px solid rgba(255,255,255,.32);border-radius:10px;background:rgba(7,17,29,.78);backdrop-filter:blur(4px);font-weight:900;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2)}.pill b{color:#ffe37a}.rank{color:#9be7ff}.linehud{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:4;width:min(340px,42vw);pointer-events:none;text-align:center;font-size:11px;font-weight:900}.bar{height:14px;border:2px solid #fff5c5;background:#263545;border-radius:7px;overflow:hidden;box-shadow:0 3px 10px #0008}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#63c878,#bee466);transition:width .15s}.wave{margin-top:4px;text-shadow:0 2px 3px #000}.help{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:4;padding:7px 10px;border:2px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(7,17,29,.72);font-size:11px;font-weight:800;pointer-events:none}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(3,9,16,.74);padding:18px}.card{width:min(580px,94vw);padding:22px;border:3px solid #d7e7f8;border-radius:18px;background:linear-gradient(180deg,#152c46,#0b1929);box-shadow:0 20px 70px #000a;text-align:center}.card h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.card p{margin:8px auto;line-height:1.55;color:#c9d8e7;max-width:480px}.card strong{color:#ffe37a}.start{margin-top:14px;padding:12px 24px;border:0;border-radius:12px;background:#ffe37a;color:#18202b;font-weight:1000;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #b28f22}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #b28f22}.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px}.legend span{padding:5px 8px;border-radius:8px;background:#ffffff12;border:1px solid #ffffff2b}.toast{position:absolute;left:50%;bottom:17%;transform:translate(-50%,12px);z-index:6;opacity:0;padding:8px 13px;border-radius:10px;background:#081421e8;border:2px solid #ffe37a;color:#fff3af;font-weight:1000;transition:.15s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.hud{max-width:53vw}.pill{font-size:10px;padding:5px 7px}.help{top:auto;bottom:max(8px,env(safe-area-inset-bottom));font-size:9px}.linehud{width:42vw}.card{padding:17px}.card p{font-size:13px}}
</style>
</head>
<body><div id="wrap">
<canvas id="game" aria-label="교실전쟁 3D"></canvas>
<div class="hud"><div class="pill">병력 <b id="units">12</b></div><div class="pill">정예 <b id="elite">1</b></div><div class="pill rank" id="rank">병사</div><div class="pill">점수 <b id="score">0</b></div></div>
<div class="linehud"><div class="bar"><i id="lineBar"></i></div><div class="wave" id="wave">방어선 100 · 1단계</div></div>
<div class="help">A/D · ←/→ · 마우스/터치로 좌우 이동</div><div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="card"><h1>🎖️ 교실전쟁 3D</h1><p>사칙연산 관문을 골라 병력을 키우고, 몰려오는 적으로부터 방어선을 지키세요.</p><p><strong>+와 ×</strong> 관문은 함께, <strong>-와 ÷</strong> 관문은 함께 등장합니다. 움직이는 관문은 서로 반대 방향으로 교차합니다.</p><div class="legend"><span>병사 1</span><span>정예 10</span><span>부사관 100</span><span>장교 1,000</span><span>장군 10,000</span></div><button class="start" id="start">작전 시작</button></div></div>
</div>
<script>
(()=>{'use strict';
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,DPR=1,last=0,raf=0,audio=null,toastTimer=0;
const S={running:false,units:12,line:100,wave:1,score:0,kills:0,x:.5,targetX:.5,scroll:0,gateTimer:1.8,enemyTimer:.7,shotTimer:0,gates:[],enemies:[],shots:[],sparks:[],keys:new Set(),shake:0};
function resize(){const r=cvs.getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(360,r.height);DPR=Math.min(2,devicePixelRatio||1);cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR)}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function rnd(a,b){return a+Math.random()*(b-a)}
function tone(f=440,d=.07,type='square',gain=.025){try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.connect(g);g.connect(audio.destination);o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.02)}catch(_){}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1100)}
const RANKS=[[10000,'장군'],[1000,'장교'],[100,'부사관'],[10,'정예'],[1,'병사']];function rankName(n){for(const [v,name] of RANKS)if(n>=v)return name;return'병사'}
function updateHud(){const elite=Math.floor(S.units/10);$('units').textContent=S.units.toLocaleString();$('elite').textContent=elite.toLocaleString();$('rank').textContent=rankName(S.units);$('score').textContent=S.score.toLocaleString();$('lineBar').style.width=clamp(S.line,0,100)+'%';$('wave').textContent=`방어선 ${Math.ceil(S.line)} · ${S.wave}단계`}
function roadX(y,norm){const p=clamp(y/H,0,1),half=lerp(W*.12,W*.47,p),cx=W*.5;return cx+(norm-.5)*half*2}function roadWidth(y){return lerp(W*.24,W*.94,clamp(y/H,0,1))}
function floor(){ctx.fillStyle='#0b1c2c';ctx.fillRect(0,0,W,H);const horizon=H*.09;ctx.beginPath();ctx.moveTo(W*.38,horizon);ctx.lineTo(W*.02,H);ctx.lineTo(W*.98,H);ctx.lineTo(W*.62,horizon);ctx.closePath();ctx.fillStyle='#24384c';ctx.fill();ctx.save();ctx.strokeStyle='#3e5871';ctx.lineWidth=1;for(let i=0;i<=8;i++){const n=i/8;ctx.beginPath();ctx.moveTo(roadX(horizon,n),horizon);ctx.lineTo(roadX(H,n),H);ctx.stroke()}for(let i=0;i<14;i++){const q=(i/14+S.scroll)%1,y=horizon+(H-horizon)*q*q;ctx.globalAlpha=.18+.5*q;ctx.beginPath();ctx.moveTo(roadX(y,0),y);ctx.lineTo(roadX(y,1),y);ctx.stroke()}ctx.restore();ctx.fillStyle='#c9a75a';ctx.fillRect(0,H*.86,W,5);ctx.fillStyle='#29374a';ctx.fillRect(0,H*.86+5,W,H*.14)}
function opText(o){return o.op+o.val}function applyOp(o){const old=S.units;if(o.op==='+')S.units+=o.val;else if(o.op==='-')S.units-=o.val;else if(o.op==='×')S.units*=o.val;else if(o.op==='÷')S.units=Math.floor(S.units/o.val);S.units=clamp(Math.floor(S.units),1,99999);const diff=S.units-old;tone(diff>=0?720:180,.09,diff>=0?'sine':'sawtooth',.035);toast(`${opText(o)} → 병력 ${S.units.toLocaleString()}`);updateHud()}
function gateChoice(boost){if(boost){const a=Math.random()<.58?{op:'+',val:Math.floor(rnd(3,10))}:{op:'×',val:2};const b=Math.random()<.52?{op:'+',val:Math.floor(rnd(2,8))}:{op:'×',val:2};return[a,b]}const a=Math.random()<.55?{op:'-',val:Math.floor(rnd(2,9))}:{op:'÷',val:2};const b=Math.random()<.55?{op:'-',val:Math.floor(rnd(3,12))}:{op:'÷',val:2};return[a,b]}
function spawnGate(){const boost=Math.random()<.68,n=Math.random()<.22?3:2,ops=gateChoice(boost);while(ops.length<n)ops.push(boost?{op:'+',val:Math.floor(rnd(2,9))}:Math.random()<.5?{op:'-',val:Math.floor(rnd(2,10))}:{op:'÷',val:2});S.gates.push({y:H*.13,speed:rnd(.105,.13)*H,ops,resolved:false,phase:rnd(0,6.28),move:rnd(.045,.085),n});}
function gateXs(g,t){const bases=g.n===2?[.34,.66]:[.23,.5,.77],s=Math.sin(t*1.7+g.phase)*g.move;return bases.map((b,i)=>clamp(b+s*(i%2? -1:1),.12,.88))}
function drawGates(g,t){const xs=gateXs(g,t),p=clamp(g.y/H,.1,1),gw=roadWidth(g.y)*(g.n===2?.29:.22),gh=lerp(30,66,p);g.ops.forEach((o,i)=>{const x=roadX(g.y,xs[i]),bad=o.op==='-'||o.op==='÷';ctx.save();ctx.translate(x,g.y);ctx.fillStyle=bad?'#9f3e49':'#34875e';ctx.strokeStyle=bad?'#ff9ca8':'#9effc0';ctx.lineWidth=Math.max(2,4*p);ctx.fillRect(-gw/2,-gh/2,gw,gh);ctx.strokeRect(-gw/2,-gh/2,gw,gh);ctx.fillStyle='#fff';ctx.font=`900 ${Math.round(lerp(16,32,p))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(opText(o),0,0);ctx.restore()})}
function updateGates(dt,t){for(const g of S.gates){g.y+=g.speed*dt;if(!g.resolved&&g.y>H*.73){const xs=gateXs(g,t),px=S.x;let best=0,bd=99;xs.forEach((x,i)=>{const d=Math.abs(px-x);if(d<bd){bd=d;best=i}});g.resolved=true;applyOp(g.ops[best])}}S.gates=S.gates.filter(g=>g.y<H*.9)}
function enemyDef(){const base=Math.max(2,Math.floor(3*Math.pow(1.22,S.wave-1))),boss=S.wave%5===0&&Math.random()<.22;return{hp:boss?base*8:Math.floor(base*rnd(.7,1.5)),boss}}
function spawnEnemy(){const d=enemyDef(),lane=rnd(.12,.88);S.enemies.push({x:lane,y:H*.1,hp:d.hp,max:d.hp,boss:d.boss,speed:(d.boss?.045:.065+rnd(0,.02))*H,wig:rnd(0,6.28)})}
function enemyScreen(e,t){const n=clamp(e.x+Math.sin(t*1.6+e.wig)*.018,.08,.92),x=roadX(e.y,n),p=clamp(e.y/H,.12,1),s=(e.boss?1.45:1)*lerp(.45,1.2,p);return{x,p,s}}
function drawEnemy(e,t){const a=enemyScreen(e,t),x=a.x,y=e.y,s=a.s;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,24,23,7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=e.boss?'#7c365a':'#a64949';ctx.strokeStyle=e.boss?'#ffb7e5':'#ffc09b';ctx.lineWidth=3;ctx.fillRect(-18,-24,36,42);ctx.strokeRect(-18,-24,36,42);ctx.fillStyle='#18202c';ctx.fillRect(-14,-18,9,9);ctx.fillRect(5,-18,9,9);ctx.fillStyle='#e9d9b8';ctx.fillRect(-10,22,8,12);ctx.fillRect(2,22,8,12);if(e.boss){ctx.fillStyle='#e1bf62';ctx.fillRect(-25,-33,50,8);ctx.fillRect(-16,-41,10,10);ctx.fillRect(6,-41,10,10)}ctx.fillStyle='#111a25';ctx.fillRect(-22,-34,44,5);ctx.fillStyle=e.boss?'#ff71bd':'#ff8d6a';ctx.fillRect(-22,-34,44*(e.hp/e.max),5);ctx.restore()}
function damageEnemy(e,d){e.hp-=d;for(let i=0;i<3;i++)S.sparks.push({x:e.x,y:e.y,life:.25,vx:rnd(-.05,.05),vy:rnd(-30,-8)});if(e.hp<=0){S.kills++;S.score+=e.boss?500:60;S.shake=Math.max(S.shake,e.boss?8:3);tone(e.boss?180:320,.08,'square',.03);if(S.kills%8===0){S.wave++;toast(`${S.wave}단계! 적이 강해집니다.`)}updateHud();return true}return false}
function fire(t){if(!S.enemies.length)return;let target=S.enemies.reduce((a,b)=>a.y>b.y?a:b);const visual=Math.min(8,Math.max(2,Math.ceil(Math.log10(S.units+1)*2)));for(let i=0;i<visual;i++)S.shots.push({x:S.x+rnd(-.035,.035),y:H*.76,tx:target.x,ty:target.y,life:.18+rnd(0,.08)});const damage=Math.max(1,S.units*.045);if(damageEnemy(target,damage))S.enemies=S.enemies.filter(e=>e!==target)}
function updateEnemies(dt,t){for(const e of S.enemies){e.y+=e.speed*dt;if(e.y>=H*.85){const hit=Math.max(3,Math.min(22,e.hp*.9));S.line-=hit;e.hp=0;S.shake=Math.max(S.shake,6);tone(110,.14,'sawtooth',.05);toast(`방어선 피해 -${Math.round(hit)}`)}}S.enemies=S.enemies.filter(e=>e.hp>0);if(S.line<=0)gameOver()}
function drawArmy(t){const x=roadX(H*.78,S.x),y=H*.78,rank=rankName(S.units),count=Math.min(13,3+Math.floor(Math.log10(S.units+1)*3));ctx.save();ctx.translate(x,y);for(let i=0;i<count;i++){const row=Math.floor(i/5),col=i%5,ox=(col-(Math.min(5,count-row*5)-1)/2)*13,oy=row*13;ctx.fillStyle=i===0?'#ffe37a':'#7ed6ff';ctx.fillRect(ox-4,oy-13,8,11);ctx.fillStyle='#1d3148';ctx.fillRect(ox-3,oy-18,6,6)}ctx.fillStyle='#ffffffdd';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(`${S.units.toLocaleString()} · ${rank}`,0,52);ctx.restore()}
function updateShots(dt){for(const s of S.shots)s.life-=dt;S.shots=S.shots.filter(s=>s.life>0);for(const p of S.sparks){p.life-=dt;p.y+=p.vy*dt;p.x+=p.vx*dt}S.sparks=S.sparks.filter(p=>p.life>0)}
function drawFx(){ctx.save();ctx.strokeStyle='#d8f6ff';ctx.lineWidth=2;for(const s of S.shots){const a=clamp(s.life/.25,0,1),x1=roadX(s.y,s.x),x2=roadX(s.ty,s.tx);ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(x1,s.y);ctx.lineTo(lerp(x2,x1,.5),lerp(s.ty,s.y,.5));ctx.stroke()}ctx.globalAlpha=1;for(const p of S.sparks){ctx.fillStyle='#ffe37a';ctx.fillRect(roadX(p.y,p.x)-2,p.y-2,4,4)}ctx.restore()}
function reset(){Object.assign(S,{running:true,units:12,line:100,wave:1,score:0,kills:0,x:.5,targetX:.5,scroll:0,gateTimer:1.7,enemyTimer:.6,shotTimer:0,gates:[],enemies:[],shots:[],sparks:[],shake:0});S.keys.clear();$('overlay').style.display='none';updateHud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function gameOver(){S.running=false;const o=$('overlay'),card=o.querySelector('.card');o.style.display='grid';card.innerHTML=`<h1>방어선 붕괴</h1><p><strong>${S.wave}단계</strong> · 점수 <strong>${S.score.toLocaleString()}</strong><br>최종 병력 ${S.units.toLocaleString()} (${rankName(S.units)})</p><button class="start" id="again">다시 도전</button>`;document.getElementById('again').onclick=reset}
function update(dt,t){S.scroll=(S.scroll+dt*.26)%1;let dir=0;if(S.keys.has('a')||S.keys.has('arrowleft'))dir--;if(S.keys.has('d')||S.keys.has('arrowright'))dir++;if(dir)S.targetX+=dir*dt*.5;S.targetX=clamp(S.targetX,.08,.92);S.x+= (S.targetX-S.x)*Math.min(1,dt*9);S.gateTimer-=dt;if(S.gateTimer<=0){spawnGate();S.gateTimer=rnd(4.7,6.2)}S.enemyTimer-=dt;if(S.enemyTimer<=0){spawnEnemy();S.enemyTimer=Math.max(.32,1.18-S.wave*.035)+rnd(0,.28)}S.shotTimer-=dt;if(S.shotTimer<=0){fire(t);S.shotTimer=.18}updateGates(dt,t);updateEnemies(dt,t);updateShots(dt);S.shake*=Math.pow(.04,dt)}
function render(t){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(S.shake>1)ctx.translate(rnd(-S.shake,S.shake),rnd(-S.shake,S.shake));floor();for(const g of S.gates)drawGates(g,t);for(const e of [...S.enemies].sort((a,b)=>a.y-b.y))drawEnemy(e,t);drawFx();drawArmy(t);ctx.restore()}
function loop(now){if(!S.running)return;const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;update(dt,now/1000);render(now/1000);raf=requestAnimationFrame(loop)}
function clearKeys(){S.keys.clear()}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['a','d','arrowleft','arrowright'].includes(k)){e.preventDefault();S.keys.add(k)}});addEventListener('keyup',e=>S.keys.delete(e.key.toLowerCase()));addEventListener('blur',clearKeys);addEventListener('pagehide',clearKeys);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearKeys()});
function pointer(e){const r=cvs.getBoundingClientRect();S.targetX=clamp((e.clientX-r.left)/r.width,.08,.92)}cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture?.(e.pointerId);pointer(e);e.preventDefault()});cvs.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
$('start').onclick=reset;updateHud();render(0);
})();
</script></body></html>
