<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실전쟁 3D</title><style>html,body{margin:0;height:100%;background:#08111d;color:#fff;font-family:system-ui;display:grid;place-items:center}#m{text-align:center;padding:24px}small{color:#94a3b8}</style></head><body><div id="m"><b>교실전쟁 3D 로딩 중...</b><br><small>KIDSCADE · 원본 게임 복원</small></div><script src="cw_part_1.js?v=3"></script><script src="cw_part_2.js?v=3"></script><script src="cw_part_3.js?v=3"></script><script src="cw_part_4.js?v=3"></script><script src="cw_part_5.js?v=3"></script><script>
(async()=>{
  const mount=document.getElementById('m');
  try{
    const parts=window.__CW||[];
    if(parts.length!==5||parts.some((p,i)=>typeof p!=='string'||p.length<1000))throw new Error('게임 본체 조각을 모두 불러오지 못했습니다.');
    const z=parts.join('');
    const b=Uint8Array.from(atob(z),c=>c.charCodeAt(0));
    let t='';
    if('DecompressionStream' in window){
      const ds=new DecompressionStream('gzip');
      t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();
    }else{
      await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('gzip 해제 모듈을 불러오지 못했습니다.'));document.head.appendChild(s);});
      if(!window.pako)throw new Error('gzip 해제 기능을 사용할 수 없습니다.');
      t=new TextDecoder().decode(window.pako.ungzip(b));
    }
    if(!t||!/<html|<!doctype/i.test(t))throw new Error('복원된 게임 데이터가 올바르지 않습니다.');
    document.open();document.write(t);document.close();
  }catch(e){
    console.error('[Classroom War loader]',e);
    mount.innerHTML='<b>교실전쟁 원본을 불러오지 못했습니다.</b><br><small>'+String(e&&e.message||e)+'</small>';
  }
})();
</script></body></html>
