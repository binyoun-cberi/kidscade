<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실전쟁 3D</title><style>html,body{margin:0;height:100%;background:#08111d;color:#fff;font-family:system-ui;display:grid;place-items:center}#m{text-align:center;padding:24px}small{color:#94a3b8}</style></head><body><div id="m"><b>교실전쟁 3D 로딩 중...</b><br><small>KIDSCADE</small></div><script src="cw_part_1.js"></script><script src="cw_part_2.js"></script><script src="cw_part_3.js"></script><script src="cw_part_4.js"></script><script src="cw_part_5.js"></script><script>(async()=>{try{const z=(window.__CW||[]).join('');const b=Uint8Array.from(atob(z),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('m').innerHTML='<b>게임을 불러오지 못했습니다.</b><br><small>'+e.message+'</small>';console.error(e)}})();</script></body></html>
