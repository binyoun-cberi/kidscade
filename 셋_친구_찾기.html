<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>셋 친구 찾기! | Kidscade</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(#fff8df,#edf6ff);color:#293244}button{font:inherit;border:0}.hide{display:none!important}.screen{min-height:100vh;padding:14px}.wrap{max-width:1050px;margin:auto}.hero{text-align:center;padding:28px 12px}.hero .ico{font-size:72px}.hero h1{font-size:clamp(40px,8vw,70px);margin:4px 0;color:#35405b}.hero p{color:#6f7a8c;font-weight:700;line-height:1.55}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px auto;max-width:860px}.mode{padding:18px;text-align:left;border-radius:24px;background:#fff;border:3px solid #fff;box-shadow:0 12px 30px #4b556318}.mode b{display:block;font-size:22px;margin:8px 0}.mode span{font-size:40px}.mode small{color:#788394;font-weight:700;line-height:1.4}.toolbar,.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.soft{padding:10px 14px;border-radius:14px;background:#fff;border:2px solid #e5e7eb;font-weight:900}.top{max-width:1050px;margin:auto;justify-content:space-between;align-items:center}.title{background:#fff;padding:10px 16px;border-radius:16px;font-weight:950;box-shadow:0 6px 18px #4b556315}.game{max-width:1050px;margin:8px auto;display:grid;grid-template-columns:1fr 260px;gap:10px}.panel{background:#ffffffdd;border:3px solid #fff;border-radius:24px;box-shadow:0 14px 35px #4b55631a;padding:12px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{aspect-ratio:1.05;background:#fff;border:3px solid #e7e2d7;border-radius:18px;box-shadow:0 6px 0 #ddd4c4;display:grid;place-items:center;position:relative}.card.sel{border-color:#ffc857;transform:translateY(-3px);box-shadow:0 8px 0 #dcab37}.card.hint{outline:6px solid #76a9ff55}.marks{display:flex;flex-direction:column;gap:4px;align-items:center}.sh{width:42px;height:21px;display:block}.pill{border-radius:99px}.diamond{width:32px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.wave{width:44px;height:17px;border-radius:55% 35% 55% 35%;transform:skewX(-20deg)}.red{background:#ef5a67}.green{background:#44b96b}.blue{background:#526de8}.side h2{margin:4px 0}.side p{color:#718093;font-size:13px;line-height:1.45;font-weight:700}.status{padding:11px;background:#f5f7fa;border-radius:15px;margin:8px 0;font-weight:900}.players{display:grid;gap:6px}.p{display:flex;justify-content:space-between;align-items:center;padding:9px;background:#f5f7fa;border-radius:13px}.p.on{outline:2px solid #ffc857}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{padding:11px;border-radius:13px;background:#eef1f5;font-weight:900}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#35405b;color:#fff;padding:10px 15px;border-radius:13px;font-weight:900;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#26344966;display:grid;place-items:center;padding:16px;z-index:20}.dialog{width:min(560px,100%);background:#fffdf7;border-radius:24px;padding:20px}.dialog h2{margin-top:0}.dialog p{color:#6f7a8c;line-height:1.55;font-weight:700}.primary{width:100%;padding:13px;border-radius:14px;background:#526de8;color:#fff;font-weight:950}.choices{display:flex;gap:7px}.choices button{flex:1;padding:11px;border-radius:13px;background:#eef1f5;font-weight:900}.choices button.on{background:#526de8;color:white}@media(max-width:760px){.modes{grid-template-columns:1fr}.game{grid-template-columns:1fr}.side{order:-1}.board{gap:6px}.card{border-radius:13px}.sh{width:34px;height:17px}.diamond{width:26px}.wave{width:36px;height:14px}.side p{display:none}}</style></head><body><section id="menu" class="screen"><div class="wrap hero"><div class="ico">🔎</div><h1>셋 친구 찾기!</h1><p>모양 · 색깔 · 개수를 비교해서 세 가지가 모두 같거나 모두 다른 카드 3장을 찾아요.</p><div class="modes"><button class="mode" id="learn"><span>🧸</span><b>처음 배우기</b><small>같은 것과 다른 것을 천천히 익혀요.</small></button><button class="mode" id="solo"><span>⭐</span><b>혼자 찾기</b><small>세 친구를 10번 찾아 별을 모아요.</small></button><button class="mode" id="friends"><span>👫</span><b>친구와 찾기</b><small>2~4명이 돌아가며 세 친구를 찾아요.</small></button></div><div class="toolbar"><button class="soft" id="rules">💡 놀이 방법</button><button class="soft" id="sound">🎵 소리 켜짐</button></div></div></section><section id="play" class="screen hide"><div class="top"><button class="soft" id="home">⌂</button><div class="title" id="turn">세 친구를 찾아보세요!</div><button class="soft" id="hint">💡 힌트</button></div><div class="game"><div class="panel"><div class="board" id="board"></div></div><aside class="panel side"><h2>같거나, 다르거나!</h2><p>모양 · 색깔 · 개수를 하나씩 봐요. 각 특징이 셋 다 같거나 셋 다 다르면 정답이에요.</p><div class="status" id="status">0 / 3 선택</div><div class="players" id="players"></div><div class="actions"><button id="shuffle">🔀 섞기</button><button id="check" disabled>확인</button></div><div class="status" id="progress">찾은 세 친구 0 / 10</div></aside></div></section><div id="setup" class="overlay hide"><div class="dialog"><h2>몇 명이 함께할까요?</h2><div class="choices"><button data-n="2" class="on">2명</button><button data-n="3">3명</button><button data-n="4">4명</button></div><button class="primary" id="startFriends">시작!</button></div></div><div id="info" class="overlay hide"><div class="dialog"><h2 id="infoTitle">놀이 방법</h2><p id="infoText"></p><button class="primary" id="infoClose">알겠어요!</button></div></div><div class="toast" id="toast"></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],colors=['red','green','blue'],shapes=['pill','wave','diamond'];let deck=[],board=[],sel=[],mode='solo',players=[],cur=0,found=0,miss=0,soundOn=true;const koC={red:'빨강',green:'초록',blue:'파랑'},koS={pill:'알약',wave:'물결',diamond:'마름모'};function tone(f){if(!soundOn)return;try{const a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.03;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1)}catch(e){}}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1300)}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeDeck(){let id=1,d=[];for(const shape of shapes)for(const color of colors)for(let count=1;count<=3;count++)d.push({id:id++,shape,color,count});return shuffle(d)}function allSameOrDiff(v){return new Set(v).size===1||new Set(v).size===3}function isSet(a){return a.length===3&&allSameOrDiff(a.map(x=>x.shape))&&allSameOrDiff(a.map(x=>x.color))&&allSameOrDiff(a.map(x=>x.count))}function sets(){let r=[];for(let i=0;i<board.length-2;i++)for(let j=i+1;j<board.length-1;j++)for(let k=j+1;k<board.length;k++)if(isSet([board[i],board[j],board[k]]))r.push([board[i],board[j],board[k]]);return r}function ensure(){let n=0;while(!sets().length&&n++<30){deck.push(...board);shuffle(deck);board=deck.splice(0,12)}}function marks(c){return `<div class="marks">${Array.from({length:c.count},()=>`<i class="sh ${c.shape} ${c.color}"></i>`).join('')}</div>`}function render(){const b=$('#board');b.innerHTML=board.map(c=>`<button class="card ${sel.some(x=>x.id===c.id)?'sel':''}" data-id="${c.id}" aria-label="${koC[c.color]} ${koS[c.shape]} ${c.count}개">${marks(c)}</button>`).join('');b.querySelectorAll('.card').forEach(e=>e.onclick=()=>pick(+e.dataset.id));$('#status').textContent=`${sel.length} / 3 선택`;$('#check').disabled=sel.length!==3;$('#progress').textContent=`찾은 세 친구 ${found} / 10`;$('#players').innerHTML=players.map((p,i)=>`<div class="p ${i===cur?'on':''}"><span>${p.e} ${p.name}</span><b>⭐ ${p.score}</b></div>`).join('');$('#turn').textContent=mode==='local'?`${players[cur].e} ${players[cur].name} 차례`:'세 친구를 찾아보세요!'}function pick(id){const c=board.find(x=>x.id===id),i=sel.findIndex(x=>x.id===id);if(i>=0)sel.splice(i,1);else if(sel.length<3)sel.push(c);tone(420);render();if(sel.length===3)setTimeout(check,180)}function check(){if(sel.length!==3)return;if(isSet(sel)){found++;players[cur].score++;tone(800);toast('딩동댕! 세 친구예요 ⭐');const ids=new Set(sel.map(x=>x.id));board=board.filter(x=>!ids.has(x.id));while(board.length<12&&deck.length)board.push(deck.shift());sel=[];ensure()}else{miss++;tone(180);toast('조금 달라요. 다시 살펴봐요!');sel=[]}if(mode==='local')cur=(cur+1)%players.length;if(found>=10){alert(mode==='local'?'게임 끝!':'성공! 세 친구를 10번 찾았어요!');home();return}render()}function start(m,n=1){mode=m;cur=0;found=miss=0;deck=makeDeck();board=deck.splice(0,12);ensure();const es=['🐰','🐻','🐼','🦊'];players=Array.from({length:n},(_,i)=>({e:es[i],name:n===1?'나':`${i+1}번 친구`,score:0}));$('#menu').classList.add('hide');$('#play').classList.remove('hide');render()}function home(){$('#play').classList.add('hide');$('#menu').classList.remove('hide')}$('#solo').onclick=()=>start('solo');$('#friends').onclick=()=>$('#setup').classList.remove('hide');$$('#setup [data-n]').forEach(b=>b.onclick=()=>{$$('#setup [data-n]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('#startFriends').onclick=()=>{$('#setup').classList.add('hide');start('local',+$('#setup .on').dataset.n)};$('#home').onclick=home;$('#check').onclick=check;$('#shuffle').onclick=()=>{deck.push(...board);shuffle(deck);board=deck.splice(0,12);ensure();sel=[];render()};$('#hint').onclick=()=>{const s=sets()[0];if(!s)return;const e=$('#board').querySelector(`[data-id="${s[0].id}"]`);e?.classList.add('hint');toast('이 카드부터 살펴보세요 💡');setTimeout(()=>e?.classList.remove('hint'),2200)};function info(title,text){$('#infoTitle').textContent=title;$('#infoText').textContent=text;$('#info').classList.remove('hide')}$('#learn').onclick=()=>info('🧸 처음 배우기','카드에는 모양, 색깔, 개수가 있어요. 세 장을 골랐을 때 각 특징이 모두 같거나 모두 다르면 세 친구예요. 빨강·빨강·파랑처럼 둘만 같은 것은 아니에요.');$('#rules').onclick=()=>info('💡 놀이 방법','알약·물결·마름모, 빨강·초록·파랑, 1·2·3개를 하나씩 비교해 보세요. 세 특징이 각각 모두 같거나 모두 다르면 성공!');$('#infoClose').onclick=()=>$('#info').classList.add('hide');$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🎵 소리 켜짐':'🔇 소리 꺼짐'}})();</script></body></html>
