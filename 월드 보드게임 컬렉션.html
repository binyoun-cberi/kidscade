<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>월드 보드게임 컬렉션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap');

        :root {
            --bg-color: #1e293b;
            --board-wood: #dcb37b;
            --board-dark: #b88b4a;
            --chess-light: #f0d9b5;
            --chess-dark: #b58863;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #334155 0%, #0f172a 100%);
            color: #f8fafc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 메뉴 화면 */
        #menu-screen {
            position: absolute; inset: 0; z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
        }

        .game-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #475569;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            transform: translateY(-10px);
            border-color: #fbbf24;
            box-shadow: 0 20px 40px rgba(251, 191, 36, 0.2);
        }
        .game-card i { font-size: 60px; margin-bottom: 15px; display: block; font-style: normal; }

        /* 메인 게임 UI */
        #game-screen {
            display: none; flex-direction: column; height: 100%;
        }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #334155;
        }

        .board-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 20px; overflow: hidden; position: relative;
        }

        /* 공통 보드 스타일 */
        #board-wrapper {
            position: relative;
            background-color: var(--board-wood);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        /* 바둑/장기 선 그리기용 SVG 캔버스 */
        #board-lines {
            position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
        }

        /* 클릭 감지 및 기물 컨테이너 */
        #pieces-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
        }

        /* 기물 공통 스타일 및 애니메이션 */
        .piece {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            transition: top 0.3s ease-in-out, left 0.3s ease-in-out, transform 0.2s, opacity 0.2s;
            cursor: pointer; z-index: 10;
        }
        .piece.moving { z-index: 20; }
        .piece.captured { transform: translate(-50%, -50%) scale(0); opacity: 0; }

        /* 바둑돌 */
        .stone { border-radius: 50%; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .stone-black {
            background: radial-gradient(circle at 30% 30%, #444, #000);
        }
        .stone-white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }

        /* 체스 기물 */
        .chess-piece {
            font-size: 50px; font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        .chess-white { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 2px #000; }
        .chess-black { color: #111; text-shadow: 0 2px 4px rgba(255,255,255,0.3); }

        /* 장기 기물 */
        .janggi-piece {
            border-radius: 50%; font-weight: 900;
            background: radial-gradient(circle at 40% 40%, #e6cdab, #cda87c);
            border: 2px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,255,255,0.5);
            display: flex; justify-content: center; align-items: center;
        }
        .janggi-cho { color: #059669; border-color: #059669; } /* Blue/Green */
        .janggi-han { color: #dc2626; border-color: #dc2626; } /* Red */
        .janggi-king { font-size: 28px; }
        .janggi-normal { font-size: 24px; }

        /* 선택 및 이동 가능 하이라이트 */
        .highlight-selected {
            background-color: rgba(251, 191, 36, 0.5) !important;
            border-radius: 50%;
            box-shadow: 0 0 15px #fbbf24;
        }
        .valid-move {
            position: absolute; transform: translate(-50%, -50%);
            width: 20px; height: 20px; border-radius: 50%;
            background-color: rgba(16, 185, 129, 0.6);
            z-index: 5; pointer-events: none;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }
        .valid-capture {
            position: absolute; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border-radius: 50%;
            border: 4px solid rgba(239, 68, 68, 0.8);
            z-index: 15; pointer-events: none;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* 턴 알림 모달 */
        #turn-indicator {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 2px solid #fbbf24;
            padding: 10px 30px; border-radius: 30px; font-weight: bold;
            font-size: 1.2rem; z-index: 100; transition: color 0.3s;
        }

        /* 뒤로가기 버튼 */
        .btn-back {
            background: transparent; border: 1px solid #475569; padding: 8px 16px;
            border-radius: 8px; color: #cbd5e1; cursor: pointer; transition: 0.2s;
        }
        .btn-back:hover { background: #334155; color: #fff; }

        @keyframes popScale {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .anim-pop { animation: popScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 class="text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 drop-shadow-lg text-center leading-tight">
            월드 보드게임<br>컬렉션
        </h1>
        <p class="text-slate-400 mb-12 text-lg">플레이할 게임을 선택하세요.</p>
        
        <div class="flex flex-wrap justify-center gap-6 max-w-4xl px-4">
            <div class="game-card w-64" onclick="openSettings('baduk')">
                <i>⚫⚪</i>
                <h2 class="text-2xl font-bold text-white mb-2">바둑 (Go)</h2>
                <p class="text-slate-400 text-sm break-keep">집을 넓히고 상대의 돌을 에워싸 따내세요. (19x19)</p>
            </div>
            <div class="game-card w-64" onclick="openSettings('chess')">
                <i>♔♚</i>
                <h2 class="text-2xl font-bold text-white mb-2">체스 (Chess)</h2>
                <p class="text-slate-400 text-sm break-keep">기물들의 능력을 활용해 상대의 킹을 체크메이트 하세요.</p>
            </div>
            <div class="game-card w-64" onclick="openSettings('janggi')">
                <i style="color:#dc2626; font-family:'Noto Serif KR',serif;">漢楚</i>
                <h2 class="text-2xl font-bold text-white mb-2">장기 (Janggi)</h2>
                <p class="text-slate-400 text-sm break-keep">차, 포, 마, 상을 움직여 적의 궁을 사로잡으세요.</p>
            </div>
        </div>
    </div>

    <div id="settings-screen" style="display:none; position: absolute; inset: 0; z-index: 60; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-yellow-500 text-center max-w-md w-[90%] shadow-2xl">
            <h2 class="text-3xl font-bold text-white mb-6">게임 설정</h2>
            <div class="mb-6">
                <label class="block text-slate-300 font-bold mb-3">플레이 모드</label>
                <div class="flex gap-2 justify-center">
                    <button id="btn-pvp" class="flex-1 py-3 rounded-lg bg-yellow-500 text-black font-bold transition-colors" onclick="setMode('pvp')">1 VS 1 (같이 하기)</button>
                    <button id="btn-cpu" class="flex-1 py-3 rounded-lg bg-slate-600 text-white font-bold transition-colors" onclick="setMode('cpu')">1 VS CPU (혼자 하기)</button>
                </div>
            </div>
            <div id="cpu-difficulty-section" class="mb-8" style="display:none;">
                <label class="block text-slate-300 font-bold mb-3">CPU 난이도</label>
                <div class="flex gap-2 justify-center">
                    <button id="btn-easy" class="flex-1 py-2 rounded-lg bg-slate-600 text-white font-bold transition-colors" onclick="setDiff('easy')">쉬움</button>
                    <button id="btn-normal" class="flex-1 py-2 rounded-lg bg-yellow-500 text-black font-bold transition-colors" onclick="setDiff('normal')">보통</button>
                    <button id="btn-hard" class="flex-1 py-2 rounded-lg bg-slate-600 text-white font-bold transition-colors" onclick="setDiff('hard')">어려움</button>
                </div>
            </div>
            <div class="flex gap-3">
                <button class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 rounded-lg text-xl transition-colors" onclick="closeSettings()">취소</button>
                <button class="flex-1 bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 rounded-lg text-xl transition-colors" onclick="applySettingsAndStart()">게임 시작!</button>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <div class="header">
            <button class="btn-back" onclick="returnToMenu()">← 메뉴로 돌아가기</button>
            <h2 id="game-title" class="text-2xl font-bold text-yellow-400 tracking-wider m-0">GAME</h2>
            <div class="w-24"></div> </div>

        <div id="turn-indicator">게임 준비 중...</div>

        <div class="board-container">
            <div id="board-wrapper">
                <svg id="board-lines"></svg>
                <div id="pieces-layer"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Audio Engine (Web Audio API)
        // ==========================================
        const AudioEngine = (() => {
            let ctx = null;

            const init = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); };
            const resume = () => { if (ctx && ctx.state === 'suspended') ctx.resume(); };

            const playTone = (freq, type, duration, vol=0.1, slideFreq=null) => {
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if(slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);

                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            };

            return {
                init, resume,
                place: () => { init(); resume(); playTone(300, 'triangle', 0.1, 0.2); },
                capture: () => { init(); resume(); playTone(800, 'sine', 0.15, 0.1, 400); playTone(600, 'square', 0.1, 0.05); },
                win: () => { 
                    init(); resume(); 
                    playTone(440, 'sine', 0.2, 0.1); 
                    setTimeout(()=>playTone(554, 'sine', 0.2, 0.1), 200); 
                    setTimeout(()=>playTone(659, 'sine', 0.6, 0.1), 400); 
                },
                error: () => { init(); resume(); playTone(150, 'sawtooth', 0.2, 0.1, 100); }
            };
        })();

        // ==========================================
        // 2. Global UI & State Management
        // ==========================================
        const els = {
            menu: document.getElementById('menu-screen'),
            settings: document.getElementById('settings-screen'),
            game: document.getElementById('game-screen'),
            title: document.getElementById('game-title'),
            turnIndicator: document.getElementById('turn-indicator'),
            boardWrapper: document.getElementById('board-wrapper'),
            boardLines: document.getElementById('board-lines'),
            piecesLayer: document.getElementById('pieces-layer')
        };

        let currentGameInstance = null;
        let gameConfig = { mode: 'pvp', difficulty: 'normal', type: '' };

        function openSettings(type) {
            gameConfig.type = type;
            els.settings.style.display = 'flex';
        }

        function closeSettings() {
            els.settings.style.display = 'none';
        }

        function setMode(mode) {
            gameConfig.mode = mode;
            document.getElementById('btn-pvp').style.background = mode === 'pvp' ? '#fbbf24' : '#475569';
            document.getElementById('btn-pvp').style.color = mode === 'pvp' ? '#000' : '#fff';
            document.getElementById('btn-cpu').style.background = mode === 'cpu' ? '#fbbf24' : '#475569';
            document.getElementById('btn-cpu').style.color = mode === 'cpu' ? '#000' : '#fff';
            document.getElementById('cpu-difficulty-section').style.display = mode === 'cpu' ? 'block' : 'none';
        }

        function setDiff(diff) {
            gameConfig.difficulty = diff;
            ['easy', 'normal', 'hard'].forEach(d => {
                document.getElementById(`btn-${d}`).style.background = d === diff ? '#fbbf24' : '#475569';
                document.getElementById(`btn-${d}`).style.color = d === diff ? '#000' : '#fff';
            });
        }

        function applySettingsAndStart() {
            els.settings.style.display = 'none';
            startGame(gameConfig.type);
        }

        function startGame(type) {
            AudioEngine.init();
            els.menu.style.display = 'none';
            els.game.style.display = 'flex';
            
            // Clear board
            els.boardLines.innerHTML = '';
            els.piecesLayer.innerHTML = '';

            if (type === 'baduk') {
                els.title.textContent = '바둑 (Go)';
                currentGameInstance = new BadukGame();
            } else if (type === 'chess') {
                els.title.textContent = '체스 (Chess)';
                currentGameInstance = new ChessGame();
            } else if (type === 'janggi') {
                els.title.textContent = '장기 (Janggi)';
                currentGameInstance = new JanggiGame();
            }
        }

        function returnToMenu() {
            if(currentGameInstance) currentGameInstance.destroy();
            currentGameInstance = null;
            els.game.style.display = 'none';
            els.menu.style.display = 'flex';
        }

        function setTurnText(text, color) {
            els.turnIndicator.textContent = text;
            els.turnIndicator.style.color = color;
            els.turnIndicator.style.borderColor = color;
        }

        // ==========================================
        // 3. Baduk (Go) Game Logic
        // ==========================================
        class BadukGame {
            constructor() {
                this.size = 19;
                this.cellSize = 32;
                this.padding = 20;
                this.board = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                this.turn = 1; // 1: Black, 2: White
                
                this.setupBoard();
                this.bindEvents();
                this.updateTurnUI();
            }

            setupBoard() {
                const width = (this.size - 1) * this.cellSize + this.padding * 2;
                els.boardWrapper.style.width = `${width}px`;
                els.boardWrapper.style.height = `${width}px`;
                els.boardWrapper.style.backgroundColor = 'var(--board-wood)';
                els.boardWrapper.style.backgroundImage = 'none';

                let svgHTML = '';
                for (let i = 0; i < this.size; i++) {
                    const pos = this.padding + i * this.cellSize;
                    svgHTML += `<line x1="${this.padding}" y1="${pos}" x2="${width - this.padding}" y2="${pos}" stroke="#333" stroke-width="1.5"/>`;
                    svgHTML += `<line x1="${pos}" y1="${this.padding}" x2="${pos}" y2="${width - this.padding}" stroke="#333" stroke-width="1.5"/>`;
                }

                const hoshi = [3, 9, 15];
                hoshi.forEach(x => {
                    hoshi.forEach(y => {
                        const cx = this.padding + x * this.cellSize;
                        const cy = this.padding + y * this.cellSize;
                        svgHTML += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#111"/>`;
                    });
                });
                els.boardLines.innerHTML = svgHTML;
            }

            updateTurnUI() {
                setTurnText(this.turn === 1 ? '흑(Black)의 차례' : '백(White)의 차례', this.turn === 1 ? '#94a3b8' : '#ffffff');
            }

            bindEvents() {
                this.clickHandler = (e) => {
                    e.preventDefault();
                    const rect = els.piecesLayer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const gridX = Math.round((x - this.padding) / this.cellSize);
                    const gridY = Math.round((y - this.padding) / this.cellSize);

                    if (gridX >= 0 && gridX < this.size && gridY >= 0 && gridY < this.size) {
                        this.placeStone(gridX, gridY);
                    }
                };
                els.piecesLayer.addEventListener('pointerdown', this.clickHandler);
            }

            placeStone(x, y) {
                if (this.board[y][x] !== 0) { AudioEngine.error(); return; }

                this.board[y][x] = this.turn;
                
                const opponent = this.turn === 1 ? 2 : 1;
                let capturedAny = false;
                
                const neighbors = this.getNeighbors(x, y);
                neighbors.forEach(n => {
                    if (this.board[n.y][n.x] === opponent) {
                        const group = this.getGroup(n.x, n.y, opponent);
                        if (this.countLiberties(group) === 0) {
                            this.removeGroup(group);
                            capturedAny = true;
                        }
                    }
                });

                const myGroup = this.getGroup(x, y, this.turn);
                if (!capturedAny && this.countLiberties(myGroup) === 0) {
                    this.board[y][x] = 0;
                    AudioEngine.error();
                    return;
                }

                AudioEngine.place();
                this.renderStone(x, y, this.turn);
                
                this.turn = opponent;
                this.updateTurnUI();

                if (gameConfig.mode === 'cpu' && this.turn === 2) {
                    setTurnText('CPU 생각 중...', '#fbbf24');
                    setTimeout(() => this.makeAIMove(), 800);
                }
            }

            makeAIMove() {
                let emptySpots = [];
                for(let y=0; y<this.size; y++) {
                    for(let x=0; x<this.size; x++) {
                        if(this.board[y][x] === 0) emptySpots.push({x, y});
                    }
                }
                if(emptySpots.length === 0) return;
                
                emptySpots.sort(() => Math.random() - 0.5);
                let bestMove = emptySpots[0];
                
                if (gameConfig.difficulty !== 'easy') {
                    let bestScore = -Infinity;
                    for(let spot of emptySpots) {
                        let simBoard = this.board.map(row => [...row]);
                        simBoard[spot.y][spot.x] = 2;
                        
                        let captures = 0;
                        let neighbors = [{x:spot.x-1,y:spot.y}, {x:spot.x+1,y:spot.y}, {x:spot.x,y:spot.y-1}, {x:spot.x,y:spot.y+1}].filter(n => n.x>=0 && n.x<this.size && n.y>=0 && n.y<this.size);
                        
                        neighbors.forEach(n => {
                            if(simBoard[n.y][n.x] === 1) {
                                let group = this.getGroupVirtual(simBoard, n.x, n.y, 1);
                                if(this.countLibertiesVirtual(simBoard, group) === 0) {
                                    captures += group.length;
                                    group.forEach(p => simBoard[p.y][p.x] = 0);
                                }
                            }
                        });
                        
                        let myGroup = this.getGroupVirtual(simBoard, spot.x, spot.y, 2);
                        let myLiberties = this.countLibertiesVirtual(simBoard, myGroup);
                        if(captures === 0 && myLiberties === 0) continue;
                        
                        let score = captures * 50 + myLiberties * 5;
                        if(gameConfig.difficulty === 'hard') {
                            neighbors.forEach(n => {
                                if(this.board[n.y][n.x] !== 0) score += 2;
                            });
                        }
                        
                        if(score > bestScore) {
                            bestScore = score;
                            bestMove = spot;
                        }
                    }
                }
                
                this.placeStone(bestMove.x, bestMove.y);
            }

            getGroupVirtual(board, startX, startY, color) {
                const group = [];
                const visited = new Set();
                const queue = [{x: startX, y: startY}];
                visited.add(`${startX},${startY}`);

                while (queue.length > 0) {
                    const curr = queue.shift();
                    group.push(curr);
                    [{x:curr.x-1,y:curr.y}, {x:curr.x+1,y:curr.y}, {x:curr.x,y:curr.y-1}, {x:curr.x,y:curr.y+1}].forEach(n => {
                        if(n.x>=0 && n.x<this.size && n.y>=0 && n.y<this.size) {
                            const key = `${n.x},${n.y}`;
                            if (!visited.has(key) && board[n.y][n.x] === color) {
                                visited.add(key);
                                queue.push(n);
                            }
                        }
                    });
                }
                return group;
            }

            countLibertiesVirtual(board, group) {
                const liberties = new Set();
                group.forEach(p => {
                    [{x:p.x-1,y:p.y}, {x:p.x+1,y:p.y}, {x:p.x,y:p.y-1}, {x:p.x,y:p.y+1}].forEach(n => {
                        if(n.x>=0 && n.x<this.size && n.y>=0 && n.y<this.size && board[n.y][n.x] === 0) {
                            liberties.add(`${n.x},${n.y}`);
                        }
                    });
                });
                return liberties.size;
            }

            renderStone(x, y, color) {
                const stone = document.createElement('div');
                stone.className = `piece stone ${color === 1 ? 'stone-black' : 'stone-white'} anim-pop`;
                stone.style.width = `${this.cellSize * 0.9}px`;
                stone.style.height = `${this.cellSize * 0.9}px`;
                stone.style.left = `${this.padding + x * this.cellSize}px`;
                stone.style.top = `${this.padding + y * this.cellSize}px`;
                stone.dataset.x = x;
                stone.dataset.y = y;
                els.piecesLayer.appendChild(stone);
            }

            removeGroup(group) {
                AudioEngine.capture();
                group.forEach(p => {
                    this.board[p.y][p.x] = 0;
                    const el = els.piecesLayer.querySelector(`.stone[data-x="${p.x}"][data-y="${p.y}"]`);
                    if (el) {
                        el.classList.add('captured');
                        setTimeout(() => el.remove(), 200);
                    }
                });
            }

            getNeighbors(x, y) {
                const n = [];
                if (x > 0) n.push({x: x-1, y: y});
                if (x < this.size - 1) n.push({x: x+1, y: y});
                if (y > 0) n.push({x: x, y: y-1});
                if (y < this.size - 1) n.push({x: x, y: y+1});
                return n;
            }

            getGroup(startX, startY, color) {
                const group = [];
                const visited = new Set();
                const queue = [{x: startX, y: startY}];
                
                visited.add(`${startX},${startY}`);

                while (queue.length > 0) {
                    const curr = queue.shift();
                    group.push(curr);

                    this.getNeighbors(curr.x, curr.y).forEach(n => {
                        const key = `${n.x},${n.y}`;
                        if (!visited.has(key) && this.board[n.y][n.x] === color) {
                            visited.add(key);
                            queue.push(n);
                        }
                    });
                }
                return group;
            }

            countLiberties(group) {
                const liberties = new Set();
                group.forEach(p => {
                    this.getNeighbors(p.x, p.y).forEach(n => {
                        if (this.board[n.y][n.x] === 0) {
                            liberties.add(`${n.x},${n.y}`);
                        }
                    });
                });
                return liberties.size;
            }

            destroy() {
                els.piecesLayer.removeEventListener('pointerdown', this.clickHandler);
            }
        }

        // ==========================================
        // 4. Chess Game Logic
        // ==========================================
        class ChessGame {
            constructor() {
                this.cellSize = 70;
                this.board = [];
                this.turn = 'white';
                this.selectedPiece = null;
                this.isGameOver = false; // 종료 상태 플래그
                
                this.piecesMap = {
                    'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔',
                    'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚'
                };
                
                this.setupBoard();
                this.initPieces();
                this.updateTurnUI();
                this.bindEvents();
            }

            setupBoard() {
                const width = 8 * this.cellSize;
                els.boardWrapper.style.width = `${width}px`;
                els.boardWrapper.style.height = `${width}px`;
                
                els.boardWrapper.style.backgroundColor = 'var(--chess-light)';
                els.boardWrapper.style.backgroundImage = `
                    linear-gradient(45deg, var(--chess-dark) 25%, transparent 25%, transparent 75%, var(--chess-dark) 75%, var(--chess-dark)),
                    linear-gradient(45deg, var(--chess-dark) 25%, transparent 25%, transparent 75%, var(--chess-dark) 75%, var(--chess-dark))`;
                els.boardWrapper.style.backgroundSize = `${this.cellSize * 2}px ${this.cellSize * 2}px`;
                els.boardWrapper.style.backgroundPosition = `0 0, ${this.cellSize}px ${this.cellSize}px`;
                els.boardLines.innerHTML = '';
            }

            initPieces() {
                const initial = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];

                this.board = Array(8).fill(null).map(() => Array(8).fill(null));

                for (let y = 0; y < 8; y++) {
                    for (let x = 0; x < 8; x++) {
                        const char = initial[y][x];
                        if (char) {
                            const color = char === char.toUpperCase() ? 'white' : 'black';
                            const type = char.toLowerCase();
                            this.createPieceDOM(x, y, type, color, this.piecesMap[char]);
                        }
                    }
                }
            }

            createPieceDOM(x, y, type, color, symbol) {
                const el = document.createElement('div');
                el.className = `piece chess-piece chess-${color}`;
                el.textContent = symbol;
                el.style.width = `${this.cellSize}px`;
                el.style.height = `${this.cellSize}px`;
                el.style.fontSize = `${this.cellSize * 0.7}px`;
                
                const pieceData = { x, y, type, color, el, symbol };
                this.board[y][x] = pieceData;
                
                this.updatePiecePosition(pieceData);
                els.piecesLayer.appendChild(el);
            }

            updatePiecePosition(piece) {
                piece.el.style.left = `${piece.x * this.cellSize + this.cellSize/2}px`;
                piece.el.style.top = `${piece.y * this.cellSize + this.cellSize/2}px`;
            }

            updateTurnUI() {
                setTurnText(this.turn === 'white' ? '백(White)의 차례' : '흑(Black)의 차례', this.turn === 'white' ? '#fff' : '#475569');
            }

            bindEvents() {
                this.clickHandler = (e) => {
                    e.preventDefault();
                    if (this.isGameOver) return; // 게임 종료 시 클릭 방지

                    const rect = els.piecesLayer.getBoundingClientRect();
                    const cx = e.clientX - rect.left;
                    const cy = e.clientY - rect.top;
                    const gridX = Math.floor(cx / this.cellSize);
                    const gridY = Math.floor(cy / this.cellSize);

                    if (gridX < 0 || gridX >= 8 || gridY < 0 || gridY >= 8) return;

                    const indicator = document.querySelector(`.valid-move[data-x="${gridX}"][data-y="${gridY}"], .valid-capture[data-x="${gridX}"][data-y="${gridY}"]`);
                    if (indicator) {
                        this.executeMove(gridX, gridY);
                        return;
                    }

                    const clickedPiece = this.board[gridY][gridX];

                    if (this.selectedPiece) {
                        if (clickedPiece && clickedPiece.color === this.turn) {
                            this.selectPiece(clickedPiece);
                        } else {
                            this.clearHighlights();
                            this.selectedPiece = null;
                        }
                    } else {
                        if (clickedPiece && clickedPiece.color === this.turn) {
                            this.selectPiece(clickedPiece);
                        }
                    }
                };
                els.piecesLayer.addEventListener('mousedown', this.clickHandler);
            }

            selectPiece(piece) {
                this.clearHighlights();
                this.selectedPiece = piece;
                piece.el.classList.add('highlight-selected');
                this.showValidMoves(piece);
            }

            clearHighlights() {
                document.querySelectorAll('.highlight-selected').forEach(el => el.classList.remove('highlight-selected'));
                document.querySelectorAll('.valid-move, .valid-capture').forEach(el => el.remove());
            }

            showValidMoves(piece) {
                const moves = this.getValidMoves(piece, this.board);
                moves.forEach(m => {
                    const indicator = document.createElement('div');
                    const isCapture = this.board[m.y][m.x] !== null;
                    indicator.className = isCapture ? 'valid-capture' : 'valid-move';
                    indicator.style.left = `${m.x * this.cellSize + this.cellSize/2}px`;
                    indicator.style.top = `${m.y * this.cellSize + this.cellSize/2}px`;
                    indicator.dataset.x = m.x;
                    indicator.dataset.y = m.y;
                    
                    els.piecesLayer.appendChild(indicator);
                });
            }

            getValidMoves(piece, testBoard) {
                const moves = [];
                const addIfValid = (nx, ny) => {
                    if (nx < 0 || nx >= 8 || ny < 0 || ny >= 8) return false;
                    const target = testBoard[ny][nx];
                    if (target) {
                        if (target.color !== piece.color) moves.push({x: nx, y: ny});
                        return false;
                    }
                    moves.push({x: nx, y: ny});
                    return true;
                };

                const rayCast = (dirs) => {
                    dirs.forEach(d => {
                        let nx = piece.x + d.dx, ny = piece.y + d.dy;
                        while(addIfValid(nx, ny)) { nx += d.dx; ny += d.dy; }
                    });
                };

                const {x, y, type, color} = piece;
                const dir = color === 'white' ? -1 : 1;

                switch(type) {
                    case 'p':
                        if (y+dir >= 0 && y+dir < 8 && !testBoard[y+dir][x]) {
                            moves.push({x: x, y: y+dir});
                            if ((color==='white' && y===6) || (color==='black' && y===1)) {
                                if(!testBoard[y+dir*2][x]) moves.push({x: x, y: y+dir*2});
                            }
                        }
                        if (x-1 >= 0 && y+dir >= 0 && y+dir < 8 && testBoard[y+dir][x-1] && testBoard[y+dir][x-1].color !== color) moves.push({x: x-1, y: y+dir});
                        if (x+1 < 8 && y+dir >= 0 && y+dir < 8 && testBoard[y+dir][x+1] && testBoard[y+dir][x+1].color !== color) moves.push({x: x+1, y: y+dir});
                        break;
                    case 'r': rayCast([{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}]); break;
                    case 'b': rayCast([{dx:1,dy:1}, {dx:1,dy:-1}, {dx:-1,dy:1}, {dx:-1,dy:-1}]); break;
                    case 'q': rayCast([{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}, {dx:1,dy:1}, {dx:1,dy:-1}, {dx:-1,dy:1}, {dx:-1,dy:-1}]); break;
                    case 'k':
                        [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}, {dx:1,dy:1}, {dx:1,dy:-1}, {dx:-1,dy:1}, {dx:-1,dy:-1}].forEach(d => {
                            const nx = x+d.dx, ny = y+d.dy;
                            if(nx>=0 && nx<8 && ny>=0 && ny<8) {
                                if(!testBoard[ny][nx] || testBoard[ny][nx].color !== color) moves.push({x:nx, y:ny});
                            }
                        });
                        break;
                    case 'n':
                        [{dx:1,dy:2}, {dx:2,dy:1}, {dx:-1,dy:2}, {dx:-2,dy:1}, {dx:1,dy:-2}, {dx:2,dy:-1}, {dx:-1,dy:-2}, {dx:-2,dy:-1}].forEach(d => {
                            const nx = x+d.dx, ny = y+d.dy;
                            if(nx>=0 && nx<8 && ny>=0 && ny<8) {
                                if(!testBoard[ny][nx] || testBoard[ny][nx].color !== color) moves.push({x:nx, y:ny});
                            }
                        });
                        break;
                }
                return moves;
            }

            executeMove(tx, ty) {
                const piece = this.selectedPiece;
                const targetPiece = this.board[ty][tx];
                let isWin = false; // 왕을 잡았는지 체크

                this.clearHighlights();

                if (targetPiece) {
                    AudioEngine.capture();
                    targetPiece.el.classList.add('captured');
                    setTimeout(() => targetPiece.el.remove(), 300);
                    
                    if(targetPiece.type === 'k') {
                        isWin = true;
                        this.isGameOver = true;
                    }
                } else {
                    AudioEngine.place();
                }

                // Update logical board
                this.board[piece.y][piece.x] = null;
                piece.x = tx; piece.y = ty;
                this.board[ty][tx] = piece;

                // Move DOM
                piece.el.classList.add('moving');
                this.updatePiecePosition(piece);
                setTimeout(() => piece.el.classList.remove('moving'), 300);

                this.selectedPiece = null;

                // 킹을 잡은 경우 여기서 종료 (턴을 넘기지 않음)
                if (isWin) {
                    const winnerName = piece.color === 'white' ? '백(White)' : '흑(Black)';
                    setTimeout(() => {
                        AudioEngine.win();
                        setTurnText(`🎉 ${winnerName} 승리! (게임 종료)`, '#fbbf24');
                    }, 300);
                    return;
                }

                this.turn = this.turn === 'white' ? 'black' : 'white';
                this.updateTurnUI();

                if (gameConfig.mode === 'cpu' && this.turn === 'black' && !this.isGameOver) {
                    setTurnText('CPU 생각 중...', '#fbbf24');
                    setTimeout(() => this.makeAIMove(), 800);
                }
            }

            makeAIMove() {
                if(this.isGameOver) return; // 만약의 경우 방지
                
                let moves = this.getVirtualMoves(this.board, 'black');
                if(moves.length === 0) return;
                
                moves.sort(() => Math.random() - 0.5);
                let bestMove = moves[0];
                
                if (gameConfig.difficulty !== 'easy') {
                    let bestScore = -Infinity;
                    let depth = gameConfig.difficulty === 'hard' ? 2 : 1;
                    
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(this.board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        
                        let score = this.minimaxChess(simBoard, depth - 1, false, -Infinity, Infinity);
                        if(score > bestScore) {
                            bestScore = score;
                            bestMove = m;
                        }
                    }
                }
                
                this.selectedPiece = this.board[bestMove.fy][bestMove.fx];
                this.executeMove(bestMove.tx, bestMove.ty);
            }

            getVirtualMoves(board, color) {
                let moves = [];
                for(let y=0; y<8; y++){
                    for(let x=0; x<8; x++){
                        let p = board[y][x];
                        if(p && p.color === color) {
                            let pieceMoves = this.getValidMoves(p, board);
                            pieceMoves.forEach(m => moves.push({fx:x, fy:y, tx:m.x, ty:m.y}));
                        }
                    }
                }
                return moves;
            }

            cloneBoard(board) {
                return board.map(row => row.map(p => p ? {x: p.x, y: p.y, type: p.type, color: p.color} : null));
            }

            minimaxChess(board, depth, isMax, alpha, beta) {
                if(depth === 0) return this.evaluateChess(board);
                let color = isMax ? 'black' : 'white';
                let moves = this.getVirtualMoves(board, color);

                if(moves.length === 0) return isMax ? -9999 : 9999;

                if(isMax) {
                    let maxEval = -Infinity;
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        let ev = this.minimaxChess(simBoard, depth-1, false, alpha, beta);
                        maxEval = Math.max(maxEval, ev);
                        alpha = Math.max(alpha, ev);
                        if(beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        let ev = this.minimaxChess(simBoard, depth-1, true, alpha, beta);
                        minEval = Math.min(minEval, ev);
                        beta = Math.min(beta, ev);
                        if(beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            evaluateChess(board) {
                let score = 0;
                const vals = {p:1, n:3, b:3, r:5, q:9, k:100};
                for(let y=0; y<8; y++){
                    for(let x=0; x<8; x++){
                        let p = board[y][x];
                        if(p) {
                            let val = vals[p.type];
                            score += p.color === 'black' ? val : -val;
                        }
                    }
                }
                return score;
            }

            destroy() {
                els.piecesLayer.removeEventListener('mousedown', this.clickHandler);
            }
        }

                    indicator.dataset.x = m.x;
                    indicator.dataset.y = m.y;
                    
                    els.piecesLayer.appendChild(indicator);
                });
            }

            isPalace(x, y) {
                return (x >= 3 && x <= 5) && ((y >= 0 && y <= 2) || (y >= 7 && y <= 9));
            }

            getPalaceCenter(y) {
                if (y <= 2) return {x: 4, y: 1};
                if (y >= 7) return {x: 4, y: 8};
                return null;
            }

            getValidMoves(piece, testBoard) {
                const moves = [];
                const b = testBoard;
                const addIfValid = (nx, ny) => {
                    if (nx < 0 || nx >= this.cols || ny < 0 || ny >= this.rows) return false;
                    const target = b[ny][nx];
                    if (target) {
                        if (target.color !== piece.color) moves.push({x: nx, y: ny});
                        return false;
                    }
                    moves.push({x: nx, y: ny});
                    return true;
                };

                const rayCast = (dirs) => {
                    dirs.forEach(d => {
                        let nx = piece.x + d.dx, ny = piece.y + d.dy;
                        while(addIfValid(nx, ny)) { nx += d.dx; ny += d.dy; }
                    });
                };

                const {x, y, type, color} = piece;
                const dir = color === 'cho' ? -1 : 1;

                switch(type) {
                    case 'z':
                        addIfValid(x, y + dir);
                        addIfValid(x - 1, y);
                        addIfValid(x + 1, y);
                        if (this.isPalace(x, y)) {
                            const c = this.getPalaceCenter(y);
                            if (x !== c.x && y !== c.y) {
                                if ((color==='cho' && y===9) || (color==='han' && y===0)) addIfValid(c.x, c.y);
                            } else if (x === c.x && y === c.y) {
                                addIfValid(x - 1, y + dir);
                                addIfValid(x + 1, y + dir);
                            }
                        }
                        break;
                    
                    case 'c':
                        rayCast([{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}]);
                        if (this.isPalace(x, y)) {
                            const ct = this.getPalaceCenter(y);
                            if (x === ct.x && y === ct.y) {
                                [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(d => {
                                    let nx = x+d[0], ny = y+d[1];
                                    while(this.isPalace(nx, ny) && addIfValid(nx, ny)) { nx+=d[0]; ny+=d[1]; }
                                });
                            } else if ((x===3||x===5) && (y===0||y===2||y===7||y===9)) {
                                let dx = ct.x - x, dy = ct.y - y;
                                let nx = x+dx, ny = y+dy;
                                while(this.isPalace(nx, ny) && addIfValid(nx, ny)) { nx+=dx; ny+=dy; }
                            }
                        }
                        break;

                    case 'p':
                        [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}].forEach(d => {
                            let nx = x + d.dx, ny = y + d.dy;
                            let jumped = false;
                            while(nx>=0 && nx<this.cols && ny>=0 && ny<this.rows) {
                                const target = b[ny][nx];
                                if (target) {
                                    if (target.type === 'p') break;
                                    if (!jumped) {
                                        jumped = true;
                                    } else {
                                        if (target.color !== color) moves.push({x: nx, y: ny});
                                        break;
                                    }
                                } else {
                                    if (jumped) moves.push({x: nx, y: ny});
                                }
                                nx += d.dx; ny += d.dy;
                            }
                        });
                        break;

                    case 'm':
                        [{dx:1,dy:0, jx:1,jy:-1, jx2:1,jy2:1}, {dx:-1,dy:0, jx:-1,jy:-1, jx2:-1,jy2:1},
                         {dx:0,dy:1, jx:-1,jy:1, jx2:1,jy2:1}, {dx:0,dy:-1, jx:-1,jy:-1, jx2:1,jy2:-1}].forEach(d => {
                            if (x+d.dx>=0 && x+d.dx<this.cols && y+d.dy>=0 && y+d.dy<this.rows && !b[y+d.dy][x+d.dx]) {
                                addIfValid(x+d.jx, y+d.jy);
                                addIfValid(x+d.jx2, y+d.jy2);
                            }
                        });
                        break;

                    case 's':
                        [{dx:1,dy:0, h1x:1,h1y:1, ex:2,ey:2, h2x:1,h2y:-1, e2x:2,e2y:-2},
                         {dx:-1,dy:0, h1x:-1,h1y:1, ex:-2,ey:2, h2x:-1,h2y:-1, e2x:-2,e2y:-2},
                         {dx:0,dy:1, h1x:1,h1y:1, ex:2,ey:2, h2x:-1,h2y:1, e2x:-2,e2y:2},
                         {dx:0,dy:-1, h1x:1,h1y:-1, ex:2,ey:-2, h2x:-1,h2y:-1, e2x:-2,e2y:-2}].forEach(d => {
                            if (x+d.dx>=0 && x+d.dx<this.cols && y+d.dy>=0 && y+d.dy<this.rows && !b[y+d.dy][x+d.dx]) {
                                if (x+d.h1x>=0 && x+d.h1x<this.cols && y+d.h1y>=0 && y+d.h1y<this.rows && !b[y+d.h1y][x+d.h1x]) {
                                    addIfValid(x+d.ex, y+d.ey);
                                }
                                if (x+d.h2x>=0 && x+d.h2x<this.cols && y+d.h2y>=0 && y+d.h2y<this.rows && !b[y+d.h2y][x+d.h2x]) {
                                    addIfValid(x+d.e2x, y+d.e2y);
                                }
                            }
                        });
                        break;

                    case 'g':
                    case 'k':
                        [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}].forEach(d => {
                            if(this.isPalace(x+d.dx, y+d.dy)) addIfValid(x+d.dx, y+d.dy);
                        });
                        const ct = this.getPalaceCenter(y);
                        if (x === ct.x && y === ct.y) {
                            [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(d => {
                                if(this.isPalace(x+d[0], y+d[1])) addIfValid(x+d[0], y+d[1]);
                            });
                        } else if ((x===3||x===5) && (y===0||y===2||y===7||y===9)) {
                            addIfValid(ct.x, ct.y);
                        }
                        break;
                }
                return moves;
            }

            executeMove(tx, ty) {
                const piece = this.selectedPiece;
                const targetPiece = this.board[ty][tx];
                let isWin = false;

                this.clearHighlights();

                if (targetPiece) {
                    AudioEngine.capture();
                    targetPiece.el.classList.add('captured');
                    setTimeout(() => targetPiece.el.remove(), 300);
                    
                    if(targetPiece.type === 'k') {
                        isWin = true;
                        this.isGameOver = true;
                    }
                } else {
                    AudioEngine.place();
                }

                // Update array
                this.board[piece.y][piece.x] = null;
                piece.x = tx; piece.y = ty;
                this.board[ty][tx] = piece;

                // Move DOM
                piece.el.classList.add('moving');
                this.updatePiecePosition(piece);
                setTimeout(() => piece.el.classList.remove('moving'), 300);

                this.selectedPiece = null;

                // 왕을 잡은 경우 턴 교체 없이 승리 처리
                if (isWin) {
                    const winnerName = piece.color === 'cho' ? '초(楚)' : '한(漢)';
                    setTimeout(() => {
                        AudioEngine.win();
                        setTurnText(`🎉 ${winnerName} 승리! (게임 종료)`, '#fbbf24');
                    }, 300);
                    return;
                }

                this.turn = this.turn === 'cho' ? 'han' : 'cho';
                this.updateTurnUI();

                if (gameConfig.mode === 'cpu' && this.turn === 'han' && !this.isGameOver) {
                    setTurnText('CPU 생각 중...', '#fbbf24');
                    setTimeout(() => this.makeAIMove(), 800);
                }
            }

            makeAIMove() {
                if(this.isGameOver) return; // 만약의 경우 방지
                
                let moves = this.getVirtualMoves(this.board, 'han');
                if(moves.length === 0) return;
                
                moves.sort(() => Math.random() - 0.5);
                let bestMove = moves[0];
                
                if (gameConfig.difficulty !== 'easy') {
                    let bestScore = -Infinity;
                    let depth = gameConfig.difficulty === 'hard' ? 2 : 1;
                    
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(this.board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        
                        let score = this.minimaxJanggi(simBoard, depth - 1, false, -Infinity, Infinity);
                        if(score > bestScore) {
                            bestScore = score;
                            bestMove = m;
                        }
                    }
                }
                
                this.selectedPiece = this.board[bestMove.fy][bestMove.fx];
                this.executeMove(bestMove.tx, bestMove.ty);
            }

            getVirtualMoves(board, color) {
                let moves = [];
                for(let y=0; y<this.rows; y++){
                    for(let x=0; x<this.cols; x++){
                        let p = board[y][x];
                        if(p && p.color === color) {
                            let pieceMoves = this.getValidMoves(p, board);
                            pieceMoves.forEach(m => moves.push({fx:x, fy:y, tx:m.x, ty:m.y}));
                        }
                    }
                }
                return moves;
            }

            cloneBoard(board) {
                return board.map(row => row.map(p => p ? {x: p.x, y: p.y, type: p.type, color: p.color} : null));
            }

            minimaxJanggi(board, depth, isMax, alpha, beta) {
                if(depth === 0) return this.evaluateJanggi(board);
                let color = isMax ? 'han' : 'cho';
                let moves = this.getVirtualMoves(board, color);

                if(moves.length === 0) return isMax ? -9999 : 9999;

                if(isMax) {
                    let maxEval = -Infinity;
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        let ev = this.minimaxJanggi(simBoard, depth-1, false, alpha, beta);
                        maxEval = Math.max(maxEval, ev);
                        alpha = Math.max(alpha, ev);
                        if(beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for(let m of moves) {
                        let simBoard = this.cloneBoard(board);
                        simBoard[m.ty][m.tx] = simBoard[m.fy][m.fx];
                        simBoard[m.fy][m.fx] = null;
                        simBoard[m.ty][m.tx].x = m.tx; simBoard[m.ty][m.tx].y = m.ty;
                        let ev = this.minimaxJanggi(simBoard, depth-1, true, alpha, beta);
                        minEval = Math.min(minEval, ev);
                        beta = Math.min(beta, ev);
                        if(beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            evaluateJanggi(board) {
                let score = 0;
                const vals = {z:2, s:3, m:5, p:7, c:13, g:3, k:100};
                for(let y=0; y<this.rows; y++){
                    for(let x=0; x<this.cols; x++){
                        let p = board[y][x];
                        if(p) {
                            let val = vals[p.type];
                            score += p.color === 'han' ? val : -val;
                        }
                    }
                }
                return score;
            }

            destroy() {
                els.piecesLayer.removeEventListener('mousedown', this.clickHandler);
            }
        }
    </script>
