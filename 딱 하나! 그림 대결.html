<!doctype html>

<title>딱 하나! 그림 대결</title>
<style>
:root{--ink:#243247;--cream:#fff9e9;--yellow:#ffd95f;--orange:#ff9e5c;--pink:#ff829d;--blue:#62b7e8;--green:#69ca91;--red:#ef5d62;--shadow:0 10px 0 #27364a22,0 18px 35px #27364a20}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,'Noto Sans KR','맑은 고딕',sans-serif;color:var(--ink);background:#89d5ec;overflow-x:hidden}body{touch-action:manipulation}.game{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(#86d7ef 0 37%,#bce985 37% 43%,#f7d79b 43% 100%)}.sky{position:absolute;inset:0 0 auto;height:43%;pointer-events:none;background:radial-gradient(circle at 14% 22%,#fff 0 18px,transparent 20px),radial-gradient(circle at 18% 23%,#fff 0 25px,transparent 27px),radial-gradient(circle at 78% 15%,#fff 0 20px,transparent 22px),radial-gradient(circle at 82% 16%,#fff 0 28px,transparent 30px)}.hill{position:absolute;left:-5%;right:-5%;top:31%;height:18%;background:#68bd68;clip-path:polygon(0 70%,15% 28%,31% 60%,49% 18%,66% 58%,82% 24%,100% 62%,100% 100%,0 100%);opacity:.9}.topbar{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}.scorebox{background:#fff9e9;border:4px solid #fff;border-bottom-color:#e8ddc3;border-radius:22px;padding:8px 13px;box-shadow:0 5px 0 #2a415022;min-width:0}.scorebox.cpu{text-align:right}.who{font-size:12px;font-weight:1000;letter-spacing:.04em}.stars{font-size:clamp(19px,4vw,28px);white-space:nowrap}.titlechip{background:#26394e;color:white;border:4px solid white;border-radius:22px;padding:8px 13px;font-weight:1000;text-align:center;box-shadow:0 5px 0 #1c283733}.titlechip small{display:block;font-size:10px;color:#ffe278;margin-top:2px}.arena{position:relative;z-index:4;flex:1;display:flex;align-items:center;justify-content:center;padding:4px 12px 16px}.table{width:min(980px,100%);background:#f3b96f;border:8px solid #ad6b3b;border-radius:36px;box-shadow:inset 0 0 0 5px #ffd49a,var(--shadow);padding:13px 14px 18px;position:relative}.table:before{content:'';position:absolute;inset:12px;border:2px dashed #a66a3c55;border-radius:24px;pointer-events:none}.roundrow{display:flex;align-items:center;justify-content:center;gap:9px;position:relative;z-index:2;margin-bottom:7px}.roundpill,.message{border:3px solid #26394e;border-radius:14px;background:#fff8d7;box-shadow:0 4px 0 #26394e;padding:6px 10px;font-weight:1000}.roundpill{font-size:12px}.message{font-size:clamp(13px,2.3vw,17px);min-width:min(420px,65%);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.battle{position:relative;z-index:2;display:grid;grid-template-columns:1fr 104px 1fr;align-items:center;gap:12px}.side{display:flex;flex-direction:column;align-items:center;min-width:0}.label{font-weight:1000;background:#fff;border:3px solid #26394e;border-radius:999px;padding:5px 12px;box-shadow:0 4px 0 #26394e;margin-bottom:7px}.label.you{background:#fff0a8}.label.bot{background:#d9efff}.card{width:min(37vw,350px);aspect-ratio:1;border-radius:50%;background:#fffdf5;border:9px solid #f7f0d7;box-shadow:0 0 0 5px #29394c,0 12px 0 #29394c44,0 22px 40px #5b351c28;position:relative;transition:transform .15s}.card.cpu-card{background:#f9fcff}.symbol{position:absolute;width:27%;height:27%;display:grid;place-items:center;border:0;background:transparent;font-size:clamp(32px,6vw,62px);line-height:1;filter:drop-shadow(0 3px 0 #0002);cursor:pointer;transform-origin:center;transition:filter .12s,scale .12s}.symbol:hover{filter:drop-shadow(0 4px 0 #0002) brightness(1.08)}.symbol:active{scale:.88}.symbol.cpu-symbol{cursor:pointer}.symbol.correct{animation:correct .65s ease both;z-index:10}.symbol.wrong{animation:wrong .38s ease}.card.hit{animation:cardHit .42s ease}.vs{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px}.robot{font-size:54px;filter:drop-shadow(0 5px 0 #0002);animation:think 1s steps(2,end) infinite}.timer{width:86px;height:86px;border-radius:50%;background:#26394e;border:6px solid white;box-shadow:0 5px 0 #26394e55;display:grid;place-items:center;position:relative;overflow:hidden}.timer:before{content:'';position:absolute;inset:0;background:conic-gradient(var(--red) calc(var(--p,1)*1turn),#ffffff22 0);opacity:.95}.timer:after{content:'';position:absolute;inset:9px;border-radius:50%;background:#26394e}.timer b{position:relative;z-index:2;color:white;font-size:27px}.timer small{position:absolute;z-index:2;color:#ffd95f;font-weight:900;font-size:9px;bottom:14px}.cpu-think{font-size:11px;font-weight:1000;color:#6e4b31;text-align:center;min-height:28px}.statusline{position:relative;z-index:2;margin-top:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.progress{height:17px;background:#fff4cf;border:3px solid #26394e;border-radius:99px;overflow:hidden;box-shadow:0 3px 0 #26394e}.progress i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#6bd398,#ffd65d,#ff755f);transform-origin:left;transform:scaleX(var(--p,1));transition:transform .07s linear}.sound{border:3px solid #26394e;border-radius:14px;background:#fff;padding:6px 10px;font-weight:1000;box-shadow:0 4px 0 #26394e;cursor:pointer}.sound:active{transform:translateY(3px);box-shadow:0 1px 0 #26394e}.overlay{position:fixed;inset:0;z-index:50;background:linear-gradient(#75cce8,#b4e986 48%,#f4c47b 48%);display:grid;place-items:center;padding:18px}.overlay.hidden{display:none}.startpanel{width:min(720px,100%);background:#fff9e9;border:6px solid #26394e;border-radius:34px;padding:22px;box-shadow:0 12px 0 #26394e55,0 28px 60px #26394e35;text-align:center;position:relative;overflow:hidden}.startpanel:before,.startpanel:after{content:'★';position:absolute;font-size:80px;color:#ffe176;opacity:.4;transform:rotate(-12deg)}.startpanel:before{left:-20px;top:-15px}.startpanel:after{right:-18px;bottom:-28px}.startpanel h1{font-size:clamp(34px,7vw,58px);margin:0;color:#ef5d62;text-shadow:0 4px 0 #fff,0 7px 0 #26394e}.startpanel .lead{font-weight:900;line-height:1.55;margin:12px auto 14px;max-width:580px}.demo{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0 15px}.mini{width:96px;height:96px;border-radius:50%;background:white;border:5px solid #26394e;display:grid;grid-template-columns:repeat(2,1fr);place-items:center;font-size:25px;transform:rotate(-7deg)}.mini:nth-child(3){transform:rotate(8deg)}.same{font-size:26px;font-weight:1000;color:#ef5d62}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mode{border:4px solid #26394e;border-radius:20px;background:white;padding:13px 9px;box-shadow:0 6px 0 #26394e;cursor:pointer;color:var(--ink);font-weight:900}.mode:nth-child(1){background:#e8ffd8}.mode:nth-child(2){background:#fff0a8}.mode:nth-child(3){background:#ffd7dc}.mode:active{transform:translateY(5px);box-shadow:0 1px 0 #26394e}.mode b{display:block;font-size:20px}.mode strong{font-size:33px;display:block;margin:4px}.mode small{font-size:12px;line-height:1.4;display:block}.rules{margin:17px 0 0;background:#eef6ff;border:3px solid #26394e;border-radius:18px;padding:10px;font-size:13px;font-weight:800;line-height:1.55}.resultpanel .trophy{font-size:86px;display:block;animation:bob .8s ease-in-out infinite alternate}.resultpanel .final{font-size:28px;font-weight:1000;margin:8px}.resultpanel .final span{display:inline-block;min-width:65px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}.bigbtn{border:4px solid #26394e;border-radius:17px;background:#ffd95f;padding:11px 18px;font-weight:1000;box-shadow:0 5px 0 #26394e;cursor:pointer}.bigbtn.secondary{background:white}.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #26394e}.flash{position:fixed;inset:0;z-index:30;pointer-events:none;display:grid;place-items:center;font-size:clamp(44px,12vw,105px);font-weight:1000;color:white;text-shadow:0 5px 0 #26394e;opacity:0}.flash.show{animation:flash .75s ease both}.confetti{position:fixed;pointer-events:none;z-index:80;font-size:25px;animation:confetti .9s ease-out forwards}@keyframes correct{0%{transform:var(--base) scale(1)}35%{transform:var(--base) scale(1.48) rotate(0deg);filter:drop-shadow(0 0 12px #ffe54f)}100%{transform:var(--base) scale(1)}}@keyframes wrong{25%{translate:-7px 0}50%{translate:7px 0}75%{translate:-4px 0}}@keyframes cardHit{45%{transform:scale(1.045)}}@keyframes think{50%{transform:translateY(-5px) rotate(3deg)}}@keyframes bob{to{transform:translateY(-8px) rotate(4deg)}}@keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.08)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes confetti{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:720px){.topbar{grid-template-columns:1fr 88px 1fr}.titlechip{font-size:12px;padding:6px}.scorebox{padding:6px 8px;border-width:3px}.who{font-size:10px}.battle{grid-template-columns:1fr 72px 1fr;gap:5px}.table{padding:10px 6px 15px;border-width:6px}.card{width:min(39vw,310px);border-width:6px}.symbol{font-size:clamp(27px,8vw,50px)}.robot{font-size:37px}.timer{width:66px;height:66px;border-width:4px}.timer:after{inset:7px}.timer b{font-size:21px}.timer small{display:none}.cpu-think{font-size:9px}.message{min-width:0;flex:1}.modes{grid-template-columns:1fr}.mode{display:grid;grid-template-columns:1fr 70px 1.3fr;align-items:center;text-align:left;padding:8px 12px}.mode b{font-size:18px}.mode strong{text-align:center}.mode small{font-size:11px}.startpanel{padding:18px 13px}.demo{display:none}}@media(max-width:430px){.arena{padding:0 5px 8px}.roundrow{gap:4px}.roundpill{font-size:10px;padding:5px}.message{font-size:11px;padding:5px}.table{border-radius:25px}.battle{grid-template-columns:1fr 58px 1fr}.label{font-size:10px;padding:4px 8px}.card{width:40vw;border-width:5px;box-shadow:0 0 0 3px #29394c,0 8px 0 #29394c44}.symbol{font-size:clamp(23px,8.5vw,42px)}.robot{font-size:30px}.timer{width:54px;height:54px}.timer b{font-size:18px}.cpu-think{display:none}.statusline{margin-top:9px}.progress{height:14px}.sound{font-size:11px;padding:5px 7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="game">
  <div class="sky"></div><div class="hill"></div>
  <header class="topbar">
    <div class="scorebox"><div class="who">🧒 나</div><div class="stars" id="myStars">☆☆☆☆☆</div></div>
    <div class="titlechip">딱 하나!<small id="difficultyLabel">그림 대결</small></div>
    <div class="scorebox cpu"><div class="who">CPU 🤖</div><div class="stars" id="cpuStars">☆☆☆☆☆</div></div>
  </header>
  <main class="arena">
    <section class="table" id="table">
      <div class="roundrow"><div class="roundpill" id="roundText">1번째 대결</div><div class="message" id="message">두 카드에 똑같이 있는 그림을 찾아요!</div></div>
      <div class="battle">
        <div class="side"><div class="label you">내 카드</div><div class="card" id="leftCard"></div></div>
        <div class="vs"><div class="robot">🤖</div><div class="timer" id="timer"><b id="seconds">10</b><small>CPU까지</small></div><div class="cpu-think" id="cpuThink">찾는 중...</div></div>
        <div class="side"><div class="label bot">CPU 카드</div><div class="card cpu-card" id="rightCard"></div></div>
      </div>
      <div class="statusline"><div class="progress"><i id="progress"></i></div><button class="sound" id="soundBtn">🔊 소리</button></div>
    </section>
  </main>
</div>
<div class="overlay" id="startOverlay">
  <div class="startpanel">
    <h1>딱 하나! 그림 대결</h1>
    <p class="lead">두 카드에는 <b>똑같은 그림이 딱 하나</b> 있어요. CPU보다 먼저 찾아서 눌러 보세요! 먼저 별 5개를 모으면 승리!</p>
    <div class="demo"><div class="mini"><span>🐸</span><span>🍎</span><span>🚗</span><span>⭐</span></div><div class="same">↔<br><small>딱 하나!</small></div><div class="mini"><span>🎈</span><span>🌞</span><span>🐸</span><span>🍦</span></div></div>
    <div class="modes">
      <button class="mode" data-mode="easy"><b>🌱 쉬움</b><strong>10초</strong><small>천천히 찾아봐요<br>처음 하는 친구 추천</small></button>
      <button class="mode" data-mode="normal"><b>🌟 보통</b><strong>5초</strong><small>조금 빠르게!<br>익숙해졌다면 도전</small></button>
      <button class="mode" data-mode="hard"><b>🔥 어려움</b><strong>3초</strong><small>눈보다 빠른 CPU<br>집중해서 찾아요</small></button>
    </div>
    <div class="rules">그림의 <b>크기나 방향이 달라도 같은 그림</b>이에요. 틀린 그림을 눌러도 탈락하지 않지만 CPU의 시간은 계속 흐릅니다.</div>
  </div>
</div>
<div class="overlay hidden" id="resultOverlay">
  <div class="startpanel resultpanel">
    <span class="trophy" id="trophy">🏆</span>
    <h1 id="resultTitle">내가 이겼어요!</h1>
    <div class="final"><span id="finalMe">5</span> : <span id="finalCpu">2</span></div>
    <p class="lead" id="resultText">똑같은 그림을 정말 빨리 찾았어요!</p>
    <div class="actions"><button class="bigbtn secondary" id="changeMode">난이도 바꾸기</button><button class="bigbtn" id="replay">한 판 더!</button></div>
  </div>
</div>
<div class="flash" id="flash">내가 먼저!</div>
<script>
(()=>{'use strict';
const ICONS=[['🐶','강아지'],['🐱','고양이'],['🐰','토끼'],['🐸','개구리'],['🐥','병아리'],['🐠','물고기'],['🦋','나비'],['🐞','무당벌레'],['🌞','해'],['⭐','별'],['🌈','무지개'],['☁️','구름'],['❤️','하트'],['🍎','사과'],['🍓','딸기'],['🍌','바나나'],['🥕','당근'],['🍉','수박'],['🍦','아이스크림'],['🧁','컵케이크'],['⚽','축구공'],['🎈','풍선'],['🚗','자동차'],['🚀','로켓'],['🏠','집'],['🌳','나무'],['🌻','해바라기'],['☂️','우산'],['👑','왕관'],['🔑','열쇠'],['🎁','선물']];
const CFG={easy:{seconds:10,label:'쉬움 · 10초'},normal:{seconds:5,label:'보통 · 5초'},hard:{seconds:3,label:'어려움 · 3초'}};
const $=s=>document.querySelector(s);let audioCtx=null,raf=0,mode='easy',limit=10,deadline=0,locked=true,myScore=0,cpuScore=0,round=0,current=null,lastPairs=[],soundOn=true,streak=0;
function buildDeck(){const q=5,cards=[];const affine=(x,y)=>x*q+y;const inf=m=>q*q+m,vertical=q*q+q;for(let m=0;m<q;m++)for(let b=0;b<q;b++){const c=[inf(m)];for(let x=0;x<q;x++)c.push(affine(x,(m*x+b)%q));cards.push(c)}for(let x=0;x<q;x++){const c=[vertical];for(let y=0;y<q;y++)c.push(affine(x,y));cards.push(c)}cards.push(Array.from({length:q+1},(_,i)=>q*q+i));return cards}
const DECK=buildDeck();
function validateDeck(){if(DECK.length!==31)throw new Error('deck size');for(const c of DECK)if(c.length!==6||new Set(c).size!==6)throw new Error('card size');for(let i=0;i<DECK.length;i++)for(let j=i+1;j<DECK.length;j++){let n=DECK[i].filter(x=>DECK[j].includes(x)).length;if(n!==1)throw new Error('deck pair '+i+' '+j+' = '+n)}}validateDeck();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function snd(type){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=type==='good'?[523,784,1046]:type==='cpu'?[220,185,147]:type==='wrong'?[150]:[420];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='cpu'?'square':'sine';o.frequency.setValueAtTime(f,now+i*.07);o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(type==='wrong'?.025:.05,now+i*.07+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.12);o.start(now+i*.07);o.stop(now+i*.07+.14)})}catch(e){}}
function speak(id){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ICONS[id][1]);u.lang='ko-KR';u.rate=1.05;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function choosePair(){let a,b,key,match,tries=0;do{a=Math.floor(Math.random()*DECK.length);do b=Math.floor(Math.random()*DECK.length);while(b===a);key=a<b?a+'-'+b:b+'-'+a;match=DECK[a].find(x=>DECK[b].includes(x));tries++}while((lastPairs.includes(key)||lastPairs.slice(-4).some(k=>k.endsWith('|'+match)))&&tries<80);lastPairs.push(key+'|'+match);if(lastPairs.length>12)lastPairs.shift();return{a,b,left:shuffle(DECK[a]),right:shuffle(DECK[b]),match}}
const POS=[[50,15],[23,33],[76,34],[28,70],[71,70],[50,50]];
function renderCard(el,ids,side){el.innerHTML='';const pos=shuffle(POS);ids.forEach((id,i)=>{const b=document.createElement('button');b.className='symbol '+(side==='right'?'cpu-symbol':'');b.type='button';b.dataset.id=id;b.setAttribute('aria-label',ICONS[id][1]);const scale=(.78+Math.random()*.38).toFixed(2),rot=Math.round(Math.random()*70-35);b.style.left=pos[i][0]+'%';b.style.top=pos[i][1]+'%';b.style.translate='-50% -50%';b.style.setProperty('--base',`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`);b.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;b.textContent=ICONS[id][0];el.appendChild(b)})}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}function updateScore(){$('#myStars').textContent=stars(myScore);$('#cpuStars').textContent=stars(cpuScore)}
function start(m){mode=m;limit=CFG[mode].seconds;myScore=0;cpuScore=0;round=0;streak=0;lastPairs=[];updateScore();$('#difficultyLabel').textContent=CFG[mode].label;$('#startOverlay').classList.add('hidden');$('#resultOverlay').classList.add('hidden');nextRound()}
function nextRound(){cancelAnimationFrame(raf);locked=false;round++;current=choosePair();$('#roundText').textContent=round+'번째 대결';$('#message').textContent='두 카드에 똑같이 있는 그림을 찾아요!';$('#cpuThink').textContent='찾는 중...';renderCard($('#leftCard'),current.left,'left');renderCard($('#rightCard'),current.right,'right');deadline=performance.now()+limit*1000;updateTimer();raf=requestAnimationFrame(timerLoop)}
function updateTimer(){let remain=Math.max(0,(deadline-performance.now())/1000),p=remain/limit;$('#seconds').textContent=remain>0?Math.ceil(remain):0;$('#timer').style.setProperty('--p',p);$('#progress').style.setProperty('--p',p);if(p<.34)$('#cpuThink').textContent='🤖 거의 찾았어!';else if(p<.67)$('#cpuThink').textContent='🤖 두리번두리번...';else $('#cpuThink').textContent='🤖 찾는 중...'}
function timerLoop(){if(locked)return;updateTimer();if(performance.now()>=deadline){cpuWins();return}raf=requestAnimationFrame(timerLoop)}
function highlightMatch(){document.querySelectorAll(`.symbol[data-id="${current.match}"]`).forEach(x=>x.classList.add('correct'))}
function flash(text){const f=$('#flash');f.textContent=text;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function confetti(symbol='⭐'){for(let i=0;i<14;i++){const e=document.createElement('div');e.className='confetti';e.textContent=i%3?symbol:'✨';e.style.left=(45+Math.random()*10)+'vw';e.style.top=(42+Math.random()*10)+'vh';e.style.setProperty('--x',(Math.random()*320-160)+'px');e.style.setProperty('--y',(-70-Math.random()*210)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),950)}}
function playerWins(){if(locked)return;locked=true;cancelAnimationFrame(raf);myScore++;streak++;try{localStorage.setItem('symbolDuelBestStreak',Math.max(+(localStorage.getItem('symbolDuelBestStreak')||0),streak))}catch{}updateScore();highlightMatch();$('#message').textContent='정답! '+ICONS[current.match][1]+'!';$('#cpuThink').textContent='🤖 앗, 늦었다!';snd('good');speak(current.match);flash('내가 먼저!');confetti('⭐');setTimeout(()=>myScore>=5?finish(true):nextRound(),950)}
function cpuWins(){if(locked)return;locked=true;cancelAnimationFrame(raf);cpuScore++;streak=0;updateScore();highlightMatch();$('#message').textContent='CPU가 찾았어요! 정답은 '+ICONS[current.match][1];$('#cpuThink').textContent='🤖 찾았다!';snd('cpu');speak(current.match);flash('CPU가 먼저!');setTimeout(()=>cpuScore>=5?finish(false):nextRound(),1150)}
function wrong(btn){snd('wrong');btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');$('#message').textContent='앗, 다른 그림이에요. 다시 찾아봐요!'}
function finish(win){locked=true;cancelAnimationFrame(raf);$('#finalMe').textContent=myScore;$('#finalCpu').textContent=cpuScore;$('#trophy').textContent=win?'🏆':'🤖';$('#resultTitle').textContent=win?'내가 이겼어요!':'CPU가 이겼어요!';$('#resultText').textContent=win?'똑같은 그림을 정말 빨리 찾았어요!':'괜찮아요! 한 번 더 하면 눈이 더 빨라질 거예요.';if(win){snd('good');confetti('🎉')}try{const k='symbolDuelWins_'+mode;localStorage.setItem(k,+(localStorage.getItem(k)||0)+(win?1:0))}catch{}$('#resultOverlay').classList.remove('hidden')}
function tap(e){if(locked)return;const b=e.target.closest('.symbol');if(!b)return;const id=+b.dataset.id;if(id===current.match)playerWins();else wrong(b)}
$('#leftCard').addEventListener('click',tap);$('#rightCard').addEventListener('click',tap);document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));$('#replay').onclick=()=>start(mode);$('#changeMode').onclick=()=>{$('#resultOverlay').classList.add('hidden');$('#startOverlay').classList.remove('hidden')};$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊 소리':'🔇 소리';if(soundOn)snd('tap')};
})();
</script>
</body>
</html>
