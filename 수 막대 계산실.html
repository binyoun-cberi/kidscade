<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>10개가 모이면! 수 막대 계산실</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#22263a;--muted:#6f758a;--line:#e1e5ef;
  --hundred:#8c6bd8;--ten:#4f80e1;--one:#f2b93c;--good:#2f9d73;--warn:#e4774f;
  --shadow:0 12px 34px rgba(31,38,72,.10);--radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid rgba(79,128,225,.22);outline-offset:2px}
.app{max-width:1380px;margin:auto;padding:16px 16px 44px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,var(--hundred),var(--ten));display:grid;place-items:center;color:#fff;font-weight:1000;box-shadow:var(--shadow)}
h1{font-size:clamp(21px,3vw,31px);margin:0}.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.top-actions label{font-size:12px;font-weight:900;color:var(--muted);display:grid;gap:4px}
select,input[type=number]{border:2px solid var(--line);border-radius:13px;background:#fff;min-height:44px;padding:8px 11px;font-weight:900;color:var(--ink)}
.btn,.icon-btn,.place-btn,.source-btn{border:0;border-radius:14px;min-height:46px;padding:10px 14px;font-weight:900}.icon-btn,.btn.secondary{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(30,35,70,.08)}.btn.primary{background:var(--ink);color:#fff}.btn.danger{background:#fff0eb;color:#9b4228}.btn:disabled,.place-btn:disabled,.source-btn:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px;padding:7px;background:#e8ebf3;border-radius:18px}.tab{border:0;border-radius:13px;background:transparent;color:#5d6275;font-weight:1000;padding:12px 7px;min-height:48px}.tab.active{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(30,35,70,.08)}
.view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid rgba(225,229,239,.92);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{padding:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.number-input{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.number-input label{font-size:13px;font-weight:900;color:var(--muted);display:grid;gap:5px}.number-input input{width:110px}.readout{margin-left:auto;background:#f4f6fb;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:9px;min-height:48px}.readout strong{font-size:25px}.readout span:last-child{color:var(--muted);font-weight:800}
.storage{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line);background:#fbfcff;border-radius:22px 22px 0 0}.storage-title{font-weight:1000;align-self:center;margin-right:2px}.source-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:#fff;min-width:150px}.source-card.hidden{display:none}.source-info strong{display:block}.source-info small{color:var(--muted);font-weight:800}.source-actions{margin-left:auto;display:flex;gap:5px}.source-btn{min-height:38px;padding:7px 10px;background:#eef2fb;color:#30364d}
.workspace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}.workspace.two-place{grid-template-columns:repeat(2,minmax(0,1fr))}
.place{position:relative;min-height:425px;border:3px solid transparent;border-radius:22px;padding:14px;display:flex;flex-direction:column;overflow:hidden;transition:.15s}.place.hundreds{background:#f5f0ff;border-color:#ddd0f9}.place.tens{background:#eef4ff;border-color:#cdddfd}.place.ones{background:#fff8e8;border-color:#f6dda5}.place.drop-valid{border-color:var(--good);box-shadow:0 0 0 7px rgba(47,157,115,.10)}.place.drop-invalid{border-color:var(--warn)}
.place-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.place-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:1000}.badge{min-width:43px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:14px}.hundreds .badge{background:var(--hundred)}.tens .badge{background:var(--ten)}.ones .badge{background:var(--one);color:#493608}.count-bubble{background:#fff;border-radius:999px;padding:6px 10px;font-weight:1000;box-shadow:0 2px 8px rgba(40,45,80,.08)}
.carry-label{display:none;margin:-2px 0 8px;padding:7px 9px;border-radius:11px;background:#e7f7f0;color:#1b7152;font-weight:1000;text-align:center}.carry-label.show{display:block;animation:pop .3s ease}
.block-zone{position:relative;flex:1;min-height:250px;display:flex;align-content:flex-start;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:7px;padding:12px;border-radius:16px;border:2px dashed rgba(70,75,105,.17);background:rgba(255,255,255,.52);overflow:auto}.empty-text{align-self:center;color:#9297aa;font-weight:900;text-align:center;line-height:1.5}
.math-block{border:0;padding:0;appearance:none;-webkit-appearance:none;position:relative;flex:0 0 auto;filter:drop-shadow(0 4px 4px rgba(30,35,70,.12));transition:transform .15s,filter .15s;touch-action:none;user-select:none;-webkit-user-select:none}.math-block:hover,.math-block.selected{transform:translateY(-2px);filter:drop-shadow(0 8px 7px rgba(30,35,70,.17))}.math-block.selected::after{content:"";position:absolute;inset:-5px;border:3px solid var(--good);border-radius:12px;pointer-events:none}.math-block.one{width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,#ffdc69,var(--one));border:2px solid #d29a1f}.math-block.ten{width:34px;height:126px;border-radius:9px;background:repeating-linear-gradient(to bottom,#78a4f2 0,#78a4f2 10px,#3f70cc 10px,#3f70cc 12px);border:2px solid #3261b8}.math-block.hundred{width:126px;height:126px;border-radius:12px;background-color:#aa8be9;background-image:linear-gradient(rgba(83,53,145,.38) 2px,transparent 2px),linear-gradient(90deg,rgba(83,53,145,.38) 2px,transparent 2px);background-size:12.2px 12.2px;border:3px solid #7553c1}.math-block.mini.one{width:29px;height:29px}.math-block.mini.ten{height:88px;width:26px}.math-block.mini.hundred{width:82px;height:82px;background-size:8px 8px}
.bundle-card{width:100%;border:3px solid var(--good);background:#eaf8f2;border-radius:15px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#176849;font-weight:1000;touch-action:none;cursor:grab;animation:softPulse 1.4s infinite}.bundle-card span{display:block}.bundle-card small{display:block;color:#3b7f67;margin-top:3px}.bundle-card button{border:0;border-radius:11px;background:var(--good);color:#fff;padding:8px 10px;font-weight:1000}
.place-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.place-btn{background:#fff;border:2px solid rgba(70,75,105,.11);color:var(--ink);padding:9px 8px}.place-btn.main{background:var(--ink);color:#fff}
.trash-zone{margin:0 14px 14px;border:3px dashed #efb6a4;background:#fff1ec;color:#9b472d;border-radius:17px;min-height:72px;display:grid;place-items:center;text-align:center;font-weight:1000;padding:10px;transition:.15s}.trash-zone.drop-valid{background:#ffe2d8;border-color:var(--warn);transform:scale(1.01)}
.hint-line{padding:0 16px 15px;color:var(--muted);font-weight:800;line-height:1.5}.hint-line strong{color:var(--ink)}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.game-main{overflow:hidden}.problem-card{padding:16px 18px 12px;border-bottom:1px solid var(--line)}.problem-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.mode-label,.progress{font-size:13px;font-weight:1000;color:var(--muted)}.problem{font-size:clamp(34px,6vw,59px);font-weight:1000;letter-spacing:-2px;margin:5px 0}.progress-track{height:10px;background:#eceef4;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--ten),var(--hundred));width:0;transition:.3s}.instruction{margin-top:11px;padding:12px 14px;border-radius:14px;background:#f4f6fb;font-weight:1000;line-height:1.45}.instruction.good{background:#eaf8f2;color:#176849}.instruction.warn{background:#fff1ec;color:#9b472d}
.source-tray{padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcff}.source-tray-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:1000;margin-bottom:8px}.source-groups{display:flex;gap:8px;flex-wrap:wrap}.source-group{display:flex;align-items:center;gap:7px;border:2px solid var(--line);border-radius:15px;padding:8px 10px;background:#fff}.source-group.done{opacity:.45}.source-group strong{min-width:38px}.source-stack{display:flex;gap:4px;align-items:center;max-width:160px;overflow:auto;padding:3px}.all-btn{border:0;border-radius:10px;padding:7px 9px;background:#eef2fb;font-weight:1000;color:#30364d}
.game-side{display:flex;flex-direction:column;gap:12px}.side-card{padding:16px}.side-card h3{margin:0 0 10px;font-size:17px}.equation-box{font-family:monospace;font-size:21px;line-height:1.25;background:#f6f8fc;border-radius:14px;padding:12px;white-space:pre;text-align:right}.score-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:1000}.stars{font-size:24px;letter-spacing:2px}.side-actions{display:grid;gap:8px}
.modal{position:fixed;inset:0;background:rgba(22,26,45,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.modal.open{display:flex}.modal-card{width:min(520px,100%);background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 30px 80px rgba(20,24,45,.3)}.modal-card h2{margin:0 0 8px;font-size:30px}.modal-card p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#20243a;color:#fff;padding:12px 18px;border-radius:999px;font-weight:1000;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.drag-ghost{position:fixed;z-index:90;pointer-events:none;opacity:.86;transform:translate(-50%,-50%) scale(1.07);filter:drop-shadow(0 14px 16px rgba(30,35,70,.25))}.dragging-source{opacity:.32}.shake{animation:shake .35s}.pop{animation:pop .3s ease}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pop{0%{transform:scale(.45);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,157,115,.05)}50%{box-shadow:0 0 0 7px rgba(47,157,115,.10)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:980px){.game-layout{grid-template-columns:1fr}.game-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.game-side .side-card:last-child{grid-column:1/-1}}
@media(max-width:720px){.app{padding:10px 10px 34px}.topbar{align-items:flex-start}.top-actions{width:100%}.workspace,.workspace.two-place{grid-template-columns:1fr}.place{min-height:315px}.block-zone{min-height:165px;justify-content:flex-start}.math-block.ten{height:96px;width:28px}.math-block.hundred{width:94px;height:94px;background-size:9px 9px}.math-block.one{width:31px;height:31px}.readout{width:100%;margin-left:0;justify-content:center}.game-side{grid-template-columns:1fr}.source-card{min-width:140px;flex:1}.tabs{position:sticky;top:0;z-index:40}.bundle-card{position:sticky;bottom:0;z-index:3}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">10</div><div><h1>10개가 모이면! 수 막대 계산실</h1><p class="subtitle">끌어 놓고, 묶고, 풀며 배우는 덧셈과 뺄셈</p></div></div>
    <div class="top-actions">
      <label>학년 선택<select id="gradeSelect"><option value="1">1학년</option><option value="2" selected>2학년</option><option value="3">3학년</option></select></label>
      <button class="icon-btn" id="soundToggle" type="button">소리 켜짐</button>
      <button class="icon-btn" id="speakBtn" type="button">읽어 주기</button>
    </div>
  </header>
  <nav class="tabs" aria-label="학습 모드">
    <button class="tab active" data-view="free" type="button">자유 조작</button>
    <button class="tab" data-view="learn" type="button">단계 학습</button>
    <button class="tab" data-view="game" type="button">도전 게임</button>
  </nav>
  <main>
    <section class="view active" id="view-free">
      <div class="panel toolbar">
        <div class="number-input"><label>숫자 만들기<input id="makeNumber" type="number" min="0" max="99" value="47" inputmode="numeric"></label><button class="btn primary" id="makeBtn" type="button">모형으로 만들기</button></div>
        <button class="btn secondary" id="freeUndo" type="button">되돌리기</button><button class="btn danger" id="freeReset" type="button">모두 비우기</button>
        <div class="readout"><span>현재 수</span><strong id="freeNumber">47</strong><span id="freeExpanded">40 + 7</span></div>
      </div>
      <div class="panel">
        <div class="storage" id="freeStorage"></div>
        <div class="workspace" id="freeWorkspace"></div>
        <div class="trash-zone" id="freeTrash" data-trash="free">여기로 끌면 모형을 뺄 수 있어요</div>
        <div class="hint-line"><strong>조작법:</strong> 모형을 끌어 놓으세요. 십 막대나 백 모형을 <strong>두 번 누르면</strong> 바로 아랫자리 10개로 풀립니다. 한 번 누르기는 수를 바꾸지 않습니다.</div>
      </div>
    </section>

    <section class="view" id="view-learn">
      <div class="game-layout">
        <div class="panel game-main">
          <div class="problem-card"><div class="problem-top"><span class="mode-label">차근차근 학습</span><span class="progress" id="learnProgress">1 / 5</span></div><div class="problem" id="learnProblem"></div><div class="progress-track"><div class="progress-fill" id="learnProgressFill"></div></div><div class="instruction" id="learnInstruction"></div></div>
          <div class="source-tray" id="learnSourceTray"></div>
          <div class="workspace" id="learnWorkspace"></div>
          <div class="trash-zone" id="learnTrash" data-trash="learn">뺄 모형은 이곳으로 끌어 놓으세요</div>
        </div>
        <aside class="game-side">
          <div class="panel side-card"><h3>세로셈 연결</h3><div class="equation-box" id="learnEquation"></div></div>
          <div class="panel side-card"><h3>도움</h3><div class="side-actions"><button class="btn secondary" id="learnHint" type="button">힌트 보기</button><button class="btn secondary" id="learnUndo" type="button">한 단계 되돌리기</button><button class="btn primary" id="learnStart" type="button">새 학습 시작</button></div></div>
        </aside>
      </div>
    </section>

    <section class="view" id="view-game">
      <div class="game-layout">
        <div class="panel game-main">
          <div class="problem-card"><div class="problem-top"><span class="mode-label">스스로 도전</span><span class="progress" id="gameProgress">1 / 5</span></div><div class="problem" id="gameProblem"></div><div class="progress-track"><div class="progress-fill" id="gameProgressFill"></div></div><div class="instruction" id="gameInstruction"></div></div>
          <div class="source-tray" id="gameSourceTray"></div>
          <div class="workspace" id="gameWorkspace"></div>
          <div class="trash-zone" id="gameTrash" data-trash="game">뺄 모형은 이곳으로 끌어 놓으세요</div>
        </div>
        <aside class="game-side">
          <div class="panel side-card"><h3>이번 도전</h3><div class="score-row"><span>모은 별</span><span class="stars" id="gameStars">☆☆☆☆☆</span></div><div class="score-row"><span>도움 사용</span><span id="gameHintsUsed">0회</span></div><div class="score-row"><span>최고 기록</span><span id="bestScore">0점</span></div></div>
          <div class="panel side-card"><h3>세로셈 확인</h3><div class="equation-box" id="gameEquation"></div></div>
          <div class="panel side-card side-actions"><button class="btn secondary" id="gameHint" type="button">힌트 보기</button><button class="btn secondary" id="gameUndo" type="button">한 단계 되돌리기</button><button class="btn primary" id="gameStart" type="button">새 도전 시작</button></div>
        </aside>
      </div>
    </section>
  </main>
</div>
<div class="modal" id="resultModal" role="dialog" aria-modal="true"><div class="modal-card"><h2 id="resultTitle">잘했어요!</h2><p id="resultText"></p><div class="modal-actions"><button class="btn primary" id="resultAgain" type="button">한 번 더</button><button class="btn secondary" id="resultClose" type="button">닫기</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const INFO={h:{label:'백',value:100,cls:'hundreds',block:'hundred'},t:{label:'십',value:10,cls:'tens',block:'ten'},o:{label:'일',value:1,cls:'ones',block:'one'}};
const ORDER=['h','t','o'];
const GRADE={
  1:{max:20,places:['t','o'],start:14,learn:[{a:8,b:7,op:'add'},{a:9,b:6,op:'add'},{a:13,b:5,op:'sub'},{a:15,b:8,op:'sub'},{a:7,b:8,op:'add'}],game:[{a:6,b:8,op:'add'},{a:7,b:9,op:'add'},{a:14,b:6,op:'sub'},{a:17,b:9,op:'sub'},{a:8,b:5,op:'add'},{a:16,b:7,op:'sub'}]},
  2:{max:99,places:['t','o'],start:47,learn:[{a:28,b:17,op:'add'},{a:46,b:38,op:'add'},{a:67,b:29,op:'sub'},{a:52,b:18,op:'sub'},{a:36,b:28,op:'add'}],game:[{a:27,b:16,op:'add'},{a:58,b:27,op:'add'},{a:71,b:36,op:'sub'},{a:64,b:28,op:'sub'},{a:39,b:45,op:'add'},{a:83,b:47,op:'sub'}]},
  3:{max:999,places:['h','t','o'],start:247,learn:[{a:178,b:256,op:'add'},{a:385,b:267,op:'add'},{a:302,b:178,op:'sub'},{a:500,b:264,op:'sub'},{a:476,b:358,op:'add'}],game:[{a:246,b:187,op:'add'},{a:368,b:457,op:'add'},{a:704,b:286,op:'sub'},{a:600,b:347,op:'sub'},{a:489,b:376,op:'add'},{a:812,b:475,op:'sub'}]}
};
const state={grade:2,sound:true,view:'free',free:{counts:null,history:[],carry:{h:0,t:0,o:0}},sessions:{learn:null,game:null},selected:null,audio:null,toastTimer:null,lastTap:null,gesture:null,drag:null,suppressUntil:0};
function safeLoad(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}function safeSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
{const savedGrade=Number(safeLoad('number-block-grade',2));state.grade=[1,2,3].includes(savedGrade)?savedGrade:2}state.sound=safeLoad('number-block-sound',true)!==false;
function d(n){n=Math.max(0,Math.floor(Number(n)||0));return{h:Math.floor(n/100),t:Math.floor(n%100/10),o:n%10}}
function total(c){return c.h*100+c.t*10+c.o}function copy(c){return{h:c.h,t:c.t,o:c.o}}function copyCarry(c){return{h:c.h||0,t:c.t||0,o:c.o||0}}
function places(){return GRADE[state.grade].places}function upper(p){return p==='o'?'t':p==='t'?'h':null}function lower(p){return p==='h'?'t':p==='t'?'o':null}function opText(op){return op==='add'?'+':'−'}

function clearDragUI(){state.drag?.ghost?.remove();state.drag=null;clearDropClasses();$$('.dragging-source').forEach(e=>e.classList.remove('dragging-source'))}
function wrongPlace(from,to){tone('warn');toast(`${INFO[from].label} 모형은 ${INFO[to].label}의 자리에 그대로 놓을 수 없어요. 묶거나 풀어서 바꿔야 해요.`)}
function removeByContext(c,p){if(c==='free')freeRemove(p);else{const s=getObj(c);if(s?.problem.op==='sub')sessionRemove(s,p);else{tone('warn');toast('덧셈에서 되돌리려면 오른쪽의 한 단계 되돌리기를 사용하세요.')}}}
function handleTap(g){const now=Date.now();if(g.type==='bundle'){performBundle(g.context,g.place);state.lastTap=null;return}if(g.origin==='source'){sessionAdd(getObj(g.context),g.place,1);state.lastTap=null;return}if(g.origin==='store'){freeAdd(g.place);state.lastTap=null;return}const prev=state.lastTap;const isDouble=prev&&prev.key===g.key&&now-prev.time<380;if(isDouble){state.lastTap=null;if(lower(g.place))performSplit(g.context,g.place);else{tone('warn');toast('일 모형은 더 작게 풀 수 없어요.')}return}state.lastTap={key:g.key,time:now};state.selected=g.key;renderContext(g.context);setTimeout(()=>{if(state.lastTap&&state.lastTap.key===g.key&&Date.now()-state.lastTap.time>=370){state.lastTap=null;state.selected=null;renderContext(g.context)}},390)}
function applyGrade(){const cfg=GRADE[state.grade];state.lastTap=null;state.selected=null;clearDragUI();safeSave('number-block-grade',state.grade);normalizeInitial();state.sessions.learn=makeSession('learn');state.sessions.game=makeSession('game');renderFree();renderSession('learn');renderSession('game');$('#makeNumber').max=cfg.max;$('#gradeSelect').value=String(state.grade);$('#bestScore').textContent=`${safeLoad(`number-block-best-${state.grade}`,0)}점`;toast(`${state.grade}학년 문제로 바뀌었어요.`)}
function currentSpeak(){if(state.view==='free')return`현재 수는 ${total(state.free.counts)}입니다. ${places().map(p=>`${INFO[p].label} ${state.free.counts[p]}개`).join(', ')}입니다.`;const s=state.sessions[state.view];if(!s)return'';return`${s.problem.a} ${s.problem.op==='add'?'더하기':'빼기'} ${s.problem.b}. ${instructionFor(s).text}`}
$$('.tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${state.view}`));tone('click')});
$('#gradeSelect').onchange=e=>{state.grade=Number(e.target.value);applyGrade()};$('#soundToggle').onclick=()=>{state.sound=!state.sound;safeSave('number-block-sound',state.sound);$('#soundToggle').textContent=state.sound?'소리 켜짐':'소리 꺼짐';if(state.sound)tone('click')};$('#speakBtn').onclick=()=>speak(currentSpeak());
$('#makeBtn').onclick=()=>{const n=Math.max(0,Math.min(GRADE[state.grade].max,Number($('#makeNumber').value)||0));pushHistory(state.free);state.free.counts=d(n);state.free.carry={h:0,t:0,o:0};tone('exchange');renderFree()};$('#freeReset').onclick=()=>{pushHistory(state.free);state.free.counts={h:0,t:0,o:0};state.free.carry={h:0,t:0,o:0};tone('remove');renderFree()};$('#freeUndo').onclick=()=>{if(restoreHistory(state.free)){tone('click');renderFree()}else toast('되돌릴 내용이 없어요.')};
$('#learnStart').onclick=()=>start('learn');$('#gameStart').onclick=()=>start('game');$('#learnHint').onclick=()=>hint(state.sessions.learn);$('#gameHint').onclick=()=>hint(state.sessions.game);$('#learnUndo').onclick=()=>undoSession(state.sessions.learn);$('#gameUndo').onclick=()=>undoSession(state.sessions.game);
$('#resultClose').onclick=()=>$('#resultModal').classList.remove('open');$('#resultAgain').onclick=()=>{const k=state.view==='game'?'game':'learn';$('#resultModal').classList.remove('open');start(k)};$('#resultModal').onclick=e=>{if(e.target.id==='resultModal')e.currentTarget.classList.remove('open')};
function init(){state.free={counts:d(GRADE[state.grade].start),history:[],carry:{h:0,t:0,o:0}};state.sessions.learn=makeSession('learn');state.sessions.game=makeSession('game');$('#gradeSelect').value=String(state.grade);$('#soundToggle').textContent=state.sound?'소리 켜짐':'소리 꺼짐';$('#makeNumber').max=GRADE[state.grade].max;$('#makeNumber').value=GRADE[state.grade].start;renderFree();renderSession('learn');renderSession('game')}
init();
})();
</script>
</body>
