    {name:'동네 여행자',xp:120,icon:'🎒'},
    {name:'국기 탐험가',xp:350,icon:'🧭'},
    {name:'대륙 여행자',xp:700,icon:'✈️'},
    {name:'세계 지리인',xp:1200,icon:'🗺️'},
    {name:'국기 수집가',xp:2000,icon:'🏳️'},
    {name:'대륙 마스터',xp:3000,icon:'🌎'},
    {name:'세계 박사',xp:4400,icon:'🎓'},
    {name:'글로벌 에이스',xp:6000,icon:'💫'},
    {name:'그랜드 마스터',xp:8000,icon:'👑'},
    {name:'레전더리',xp:10500,icon:'🌟'},
    {name:'월드 챌린저',xp:13500,icon:'⚡'}
  ];

  const DIFFS={
    beginner:{name:'입문',icon:'🌱',max:1,mul:1,xp:1},
    standard:{name:'표준',icon:'🧭',max:2,mul:1.15,xp:1.25},
    challenge:{name:'도전',icon:'🔥',max:3,mul:1.3,xp:1.55}
  };

  const MODES={
    1:{name:'나라 맞히기',icon:'🏳️',desc:'국기를 보고 나라 이름 입력',base:100,parts:1},
    2:{name:'나라 + 수도',icon:'🏛️',desc:'국기를 보고 나라와 수도 입력',base:120,parts:2},
    3:{name:'국기 찾기',icon:'🔎',desc:'나라 이름을 보고 비슷한 국기 중 선택',base:100,parts:1}
  };

  const $=id=>document.getElementById(id);
  const app=$('game');
  const header=$('headerStats');

  function safeParse(raw,fallback){
    try{return raw?JSON.parse(raw):fallback}catch(_){return fallback}
  }

  function freshProfile(){
    return {version:2,xp:0,bestSession:0,totalSessions:0,totalPerfect:0,countries:{},continentRewards:{},legacyScore:0};
  }

  function loadProfile(){
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){
      const p={...freshProfile(),...safeParse(raw,{})};
      p.countries=p.countries&&typeof p.countries==='object'?p.countries:{};
      p.continentRewards=p.continentRewards&&typeof p.continentRewards==='object'?p.continentRewards:{};
      return p;
    }
    const p=freshProfile();
    const legacy=Math.max(0,Number(localStorage.getItem(SCORE_KEY))||0);
    if(legacy>0){
      p.legacyScore=legacy;
      try{localStorage.setItem(LEGACY_KEY,String(legacy));localStorage.setItem(SCORE_KEY,'0')}catch(_){}
    }
    return p;
  }

  let profile=loadProfile();
  let settings={continent:'world',difficulty:'beginner'};
  let state=null;
  let transitionTimer=0;

  function saveProfile(){
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify(profile));
      localStorage.setItem(SCORE_KEY,String(Math.max(0,profile.bestSession||0)));
    }catch(_){}
  }

  function getRank(xp=profile.xp){
    let rank=RANKS[0];
    for(const r of RANKS){if(xp>=r.xp)rank=r;else break}
    return rank;
  }

  function nextRank(xp=profile.xp){
    return RANKS.find(r=>xp<r.xp)||null;
  }

  function countryLevel(code){
    return Number(profile.countries?.[code]?.level)||0;
  }

  function countryStats(code){
    if(!profile.countries[code]) profile.countries[code]={seen:0,correct:0,streak:0,level:0};
    return profile.countries[code];
  }

  function difficultyOf(code){
    if(EASY.has(code))return 1;
    if(STANDARD.has(code))return 2;
    return 3;
  }

  function continentOf(code){
    for(const [key,c] of Object.entries(CONTINENTS)){
      if(key!=='world'&&c.codes.includes(code))return key;
    }
    return 'world';
  }

  function flagUrl(code){
    return 'assets/game/2d/flags/'+code+'.png';
  }

  function normalizeText(text){
    return String(text||'').replace(/[\s\.\,\-·]/g,'').toLowerCase();
  }

  function matches(input,answers){
    const value=normalizeText(input);
    return !!value&&answers.some(a=>normalizeText(a)===value);
  }

  function shuffle(items){
    const a=[...items];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }

  function eligibleCountries(){
    const diff=DIFFS[settings.difficulty];
    return countryData.filter(c=>{
      const cont=settings.continent==='world'||CONTINENTS[settings.continent].codes.includes(c.code);
      return cont&&difficultyOf(c.code)<=diff.max;
    });
  }

  function masteryProgress(continentKey){
    const pool=continentKey==='world'?countryData:countryData.filter(c=>CONTINENTS[continentKey].codes.includes(c.code));
    const mastered=pool.filter(c=>countryLevel(c.code)>=2).length;
    return {mastered,total:pool.length,pct:pool.length?Math.round(mastered/pool.length*100):0};
  }

  function worldProgress(){
    const mastered=countryData.filter(c=>countryLevel(c.code)>=2).length;
    return {mastered,total:countryData.length,pct:Math.round(mastered/countryData.length*100)};
  }

  function buildBaseQueue(total){
    const pool=eligibleCountries();
    const weighted=pool.map(c=>({
      country:c,
      priority:countryLevel(c.code)*20+(countryStats(c.code).seen?5:0)+Math.random()*10
    })).sort((a,b)=>a.priority-b.priority).map(x=>x.country);
    const queue=[];
    const cycle=weighted.length?weighted:[...countryData];
    while(queue.length<total+6){
      const next=shuffle(cycle);
      for(const c of next){queue.push(c);if(queue.length>=total+6)break}
    }
    return queue;
  }

  function smartDistractors(correct,count=3){
    const result=[];
    const add=c=>{
      if(!c||c.code===correct.code||result.some(x=>x.code===c.code))return;
      result.push(c);
    };
    const group=SIMILAR_GROUPS.find(g=>g.includes(correct.code));
    if(group) shuffle(group).forEach(code=>add(countryData.find(c=>c.code===code)));
    const cont=continentOf(correct.code);
    shuffle(countryData.filter(c=>continentOf(c.code)===cont&&difficultyOf(c.code)>=Math.max(1,difficultyOf(correct.code)-1))).forEach(add);
    shuffle(countryData.filter(c=>difficultyOf(c.code)===difficultyOf(correct.code))).forEach(add);
    shuffle(countryData).forEach(add);
    return result.slice(0,count);
  }

  function sessionLength(){
    const n=eligibleCountries().length;
    if(n<=3)return 6;
    if(n<8)return 10;
    return SESSION_DEFAULT;
  }

  function sound(key){
    try{window.KidscadeGame?.sound?.(key)}catch(_){}
  }

  function sdkScore(){
    try{window.KidscadeGame?.score?.(state?.score||0)}catch(_){}
  }

  function clearTransition(){
    if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=0}
  }

  function renderHeader(){
    if(!state){header.innerHTML='';return}
    const accuracy=state.totalParts?Math.round(state.correctParts/state.totalParts*100):0;
    header.innerHTML=
      '<div><b>'+state.score.toLocaleString()+'</b><span>점</span></div>'+
      '<div><b>'+accuracy+'</b><span>% 정확도</span></div>'+
      '<div><b>'+state.combo+'</b><span>콤보</span></div>';
  }

  function renderMenu(){
    clearTransition();
    state=null;
    renderHeader();
    saveProfile();
    const rank=getRank();
    const next=nextRank();
    const wp=worldProgress();
    const legacy=profile.legacyScore?'<div class="legacy">이전 무한모드 기록 '+profile.legacyScore.toLocaleString()+'점은 보관했어요.</div>':'';
    const nextHtml=next
      ? '<div class="rank-next"><span>'+rank.name+'</span><span>'+next.name+'까지 '+(next.xp-profile.xp).toLocaleString()+' XP</span></div><div class="meter"><i style="width:'+Math.max(0,Math.min(100,(profile.xp-rank.xp)/(next.xp-rank.xp)*100))+'%"></i></div>'
      : '<div class="rank-next"><span>'+rank.name+'</span><span>최고 랭크!</span></div>';

    const continentCards=Object.entries(CONTINENTS).map(([key,c])=>{
      const p=masteryProgress(key);
      return '<button class="travel-card '+(settings.continent===key?'selected':'')+'" data-continent="'+key+'">'+
        '<span class="travel-icon">'+c.icon+'</span><b>'+c.name+'</b><small>'+p.mastered+'/'+p.total+' 익힘</small>'+
        '<span class="mini-meter"><i style="width:'+p.pct+'%"></i></span></button>';
    }).join('');

    const diffCards=Object.entries(DIFFS).map(([key,d])=>
      '<button class="choice-chip '+(settings.difficulty===key?'selected':'')+'" data-diff="'+key+'">'+d.icon+' '+d.name+'</button>'
    ).join('');

    const modeCards=Object.entries(MODES).map(([key,m])=>
      '<button class="mode-card" data-mode="'+key+'"><span>'+m.icon+'</span><b>'+m.name+'</b><small>'+m.desc+'</small></button>'
    ).join('');

    app.innerHTML=
      '<section class="hero">'+
        '<div><p class="eyebrow">WORLD FLAG MASTER</p><h2>'+rank.icon+' '+rank.name+'</h2><p>나라를 외우는 퀴즈가 아니라, 틀린 국기를 다시 만나며 세계를 익혀요.</p></div>'+
        '<div class="xp-card"><b>'+profile.xp.toLocaleString()+' XP</b><span>최고 세션 '+profile.bestSession.toLocaleString()+'점</span></div>'+
      '</section>'+
      '<section class="progress-card"><div class="progress-title"><b>세계 숙련도</b><span>'+wp.mastered+' / '+wp.total+'개 나라 익힘</span></div><div class="meter large"><i style="width:'+wp.pct+'%"></i></div>'+nextHtml+legacy+'</section>'+
      '<section><div class="section-title"><b>1. 여행 코스</b><span>대륙별로 집중 연습할 수 있어요.</span></div><div class="travel-grid">'+continentCards+'</div></section>'+
      '<section><div class="section-title"><b>2. 난이도</b><span>입문은 익숙한 나라부터 시작해요.</span></div><div class="chip-row">'+diffCards+'</div></section>'+
      '<section><div class="section-title"><b>3. 게임 모드</b><span>'+sessionLength()+'문제를 풀면 한 판이 끝나요.</span></div><div class="mode-grid">'+modeCards+'</div></section>'+
      '<div class="tip-box">💡 오답은 약 3문제 뒤에 다시 나와요. 같은 대륙·비슷한 무늬 국기를 우선 오답으로 보여줍니다.</div>';

    app.querySelectorAll('[data-continent]').forEach(btn=>btn.addEventListener('click',()=>{settings.continent=btn.dataset.continent;renderMenu()}));
    app.querySelectorAll('[data-diff]').forEach(btn=>btn.addEventListener('click',()=>{settings.difficulty=btn.dataset.diff;renderMenu()}));
    app.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>startSession(Number(btn.dataset.mode))));
  }

  function startSession(mode){
    clearTransition();
    const total=sessionLength();
    state={
      mode,total,answered:0,current:null,score:0,combo:0,bestCombo:0,
      correctQuestions:0,correctParts:0,totalParts:0,mistakes:0,xpEarned:0,
      queue:buildBaseQueue(total),reviewQueue:[],missed:new Set(),review:false,
      locked:false,token:Date.now()
    };
    try{window.KidscadeGame?.start?.({mode,continent:settings.continent,difficulty:settings.difficulty,total})}catch(_){}
    nextQuestion();
  }

  function pullNextCountry(){
    const dueIndex=state.reviewQueue.findIndex(item=>item.due<=state.answered);
    if(dueIndex>=0){
      const item=state.reviewQueue.splice(dueIndex,1)[0];
      state.review=true;
      return item.country;
    }
    state.review=false;
    while(state.queue.length){
      const c=state.queue.shift();
      if(c)return c;
    }
    const fallback=shuffle(eligibleCountries());
    return fallback[0]||countryData[0];
  }

  function nextQuestion(){
    clearTransition();
    if(!state)return;
    if(state.answered>=state.total){finishSession();return}
    state.locked=false;
    state.current=pullNextCountry();
    renderQuestion();
  }

  function questionTop(){
    const mode=MODES[state.mode];
    const cont=CONTINENTS[settings.continent];
    const review=state.review?'<span class="review-badge">↻ 오답 복습</span>':'';
    return '<div class="session-top">'+
      '<button id="quitBtn" class="ghost-btn">← 코스 나가기</button>'+
      '<div class="q-meta">'+review+'<span>'+cont.icon+' '+cont.name+'</span><span>'+DIFFS[settings.difficulty].icon+' '+DIFFS[settings.difficulty].name+'</span></div>'+
      '<div class="question-count">'+(state.answered+1)+' / '+state.total+'</div>'+
    '</div><div class="session-progress"><i style="width:'+Math.round(state.answered/state.total*100)+'%"></i></div>'+
    '<div class="mode-label">'+mode.icon+' '+mode.name+'</div>';
  }

  function flagImage(country){
    return `<div class="flag-stage"><img src="${flagUrl(country.code)}" alt="${country.name[0]} 국기" onerror="this.classList.add('flag-broken');this.alt='국기 이미지를 불러오지 못했어요';"></div>`;
  }

  function renderQuestion(){
    if(!state)return;
    renderHeader();
    const c=state.current;
    let body='';
    if(state.mode===1){
      body=flagImage(c)+
        '<h2>이 국기의 나라는 어디일까요?</h2>'+
        '<div class="answer-row"><input id="countryInput" class="answer-input" placeholder="나라 이름" autocomplete="off"><button id="submitBtn" class="primary-btn">확인</button></div>';
    }else if(state.mode===2){
      body=flagImage(c)+
        '<h2>나라 이름과 수도를 모두 적어보세요.</h2>'+
        '<div class="stack"><input id="countryInput" class="answer-input" placeholder="나라 이름" autocomplete="off"><input id="capitalInput" class="answer-input" placeholder="수도 이름" autocomplete="off"><button id="submitBtn" class="primary-btn purple">확인</button></div>';
    }else{
      const options=shuffle([c,...smartDistractors(c,3)]);
      state.options=options;
      body='<div class="country-prompt"><span>이 나라의 국기는?</span><b>'+c.name[0]+'</b><small>'+CONTINENTS[continentOf(c.code)].name+' · 난이도 '+difficultyOf(c.code)+'</small></div>'+
        '<div class="flag-options">'+options.map((o,i)=>
          '<button class="flag-option" data-option="'+i+'"><img src="'+flagUrl(o.code)+'" alt="국기 선택지"></button>'
        ).join('')+'</div>';
    }
    app.innerHTML=questionTop()+'<section class="question-card">'+body+'<div id="feedback" class="feedback"></div></section>';
    $('quitBtn').addEventListener('click',()=>abandonSession());
    if(state.mode===3){
      app.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>answerMode3(Number(btn.dataset.option))));
    }else{
      $('submitBtn').addEventListener('click',()=>submitTyped());
      const first=$('countryInput');
      first?.focus();
      first?.addEventListener('keydown',e=>{
        if(e.key!=='Enter')return;
        if(state.mode===2){$('capitalInput').focus()}else submitTyped();
      });
      $('capitalInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitTyped()});
    }
  }

  function awardXp(fullCorrect,partial){
    const diff=DIFFS[settings.difficulty];
    const base=fullCorrect?24:partial?10:3;
    const reviewBonus=state.review&&fullCorrect?6:0;
    const gained=Math.round((base+reviewBonus)*diff.xp);
    profile.xp+=gained;
    state.xpEarned+=gained;
    return gained;
  }

  function recordCountry(country,fullCorrect,partial){
    const s=countryStats(country.code);
    s.seen++;
    if(fullCorrect){
      s.correct++;
      s.streak++;
      if(s.streak>=4)s.level=Math.max(s.level,3);
      else if(s.streak>=2)s.level=Math.max(s.level,2);
      else s.level=Math.max(s.level,1);
    }else{
      s.streak=0;
      if(!partial&&s.level>0)s.level--;
    }
  }

  function maybeContinentMastered(country){
    const key=continentOf(country.code);
    const p=masteryProgress(key);
    const threshold=Math.min(10,p.total);
    if(p.mastered>=threshold&&!profile.continentRewards[key]){
      profile.continentRewards[key]=true;
      try{window.KidscadeGame?.milestone?.('continent_mastered',{continent:key,continentMastered:true,mastered:p.mastered,total:p.total})}catch(_){}
    }
  }

  function scheduleReview(country){
    if(state.reviewQueue.some(x=>x.country.code===country.code))return;
    state.reviewQueue.push({country,due:state.answered+3});
  }

  function applyResult(result){
    if(state.locked)return;
    state.locked=true;
    const c=state.current;
    state.answered++;
    state.totalParts+=MODES[state.mode].parts;
    state.correctParts+=result.partsCorrect;
    const fullCorrect=result.fullCorrect;
    const partial=result.partsCorrect>0&&!fullCorrect;
    if(fullCorrect){
      state.correctQuestions++;
      state.combo++;
      state.bestCombo=Math.max(state.bestCombo,state.combo);
    }else{
      state.mistakes++;
      state.combo=0;
      state.missed.add(c.code);
      scheduleReview(c);
    }

    const comboBonus=fullCorrect?Math.min(50,Math.max(0,(state.combo-1)*10)):0;
    const raw=result.points+comboBonus;
    const gained=Math.round(raw*DIFFS[settings.difficulty].mul);
    state.score+=gained;
    const xp=awardXp(fullCorrect,partial);
    recordCountry(c,fullCorrect,partial);
    maybeContinentMastered(c);
    saveProfile();
    sdkScore();
    renderHeader();
    showFeedback(result,gained,xp);
  }

  function submitTyped(){
    if(!state||state.locked)return;
    const c=state.current;
    const countryValue=$('countryInput').value;
    const countryOk=matches(countryValue,c.name);
    if(state.mode===1){
      if(!countryValue.trim())return;
      applyResult({
        fullCorrect:countryOk,partsCorrect:countryOk?1:0,points:countryOk?MODES[1].base:0,
        rows:[{label:'나라',ok:countryOk,your:countryValue,answer:c.name[0]}]
      });
      return;
    }
    const capitalValue=$('capitalInput').value;
    if(!countryValue.trim()||!capitalValue.trim())return;
    const capitalOk=matches(capitalValue,c.capital);
    const parts=(countryOk?1:0)+(capitalOk?1:0);
    applyResult({
      fullCorrect:parts===2,partsCorrect:parts,points:parts*60,
      rows:[
        {label:'나라',ok:countryOk,your:countryValue,answer:c.name[0]},
        {label:'수도',ok:capitalOk,your:capitalValue,answer:c.capital[0]}
      ]
    });
  }

  function answerMode3(index){
    if(!state||state.locked)return;
    const selected=state.options[index];
    const ok=selected?.code===state.current.code;
    applyResult({
      fullCorrect:ok,partsCorrect:ok?1:0,points:ok?MODES[3].base:0,selectedCode:selected?.code||'',
      rows:[{label:'국기',ok,your:selected?.name?.[0]||'',answer:state.current.name[0]}]
    });
    app.querySelectorAll('.flag-option').forEach((btn,i)=>{
      const code=state.options[i].code;
      if(code===state.current.code)btn.classList.add('correct-choice');
      else if(i===index&&!ok)btn.classList.add('wrong-choice');
      btn.disabled=true;
    });
  }

  function showFeedback(result,gained,xp){
    const c=state.current;
    const box=$('feedback');
    const full=result.fullCorrect;
    const partial=result.partsCorrect>0&&!full;
    sound(full?'correct':'wrong');
    box.className='feedback show '+(full?'good':partial?'partial':'bad');
    const rows=result.rows.map(r=>
      '<div class="feedback-row"><span>'+r.label+'</span><b class="'+(r.ok?'ok':'no')+'">'+(r.ok?'✓':'✕')+' '+(r.ok?r.answer:(r.your||'미입력')+' → '+r.answer)+'</b></div>'
    ).join('');
    box.innerHTML=
      '<div class="feedback-title">'+(full?'정답!':partial?'절반 성공!':'다시 기억해볼까요?')+
      (gained?'<span>+'+gained+'점 · +'+xp+' XP</span>':'<span>+'+xp+' XP</span>')+'</div>'+
      rows+
      (!full?'<div class="review-note">↻ 이 나라는 약 3문제 뒤에 다시 만나요.</div>':'')+
      '<div class="country-note">'+CONTINENTS[continentOf(c.code)].icon+' '+CONTINENTS[continentOf(c.code)].name+' · '+c.name[0]+'의 수도는 '+c.capital[0]+'</div>';
    transitionTimer=setTimeout(()=>nextQuestion(),full?850:1550);
  }

  function abandonSession(){
    if(!state)return renderMenu();
    clearTransition();
    try{window.KidscadeGame?.result?.({scope:'session',status:'abandoned',score:state.score,answered:state.answered,total:state.total})}catch(_){}
    renderMenu();
  }

  function finishSession(){
    clearTransition();
    if(!state)return;
    const finished={...state,missed:[...state.missed]};
    const accuracy=finished.totalParts?Math.round(finished.correctParts/finished.totalParts*100):0;
    const perfect=finished.mistakes===0;
    profile.totalSessions++;
    if(perfect)profile.totalPerfect++;
    profile.bestSession=Math.max(profile.bestSession,finished.score);
    saveProfile();
    try{
      window.KidscadeGame?.result?.({
        scope:'session',status:'completed',score:finished.score,
        correct:finished.correctQuestions,total:finished.total,mistakes:finished.mistakes,
        accuracy,bestCombo:finished.bestCombo,perfect,
        mode:finished.mode,continent:settings.continent,difficulty:settings.difficulty
      });
    }catch(_){}
    renderResult(finished,accuracy,perfect);
  }

  function renderResult(finished,accuracy,perfect){
    const rank=getRank();
    const missedCountries=finished.missed.map(code=>countryData.find(c=>c.code===code)).filter(Boolean);
    const reviewHtml=missedCountries.length
      ? '<div class="review-list"><b>다시 볼 나라</b><div>'+missedCountries.map(c=>'<span>'+c.name[0]+' · '+c.capital[0]+'</span>').join('')+'</div></div>'
      : '<div class="perfect-banner">✨ 이번 코스는 오답 없이 완주했어요!</div>';
    app.innerHTML=
      '<section class="result-hero"><div class="result-icon">'+(perfect?'🏆':accuracy>=80?'🌟':'🧭')+'</div><p class="eyebrow">SESSION COMPLETE</p><h2>'+(perfect?'퍼펙트 세계 여행!':accuracy>=80?'멋진 여행이었어요!':'복습하면 더 강해져요!')+'</h2><p>'+CONTINENTS[settings.continent].name+' · '+MODES[finished.mode].name+'</p></section>'+
      '<div class="result-grid">'+
        '<div><span>점수</span><b>'+finished.score.toLocaleString()+'</b></div>'+
        '<div><span>정확도</span><b>'+accuracy+'%</b></div>'+
        '<div><span>최고 콤보</span><b>'+finished.bestCombo+'</b></div>'+
        '<div><span>획득 XP</span><b>+'+finished.xpEarned+'</b></div>'+
      '</div>'+
      '<div class="rank-result"><span>'+rank.icon+'</span><div><b>'+rank.name+'</b><small>누적 '+profile.xp.toLocaleString()+' XP · 최고 세션 '+profile.bestSession.toLocaleString()+'점</small></div></div>'+
      reviewHtml+
      '<div class="result-actions"><button id="retryBtn" class="primary-btn">같은 코스 다시</button><button id="menuBtn" class="secondary-btn">여행 코스 선택</button></div>';
    $('retryBtn').addEventListener('click',()=>startSession(finished.mode));
    $('menuBtn').addEventListener('click',renderMenu);
    state=null;
    renderHeader();
  }

  window.addEventListener('pagehide',()=>saveProfile());
  try{window.KidscadeGame?.registerCleanup?.(()=>{clearTransition();saveProfile()})}catch(_){}
  renderMenu();

</script>
</body>
</html>
