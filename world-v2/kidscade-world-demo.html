<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kidscade World v2 · Continuous World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a14;font-family:"맑은 고딕",system-ui,sans-serif;color:#253126}#app{position:fixed;inset:0}#world-v2{display:block;width:100%;height:100%;outline:none;background:#9fbd69;image-rendering:pixelated}.hud{position:absolute;left:14px;top:14px;z-index:3;max-width:min(470px,calc(100vw - 28px));padding:12px 14px;border:3px solid #2e3727;border-radius:8px;background:rgba(248,239,203,.95);box-shadow:5px 5px 0 rgba(31,38,27,.3);pointer-events:none}.hud b{display:block;font-size:16px}.hud .small{margin-top:4px;font-size:12px;line-height:1.45;color:#59604b}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{padding:4px 7px;border:2px solid #5e684e;border-radius:4px;background:#f8efcb;font-size:10px;font-weight:900}.zone{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:3;padding:7px 15px;border:3px solid #30382a;border-radius:5px;background:#f4e7b9;font-weight:1000;box-shadow:4px 4px 0 rgba(0,0,0,.22);pointer-events:none}.prompt{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:4;min-width:180px;text-align:center;padding:9px 14px;border:3px solid #d3c487;border-radius:5px;background:#2d3428;color:#fff7d1;font-weight:900;opacity:0;transition:.12s;pointer-events:none}.prompt.show{opacity:1}.toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-8px);z-index:5;padding:8px 13px;border:3px solid #544b32;border-radius:5px;background:#fff0ae;font-weight:900;opacity:0;transition:.16s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="world-v2" tabindex="0" aria-label="Kidscade World v2 연속 월드 테스트"></canvas>
  <div class="hud"><b>Kidscade World v2 · 2단계</b><div class="small">집 → 나의 정원 → 농장을 장면 전환 없이 걸어갑니다. WASD/방향키 이동 · E/Space 상호작용. BrowserQuest 3 아트 어댑터를 시험 적용 중입니다.</div><div class="stats" id="stats"></div></div>
  <div class="zone" id="zone">집 앞</div>
  <div class="toast" id="toast"></div>
  <div class="prompt" id="prompt"></div>
</div>
<script src="kidscade-world-core.js"></script>
<script src="kidscade-world-storage.js"></script>
<script src="kidscade-world-bridge.js"></script>
<script src="kidscade-world-art-browserquest.js"></script>
<script>
(function(){
'use strict';
const K=window.KidscadeWorldV2, BQ=K.BrowserQuestArt, canvas=document.getElementById('world-v2');
const snap=K.Bridge.snapshot(),save=K.Storage.load();
const TILE=48,W=3360,H=1536;
const HOME={x:0,y:0,w:960,h:H,name:'집 앞'},GARDEN={x:960,y:0,w:1392,h:H,name:'나의 정원'},FARM={x:2352,y:0,w:1008,h:H,name:'농장'};
const yard={x:1080,y:360,w:1120,h:800,cols:12,rows:8};
const fish=new Set(['fish','neonTetra','platy','cory','betta']);
const fallbackSize={pond:[3,2],bed:[2,1],tunnel:[2,1],platform:[2,1],shadeTree:[2,2],bench:[2,1],picnic:[2,2],hammock:[2,1]};
const kindName={pond:'연못',water:'물 쉼터',food:'먹이 자리',bed:'잠자리',ball:'공놀이',tunnel:'터널',tower:'오르기 나무',platform:'통나무 발판',wheel:'쳇바퀴',flower:'꽃밭',shadeTree:'그늘 나무',bench:'벤치',picnic:'피크닉',hammock:'해먹'};
const animalName={hamster:'햄스터',iguana:'이구아나',fish:'구피',dog:'강아지',rabbit:'토끼',parrot:'앵무새',turtle:'거북이',cat:'고양이',goat:'염소',miniPig:'미니돼지',sugarGlider:'슈가글라이더',neonTetra:'네온테트라',platy:'플래티',cory:'코리도라스',betta:'베타'};
const toastEl=document.getElementById('toast');let toastTimer=0;
function toast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500);}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function tileRect(c,x,y,w,h,a,b){for(let yy=y;yy<y+h;yy+=TILE)for(let xx=x;xx<x+w;xx+=TILE){c.fillStyle=((Math.floor(xx/TILE)+Math.floor(yy/TILE))&1)?a:b;c.fillRect(xx,yy,TILE,TILE);}}
function path(c,x,y,w,h){tileRect(c,x,y,w,h,'#b9a66c','#c5b379');}
function currentZone(p){const x=p.centerX;return x<HOME.w?HOME:x<GARDEN.x+GARDEN.w?GARDEN:FARM;}

const world=new K.World({
  canvas,width:W,height:H,playerSpeed:260,clearColor:'#89a957',camera:{zoom:1,lerp:.16},
  background(c){
    c.imageSmoothingEnabled=false;
    tileRect(c,0,0,W,H,'#86aa58','#8fb45d');
    tileRect(c,GARDEN.x,0,GARDEN.w,H,'#91b965','#99c06d');
    tileRect(c,FARM.x,0,FARM.w,H,'#a2b866','#aabe70');
    path(c,0,690,W,150);path(c,680,350,180,490);path(c,2210,350,180,490);
    c.fillStyle='#7f9f55';c.fillRect(yard.x,yard.y,yard.w,yard.h);
    c.strokeStyle='#4d633b';c.lineWidth=4;c.strokeRect(yard.x,yard.y,yard.w,yard.h);
    // farm plots
    for(let r=0;r<3;r++)for(let col=0;col<3;col++){
      const x=2520+col*240,y=280+r*270;c.fillStyle='#765433';c.fillRect(x,y,180,190);c.fillStyle='#8f6840';
      for(let k=0;k<4;k++)c.fillRect(x+15,y+18+k*43,150,18);
    }
    c.fillStyle='#283520';c.font='900 24px monospace';c.fillText('HOME',80,125);c.fillText('MY GARDEN',1080,125);c.fillText('FARM',2480,125);
  },
  overlay(c,w){c.save();c.fillStyle='rgba(21,27,18,.72)';c.font='900 11px monospace';c.textAlign='right';c.fillText(`${Math.round(w.player.x)}, ${Math.round(w.player.y)}`,w.viewportWidth-12,w.viewportHeight-12);c.restore();}
});

function fallbackPlayer(c,e){
  c.save();c.imageSmoothingEnabled=false;c.fillStyle='#262b22';c.fillRect(e.x+4,e.y+8,32,42);c.fillStyle='#d4a47b';c.fillRect(e.x+8,e.y,24,24);c.fillStyle='#5f7951';c.fillRect(e.x+7,e.y+24,26,28);c.fillStyle='#20241e';c.fillRect(e.x+10,e.y+52,8,12);c.fillRect(e.x+24,e.y+52,8,12);c.restore();
}
const player=world.setPlayer(new K.Entity({id:'player',type:'player',x:Number(save.player.x)||620,y:Number(save.player.y)||760,w:40,h:64,render:fallbackPlayer}));
if(player.x>W-100||player.y>H-100){player.x=620;player.y=760;}

function pixelHouse(c,e){
  c.save();c.imageSmoothingEnabled=false;c.fillStyle='#5b4632';c.fillRect(e.x-18,e.y+30,e.w+36,e.h-30);c.fillStyle='#d0b36e';c.fillRect(e.x,e.y+60,e.w,e.h-60);c.fillStyle='#49382d';
  for(let i=0;i<e.w+80;i+=48)c.fillRect(e.x-38+i,e.y+20+(i%96?0:12),58,48);
  c.fillStyle='#5b3928';c.fillRect(e.centerX-34,e.y+e.h-82,68,82);c.fillStyle='#83a9a1';c.fillRect(e.x+55,e.y+105,54,46);c.fillRect(e.x+e.w-109,e.y+105,54,46);c.restore();
}
world.spawn({id:'home-house',type:'building',x:180,y:270,w:430,h:330,solid:true,render:pixelHouse,interaction:{label:'집 살펴보기',action(){toast('집 내부는 다음 단계에서 별도 서브맵으로 연결합니다.');}}});

world.spawn({id:'bq-chest',type:'object',x:700,y:610,w:48,h:48,solid:true,render(c,e){if(!BQ.sprite.chest(c,e.x,e.y,1)){c.fillStyle='#8b633f';c.fillRect(e.x,e.y,e.w,e.h);}},interaction:{label:'BrowserQuest 상자 보기',action(){toast('BrowserQuest 3 실제 스프라이트 로드 테스트');}}});
world.spawn({id:'bq-wood',type:'object',x:2470,y:1030,w:48,h:48,solid:false,render(c,e){if(!BQ.sprite.wood(c,e.x,e.y,1)){c.fillStyle='#77563d';c.fillRect(e.x,e.y,e.w,e.h);}},interaction:{label:'목재 살펴보기',action(){toast('벌목/제작 자원 엔티티 자리');}}});
world.spawn({id:'bq-villager',type:'npc',x:2660,y:680,w:48,h:48,solid:true,render(c,e){if(!BQ.sprite.villager(c,e.x,e.y,1)){c.fillStyle='#d5ba7a';c.fillRect(e.x,e.y,e.w,e.h);}},interaction:{label:'농장 주민과 이야기',action(){toast('NPC 대화 시스템 연결 예정');}}});

// simple fences/collision demonstrate one continuous outdoor map
[[940,180,20,420],[940,980,20,380],[2332,160,20,430],[2332,970,20,390]].forEach((q,i)=>world.spawn({id:'fence-'+i,type:'fence',x:q[0],y:q[1],w:q[2],h:q[3],solid:true,render(c,e){c.fillStyle='#684e35';c.fillRect(e.x,e.y,e.w,e.h);for(let y=e.y+10;y<e.y+e.h;y+=48){c.fillStyle='#9b754b';c.fillRect(e.x-8,y,e.w+16,9);}}}));

const placed=snap.garden.placed||[];
placed.forEach((p,i)=>{
  const f=snap.garden.facilities?.[p.kind]||{}, wh=fallbackSize[p.kind]||[f.w||1,f.h||1], cw=yard.w/yard.cols,ch=yard.h/yard.rows;
  const w=Math.max(30,wh[0]*cw-12),h=Math.max(26,wh[1]*ch-12),x=yard.x+p.x*cw+6,y=yard.y+p.y*ch+6,water=p.kind==='pond';
  world.spawn({id:`garden-${p.id||i}`,type:'garden-facility',x,y,w,h,solid:!water,data:{kind:p.kind},render(c,e){
    // Intentionally neutral pixel placeholders. Existing life-world furniture art is not reused.
    const pal={pond:'#4e9dad',water:'#62aeb4',food:'#c8994e',bed:'#8d759e',ball:'#c75f46',tunnel:'#735b44',tower:'#526f3e',platform:'#795536',wheel:'#a77a39',flower:'#bc6b83',shadeTree:'#557a43',bench:'#78583a',picnic:'#b96e67',hammock:'#b8944e'};
    c.save();c.imageSmoothingEnabled=false;c.fillStyle=pal[e.data.kind]||'#8f7b52';c.fillRect(e.x,e.y,e.w,e.h);c.strokeStyle='#31372b';c.lineWidth=3;c.strokeRect(e.x,e.y,e.w,e.h);c.fillStyle='#f7edc8';c.font='900 11px monospace';c.textAlign='center';c.fillText(kindName[e.data.kind]||e.data.kind,e.centerX,e.centerY+4);c.restore();
  },interaction:{label:`${kindName[p.kind]||p.kind} 살펴보기`,action(){toast(`${kindName[p.kind]||p.kind}: 기존 정원 저장값에서 불러옴`);}}});
});

function spawnAnimal(id,index){
  if(fish.has(id))return;const minX=yard.x+30,maxX=yard.x+yard.w-70,minY=yard.y+40,maxY=yard.y+yard.h-70;
  world.spawn(new K.Entity({id:`pet-${id}`,type:'animal',x:minX+(index*91)%(maxX-minX),y:minY+(index*67)%(maxY-minY),w:38,h:30,data:{name:animalName[id]||id,targetX:null,targetY:null,wait:Math.random()*1.5},render(c,a){c.save();c.imageSmoothingEnabled=false;c.fillStyle='#342f27';c.fillRect(a.x+4,a.y+10,30,18);c.fillStyle='#d1a76f';c.fillRect(a.x,a.y+5,30,20);c.fillRect(a.x+24,a.y,14,14);c.fillStyle='#211f1b';c.fillRect(a.x+31,a.y+4,3,3);c.font='900 10px monospace';c.textAlign='center';c.fillText(a.data.name,a.centerX,a.y-6);c.restore();},update(a,dt,w){
    a.data.wait-=dt;if(a.data.wait<=0||a.data.targetX==null||Math.hypot(a.data.targetX-a.x,a.data.targetY-a.y)<10){a.data.targetX=minX+Math.random()*(maxX-minX);a.data.targetY=minY+Math.random()*(maxY-minY);a.data.wait=1.4+Math.random()*3;}
    const dx=a.data.targetX-a.x,dy=a.data.targetY-a.y,d=Math.hypot(dx,dy);if(d>8&&a.data.wait>0)w.collision.move(a,dx/d*36*dt,dy/d*36*dt);
  },interaction:{label:`${animalName[id]||id} 인사하기`,action(){toast(`${animalName[id]||id}가 반가워해요.`);}}}));
}
(snap.garden.owned||[]).forEach(spawnAnimal);

const prompt=document.getElementById('prompt'),zoneEl=document.getElementById('zone'),stats=document.getElementById('stats');
world.events.on('interaction:focus',e=>{if(e){prompt.textContent=`E / Space · ${world.interaction.label()}`;prompt.classList.add('show');}else prompt.classList.remove('show');});
let lastZone='',saveClock=0,artClock=0;
world.events.on('update',({dt})=>{
  const z=currentZone(player);if(z.name!==lastZone){lastZone=z.name;zoneEl.textContent=z.name;toast(`${z.name} 지역`);}
  saveClock+=dt;artClock+=dt;
  if(saveClock>=1.5){saveClock=0;const s=K.Storage.load();s.player.x=Math.round(player.x);s.player.y=Math.round(player.y);s.player.lastZone=lastZone;s.migration.lastPreview=K.Storage.previewMigration();K.Storage.save(s);}
  if(artClock>=.5){artClock=0;const states=BQ.status(),ready=states.filter(x=>x.status==='ready').length;stats.innerHTML=`<span class="chip">엔진 ${K.VERSION}</span><span class="chip">씨앗 ${snap.seeds}</span><span class="chip">동물 ${(snap.garden.owned||[]).length}</span><span class="chip">시설 ${placed.length}</span><span class="chip">BQ3 ${ready}/${states.length}</span><span class="chip">48px 타일</span>`;}
});
canvas.focus();world.start();
})();
</script>
</body>
</html>
