<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한국사 기억력 게임 (5x5 태극기 에디션)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #e2e8f0; /* 배경을 좀 더 차분하게 */
            touch-action: manipulation;
            overflow: hidden; 
        }

        /* 3D Card Flip CSS */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-inner { transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        /* Board Sizing - 정사각형 제한 해제, 꽉 채우기 */
        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            width: 100%;
            height: 100%;
            gap: clamp(4px, 1.5vmin, 12px);
        }

        /* Card Text Dynamic Scaling - 텍스트 넘침 방지 및 조절 */
        .card-content-term { 
            font-size: clamp(0.9rem, 3.5vmin, 2.2rem); 
            line-height: 1.2; 
            word-break: keep-all; 
        }
        .card-content-desc { 
            font-size: clamp(0.7rem, 2.2vmin, 1.1rem); 
            line-height: 1.35; 
            word-break: keep-all; 
        }
        
        /* 스크롤은 가능하되 스크롤바는 숨김 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen text-gray-800 flex items-center justify-center p-2 sm:p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-[1200px] bg-white rounded-3xl shadow-2xl overflow-hidden relative h-full flex flex-col border border-slate-200">
        
        <!-- Main Menu Screen -->
        <div id="menu-screen" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-slate-50 p-4 sm:p-6 overflow-y-auto">
            <h1 class="text-4xl sm:text-6xl font-black text-indigo-900 mb-2 text-center tracking-tight">역사 짝맞추기 <span class="text-orange-500">마스터</span></h1>
            <p class="text-slate-600 mb-8 text-center font-bold text-lg">5x5 보드! 100초 안에 최대한 많이 맞추세요!</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl mb-6">
                <button onclick="startGame('figures')" class="flex flex-col items-center p-6 bg-blue-100 hover:bg-blue-200 rounded-2xl transition shadow-sm border-2 border-blue-200 transform hover:-translate-y-1">
                    <span class="text-5xl mb-3">👤</span>
                    <span class="text-xl sm:text-2xl font-bold text-blue-900">인물 모드 (75명)</span>
                </button>
                <button onclick="startGame('events')" class="flex flex-col items-center p-6 bg-red-100 hover:bg-red-200 rounded-2xl transition shadow-sm border-2 border-red-200 transform hover:-translate-y-1">
                    <span class="text-5xl mb-3">⚔️</span>
                    <span class="text-xl sm:text-2xl font-bold text-red-900">사건 모드 (75건)</span>
                </button>
            </div>

            <button onclick="openEncyclopedia()" class="mb-8 w-full max-w-2xl flex items-center justify-center gap-3 p-4 bg-emerald-100 hover:bg-emerald-200 rounded-2xl transition shadow-sm border-2 border-emerald-200">
                <span class="text-3xl">📖</span>
                <span class="text-xl font-bold text-emerald-900">역사도감 (수집 현황 확인)</span>
            </button>

            <!-- High Scores -->
            <div class="bg-white p-6 rounded-xl shadow-inner w-full max-w-2xl border border-slate-200 flex flex-col sm:flex-row gap-6 divide-y sm:divide-y-0 sm:divide-x divide-slate-200 text-center">
                <div class="flex-1 pt-2 sm:pt-0 flex flex-col items-center justify-center">
                    <h3 class="font-bold text-slate-500 mb-2">인물 최고 기록</h3>
                    <div class="text-3xl font-black text-indigo-600 mb-1" id="hs-figures">0점</div>
                    <div class="text-base font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-md" id="rank-figures">구석기</div>
                </div>
                <div class="flex-1 pt-6 sm:pt-0 flex flex-col items-center justify-center">
                    <h3 class="font-bold text-slate-500 mb-2">사건 최고 기록</h3>
                    <div class="text-3xl font-black text-indigo-600 mb-1" id="hs-events">0점</div>
                    <div class="text-base font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-md" id="rank-events">구석기</div>
                </div>
            </div>
        </div>

        <!-- Encyclopedia Screen -->
        <div id="encyclopedia-screen" class="hidden absolute inset-0 z-30 bg-slate-50 flex-col h-full w-full">
            <header class="bg-emerald-900 text-white p-4 flex justify-between items-center shadow-md">
                <h2 class="text-2xl font-bold flex items-center gap-2">📖 역사도감 <span class="text-base font-normal bg-emerald-700 px-3 py-1 rounded-lg" id="dex-progress">0/0</span></h2>
                <button onclick="closeEncyclopedia()" class="bg-emerald-700 hover:bg-emerald-600 px-5 py-2 rounded-lg font-bold transition">돌아가기</button>
            </header>
            
            <div class="flex gap-2 p-4 bg-white border-b shrink-0">
                <button onclick="renderEncyclopedia('figures')" id="tab-figures" class="flex-1 py-3 text-lg font-bold rounded-lg bg-emerald-100 text-emerald-900 transition">👤 인물</button>
                <button onclick="renderEncyclopedia('events')" id="tab-events" class="flex-1 py-3 text-lg font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition">⚔️ 사건</button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                <div id="dex-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 pb-10">
                    <!-- Dex items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden flex-col h-full w-full absolute inset-0 bg-slate-100">
            <!-- Header -->
            <header class="bg-indigo-900 text-white p-3 sm:p-4 flex justify-between items-center shadow-md z-10 shrink-0 h-[60px] sm:h-[70px]">
                <div class="flex items-center gap-2">
                    <div id="timer-container" class="bg-slate-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg font-bold text-xl sm:text-2xl flex items-center gap-2 transition-colors">
                        <span>⏳</span> <span id="timer" class="w-12 sm:w-16 text-center">준비</span>
                    </div>
                </div>
                <div class="text-lg sm:text-2xl font-bold" id="current-mode-display">모드</div>
                <div class="bg-indigo-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg font-bold text-xl sm:text-2xl flex items-center gap-2">
                    <span>⭐</span> <span id="score" class="w-8 sm:w-10 text-center">0</span>
                </div>
            </header>

            <!-- Board -->
            <main class="flex-1 p-2 sm:p-4 flex items-center justify-center relative w-full h-[calc(100%-70px)]">
                <!-- 보드 크기를 최대화 -->
                <div id="game-board" class="perspective-1000">
                    <!-- Cards will be injected here -->
                </div>
            </main>
        </div>

        <!-- Game Over Screen -->
        <div id="result-screen" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/85 p-6 backdrop-blur-sm">
            <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center">
                <h2 class="text-4xl font-black text-slate-800 mb-2">시간 종료!</h2>
                <p class="text-slate-600 mb-4 text-lg">최종 점수</p>
                <div class="text-8xl font-black text-indigo-600 mb-4" id="final-score">0</div>
                <div class="text-2xl font-bold text-orange-500 mb-8 bg-orange-50 inline-block px-6 py-3 rounded-xl border border-orange-200" id="final-rank">랭크</div>
                
                <div id="new-record" class="hidden text-red-500 font-bold mb-6 animate-bounce text-xl">🎉 최고 기록 경신! 🎉</div>
                
                <button onclick="returnToMenu()" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xl transition shadow-lg">
                    메인 메뉴로 돌아가기
                </button>
            </div>
        </div>
    </div>

                { term: "신간회 창립", desc: "1927년 비타협적 민족주의 세력과 사회주의 세력이 힘을 합쳐 만든 항일 민족 단체" },
                { term: "조선어 학회 사건", desc: "1942년 일제가 우리말을 연구하고 사전을 편찬하려던 학자들을 치안 유지법 위반으로 구속한 사건" },
                { term: "제주 4.3 사건", desc: "1948년 제주도에서 무력 충돌과 토벌 과정에서 수많은 무고한 도민들이 희생된 비극" },
                { term: "새마을 운동", desc: "1970년대 근면, 자조, 협동 정신을 바탕으로 농촌 환경 개선과 소득 증대를 목표로 추진된 운동" }
            ]
        };

        // --- RANK SYSTEM ---
        function getRank(score) {
            if(score < 6) return "구석기";
            if(score < 12) return "신석기";
            if(score < 18) return "고조선";
            if(score < 24) return "삼국시대";
            if(score < 30) return "남북국시대";
            if(score < 36) return "고려시대";
            if(score < 42) return "조선시대";
            if(score < 50) return "대한제국";
            if(score < 60) return "대한민국";
            return "역사왕 👑";
        }

        // --- STATE & CONFIG ---
        let currentMode = '';
        let score = 0;
        let timeRemaining = 100;
        let timerInterval = null;
        let previewInterval = null; // 5초 카운트다운용 인터벌 추가
        let availablePool = [];
        let flippedCards = [];
        let isLocked = false;
        let matchedPairsCount = 0;
        let pairsPerBoard = 12; // 5x5 grid = 25 tiles. 1 center tile + 24 cards (12 pairs)
        
        let unlockedDex = JSON.parse(localStorage.getItem('historyMatchDex') || '[]');

        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmOscillator;
        let bgmGain;
        let isBgmPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'match') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'mismatch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'over') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1);
                osc.start(now);
                osc.stop(now + 1);
            } else if (type === 'beep') { 
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'countdown') { // 카운트다운용 크고 명확한 비프음
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now); 
                gain.gain.setValueAtTime(0.4, now); // 더 크게
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        function startBGM() {
            initAudio();
            if (isBgmPlaying) return;
            bgmOscillator = audioCtx.createOscillator();
            bgmGain = audioCtx.createGain();
            bgmOscillator.type = 'triangle';
            bgmOscillator.frequency.value = 220; 
            bgmGain.gain.value = 0.04; 
            bgmOscillator.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 2; 
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.02;
            lfo.connect(lfoGain);
            lfoGain.connect(bgmGain.gain);
            
            bgmOscillator.start();
            lfo.start();
            isBgmPlaying = true;
            bgmOscillator.lfo = lfo; 
        }

        function stopBGM() {
            if (isBgmPlaying && bgmOscillator) {
                bgmOscillator.stop();
                if(bgmOscillator.lfo) bgmOscillator.lfo.stop();
                bgmOscillator.disconnect();
                isBgmPlaying = false;
            }
        }

        // --- HIGH SCORES & DEX ---
        function loadHighScores() {
            const hs = JSON.parse(localStorage.getItem('historyMatchHS') || '{"figures":0, "events":0}');
            document.getElementById('hs-figures').innerText = hs.figures + '점';
            document.getElementById('rank-figures').innerText = getRank(hs.figures);
            
            document.getElementById('hs-events').innerText = hs.events + '점';
            document.getElementById('rank-events').innerText = getRank(hs.events);
            return hs;
        }

        function saveHighScore(mode, newScore) {
            const hs = loadHighScores();
            let isNewRecord = false;
            if (newScore > hs[mode]) {
                hs[mode] = newScore;
                localStorage.setItem('historyMatchHS', JSON.stringify(hs));
                isNewRecord = true;
            }
            return isNewRecord;
        }

        function saveToDex(term) {
            if (!unlockedDex.includes(term)) {
                unlockedDex.push(term);
                localStorage.setItem('historyMatchDex', JSON.stringify(unlockedDex));
            }
        }

        // --- ENCYCLOPEDIA UI ---
        function openEncyclopedia() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('encyclopedia-screen').classList.remove('hidden');
            document.getElementById('encyclopedia-screen').classList.add('flex');
            renderEncyclopedia('figures'); // Default tab
        }

        function closeEncyclopedia() {
            document.getElementById('encyclopedia-screen').classList.add('hidden');
            document.getElementById('encyclopedia-screen').classList.remove('flex');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function renderEncyclopedia(mode) {
            if (mode === 'figures') {
                document.getElementById('tab-figures').className = "flex-1 py-3 text-lg font-bold rounded-lg bg-emerald-100 text-emerald-900 shadow-sm transition";
                document.getElementById('tab-events').className = "flex-1 py-3 text-lg font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition";
            } else {
                document.getElementById('tab-events').className = "flex-1 py-3 text-lg font-bold rounded-lg bg-emerald-100 text-emerald-900 shadow-sm transition";
                document.getElementById('tab-figures').className = "flex-1 py-3 text-lg font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition";
            }

            const listEl = document.getElementById('dex-list');
            listEl.innerHTML = '';
            
            const items = historyData[mode];
            let unlockedCount = 0;

            items.forEach(item => {
                const isUnlocked = unlockedDex.includes(item.term);
                if (isUnlocked) unlockedCount++;

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border-2 flex flex-col gap-3 ${isUnlocked ? 'bg-white border-emerald-300 shadow-md' : 'bg-slate-100 border-slate-200 opacity-60'}`;
                
                if (isUnlocked) {
                    card.innerHTML = `
                        <h4 class="font-black text-2xl ${mode === 'figures' ? 'text-blue-800' : 'text-red-800'}">${item.term}</h4>
                        <p class="text-base text-slate-700 leading-relaxed">${item.desc}</p>
                    `;
                } else {
                    card.innerHTML = `
                        <h4 class="font-black text-2xl text-slate-400 flex items-center gap-2"><span>🔒</span> ???</h4>
                        <p class="text-base text-slate-400">게임을 플레이하며 해금하세요.</p>
                    `;
                }
                listEl.appendChild(card);
            });

            document.getElementById('dex-progress').innerText = `${unlockedCount} / ${items.length}`;
        }

        // --- UTILS ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- GAME LOGIC ---
        function startGame(mode) {
            initAudio();
            currentMode = mode;
            score = 0;
            timeRemaining = 100;
            matchedPairsCount = 0;
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = '준비';
            document.getElementById('current-mode-display').innerText = mode === 'figures' ? '👤 인물' : '⚔️ 사건';
            
            const timerContainer = document.getElementById('timer-container');
            timerContainer.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            timerContainer.classList.add('bg-slate-800', 'text-white');

            availablePool = JSON.parse(JSON.stringify(historyData[mode]));
            shuffle(availablePool);

            startBGM();
            clearInterval(timerInterval);
            clearInterval(previewInterval);
            generateBoard();
        }

        function generateBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            flippedCards = [];
            isLocked = true; // 암기 시간 중 터치 방지
            matchedPairsCount = 0;
            
            // 새 보드가 생성될 때는 타이머를 잠시 멈춤
            clearInterval(timerInterval);
            clearInterval(previewInterval);
            const timerContainer = document.getElementById('timer-container');
            timerContainer.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            timerContainer.classList.add('bg-slate-800', 'text-white');
            document.getElementById('timer').innerText = '기억...';

            if (availablePool.length < pairsPerBoard) {
                let refill = JSON.parse(JSON.stringify(historyData[currentMode]));
                shuffle(refill);
                let currentTerms = availablePool.map(i => i.term);
                refill.forEach(item => {
                    if(!currentTerms.includes(item.term)) availablePool.push(item);
                });
            }

            const currentPairs = availablePool.splice(0, pairsPerBoard);
            let cards = [];

            currentPairs.forEach(item => {
                cards.push({ id: item.term, type: 'term', text: item.term });
                cards.push({ id: item.term, type: 'desc', text: item.desc });
            });

            shuffle(cards);

            let cardIndex = 0;
            const cardElementsForPreview = [];

            for (let i = 0; i < 25; i++) {
                // 중앙 타일 (인덱스 12) 초기에는 5 카운트다운 표시
                if (i === 12) {
                    const flagCell = document.createElement('div');
                    flagCell.className = 'w-full h-full min-h-0 min-w-0 bg-white rounded-xl shadow-inner border-[3px] border-slate-200 flex items-center justify-center pointer-events-none p-2 sm:p-3 opacity-95 transition-all';
                    flagCell.id = 'center-tile';
                    flagCell.innerHTML = `<span id="center-countdown" class="text-6xl sm:text-8xl md:text-9xl font-black text-indigo-600 drop-shadow-md">5</span>`;
                    board.appendChild(flagCell);
                    continue;
                }

                const card = cards[cardIndex];
                cardIndex++;

                const cardEl = document.createElement('div');
                cardEl.className = 'card relative w-full h-full min-h-0 min-w-0 cursor-pointer perspective-1000 flipped';
                cardEl.dataset.id = card.id;
                cardEl.dataset.type = card.type;

                const backColor = card.type === 'term' ? 'bg-pink-400 border-pink-300' : 'bg-blue-500 border-blue-400';
                const backTextColor = card.type === 'term' ? 'text-pink-100' : 'text-blue-100';
                
                const frontColor = card.type === 'term' ? 'bg-pink-50 border-pink-300' : 'bg-blue-50 border-blue-300';
                const textColor = card.type === 'term' ? 'text-pink-900 font-black card-content-term' : 'text-blue-900 font-bold card-content-desc';

                cardEl.innerHTML = `
                    <div class="card-inner absolute inset-0 transform-style-3d shadow-md hover:shadow-lg rounded-xl">
                        <!-- Back -->
                        <div class="absolute inset-0 backface-hidden ${backColor} rounded-xl border-4 flex items-center justify-center">
                            <span class="${backTextColor} text-3xl sm:text-5xl opacity-80 font-black">?</span>
                        </div>
                        <!-- Front -->
                        <div class="absolute inset-0 backface-hidden rotate-y-180 ${frontColor} border-[3px] rounded-xl flex items-center justify-center text-center overflow-hidden p-1 sm:p-2">
                            <div class="w-full max-h-full overflow-y-auto no-scrollbar flex items-center justify-center">
                                <span class="${textColor}">${card.text}</span>
                            </div>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl));
                board.appendChild(cardEl);
                cardElementsForPreview.push(cardEl);
            }

            // 5초 암기 및 중앙 타일 카운트다운 로직
            let pTime = 5;
            playSound('countdown'); // 5 
            
            previewInterval = setInterval(() => {
                pTime--;
                if (pTime > 0) {
                    const countEl = document.getElementById('center-countdown');
                    if (countEl) {
                        countEl.innerText = pTime;
                        // 숫자 바뀔 때마다 살짝 크기가 커졌다 작아지는 애니메이션 
                        countEl.classList.remove('scale-110');
                        void countEl.offsetWidth; 
                        countEl.classList.add('scale-110', 'transition-transform');
                    }
                    playSound('countdown');
                } else {
                    clearInterval(previewInterval);
                    
                    // 카운트다운 종료 시 태극기 SVG로 교체
                    const centerTile = document.getElementById('center-tile');
                    if (centerTile) {
                        centerTile.innerHTML = `<img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Flag_of_South_Korea.svg" alt="태극기" class="w-full h-full object-contain filter drop-shadow-sm" />`;
                    }
                    
                    playSound('match'); // 게임 시작 알림음 (경쾌하게)
                    
                    cardElementsForPreview.forEach(card => card.classList.remove('flipped'));
                    isLocked = false;
                    document.getElementById('timer').innerText = timeRemaining;

                    // 메인 타이머 재개
                    timerInterval = setInterval(() => {
                        timeRemaining--;
                        document.getElementById('timer').innerText = timeRemaining;
                        
                        if (timeRemaining <= 15 && timeRemaining > 0) {
                            const tContainer = document.getElementById('timer-container');
                            tContainer.classList.remove('bg-slate-800', 'text-white');
                            tContainer.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
                            playSound('beep');
                        }

                        if (timeRemaining <= 0) endGame();
                    }, 1000);
                }
            }, 1000);
        }

        function handleCardClick(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                isLocked = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];

            if ((card1.dataset.id === card2.dataset.id) && (card1.dataset.type !== card2.dataset.type)) {
                playSound('match');
                score++;
                document.getElementById('score').innerText = score;
                
                saveToDex(card1.dataset.id);
                
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                setTimeout(() => {
                    card1.querySelector('.card-inner > div:nth-child(2)').classList.add('bg-green-100', 'border-green-500');
                    card2.querySelector('.card-inner > div:nth-child(2)').classList.add('bg-green-100', 'border-green-500');
                    card1.style.opacity = '0.4';
                    card2.style.opacity = '0.4';
                }, 150);

                matchedPairsCount++;
                resetTurn();

                if (matchedPairsCount === pairsPerBoard) {
                    setTimeout(() => generateBoard(), 600);
                }
            } else {
                playSound('mismatch');
                card1.querySelector('.card-inner > div:nth-child(2)').classList.add('border-red-500', 'bg-red-50');
                card2.querySelector('.card-inner > div:nth-child(2)').classList.add('border-red-500', 'bg-red-50');

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.querySelector('.card-inner > div:nth-child(2)').classList.remove('border-red-500', 'bg-red-50');
                    card2.querySelector('.card-inner > div:nth-child(2)').classList.remove('border-red-500', 'bg-red-50');
                    resetTurn();
                }, 750);
            }
        }

        function resetTurn() {
            flippedCards = [];
            isLocked = false;
        }

        function endGame() {
            clearInterval(timerInterval);
            clearInterval(previewInterval);
            stopBGM();
            playSound('over');
            
            const timerContainer = document.getElementById('timer-container');
            timerContainer.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            timerContainer.classList.add('bg-slate-800', 'text-white');

            document.getElementById('final-score').innerText = score;
            const rank = getRank(score);
            document.getElementById('final-rank').innerText = rank;
            
            const isNewRecord = saveHighScore(currentMode, score);
            const newRecordEl = document.getElementById('new-record');
            if (isNewRecord) {
                newRecordEl.classList.remove('hidden');
            } else {
                newRecordEl.classList.add('hidden');
            }

            document.getElementById('result-screen').classList.remove('hidden');
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            clearInterval(previewInterval);
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('menu-screen').classList.remove('hidden');
            loadHighScores();
        }

        window.onload = () => {
            loadHighScores();
        };

    </script>
</body>
</html>
