<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>캐치! 초성퀴즈 시한폭탄 에디션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 캐주얼하고 귀여운 폰트 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            margin: 0;
            overflow: hidden; 
            background-color: #87CEEB; /* 맑은 하늘색 */
        }

        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* 둥글고 귀여운 게임 보드 스타일 */
        .game-board {
            background-color: #ffffff;
            border-radius: 2rem;
            position: relative;
        }

        /* 텍스트 외곽선 (가독성 향상) */
        .text-outline {
            text-shadow: 
                -2px -2px 0 #1f2937,  
                 2px -2px 0 #1f2937,
                -2px  2px 0 #1f2937,
                 2px  2px 0 #1f2937;
        }

        /* 버튼 등 팝업 애니메이션 */
        .pop-anim {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 오답 시 폭탄(보드) 흔들림 애니메이션 */
        .shake-anim {
            animation: shake 0.4s ease-in-out both;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-10px) rotate(-2deg); }
            40% { transform: translateX(10px) rotate(2deg); }
            60% { transform: translateX(-10px) rotate(-2deg); }
            80% { transform: translateX(10px) rotate(2deg); }
        }

        .overlay {
            background: rgba(31, 41, 55, 0.85);
            backdrop-filter: blur(6px);
        }

        input:focus { outline: none; }
        
        /* 불꽃 이모지 깜빡임 및 흔들림 효과 */
        .fire-blink {
            animation: fire-flicker 0.3s infinite alternate;
            filter: drop-shadow(0 0 10px #ef4444);
        }
        @keyframes fire-flicker {
            0% { transform: translate(-50%, -50%) scale(0.9) rotate(-10deg); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; filter: drop-shadow(0 0 15px #f97316); }
        }

        /* 정답 텍스트 부드럽게 나타나고 확! 사라지는 효과 */
        #feedback-wrapper {
            position: fixed;
            inset: 0;
            display: none; /* 평소엔 완전 숨김 */
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 100;
        }

        .show-correct-text {
            animation: popAndFade 1.2s forwards;
        }
        @keyframes popAndFade {
            0% { transform: scale(0.5); opacity: 0; }
            15% { transform: scale(1.3) rotate(-5deg); opacity: 1; }
            30% { transform: scale(1) rotate(0deg); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        /* 카테고리 버튼 CSS */
        .cat-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            font-weight: bold;
            border: 3px solid #111827;
            transition: all 0.2s;
            cursor: pointer;
        }
        .cat-btn.active {
            background-color: #fde047; /* yellow-300 */
            color: #111827;
            box-shadow: 0 4px 0 #111827;
        }
        .cat-btn.inactive {
            background-color: #9ca3af; /* gray-400 */
            color: #374151; /* gray-700 */
            transform: translateY(4px);
            box-shadow: 0 0px 0 #111827;
        }
    </style>

        // 한글 초성 추출 함수
        function getChosung(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for(let i=0; i<str.length; i++) {
                let code = str.charCodeAt(i) - 44032;
                if(code > -1 && code < 11172) result += cho[Math.floor(code/588)];
                else result += str.charAt(i);
            }
            return result;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        // 귀여운 펜타토닉 루프 BGM
        function startBGM() {
            if (bgmInterval) return; 
            const melody = [
                { f: 523.25, d: 0.2 }, { f: 587.33, d: 0.2 }, { f: 659.25, d: 0.4 }, 
                { f: 523.25, d: 0.2 }, { f: 783.99, d: 0.2 }, { f: 659.25, d: 0.4 },
                { f: 440.00, d: 0.2 }, { f: 523.25, d: 0.2 }, { f: 587.33, d: 0.4 },
                { f: 392.00, d: 0.2 }, { f: 440.00, d: 0.2 }, { f: 523.25, d: 0.4 }
            ];
            let step = 0;
            function playNextNote() {
                if(!audioCtx) return;
                let note = melody[step];
                playTone(note.f, 'sine', note.d, 0.05); // BGM 볼륨 매우 작게
                step = (step + 1) % melody.length;
                bgmInterval = setTimeout(playNextNote, note.d * 1000);
            }
            playNextNote();
        }

        function stopBGM() {
            if (bgmInterval) {
                clearTimeout(bgmInterval);
                bgmInterval = null;
            }
        }

        // 신시사이저 (음수 방지 및 호환성 강화)
        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 음원 시작 볼륨
                gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
                // 모바일 브라우저 틱 노이즈 방지용 부드러운 페이드아웃
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

            clearInterval(timerInterval);

            elFireEmoji.style.display = 'block'; // 불꽃 보이기

            timerInterval = setInterval(() => {
                if(isWaiting) return;

                timeLeft -= 0.1; 
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongOrTimeout();
                }
            }, 100);
        }

        function updateTimerUI() {
            const percentage = Math.max(0, timeLeft / TIME_LIMIT);
            // 전체 바 너비에서 심지와 불꽃의 위치를 퍼센트로 계산 (가로 선형태)
            elFuseBar.style.width = `calc(${percentage * 100}% - 3rem)`;
            
            // 불꽃 위치 이동
            elFireEmoji.style.left = `calc(${percentage * 100}% - 0.5rem)`;
        }

        function nextQuestion() {
            if (unusedWords.length === 0) {
                // 리필 시 최근 출제된 단어는 제외하여 중복 방지
                unusedWords = activeWordData.filter(w => !recentWords.includes(w.word));
                
                // 혹시라도 필터링 후 남은 단어가 없으면 전체를 다시 채움
                if (unusedWords.length === 0) unusedWords = [...activeWordData];
            }
            
            const randomIndex = Math.floor(Math.random() * unusedWords.length);
            currentQuestion = unusedWords.splice(randomIndex, 1)[0];
            
            // 최근 출제 단어 큐 업데이트
            recentWords.push(currentQuestion.word);
            
            // 보유 단어량에 따라 제한치 조절 (무한 루프 방지)
            const currentLimit = Math.min(RECENT_LIMIT, Math.floor(activeWordData.length * 0.5));
            if (recentWords.length > currentLimit) {
                recentWords.shift();
            }
            
            elCategory.innerText = `[ ${currentQuestion.category} ]`;
            elChosung.innerText = getChosung(currentQuestion.word);
            elInput.value = '';
            elInput.disabled = false;
            elInput.focus();
            
            startTimer();

        function checkAnswer() {
            if(isWaiting) return;

            const userAnswer = elInput.value.trim();
            if (!userAnswer || lives <= 0) return;

            // 완성된 한글 단어인지 검사 (초성만 치거나, 'ㄱㅂ' 같은 자음/모음 단독 입력 차단)
            const isCompleteHangul = /^[가-힣]+$/.test(userAnswer);
            if (!isCompleteHangul) {
                elInput.classList.add('shake-anim', 'border-red-500', 'text-red-500');
                setTimeout(() => elInput.classList.remove('shake-anim', 'border-red-500', 'text-red-500'), 400);
                elInput.value = '';
                elInput.placeholder = "완성된 단어만 입력하세요!";
                setTimeout(() => elInput.placeholder = "정답 입력", 1500);
                return;
            }

            // 핵심 로직: 사용자가 입력한 단어의 초성과 출제된 단어의 초성을 비교
            const targetChosung = getChosung(currentQuestion.word);
            const userChosung = getChosung(userAnswer);

            let isCorrect = false;

            if (userChosung === targetChosung) {
                // 입력한 단어가 현재 활성화된 데이터베이스에 있는지 확인
                const foundWord = activeWordData.find(w => w.word === userAnswer);
                
                if (userAnswer === currentQuestion.word) {
                    isCorrect = true; // 원래 정답과 완벽히 일치
                } else if (foundWord) {
                    // 카테고리가 완벽히 일치하는 경우
                    if (foundWord.category === currentQuestion.category) {
                        isCorrect = true;
                    } 
                    // 융통성: '음식' 카테고리일 때 '식물/과일'도 음식으로 인정
                    else if (currentQuestion.category === "음식" && foundWord.category === "식물/과일") {
                        isCorrect = true;
                    }
                    else if (currentQuestion.category === "식물/과일" && foundWord.category === "음식") {
                        isCorrect = true;
                    }
                }
            }

            if (isCorrect) {
                // 정답 처리
                playCorrectSound();
                combo++;
                score += 10 + (combo * 2); 
                
                // 사용자가 입력한 단어로 피드백 텍스트 교체 
                elFeedbackText.innerHTML = `${userAnswer}<br><span class="text-5xl md:text-6xl text-yellow-300 text-outline drop-shadow-md">정답!</span>`;

                // 잔상 없는 완벽한 정답 텍스트 애니메이션 
                clearTimeout(feedbackTimeout);
                elFeedbackWrapper.style.display = 'flex'; // 화면에 래퍼 띄우기
                elFeedbackText.classList.remove('show-correct-text');
                void elFeedbackText.offsetWidth; // 리플로우 강제 (애니메이션 초기화)
                elFeedbackText.classList.add('show-correct-text');
                
                // 애니메이션이 끝난 직후(1.2초) 확실하게 숨김 처리
                feedbackTimeout = setTimeout(() => {
                    elFeedbackWrapper.style.display = 'none';
                }, 1200);
                
                if (score > maxScore) { maxScore = score; localStorage.setItem('casual_max_score', maxScore); elMaxScore.innerText = maxScore; }
                if (combo > maxCombo) { maxCombo = combo; localStorage.setItem('casual_max_combo', maxCombo); elMaxCombo.innerText = maxCombo; }

                updateUI();
                nextQuestion();
            } else {
                handleWrongOrTimeout();
            }
        }

        function getRank(finalScore) {
            if (finalScore >= 2000) return { title: "전설의 초성왕", emoji: "👑" };
            if (finalScore >= 1500) return { title: "초성 신", emoji: "👼" };
            if (finalScore >= 1000) return { title: "초성 달인", emoji: "🦸‍♂️" };
            if (finalScore >= 700) return { title: "초성 장인", emoji: "🧙‍♂️" };
            if (finalScore >= 400) return { title: "전교 1등", emoji: "🥇" };
            if (finalScore >= 250) return { title: "우리반 에이스", emoji: "🤓" };
            if (finalScore >= 150) return { title: "초성 마니아", emoji: "😎" };
            if (finalScore >= 80) return { title: "퀴즈 새싹", emoji: "🌱" };
            if (finalScore >= 40) return { title: "동네 골목대장", emoji: "👦" };
            return { title: "초보 탐험가", emoji: "👶" };
        }

        function gameOver() {
            stopBGM(); 
            const rank = getRank(score);
            document.getElementById('final-rank-emoji').innerText = rank.emoji;
            document.getElementById('final-rank-title').innerText = rank.title;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-combo').innerText = combo;
            
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('flex');
            elInput.blur();
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio(); 
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            // 다시 하기를 누르면 세팅 화면으로 이동
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('start-screen').classList.add('flex');
        });

        elSubmitBtn.addEventListener('click', checkAnswer);
        
        elInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        elMaxScore.innerText = maxScore;
        elMaxCombo.innerText = maxCombo;

    </script>
</body>
</html>
